# Own-words summaries for screen records that had none (Nov 2026 rework). year fills release_date when empty.
10-cloverfield-lane: {year: '2016', summary: "Dan Trachtenberg's thriller in which a young woman wakes after a car crash in the underground bunker of a survivalist who insists the air outside has been poisoned by an attack, and she cannot tell whether he is her rescuer or her captor."}
a-nightmare-on-elm-street: {year: '1984', summary: "Wes Craven's horror film in which the burned killer Freddy Krueger stalks a group of suburban teenagers through their dreams, so that falling asleep becomes deadly."}
adaalat-the-flight-assassinator: {summary: "An episode of the Indian courtroom drama Adaalat (Sony Entertainment Television) built around a mid-air threat on a passenger flight."}
blazing-saddles: {year: '1974', summary: "Mel Brooks's Western spoof in which a Black sheriff is sent to a bigoted frontier town as part of a land-grab scheme and wins it over with the help of a washed-up gunslinger."}
carol-for-another-christmas: {year: '1964', summary: "Rod Serling's anti-isolationist reworking of A Christmas Carol for ABC, directed by Joseph L. Mankiewicz and made for the United Nations, in which a wealthy man who wants America to turn its back on the world is visited by three ghosts. Sterling Hayden, Peter Sellers and Eva Marie Saint star."}
childs-play: {year: '1988', summary: "Tom Holland's horror film in which a dying serial killer transfers his soul into a talking 'Good Guy' doll that ends up in the bedroom of a six-year-old boy."}
christine: {year: '1983', summary: "John Carpenter's film of Stephen King's novel about a shy teenager who restores a 1958 Plymouth Fury that turns out to be possessed and jealous."}
clockstoppers: {year: '2002', summary: "A Nickelodeon family adventure in which a teenager finds a wristwatch that speeds him up so much that the rest of the world seems to stand still."}
cube: {year: '1997', summary: "Vincenzo Natali's Canadian thriller in which strangers wake up in a maze of identical booby-trapped cubic rooms with no memory of how they got there."}
dead-silence: {year: '2007', summary: "James Wan's horror film about a widower who traces his wife's murder to the ghost of a ventriloquist and her collection of dummies."}
donnie-darko: {year: '2001', summary: "Richard Kelly's film about a troubled teenager who survives a falling jet engine and is told by a figure in a rabbit suit that the world will end in 28 days; its ending reframes what came before."}
edge-of-tomorrow: {summary: "Doug Liman's science fiction film in which an untested officer killed in an alien invasion wakes up to relive the same day of battle every time he dies."}
final-destination: {year: '2000', summary: "A teenager's premonition gets him and some classmates off a plane moments before it explodes, and death then comes back for the survivors one by one."}
for-all-time: {year: '2000', summary: "A CBS television film in which a tired businessman steps off a commuter train into a small town in 1896 and falls in love there."}
get-out: {year: '2017', summary: "Jordan Peele's horror film about a young Black man whose weekend with his white girlfriend's family uncovers a plot to transplant wealthy white people's minds into Black bodies."}
in-the-mouth-of-madness: {year: '1994', summary: "John Carpenter's horror film in which an insurance investigator searching for a vanished horror novelist finds the writer's fiction becoming reality."}
jacobs-ladder: {year: '1990', summary: "Adrian Lyne's psychological thriller about a Vietnam veteran in New York whose life breaks up into hallucinations, until the film reveals what has really been happening to him."}
johnny-bravo-johnny-real-good: {summary: "A Johnny Bravo cartoon episode with a spoof of the all-powerful boy from \"It's a Good Life\"."}
johnny-bravo-little-talky-tabitha: {summary: "A Johnny Bravo cartoon episode whose talking doll spoofs Talky Tina from \"Living Doll\"."}
johnny-bravo-the-man-who-cried-clown: {summary: "A Johnny Bravo cartoon episode in which Johnny alone sees a creature on the wing of his plane, spoofing \"Nightmare at 20,000 Feet\"."}
key-peele-airplane-continental: {summary: "A Key & Peele sketch set aboard a passenger airliner."}
liar-liar: {year: '1997', summary: "Jim Carrey plays a habitually dishonest lawyer whose son's birthday wish makes it impossible for him to lie for 24 hours."}
life-size: {year: '2000', summary: "A Disney Channel film in which a grieving girl's spell to revive her mother brings her fashion doll (Tyra Banks) to life instead."}
looper: {year: '2012', summary: "Rian Johnson's thriller about a hit man in 2044 who kills victims sent back from the future, until his own older self arrives."}
madagascar-escape-2-africa: {year: '2008', summary: "DreamWorks' animated sequel in which the zoo animals crash-land in Africa; one airborne scene spoofs the gremlin on the wing."}
magic: {year: '1978', summary: "Richard Attenborough's thriller in which a ventriloquist (Anthony Hopkins) is increasingly controlled by his foul-mouthed dummy."}
meet-joe-black: {year: '1998', summary: "Death takes human form (Brad Pitt) and asks a dying media tycoon (Anthony Hopkins) to show him life in exchange for a few extra days."}
mercy: {year: '2014', summary: "A horror film from Stephen King's story \"Gramma\", in which a boy left alone with his dying grandmother discovers she has made a pact with dark forces."}
midnight-in-paris: {year: '2011', summary: "Woody Allen's comedy about a nostalgic screenwriter who finds that at midnight he can step into the Paris of the 1920s."}
minority-report: {year: '2002', summary: "Steven Spielberg's film of Philip K. Dick's story, in which a police chief who arrests murderers before they act, using visions from three psychics, is himself predicted to kill."}
muppets-tonight-william-shatner-episode: {summary: "A 1996 episode of Muppets Tonight with guest William Shatner, which spoofs his own role in \"Nightmare at 20,000 Feet\"."}
poltergeist: {year: '1982', summary: "Tobe Hooper's ghost story, produced and co-written by Steven Spielberg, in which a suburban family's young daughter is taken into another dimension through the television."}
real-steel: {year: '2011', summary: "A former boxer and his estranged son train a salvaged robot for a future in which boxing is fought by machines. It is credited as based on Richard Matheson's story \"Steel\"."}
ruby-sparks: {year: '2012', summary: "A blocked novelist writes about his ideal girlfriend and wakes to find her living in his house, able to be rewritten by his typewriter."}
sabrina-the-teenage-witch-good-will-haunting: {summary: "An episode of the sitcom Sabrina the Teenage Witch with a talking-doll spoof of \"Living Doll\"."}
saturday-night-live-nightmare-at-20-000-feet-parody-jesse-jackson-episode: {summary: "A Saturday Night Live sketch from the 1984 episode hosted by Jesse Jackson that parodies \"Nightmare at 20,000 Feet\"."}
sharknado-2-the-second-one: {year: '2014', summary: "Syfy's disaster comedy sequel, whose opening scene restages the gremlin on the wing with sharks, with William Shatner's Twilight Zone co-star Robert Hays in the cast."}
signs: {year: '2002', summary: "M. Night Shyamalan's film in which a widowed former priest and his family barricade their Pennsylvania farmhouse as aliens arrive."}
stranger-than-fiction: {year: '2006', summary: "An IRS auditor (Will Ferrell) starts hearing a narrator describe his life and learns he is a character in a novel whose author plans to kill him."}
the-box: {year: '2009', summary: "Richard Kelly's film of Richard Matheson's story \"Button, Button\": a couple is offered a fortune for pressing a button that will kill someone they do not know."}
the-cobbler: {year: '2014', summary: "Thomas McCarthy's comedy in which a New York shoe repairer (Adam Sandler) finds that putting on his customers' shoes turns him into them."}
the-curious-case-of-benjamin-button: {year: '2008', summary: "David Fincher's film, from an F. Scott Fitzgerald story, about a man born old who grows younger as everyone around him ages."}
the-electric-grandmother: {summary: "An NBC television film from Ray Bradbury's story \"I Sing the Body Electric!\", the same story Bradbury wrote for the original series, about a robot grandmother who raises three motherless children."}
the-forgotten: {year: '2004', summary: "A grieving mother (Julianne Moore) is told that the son she lost never existed, as everyone's memories of him disappear."}
the-good-place: {summary: "Michael Schur's NBC comedy about a woman who wakes up in a heavenly afterlife she does not deserve, until the show reveals where she really is."}
the-invisible: {year: '2007', summary: "A teenager left for dead after an assault exists as an unseen spirit and tries to get the living to find his body."}
the-langoliers: {year: '1995', summary: "An ABC miniseries from Stephen King's novella, in which a handful of passengers wake on a red-eye flight to find everyone else gone, the plane having passed through a rip in time."}
the-lego-batman-movie: {year: '2017', summary: "The animated Lego spin-off, in which Batman faces the Joker and a gang of villains from other franchises; one gag spoofs the gremlin on the wing."}
the-man-from-earth: {year: '2007', summary: "From Jerome Bixby's last script: a retiring professor tells his colleagues at a farewell party that he is a 14,000-year-old caveman who has never aged."}
the-mist: {year: '2007', summary: "Frank Darabont's film of Stephen King's novella, in which townspeople trapped in a supermarket by a monster-filled fog turn on each other."}
the-naked-gun-212-the-smell-of-fear: {year: '1991', summary: "The second Naked Gun comedy, in which Frank Drebin foils a plot against a national energy plan; one gag spoofs \"To Serve Man\"."}
the-omen: {year: '1976', summary: "Richard Donner's horror film in which an American diplomat comes to believe his adopted son is the Antichrist."}
the-sixth-sense: {year: '1999', summary: "M. Night Shyamalan's ghost story about a child psychologist (Bruce Willis) treating a boy who sees dead people, famous for its final twist."}
the-stepford-wives: {year: '1975', summary: "Bryan Forbes's film of Ira Levin's novel, in which a newcomer to a Connecticut suburb realizes the local wives are being replaced by compliant robots."}
the-trigger-effect: {year: '1996', summary: "David Koepp's thriller in which a widespread power blackout turns ordinary Los Angeles neighbors against each other."}
the-truman-show: {year: '1998', summary: "Peter Weir's film about a man (Jim Carrey) who slowly discovers that his whole life is a television show broadcast around the clock."}
the-village: {year: '2004', summary: "M. Night Shyamalan's film about a seemingly 19th-century village hemmed in by creatures in the woods, and the truth its elders keep from the young."}
time-lapse: {year: '2014', summary: "Three roommates find a camera that photographs what will happen in front of it 24 hours later, and use it for gain."}
toy-story-4: {summary: "Pixar's fourth Toy Story film, in which Woody meets Gabby Gabby, a 1950s pull-string doll whose silent ventriloquist-dummy henchmen were modeled on classic horror."}
toy-story: {year: '1995', summary: "Pixar's first feature, about a cowboy doll whose place as a boy's favorite toy is threatened by a new space-ranger action figure."}
unknown: {year: '2011', summary: "Liam Neeson plays a scientist who wakes from a coma in Berlin to find that his wife does not recognize him and another man has taken his identity."}
urban-legends-final-cut: {year: '2000', summary: "A slasher sequel set in a film school, with a scene that spoofs \"Nightmare at 20,000 Feet\"."}
us: {year: '2019', summary: "Jordan Peele's horror film in which a family on vacation is attacked by red-clad doubles of themselves who have lived underground."}
vivarium: {year: '2019', summary: "A young couple viewing a house in an endless estate of identical homes cannot find their way out and are left a baby to raise."}
what-women-want: {year: '2000', summary: "Nancy Meyers's comedy in which a chauvinistic advertising executive (Mel Gibson) gains the ability to hear women's thoughts after an accident."}

# Themes (Adam, 2026-11-21): one fixed list, in eight families, for every series, episode, segment and homage.
#
# A theme is our editors' reading of what a story is about, not a fact claimed by its makers, and pages say so.
# How a record gets its themes (src/lib/themes.ts):
#   - Twilight Zone episodes: their `themes:` keywords, mapped through `aliases` below. A keyword with no theme
#     stays a keyword (search still finds it) but is not shown as a theme. Tone and subject keywords such as comedy,
#     satire, baseball or boxing are deliberately left out of themes.
#   - Night Gallery segments and other entries: data/themes-assigned.yaml, written from each record's summary.
#   - Homages: the themes of the Twilight Zone episode they point to ("from the episode it points to").
#   - Series and shows: the most common themes among their episodes, with counts.
# To add a theme: add it here with a one-line definition; to fold a keyword in, add it to `aliases`.
# Slugs are part of the address (/themes/<slug>/): renaming one needs a redirect.

- family: The unknown
  themes:
  - slug: paranoia
    label: Paranoia and suspicion
    desc: Fear of neighbours, strangers or unseen forces, and what it does to people.
    aliases: [paranoia, suspicion, conspiracy, menace, primal fear, fear, the hunt, pursuit, stalking, espionage, strangers, secrets]
  - slug: the-uncanny
    label: Ghosts and the uncanny
    desc: Hauntings, possession, curses, witchcraft and the supernatural intruding on ordinary life.
    aliases: [ghosts, haunting, possession, curse, curses, witchcraft, magic, spirit channeling, folklore, mythology, arthurian legend, vampires, darkness, evil, the unknown, mystery, suspense]
  - slug: monsters
    label: Monsters
    desc: Creatures, gremlins and things in the dark, and who the real monster turns out to be.
    aliases: [monsters, body horror]
  - slug: aliens
    label: Aliens and invasion
    desc: Visitors from elsewhere, first contact and invasion, often as a mirror held up to humanity.
    aliases: [aliens, alien contact, alien invasion, invasion, first contact]
  - slug: other-worlds
    label: Other worlds and realities
    desc: Parallel worlds, other dimensions and realities that turn out not to be what they seem.
    aliases: [other dimensions, parallel world, parallel worlds, reality, perception, perspective, simulation, virtual reality, alternate lives, existence, existentialism, disorientation, disappearance, being lost, metafiction, fiction, curiosity, knowledge, archaeology]
  - slug: space
    label: Space and exploration
    desc: Astronauts, space travel and the frontier, and what explorers find out about themselves.
    aliases: [space, space exploration, space travel, space race, exploration, aviation, flight, air travel]


# How each episode ends, in our own words. Shown only behind the spoiler toggle on episode pages and the twists path.
# Keyed by episode id. Keep to two or three sentences; describe, don't transcribe dialogue.
1959/where-is-everybody: >-
  The empty town is a hallucination. Mike Ferris is an Air Force astronaut candidate who has spent weeks alone in an
  isolation chamber testing whether a man can endure the trip to the Moon, and he finally breaks and presses the panic
  button. As he is carried out, a cinema ticket from the imaginary town turns up in his pocket.
1959/time-enough-at-last: >-
  Henry Bemis survives a nuclear war in a bank vault, finds the public library in ruins but full of books, and sets out
  years of reading by date. Then he stoops, his thick glasses fall and shatter, and he is left almost blind among
  the books he finally has time for.
1959/eye-of-the-beholder: >-
  The treatment fails. When the bandages come off, Janet Tyler has a face that a viewer would call beautiful, and the
  doctors, nurses and state leader turn out to have pig-like faces that are the norm in their society. She is sent to
  a village of people like her, led there by a handsome man from that community.
1959/the-invaders: >-
  The tiny invaders are American astronauts. After she smashes their ship, the camera shows its markings: United
  States Air Force. The woman is a giant on the planet they tried to land on.
1959/the-hitch-hiker: >-
  Nan Adams phones home and learns her mother has collapsed with grief because Nan died in the blowout six days
  earlier. The hitch-hiker is Death, waiting for her to understand, and she finally offers him a ride.
1959/a-stop-at-willoughby: >-
  Gart Williams finally steps off the train into Willoughby. In the real world he has jumped from the moving train
  and died, and the hearse that collects his body belongs to Willoughby and Son Funeral Home.
1959/the-after-hours: >-
  Marsha White is a mannequin. The mannequins take turns living as people for a month at a time, and she enjoyed her
  holiday so much that she forgot to come back. She returns to her place on the floor, and another mannequin takes
  her turn outside.
1959/the-midnight-sun: >-
  Earth is not falling into the sun at all; it is drifting away from it. The heat was Norma's fever dream, and she
  wakes to a freezing, darkening city where the cold is the real catastrophe.
1959/will-the-real-martian-please-stand-up: >-
  After the bus drives off, the passenger Mr Ross reveals a third arm: he is the Martian scout. Then Haley, the diner's
  cook, lifts his cap to show a third eye. He is from Venus, and his people have already intercepted the Martian
  invasion and plan to take Earth themselves.
1959/five-characters-in-search-of-an-exit: >-
  The cylinder is a barrel for collecting Christmas toys, and the five characters are dolls inside it. The major who
  climbed out has simply fallen onto the snow, and a little girl picks him up and drops him back in.
1959/third-from-the-sun: >-
  The families escape on the experimental ship to a distant world they have tracked, and the last line names it: a
  planet third from the sun, called Earth. They were never human in the sense the audience assumed.
1959/people-are-alike-all-over: >-
  The Martians' kindness is real only in a sense. Marcusson's comfortable house is a cage in a Martian zoo, and the
  sign outside it reads "Earth creature in his native habitat."
1959/i-shot-an-arrow-into-the-air: >-
  Corey, the astronaut who killed his crewmates for water, climbs a ridge and finds telephone poles and a road sign
  for Reno. The ship never left Earth; it came down in the Nevada desert.
1959/the-monsters-are-due-on-maple-street: >-
  The neighbours destroy each other in a riot of suspicion. On a hill nearby, two aliens who have been switching the
  lights and cars on and off explain that this is their whole plan: cut the power and let people do the rest.
1959/nightmare-at-20-000-feet: >-
  Bob Wilson takes a sleeping policeman's pistol, opens the emergency door in mid-flight and shoots the gremlin. He is
  carried off the plane in a straitjacket, but the damage to the engine cowling shows he was right.
1959/the-howling-man: >-
  The prisoner is the Devil, kept captive by the staff of truth. David Ellington pities him and lets him out, and the
  century's catastrophes follow. Years later Ellington has caught him again, and his housekeeper, not believing the
  story, unlocks the door.
1959/the-masks: >-
  At midnight the heirs take off their masks, and their faces have set into the grotesque shapes the masks
  exaggerated. Jason Foster dies with his own mask on, and his face underneath is unchanged.
1959/number-12-looks-just-like-you: >-
  Marilyn is taken for the transformation anyway. She comes out as Number 12, identical to her best friend, delighted
  with how she looks and with no memory of why she objected.
1959/mirror-image: >-
  Millicent Barnes is taken away as a mental patient. Paul Grinstead, who dismissed her theory, then sees his own
  double running off with his suitcase and gives chase.
1985/examination-day: >-
  Dickie scores too high. His parents receive a phone call from the government asking whether they want his body
  buried by the state or at a private funeral, because the law limits how intelligent a citizen may be.
1985/button-button: >-
  Norma presses the button, a stranger dies and the couple receive the money. When the man comes to take the box
  back, he says it will now be given to someone they do not know.
1959/to-serve-man: >-
  The Kanamit book is translated at last: To Serve Man is a cookbook. Michael Chambers, already aboard a ship bound
  for their planet, is told too late, and is invited to eat up.
1959/its-a-good-life: >-
  At a birthday party Dan Hollis finally defies Anthony, who turns him into a jack-in-the-box and wishes him into the
  cornfield. Then Anthony makes it snow, which will ruin the crops, and his father agrees that it's a good thing.
1959/the-obsolete-man: >-
  Wordsworth locks the Chancellor in with him and a bomb, and only lets him out when he begs in the name of God. The
  state then declares the Chancellor obsolete for his cowardice, and his own followers tear him down.
1959/walking-distance: >-
  Martin Sloan frightens the boy who is his younger self, who falls from the carousel and hurts his leg; the adult
  Martin now limps. His father tells him that everyone gets only one summer like that, and Martin goes back to the
  present to look forward instead.
1959/kick-the-can: >-
  The residents who play kick the can turn back into children and run away into the night. Ben Conroy, who wouldn't
  join them, is left behind as an old man.
1959/nothing-in-the-dark: >-
  The young policeman she nursed is Mr Death, and he is gentle. Wanda Dunn takes his hand, steps outside and sees her
  own body in bed behind her.
1959/living-doll: >-
  Talky Tina trips Erich on the staircase and he falls to his death. When his wife picks the doll up, Tina tells her
  she had better be nice to her too.
1959/the-lonely: >-
  The relief ship has room only for Corry, so Allenby shoots Alicia, the robot companion Corry loves, to make him
  leave. All that remains on the asteroid is her broken mechanism.
1959/the-odyssey-of-flight-33: >-
  The airliner crosses back through the time barrier once but lands in 1939, not 1961. The crew climbs again to try
  once more, and the episode ends with them still lost in time.
1959/a-game-of-pool: >-
  Jesse Cardiff beats the late Fats Brown, but the prize is the title itself: after his own death, Jesse must answer
  every challenger as the legend, forever.

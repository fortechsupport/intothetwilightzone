films/night-gallery-s1e01:
  summary: 'A Night Gallery hour of two stories: "The Dead Man" (from Fritz Leiber) and "The Housekeeper". In the first,
    a doctor''s experiments in hypnotic suggestion on a willing patient go terribly wrong.'
films/night-gallery-s1e02:
  summary: 'A Night Gallery hour of three stories: "Room with a View" (from Hal Dresner), "The Little Black Bag" (from
    C. M. Kornbluth) and "The Nature of the Enemy". In the first, a bedridden rich man uses his innocent nurse as the
    tool of revenge against his unfaithful wife.'
films/night-gallery-s1e03:
  summary: 'A Night Gallery hour of two stories: "The House" (from André Maurois) and "Certain Shadows on the Wall" (from
    Mary E. Wilkins Freeman). In the first, a woman released from a sanitarium finds the house that has filled her recurring
    dream.'
films/night-gallery-s1e04:
  summary: 'A Night Gallery hour of two stories: "Make Me Laugh" and "Clean Kills and Other Trophies". In the first,
    a comedian who can''t get a laugh is granted a wish by a would-be miracle worker, and learns what he really wanted.'
films/night-gallery-s1e05:
  summary: 'A Night Gallery hour of three stories: "Pamela''s Voice", "Lone Survivor" and "The Doll" (from Algernon Blackwood).
    In the first, a man who killed his nagging wife discovers that death has not quieted her.'
films/night-gallery-s1e06:
  summary: 'A Night Gallery hour of two stories: "They''re Tearing Down Tim Riley''s Bar" and "The Last Laurel" (from
    Davis Grubb). In the first, a lonely, aging salesman clings to memories of the bar where he spent his youth as it
    is about to be demolished. Emmy nominee for Outstanding Single Program (1971). Serling counted it among his best
    work.'
films/night-gallery-s2e01:
  summary: 'A Night Gallery hour of four stories: "The Boy Who Predicted Earthquakes" (from Margaret St. Clair), "Miss
    Lovecraft Sent Me", "The Hand of Borgus Weems" (from George Langelaan) and "Phantom of What Opera?". In the first,
    a boy whose predictions are always right becomes a television sensation, until he foresees something he will not
    reveal.'
films/night-gallery-s2e02:
  summary: 'A Night Gallery hour of four stories: "Death in the Family" (from Miriam Allen deFord), "The Merciful" (from
    Charles L. Sweeney Jr.), "Class of ''99" and "Witches'' Feast". In the first, a fugitive hides in a small-town mortuary
    whose undertaker has made a family of the corpses.'
films/night-gallery-s2e03:
  summary: 'A Night Gallery hour of three stories: "Since Aunt Ada Came to Stay" (from A. E. van Vogt), "With Apologies
    to Mr. Hyde" and "The Flip-Side of Satan" (from Hal Dresner). In the first, a professor comes to believe his wife''s
    elderly aunt is a witch who means to take over his wife''s body.'
films/night-gallery-s2e04:
  summary: 'A Night Gallery hour of four stories: "A Fear of Spiders" (from Elizabeth Walter), "Junior", "Marmalade Wine"
    (from Joan Aiken) and "The Academy" (from David Ely). In the first, a cold food critic who rebuffs his lonely neighbor
    is plagued by a spider that keeps growing.'
films/night-gallery-s2e05:
  summary: 'A Night Gallery hour of two stories: "The Phantom Farmhouse" (from Seabury Quinn) and "Silent Snow, Secret
    Snow" (from Conrad Aiken). In the first, a psychiatrist falls for a mysterious woman from a farmhouse in the woods,
    near where a patient was mauled.'
films/night-gallery-s2e06:
  summary: 'A Night Gallery hour of two stories: "A Question of Fear" (from Bryan Lewis) and "The Devil Is Not Mocked"
    (from Manly Wade Wellman). In the first, a soldier of fortune who claims to fear nothing accepts a bet to spend the
    night in a haunted house.'
films/night-gallery-s2e07:
  summary: 'A Night Gallery hour of two stories: "Midnight Never Ends" and "Brenda" (from Margaret St. Clair). In the
    first, a diner waitress and a hitchhiking Marine feel they have lived the same night many times before.'
films/night-gallery-s2e08:
  summary: 'A Night Gallery hour of four stories: "The Diary", "A Matter of Semantics", "Big Surprise" (from Richard
    Matheson) and "Professor Peabody''s Last Lecture". In the first, a gossip columnist gives a fading actress a diary
    that writes tomorrow''s events in advance.'
films/night-gallery-s2e09:
  summary: 'A Night Gallery hour of four stories: "House – with Ghost" (from August Derleth), "A Midnight Visit to the
    Neighborhood Blood Bank", "Dr. Stringfellow''s Rejuvenator" and "Hell''s Bells" (from Harry Turner). In the first,
    a philandering husband buys an English country house in hopes its ghost will scare off his wife.'
films/night-gallery-s2e10:
  summary: 'A Night Gallery hour of two stories: "The Dark Boy" (from August Derleth) and "Keep in Touch – We''ll Think
    of Something". In the first, a young widow teaching in a frontier town is visited by a silent, pale boy whom nobody
    else can see.'
films/night-gallery-s2e11:
  summary: 'A Night Gallery hour of three stories: "Pickman''s Model" (from H. P. Lovecraft), "The Dear Departed" (from
    Alice-Mary Schnirring) and "An Act of Chivalry". In the first, in turn-of-the-century Boston, a young art student
    is drawn to a painter whose ghouls look too real. Emmy nominee for makeup (1972).'
films/night-gallery-s2e12:
  summary: 'A Night Gallery hour of three stories: "Cool Air" (from H. P. Lovecraft), "Camera Obscura" (from Basil Copper)
    and "Quoth the Raven". In the first, a woman falls in love with a reclusive doctor who must keep his rooms bitterly
    cold.'
films/night-gallery-s2e13:
  summary: 'A Night Gallery hour of two stories: "The Messiah on Mott Street" and "The Painted Mirror" (from Donald Wandrei).
    In the first, on a winter night on New York''s Lower East Side, a dying old man waits for the Messiah to save him
    for his grandson''s sake. Serling''s story owes a debt to Bernard Malamud''s Angel Levine.'
films/night-gallery-s2e14:
  summary: 'A Night Gallery hour of three stories: "The Different Ones", "Tell David…" (from Penelope Wallace) and "Logoda''s
    Heads" (from August Derleth). In the first, in the future, a father sends his deformed son to another planet through
    an exchange program.'
films/night-gallery-s2e15:
  summary: 'A Night Gallery hour of three stories: "Green Fingers" (from R. C. Cook), "The Funeral" (from Richard Matheson)
    and "The Tune in Dan''s Café" (from Shamus Frazier). In the first, a ruthless developer tries to force an elderly
    widow off her land, not realizing anything she plants will grow.'
films/night-gallery-s2e16:
  summary: 'A Night Gallery hour of three stories: "Lindemann''s Catch", "The Late Mr. Peddington" (from Frank Sisk)
    and "A Feast of Blood" (from Dulcie Gray). In the first, a hard-bitten sea captain nets a mermaid and tries to make
    her human, with tragic results.'
films/night-gallery-s2e17:
  summary: 'A Night Gallery hour of two stories: "The Miracle at Camafeo" (from C. B. Gilford) and "The Ghost of Sorworth
    Place" (from Russell Kirk). In the first, an insurance swindler faking paralysis visits a Mexican shrine to stage
    a cure, and is investigated by a skeptical agent.'
films/night-gallery-s2e18:
  summary: 'A Night Gallery hour of two stories: "The Waiting Room" and "Last Rites for a Dead Druid". In the first,
    a wounded gunfighter enters a frontier saloon full of familiar faces and learns why nobody can leave.'
films/night-gallery-s2e19:
  summary: 'A Night Gallery hour of three stories: "Deliveries in the Rear", "Stop Killing Me" (from Hal Dresner) and
    "Dead Weight" (from Jeffry Scott). In the first, a Victorian surgeon who buys cadavers without questions learns where
    his latest supply came from.'
films/night-gallery-s2e20:
  summary: 'A Night Gallery hour of two stories: "I''ll Never Leave You – Ever" (from Rene Morris) and "There Aren''t
    Any More MacBanes" (from Stephen Hall). In the first, a wife in rural Cornwall consults a witch to be rid of her
    invalid husband, whose spirit stays with her.'
films/night-gallery-s2e21:
  summary: 'A Night Gallery hour of two stories: "The Sins of the Fathers" (from Christianna Brand) and "You Can''t Get
    Help Like That Anymore". In the first, in famine-stricken Wales, a starving widow sends her son to perform the ritual
    of sin-eating at a wealthy man''s wake.'
films/night-gallery-s2e22:
  summary: 'A Night Gallery hour of three stories: "The Caterpillar" (from Oscar Cook), "Little Girl Lost" (from E. C.
    Tubb) and "Satisfaction Guaranteed". In the first, in colonial Borneo, a man covets a colleague''s wife and pays
    to have an earwig placed in the husband''s ear.'
films/night-gallery-s3e01:
  summary: A Night Gallery episode built around a single story, "The Return of the Sorcerer" (from Clark Ashton Smith).
    A translator hired by a sorcerer to decipher an Arabic text uncovers what happened to the sorcerer's twin brother.
films/night-gallery-s3e02:
  summary: A Night Gallery episode built around a single story, "The Girl with the Hungry Eyes" (from Fritz Leiber).
    A struggling photographer makes an unknown model famous and finds she feeds on the men who desire her.
films/night-gallery-s3e03:
  summary: A Night Gallery episode built around a single story, "Rare Objects". A hunted mobster accepts a mysterious
    doctor's offer of perfect safety and joins his collection.
films/night-gallery-s3e04:
  summary: A Night Gallery episode built around a single story, "Spectre in Tap-Shoes". After her twin sister's suicide,
    a woman is haunted by the sound of tap shoes; Sandra Dee plays both sisters. Story by Jack Laird.
films/night-gallery-s3e05:
  summary: 'A Night Gallery hour of two stories: "You Can Come Up Now, Mrs. Millikan" (from J. Wesley Rosenquist) and
    "Smile, Please". In the first, a failed inventor finally succeeds in creating a formula for bringing the dead back
    to life, with a little help from his wife.'
films/night-gallery-s3e06:
  summary: A Night Gallery episode built around a single story, "The Other Way Out". A man who murdered a young woman
    is blackmailed and lured to a desert shack by an old man with his own justice in mind. Story by Kurt van Elting.
films/night-gallery-s3e07:
  summary: A Night Gallery episode built around a single story, "Fright Night". A writer and his wife inherit a farmhouse
    with the condition that they guard a locked trunk. Story by Kurt van Elting.
films/night-gallery-s3e08:
  summary: A Night Gallery episode built around a single story, "Finnegan's Flight". A convict who longs to fly lets
    a fellow prisoner hypnotize him, with consequences neither can stop.
films/night-gallery-s3e09:
  summary: A Night Gallery episode built around a single story, "She'll Be Company for You" (from Andrea Newman). A widower
    relieved by his invalid wife's death is unsettled by the cat a friend gives him for company.
films/night-gallery-s3e10:
  summary: A Night Gallery episode built around a single story, "The Ring with the Red Velvet Ropes" (from Edward D.
    Hoch). A new heavyweight champion wakes in a strange mansion where he must fight a mysterious opponent for the real
    title.
films/night-gallery-s3e11:
  summary: A Night Gallery episode built around a single story, "Something in the Woodwork" (from R. Chetwynd-Hayes).
    A lonely, drinking divorcée befriends the ghost haunting her attic and asks it to help punish her ex-husband.
films/night-gallery-s3e12:
  summary: A Night Gallery episode built around a single story, "Death on a Barge" (from Everil Worrell). A young man
    falls for a beautiful girl who lives on a barge and never comes out by day. Leonard Nimoy's first job as a director.
films/night-gallery-s3e13:
  summary: A Night Gallery episode built around a single story, "Whisper" (from Martin Waddell). A young wife who hears
    the voices of the dead begins to be taken over by them.
films/night-gallery-s3e14:
  summary: A Night Gallery episode built around a single story, "The Doll of Death" (from Vivian Meik). A jilted man
    in the Caribbean uses voodoo to take revenge on the rival who stole his bride.
films/night-gallery-s3e15:
  summary: 'A Night Gallery hour of two stories: "Hatred unto Death" and "How to Cure the Common Vampire". In the first,
    an anthropologist captures a gorilla in Africa that seems to hate him personally.'
films/ace-ventura-when-nature-calls:
  summary: Jim Carrey's 1995 comedy sequel, listed because the Wikipedia article on "Nightmare at 20,000 Feet" names
    it among the films that reference the episode. The nature of the reference has not been checked against the film
    itself.
  research_confidence: low
  relevance: tangential
films/black-mirror-uss-callister:
  summary: A 2017 Black Mirror episode in which a bitter programmer traps digital copies of his coworkers inside a starship
    game where he has absolute power. The Wikipedia article on "It's a Good Life" lists it among later works echoing
    Anthony Fremont's rule over a captive world.
  relevance: tangential
radio/twilight-zone-radio-dramas-series:
  description: 'Full-cast audio remakes of the original 1959-64 teleplays, produced and directed by Carl Amari for Falcon
    Picture Group under license from CBS and the Rod Serling estate, with sound work by JoBe Cerny in Chicago. Stacy
    Keach takes over Serling''s narrations and each story stars a different film or TV actor. 176 episodes were made
    from 2002 to 2012: 155 of the 156 TV episodes (all but "Come Wander with Me"), "The Time Element", unmade TV scripts
    such as Charles Beaumont''s "Gentlemen, Be Seated" and Jerry Sohl''s "Who Am I?", and, from volume 16, sixteen stories
    written for radio. It aired on about 200 US stations, XM and Sirius satellite radio and BBC Radio 4 Extra, and came
    out on cassette, CD volumes of ten (to volume 13 in 2008) and downloads. 82 of the adaptations were included as extras
    on the 2010-11 Blu-ray sets of the original series.'
  sources:
  - title: The Twilight Zone (radio series) - Wikipedia mirror
    url: https://en.wikipedia.org/wiki/The_Twilight_Zone_(radio_series)
  - title: 'The Twilight Zone Vortex: A Dimension of Sound (2017)'
    url: https://twilightzonevortex.blogspot.com/2017/03/a-dimension-of-sound.html
  - title: Moviefone (TMDB data) - The Twilight Zone specials list
    url: https://www.moviefone.com/tv-shows/the-twilight-zone/nnUg8MxfZnesGDhxVstb21/seasons/0/

films/the-twilight-zone-60th-remembering-rod-serling:
  summary: A short retrospective documentary made for the series' 60th anniversary about Rod Serling's life, from his
    Syracuse childhood and World War II service to his use of science fiction to take on race, paranoia and bigotry.
    It screened before six classic episodes ("Walking Distance", "Time Enough at Last", "The Monsters Are Due on Maple
    Street", "Eye of the Beholder", "The Invaders" and "To Serve Man") at a one-night Fathom Events and CBS Home Entertainment
    cinema event on November 14, 2019. Producer Bill D'Elia is among those interviewed.
  release_date: '2019-11-14'
  sources:
  - title: 'SYFY Wire: Exclusive clip from the Rod Serling documentary for the 60th anniversary screenings'
    url: https://syfy.com/syfywire/rod-serling-twilight-zone-documentary
  last_verified: '2026-11-20'

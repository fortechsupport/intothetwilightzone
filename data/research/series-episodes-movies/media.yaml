# Media links gathered by the series/episodes/movies research pass (2026-11-20).
# Keys are record paths under src/content (without .yaml). scripts/research/apply_media.py merges them.
_tva_gcj: &gcj
  type: interview
  subtype: oral-history
  host: Television Academy Foundation (The Interviews)
  rights: licensed
  date: '2003-09-16'
_tva_hamner: &hamner
  type: interview
  subtype: oral-history
  host: Television Academy Foundation (The Interviews)
  rights: licensed
  date: '2003-09-18'
series/1959:
  - type: interview
    title: Rod Serling interviewed by Mike Wallace, The Mike Wallace Interview (ABC)
    url: https://www.youtube.com/watch?v=VQlqjONEsKQ
    host: YouTube (uploaded copy; original kinescope at the Harry Ransom Center, University of Texas)
    date: '1959-09-22'
    rights: link-only
    note: Recorded days before the premiere. Serling talks about sponsors, censorship and why he moved to fantasy.
  - type: interview
    title: Rod Serling interviewed by Binny Lum in Melbourne (Blank on Blank)
    url: https://blankonblank.org/interviews/rod-serling-twlight-zone-science-fiction-kamikazes/
    host: Blank on Blank (PBS Digital Studios), tape from the National Film and Sound Archive of Australia
    date: '1963'
    rights: licensed
    note: Serling on the show as imaginative storytelling and on wanting to go back in time. Full audio on SoundCloud from the page.
  - <<: *gcj
    title: George Clayton Johnson interview, 15 Twilight Zone clips
    url: https://interviews.televisionacademy.com/interviews/george-clayton-johnson
    note: Interviewed by Gary Rutkowski. Clips on meeting Serling, Buck Houghton, and each episode he wrote.
  - <<: *hamner
    title: Earl Hamner, Jr. interview, clips on his Twilight Zone teleplays
    url: https://interviews.televisionacademy.com/interviews/earl-hamner-jr
    note: Interviewed by Jennifer Howard. One clip per episode he wrote, plus working with Serling.
  - type: website
    title: The Twilight Zone show page, Television Academy Foundation interviews
    url: https://interviews.televisionacademy.com/shows/twilight-zone-the
    host: Television Academy Foundation
    rights: licensed
    note: Index of every oral-history clip that discusses the original series.

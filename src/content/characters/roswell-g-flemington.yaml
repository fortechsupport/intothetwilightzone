description: >-
  A blustering owner of a model-ship company who fills his home with recordings of naval battles and bellowed orders.
  After his wife walks out, every faint sound, from a dripping tap to a ticking clock, hits him like an explosion.
  A psychiatrist convinces him the problem is in his mind, and he then begins to lose his hearing altogether, unable
  to hear even his own voice.

description: >-
  A meek, nearsighted bank teller whose wife and boss forbid him from reading. Reading in the bank vault on his
  lunch hour, he survives a nuclear war, and alone among the ruins he finds the public library and all the time
  in the world, only to break his thick glasses on the library steps. His cry of "It's not fair" made him the most
  famous figure in the series.

description: >-
  A gentle sidewalk pitchman who sells ties and gadgets to the neighborhood children. Told by Mr. Death that his
  time is up, he talks his way into a reprieve, then gives the pitch of his life to distract Death and save a little
  girl, knowingly trading his own life for hers. He is one of the series' most beloved early protagonists.

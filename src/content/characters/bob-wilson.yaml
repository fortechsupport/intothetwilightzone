description: >-
  A salesman who has just come out of a sanatorium after a breakdown, flying home with his wife. In a storm he sees
  a gremlin on the wing tearing at the engine, but no one else can see it. He takes a gun from a policeman and shoots
  the creature, and he is taken away in a straitjacket, while the damaged wing proves he was right.

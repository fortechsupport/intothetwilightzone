description: >-
  A schoolteacher who meets a solemn little girl on her stairs and, through her, recovers the repressed memory of
  seeing her mother murdered when she was a child. The killer has come back for her, and the girl is her own younger
  self. The name was reused for Kathleen Quinlan's teacher in Twilight Zone: The Movie as a tribute to Serling's
  teacher Helen Foley.

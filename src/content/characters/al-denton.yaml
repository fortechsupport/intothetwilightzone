description: >-
  A once-feared gunfighter who has become the town drunk, mocked by the saloon crowd after he lost his nerve years
  earlier. A potion from the mysterious salesman Henry J. Fate restores his speed, and in a final duel both he and
  his young challenger are wounded in the hand, freeing them from ever fighting again. Duryea's broken, sympathetic
  Denton anchors one of the show's few westerns.

description: >-
  The pilot of the B-25 bomber King Nine, who wakes beside the wreck in the African desert in 1943 and cannot find
  his crew. He wakes again in a 1960 hospital, where doctors call it guilt-driven delusion, until sand is found
  in his shoes. The episode was inspired by the real discovery of the lost bomber Lady Be Good.

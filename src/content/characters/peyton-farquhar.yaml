description: >-
  A Southern civilian sentenced to hang from a railroad bridge by Union soldiers during the Civil War. The rope
  breaks and he escapes through the river and the woods to his home and his wife, but as he reaches her the rope
  snaps tight; the escape was in his mind in the moment before death. The episode was the French short film by Robert
  Enrico, adapted from Ambrose Bierce's story, the only outside production the series aired.

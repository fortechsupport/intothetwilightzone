description: >-
  A grumpy janitor in 1890 who tries on his employer's time-travel helmet and lands in the noisy, expensive Harrington,
  New Jersey, of 1962. Disillusioned with the future, he happily returns to his own time. Buster Keaton's role is
  played largely as a silent comedy, with the 1890 scenes shot in silent-film style.

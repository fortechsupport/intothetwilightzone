description: >-
  The 1989 revival's version of the young pool shark from George Clayton Johnson's story, a gifted player who cannot
  stand being measured against a dead legend. When the legend returns to play him for his life, he loses: the remake
  restored the ending Johnson originally wrote, in which Jesse survives but will never be remembered as the best.

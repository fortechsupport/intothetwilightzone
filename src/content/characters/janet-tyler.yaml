description: >-
  A woman whose face is wrapped in bandages after her eleventh operation to look like everyone else. When they come
  off, she is a beautiful woman in a world where the norm is pig-like faces, and she is sent to live with others
  like her. Maxine Stuart played her under the bandages and Donna Douglas when they were removed; Molly Sims took
  the role in the 2002 remake.

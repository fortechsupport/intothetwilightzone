description: >-
  An alcoholic department store Santa who is fired on Christmas Eve and wishes that the poor could have their dreams
  come true. He finds a sack that produces whatever gift each person wants, gives it all away, and is taken by an
  elf on a sleigh to be the real Santa Claus. Richard Mulligan played him in the 1985 remake.

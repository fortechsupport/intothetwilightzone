description: >-
  A burned-out 36-year-old advertising executive who walks into his hometown of Homewood and finds it exactly as
  it was in his childhood. He meets his parents and his boyhood self, and after accidentally injuring young Martin
  on the carousel he is told by his father that he must go back and look ahead, not behind. It is one of Serling's
  most personal and most celebrated scripts.

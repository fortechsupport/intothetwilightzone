description: >-
  A convict serving a fifty-year sentence in solitary confinement on a barren asteroid, visited by a supply ship
  four times a year. Given a female robot to ease his isolation, he comes to love her, and when he is pardoned and
  told there is no room on the ship for her, the captain shoots the robot to make him leave.

description: >-
  An Air Force astronaut candidate who wanders into the small town of Oakwood and finds it completely deserted,
  with coffee still hot and a cigar still burning. His mounting panic ends when he is revealed to be inside an isolation
  chamber, hallucinating after 484 hours alone in a simulated trip to the Moon. As the lead of the very first episode,
  he set the template of an ordinary man pushed to the limit of his mind.

description: >-
  An elderly invalid who begins to get phone calls in the night with only static and moaning on the line. The line
  turns out to have fallen on the grave of her fiancé, whom she killed in a car accident decades earlier. When she
  begs him to talk to her, he reminds her that she once told him to leave her alone, and he always did what she
  said.

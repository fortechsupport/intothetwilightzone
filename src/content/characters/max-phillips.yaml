description: >-
  A small-time bookie who learns that his neglected son, Pip, has been badly wounded in Vietnam. Shot after a rare
  act of decency, he wanders into an empty amusement park where he meets Pip as a ten- year-old boy, and he offers
  his own life to God in exchange for his son's. The episode was among the first on American television to mention
  the Vietnam War.

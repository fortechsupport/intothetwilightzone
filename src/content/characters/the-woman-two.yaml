description: >-
  A soldier of one side in a war that has emptied the world, scavenging in a ruined town years after the fighting.
  She distrusts the enemy soldier she meets there and even shoots at him, but slowly accepts his offer of peace.
  Her only word in the episode is the Russian "prekrasnyy" (beautiful), and the near-wordless role is one of Elizabeth
  Montgomery's best remembered.

description: >-
  A sour hypochondriac terrified of dying, who sells his soul for immortality with an escape clause that lets him
  die whenever he wishes. Bored by invulnerability, he lets his wife fall from a roof, confesses to murder hoping
  for the electric chair, and is instead given life imprisonment, at which point he calls for the Devil and invokes
  the clause.

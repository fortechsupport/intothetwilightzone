description: >-
  The leader of a small band of survivors in 1974, ten years after a nuclear war. He alone speaks with the unseen
  'old man in the cave,' whose advice on which food and water are safe has kept the town alive. When soldiers turn
  the townspeople against him, he refuses to eat the contaminated food and is the only one who survives.

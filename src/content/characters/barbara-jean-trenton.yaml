description: >-
  A faded movie star who lives in the past, watching her old films night after night in her private screening room.
  Repelled by the real world and by her own aged co-star, she wishes herself into the screen and vanishes, leaving
  her scarf behind as the image of her younger self waves goodbye. She is the series' portrait of a Hollywood Norma
  Desmond.

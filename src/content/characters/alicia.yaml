description: >-
  A lifelike female robot left with James Corry by a sympathetic supply captain. She learns to feel and respond,
  and Corry treats her as a woman until the captain destroys her face to show him she is only a machine. The episode's
  question of whether her feelings were real anticipates decades of android stories.

description: >-
  A polite, business-suited Death who arrives with an appointment book to collect Lew Bookman at midnight. Outwitted
  by Lew's loophole, he chooses a neighborhood child instead, only to miss his midnight appointment because Lew's
  pitch is too good to walk away from. He is the first of the show's many courteous, unshowy personifications of
  death.

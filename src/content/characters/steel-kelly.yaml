description: >-
  A former boxer in 1974, when human boxing is banned and robots fight instead. When his old robot, Battling Maxo,
  breaks down before a fight, Kelly fights in its place, disguised as a robot, and takes a beating to earn the money
  to repair it. The story is by Richard Matheson, and it was the basis for the 2011 film Real Steel.

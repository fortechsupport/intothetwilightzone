description: 'A collection of Johnny Hart''s B.C. comic strips with a foreword by Rod Serling. Open Library lists
  a 1961 Fawcett Gold Medal paperback (128 pages) and a 1962 Putnam edition (95 pages); the Rod Serling Memorial
  Foundation dates the book with Serling''s foreword to 1974 and quotes it: "I''ve never written a foreword before
  for anyone, least of all an elflike cartoonist...". Which edition first carried the foreword is not stated by
  either source. Not Twilight Zone material.'

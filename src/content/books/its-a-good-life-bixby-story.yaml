description: Jerome Bixby's short story, adapted as the Twilight Zone episode "It's a Good Life" (1959 series) and "It's
  Still a Good Life" (2002 series). Rod Serling wrote the teleplay. The 2002 sequel, It's Still a Good Life, is based
  on the characters Bixby created. It was first published in Star Science Fiction Stories No. 2 (1953).

description: Richard Matheson's short story, adapted as the Twilight Zone episode "Nightmare at 20,000 Feet" (1959 series)
  and "Nightmare at 30,000 Feet" (2019 series). Richard Matheson wrote the teleplay. The 2019 series remade it as "Nightmare
  at 30,000 Feet". The catalogue dates it to 1962, under the title "Nightmare at Twenty Thousand Feet", but names no
  venue for that printing. No source we read names the magazine or book it first appeared in.

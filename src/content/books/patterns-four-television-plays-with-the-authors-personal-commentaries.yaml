description: Rod Serling's 1957 collection of four of his live-television plays (Patterns, The Rack, Old MacDonald
  Had a Curve and Requiem for a Heavyweight), with his own commentary on writing for television. It predates The
  Twilight Zone and shows the dramatist Serling was before it.

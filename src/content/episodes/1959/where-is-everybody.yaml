synopsis: A man in an Air Force-style jumpsuit wanders into a small town with no memory of who he is. Coffee is
  still warm, a jukebox plays, and a cigar smolders, yet he cannot find a single living person anywhere.
themes:
- identity
- isolation
- loneliness
- space race
trivia:
- text: Westbrook Van Voorhis recorded the pilot's original narration. Serling later re-recorded it himself so the
    narration would be consistent with the rest of the series.
  sources:
  - title: Where Is Everybody? - Wikipedia
    url: https://en.wikipedia.org/wiki/Where_Is_Everybody%3F
- text: Unlike most episodes, which were made at MGM, the pilot was shot at Universal Studios, with the Courthouse
    Square set standing in for the town of Oakwood.
  sources:
  - title: Where Is Everybody? - Wikipedia
    url: https://en.wikipedia.org/wiki/Where_Is_Everybody%3F
- text: Before this pilot, CBS bought Serling's teleplay "The Time Element" and shelved it; it was later found in
    the vaults and aired on Westinghouse Desilu Playhouse on November 24, 1958.
  sources:
  - title: The Twilight Zone (1959 TV series) - Wikipedia
    url: https://en.wikipedia.org/wiki/The_Time_Element

title: An Occurrence at Owl Creek Bridge
series: '1959'
season: 5
episode: '22'
air_date: '1964-02-28'
runtime_min: 25
writers:
- Robert Enrico
writing_credit_note: French short film La Rivière du hibou (1961), adapted by Robert Enrico from Ambrose Bierce's
  short story; acquired and broadcast as a Twilight Zone episode with an introduction by Rod Serling. It won Best
  Short Subject at Cannes (1962) and the Academy Award for Best Live Action Short Film.
source_authors:
- Ambrose Bierce

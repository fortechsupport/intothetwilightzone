trivia:
- text: After its single broadcast in February 1963, "The Miniature" was the subject of a suit by writer Clyde Ware,
    who said it copied a story he had submitted to the show. The suit was quickly dismissed, but the episode was
    left out of the original syndication package and was not seen again until the 1984 Silver Anniversary special.
  sources:

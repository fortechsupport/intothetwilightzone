trivia:
- text: The season 1 episode "The After Hours" drew a copyright infringement suit, which was dismissed. Unlike some later
    disputed episodes, it was never pulled from syndication, and it was remade for the 1980s revival. The date of the
    suit was not reported; the year here is the year the episode aired.
  sources:

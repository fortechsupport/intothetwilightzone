narrator: Rod Serling
synopsis: Erich Streator resents his stepdaughter Christie and her new talking doll, Talky Tina. When the doll begins
  speaking directly to him with menacing words, he sets out to get rid of it, but Tina proves hard to silence.
themes:
- abuse
- family conflict
- menace
- toys
trivia:
- text: Talky Tina was voiced, without credit, by June Foray, who also supplied the voice of Mattel's Chatty Cathy doll,
    the toy Tina was modeled on.
  sources:
  - title: Living Doll (The Twilight Zone) - Wikipedia
    url: https://en.wikipedia.org/wiki/Living_Doll_(The_Twilight_Zone)
- text: Although Charles Beaumont is credited, the script was ghostwritten by Jerry Sohl while Beaumont was too ill to
    write; Beaumont insisted on splitting the fee.
  sources:
  - title: Jerry Sohl - Wikipedia
    url: https://en.wikipedia.org/wiki/Jerry_Sohl
- text: Toy Story 4 director Josh Cooley has said that Talky Tina inspired the film's doll Gabby Gabby.
  sources:
  - title: Living Doll (The Twilight Zone) - Wikipedia
    url: https://en.wikipedia.org/wiki/Living_Doll_(The_Twilight_Zone)
- text: The house seen in the episode was reused from the earlier episode "Ring-a-Ding Girl".
  sources:
  - title: Living Doll (The Twilight Zone) - Wikipedia
    url: https://en.wikipedia.org/wiki/Living_Doll_(The_Twilight_Zone)

synopsis: Elderly Sam Forstmann is convinced that he will die if his beloved grandfather clock ever stops. When his worried
  granddaughter and her husband decide the clock must go, Sam's fixation turns into a battle with time itself.
themes:
- aging
- family
- mortality
- obsession
trivia:
- text: George Clayton Johnson disliked how his story "Tick of Time" was rewritten, especially the new ending, so his
    on-screen credit appears under the pseudonym "Johnson Smith".

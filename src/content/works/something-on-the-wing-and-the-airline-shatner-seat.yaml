title: '''Something on the wing'' and the airline ''Shatner seat'''
kind: cultural-impact
subtype: idiom
year: '1963-10-11'
creator: Richard Matheson; William Shatner
description: '''Nightmare at 20,000 Feet'', in which William Shatner''s character sees a gremlin on the wing, has
  made the gremlin a standard joke about nervous flyers. MeTV and BGR report that some crews and frequent flyers
  call the window seat under the small black triangles above the wing the ''Shatner seat'', although no airline
  has confirmed where the nickname came from.'
details:
  why_it_matters: It shows an episode becoming part of how people talk about air travel.

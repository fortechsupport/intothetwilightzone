title: Twilight Zone sponsorship in the 1959-60 trade press (Sponsor, Variety, Broadcasting)
kind: advertisement
year: 1959-1960
publisher: Sponsor / Variety / Broadcasting (trade press)
description: >-
  The Media History Digital Library has digitized 1959-60 issues of the trade magazines Sponsor, Variety, Broadcasting
  and Television Digest. Searching its Lantern tool for The Twilight Zone returns pages from these magazines, which
  are where the show's sponsor deals and network promotion would have appeared. TV Obscurities has an exhibit of
  vintage sponsor spots. TVLine and /Film have written about the show's early sponsors, including one that dropped
  out because it never understood the show, and about sponsors refusing a dark season 2 script. Which pages carry
  actual advertisements, as opposed to news items, has not been checked.
subtype: vintage-ad
details:
  to_verify: which Lantern pages are ads vs news; the sponsor names are not confirmed from these sources
relevance: core
research_confidence: low

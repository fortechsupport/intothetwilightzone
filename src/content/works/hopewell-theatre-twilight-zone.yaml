title: Twilight Zone episodes onstage (Hopewell Theatre)
kind: stage
subtype: episode-staging
creator: Rod Serling (original teleplays)
description: A recurring Hopewell Theatre program that turns Serling episodes into one-act stage plays. The 2025 edition,
  "In the Zone with Rod Serling", staged five episodes (not announced in advance), directed by Christopher Fidram, with
  Mario Ricciardi as Serling. The Tribune Chronicle reported that "Hopewell received permission from the estate of 'Twilight
  Zone' creator and host Serling to use any of the 92 episodes he wrote or co-wrote"; the Rod Serling Memorial Foundation
  says CBS holds the stage rights to the episodes.
details:
  venue: Hopewell Theatre, 702 Mahoning Avenue, Youngstown, Ohio
  opened: 2025-10
  director: Christopher Fidram (2025)
  licence: permission from the Serling estate (Tribune Chronicle); not a CBS licence

title: William Tuttle's Twilight Zone makeups (pig faces, The Masks, Kanamit)
kind: prop
subtype: makeup
year: '1960'
creator: William J. Tuttle; MGM makeup department
description: MGM makeup head William Tuttle created many of the show's most famous faces, including the pig faces
  in 'Eye of the Beholder', the grotesque masks in 'The Masks' and the Kanamits in 'To Serve Man'. Surviving examples
  are rare, which explains the high prices they reach at auction.
details:
  why_it_matters: Tuttle's makeups account for the most sought-after surviving artifacts from the show.

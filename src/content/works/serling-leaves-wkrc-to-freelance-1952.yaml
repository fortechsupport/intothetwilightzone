title: Serling leaves Cincinnati television to freelance (1952)
kind: event
subtype: history
year: 1952
description: After writing scripts for WKRC-TV's live anthology The Storm, Serling left the station in the winter
  of 1952 to write freelance for the New York network anthologies. The gamble paid off within three years.

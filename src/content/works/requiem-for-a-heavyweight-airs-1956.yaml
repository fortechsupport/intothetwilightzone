title: '"Requiem for a Heavyweight" airs on Playhouse 90 (1956)'
kind: event
subtype: history
year: 1956
description: CBS's Playhouse 90 broadcast "Requiem for a Heavyweight," Serling's drama about a washed-up boxer,
  live on October 11, 1956. It brought him a second Emmy and a Peabody Award and was later remade as a feature film
  (1962).

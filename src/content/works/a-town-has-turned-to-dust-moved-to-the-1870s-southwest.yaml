title: '''A Town Has Turned to Dust'' moved to the 1870s Southwest'
kind: legal
subtype: censorship
year: '1958'
creator: Rod Serling; Playhouse 90; CBS
description: For CBS's Playhouse 90, Serling wrote another drama drawn from the Till case. Under pressure from network
  executives it was set a century earlier in the Southwest, and its direct references to Black and white race relations
  were removed. NPR reported a 2008 staging of Serling's uncut version.
details:
  why_it_matters: Along with 'Noon on Doomsday', it pushed Serling toward science-fiction allegory.

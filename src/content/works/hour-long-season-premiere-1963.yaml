title: The Twilight Zone returns as an hour-long series (1963)
kind: event
subtype: broadcast
year: 1963
description: After CBS dropped the show from its autumn 1962 schedule, it returned on Thursday, January 3, 1963,
  in a one-hour format with "In His Image." The 18 hour-long episodes of season four were not a success, and season
  five went back to half an hour that autumn.

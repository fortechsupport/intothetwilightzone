title: '"The Time Element" airs on Westinghouse Desilu Playhouse (1958)'
kind: event
subtype: premiere
year: 1958
description: 'CBS''s Westinghouse Desilu Playhouse aired Serling''s "The Time Element" on November 24, 1958: a man
  dreams each night of Pearl Harbor the day before the attack. Shelved by CBS as an anthology pilot, it was bought
  by Desilu, drew strong reviews and mail, and persuaded CBS to commission The Twilight Zone. Desi Arnaz introduced
  it.'

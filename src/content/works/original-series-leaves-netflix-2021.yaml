title: The original series leaves Netflix in the US (2021)
kind: production
subtype: streaming
year: 2021
description: The original 1959 series, which had streamed on Netflix in the United States for about six years, left
  the service on July 1, 2021, leaving it on Paramount+ and Hulu. It had never been offered on Netflix outside the
  US.

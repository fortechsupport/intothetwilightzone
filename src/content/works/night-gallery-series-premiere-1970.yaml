title: Night Gallery premieres as a series (1970)
kind: event
subtype: premiere
year: 1970
description: Following the 1969 pilot film, Rod Serling's Night Gallery began on NBC on December 16, 1970, as one
  of four rotating series in the Four in One wheel. It became a standalone weekly series the next season and ran
  until May 27, 1973.

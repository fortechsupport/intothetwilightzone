title: Alan Sepinwall on Rod Serling, ATX TV Festival (2026)
kind: lecture
subtype: talk
year: 2026
creator: Alan Sepinwall
description: >-
  At the ATX TV Festival in Austin (28 to 31 May 2026), TV critic Alan Sepinwall previewed his biography Serling: A
  Journey Into The Twilight Zone with TV's First Visionary, due that October, in conversation with Daniel Fienberg,
  chief TV critic of The Hollywood Reporter. The session screened "Walking Distance", which Sepinwall called
  Serling's favourite episode, and covered his life, his research and the show's uneven seasons.

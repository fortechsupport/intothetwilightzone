description: Sandbox Theater players performed "The Monsters Are Due on Maple Street" in the style of an old-time radio
  drama at the Larchmont Library in New York on 28 October 2023, for Twilight Zone fans and for blind and visually impaired
  listeners. Patch reported it as a one-time performance, not recorded, "made possible by special permission from CBS/Paramount".

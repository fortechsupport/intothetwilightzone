title: The Simpsons' 'Treehouse of Horror' and Twilight Zone parodies
kind: cultural-impact
subtype: parody
year: '1990'
creator: The Simpsons writers; Fox
description: From its first Halloween special in 1990, The Simpsons' 'Treehouse of Horror' episodes have regularly
  parodied Twilight Zone stories, including 'To Serve Man', 'It's a Good Life', 'Nightmare at 20,000 Feet', 'Living
  Doll' and 'The Monsters Are Due on Maple Street'. Bart often delivers a Serling-style introduction. SYFY has catalogued
  every one of these parodies.
details:
  why_it_matters: These are some of the most-watched tributes that keep the show's stories familiar to new viewers.

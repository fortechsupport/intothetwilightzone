title: Robby the Robot sold for $5.375 million (Bonhams, 2017)
kind: prop
subtype: auction
year: '2017-11-21'
creator: Bonhams; MGM; Robert Kinoshita (designer)
description: Robby, the Forbidden Planet robot that MGM later loaned to The Twilight Zone, sold at Bonhams New York
  for $5,375,000, then a record for a film prop at auction. On the show, Robby appeared in 'Uncle Simon' and in
  'The Brain Center at Whipple's'.
details:
  why_it_matters: It is the most valuable surviving object ever to appear on screen in The Twilight Zone.
  relates_to:
  - Uncle Simon
  - The Brain Center at Whipple's

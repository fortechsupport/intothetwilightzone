title: Paratrooper training at Camp Toccoa (1943)
kind: event
subtype: history
year: 1943
description: Serling trained as a paratrooper at Camp Toccoa, Georgia, under Colonel Orin D. "Hard Rock" Haugen,
  despite at first being judged too short for airborne duty. He was assigned to the 511th Parachute Infantry Regiment
  of the 11th Airborne Division.

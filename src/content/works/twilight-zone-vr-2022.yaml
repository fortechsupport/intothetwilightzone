title: The Twilight Zone VR
kind: game
subtype: video-game
year: 2022
creator: Pocket Money Games (developer)
publisher: Fun Train
description: >-
  A licensed virtual-reality anthology with three original stories - Character Building, Terror Firma and Deadline
  Earth - mixing stealth, shooting and escape sequences with a narrator in the Serling tradition. It launched on
  Meta Quest 2 on 14 July 2022, with a PlayStation VR2 version following in March 2024.

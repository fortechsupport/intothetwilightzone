title: Serling Archives move to the Ithaca College Archives (1997)
kind: event
subtype: history
year: 1997
description: After Serling's death, Carol Serling, a longtime Ithaca College trustee, gave the college his scripts
  and papers over many years. In the summer of 1997 the collection moved from the Park School of Communications
  to the college's Archives and Special Collections, where researchers can now consult it.

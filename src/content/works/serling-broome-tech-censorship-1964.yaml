title: Rod Serling on television censorship, Broome Technical Community College (1964)
kind: lecture
subtype: speech
year: 1964
creator: Rod Serling
description: Speaking to about 400 people at Broome Tech in Binghamton at the end of April 1964, as The Twilight
  Zone ended its run, Serling argued that advertisers, not government, were the real censors of television, criticised
  the ratings services and discussed the FCC. The Binghamton Press reported the talk on May 1, 1964.

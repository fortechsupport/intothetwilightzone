title: Live Onstage! The Twilight Zone (Gold Dust Orphans, Boston, 2006)
kind: stage
subtype: episode-staging
year: 2006
creator: Ryan Landry and the Gold Dust Orphans
description: Ryan Landry's drag comedy company played three original-series episodes, "The Invaders", "Living Doll" and
  "Eye of the Beholder", in the basement of Machine in Boston in autumn 2006, with Landry in the role Agnes Moorehead created
  and Billy Hough as Serling. The Phoenix found it good-natured but too close to the originals. Licence not stated.

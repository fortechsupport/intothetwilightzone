title: '''Judgment Night'' tea line changed for a coffee sponsor'
kind: advertisement
subtype: sponsor-interference
year: '1959'
creator: Rod Serling; an instant-coffee sponsor (General Foods era)
description: An instant-coffee sponsor objected to a line in 'Judgment Night' in which characters ask for tea, a
  rival drink. The line was changed to a request for an unnamed 'tray'. Slashfilm describes it as the one original-series
  episode that censors succeeded in changing.
details:
  why_it_matters: It shows how much influence sponsors had over the content of 1950s TV scripts.

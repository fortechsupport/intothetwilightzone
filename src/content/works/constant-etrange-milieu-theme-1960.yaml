title: The Twilight Zone theme ("Etrange No. 3" / "Milieu No. 2")
kind: soundtrack
subtype: theme-single
year: 1960
creator: Marius Constant
publisher: CBS Music Library; later April Music / Aspenfair Music
description: >-
  The famous four-note guitar theme was not written as a theme at all: Constant supplied a handful of short work-for-hire
  cues to the CBS stock library, and music director Lud Gluskin spliced two of them together for the second-season
  opening in September 1960 after other commissioned themes were turned down. Constant was paid a flat fee and reportedly
  did not know for years that his music had become one of television's best-known signatures.
details:

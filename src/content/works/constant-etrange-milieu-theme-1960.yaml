  copyright: PA 54-066 (1979, within a Cayuga Productions filing); sheet music PA 76 746 (1980)
  publishers: April Music Inc. (1978); Aspenfair Music Inc. (2000)
  payment: Constant said he was paid a few hundred dollars for the six cues
  debunked_claim: A 2007 eBay claim that the theme derives from a 1964 piece 'Ponant 19' found no musical support

title: The Twilight Zone (2019) Super Bowl LIII spot
kind: other
year: 2019
description: >-
  CBS's first ad for the Jordan Peele revival ran during Super Bowl LIII on 3 February 2019. It was made to look
  as if the broadcast itself had been taken over, with the familiar theme. It was part of a CBS All Access promo
  campaign that later won a Clio Entertainment award.

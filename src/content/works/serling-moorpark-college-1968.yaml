title: 'Rod Serling at Moorpark College: loyalty oaths, Vietnam and social inequity (1968)'
kind: lecture
subtype: speech
year: 1968
creator: Rod Serling
description: 'On December 3, 1968, Serling refused to sign California''s loyalty oath for paid speakers, waived
  his fee, and spoke to Moorpark College students about the generation gap, the Vietnam War, civil rights and campus
  protest. He ended: "If you want to prove that God is not dead... first prove that man is alive." The campus magazine
  QUEST printed the speech the next day.'

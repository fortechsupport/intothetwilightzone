year: '1908'
creator: Merriam-Webster
description: Merriam-Webster defines 'twilight zone' as an area just beyond the usual limits, such as those of law
  or ethics, and also as a realm of fantasy or illusion. It dates the first sense to 1908, so the phrase existed
  before the show. The 'fantasy' sense is the one Serling's series made widespread, and the dictionary's example
  sentences show both in use.

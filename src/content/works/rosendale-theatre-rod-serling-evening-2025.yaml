title: A Rod Serling Evening (Rosendale Theatre, 2025)
kind: lecture
subtype: talk
year: 2025
description: A two-hour illustrated talk by Nicholas Parisi and Tony Albarella, president and vice-president of
  the Rod Serling Memorial Foundation, on the 66th anniversary of the Twilight Zone premiere. It covered Serling's
  early years, career and legacy with childhood photos, archival interviews and clips from The Twilight Zone, Night
  Gallery and Planet of the Apes, followed by questions. Tickets were $10 ($6 for members).

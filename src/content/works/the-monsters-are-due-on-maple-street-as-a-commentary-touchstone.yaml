title: '''The Monsters Are Due on Maple Street'' as a commentary touchstone'
kind: cultural-impact
subtype: political allegory
year: '1960-03-04'
creator: Rod Serling; columnists and educators
description: Serling's story of neighbors turning on each other during a blackout is often cited by columnists writing
  about mass suspicion, scapegoating and moral panic, from the McCarthy era to the 2020 pandemic. It is also widely
  taught in schools. TIME named it one of the ten best episodes in 2009, and the 2002 revival remade it as a story
  about fear of terrorism.
details:
  why_it_matters: It is the episode most often used as political shorthand.

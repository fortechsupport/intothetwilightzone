title: Serling begins teaching at Ithaca College (1967)
kind: event
subtype: history
year: 1967
description: Serling taught at Ithaca College, near his family's summer home on Cayuga Lake, from 1967 until his
  death in 1975, screening his own work for students and critiquing their scripts. Some sources date the teaching
  to after Night Gallery ended in 1973; the college gives 1967.

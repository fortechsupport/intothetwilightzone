title: The Twilight Zone pop-up at The Grove, Los Angeles (2019)
kind: event
subtype: promotional pop-up
year: 2019
description: >-
  A pop-up experience promoting the 2019 revival, set up at The Grove shopping centre in Los Angeles ahead of the
  series' 1 April 2019 premiere on CBS All Access: a giant box bearing the show's logo that shoppers walked into
  and came out of. CBS Los Angeles reported it on 29 March 2019; the report gives no run dates and does not name
  who built it.

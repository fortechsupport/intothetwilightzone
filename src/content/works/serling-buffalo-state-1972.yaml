title: '"The Twentieth Century and Other Absurdities": Rod Serling in Buffalo (1972)'
kind: lecture
subtype: lecture
year: 1972
creator: Rod Serling
description: Serling lectured in Buffalo, New York, on October 18, 1972, under the title "The Twentieth Century
  and Other Absurdities," as reported in the Buffalo State College campus newspaper. A listener later recalled him
  joking about "biting the hand that has fed me" in his criticism of television, and closing on the need for people
  to care about one another.

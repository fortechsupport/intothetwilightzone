title: Night Gallery opening title sequence (seasons 1-2)
kind: artwork
year: 1970-1972
publisher: Universal Television / NBC
description: >-
  The first two seasons of Night Gallery open with a montage of paintings, sculptures and distorted faces that move
  toward the camera, each in its own box within a frame, set to Gil Mellé's electronic theme. The credits appear
  over the artwork and the sequence ends on a painted eye, with the guest cast shown in its lens. The faces and
  the designer are uncredited.
subtype: title-sequence

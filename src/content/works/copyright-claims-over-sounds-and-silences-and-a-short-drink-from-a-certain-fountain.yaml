title: Copyright claims over 'Sounds and Silences' and 'A Short Drink From a Certain Fountain'
kind: legal
subtype: lawsuit
year: '1964'
creator: CBS; unnamed claimants
description: Copyright infringement claims against these two fifth-season episodes, together with the 'Miniature'
  suit, caused all three to be left out of the original syndication package. With 'An Occurrence at Owl Creek Bridge'
  and 'The Encounter', they became the so-called 'lost five' episodes that fans could not see in reruns for years.
details:
  why_it_matters: These claims explain why some episodes were missing from reruns for decades.

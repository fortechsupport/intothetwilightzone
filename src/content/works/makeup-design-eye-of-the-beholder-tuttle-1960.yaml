title: '"Eye of the Beholder" makeup design by William Tuttle'
kind: artwork
year: 1960
creator: William J. Tuttle
publisher: MGM makeup department / Cayuga Productions
description: >-
  William Tuttle's pig-snouted faces were partly based on the Morlocks he had just made for George Pal's The Time
  Machine (1960). Full-head masks were too expensive, so director Douglas Heyes suggested separate pieces: brow
  pieces and a large appliance covering the nose, cheeks and upper lip, leaving the actors' own jaws and ears visible.
  Shooting kept them in shadow until the reveal.
subtype: makeup-design

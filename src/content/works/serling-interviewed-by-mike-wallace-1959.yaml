title: Mike Wallace interviews Serling before the premiere (1959)
kind: event
subtype: history
year: 1959
description: Shortly before The Twilight Zone debuted in October 1959, Mike Wallace interviewed Serling on television
  about the new series and his career. The Rod Serling Memorial Foundation keeps the interview among its featured
  recordings, and it is often quoted for what Serling said he hoped the show would be.

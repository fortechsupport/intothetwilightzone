title: The Twilight Zone Trading Cards (Series 1)
kind: collectible
subtype: trading-cards
year: 1999
creator: Rittenhouse Archives
description: >-
  Rittenhouse's first Twilight Zone card set, a 72-card base set drawn from the original series. It started a run
  that numbered later series to continue from it.

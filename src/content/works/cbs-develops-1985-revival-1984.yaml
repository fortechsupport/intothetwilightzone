title: CBS develops a Twilight Zone revival (1984)
kind: production
subtype: development
year: 1984
description: Having long turned down offers to revive the show, including from Serling and Buck Houghton and later
  Francis Ford Coppola, CBS began developing a new series in-house in 1984 under drama development vice president
  Carla Singer. It premiered in September 1985.

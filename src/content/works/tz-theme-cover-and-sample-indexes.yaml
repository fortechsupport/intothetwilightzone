title: Twilight Zone theme cover and sample indexes (SecondHandSongs, WhoSampled)
kind: other
description: >-
  Reference record for the databases that track covers and samples of both Twilight Zone themes. SecondHandSongs
  keeps separate work pages for Constant's "Theme from the Twilight Zone" and Herrmann's first-season theme. WhoSampled
  splits its Twilight Zone page by element: Original Theme (Herrmann), Title Sequence (Season 4 Onwards) (Constant),
  Intro, and episode narrations. The fan wiki keeps a broader list of audio recordings that reference the series.

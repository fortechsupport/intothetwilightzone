title: Marius Constant's fight for rights to the Twilight Zone theme
kind: legal
subtype: music rights
year: '1997'
creator: Marius Constant; CBS
description: Constant was paid about $200 to deliver a theme overnight, plus $500 if it was used, and his check
  took three months to arrive. He later sued and won rights to future earnings from the music, although not from
  past uses. The Seattle Times told the story in 1997.
details:
  why_it_matters: It explains who owns and profits from the franchise's best-known piece of music.

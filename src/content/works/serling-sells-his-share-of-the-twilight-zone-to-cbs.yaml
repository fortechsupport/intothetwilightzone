title: Serling sells his share of The Twilight Zone to CBS
kind: legal
subtype: rights
year: '1964'
creator: Rod Serling; Cayuga Productions; CBS
description: Serling's company, Cayuga Productions, co-owned the series with CBS. After the 1964 cancellation, Serling
  sold his share to the network, without foreseeing how valuable syndication would become. The rights stayed with
  CBS and passed into the Paramount corporate family, which still controls the series.
details:
  why_it_matters: The sale determines who has controlled every later use of the franchise.

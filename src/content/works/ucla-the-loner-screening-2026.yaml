description: >-
  A free screening at the Billy Wilder Theater on 24 January 2026 of three episodes of The Loner (CBS, 1965-66), all
  written by Serling: "An Echo of Bugles", "The Homecoming of Lemuel Stove" and "A Little Stroll to the End of the
  Line". The programme and notes were by the archive's television curator Mark Quigley, made possible by the John H.
  Mitchell Television Programming Endowment.

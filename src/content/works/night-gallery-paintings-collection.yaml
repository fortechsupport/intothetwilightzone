title: The Night Gallery paintings (1969-1973)
kind: artwork
year: 1969-1973
creator: Thomas J. Wright; Jaroslav Gebr (pilot)
publisher: Universal Television / NBC
description: >-
  Every segment of Rod Serling's Night Gallery was introduced by Serling standing beside a painting made for that
  story; about 101 originals were produced. After the pilot, Universal staff artist Thomas J. Wright painted nearly
  all of them, mostly in acrylic on Masonite, deliberately changing style from piece to piece so the gallery looked
  like the work of many artists. After cancellation the canvases were stored by Universal's property department,
  reused as set dressing (including two Columbo episodes), hung in offices, sold off cheaply, auctioned, or stolen;
  only a handful remain with the studio.
subtype: night-gallery-painting
details:
  count: approx. 101 original paintings
  medium: mostly acrylic on Masonite
  fate: >-
    Universal held about 50 roughly ten years after cancellation; now only a handful. Two reportedly sold in the
    early 1990s for $25 plus tax (Black Gate). Unofficial Hong Kong-made copies circulate on eBay.
  exhibitions: >-
    Occasional gallery exhibitions, mostly in Los Angeles (Black Gate notes a 2019 show in a caption only)
  people:
  - Thomas J. Wright
  - Jaroslav Gebr
  - Rod Serling
relevance: related
research_confidence: high

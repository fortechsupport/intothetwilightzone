title: Filming on the MGM backlot, Culver City
kind: production
subtype: studio
year: '1959'
creator: MGM; Cayuga Productions; CBS
description: Most film-shot episodes were made at MGM in Culver City. Interiors were shot on Lot 1 stages, and Lot
  2's New England Street and New York Street stood in for small towns and city alleys in episodes such as 'Stopover
  in a Quiet Town', 'The Shelter' and 'Person or Persons Unknown'. The show also reused MGM's stored sets and props,
  including the flying saucer and Robby the Robot from Forbidden Planet.
details:

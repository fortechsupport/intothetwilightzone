title: The Twilight Zone Radio Dramas – music and sound production
kind: soundtrack
year: 2002-2012
description: >-
  Carl Amari's Falcon Picture Group made 176 full-cast radio adaptations, hosted by Stacy Keach. Wikipedia describes
  them as using a full cast with music and sound effects. The sound engineers named are Roger Wolski, Bob Benson,
  Craig Lee, Tim Cerny and Jason Rizzo. No individual composer credit turned up in the public sources checked, so
  the music may be library or in-house production.
subtype: audio-drama-score

title: The Twilight Zone Radio Dramas – music and sound production
kind: soundtrack
year: 2002-2012
description: >-
  Carl Amari's Falcon Picture Group made 176 full-cast radio adaptations, hosted by Stacy Keach. Wikipedia describes
  them as using a full cast with music and sound effects. The sound engineers named are Roger Wolski, Bob Benson,
  Craig Lee, Tim Cerny and Jason Rizzo. When the series was announced in 2002, Radio World reported that it used the
  original Twilight Zone scores for its theme and background music, with sound effects from The Hollywood Edge. No
  separate composer is credited in the sources checked. Sound mixing was done at Falcon's studios and later at Cerny
  Sound-to-Picture in Chicago (Wikipedia).

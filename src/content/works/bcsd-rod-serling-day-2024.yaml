title: Binghamton City School District's Rod Serling Day (2024)
kind: event
subtype: anniversary
year: 2024
description: The Binghamton City School District holds an annual Rod Serling Day for fifth graders from its seven
  elementary schools, the end of a classroom unit on its most famous alumnus. In 2024 Anne Serling-Sutton spoke
  about her father and showed childhood photos, the district screened a student-and-teacher tribute video based
  on "Walking Distance" with SUNY Broome professor Tim Skinner as Serling, and everyone sang Happy Birthday to him
  afterwards.

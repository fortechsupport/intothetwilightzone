title: Trevco CBS-licensed Twilight Zone t-shirts
kind: collectible
publisher: Trevco (CBS license)
description: >-
  Trevco makes Twilight Zone t-shirts under license from CBS, and Entertainment Earth sells them with item numbers
  in its TRCBS range. Examples are "I'm in the Twilight Zone" (TRCBS186) and the Kanamit's Diner shirt (TRCBS1562BK).
  These sit alongside the Trevco polo shirts already on the site. Big retailers carry similar licensed designs,
  such as Target's women's cropped tee of "The Masks" and Walmart's "Living Doll" graphic tee and "Monologue" long-sleeve
  shirt.
subtype: apparel
details:

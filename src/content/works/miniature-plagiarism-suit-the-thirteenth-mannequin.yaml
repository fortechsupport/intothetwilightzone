title: '''Miniature'' plagiarism suit (''The Thirteenth Mannequin'')'
kind: legal
subtype: lawsuit
year: '1963'
creator: Clyde Ware (per Plagiarism Today); CBS; Charles Beaumont
description: A writer who had sent the show a script called 'The Thirteenth Mannequin' sued, claiming that Charles
  Beaumont's 'Miniature' took his idea of a man drawn to lifelike figures. The court dismissed the case and the
  dismissal was upheld on appeal, partly because his script resembled Serling's earlier episode 'The After Hours'.
  Even so, the episode was kept out of syndication for about 20 years.
details:
  why_it_matters: The lawsuit kept a well-regarded Robert Duvall episode off the air for decades.

title: 'Night Gallery painting: "You Can''t Get Help Like That Anymore" (Tom Wright)'
kind: artwork
year: 1972
creator: Thomas J. Wright
publisher: Universal Television
description: >-
  Tom Wright's screen-used acrylic on Masonite for the Serling-scripted segment about a couple who abuse their android
  maid; it shows Lana Wood's robot servant in pieces with her wiring exposed. The board was matted to about 17 x
  39.5 inches in a 28 x 50 inch frame made to match the show frame. Hake's sold it in March 2014 for $9,775 (one
  bid, against a $20,000-35,000 estimate).

title: Uses of the Twilight Zone theme in other films and TV
kind: other
description: >-
  Because CBS owned the cues outright, the Constant theme became a universal shorthand for the uncanny and has been
  quoted in films and series including Sixteen Candles, Moonlighting, The Wonder Years and The Simpsons, on top
  of countless commercials and comedy bits. Constant earned neither credit nor royalties from these uses. TIME ranked
  it among the ten most unforgettable TV sounds.
subtype: theme-use

title: Licensing 'An Occurrence at Owl Creek Bridge' (La Rivière du hibou)
kind: legal
subtype: licensing
year: '1964'
creator: Robert Enrico; CBS; William Froug
description: For the fifth season the producers bought Robert Enrico's French short film, based on the Ambrose Bierce
  story, for about $20,000 instead of making a new episode. The deal allowed only two broadcasts, so the episode
  was missing from syndication until further rights were negotiated. It is now available on home video and streaming.
details:
  why_it_matters: It is the only episode the show bought in from outside, and its rights limits kept it out of reruns.

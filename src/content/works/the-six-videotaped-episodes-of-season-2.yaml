title: The six videotaped episodes of season 2
kind: production
subtype: videotape experiment
year: '1960'
creator: CBS; Rod Serling; Buck Houghton
description: 'To cut costs in the second season, six episodes were recorded on videotape on a studio stage with
  four cameras, cut together like a live broadcast: ''The Lateness of the Hour'', ''The Night of the Meek'', ''The
  Whole Truth'', ''Twenty Two'', ''Static'' and ''Long Distance Call''. They saved only about $6,000 each and made
  location work almost impossible, so the experiment was not repeated. Serling called the result neither fish nor
  fowl, and kinescope copies were later used in syndication.'
details:
  why_it_matters: These are the only episodes of the series made with a different production method.

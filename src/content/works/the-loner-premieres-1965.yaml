title: The Loner premieres on CBS (1965)
kind: event
subtype: history
year: 1965
description: Serling's next series after The Twilight Zone, The Loner, a half-hour western about a Union veteran
  drifting west after the Civil War, starring Lloyd Bridges, premiered on CBS on September 18, 1965. It was cancelled
  in April 1966 after one season.

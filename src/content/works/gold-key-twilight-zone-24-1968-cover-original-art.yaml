title: 'Gold Key The Twilight Zone #24 (Jan. 1968) original cover painting by George Wilson'
kind: artwork
year: 1968
creator: George Wilson
publisher: Gold Key (Western Publishing)
description: >-
  The original gouache cover painting for issue #24 on heavy board with a paper overlay (13 3/8 x 17.5 inches).
  It shows a man concentrating as jewelry floats before him, illustrating the story "Mind Over Matter," and was
  also used as the back-cover pin-up. Hake's sold it in November 2019 for $1,180.

description: A Connecticut staging of Serling's Requiem for a Heavyweight at the Crystal Theatre in Norwalk in October 2025,
  directed by Mark Ferguson. Gus Bottazzi produced it and played Mountain McClintock. BroadwayWorld's critic found the play
  "more powerful now" than when it was written. The review does not state the licence.

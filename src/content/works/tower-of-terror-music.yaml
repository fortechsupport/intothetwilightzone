title: The Twilight Zone Tower of Terror – attraction music
kind: soundtrack
year: 1994-
description: >-
  The music of the attraction comes in three layers. In the lobby and queue, 1930s-style jazz and period recordings
  set the hotel in 1939. Attractions Magazine names Duke Ellington's "Mood Indigo" and Vera Lynn's "We'll Meet Again"
  for the Paris version. In the library pre-show, Richard Bellis's score frames Serling's introduction. On the ride
  itself, the music and effects follow Herrmann's style. Paris got new ride audio for its 2007 and 2019 versions.
  Fan sites keep loop lists, but there has been no official album.

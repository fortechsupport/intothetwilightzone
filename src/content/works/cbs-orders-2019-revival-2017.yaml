title: CBS orders the Jordan Peele revival (2017)
kind: production
subtype: development
year: 2017
description: After earlier attempts, including a 2012 deal with Bryan Singer, CBS announced on November 2, 2017,
  that it was redeveloping The Twilight Zone for its CBS All Access streaming service, with Jordan Peele in talks
  to lead it, and gave it a series order on December 6, 2017.

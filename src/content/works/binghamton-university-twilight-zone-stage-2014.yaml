title: The Twilight Zone onstage at Binghamton University (2014)
kind: stage
subtype: episode-staging
year: 2014
creator: Rod Serling (original teleplays)
description: Binghamton University's theatre department staged two of Serling's teleplays, "The Monsters Are Due on Maple
  Street" and "Dust", as a two-act play in his hometown in March 2014. Faculty member Elizabeth Mozer adapted and directed
  it; the university says she sought the approval of Serling's daughter Anne, who took part in a talk-back on 16 March with
  Lawrence Kassan of the Rod Serling Video Festival. The Associated Press covered it nationally.

title: Twilight Zone pinball remake (Chicago Gaming Company, rumored)
kind: game
publisher: Chicago Gaming Company (reported)
description: >-
  Industry watchers have long reported that Chicago Gaming Company, which remade Medieval Madness and other Williams/Bally
  classics, is developing a widebody remake of the 1993 Twilight Zone. A 2025 Knapp Arcade post expected it to follow
  CGC's Medieval Madness run. As of late 2026, Kineticist still lists it as rumored, not officially announced.

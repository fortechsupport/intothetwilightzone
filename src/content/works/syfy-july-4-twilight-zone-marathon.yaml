title: Syfy's Fourth of July Twilight Zone marathon
kind: event
subtype: marathon
year: 2011
description: Alongside its New Year's run, Syfy has aired a Twilight Zone marathon over the Fourth of July, a holiday
  slot KTLA had used in Los Angeles since 1983. Press notices and published schedules exist for 2011, 2012, 2014,
  2016, 2017, 2024 and 2025; one year Syfy built the marathon around Jordan Peele's 2019 series. When the Syfy tradition
  began has not been confirmed.

title: Grateful Dead live, Berkeley Community Theater, 9 March 1985 (Twilight Zone theme in Drums/Space)
kind: event
year: 1985
creator: Grateful Dead
description: >-
  At this 1985 show the band worked the freshly recorded Twilight Zone theme into the improvised Drums and Space
  segment, months before the revival premiered. The soundboard recording streams on the Internet Archive's Grateful
  Dead collection, and the show is catalogued by the Grateful Dead Archive Online.

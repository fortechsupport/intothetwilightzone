title: Binghamton's Twilight Zone 50th anniversary celebration (2009)
kind: event
subtype: anniversary
year: 2009
description: For the 50th anniversary in October 2009, Binghamton held a 12-hour Twilight Zone marathon at the Forum
  Theatre, walking tours, a Rod Serling Video Festival screening of the American Masters film, and live WSKG-TV
  performances of "Walking Distance" and "Mirror Image" on Saturday, October 3. WSKG radio's "Off the Page" aired
  a "Twilight Zone @ 50" program with Anne Serling, Martin Grams Jr. and Larry Kassan.

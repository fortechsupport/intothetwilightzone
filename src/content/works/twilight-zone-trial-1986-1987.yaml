title: The Twilight Zone manslaughter trial (1986-1987)
kind: legal
subtype: trial
year: 1987
description: John Landis, associate producer George Folsey Jr., unit production manager Dan Allingham, helicopter
  pilot Dorcey Wingo and special-effects coordinator Paul Stewart were charged with involuntary manslaughter over
  the 1982 deaths of Vic Morrow, Myca Dinh Le and Renee Shin-Yi Chen. The trial in Los Angeles ran from mid-1986,
  with testimony about the hiring of the children without permits and the timing of the explosions. The jury acquitted
  all five on May 29, 1987. Civil suits by the families were settled, and the case changed safety rules for stunts,
  pyrotechnics and child actors.
details:

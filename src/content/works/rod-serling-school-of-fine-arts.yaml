title: The Rod Serling School of Fine Arts at Binghamton High School
kind: memorial
subtype: memorial
description: Binghamton High School, from which Serling graduated in 1943, named its fine-arts program after him.
  The name is used in the district's arts pages and on the school's theatre box-office site.

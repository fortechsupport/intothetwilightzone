title: The Twilight Zone 8-inch Retro Action Figures
kind: collectible
subtype: action-figure
year: 2010-2013
creator: Bif Bang Pow!
description: >-
  Cloth-costumed 8-inch figures styled after 1970s Mego toys, sold mostly as two-packs pairing characters from different
  episodes. The first two-packs were slated for August 2010, and a Talky Tina and Willie set was a Comic-Con 2010
  exclusive.
details:
  line: The Twilight Zone 8-inch (Mego-style) figures
  series: The Twilight Zone (1959) - multiple episodes
  items:
  - Kanamit and The Devil two-pack
  - Gremlin and Jason Foster two-pack
  - Talky Tina and Willie (SDCC 2010 exclusive)
  - Bob Wilson and Don Carter deluxe set (Entertainment Earth exclusive)
  - Alien and Nurse set
  - Cyclops and Alicia set
  licensed: true
  two_packs:
    BBP05101AA: Gremlin & Jason Foster
    BBP05101DD: The Doctor & Henry Bemis
    BBP05101EE: The Venusian & Invader
    BBP05101GG: Cyclops & Alicia
    SDCC: Bob Wilson & Don Carter; Talky Tina & Willie (BBP05101CC)
  single_series:
    Series 1: Gremlin; Jason Foster
    Series 2: Kanamit
    Series 4: Henry Bemis
    Series 5: The Venusian; The Invader
    Series 7-8: assortment cases (contents not verified)

title: Serling's war story "First Squad, First Platoon" is published (2024)
kind: event
subtype: history
year: 2024
description: On May 9, 2024, The Strand Magazine published "First Squad, First Platoon," a story Serling wrote after
  returning from the war, set on Leyte and drawn from soldiers he knew. Researcher Amy Boyle Johnston found it among
  his papers at the University of Wisconsin.

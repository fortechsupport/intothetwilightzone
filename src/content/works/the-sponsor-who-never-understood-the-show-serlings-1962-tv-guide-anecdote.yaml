title: The sponsor who never understood the show (Serling's 1962 TV Guide anecdote)
kind: advertisement
subtype: sponsor
year: '1962'
creator: Rod Serling; TV Guide; unnamed first-season sponsor
description: In a 1962 TV Guide interview, Serling described an early sponsor who preferred plain westerns. Each
  Monday this sponsor called the ad agency asking what the previous Friday's episode had meant, and he left after
  one season. Serling also mentioned a food sponsor that disliked a gruesome script because it might put viewers
  off their food.

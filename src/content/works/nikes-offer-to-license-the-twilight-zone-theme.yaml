title: Nike's offer to license the Twilight Zone theme
kind: advertisement
subtype: licensing
creator: Marius Constant; Nike
description: According to the Seattle Times, Nike offered Constant $3,000 to use his theme in a commercial. He asked
  for $100,000 and agreed to $80,000, but the music never ran in a Nike ad. The story shows how much advertisers
  valued the theme as an instant signal of strangeness.
details:
  why_it_matters: It shows the commercial value of the theme decades after the show ended.

description: >-
  A TV Time Machine radio interview with Night Gallery painter Thomas J. Wright, with a companion page of his paintings:
  The Doll, The Lone Survivor, Midnight Never Ends, Brenda, Pickman's Model, The Late Mr. Peddington, A Feast of
  Blood, The Caterpillar, Finnegan's Flight and Death on a Barge. The same program also interviewed Night Gallery
  co-author Scott Skelton.

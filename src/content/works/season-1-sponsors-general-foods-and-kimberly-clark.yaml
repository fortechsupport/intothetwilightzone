title: 'Season 1 sponsors: General Foods and Kimberly-Clark'
kind: advertisement
subtype: sponsor
year: '1959'
creator: General Foods; Kimberly-Clark; Colgate-Palmolive; CBS
description: The first season of the original series was underwritten by two alternating sponsors, General Foods
  and Kimberly-Clark. Kimberly-Clark later dropped out and Colgate-Palmolive took its place. Early ratings were
  below what CBS had hoped, so keeping sponsors on board was central to the show's survival.
details:
  why_it_matters: The sponsorship arrangements decided whether the series could stay on the air in its first year.

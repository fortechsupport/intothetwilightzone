title: '"Twilight zone" as an everyday phrase'
kind: other
subtype: language
relevance: core
description: The show turned "twilight zone" into ordinary English for a strange, dreamlike or in-between state,
  or a situation where normal rules seem suspended. Dictionaries record the sense, headline writers reach for it,
  and the four-note guitar figure from the 1960s theme is hummed as shorthand for anything uncanny. Collecting dated
  examples of the phrase and the theme as a meme in news, politics and pop culture is an open project for this site.

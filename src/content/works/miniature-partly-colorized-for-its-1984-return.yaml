title: '''Miniature'' partly colorized for its 1984 return'
kind: production
subtype: colorization
year: '1984'
creator: CBS; Robert Duvall; Martin Grams Jr. (historian)
description: When the 'Miniature' lawsuit was finally out of the way, CBS showed the episode again in 1984 as part
  of a Twilight Zone anniversary special, more than 20 years after it first aired. Only the dollhouse scenes were
  colorized, a novelty that historian Martin Grams Jr. links to the 1980s fashion for colorization. It is the only
  original episode ever shown with colorization.

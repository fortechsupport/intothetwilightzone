title: 'Twilight Zone: The Movie (expanded edition)'
kind: soundtrack
subtype: score-release
year: 2009
creator: Jerry Goldsmith
publisher: Film Score Monthly
description: >-
  Film Score Monthly's restored, chronological presentation of the full score for all four segments ("Time Out",
  "Kick the Can", "It's a Good Life" and "Nightmare at 20,000 Feet"), with the film's two pop songs ("Nights Are
  Forever" and "Anesthesia") and alternates as bonus tracks. Restored by Mike Matessino and mastered by Bruce Botnick.

title: Planet of the Apes is released (1968)
kind: event
subtype: history
year: 1968
description: Franklin J. Schaffner's Planet of the Apes, adapted from Pierre Boulle's novel, opened in 1968. Serling
  wrote the early drafts, including the Statue of Liberty ending, and shares the screen credit with Michael Wilson,
  who rewrote the script.

title: The Twilight Zone stage play opens at the Almeida (2017)
kind: event
subtype: premiere
year: 2017
description: Anne Washburn's stage adaptation, weaving together several original-series stories by Serling, Charles
  Beaumont and Richard Matheson, had its world premiere at London's Almeida Theatre, directed by Richard Jones.
  It opened in December 2017 and ran to January 27, 2018.

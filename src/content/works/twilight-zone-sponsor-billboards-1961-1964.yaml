title: Original-series sponsor billboards and IDs (1961-1964)
kind: advertisement
year: 1961-1964
description: >-
  Sponsor IDs and 'brought to you by' billboards ran before the first commercial and after the closing credits.
  Accounts posted on TV Obscurities list Liggett & Myers' Chesterfield as primary sponsor in 1961-62 (Serling plugged
  the brand after his next-week preview), Colgate-Palmolive as alternate until early 1962, Carter-Wallace's Arrid
  as a one-week sponsor, and American Tobacco's Pall Mall with Procter & Gamble (Crest, Prell) in 1963-64.
subtype: vintage-ad
details:
  note: Season 1 sponsors (e.g. General Foods, Kimberly-Clark) not verified in this pass.
  people:
  - Rod Serling

title: Rod Serling's The Twilight Zone Magazine launches (1981)
kind: event
subtype: premiere
year: 1981
description: The fiction magazine licensed from Carol Serling launched with its April 1981 issue, edited by T. E.
  D. Klein, and ran until 1989. It published new horror and fantasy by Stephen King and others alongside Twilight
  Zone teleplays and episode guides by Marc Scott Zicree.

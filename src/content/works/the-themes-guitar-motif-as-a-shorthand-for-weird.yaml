title: The theme's guitar motif as a shorthand for 'weird'
kind: cultural-impact
subtype: sound shorthand
year: '1960'
creator: Marius Constant; CBS
description: The repeating guitar figure from Constant's theme, usually hummed as 'doo-doo-doo-doo', has become
  a common way to say that something is uncanny. It is played at pro basketball games, was recorded by the Manhattan
  Transfer, and was listed by TIME in 2010 among television's ten most unforgettable sounds.
details:
  why_it_matters: It is the franchise's most widespread borrowing in everyday culture.

title: '"The Comedian" airs on Playhouse 90 (1957)'
kind: event
subtype: history
year: 1957
description: Serling's "The Comedian," a live drama about a television comedian and the people around him, aired
  on CBS's Playhouse 90 on February 14, 1957. It won Serling his third Emmy, for teleplay writing.

title: Rod Serling's Stories from the Zone
kind: stage
subtype: episode-staging
description: Jeff G. Rack's stage adaptation of two original-series episodes, "Mr. Garrity and the Graves" and "Will the
  Real Martian Please Stand Up?", produced by Theatre 40 with Arcane Theatreworks at the Reuben Cordova Theatre in Beverly
  Hills until 17 February 2019, directed by Rack and Charlie Mount. BroadwayWorld praised the cast. Licence not stated.
  An earlier listing on allaboutthestage.com describes a script collection of this name for school and amateur production;
  that has not been checked against a licensing house.

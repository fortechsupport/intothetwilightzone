year: 2014-2016
creator: Bif Bang Pow! / Zica Toys
description: >-
  A small-scale line in the style of vintage Kenner figures, announced in March 2014 and first sold as Entertainment
  Earth Comic-Con exclusives that July, with accessories such as Bemis's books and the Kanamit's cookbook. Later
  variants included colour and glow-in-the-dark versions.

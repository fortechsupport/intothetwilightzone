title: The Twilight Zone / The Outer Limits (Marius Constant / Harry Lubin)
kind: soundtrack
description: >-
  A Discogs-listed release that pairs Marius Constant's Twilight Zone theme with Harry Lubin's music for The Outer
  Limits, putting the two great 1960s sci-fi anthology themes back to back. Lubin also wrote "Fear", which the Ventures
  covered on Ventures in Space.

description: As checked on 17 November 2026, all five seasons of the original series stream in the US on Paramount+
  (Essential and Premium, also as a Paramount+ channel on Apple TV, Amazon and Roku), and free with ads on Pluto
  TV and Fandango at Home Free. Seasons can be bought from Amazon, Apple TV and Fandango at Home from about $5 each.
  A December 2025 report said the series was leaving Pluto TV, but JustWatch still listed it there in November 2026.

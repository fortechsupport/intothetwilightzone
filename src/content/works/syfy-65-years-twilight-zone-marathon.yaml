title: Syfy's "65 Years of The Twilight Zone" marathon (2024)
kind: event
subtype: marathon
year: 2024
description: Syfy marked the 65th anniversary of the original series (it premiered on CBS on 2 October 1959) with
  a marathon of 65 mostly horror-themed episodes from the morning of Saturday 5 October 2024 into the early hours
  of Monday 7 October. Hour-long fourth-season episodes opened each day's block; "Where Is Everybody?" aired at
  12:30pm on Sunday and the run ended with "One More Pallbearer" and "The Old Man in the Cave".

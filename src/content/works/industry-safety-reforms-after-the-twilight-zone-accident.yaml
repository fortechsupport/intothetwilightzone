title: Industry safety reforms after the Twilight Zone accident
kind: legal
subtype: safety reform
year: '1987'
creator: FAA; California State Fire Marshal; Directors Guild of America; Screen Actors Guild; Warner Bros.
description: The FAA began requiring waivers for low-altitude helicopter filming. In 1987 California's State Fire
  Marshal set up a motion-picture safety program. The DGA and SAG introduced safety bulletins, hotlines and disciplinary
  rules, and Warner Bros. formed safety committees. The Christian Science Monitor reported on the new set-safety
  guidelines while the trial was under way.
details:
  why_it_matters: These reforms are a lasting legacy of the franchise's darkest event.

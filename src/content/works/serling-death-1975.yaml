title: Death of Rod Serling (1975)
kind: event
subtype: history
year: 1975
description: Serling died on June 28, 1975, aged 50, at Strong Memorial Hospital in Rochester, New York, after complications
  from heart bypass surgery following a series of heart attacks. He was buried at Lake View Cemetery in Interlaken,
  New York, near his family's Cayuga Lake cottage.

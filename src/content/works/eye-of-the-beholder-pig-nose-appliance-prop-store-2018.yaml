title: '"Eye of the Beholder" screen-used pig-nose appliance (Prop Store, 2018)'
kind: artwork
year: 1960
creator: William J. Tuttle
publisher: Prop Store (auction)
description: >-
  A thin foam-latex pig-nose appliance by William Tuttle from "Eye of the Beholder," auctioned online by Prop Store
  on Dec. 1, 2018 from the collection of TV-prop collector James Comisar. Comisar had it from Forrest J Ackerman,
  and it had been conserved by the Los Angeles County Museum of Art; press put the expected bidding at around $10,000.
subtype: auction

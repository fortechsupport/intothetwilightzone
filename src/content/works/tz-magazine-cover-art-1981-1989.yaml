title: Rod Serling's The Twilight Zone Magazine cover art (1981-1989)
kind: artwork
year: 1981-1989
publisher: TZ Publications / Montcalm Publishing
description: >-
  The 60-issue magazine (April 1981 to June 1989), edited first by T. E. D. Klein, opened with painted and illustrated
  covers and switched to film stills from October 1983 to boost newsstand sales. Many issues are scanned on the
  Internet Archive and its covers are collected on MovieMags.

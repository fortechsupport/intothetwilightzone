title: Outer Space Suite (CBS library, 1957)
kind: soundtrack
year: 1957
creator: Bernard Herrmann
publisher: CBS
description: >-
  A roughly 25-minute suite of science-fiction mood cues Herrmann recorded for the CBS library in 1957, two years
  before The Twilight Zone. Its cues were tracked into many early episodes and the full suite appears on CD 1 of
  Silva's 40th Anniversary Collection.

description: >-
  Josh Agle, the mid-century-modern painter who works as Shag, made a signed 22 x 39 inch Twilight Zone screen print
  as the first guest-artist release in Dark Hall Mansion's officially licensed Twilight Zone series. It went on sale
  on 29 April 2015 in a standard edition of 150, a variant of 50 and foil editions of 15. He lists it among his
  limited editions for that year.

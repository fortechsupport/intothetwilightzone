title: 'Germany: ''Unwahrscheinliche Geschichten'' and five dubbing waves'
kind: production
subtype: dub
year: '1967'
creator: ZDF; Bayerischer Rundfunk; ProSieben; TV München; Berliner Synchron; Interopa Film; DEFA-Synchron
description: West German television showed one episode in 1961. ZDF then aired 13 episodes in 1967-69, with Joachim
  Cadenbach as the German narrator, and Bavarian TV aired 24 in 1971. ProSieben (1991-92) and TV München (1996-97)
  added more, all under titles such as 'Unwahrscheinliche Geschichten'. In total 129 of the 156 episodes were dubbed
  into German; the hour-long fourth season never was.

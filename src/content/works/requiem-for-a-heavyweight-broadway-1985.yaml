title: Requiem for a Heavyweight (Broadway, 1985)
kind: stage
subtype: serling-play
year: 1985
creator: Rod Serling
description: The stage version of Serling's 1956 Playhouse 90 teleplay, brought to Broadway from the Long Wharf Theatre
  and directed by Arvin Brown, with John Lithgow as the fighter Harlan "Mountain" McClintock and George Segal as his manager
  Maish Resnick. It opened at the Martin Beck Theatre on 7 March 1985 after eight previews and closed on 9 March after three
  performances. Lithgow was nominated for the Tony Award and won the Drama Desk Award for the role.

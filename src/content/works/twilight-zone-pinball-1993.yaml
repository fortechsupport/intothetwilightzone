title: Twilight Zone (pinball)
kind: game
subtype: pinball
year: 1993
creator: Pat Lawlor (lead designer)
publisher: Midway Manufacturing (Bally label)
description: >-
  Midway's widebody pinball machine, sold under the Bally name, conceived by Pat Lawlor and stuffed with references
  to the original series: a Powerfield magnetic mini-playfield, a working gumball machine, a ceramic "Powerball",
  and a slot machine kickout. Widely ranked among the most complex and best-loved pinball machines ever made, it
  is the franchise's best-known game.
details:
  platforms:
  - arcade
  licensed: true
  release: April 1993
  model_number: '50020'
  system: Midway WPC (Fliptronics II)
  players: 1-4
  production: 15,235
  design: Pat Lawlor, Larry DeMar, Ted Estes
  software: Larry DeMar, Ted Estes
  art: John Youssi
  mechanics: John Krutsch
  music: Chris Granner
  sound: Chris Granner, Rich Karstens
  voice: Tim Kitzrow (Rod Serling narration)
  sound_hardware: Yamaha YM2151 + CVSD board (DCS was not ready in time)
  music_note: >-
    Main theme interprets Golden Earring's 1982 song 'Twilight Zone'; George Kooymans reportedly took a machine
    in exchange for the rights
  toys: >-
    Gumball machine, Powerball (white ceramic), clock, Powerfield mini-playfield with Magna-Flips, slot machine,
    player piano, camera, door, Talky Tina, Robby the Robot, Henry Bemis glasses
  people:
  - Pat Lawlor
  - Larry DeMar
  - Ted Estes
  - John Youssi
  - John Krutsch
  - Chris Granner
  - Rich Karstens
  - Tim Kitzrow

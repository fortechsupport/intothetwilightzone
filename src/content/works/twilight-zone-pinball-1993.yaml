title: Twilight Zone (pinball)
kind: game
subtype: pinball
year: 1993
creator: Midway Manufacturing
publisher: Bally
description: 'Midway''s widebody pinball machine, sold under the Bally name, conceived by Pat Lawlor and stuffed
  with references to the original series: a Powerfield magnetic mini-playfield, a working gumball machine, a ceramic
  "Powerball", and a slot machine kickout. Widely ranked among the most complex and best-loved pinball machines
  ever made, it is the franchise''s best-known game.'

description: The series first aired in France in February 1965 on the ORTF's first channel as 'La Quatrième Dimension'.
  It was later rerun on TF1, France 3 and the cable channels Sci Fi and Ciné FX. The French title became so familiar
  that it was reused for the 1983 film and the later revivals.

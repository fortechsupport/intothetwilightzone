title: 'Twilight Zone: The Movie in 1983 college newspapers (library digital collections)'
kind: other
year: 1983
publisher: The Battalion (Texas A&M); The Michigan Daily
description: >-
  Two university newspaper archives have digitized 1983 pages that come up in searches for Twilight Zone: The Movie.
  One is page 5 of Texas A&M's The Battalion for June 23, 1983, the day before the film opened on June 24. The other
  is a page of The Michigan Daily in the Bentley Historical Library's digital archive. Pages like these usually
  carry the local theater ads or a review. Whether each page is a display ad or a review still needs checking.

title: The Twilight Zone interactive pilot (Ken Levine / Interlude, unrealized)
kind: game
year: 2016
creator: Ken Levine (writer-director, announced)
publisher: CBS / Interlude (later Eko)
description: >-
  In April 2016, CBS and interactive-video company Interlude announced a choose-your-path Twilight Zone reboot.
  BioShock creator Ken Levine was to write and direct the interactive pilot, with viewers steering the story. No
  episode was released, and the project faded before the 2019 Jordan Peele revival.

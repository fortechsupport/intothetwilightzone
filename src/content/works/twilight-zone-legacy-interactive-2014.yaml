title: The Twilight Zone (2014 PC game)
kind: game
subtype: video-game
year: 2014
creator: Spark Plug Games
publisher: Legacy Interactive
description: >-
  A casual hidden-object adventure in which the player is a struggling actor trapped as a recurring character in
  a series of Twilight Zone-style stories, recovering script pages to work out their role in each one. It drew its
  scenarios from classic episodes and was released for PC on 17 September 2014.

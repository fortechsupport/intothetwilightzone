title: The Twilight Zone seasons 4-5 opening (door, window, eye, E=mc2)
kind: artwork
year: 1963-1964
publisher: Cayuga Productions / CBS
description: >-
  The final opening is the most often copied. A line in space becomes a spinning door that the viewer passes through
  ('the key of imagination'), followed by a shattering window for the dimension of sound, a floating eye that opens
  for sight, Einstein's E=mc2 for mind, a jointed mannequin for 'shadow and substance', and a ticking clock, before
  particles form the title and rush toward the camera. No designer is credited in the sources consulted.
subtype: title-sequence

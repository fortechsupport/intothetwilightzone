title: 1962 cancellation, Fair Exchange, and the hour-long season 4
kind: production
subtype: cancellation
year: '1963-01-03'
creator: CBS; James Aubrey; Herbert Hirschman
description: Without a sponsor in spring 1962, the show was left off CBS's fall schedule and replaced by the sitcom
  Fair Exchange. When Fair Exchange struggled, CBS brought The Twilight Zone back in January 1963 as an hour-long
  series, starting with 'In His Image'. Serling and others believed the stories had been stretched to fill the longer
  slot.

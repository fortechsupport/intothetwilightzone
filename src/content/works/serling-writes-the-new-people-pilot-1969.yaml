title: Serling writes the pilot for The New People (1969)
kind: event
subtype: history
year: 1969
description: Serling returned to series television in 1969 with the pilot for ABC's The New People, a series that
  ran in the 1969-70 season. The same year the Night Gallery pilot film aired on NBC.

title: 'The Pinball Arcade: Twilight Zone table'
kind: game
subtype: game-appearance
year: 2013
creator: FarSight Studios
publisher: FarSight Studios
description: >-
  FarSight Studios' licensed digital recreation of the 1993 Bally table for The Pinball Arcade, released on 5 February
  2013 for PlayStation 3 and PS Vita and later on other platforms. FarSight ran a 2012 Kickstarter to help pay for
  the Twilight Zone license. The table was delisted in mid-2018 when the Williams/Bally license lapsed.

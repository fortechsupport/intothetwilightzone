title: Season 2 of The Twilight Zone premieres (1960)
kind: event
subtype: premiere
year: 1960
description: The second season opened on September 30, 1960, with "King Nine Will Not Return." It brought the guitar-and-bongo
  theme built from Marius Constant library cues in place of Bernard Herrmann's, and Serling now appeared on camera
  as host. The season ran 29 episodes.

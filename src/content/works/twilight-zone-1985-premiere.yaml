title: The Twilight Zone revival premieres on CBS (1985)
kind: event
subtype: premiere
year: 1985
description: CBS launched the first revival on Friday, September 27, 1985, with "Shatterday" (Bruce Willis) and
  "A Little Peace and Quiet." Episodes often held two or three stories, and writers included Harlan Ellison, Ray
  Bradbury, Stephen King and George R. R. Martin. It ran three seasons, the last in syndication.

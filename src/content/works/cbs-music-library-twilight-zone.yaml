title: CBS Music Library and the Twilight Zone stock-music practice
kind: other
year: 1959-1964
publisher: CBS
description: >-
  Most Twilight Zone episodes were not scored from scratch: music editors 'tracked' them with pre-recorded cues
  from the CBS Music Library, including pieces composers wrote with no particular show in mind and cues bought cheaply
  from European composers through a 'foreign' library. Only about a third of the 156 episodes credited a composer,
  and Wissner (citing James Wierzbicki) counts 17 of 36 credited new scores in season one. Cues from original scores
  like 'Walking Distance' and 'Back There' were then reused in later episodes.
subtype: stock-music-library
details:
  credited_scores: About one-third of 156 episodes credited a composer
  foreign_library: Used to avoid US musicians' union reuse fees
  examples_of_tracked_episodes:
  - One for the Angels
  - Mr. Denton on Doomsday
  people:
  - Lud Gluskin
  - Bernard Herrmann
  - Jerry Goldsmith
  - Fred Steiner
  - Nathan Van Cleave
  - René Garriguenc
  - Lucien Moraweck
  - Marius Constant

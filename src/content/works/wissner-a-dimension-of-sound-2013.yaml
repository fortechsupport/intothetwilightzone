title: 'A Dimension of Sound: Music in The Twilight Zone (Reba A. Wissner, 2013)'
kind: other
year: 2013
creator: Reba A. Wissner
publisher: Pendragon Press / Boydell & Brewer
description: >-
  The only book-length study of the original series' music, published by Pendragon Press and now distributed through
  Boydell & Brewer/Cambridge Core. Chapters cover the CBS stock library and cue reuse, composing and recording practice,
  and the scores of Steiner, Goldsmith, Herrmann and Van Cleave, with an appendix of episode-by-episode cue information.
subtype: book
details:
  chapters:
  - The CBS Stock Music Library and the Reuse of Cues
  - Composing and Recording in The Twilight Zone
  - The Scores of Fred Steiner
  - The Scores of Jerry Goldsmith
  - The Scores of Bernard Herrmann
  - The Scores of Nathan van Cleave
  - Less Frequent Used Composers
  - Episode and Cue Information (appendix)
  people:
  - Reba A. Wissner
relevance: core
research_confidence: high

title: The Twilight Zone premieres on CBS (1959)
kind: event
subtype: premiere
year: 1959
description: The series debuted on Friday, October 2, 1959, at 10 p.m. Eastern on CBS with "Where Is Everybody?",
  starring Earl Holliman as a man alone in an empty town. Serling wrote the episode and narrated in voice-over;
  he did not appear on camera until later in the first season. The original run lasted five seasons and 156 episodes.

title: '''Noon on Doomsday'' rewritten under sponsor pressure'
kind: legal
subtype: censorship
year: '1956-04-25'
creator: Rod Serling; The United States Steel Hour; ABC; U.S. Steel
description: 'Serling wrote ''Noon on Doomsday'' with the murder of Emmett Till in mind. After he mentioned this
  to Daily Variety, the broadcaster was flooded with protests and ordered changes: the story was moved to New England,
  the victim became an unnamed foreigner and every reference to the South was removed, including a Coca-Cola bottle.
  Serling later said this experience was why he turned to allegory.'
details:
  why_it_matters: It is a direct cause of The Twilight Zone's allegorical approach.

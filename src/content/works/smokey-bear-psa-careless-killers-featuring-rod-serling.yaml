title: Smokey Bear PSA 'Careless Killers' featuring Rod Serling
kind: advertisement
subtype: psa
year: '1968'
creator: Rod Serling; U.S. Forest Service; U.S. Department of Agriculture
description: In this fire-prevention public service announcement, Serling narrates the story of family man Ed Morgan,
  who becomes a 'killer' by throwing a lit cigarette from his car window. The National Archives holds the spot in
  Agriculture Department records (NAID 2304), and DocsTeach hosts it.
details:

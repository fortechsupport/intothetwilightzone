title: The Twilight Zone
kind: game
subtype: video-game
year: 1988
creator: Covenant Technologies (developer)
publisher: First Row Software Publishing, Inc. (King of Prussia, PA)
description: 'A licensed text-and-graphics adventure built like a self-contained episode of Serling''s series, with the player typing
    verb-noun commands and stepping between first-person illustrated locations. First Row Software published it in 1988
    for the Amiga and MS-DOS. Sources disagree about the developer: this record''s credits name Covenant Technologies, while
    Entertainment Earth''s history of Twilight Zone collectibles says Gigabit Systems published it for PC. No Atari ST version has been found.'

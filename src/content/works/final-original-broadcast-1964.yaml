title: Last first-run episode of the original series (1964)
kind: event
subtype: broadcast
year: 1964
description: CBS broadcast the last new episode of the original series, "The Bewitchin' Pool," on June 19, 1964.
  CBS did not renew the show; reruns followed that summer and it then went into syndication, where it has rarely
  been off the air.

creator: Rod Serling (adapted for the stage by James Reach)
description: Theatre 40 staged James Reach's stage adaptation of Serling's 1955 teleplay Patterns at the Reuben Cordova
  Theatre in Beverly Hills in August 2015, directed by Jules Aaron, with Daniel Kaemon as Fred Staples, James Schendel as
  Andy Sloane and Richard Hoyt Miller as Mr. Ramsey. StageSceneLA recommended it, with reservations about its length; People's
  World found it well acted but "a bit stagey".

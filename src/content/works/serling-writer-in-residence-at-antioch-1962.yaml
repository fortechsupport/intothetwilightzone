title: Serling returns to Antioch as writer in residence (1962)
kind: event
subtype: history
year: 1962
description: In September 1962, in the months before The Twilight Zone returned as an hour-long series, Serling
  took a one-year post as writer in residence at his old college, Antioch. He wrote the screenplay for Seven Days
  in May there.

title: KTLA's first Twilight Zone marathon (Thanksgiving 1980)
kind: event
subtype: marathon
year: 1980
description: Los Angeles station KTLA ran an eight-hour Twilight Zone marathon on Thanksgiving 1980, which its program
  director later called the station's first; it drew a 16% share. The Thanksgiving marathon did not last, but it
  set the pattern for holiday marathons.

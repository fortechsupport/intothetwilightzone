title: Martin Landau's personal shooting scripts including The Twilight Zone (Profiles in History lot 1183)
kind: other
publisher: Profiles in History
description: >-
  Profiles in History sold Martin Landau's own copies of seven studio scripts for his 1980s television roles
  (1980-87), as lot 1183 of its Icons & Legends of Hollywood auction (sale 997059) on 25 September 2019; the
  catalogue is hosted on Heritage Auctions' site. The one Twilight Zone script is a multi-colour revision-page
  script of "The Beacon" from the 1985 revival, dated 4 October 1985. The others are for Gilligan's Island, Matt
  Houston, Buffalo Bill, Hotel, Murder, She Wrote and Alfred Hitchcock Presents.

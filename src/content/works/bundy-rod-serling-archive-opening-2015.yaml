title: The Rod Serling Archive opens at the Bundy Museum (2015)
kind: event
subtype: exhibition
year: 2015
description: The Bundy Museum of History and Art in Binghamton opened a permanent Rod Serling exhibit in April 2015.
  Displays included the helmet Leonard Nimoy wore in "A Quality of Mercy," a pig-face mask from "Eye of the Beholder,"
  a vintage board game, and photographs and film from Serling's wider career.

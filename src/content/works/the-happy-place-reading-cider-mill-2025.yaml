description: Bold Local Artists of the Southern Tier (BLAST) and the Rod Serling Memorial Foundation gave two fundraising
  readings of Serling's unproduced 1958 pilot script "The Happy Place" at the Cider Mill Playhouse in Endicott, New York,
  on the second weekend of July 2025, directed by Kate Murray, with actors seated at music stands and a narrator reading
  the stage directions.

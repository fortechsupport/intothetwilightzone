title: 'Jerry Goldsmith – Twilight Zone Jazz Themes #1 and #2'
kind: soundtrack
creator: Jerry Goldsmith
description: >-
  Two jazz source cues by Goldsmith written for diegetic use (radios, bars, parties) and dropped into episodes as
  needed; both appear on the Goldsmith disc of the Silva 40th Anniversary Collection, alongside René Garriguenc's
  Jazz Theme #3.

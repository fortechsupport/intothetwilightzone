title: The Forbidden Planet C-57D saucer reused in Twilight Zone episodes
kind: prop
subtype: prop reuse
year: '1959'
creator: MGM; Cayuga Productions
description: The Twilight Zone borrowed MGM's miniatures and full-size set pieces of the Forbidden Planet starship.
  The ship appears most clearly as the spacecraft in 'Death Ship', and saucer footage and props from the film turn
  up in other alien-arrival stories, which saved the show the cost of building its own.
details:
  why_it_matters: These are among the show's most recognizable recurring props.

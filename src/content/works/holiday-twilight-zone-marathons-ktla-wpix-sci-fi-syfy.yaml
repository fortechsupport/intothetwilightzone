title: Holiday Twilight Zone marathons (KTLA, WPIX, Sci-Fi/Syfy)
kind: production
subtype: marathon
year: '1980'
creator: KTLA; WPIX; Sci-Fi Channel / Syfy
description: According to KTLA's program director, Los Angeles station KTLA ran the first known marathon on Thanksgiving
  1980, followed by a July 4 marathon from 1983. New York's WPIX began marathons at about the same time and may
  have been the first to run one on New Year's Eve. The New Year's marathon later moved to Syfy, which billed its
  2016 marathon as the 22nd annual.

title: Combat on Leyte (1944)
kind: event
subtype: history
year: 1944
description: The 511th went into combat on Leyte in the Philippines in late 1944, including about two weeks around
  Hard Rock Hill. Serling was wounded there, including a knee wound that troubled him for the rest of his life,
  and turned 20 on Christmas Day 1944 as the regiment was relieved. Leyte is the setting of his story "First Squad,
  First Platoon."

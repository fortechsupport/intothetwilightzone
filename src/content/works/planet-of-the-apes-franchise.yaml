title: The Planet of the Apes franchise
kind: other
subtype: franchise
year: 1968–
creator: Pierre Boulle (novel); Rod Serling and Michael Wilson (1968 screenplay)
description: The series that grew from the 1968 film Rod Serling co-wrote, whose Statue of Liberty ending was his.
  It spans four sequels (1970–1973), a 1974 live-action TV series and the 1975 animated Return to the Planet of
  the Apes, Tim Burton's 2001 remake, and the reboot films from Rise of the Planet of the Apes (2011) to Kingdom
  of the Planet of the Apes (2024), plus comics, novels and games.

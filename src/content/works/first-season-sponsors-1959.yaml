title: The first season's sponsors (1959)
kind: production
subtype: sponsors
year: 1959
description: General Foods and Kimberly-Clark sponsored the first season. Kimberly-Clark dropped out during the
  season and Colgate-Palmolive replaced it; later seasons were sponsored by, among others, Liggett & Myers (from
  April 1961), Johnson & Johnson (season 4), and American Tobacco and Procter & Gamble (season 5).

title: Rejected season-two replacement themes (Herrmann, Goldsmith, Leith Stevens)
kind: soundtrack
year: 1960
description: >-
  When CBS decided Herrmann's first theme was too gloomy, it commissioned new main titles in 1960: two more from
  Herrmann, plus candidates by Jerry Goldsmith and Leith Stevens. None was used on screen and all went into the
  CBS cue library before Lud Gluskin assembled the Constant theme instead.
subtype: unused-theme

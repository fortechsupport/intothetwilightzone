year: '1963'
creator: Johnson & Johnson; American Tobacco Company; Procter & Gamble
description: Johnson & Johnson sponsored the hour-long fourth season. For the fifth and final season, American Tobacco
  (Pall Mall) and Procter & Gamble alternated as sponsors. In spring 1962 the show had briefly been without a sponsor,
  which is part of why CBS left it off the fall schedule.

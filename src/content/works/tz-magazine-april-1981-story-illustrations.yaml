title: 'Twilight Zone Magazine April 1981: story illustrations'
kind: artwork
year: 1981
publisher: TZ Publications / Montcalm Publishing
description: >-
  Interior illustrations for the first issue: A. G. Metcalf (Harlan Ellison's "Grail"), Jose Reyes (George R. R.
  Martin's "Remembering Melody" and other pieces), Thomas Angell (Joyce Carol Oates's "The Rose Wall"), Robert Neubecker,
  Frances Jetter (Ramsey Campbell), Arthur Somerfield and Randy Jones. The run of the magazine is a showcase of
  early-1980s editorial illustration.

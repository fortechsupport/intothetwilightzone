title: 'Fallout 3: ''Tranquility Lane'' (Vault 112)'
kind: game
year: 2008
creator: Bethesda Game Studios
publisher: Bethesda Softworks
description: >-
  In this quest, the player enters a black-and-white 1950s suburban simulation run by Dr. Stanislaus Braun, who
  appears as a little girl named Betty and torments the trapped residents for fun. Critics and fans widely read
  the sequence as an homage to 'It's a Good Life'.

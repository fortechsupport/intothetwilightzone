title: Rod Serling, Library of Congress lecture on television and the literary artist (1968)
kind: lecture
subtype: lecture
year: 1968
creator: Rod Serling
description: Serling lectured at the Library of Congress on television as a medium for the literary artist. Michigan
  public station WUOM and the Library distributed it as programme 5 of the radio series "Library of Congress Lectures
  II," dated October 4, 1968. The American Archive of Public Broadcasting holds two copies (29:00 and 25:44). Mark
  Olshaker presented this speech at SerlingFest 2025.

title: '"Drama in the Mass Media": Serling''s Antioch College seminar (1962-63)'
kind: lecture
subtype: seminar
year: 1962
creator: Rod Serling
description: 'After the third season, Serling spent about five months as writer-in-residence at his alma mater,
  Antioch College in Yellow Springs, Ohio. He taught a daytime writing class and an evening seminar for about 20
  working writers, "Drama in the Mass Media." Journalist Jeanne Marshall''s 23 pages of typed notes survive, including
  his advice to writers: grab the audience at once, have a point of view, research the background, and keep sentimentality
  out.'

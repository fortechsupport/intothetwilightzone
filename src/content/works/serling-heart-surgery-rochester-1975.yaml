title: Heart surgery in Rochester (1975)
kind: event
subtype: history
year: 1975
description: On June 26, 1975, Serling underwent open-heart surgery at Strong Memorial Hospital in Rochester, New
  York, and had a third heart attack on the operating table. He died two days later, on June 28.

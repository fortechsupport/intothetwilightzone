title: First-season ratings scare and survival
kind: production
subtype: ratings
year: '1959'
creator: CBS; James Aubrey; Rod Serling
description: CBS had hoped for ratings in the low 20s, but early episodes fell short; 'Mr. Denton on Doomsday' drew
  a 16.3. The show got through a November hiatus and went on to beat its ABC and NBC competition. CBS reportedly
  thought about replacing Serling as host with Orson Welles.
details:
  why_it_matters: It shows how close the series came to failing in its first season.

title: Child-labor violations in hiring Myca Dinh Le and Renee Chen
kind: legal
subtype: child labor
year: '1982'
creator: John Landis; George Folsey Jr.; Dan Allingham
description: The production hired the two children without the permits, the on-set teacher-welfare worker or the
  working-hour limits that California law required. The children were filmed late at night near explosives. Landis,
  Folsey and Allingham later admitted they had got around the child-labor rules, although nobody was prosecuted
  for the hiring itself.
details:
  why_it_matters: The breaches of child-labor law were central to the public outcry and to later reforms.

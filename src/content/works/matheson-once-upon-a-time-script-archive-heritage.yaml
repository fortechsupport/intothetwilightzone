title: >-
  Richard Matheson's hand-annotated "Once Upon a Time" script and materials archive (Heritage lot 1990)
kind: other
creator: Richard Matheson
publisher: Heritage Auctions
description: >-
  Heritage Auctions offered Richard Matheson's own typed script for the Twilight Zone episode "Once Upon a Time",
  with his handwritten notes and related materials, as lot 1990 of sale 997042. A companion lot, 1989, offered his
  hand-annotated first-draft teleplay and shooting script for another of his episodes. Fine Books Magazine reported
  in June 2017 that Matheson's annotated Twilight Zone short-story and script collection was coming to auction.
subtype: auction

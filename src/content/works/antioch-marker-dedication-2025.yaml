title: Ohio historical marker for Serling dedicated at Antioch College (2025)
kind: event
subtype: anniversary
year: 2025
description: On October 2, 2025, the 66th anniversary of the series premiere, Ohio Governor Mike DeWine, Antioch
  President Jane Fernandes and Anne Serling dedicated an Ohio historical marker to Serling outside South Hall at
  Antioch College in Yellow Springs. Serling was added to the Ohioana Ohio Literary Trail.

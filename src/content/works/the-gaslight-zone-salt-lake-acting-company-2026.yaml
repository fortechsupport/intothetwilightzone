title: The Gaslight Zone (Salt Lake Acting Company, 2026)
kind: stage
subtype: parody
year: 2026
creator: Olivia Custodio, Austin Archer and Penelope Caywood
description: Salt Lake Acting Company's 2026 summer show, a satire of Utah news framed as a Twilight Zone parody, with sketches
  on "Eye of the Beholder", "It's a Good Life" and "The Monsters Are Due on Maple Street" and Scotty Fletcher as host "Broad
  Sterling". Written by Olivia Custodio and Austin Archer with lyrics by Penelope Caywood and directed by Cynthia Fleming,
  it ran from 24 June to 16 August 2026.

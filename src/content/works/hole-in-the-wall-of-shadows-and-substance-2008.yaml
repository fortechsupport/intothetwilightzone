year: 2008
creator: Rod Serling and George Clayton Johnson (original teleplays)
description: 'A community-theatre evening of four original-series teleplays adapted for the stage, each with its
  own director: "One for the Angels" (Kevin Brownell), "The Obsolete Man" (Christopher "Kit" Webb), "Nothing in
  the Dark" (Mary Ann Kelly) and "It''s a Good Life" (Eugene Tellier). TheaterMania lists the run as 11 July to
  9 August 2008; the listing was republished in 2023, so the year should be rechecked.'

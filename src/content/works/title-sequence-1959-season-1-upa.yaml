title: The Twilight Zone (1959) season 1 opening title sequence
kind: artwork
year: 1959
creator: UPA
publisher: Cayuga Productions / CBS
description: >-
  The first opening, used for most of season one, is about 40 seconds of slow, stark black-and-white animation produced
  by the UPA studio. It is set to Bernard Herrmann's theme, with Serling reading the 'There is a fifth dimension
  beyond that which is known to man' narration. Fans describe it as more somber and mysterious than the later openings,
  and it was replaced near the end of the season, the first of about six distinct openings over the run.

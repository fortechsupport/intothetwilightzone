title: Serling marries Carol Kramer (1948)
kind: event
subtype: history
year: 1948
description: Serling married Carolyn Louise "Carol" Kramer, a fellow Antioch student, on July 31, 1948, in a Unitarian
  ceremony. They had two daughters, Jodi and Anne, and Carol later spent decades looking after his legacy.

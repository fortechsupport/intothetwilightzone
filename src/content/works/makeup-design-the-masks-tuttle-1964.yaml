title: '"The Masks" grotesque masks by William Tuttle'
kind: artwork
year: 1964
creator: William J. Tuttle
description: >-
  Tuttle's masks for the season 5 episode in which a dying man makes his greedy heirs wear grotesque masks at a
  Mardi Gras party, only for their faces to have taken the masks' shape when they come off. Episode director Ida
  Lupino made it the only original-series episode directed by a woman.

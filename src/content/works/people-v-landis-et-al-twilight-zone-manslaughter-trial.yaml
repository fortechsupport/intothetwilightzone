title: People v. Landis et al. (Twilight Zone manslaughter trial)
kind: legal
subtype: criminal trial
year: '1987-05-29'
creator: John Landis; George Folsey Jr.; Dan Allingham; Dorcey Wingo; Paul Stewart; Deputy DA Lea Purwin D'Agostino
description: Director John Landis, associate producer George Folsey Jr., production manager Dan Allingham, helicopter
  pilot Dorcey Wingo and explosives specialist Paul Stewart were charged with involuntary manslaughter over the
  deaths of Vic Morrow, Myca Dinh Le and Renee Shin-Yi Chen. After a ten-month trial in Los Angeles in 1986-87,
  prosecuted by Lea Purwin D'Agostino, a jury acquitted all five in May 1987. The defense argued that the explosion
  that brought down the helicopter could not have been foreseen.
details:
  why_it_matters: It is the most consequential legal case in the franchise's history and among Hollywood's most
    notable criminal trials.

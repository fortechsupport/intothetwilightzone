title: Original 'Eye of the Beholder' pig-face mask at auction
kind: prop
subtype: auction
year: '2018-11'
creator: William Tuttle (makeup designer); auction consignor
description: In late 2018 an original prosthetic mask from 'Eye of the Beholder', one of William Tuttle's pig-like
  faces for the hospital staff, went up for auction. It drew coverage from Gizmodo, CBC Radio's As It Happens and
  HuffPost. Masks from the episode rarely survive and are among the most sought-after Twilight Zone props.

title: 'The Twilight Zone: Binghamton''s Rod Serling Experience (escape room)'
kind: attraction
subtype: experience
year: 2018
creator: Southern Tier Independence Center (STIC)
description: A 90-minute accessible escape room themed on the series, run to raise money for a disability-services
  nonprofit. Local press covered its opening in June 2018. The puzzle uses the voice of actor Stephen Dexter, who plays Rod Serling for the
  Rod Serling Memorial Foundation, which called it "the only one of its kind in the world"
  (October 2019). No source says it is licensed by CBS.

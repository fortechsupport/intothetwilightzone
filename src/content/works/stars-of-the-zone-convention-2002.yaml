title: Stars of the Zone Convention (2002)
kind: convention
subtype: convention
year: 2002
creator: Ray and Sharon Courts and Andrew Szym, with co-coordinator Bill DeVoe
description: Billed as the first convention of its kind, this weekend gathering brought together close to sixty
  actors from the original series. Writers George Clayton Johnson and Earl Hamner Jr. and directors James Sheldon
  and Elliot Silverstein also took part, alongside panels, autograph tables and a dinner.

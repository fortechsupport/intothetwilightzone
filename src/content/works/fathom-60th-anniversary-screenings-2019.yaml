title: 'The Twilight Zone: A 60th Anniversary Celebration in cinemas (2019)'
kind: event
subtype: anniversary
year: 2019
description: 'Fathom Events and CBS Home Entertainment showed six restored episodes in more than 600 US cinemas
  for one night, Thursday, November 14, 2019: "Walking Distance," "Time Enough at Last," "The Invaders," "The Monsters

title: The Twilight Zone Live (Theater Schmeater)
kind: stage
subtype: episode-staging
creator: Rod Serling and series writers (original teleplays)
description: A long-running Seattle staple that stages three original teleplays each edition as live theatre. Press in 2016
  described it as turning twenty-four, which dates it to the early 1990s. In April 2012 it played at A Contemporary Theatre
  (ACT) as part of ACT's Central Heating Lab, directed by co-founder Tim Moore. Licence not stated.

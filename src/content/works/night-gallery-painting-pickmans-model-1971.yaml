title: 'Night Gallery painting: "Pickman''s Model"'
kind: artwork
year: 1971
creator: Thomas J. Wright
publisher: Universal Television
description: >-
  "Pickman's Model," adapted from H. P. Lovecraft, was the only Night Gallery script that described its painting,
  so the canvas follows the story's description of the ghoul instead of being Wright's free interpretation. It is
  among the paintings shown in the TV Time Machine interview with Tom Wright.

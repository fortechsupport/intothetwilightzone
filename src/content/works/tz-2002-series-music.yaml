title: The Twilight Zone (2002-2003) – series music
kind: soundtrack
year: 2002-2003
description: >-
  The UPN revival, hosted by Forest Whitaker, ran for one season of 43 episodes. Its music department was Mark Snow
  (series composer), Jonathan Davis (theme arrangement and performance) and Stuart Goetz (music editor), with Marius
  Constant credited for the original theme. No score album appears to have been released. Davis's theme is the only
  music from the series that is widely circulated.
subtype: series-score

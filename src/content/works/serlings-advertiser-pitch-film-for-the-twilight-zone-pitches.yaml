description: Before the premiere, Serling made on-camera presentations selling the series to advertisers, calling
  it a 'product'. A clip of these pitches was later included as a bonus on the Panasonic interactive 'Treasures
  of the Twilight Zone' disc. The Rod Serling Memorial Foundation discusses the clip in an article on Serling's
  move into commercial television.

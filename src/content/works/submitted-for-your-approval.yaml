title: '''Submitted for your approval'''
kind: cultural-impact
subtype: catchphrase
year: '1962'
creator: Rod Serling
description: 'Although it is the phrase most associated with Serling, he says it word for word in only three episodes:
  ''Cavender Is Coming'', ''In Praise of Pip'' and ''A Kind of a Stopwatch''. Close variants such as ''for your
  consideration'' appear elsewhere, and he says ''in just a moment'' far more often. The phrase is now a standard
  opener for parodies and for anyone imitating Serling.'
details:

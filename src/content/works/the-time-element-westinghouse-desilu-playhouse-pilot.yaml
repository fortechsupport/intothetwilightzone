title: '''The Time Element'' (Westinghouse Desilu Playhouse pilot)'
kind: production
subtype: pilot
year: '1958-11-24'
creator: Rod Serling; Bert Granet; Desilu; CBS; Westinghouse
description: Serling's 1957 pitch was a time-travel story about a man who keeps dreaming he is in Honolulu just
  before the attack on Pearl Harbor and cannot get anyone to listen to his warnings. CBS turned it down, but producer
  Bert Granet made it as an episode of Westinghouse Desilu Playhouse. Strong viewer response helped persuade CBS
  to order the series. It is included as a bonus on the Season 1 Blu-ray.
details:
  why_it_matters: It is the unofficial pilot that led to the series.

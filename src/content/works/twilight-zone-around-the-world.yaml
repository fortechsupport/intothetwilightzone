title: 'The Twilight Zone around the world: local titles'
kind: television
subtype: international
relevance: core
description: The original series was dubbed and broadcast far beyond the United States under local titles, several
  of which became household phrases in their own languages, much as "twilight zone" did in English. The titles below
  are the ones used for the 1959 series in each market; later revivals often reused them.
details:
  titles:
    France: La Quatrième Dimension
    Italy: Ai confini della realtà
    Spain: En los límites de la realidad
    Germany: Unwahrscheinliche Geschichten
    Brazil: Além da Imaginação
  still_to_research: First broadcast dates and channels per country; Latin American Spanish, Japanese, Scandinavian
    and Eastern European titles.

title: Herrmann's "Moat Farm Murder" cues in The Twilight Zone
kind: soundtrack
year: 1946
creator: Bernard Herrmann
publisher: CBS Music Library
description: >-
  Bernard Herrmann scored "The Moat Farm Murder", a 1946 Mercury Summer Theatre broadcast starring Orson Welles,
  for CBS radio. The music went into the CBS stock library and was later cut into Twilight Zone episodes. Reba Wissner
  (Music, Sound and the Moving Image, 2017) traces the cues to eleven episodes and notes that Robert Drasnin compiled
  the stock scores for three of them.
subtype: library-cue
details:
  stat: Per Wissner, 57 of 156 episodes used either an original score or at least one Herrmann stock cue.
  people:

title: Grateful Dead – Twilight Zone sessions (February 1985)
kind: soundtrack
year: 1985
creator: Merl Saunders & the Grateful Dead
description: >-
  Early in 1985 Merl Saunders and the Grateful Dead recorded the new main title and a library of moody cues for
  the CBS revival at the band's Front Street warehouse in San Rafael, with Bob Bralove handling synths and MIDI
  and Mickey Hart building sound effects. The Grateful Dead Archive Online catalogues the session as an item; resulting
  suites were used in episodes such as 'Nightcrawlers', 'I of Newton', 'Children's Zoo', 'But Can She Type?', 'The
  Shadow Man', 'The Misfortune Cookie' and 'Kentucky Rye'.

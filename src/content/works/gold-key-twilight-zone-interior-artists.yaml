title: 'Gold Key Twilight Zone comics: notable artists'
kind: artwork
year: 1962-1982
publisher: Gold Key / Whitman
description: >-
  Besides George Wilson's painted covers, the Gold Key/Whitman Twilight Zone comic drew on notable artists including
  Reed Crandall, George Evans, Al Williamson, Joe Orlando, Alex Toth and a young Frank Miller, plus Nevio Zeccara
  (seen on a Rod Serling host panel in #18). Sources do not always say who did covers and who did interiors.

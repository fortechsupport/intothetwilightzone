title: Cayuga Productions
kind: production
subtype: production company
year: '1959'
creator: Rod Serling; CBS; MGM
description: Serling set up Cayuga Productions to make The Twilight Zone and named it after Cayuga Lake in upstate
  New York, where his family spent summers. The company co-owned the series with CBS and had its offices at MGM.
  It was effectively wound up after the fifth season, once Serling had sold his interest to CBS.

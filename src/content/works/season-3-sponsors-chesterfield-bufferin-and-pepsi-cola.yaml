creator: Liggett & Myers (Chesterfield); Bristol-Myers (Bufferin); Pepsi-Cola; Colgate-Palmolive; Carter-Wallace
description: During the 1961-62 season, Chesterfield cigarettes were the main sponsor, with Bufferin and Pepsi-Cola
  also buying time. A commenter on TV Obscurities recalls that Colgate-Palmolive left as alternate sponsor early
  in 1962 and that Carter-Wallace's Arrid deodorant covered at least one week.

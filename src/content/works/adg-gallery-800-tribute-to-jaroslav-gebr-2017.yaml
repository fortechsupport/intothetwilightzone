title: A Tribute to Jaroslav Gebr (Art Directors Guild Gallery 800)
kind: artwork
year: 2017
publisher: Art Directors Guild
description: >-
  A 2017 exhibition at the Art Directors Guild's Gallery 800 in North Hollywood honoring Jaroslav Gebr, the Czech-born
  scenic artist who led Universal's scenic art department for about 30 years. His career ran from murals for Fantastic
  Voyage and the Sistine Chapel portraits in The Shoes of the Fisherman to key paintings for Night Gallery.

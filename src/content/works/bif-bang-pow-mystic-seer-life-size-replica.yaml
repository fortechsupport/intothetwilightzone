title: The Twilight Zone Mystic Seer Life-Size Prop Replica
kind: collectible
subtype: prop-replica
creator: Bif Bang Pow!
description: >-
  A full-size polystone and steel copy of the diner fortune machine, with a bobbling head, a coin slot that dispenses
  fortunes and the napkin and menu holders seen on screen. It came in several numbered editions, including one signed
  by William Shatner.
details:
  line: The Twilight Zone prop replicas
  series: The Twilight Zone (1959) - "Nick of Time"
  items:
  - Red devil head (limited to 600)
  - Cream devil head (limited to 300)
  - William Shatner signature edition (limited to 100)
  - Glow-in-the-dark edition
  licensed: true
  versions:
    BBP05008: cream head
    BBP05008BW: black and white
    BBP05008R: red head
    BBP05008LE: signature edition
    BBP05008RS: red, William Shatner signature edition
    BBP05008ALTB: 1:1 signature edition bundle, EE exclusive

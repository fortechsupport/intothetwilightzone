title: 'Twilight Zone: Rod Serling''s Lost Classics airs (1994)'
kind: event
subtype: premiere
year: 1994
description: 'CBS aired a TV movie of two unproduced Serling stories on May 19, 1994: "The Theatre," finished by
  Richard Matheson from Serling''s outline, and "Where the Dead Are," from a completed Serling script. James Earl
  Jones hosted.'

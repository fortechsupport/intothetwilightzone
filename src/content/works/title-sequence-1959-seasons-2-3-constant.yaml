title: The Twilight Zone seasons 2-3 opening (Marius Constant theme)
kind: artwork
year: 1960-1962
publisher: Cayuga Productions / CBS
description: >-
  From the second season the series used a new opening built around Marius Constant's guitar-and-bongo theme, the
  one now known around the world, with Serling's revised 'You're traveling through another dimension' narration.
  Art of the Title files the original series under Constant's theme and lists the main title as 1950s mixed-media
  animation and live action in black and white.
subtype: title-sequence

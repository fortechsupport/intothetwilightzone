year: 2025
description: The Rod Serling Memorial Foundation's festival marked 50 years since Serling's death, September 19-21,
  2025, at the Forum Theatre and Recreation Park in Binghamton. Frank Spotnitz gave the keynote; Mark Olshaker presented
  a Serling speech given at the Library of Congress; Joseph Dougherty, David Bianculli, Anne Serling and Mark Dawidziak
  spoke; Jonah Tulis previewed his documentary "Serling."

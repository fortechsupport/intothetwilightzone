description: >-
  The first commercial release of the revival's music, gathering the main and end titles with the band's and Saunders'
  cues for segments such as "Nightcrawlers", "I of Newton", "The Shadow Man" and "The Misfortune Cookie", plus a
  three-part "Kentucky Rye" suite. Huey Lewis guests on harmonica on the "Nightcrawlers" suite.

title: Serling's evening Twilight Zone screenings at Ithaca College (late 1960s)
kind: lecture
subtype: class
year: 1967
creator: Rod Serling
description: Former students recall Serling introducing Twilight Zone episodes in an Ithaca College lecture hall
  in the evenings, setting assignments, taking questions and sometimes re-running an episode with his own commentary.
  He told one group that "Walking Distance" was partly autobiographical, inspired by a visit to Binghamton's Recreation
  Park.

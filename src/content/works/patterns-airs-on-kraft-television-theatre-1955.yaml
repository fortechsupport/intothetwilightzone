title: '"Patterns" airs live on Kraft Television Theatre (1955)'
kind: event
subtype: history
year: 1955
description: Serling's boardroom drama "Patterns" aired live on NBC's Kraft Television Theatre on January 12, 1955,
  and made him famous almost overnight. Demand was so strong that it was performed live again about a month later,
  and it won him his first Emmy.

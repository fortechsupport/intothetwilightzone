title: The original Talky Tina doll
kind: prop
subtype: original prop
year: '1963'
creator: June Foray (voice); Vogue Dolls (Brikette, reported base doll)
description: Talky Tina in 'Living Doll' is widely reported to have been a modified version of Vogue's 'Brikette'
  doll, with June Foray, voice of the Chatty Cathy toy, providing its voice. Doll collectors' blogs track surviving
  Brikettes for this reason, but the fate of the screen-used doll is not publicly documented.

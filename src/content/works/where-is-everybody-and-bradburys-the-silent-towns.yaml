title: '''Where Is Everybody?'' and Bradbury''s ''The Silent Towns'''
kind: legal
subtype: credit dispute
year: '1959'
creator: Rod Serling; Ray Bradbury; Carol Serling
description: Carol Serling noticed that the pilot episode resembled Ray Bradbury's 'The Silent Towns' from The Martian
  Chronicles. Serling admitted he had borrowed from it without meaning to and offered to pay for the rights. Bradbury
  said an acknowledgment was enough, and no payment ever followed. The episode is often cited in discussions of
  the strained relationship between the two writers.
details:
  why_it_matters: It is the best-documented dispute over the source of a story in the series.

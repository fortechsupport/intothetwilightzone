description: Shattered Globe Theatre staged Serling's Requiem for a Heavyweight at the Victory Gardens Greenhouse in Chicago
  in early 2008, directed by Lou Contey, with Sean Sullivan as the broken boxer. Windy City Times praised it as "gritty
  realism at its grittiest". The review does not say whose stage version was used or how it was licensed.

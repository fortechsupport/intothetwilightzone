title: Night Gallery pilot painting for "The Cemetery"
kind: artwork
year: 1969
creator: Jaroslav Gebr
publisher: Universal Television
description: >-
  The changing painting of a house and graveyard at the heart of "The Cemetery," the first story of the 1969 Night
  Gallery TV-movie pilot. Black Gate's review of the Art of Darkness book credits the pilot painting to Universal
  scenic artist Jaroslav Gebr, who was not available when the show went to series. Its imagery, which changes over
  the story, made the gallery canvas part of the plot rather than just an introduction.
subtype: night-gallery-painting
details:
  segment: The Cemetery (Night Gallery pilot, 1969)
  note: >-
    SYFY Wire credits Gebr specifically with the Escape Route painting; sources differ on how many pilot paintings
    he made.
  people:
  - Jaroslav Gebr
  - Rod Serling

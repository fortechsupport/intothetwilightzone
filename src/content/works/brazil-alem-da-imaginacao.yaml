year: '1961-05'
creator: TV Record; TV Tupi; TV Bandeirantes; TV Gazeta; SBT; Gravasom; TV Cine Som; VTI Rio
description: The series premiered in São Paulo on TV Record in May 1961, on Tuesday nights, sponsored by Simca Chambord
  cars. It later ran on Tupi, Bandeirantes, Gazeta and SBT. Several studios dubbed it over the years, and the third
  and fifth seasons were not shown in Brazil until cable channel Canal USA aired them in 1998.

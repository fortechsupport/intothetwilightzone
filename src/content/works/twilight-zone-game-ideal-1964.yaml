title: The Twilight Zone Game
kind: game
subtype: board-game
year: 1964
publisher: Ideal Toy Company
description: >-
  Ideal Toy Company's licensed roll-and-move style board game, played with a three-ring spinner instead of dice.
  Players race coloured pawns from the centre of the board along a maze called the Road to Reality to reach their
  home corner. Blocking cards, an "eye" result that sends you onto a rival's longer path, and Hand of Destiny spaces
  add unpredictable twists. It is generally cited as the first Twilight Zone merchandise game.
details:

title: Final cancellation by CBS
kind: production
subtype: cancellation
year: '1964-01'
creator: CBS; James Aubrey; Rod Serling; William Froug
description: In late January 1964 CBS announced it would not renew the series. Producer William Froug said network
  president James Aubrey blamed high costs and weak ratings. Serling joked that he had 'decided to cancel the network'.
  The last first-run episode aired on June 19, 1964.

title: The Serling family moves to Binghamton (1926)
kind: event
subtype: history
year: 1926
description: When Rod was about two, the family moved to Binghamton, New York, where his father Sam ran a grocery.
  Serling grew up there and returned to it again and again in his writing, most famously in the small-town nostalgia
  of "Walking Distance."

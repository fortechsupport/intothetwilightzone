title: Serling appears on camera for the first time (1960)
kind: production
subtype: broadcast
year: 1960
description: Serling did not appear on screen in the first season until its last episode, "A World of His Own" (July
  1, 1960), in which he steps into the story himself. From the second season on he introduced episodes on camera,
  the image of the show that endures.

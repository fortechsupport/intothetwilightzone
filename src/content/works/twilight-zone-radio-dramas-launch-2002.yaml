title: The Twilight Zone Radio Dramas launch (2002)
kind: event
subtype: premiere
year: 2002
description: Falcon Picture Group began releasing and syndicating full-cast audio adaptations of the original episodes
  in 2002, produced by Carl Amari under license, with Stacy Keach taking Serling's narrating role. The series ran
  to about 176 episodes by 2012.

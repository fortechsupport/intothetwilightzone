title: '''The Encounter'' withheld from syndication until 2016'
kind: production
subtype: withheld episode
year: '2016'
creator: George Takei; Neville Brand; CBS; Syfy
description: In this fifth-season two-hander, a Japanese-American gardener played by George Takei and a WWII veteran
  played by Neville Brand confront each other in an attic. After complaints about how the episode portrayed Japanese
  Americans and Pearl Harbor, it was withheld from syndication. Its first TV airing since 1964 was on Syfy in 2016,
  and it is now on streaming services.
details:
  why_it_matters: It is the series' best-known withheld episode.

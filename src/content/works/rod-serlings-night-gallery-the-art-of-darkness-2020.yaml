title: 'Rod Serling''s Night Gallery: The Art of Darkness (book)'
kind: artwork
year: 2020
creator: Scott Skelton and Jim Benson
publisher: Creature Features
description: >-
  An oversized 304-page art book by Night Gallery historians Scott Skelton and Jim Benson, published by Creature
  Features (Taylor White) after a crowdfunding campaign, with a foreword by Anne Serling and an introduction by
  Guillermo del Toro. It reproduces all of the series' roughly 101 paintings in full color, one per page, each opposite
  Serling's on-air introduction and notes on how it was made, using Universal's help where originals could not be
  found. It shipped in December 2020 in hardcover ($95) and softcover ($75).

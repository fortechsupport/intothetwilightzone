title: Twilight Zone pinball home ROM (L-9.4H)
kind: game
creator: Ted Estes
description: >-
  A home-use version of the Twilight Zone pinball software by original programmer Ted Estes, meant for free-play
  machines only. It adds a 'Lost in the Zone' practice round, an extra multiball start mode and a pause of up to
  15 minutes. Separately, Estes fixed bugs in the standard ROMs without changing the rules.
subtype: pinball-software

title: Celebrity staged reading of "The Masks" (Paley Center, 2009)
kind: stage
subtype: live-reading
year: 2009
creator: Rod Serling
description: A 50th-anniversary celebrity staged reading of the season five episode at the Paley Center for Media, directed
  by Antony Marsellis, with Lucie Arnaz, Fritz Weaver, Robert Walden, Laurence Luckinbill, Katharine Luckinbill and Jeremy
  Hollingworth and Michael Citriniti as narrator. A recording of Serling gave the opening and closing narration, and Anne
  Serling-Sutton read from her memoir.

title: Syndication and the 'lost five' episodes
kind: production
subtype: syndication
year: '1964'
creator: CBS Films / CBS Enterprises; WPIX; KTLA
description: 'After its CBS run the series became a staple of local syndication. New York''s WPIX, for example,
  showed it weeknights at midnight from the early 1970s. Five episodes were left out of the package: ''Miniature'',
  ''Sounds and Silences'' and ''A Short Drink From a Certain Fountain'' because of legal claims, ''An Occurrence
  at Owl Creek Bridge'' because of its limited licence, and ''The Encounter'' because of complaints. Serling disliked
  how syndicated prints were cut down to fit in more commercials.'

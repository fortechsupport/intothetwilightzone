title: '"Rod Serling: Before The Twilight Zone" (Everson Museum of Art, 2024)'
kind: lecture
subtype: lecture
description: A free lecture and screening at the Everson Museum of Art in Syracuse, the city where Serling was born,
  for his centennial. A SUNY Oswego computer science professor introduced and screened "Patterns", Serling's Emmy-winning
  1955 Kraft Television Theatre drama about a ruthless corporate succession. It was presented with the Rod Serling
  Memorial Foundation and SUNY Oswego as part of the museum's Pay What You Wish evenings.

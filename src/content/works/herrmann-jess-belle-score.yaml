title: '"Jess-Belle" (1963) – Bernard Herrmann original score'
kind: soundtrack
year: 1963
creator: Bernard Herrmann
description: >-
  The hour-long fourth-season witchcraft story set in Appalachia, written by Earl Hamner Jr. and starring Anne Francis.
  It is usually listed among Bernard Herrmann's original Twilight Zone scores, which fits its folk-tinged setting.
  The search that turned up the episode also turned up the 45worlds page for the fifth Varèse LP (STV 81205), but
  this session could not confirm the credit or whether the score is on that album.

title: Serling's first script on national radio (1949)
kind: event
subtype: history
year: 1949
description: On September 10, 1949, "Hop Off the Express and Grab a Local" became the first Serling script broadcast
  on a national network. A script he wrote for the radio series Dr. Christian followed on November 30, 1949, still
  while he was an Antioch student.

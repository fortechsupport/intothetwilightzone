title: Night Gallery pilot painting for "The Escape Route" (Jaroslav Gebr)
kind: artwork
year: 1969
creator: Jaroslav Gebr
publisher: Universal Television
description: >-
  Painting by Jaroslav Gebr for "The Escape Route," the pilot segment in which a fugitive Nazi war criminal tries
  to will himself into a museum painting. According to Night Gallery historian Scott Skelton, the faces Gebr had
  seen at Dachau and in hospitals treating Holocaust survivors after the war shaped the work. The original is now
  owned by filmmaker Guillermo del Toro.

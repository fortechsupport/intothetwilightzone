bio: >-
  J.D. Feigelson wrote and directed two episodes of the 1985 Twilight Zone revival: "The Burning Man," his adaptation
  of a Ray Bradbury story, and "The Little People of Killany Woods." He is best known as the writer of the 1981
  TV horror film Dark Night of the Scarecrow. The site credits him as both "J.D. Feigelson" and "J. D. Feigelson."

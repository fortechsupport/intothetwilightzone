name: John McLiam
roles:
- actor
born: '1918-01-24'
died: '1994-04-16'
bio: >-
  John McLiam played the apartment superintendent who abandons the building as the Earth falls toward the sun in
  Rod Serling's "The Midnight Sun" (1961). A Canadian-born character actor and playwright, he played the murdered
  farmer Herbert Clutter in In Cold Blood (1967) and appeared in First Blood and many westerns.

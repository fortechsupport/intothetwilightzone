bio: >-
  Rob Bottin designed the special makeup and creature effects for Joe Dante's It's a Good Life segment of Twilight
  Zone: The Movie (1983), including the cartoon monsters that Anthony conjures. He had worked with Dante on The
  Howling and created the creature effects of John Carpenter's The Thing. He later did RoboCop and Total Recall,
  which earned him a special achievement Academy Award.

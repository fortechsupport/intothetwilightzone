tz_credits:
- series: The Twilight Zone (1959)
  work: series
  role: supervisor, season 1 title sequence (UPA)
bio: >-
  Herb Klynn was in charge of the UPA project that produced the first-season title sequence of the original Twilight
  Zone. A designer and production executive at UPA, he later co-founded Format Films, which made television cartoons
  and theatrical shorts in the 1960s. The sequence was made under UPA head Stephen Bosustow.

bio: >-
  Alex March directed four episodes of Rod Serling's western The Loner (1965-66), including the premiere "An Echo
  of Bugles" and the series finale "To Hang a Dead Man." He came from New York live television, where he produced
  and directed anthology drama, and later directed the features Paper Lion (1968) and The Big Bounce (1969).

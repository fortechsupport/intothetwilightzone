bio: >-
  Andrew McCarthy was a core member of the 1980s Brat Pack in Pretty in Pink and St. Elmo's Fire, later
  becoming a television director and an award-winning travel writer. He starred in "The Monsters Are on
  Maple Street," the 2002 series' updating of Rod Serling's classic tale of neighborly suspicion.

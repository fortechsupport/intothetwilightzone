bio: >-
  Tim Russ appeared in two segments of the 1985 revival: "Kentucky Rye" (1985), about a drunk driver trapped in
  a ghostly bar, and "Voices in the Earth" (1987). He is best known as the Vulcan security officer Tuvok on Star
  Trek: Voyager.

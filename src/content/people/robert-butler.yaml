born: '1927-11-16'
died: '2023'
bio: >-
  Robert Butler directed two fifth-season episodes, "Caesar and Me" and "The Encounter" (1964), the George Takei
  and Neville Brand two-hander later withheld from syndication. He went on to direct pilots for many landmark series,
  including Star Trek's original pilot "The Cage," Batman, Hill Street Blues (for which he won an Emmy), Moonlighting
  and Lois & Clark, and co-created Remington Steele.

name: Bartlett Robinson
born: '1912-12-09'
died: '1986-03-26'
roles:
- actor
bio: >-
  Bartlett Robinson was in the cast of The Time Element (1958), Rod Serling's Desilu Playhouse drama about a man
  who dreams himself back to Pearl Harbor, the production that convinced CBS to buy The Twilight Zone. A radio veteran
  who played Perry Mason on the air, he became a steady supporting player in television dramas and westerns of the
  1950s and 60s.

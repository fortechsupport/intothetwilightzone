name: John McGiver
roles:
- actor
born: '1913-11-05'
died: '1975-09-09'
bio: >-
  John McGiver starred as Roswell G. Flemington, the bellowing navy enthusiast who is cursed with unbearable hearing,
  in "Sounds and Silences" (1964), and played the television executive in "The Bard" (1963). A former schoolteacher
  with a distinctive owlish manner, he played the Tiffany's clerk in Breakfast at Tiffany's and appeared in The
  Manchurian Candidate.

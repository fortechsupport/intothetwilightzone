bio: >-
  Louis Gossett Jr., also credited as Lou Gossett Jr., won an Emmy for Roots (1977) and became the first Black man
  to win the Academy Award for Best Supporting Actor, as the drill sergeant in An Officer and a Gentleman (1982). He
  also starred in Enemy Mine and the Iron Eagle films. He voiced the leads in the radio dramas "Probe 7, Over and
  Out" and "Steel."

bio: >-
  Louis Gossett Jr. won an Emmy for Roots and became the first Black actor to win the Academy Award for
  Best Supporting Actor, for An Officer and a Gentleman. He voiced the leads in the radio dramas "Probe
  7, Over and Out" and "Steel."

bio: >-
  Peter Kuran worked on the visual effects for George Miller's Nightmare at 20,000 Feet segment of Twilight Zone:
  The Movie (1983) through his optical effects company. He had been an animator on Star Wars and later made documentaries
  about nuclear testing, including Trinity and Beyond.

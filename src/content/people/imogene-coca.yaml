name: Imogene Coca
born: '1908-11-18'
died: '2001-06-02'
roles:
- actor
bio: >-
  Imogene Coca starred opposite King Donovan, her husband, in "The Merciful" (1971), a short Night Gallery segment
  about a wife who bricks her husband into the cellar. She won an Emmy as Sid Caesar's partner on Your Show of Shows,
  and later played Aunt Edna in National Lampoon's Vacation.

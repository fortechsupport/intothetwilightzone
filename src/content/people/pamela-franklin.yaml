born: '1950-02-03'
bio: >-
  Pamela Franklin played the medium Florence Tanner in The Legend of Hell House (1973), scripted by Richard Matheson
  from his novel Hell House. She made her debut as Flora in The Innocents (1961) and appeared in The Prime of Miss
  Jean Brodie and The Food of the Gods.

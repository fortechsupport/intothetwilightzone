name: James Gregory
roles:
- actor
born: '1911-12-23'
died: '2002-09-16'
bio: >-
  James Gregory played the Air Force general who explains Mike Ferris's ordeal in the series premiere, "Where Is
  Everybody?" (1959), and the wounded Confederate sergeant in "The Passersby" (1961). He also appeared in Night
  Gallery's "Stop Killing Me" and in "A Question of Guilt" on Serling's The Loner. He played Senator Iselin in The
  Manchurian Candidate and Inspector Luger on Barney Miller.

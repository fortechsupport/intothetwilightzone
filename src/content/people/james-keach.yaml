born: '1947-12-07'
bio: >-
  James Keach voiced roles in The Twilight Zone Radio Dramas, including "The Fear" and "The Lateness of the Hour."
  The younger brother of Stacy Keach, he acted in The Long Riders, which he co-wrote, directed episodes of Dr. Quinn,
  Medicine Woman, and produced Walk the Line (2005).

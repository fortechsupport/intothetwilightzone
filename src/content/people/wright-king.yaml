name: Wright King
roles:
- actor
born: '1923-01-11'
died: '2018-11-25'
bio: >-
  Wright King played the reporter Paul Carson in "Shadow Play" (1961), the story of a condemned man who insists
  the world around him is his recurring dream, and returned as the janitor Hecate in "Of Late I Think of Cliffordville"
  (1963). He was a regular as Jason Nichols on Wanted Dead or Alive with Steve McQueen and appeared in A Streetcar
  Named Desire (1951) and as Dr. Galen in Planet of the Apes (1968).

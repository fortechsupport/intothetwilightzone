bio: >-
  David Birney appeared in "Tooth and Consequences" (1986), a revival comedy about a miserable dentist and the Tooth
  Fairy. He starred in the sitcom Bridget Loves Bernie (1972-73), as the title character of the short-lived Serpico
  series, and as Dr. Ben Samuels on St. Elsewhere.

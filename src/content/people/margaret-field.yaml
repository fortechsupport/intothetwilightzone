bio: >-
  Margaret Field played Emma Senescu, the wife of a wax-museum guard obsessed with his murderers' row of figures,
  in "The New Exhibit." Her film work includes The Man from Planet X (1951), and she was a frequent television guest
  actress. She was the mother of actress Sally Field.

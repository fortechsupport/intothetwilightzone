bio: >-
  This is the English actor John Williams (not the composer), who appeared in two Night Gallery segments: "The Doll"
  (1971), in which a retired colonel's niece is given a sinister doll from India, and "The Caterpillar" (1972),
  with Laurence Harvey. He won a Tony Award as the unflappable Chief Inspector Hubbard in Dial M for Murder and
  repeated the role in Alfred Hitchcock's film (1954), and also appeared in Sabrina and To Catch a Thief.

bio: >-
  Noel Black directed two episodes of the 1985 Twilight Zone revival, "To See the Invisible Man" (1986), from Robert
  Silverberg's story, and "Song of the Younger World" (1987). He is best known for the cult thriller Pretty Poison
  (1968), with Anthony Perkins and Tuesday Weld.

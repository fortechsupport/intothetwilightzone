bio: >-
  Bernard C. Schoenfeld wrote "From Agnes – With Love," the 1964 episode in which Wally Cox's computer programmer
  finds that his machine has fallen in love with him; the radio drama series later remade it. A playwright and screenwriter,
  he wrote the film noir Phantom Lady (1944) and Caged (1950), which earned an Academy Award nomination, and much
  episodic television.

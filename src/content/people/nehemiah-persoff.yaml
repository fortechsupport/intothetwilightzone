bio: >-
  Nehemiah Persoff played Carl Lanser, the confused passenger on a 1942 freighter who turns out to be the U-boat
  commander who sank it, condemned to relive the attack, in Rod Serling's "Judgment Night" (1959). Born in Jerusalem,
  he played Little Bonaparte in Some Like It Hot and later became a painter.

bio: >-
  Rudy Larriva directed and animated the first-season title sequence of the original Twilight Zone, produced by
  UPA. An animator who had worked under Chuck Jones at Warner Bros., he directed for UPA in the 1950s, including
  Mr. Magoo, and later directed a series of Road Runner cartoons for Format Films. He died in 2010.

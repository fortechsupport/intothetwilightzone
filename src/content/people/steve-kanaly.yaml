born: '1946-03-14'
bio: >-
  Steve Kanaly appeared in "Stranger in Possum Meadows" (1989), a third-season episode of the 1985 revival produced
  in Canada for syndication. He is best known as Ray Krebbs, the ranch foreman and half-brother of J. R. Ewing,
  on Dallas, and appeared in John Milius's Dillinger and The Wind and the Lion.

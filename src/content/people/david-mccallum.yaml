born: '1933-09-19'
died: '2023-09-25'
bio: >-
  David McCallum starred in "The Phantom Farmhouse" (1971), the Night Gallery adaptation of Seabury Quinn's werewolf
  story, as a psychiatrist who falls for a mysterious woman from an isolated farmhouse. The Scottish actor became
  a 1960s idol as Illya Kuryakin in The Man from U.N.C.L.E., starred in The Invisible Man (1975) and Sapphire &
  Steel, and played the medical examiner Ducky Mallard on NCIS for twenty years. He also starred in The Outer Limits
  episode "The Sixth Finger."

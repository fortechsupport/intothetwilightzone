bio: >-
  Malcolm Jameson wrote "Blind Alley" (1943), the story Rod Serling adapted as "Of Late I Think of Cliffordville"
  (1963), about a ruthless old tycoon who makes a deal with the devil to relive his youth and finds it less profitable
  than he expected. A former US Navy officer, Jameson turned to science fiction in the 1930s and 1940s, writing
  for Astounding and Unknown, including the Bullard space-navy stories.

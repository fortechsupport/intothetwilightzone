bio: >-
  Al Leong appeared in "The Misfortune Cookie" (1986), the 1985-revival segment about a food critic whose fortune
  cookies come true. A martial artist and stuntman with a trademark long hair and Fu Manchu moustache, he is a familiar
  henchman in Lethal Weapon, Big Trouble in Little China and Die Hard.

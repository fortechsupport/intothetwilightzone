name: Connie Gilchrist
born: '1901-02-02'
died: '1985-03-03'
roles:
- actor
bio: >-
  Connie Gilchrist played Mrs. Feeney, the landlady of Jack Klugman's down-and-out bookie, in "In Praise of Pip,"
  the episode that opened the fifth season. A longtime MGM character actress, she appeared in A Letter to Three
  Wives, Long John Silver and Johnny Guitar.

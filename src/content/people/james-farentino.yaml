name: James Farentino
roles:
- actor
born: '1938-02-24'
died: '2012-01-24'
bio: >-
  James Farentino starred in two Night Gallery segments: "Since Aunt Ada Came to Stay" (1971), as a young husband
  whose wife's elderly aunt is a witch, and "The Girl with the Hungry Eyes" (1972), as the photographer who makes
  a mysterious model famous, adapted from Fritz Leiber's story. He won a Golden Globe as a promising newcomer, co-starred
  in The Bold Ones and played Simon Peter in Jesus of Nazareth (1977), and was later Dr. Nick Toscanni on Dynasty.

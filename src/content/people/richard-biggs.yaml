bio: >-
  Richard Biggs appeared in "The Toys of Caliban" (1986), George R. R. Martin's 1985 revival adaptation of a Terry
  Matz story about parents of a severely disabled son who can summon any object he sees. He played Dr. Stephen Franklin
  on Babylon 5 and Marcus Hunter on Days of Our Lives.

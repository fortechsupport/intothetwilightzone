name: Joyce Van Patten
roles:
- actor
born: '1934-03-09'
bio: >-
  Joyce Van Patten played Eileen Ransome, one half of a troubled married couple who book passage on an elderly ocean
  liner, in the hour-long "Passage on the Lady Anne" (1963). She also appeared in "The Mourners for Johnny Sharp,"
  a two-part episode of Serling's western The Loner. The sister of Dick Van Patten, she has worked for seven decades
  on stage and screen, in films such as The Bad News Bears and Mikey and Nicky and on Broadway in Brighton Beach
  Memoirs.

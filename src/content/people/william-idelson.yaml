born: '1919-08-21'
died: '2007-12-31'
bio: >-
  William Idelson co-wrote "Long Distance Call" (1961) with Charles Beaumont, the videotaped episode in which a
  boy talks to his dead grandmother on a toy telephone. As a child he played Rush on the radio serial Vic and Sade;
  he later wrote and produced for The Andy Griffith Show, The Bob Newhart Show and other sitcoms.

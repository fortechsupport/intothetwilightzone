bio: >-
  Akosua Busia guest-starred in "Lost and Found," a 1986 segment of the first Twilight Zone revival. The Ghanaian-born
  actress and writer, daughter of former Ghanaian prime minister Kofi Abrefa Busia, is best known as Nettie in Steven
  Spielberg's The Color Purple (1985). She co-wrote the screenplay for Jonathan Demme's Beloved (1998) and published
  the novel The Seasons of Beento Blackbird.

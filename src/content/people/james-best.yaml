bio: >-
  James Best guest-starred in hundreds of TV episodes and Westerns before becoming famous as Sheriff Rosco
  P. Coltrane on The Dukes of Hazzard; he was also a longtime acting teacher and painter. He appeared
  in three Twilight Zone episodes, all with a rural Southern or Western flavor, including the title role
  in "The Last Rites of Jeff Myrtlebank".

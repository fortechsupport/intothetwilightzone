name: Peter Wolfe
roles:
- author
- scholar
bio: >-
  Peter Wolfe wrote In the Zone: The Twilight World of Rod Serling (Bowling Green State University Popular Press,
  1997), a literary-critical study of the themes running through Serling's teleplays. A university English professor,
  he applied the methods he had used in books on crime and literary fiction writers to Serling's television work.

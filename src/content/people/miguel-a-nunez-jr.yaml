name: Miguel A. Núñez Jr.
roles:
- actor
bio: >-
  Miguel A. Nunez Jr. played one of the menacing students in "Teacher's Aide" (1985), a first-season revival episode
  about a teacher at a violent high school who gains a demonic ally. He played Spider in The Return of the Living
  Dead (1985) and starred in the comedy Juwanna Mann (2002).

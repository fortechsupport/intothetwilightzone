name: Alan Baxter
roles:
- actor
born: '1908-11-19'
died: '1976-05-08'
bio: >-
  Alan Baxter was in the cast of "The Time Element" (1958), Rod Serling's time-travel play for Westinghouse Desilu
  Playhouse that served as the forerunner of The Twilight Zone, and later guested in "Widow on the Evening Stage,"
  an episode of Serling's western The Loner. A Yale-trained stage actor, he played gangsters and heavies in 1930s
  and 1940s films, most memorably the saboteur Freeman in Alfred Hitchcock's Saboteur (1942), and worked widely
  in television drama into the 1970s.

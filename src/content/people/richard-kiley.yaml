name: Richard Kiley
roles:
- actor
born: '1922-03-31'
died: '1999-03-05'
bio: >-
  Richard Kiley's work with Rod Serling began with Patterns (1955), the Kraft Television Theatre drama that made
  Serling's name, in which Kiley played Fred Staples, the young executive groomed to replace an older man. He played
  the Nazi war criminal Joseph Strobe in "Escape Route" in the 1969 Night Gallery pilot, returned in the series
  segment "The Ghost of Sorworth Place" (1972), and played Lancelot in the 1985 revival's "The Last Defender of
  Camelot." He created Don Quixote in Man of La Mancha, winning his second Tony, and won Emmys for The Thorn Birds,
  A Year in the Life and Picket Fences.

bio: >-
  Steve Lawrence starred in "The Dear Departed" (1971), a Night Gallery segment about a fake medium whose staged
  séances bring in more than he planned. With his wife Eydie Gormé he formed one of the best-loved nightclub and
  television singing duos, and he earned a Tony nomination for What Makes Sammy Run?

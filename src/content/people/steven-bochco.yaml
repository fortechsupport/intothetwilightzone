born: '1943-12-16'
died: '2018-04-01'
bio: >-
  Steven Bochco co-wrote "Quarantine" (1986), a revival episode about a scientist revived from suspended animation
  by a peaceful future society that needs his help. He began at Universal writing for Columbo and other series,
  and became one of the most influential producers in television as co-creator of Hill Street Blues, L.A. Law and
  NYPD Blue, winning ten Emmy Awards.

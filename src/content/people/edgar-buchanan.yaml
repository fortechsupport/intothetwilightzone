bio: >-
  Edgar Buchanan played Doc Bolton, the town doctor who pronounced Jeff Myrtlebank dead and cannot explain his return,
  in "The Last Rites of Jeff Myrtlebank" (1962). Trained as a dentist before turning to acting, he became one of
  Hollywood's most recognisable character actors in westerns such as Shane and Ride the High Country. On television
  he played Red Connors on Hopalong Cassidy and Uncle Joe Carson on Petticoat Junction, a role he also played on
  Green Acres and The Beverly Hillbillies.

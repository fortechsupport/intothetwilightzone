bio: >-
  English actor Michael York starred in Cabaret, The Three Musketeers and Logan's Run and later played
  Basil Exposition in the Austin Powers films. He voiced the leads in the radio adaptations of "The Trouble
  with Templeton" and "A Piano in the House."

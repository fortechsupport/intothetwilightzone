bio: >-
  Philip DeGuere Jr. was the executive producer who launched the 1985 CBS Twilight Zone revival, assembling a team
  that included Harlan Ellison, Alan Brennert and Rockne S. O'Bannon, and he wrote the premiere's adaptation of
  Henry Slesar's "Examination Day." He had earlier written and directed the TV film Dr. Strange (1978) and produced
  Simon & Simon and Whiz Kids.

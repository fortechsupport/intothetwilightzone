bio: >-
  Bert Granet's connection to The Twilight Zone predates the series itself: he produced Serling's time-travel
  drama The Time Element for Westinghouse Desilu Playhouse in 1958, whose success helped persuade CBS
  to commission the show. He later returned as producer during the fourth and fifth seasons. His wider
  career included RKO features such as The Locket (1946) and producing The Untouchables for Desilu.

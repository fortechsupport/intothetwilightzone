bio: >-
  Mike Korologos is the Utah newspaperman whose story became the basis of "Mr. Garrity and the Graves," the fifth-season
  episode about a con man who claims he can raise the dead of a western mining town. Korologos had come across an
  1870s tall tale from the old mining camp of Alta in the American Guide Series and wrote it up for The Salt Lake
  Tribune; the piece was picked up by Alta's local paper. Rod Serling, a regular guest at the Alta Lodge ski resort,
  read it and paid Korologos $500 for the story. Korologos went on to a long career as a ski journalist and has
  told the story of the sale in later interviews.

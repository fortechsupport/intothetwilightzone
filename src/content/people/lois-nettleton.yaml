bio: >-
  Lois Nettleton was a two-time Daytime Emmy winner and stage actress with a long run of film and TV guest
  roles. She starred in "The Midnight Sun" as an artist enduring a sweltering apocalypse as the Earth
  falls toward the Sun, one of the series' most famous twist endings.

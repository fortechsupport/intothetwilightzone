born: '1952-03-01'
bio: >-
  Steven Barnes wrote for The Twilight Zone in two different revivals: the 1985 segments "To See the Invisible Man,"
  adapted from Robert Silverberg's story about a man sentenced to be ignored by society, and "Teacher's Aide," and,
  decades later, the 2020 episode "A Small Town" for Jordan Peele's version. A science-fiction novelist, he co-wrote
  Dream Park and other books with Larry Niven, wrote the alternate-history Lion's Blood, and has written much of
  his recent work with his wife, Tananarive Due.

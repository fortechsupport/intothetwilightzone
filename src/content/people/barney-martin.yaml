born: '1923-03-03'
died: '2005-03-21'
bio: >-
  Barney Martin was one of the card players in "Dealer's Choice" (1985), the revival episode in which a friendly
  poker game includes the Devil. A former New York police detective, he originated the role of Amos Hart in the
  Broadway musical Chicago (1975) and played Jerry's father Morty Seinfeld on Seinfeld.

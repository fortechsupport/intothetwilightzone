bio: >-
  Former actor William Self was a CBS programming executive in Hollywood when The Twilight Zone was developed,
  and he was involved in getting the 1959 pilot Where Is Everybody? made and recommended Buck Houghton
  as the series' producer. He later ran 20th Century Fox Television during its 1960s boom and produced
  numerous television films. He recounted the show's origins in his Television Academy Foundation oral
  history.

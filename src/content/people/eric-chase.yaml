bio: >-
  Eric Chase appeared as one of the three children in "Big Surprise" (1971), Richard Matheson's Night Gallery segment
  in which a strange old man (John Carradine) tells the boys to dig for a surprise in a field. He was a child actor
  of the late 1960s and early 1970s.

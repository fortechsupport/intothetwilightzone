bio: >-
  Virginia Gregg played Emily Harper, the self-pitying, hypochondriac daughter forced to wear a coward's mask, in
  "The Masks" (1964), the episode directed by Ida Lupino. She was one of the busiest actresses of Hollywood radio,
  heard on Dragnet, Gunsmoke, Have Gun - Will Travel and Yours Truly, Johnny Dollar, and she moved easily into Jack
  Webb's television productions. She also supplied part of the voice of "Mother" in Hitchcock's Psycho (1960).

born: '1934-03-04'
died: '2001-05-26'
bio: >-
  Anne Haney played the mother of a profoundly disabled son who can summon any object he sees in "The Toys of Caliban"
  (1986), George R. R. Martin's script for the 1985 revival. A character actress, she played the court- appointed
  social worker in Mrs. Doubtfire and the judge in Liar Liar.

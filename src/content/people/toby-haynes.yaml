bio: >-
  Toby Haynes directed "USS Callister" (2017), the Emmy-winning Black Mirror episode about a petty programmer who
  rules digital copies of his coworkers like a god, often compared to "It's a Good Life." The British director has
  worked on Doctor Who, Sherlock, Jonathan Strange & Mr Norrell and Andor.

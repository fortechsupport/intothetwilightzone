name: Howard Duff
born: '1913-11-24'
died: '1990-07-08'
roles:
- actor
bio: >-
  Howard Duff starred in Richard Matheson's "A World of Difference" as Arthur Curtis, a businessman who discovers
  his office is a film set and his life a role, and later played the father in the Night Gallery segment "There
  Aren't Any More MacBanes." He was the voice of Sam Spade on radio and starred in noir films such as Brute Force
  and The Naked City. He co-starred with his wife Ida Lupino in Mr. Adams and Eve and later played on Knots Landing
  and Flamingo Road.

name: Karen Verne
roles:
- actor
born: '1918-03-05'
died: '1967-12-23'
bio: >-
  Karen Verne played the innkeeper who recognizes the returning former SS officer Gunther Lutze in Rod Serling's
  "Deaths-Head Revisited" (1961). The German-born actress fled the Nazis and worked in Hollywood, appearing in Kings
  Row and Sherlock Holmes and the Secret Weapon and, late in her career, in Ship of Fools.

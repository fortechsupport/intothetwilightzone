bio: >-
  Rockne S. O'Bannon made his first professional sale to the 1985 revival with Wordplay, a story of a
  man whose language suddenly stops making sense, and went on to write segments including The Shadow Man,
  Personal Demons and remakes of Night of the Meek and The After Hours. He later created or co-created
  Alien Nation on TV, seaQuest DSV and Farscape.

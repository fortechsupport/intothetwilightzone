born: '1899-02-02'
died: '1980-06-28'
bio: >-
  Herbie Faye appeared in "A Kind of a Stopwatch" (1963), the comic fifth-season story of a bore who acquires a
  watch that stops time. A vaudeville and burlesque comic, he was a regular on The Phil Silvers Show as Private
  Fender and later appeared on Car 54, Where Are You? and The Dick Van Dyke Show.

bio: >-
  James Nusser appeared in "The Tune in Dan's Café," a second-season Night Gallery segment about a roadside diner
  whose jukebox keeps playing the same song. He is best remembered as Louie Pheeters, the gentle town drunk of Dodge
  City, a recurring part he played on Gunsmoke for many years.

name: Robert Warwick
roles:
- actor
born: '1878-10-09'
died: '1964-06-06'
bio: >-
  Robert Warwick played Air Vice Marshal Alexander Mackaye, the aged officer whose life was saved by a time-displaced
  World War I pilot, in Richard Matheson's first Twilight Zone script, "The Last Flight" (1960). A Broadway and
  silent-film star, he became a stalwart character actor in Preston Sturges's Sullivan's Travels and The Palm Beach
  Story.

born: '1961-04-02'
bio: >-
  Christopher Meloni starred with Jenna Elfman in "A Human Face" (2020), the second-season episode of the Jordan
  Peele revival about grieving parents visited by an alien that takes their dead daughter's form. He is best known
  as Detective Elliot Stabler on Law & Order: Special Victims Unit and Organized Crime, and as Chris Keller on Oz.

bio: >-
  Australian-born actress Portia de Rossi played lawyer Nelle Porter on Ally McBeal and Lindsay Bluth
  on Arrested Development, and later appeared on Scandal. In "Dead Man's Eyes" she played a widow who
  begins to see things she cannot explain.

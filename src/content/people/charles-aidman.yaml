bio: >-
  Character actor Charles Aidman, who had appeared in the original series' And When the Sky Was Opened
  and Little Girl Lost, became the unseen narrator of the 1985 revival for its first two CBS seasons,
  providing the opening and closing narrations in place of Rod Serling.

name: Christianne Hirt
roles:
- actor
bio: >-
  Christianne Hirt played Marilyn Lee Cross, the teenage stowaway aboard an emergency rocket whose added weight
  dooms the flight, in "The Cold Equations" (1989), the 1985 revival's adaptation of Tom Godwin's classic science-fiction
  story. She is a Canadian film and television actress.

born: '1922-09-19'
died: '2002-04-15'
bio: >-
  Damon Knight wrote "To Serve Man" (1950), the Galaxy story whose punchline about an alien book became one of the
  most quoted twists in television when Rod Serling adapted it in 1962. An influential critic and editor, Knight
  founded the Science Fiction Writers of America, co-founded the Milford and Clarion writers' workshops, and edited
  the Orbit anthologies; SFWA's Grand Master award bears his name.

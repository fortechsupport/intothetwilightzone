born: '1953-03-13'
died: '2012-11-21'
bio: >-
  Deborah Raffin starred in "Something in the Walls" (1989), a third-season revival episode about a psychiatric
  patient terrified of the faces she sees in patterned wallpaper. A model turned actress, she starred in Forty Carats
  and Once Is Not Enough and in television films such as Nightmare in Badham County. With her husband Michael Viner
  she founded Dove Audio, an early major audiobook publisher.

born: '1943-04-07'
died: '2019-04-07'
bio: >-
  Ryszard Bugajski directed several segments of the 1980s revival's Toronto-produced third season (1988-89), including
  "Street of Shadows," "Room 2426," "Memories" and "Many, Many Monkeys." The Polish director's film Interrogation
  (1982), about a woman imprisoned by Stalinist secret police, was banned by the communist authorities, leading
  him to emigrate to Canada; when finally released in 1989 it won Krystyna Janda the best-actress prize at Cannes.

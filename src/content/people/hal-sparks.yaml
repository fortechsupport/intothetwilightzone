bio: >-
  Hal Sparks voiced roles in four Twilight Zone Radio Dramas adaptations: "I Dream of Genie," "The Mind and the
  Matter," "A Nice Place to Visit" and "Long Distance Call." A stand-up comedian, he hosted E!'s Talk Soup, played
  Michael Novotny on Showtime's Queer as Folk and appeared on VH1's I Love the... series.

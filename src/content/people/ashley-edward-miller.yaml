bio: >-
  Ashley Edward Miller co-wrote "Cold Fusion," an episode of the 2002 UPN Twilight Zone. With his writing partner
  Zack Stentz he worked on Andromeda and Fringe and co-wrote the screenplays for Thor (2011) and X-Men: First Class
  (2011).

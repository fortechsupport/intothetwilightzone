bio: >-
  Buck Houghton produced the first three seasons of The Twilight Zone, the half-hour years that established
  the show's look and tone, and is widely credited as Serling's indispensable partner in running the production
  day to day. A studio veteran who had worked under David O. Selznick and at Paramount, MGM and RKO, he
  left when CBS moved the series to an hour-long format for its fourth season. He later produced The Richard
  Boone Show and wrote the guide What a Producer Does (1992).

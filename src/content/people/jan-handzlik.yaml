name: Jan Handzlik
roles:
- actor
born: '1945'
bio: >-
  Jan Handzlik played Tommy, the comic-book-reading boy who plants the idea that aliens might be living on the street
  disguised as ordinary families, in "The Monsters Are Due on Maple Street" (1960). As a child actor he also played
  the young Patrick Dennis in Auntie Mame (1958), a role he had first played on Broadway.

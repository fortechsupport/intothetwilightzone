bio: >-
  Danny Goldring voiced roles in The Twilight Zone Radio Dramas versions of "The Gift" and "Missing, Presumed Dead,"
  both recorded with the series' Chicago-based ensemble. A longtime Chicago stage actor, he appeared in films shot
  there, including The Dark Knight.

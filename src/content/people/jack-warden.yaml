bio: >-
  Jack Warden was a gravel-voiced character actor whose breakout came as Juror No. 7 in 12 Angry Men and
  who later earned two Oscar nominations. He starred twice in the first season of The Twilight Zone: as
  the convict exiled to an asteroid with a robot companion in "The Lonely" and as the manager of a robot
  pitcher in "The Mighty Casey".

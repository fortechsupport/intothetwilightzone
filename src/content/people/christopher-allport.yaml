bio: >-
  Christopher Allport played the father of a boy facing a government intelligence test on his twelfth birthday in
  "Examination Day" (1985), from Henry Slesar's story. A busy television actor, he appeared in Jack Frost and Dead
  and Buried; he died in an avalanche while skiing in 2008.

name: Joan Marshall
born: '1931-06-23'
died: '1992'
roles:
- actor
bio: >-
  Joan Marshall played Wilma, the former girlfriend of a murdered gangster whose shoes have taken over a derelict's
  body, in "Dead Man's Shoes." She played Phoebe in the unaired pilot of The Munsters and, under the name Jean Arless,
  the dual role at the center of William Castle's thriller Homicidal (1961). She was later married to director Hal
  Ashby.

name: Jackie Gleason
roles:
- actor
born: '1916-02-26'
died: '1987-06-24'
bio: >-
  Jackie Gleason played Maish Rennick, the debt-ridden manager who exploits his washed-up boxer, in the 1962 film
  of Rod Serling's Requiem for a Heavyweight, opposite Anthony Quinn and Mickey Rooney. Gleason was one of television's
  first giants as the star of The Jackie Gleason Show and Ralph Kramden in The Honeymooners, and was nominated for
  an Academy Award as Minnesota Fats in The Hustler (1961).

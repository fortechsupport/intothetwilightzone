bio: >-
  Carl Betz played Dr. Max Redford, the doctor who brings a dead man to life through hypnosis, in "The Dead Man,"
  a segment of Night Gallery's first episode (1970). He was Dr. Alex Stone on The Donna Reed Show and won an Emmy
  as the lead of Judd, for the Defense.

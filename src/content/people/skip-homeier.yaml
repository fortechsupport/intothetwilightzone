name: Skip Homeier
roles:
- actor
born: '1930-10-05'
died: '2017-06-25'
bio: >-
  Skip Homeier guest-starred in "The Mourners for Johnny Sharp," the two-part episode of Rod Serling's western The
  Loner (1966). A child star in Tomorrow, the World! (1944), he grew into a specialist in young gunmen and heavies
  in westerns such as The Gunfighter, and appeared in two episodes of the original Star Trek.

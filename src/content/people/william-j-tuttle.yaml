bio: >-
  As head of MGM's makeup department, William Tuttle supplied the original Twilight Zone, which filmed
  on the MGM lot, with many of its most memorable faces, including the pig-snouted doctors and nurses
  of Eye of the Beholder and the grotesque Mardi Gras masks of The Masks. In 1965 he became the first
  makeup artist honored with an Academy Award, an honorary Oscar for 7 Faces of Dr. Lao, and he later
  designed the makeup for Young Frankenstein.

name: David Opatoshu
born: '1918-01-30'
died: '1996-04-30'
roles:
- actor
bio: >-
  David Opatoshu played Dorn, a leader of the secretive town of Peaceable, in "Valley of the Shadow," and guest-starred
  in "Westward, the Shoemaker" on Serling's western The Loner. The son of Yiddish novelist Joseph Opatoshu, he began
  in New York's Yiddish theater and radio. His film work includes Exodus, Torn Curtain and The Naked City, and on
  television he appeared in Star Trek's "A Taste of Armageddon." He won an Emmy in 1991 for a guest role on Gabriel's
  Fire.

born: '1939'
bio: >-
  George Folsey Jr. was associate producer of John Landis's prologue and Time Out segment of Twilight Zone: The
  Movie (1983). After the helicopter crash that killed Vic Morrow and two children during filming, he was one of
  five people tried for involuntary manslaughter, and he was acquitted with the others in 1987. He was Landis's
  longtime editor and producer, on films such as Animal House, The Blues Brothers and An American Werewolf in London,
  and he co-produced Michael Jackson's Thriller video. He is the son of MGM cinematographer George J. Folsey.

name: Lee Kinsolving
roles:
- actor
born: '1938-08-30'
died: '1974-12-04'
bio: >-
  Lee Kinsolving played Scott, the alien biker who falls in love with a suburban girl (Shelley Fabares) and turns
  against his comrades' plan to poison the town's water, in "Black Leather Jackets" (1964). He earned a Golden Globe
  nomination for The Dark at the Top of the Stairs (1960) and appeared in The Explosive Generation before his early
  death.

bio: >-
  Christopher Titus appeared in "Gabe's Story," an episode of the 2002 UPN Twilight Zone. The stand-up comedian
  built the Fox sitcom Titus (2000-2002) out of his own dysfunctional family history and starred in it. His stand-up
  specials include Norman Rockwell Is Bleeding.

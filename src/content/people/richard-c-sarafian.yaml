bio: >-
  Richard C. Sarafian directed "Living Doll" (1963), in which Telly Savalas battles his stepdaughter's doll Talky
  Tina, one of the series' most famous episodes. He later directed the cult road movie Vanishing Point (1971) and
  Man in the Wilderness, and acted in Bugsy and The Crossing Guard.

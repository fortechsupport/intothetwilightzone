name: Ron Foster
roles:
- actor
bio: >-
  Ron Foster played Sergeant William Connors, leader of a modern National Guard tank crew that slips back to Custer's
  Last Stand, in "The 7th Is Made Up of Phantoms" (1963), alongside Warren Oates and Randy Boone. He was a working
  character actor in late-1950s and 1960s film and television.

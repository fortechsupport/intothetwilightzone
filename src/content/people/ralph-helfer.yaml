bio: >-
  Ralph Helfer supplied and supervised animals for the original Twilight Zone, including the lion and leopard used
  in the early 1960s episodes, through his company Nature's Haven Wild Animal Rental. He was known for training
  wild animals through affection rather than fear, an approach he called affection training. His animals appeared
  in many films and series, including Daktari and Clarence the Cross-Eyed Lion, and he later wrote books including
  Modoc.

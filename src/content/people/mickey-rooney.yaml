bio: >-
  Mickey Rooney was one of the biggest box-office stars of the late 1930s as Andy Hardy, with a career
  spanning nine decades and two honorary Oscars. He is the only actor on screen in "The Last Night of
  a Jockey", playing a disgraced, diminutive jockey whose wish to be 'big' comes horribly true.

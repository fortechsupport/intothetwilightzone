bio: >-
  Robert Carradine starred in "Still Life" (1986), a revival episode about a photographer who finds that old glass-plate
  negatives from the Amazon hold living people. A member of the Carradine acting family, he played Lewis Skolnick
  in Revenge of the Nerds and Lizzie's father on Lizzie McGuire.

bio: >-
  Paul Shapiro is a Canadian television director credited on "The Pool Guy" in the 2002 UPN revival. He has
  directed episodes of The X-Files, Millennium, Dark Angel, Smallville, 24, Heroes and Supernatural, and the
  feature The Lotus Eaters (1993).

born: '1915-12-12'
died: '1998-05-14'
bio: >-
  Frank Sinatra starred in two films with Twilight Zone writer connections: Ocean's 11 (1960), which grew from a
  story by George Clayton Johnson and Jack Golden Russell, and Assault on a Queen (1966), whose screenplay was written
  by Rod Serling from Jack Finney's novel about a plot to rob the Queen Mary with a salvaged U-boat. One of the
  most popular singers of the twentieth century, he won the Academy Award for From Here to Eternity (1953) and starred
  in The Manchurian Candidate and The Man with the Golden Arm.

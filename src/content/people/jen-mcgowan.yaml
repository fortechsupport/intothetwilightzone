name: Jen McGowan
roles:
- director
bio: >-
  Jen McGowan directed "Try, Try," a 2020 episode of the Jordan Peele revival in which a man stuck in a repeating
  day tries to win over a woman he meets in a museum. She directed the independent features Kelly & Cal and Rust
  Creek and has directed episodes of many television dramas.

bio: >-
  Murray Hamilton was a character actor best known as the mayor of Amity in Jaws and Mr. Robinson in The
  Graduate. In "One for the Angels", the second episode aired, he plays a polite, businesslike Death who
  comes to collect pitchman Lou Bookman.

bio: >-
  Allen Baron directed episodes of The Sixth Sense (1972), the ABC parapsychology series whose episodes were later
  cut down and syndicated with Rod Serling introductions as part of Night Gallery. He is best known for writing,
  directing and starring in the independent noir Blast of Silence (1961), and later directed a great deal of episodic
  television.

bio: >-
  Cesare Danova appeared in "Smile, Please" (1972), a short Night Gallery segment about a photographer trying to
  capture a vampire on film. The Italian-born actor played in Cleopatra (1963), Scorsese's Mean Streets and National
  Lampoon's Animal House, as the corrupt mayor of Faber.

name: Cedric Hardwicke
born: '1893-02-19'
died: '1964-08-06'
roles:
- actor
bio: >-
  Sir Cedric Hardwicke played the cranky inventor Simon Polk, tormenting his niece from beyond the grave through
  a robot, in "Uncle Simon" (1963), one of his last roles. A knighted English stage actor, he appeared in The Hunchback
  of Notre Dame (1939), Suspicion and The Ten Commandments.

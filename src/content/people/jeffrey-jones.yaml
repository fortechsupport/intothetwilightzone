bio: >-
  Jeffrey Jones appeared in "Opening Day," a 1985 revival segment about a man who plans to murder his lover's husband
  on the first day of duck season. He is known for playing Emperor Joseph II in Amadeus, the dean Ed Rooney in Ferris
  Bueller's Day Off and Charles Deetz in Beetlejuice, and he had a recurring role on Deadwood.

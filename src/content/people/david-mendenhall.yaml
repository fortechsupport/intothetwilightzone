name: David Mendenhall
roles:
- actor
born: '1971'
bio: >-
  David Mendenhall played Dickie Jordan, the boy who must pass a government intelligence test on his twelfth birthday,
  in "Examination Day" (1985), the revival's chilling adaptation of Henry Slesar's short story. He played Sylvester
  Stallone's son in Over the Top (1987) and was a voice in The Transformers: The Movie.

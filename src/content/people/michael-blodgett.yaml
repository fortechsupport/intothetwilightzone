born: '1939-09-26'
died: '2007-11-14'
bio: >-
  Michael Blodgett played John Fearing, the hypnotized subject whose doctor can make him die and return, in "The
  Dead Man," a segment of Night Gallery's first episode (1970). He starred in Beyond the Valley of the Dolls, then
  left acting to write novels and screenplays such as Rent-a-Cop.

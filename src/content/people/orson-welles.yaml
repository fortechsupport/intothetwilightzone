bio: >-
  Orson Welles narrated "Silent Snow, Secret Snow" (1971), Gene Kearney's Night Gallery adaptation of Conrad Aiken's
  story about a boy withdrawing into an imagined world of falling snow; his voice carries nearly the whole segment.
  Welles had already changed broadcasting with The War of the Worlds (1938), the radio panic that Rod Serling's
  generation grew up remembering, and changed cinema with Citizen Kane (1941). His later work included Touch of
  Evil, Chimes at Midnight and F for Fake.

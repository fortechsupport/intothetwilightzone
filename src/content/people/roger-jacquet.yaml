name: Roger Jacquet
roles:
- actor
bio: >-
  French actor Roger Jacquet played Peyton Farquhar, the Confederate sympathizer facing hanging, in Robert Enrico's
  short film La Rivière du hibou (1962), broadcast as the Twilight Zone episode "An Occurrence at Owl Creek Bridge"
  in 1964. The nearly wordless performance carries the film, which won the short-film Palme d'Or at Cannes and an
  Academy Award. Little else of his career is documented in English sources.

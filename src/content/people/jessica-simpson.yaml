bio: >-
  Jessica Simpson became a pop star with the 1999 album Sweet Kisses and reached a wider audience through
  the MTV reality series Newlyweds, later building a large fashion business. Her Twilight Zone appearance
  came in "The Collection," where she played a babysitter whose young charge keeps a very unusual set
  of dolls.

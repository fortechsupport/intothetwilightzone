bio: >-
  Curtis Harrington directed "Voices in the Earth" (1987), a 1980s-revival segment about a scholar who returns to
  a dead Earth and hears its ghosts. An experimental filmmaker turned genre director, he made Night Tide (1961),
  What's the Matter with Helen? and Whoever Slew Auntie Roo?, plus television movies and episodes of Dynasty.

bio: >-
  JoBe Cerny voiced a role in The Twilight Zone Radio Dramas' adaptation of "The New Exhibit." A Chicago- based
  actor, he is best known for commercial voice work, including the Pillsbury Doughboy, and for character roles in
  Chicago-made films.

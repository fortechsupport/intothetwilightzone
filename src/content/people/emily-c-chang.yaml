bio: >-
  Emily C. Chang wrote two episodes of the second season of the 2019 Twilight Zone revival: the season premiere
  "Meet in the Middle," about a man who connects telepathically with a woman he has never met, and "Ovation," about
  a struggling singer who inherits sudden fame. She has worked as a staff writer in network television drama.

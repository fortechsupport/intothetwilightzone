name: Cyril Delevanti
roles:
- actor
born: '1889-02-23'
died: '1975-12-13'
bio: >-
  Cyril Delevanti appeared in two original-series episodes, "The Silence" (1961) and "A Piano in the House" (1962),
  as well as Night Gallery's "The Sins of the Fathers" (1972), a Welsh folk-horror tale of sin-eating. The English-born
  character actor worked in Hollywood from the 1930s to the 1970s, with roles in The Night of the Iguana and Mary
  Poppins.

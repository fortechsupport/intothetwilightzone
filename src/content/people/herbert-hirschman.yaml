bio: >-
  Herbert Hirschman took over as producer when The Twilight Zone returned in 1963 as an hour-long series
  for its fourth season, overseeing the first part of that expanded run before Bert Granet succeeded him.
  He had earlier produced Perry Mason, and later produced the 1979 PBS miniseries The Scarlet Letter;
  late in life he also turned up in small acting roles in films such as Brainstorm (1983).

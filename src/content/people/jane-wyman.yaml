name: Jane Wyman
roles:
- actor
born: '1917-01-05'
died: '2007-09-10'
bio: >-
  Jane Wyman starred as the ruthless vintner Angela Channing on Falcon Crest (1981-90), the prime-time soap created
  by Twilight Zone writer Earl Hamner Jr., and earlier guest-starred in "If I Should Die Before I Wake," an episode
  of The Sixth Sense (1972), later folded into the Night Gallery syndication package. She won the Academy Award
  for Best Actress for Johnny Belinda (1948) and was nominated for The Yearling, Magnificent Obsession and The Blue
  Veil.

bio: >-
  Writer Marc Scott Zicree is the author of The Twilight Zone Companion (1982), the episode-by-episode
  guide built on interviews with Serling's collaborators that became the standard reference on the original
  series and remains widely cited. His research also helped document behind-the-scenes history such as
  the ghostwriting done for the ailing Charles Beaumont.

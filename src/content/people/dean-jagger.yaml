name: Dean Jagger
roles:
- actor
born: '1903-11-07'
died: '1991-02-05'
bio: >-
  Dean Jagger played Ed Lindsay, an aging bachelor whose old radio picks up programs from his youth and offers him
  a second chance at love, in Charles Beaumont's "Static" (1961). He won the Academy Award for Twelve O'Clock High
  (1949) and appeared in White Christmas and Elmer Gantry.

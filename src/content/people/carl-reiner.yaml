bio: >-
  Carl Reiner played the skeptical lecturer in "Professor Peabody's Last Lecture" (1971), Night Gallery's comic
  send-up of H. P. Lovecraft's Cthulhu mythos. He created The Dick Van Dyke Show, partnered with Mel Brooks on The
  2000 Year Old Man, directed The Jerk and All of Me, and won numerous Emmys; he was the father of Rob Reiner.

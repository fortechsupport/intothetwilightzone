born: '1911-08-27'
died: '2009'
bio: >-
  Alvin Ganzer directed four first-season episodes of the original Twilight Zone: "What You Need," "The Hitch-Hiker,"
  "Nightmare as a Child" and "The Mighty Casey," the baseball comedy that had to be partly reshot after its original
  star Paul Douglas died. "The Hitch-Hiker," with Inger Stevens, remains one of the most admired episodes of the
  first season. Ganzer worked steadily as a television director through the 1950s and 1960s on westerns, dramas
  and comedies.

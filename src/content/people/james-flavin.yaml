bio: >-
  James Flavin played Baron, the club owner who turns away Jack Klugman's alcoholic trumpeter, in "A Passage for
  Trumpet" (1960). A burly character actor with hundreds of credits, usually as policemen, he was the second mate
  Briggs in King Kong (1933).

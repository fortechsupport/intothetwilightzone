bio: >-
  The famous four-note Twilight Zone theme heard from season two onward came from Romanian-born French composer
  Marius Constant, though not by design: CBS music director Lud Gluskin assembled it from two short library pieces
  Constant had written for the network, Étrange No. 3 and Milieu No. 2. Because it was work for hire he earned no
  royalties and reportedly did not know for years that it was being used. In France he was a significant modernist,
  a pupil of Messiaen, founder of Ensemble Ars Nova and a music director at the Paris Opera.

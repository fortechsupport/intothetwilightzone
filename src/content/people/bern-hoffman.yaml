name: Bern Hoffman
born: '1913'
died: '1979'
roles:
- actor
bio: >-
  Bern Hoffman appeared in "She'll Be Company for You," a third-season Night Gallery segment adapted from a story
  by Andrew Benedict about a widower and the unwanted companion his late wife's friend leaves with him. A burly
  character actor, he created the brawler Earthquake McGoon in the Broadway musical Li'l Abner and repeated the
  role in the 1959 film, and played Sam the bartender in many episodes of Bonanza.

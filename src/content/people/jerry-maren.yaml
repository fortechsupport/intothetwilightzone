name: Jerry Maren
roles:
- actor
born: '1920-01-24'
died: '2018-05-24'
bio: >-
  Jerry Maren played one of the small, hooded demons that torment a writer (Martin Balsam) in "Personal Demons"
  (1986). He was the last surviving Munchkin from The Wizard of Oz (1939), in which he handed Dorothy a lollipop
  for the Lollipop Guild, and later played Little Oscar for Oscar Mayer and appeared on The Gong Show.

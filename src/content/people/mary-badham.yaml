name: Mary Badham
roles:
- actor
born: '1952-10-07'
bio: >-
  Mary Badham played Sport Sharewood, one of two children who escape their quarrelling parents through a swimming
  pool into a rural refuge kept by Aunt T, in "The Bewitchin' Pool" (1964), the last original series episode to
  air; some of her lines were redubbed by June Foray. She received an Academy Award nomination at age ten for playing
  Scout in To Kill a Mockingbird (1962).

bio: >-
  Oscar-winning director William Friedkin directed one segment of the 1985 revival, Nightcrawlers, a tense
  story of a Vietnam veteran in a roadside diner whose memories take physical shape. It was a rare television
  assignment for the director of The French Connection and The Exorcist.

born: '1975-05-26'
bio: >-
  Nicki Aycox is an American actress and musician from Hennessey, Oklahoma. In the 2002 revival episode
  "Sanctuary" she played the injured biker whose working phone threatens the couple's paradise. Her other roles
  include Minxie Hayes in Jeepers Creepers 2, Meg Masters on Supernatural and Jamie Allen on Dark Blue.

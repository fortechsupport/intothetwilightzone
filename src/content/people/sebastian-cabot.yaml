bio: >-
  Sebastian Cabot played Pip, the genial "guide" who grants a dead hoodlum his every wish, in "A Nice Place to Visit,"
  one of the first-season episodes with the most famous twist endings. The English character actor is best known
  as the gentleman's gentleman Mr. French on Family Affair. He narrated Disney's Winnie the Pooh featurettes and
  voiced Bagheera in The Jungle Book, and hosted the anthology Ghost Story (1972).

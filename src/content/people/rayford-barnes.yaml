born: '1920-10-23'
died: '2000-11-11'
bio: >-
  Rayford Barnes was a Dallas-born character actor, best known for Westerns, who appeared with Albert Salmi
  in the original series episode "A Quality of Mercy". He played Ike Clanton on The Life and Legend of Wyatt
  Earp and U.S. Marshal Ken Collins on The Dukes of Hazzard, and his films include Hondo and The Wild Bunch.
  Before acting he had been a radio disc jockey and a Navy navigator in the Second World War.

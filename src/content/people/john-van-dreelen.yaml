bio: >-
  John van Dreelen played Commissar Vassiloff, the KGB officer who traps a defector in a booby-trapped hotel room,
  opposite Martin Landau in "The Jeopardy Room" (1964). The Dutch actor made a career of playing European officers
  and diplomats in American television of the 1960s .

bio: >-
  Jan Shutan appeared in "Tell David…" (1971), a Night Gallery segment in which a jealous wife glimpses her own
  future. A television actress of the 1960s and 1970s, she is remembered by Star Trek fans as Lieutenant Mira Romaine
  in "The Lights of Zetar."

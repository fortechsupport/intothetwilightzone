bio: >-
  Mark Dawidziak wrote Everything I Need to Know I Learned in the Twilight Zone (Thomas Dunne Books, 2017), which
  draws life lessons from the original series' episodes and Serling's narrations. A longtime television critic,
  mostly for The Plain Dealer in Cleveland, he has also written The Columbo Phile and books on The Night Stalker
  and Mark Twain.

bio: >-
  Murray Matheson played Mr. Agee, one of the Sunnyvale Rest Home residents who are made young again, in Steven
  Spielberg's "Kick the Can" segment of Twilight Zone: The Movie (1983). He had appeared in the original series
  as the Clown in "Five Characters in Search of an Exit," and later played in the Night Gallery segment "The Doll
  of Death." The Australian-born actor was a regular as the bookstore owner Felix Mulholland on Banacek and worked
  often on stage and in television.

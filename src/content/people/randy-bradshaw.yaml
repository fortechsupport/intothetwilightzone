name: Randy Bradshaw
roles:
- director
bio: >-
  Canadian director Randy Bradshaw directed four episodes of the final, Toronto-produced season of the 1985 Twilight
  Zone revival in 1988-89: "The Trance," "Special Service," "A Game of Pool" (a remake of George Clayton Johnson's
  original-series episode) and "Father and Son Game." His other work includes Canadian television series and family
  films such as The Song Spinner and Coyote Summer.

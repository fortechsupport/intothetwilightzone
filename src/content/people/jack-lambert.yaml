bio: >-
  Jack Lambert guest-starred in "Escort for a Dead Man" (1965), an episode of Rod Serling's western The Loner. A
  craggy-faced heavy of film noir and westerns, he appeared in The Killers and Kiss Me Deadly and was a regular
  on the series Riverboat.

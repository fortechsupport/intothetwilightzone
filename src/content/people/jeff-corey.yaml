bio: >-
  Jeff Corey was one of Night Gallery's most frequent directors, handling segments such as "Certain Shadows on the
  Wall," "The Dear Departed," "The Academy," "Quoth the Raven," "Tell David...," "Deliveries in the Rear" and "Fright
  Night," and he also acted in "The Dead Man" (1970). A character actor blacklisted in the early 1950s, he spent
  his years off-screen building one of Hollywood's most influential acting classes, whose students included Jack
  Nicholson, James Dean and Robin Williams. He returned to film in the 1960s in The Cincinnati Kid, Butch Cassidy
  and the Sundance Kid and Little Big Man.

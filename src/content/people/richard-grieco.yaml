bio: >-
  Richard Grieco voiced a role in The Twilight Zone Radio Dramas version of "The 7th Is Made Up of Phantoms," about
  National Guardsmen on maneuvers who slip back to the Battle of the Little Bighorn. He became a teen idol as Detective
  Dennis Booker on 21 Jump Street and its spinoff Booker, and starred in the film If Looks Could Kill.

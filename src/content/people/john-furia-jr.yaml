bio: >-
  John Furia Jr. was an American television writer credited on the original series episode "I Dream of Genie".
  He wrote for Playhouse 90, Bonanza, Kung Fu (as story editor) and The Waltons, co-developed Hotel, and wrote
  The Singing Nun. He was president of the Writers Guild of America, West from 1973 to 1975 and taught
  screenwriting at the University of Southern California.

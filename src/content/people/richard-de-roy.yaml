name: Richard De Roy
roles:
- writer
bio: >-
  Richard De Roy wrote the teleplay of "Ninety Years Without Slumbering" (1963), in which Ed Wynn plays an old man
  convinced he will die when his grandfather clock stops. He was a television writer of the 1950s and 1960s; his
  rewrite of the original story led its author to take a pseudonymous credit.

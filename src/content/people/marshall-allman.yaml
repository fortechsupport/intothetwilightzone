bio: >-
  Marshall Allman is a recurring voice in the Twilight Zone Radio Dramas, with roles in adaptations of "Nothing
  in the Dark," "Nick of Time," "Black Leather Jackets" and "He's Alive." On screen he played L.J. Burrows on Prison
  Break and Tommy Mickens on True Blood.

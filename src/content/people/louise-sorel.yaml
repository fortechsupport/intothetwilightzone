bio: >-
  Louise Sorel appeared in "The Dead Man" (1970), the first-season Night Gallery segment about a doctor who can
  induce disease and death by suggestion, and in "Pickman's Model" (1971), from H.P. Lovecraft's story. She is best
  known as Vivian Alamain on Days of Our Lives.

born: '1935-03-19'
died: '2014-05-08'
bio: >-
  Nancy Malone played Millie Frazier, half of a hungover couple who wake in a deserted town where everything is
  a prop, in "Stopover in a Quiet Town" (1964). She was a regular on Naked City and The Long, Hot Summer, then became
  one of the first women to work as a television executive and director, producing and directing television films
  and series.

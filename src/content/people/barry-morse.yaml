bio: >-
  Barry Morse starred in "A Piano in the House" as Fitzgerald Fortune, a cruel theater critic who buys a player
  piano that makes listeners reveal their true selves, and nearly three decades later returned for "Dream Me a Life"
  in the 1985 revival's final season. He is best known as Lieutenant Philip Gerard, the relentless pursuer of Richard
  Kimble on The Fugitive, and as Professor Victor Bergman on Space: 1999.

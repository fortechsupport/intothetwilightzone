bio: >-
  James T. Callahan played Doug Kirk, the son-in-law who thinks Ed Wynn's attachment to an old grandfather clock
  is unhealthy, in "Ninety Years Without Slumbering" (1963). He went on to a long television career in series and
  guest roles. He is best known as Walter Powell, the grandfather in the household on the sitcom Charles in Charge.

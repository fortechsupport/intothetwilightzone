bio: >-
  Paul Sand played Bluestone, the Broadway composer given one night back in his youth by the Devil (Gene Barry),
  in "Time and Teresa Golowitz" (1987). A Second City alumnus, he won a Tony Award for Paul Sills' Story Theatre
  (1971). He starred in his own sitcom, Paul Sand in Friends and Lovers (1974–75), and had many film and guest television
  roles.

bio: >-
  Television film director Robert Markowitz directed Twilight Zone: Rod Serling's Lost Classics, the 1994
  CBS movie that brought two unproduced Serling stories to the screen: The Theatre, expanded by Richard
  Matheson from a Serling outline, and Where the Dead Are, a complete script Serling had written in 1968.

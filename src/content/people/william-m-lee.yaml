name: William M. Lee
roles:
- author
bio: >-
  William M. Lee wrote "A Message from Charity" (1967), the story adapted for the 1985 revival episode in which
  a feverish boy in 1980s Massachusetts makes mental contact with a girl living in the same place in 1700. The novelette
  appeared in The Magazine of Fantasy and Science Fiction and is his best-known work in a small body of published
  science fiction.

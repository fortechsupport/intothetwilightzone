bio: >-
  McG directed Uglies (2024), Netflix's film of Scott Westerfeld's novel about a society where everyone is surgically
  made "pretty" at sixteen, which reviewers linked to the conformity episode "Eye of the Beholder." He began in
  music videos and directed Charlie's Angels and its sequel, Terminator Salvation and The Babysitter, and produced
  The O.C. and Supernatural.

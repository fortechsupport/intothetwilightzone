name: Fred Clark
roles:
- actor
born: '1914-03-19'
died: '1968-12-05'
bio: >-
  Fred Clark played Chester Diedrich, the small-time crook who steals a camera that photographs events five minutes
  in the future, in "A Most Unusual Camera" (1960). A balding comic foil, he appeared in Sunset Boulevard, Auntie
  Mame and Daddy Long Legs and was neighbor Harry Morton on The George Burns and Gracie Allen Show.

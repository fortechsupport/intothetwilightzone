bio: >-
  Barry Brown appeared in "Clean Kills and Other Trophies," a first-season Night Gallery segment about a big- game
  hunter who demands that his son make a kill. A promising young lead of the early 1970s, he starred opposite Jeff
  Bridges in Bad Company (1972) and opposite Cybill Shepherd in Peter Bogdanovich's Daisy Miller (1974). He died
  at 27.

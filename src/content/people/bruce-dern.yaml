born: '1936-06-04'
bio: >-
  Bruce Dern guest-starred in "To Hang a Dead Man" (1966), an episode of Rod Serling's western The Loner, early
  in a career of volatile character parts. He earned Academy Award nominations for Coming Home and Nebraska, the
  latter also winning him Cannes's best-actor prize.

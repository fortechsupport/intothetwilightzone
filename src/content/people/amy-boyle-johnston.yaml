bio: >-
  Amy Boyle Johnston is a Serling researcher and the author of Unknown Serling: An Episodic History, Vol. 1, which
  covers lesser-known Rod Serling scripts and stories linked to Ray Bradbury, John F. Kennedy, the Pentagon and
  the Second World War. Her work focuses on the parts of Serling's writing life that the standard biographies skip,
  including his early radio work and his war experiences.

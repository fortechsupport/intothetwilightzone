name: Dane Clark
roles:
- actor
born: '1912-02-18'
died: '1998-09-11'
bio: >-
  Dane Clark starred as Ace Larsen, a diner owner who uses his partner's telekinetic gift to win at dice, in "The
  Prime Mover" (1961), and later appeared in the third-season Night Gallery segment "Spectre in Tap-Shoes" (1972).
  A Warner Bros. contract player of the 1940s, he appeared in Destination Tokyo, Hollywood Canteen and Pride of
  the Marines, then worked steadily in television.

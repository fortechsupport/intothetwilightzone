name: Clint Howard
roles:
- actor
born: '1959-04-20'
bio: >-
  Clint Howard played Herbie Bittman, a boy who predicts earthquakes on television, in Rod Serling's Night Gallery
  segment "The Boy Who Predicted Earthquakes" (1971). A child star of Gentle Ben and the alien Balok in Star Trek,
  he is the younger brother of Ron Howard and appears in most of his brother's films.

bio: >-
  Gerard Parkes appeared in "The Crossing" (1988), a third-season segment of the 1980s revival about a priest haunted
  by a long-ago death. The Irish-born Canadian actor was a stage veteran and is remembered as Doc on Jim Henson's
  Fraggle Rock (North American version).

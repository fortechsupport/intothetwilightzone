bio: >-
  Daryl Duke directed "The Last Laurel" (1971), a first-season Night Gallery segment about a paralyzed man who uses
  astral projection to try to kill his wife's lover. The Canadian director made the thriller The Silent Partner
  (1978) and the miniseries The Thorn Birds.

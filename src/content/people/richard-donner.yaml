bio: >-
  Richard Donner directed six episodes in the original series' fifth season, most famously Nightmare at
  20,000 Feet, with William Shatner as the airline passenger who sees a gremlin on the wing; others include
  The Brain Center at Whipple's and Come Wander with Me. He went on to become a major Hollywood director
  with The Omen, Superman (1978), The Goonies and the Lethal Weapon films.

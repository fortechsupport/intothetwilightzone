bio: >-
  Jill Blotevogel wrote two episodes of the 2002 UPN Twilight Zone, "Night Route" and "Evergreen." She went on to
  create the CBS mystery miniseries Harper's Island (2009), and later co-created Ravenswood and served as a showrunner
  on MTV's Scream series. Her work centers on suspense and horror for television.

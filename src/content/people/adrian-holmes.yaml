name: Adrian Holmes
roles:
- actor
bio: >-
  Adrian Holmes appeared in "Tagged," an episode of the 2002 UPN Twilight Zone revival, one of many Vancouver-based
  actors cast in the series. Born in Wales and raised in Canada, he later starred as Detective Nick Barron in the
  police drama 19-2 and played Frank Pike on Arrow, and has had recurring roles across North American television.

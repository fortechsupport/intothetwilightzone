name: Bruce Bilson
roles:
- director
born: '1928'
died: '2025'
bio: >-
  Bruce Bilson directed "Welcome to Winfield" (1986), a comic 1980s-revival segment about the Angel of Death chasing
  a runaway patient to a sleepy Western town. He won an Emmy for directing Get Smart and directed hundreds of sitcom
  episodes, including Hogan's Heroes and The Andy Griffith Show; he was the grandfather of actress Rachel Bilson.
  He died at 97.

name: Season Hubley
roles:
- actor
born: '1951-05-14'
bio: >-
  Season Hubley starred in "Little Boy Lost" (1985), a first-season revival episode about a photographer torn between
  her career and the child who keeps appearing to her. She played Priscilla Presley opposite Kurt Russell in John
  Carpenter's Elvis (1979) and appeared in Hardcore and Escape from New York.

name: Walter Pidgeon
born: '1897-09-23'
died: '1984-09-25'
roles:
- actor
bio: >-
  Walter Pidgeon played Colonel Edward Hall, the stern military father of a court-martialed POW (Paul Newman), in
  The Rack (1956), MGM's film of Rod Serling's teleplay. He was nominated for Academy Awards for Mrs. Miniver and
  Madame Curie and played Dr. Morbius in Forbidden Planet.

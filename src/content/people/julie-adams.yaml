- actor
bio: >-
  Julie Adams appeared in "The Miracle at Camafeo," a second-season Night Gallery segment about an insurance fraud
  at a Mexican shrine. She is forever linked to Creature from the Black Lagoon (1954), as the scientist Kay Lawrence
  whom the Gill-man pursues. She also starred in Bend of the River and The Man from the Alamo, and later had recurring
  roles on Murder, She Wrote.

born: '1961-12-10'
bio: >-
  Nia Peeples appeared in Disney's Tower of Terror (1997), the television film based on the Twilight Zone Tower
  of Terror theme-park ride, about five guests who vanished from a Hollywood hotel elevator in 1939. She played
  Nicole Chapman on the series Fame, had a dance hit with "Trouble" (1988), and starred in Walker, Texas Ranger
  and Pretty Little Liars.

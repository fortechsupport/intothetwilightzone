bio: >-
  Scott Skelton co-wrote Rod Serling's Night Gallery: An After-Hours Tour (Syracuse University Press, 1999) with
  Jim Benson. The book gives a production history and a segment-by-segment guide to Night Gallery and its 1969 pilot
  film. It is the standard reference on the series, covering Serling's struggles with producer Jack Laird and Universal
  over control of the show.

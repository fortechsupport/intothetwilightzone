bio: >-
  Joseph Campanella appeared in two Night Gallery segments, the first-season "The Nature of the Enemy" and the second-season
  comic piece "Miss Lovecraft Sent Me." A ubiquitous television actor and narrator, he was Lou Wickersham on Mannix,
  a regular on The Lawyers segment of The Bold Ones, and Harper Deveraux on Days of Our Lives. He narrated many
  documentaries and was nominated for Emmy Awards for The Nurses and The Lawyers.

born: '1933-09-15'
died: '2021-03-14'
bio: >-
  Henry Darrow appeared in "Cool Air" (1971), Night Gallery's adaptation of H. P. Lovecraft's story about a scientist
  who keeps his apartment ice-cold to cheat death. He played Manolito Montoya on The High Chaparral and Zorro's
  father in Zorro (1990), and was a pioneering Latino actor in American television.

bio: >-
  David Faustino appeared as a child in "The Storyteller" (1986), the 1985-revival segment about a teacher whose
  student's great-grandfather survives on her stories. He became famous as Bud Bundy on Married... with Children
  and voiced Mako in The Legend of Korra.

bio: >-
  Erin Maher, with writing partner Kay Reindl, wrote two episodes of the 2002 Twilight Zone revival, "The Monsters
  Are on Maple Street," an update of Serling's classic, and "The Collection." The team had earlier written for Chris
  Carter's Millennium.

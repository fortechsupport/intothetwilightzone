bio: >-
  Frank McRae appeared in "Opening Day," a 1985 revival segment about a murder plotted for the first day of duck
  season. A former NFL player, he became a familiar action-film character actor, as Captain Haden in 48 Hrs., Sharkey
  in the James Bond film Licence to Kill and Lieutenant Dekker in Last Action Hero.

name: Werner Klemperer
roles:
- actor
born: '1920-03-22'
died: '2000-12-06'
bio: >-
  Werner Klemperer played the vampire client who books a funeral parlor for an unusual ceremony in Night Gallery's
  comic "The Funeral" (1972), written by Richard Matheson. The son of conductor Otto Klemperer, he won two Emmys
  as Colonel Klink on Hogan's Heroes.

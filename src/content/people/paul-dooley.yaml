born: '1928-02-22'
bio: >-
  Paul Dooley voiced a role in The Twilight Zone Radio Dramas adaptation of "The Mighty Casey," Rod Serling's baseball
  fantasy about a robot pitcher. He played the father in Breaking Away and Sixteen Candles, was a frequent member
  of Robert Altman's and Christopher Guest's ensembles, and voiced Sarge in Pixar's Cars.

name: Meg Foster
born: '1948-05-10'
roles:
- actor
bio: >-
  Meg Foster starred in "Dreams for Sale," a 1985 revival segment in which a woman's idyllic picnic turns out to
  be a purchased dream. Known for her pale blue eyes, she was the original Chris Cagney in the 1982 Cagney & Lacey
  TV movie and appeared in They Live, The Osterman Weekend and Masters of the Universe, as Evil-Lyn. She later had
  recurring roles in Pretty Little Liars and Twin Peaks: The Return.

bio: >-
  Lisa Jakub appeared as a child in "Street of Shadows," an episode of the 1985 revival's Toronto-produced final
  season. The Canadian actress is best known as Lydia Hillard, the eldest daughter, in Mrs. Doubtfire, and appeared
  in Independence Day. She later left acting and wrote the memoir You Look Like That Girl.

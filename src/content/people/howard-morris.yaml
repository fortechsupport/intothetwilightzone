bio: >-
  Howard Morris starred in "I Dream of Genie" as George P. Hanley, a meek office clerk who finds a lamp and agonizes
  over his one wish. He was one of Sid Caesar's sketch partners on Your Show of Shows and Caesar's Hour, played
  the hillbilly Ernest T. Bass on The Andy Griffith Show, and voiced Atom Ant, Mr. Peebles and many other cartoon
  characters. He also directed films and television episodes.

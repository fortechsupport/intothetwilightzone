born: '1940-09-11'
bio: >-
  Brian De Palma wrote and directed Phantom of the Paradise (1974), the rock-opera horror film whose opening narration
  was spoken, uncredited, by Rod Serling. De Palma became one of the defining American directors of the 1970s and
  1980s with Carrie, Dressed to Kill, Blow Out, Scarface and The Untouchables, and later Mission: Impossible (1996).

bio: >-
  Jim Benson co-wrote Rod Serling's Night Gallery: An After-Hours Tour (Syracuse University Press, 1999) with Scott
  Skelton. The book gives a production history and a segment-by-segment guide to Night Gallery and its 1969 pilot
  film. It is the standard reference on the series and draws on interviews with its writers, directors and cast.

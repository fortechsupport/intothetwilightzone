bio: >-
  Alice Frost played Aunt Amy, who forgets herself and begins to sing in a house where six-year-old Anthony controls
  everything, in "It's a Good Life" (1961). She was a major radio actress, a member of Orson Welles's Mercury Theatre
  on the Air and the star of Mr. and Mrs. North as the sleuthing Pam North. On television she was a regular on the
  family drama Mama.

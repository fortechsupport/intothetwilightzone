bio: >-
  John Tomerlin, a friend and frequent collaborator of Charles Beaumont, adapted Beaumont's story The
  Beautiful People into the fifth-season episode Number 12 Looks Just Like You. He wrote the script largely
  alone while Beaumont was ill yet received only shared credit. The two had earlier written the novel
  Run from the Hunter together under the pen name Keith Grantland, and Tomerlin also wrote for Thriller
  and the 1973 TV film The Picture of Dorian Gray.

name: Gus Trikonis
roles:
- director
born: '1937'
bio: >-
  Gus Trikonis directed four segments of the 1985 revival: "Take My Life...Please!," "Cold Reading," "What Are Friends
  For?" and "Lost and Found." He began as a dancer, playing Indio in the film of West Side Story (1961), then directed
  drive-in features such as The Evil and Moonshine County Express before moving into television. He was married
  to Goldie Hawn from 1969 to 1976.

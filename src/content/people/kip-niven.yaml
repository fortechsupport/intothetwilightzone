name: Kip Niven
roles:
- actor
born: '1945-05-27'
died: '2019'
bio: >-
  Kip Niven played David Faulkner, the photographer who becomes obsessed with a model who feeds on the men who look
  at her, in "The Girl with the Hungry Eyes" (1972), the third-season Night Gallery adaptation of Fritz Leiber's
  story. A Universal contract player in the early 1970s, he appeared in Magnum Force, Earthquake and Midway, and
  in many television series.

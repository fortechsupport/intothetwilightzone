bio: >-
  Chris Diamantopoulos appeared in "Nightmare at 30,000 Feet" (2019), the 2019 revival's reimagining of the classic
  episode, as an airline passenger alongside Adam Scott. He is known as Moe in The Three Stooges (2012), Russ Hanneman
  on Silicon Valley and the voice of Mickey Mouse in the 2013 Mickey Mouse shorts.

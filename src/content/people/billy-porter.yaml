name: Billy Porter
born: '1969-09-21'
roles:
- actor
bio: >-
  Billy Porter starred in "The Who of You," a 2019 episode of Jordan Peele's revival, as a struggling actor who
  discovers he can swap bodies with other people during a bank robbery. He won a Tony Award as Lola in the musical
  Kinky Boots and became the first openly gay Black man to win the Emmy for lead actor in a drama, for Pray Tell
  on Pose. He is also a recording artist with a Grammy for the Kinky Boots cast album.

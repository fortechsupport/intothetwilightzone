bio: >-
  Piper Laurie earned three Oscar nominations, for The Hustler, Carrie and Children of a Lesser God, and
  won an Emmy for Promise; she was later Catherine Martell on Twin Peaks. In Ray Bradbury's "The Burning
  Man" she plays an aunt driving her nephew through a heat wave when they pick up a sinister hitchhiker.

name: Ron Masak
roles:
- actor
born: '1936-07-01'
died: '2022-10-20'
bio: >-
  Ron Masak had an early role as one of the soldiers in "The Purple Testament" (1960), Rod Serling's story of a
  World War II lieutenant who can see death in the faces of the men around him. He became known as Sheriff Mort
  Metzger on Murder, She Wrote and as a prolific commercial spokesman. He died in October 2022.

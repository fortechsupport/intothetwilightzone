bio: >-
  John Agar appeared in "A Day in Beaumont" (1986), the 1985 revival's affectionate homage to 1950s alien- invasion
  B movies, a casting nod to his own career in them. He co-starred in the John Ford westerns Fort Apache and She
  Wore a Yellow Ribbon and became a genre fixture in Revenge of the Creature, Tarantula and The Mole People; he
  was Shirley Temple's first husband.

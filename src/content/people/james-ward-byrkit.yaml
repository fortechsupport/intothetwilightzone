bio: >-
  James Ward Byrkit wrote and directed Coherence (2013), a micro-budget puzzle film about a dinner party that splinters
  into parallel realities during a comet's pass, which critics have traced directly to The Twilight Zone. He was
  also a storyboard artist and story writer on Gore Verbinski's animated Rango.

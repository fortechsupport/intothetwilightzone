bio: >-
  Carol Burnett is a comedy legend whose variety series The Carol Burnett Show won multiple Emmys over
  11 seasons. She starred in "Cavender Is Coming", a comic Twilight Zone episode about a hapless woman
  and a bumbling guardian angel, which was intended as a backdoor pilot for a series that never went ahead.

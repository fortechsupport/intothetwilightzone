bio: >-
  Larry Linville appeared in the Night Gallery segment "The Academy," about a military school for troubled boys,
  and in an episode of The Sixth Sense, the supernatural series later folded into Night Gallery's syndication package.
  He is best known as the pompous surgeon Major Frank Burns on M*A*S*H (1972-1977).

bio: >-
  Ray Bradbury's only produced script for the original Twilight Zone was I Sing the Body Electric (1962),
  the series' 100th episode, about a family who acquire a robot grandmother. His stories were adapted
  again by the 1985 revival in The Burning Man and The Elevator. The author of Fahrenheit 451 and The
  Martian Chronicles, he also hosted his own anthology series, The Ray Bradbury Theater, from 1985 to
  1992.

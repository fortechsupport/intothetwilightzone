bio: >-
  Before he became a director, Paul Mazursky acted in two original-series episodes, "He's Alive," with Dennis Hopper,
  and "The Gift." He went on to write and direct sharply observed comedies of modern life, including Bob & Carol
  & Ted & Alice, Harry and Tonto, An Unmarried Woman and Down and Out in Beverly Hills, earning five Academy Award
  nominations. He also continued to act, in films such as A Star Is Born (1976) and on Curb Your Enthusiasm.

bio: >-
  Tawny Newsome appeared in "Ovation," a 2020 episode of the Jordan Peele revival in which a street singer is given
  a coin that makes her an overnight star. She voices Ensign Beckett Mariner on Star Trek: Lower Decks and played
  Captain Angela Ali on Netflix's Space Force. She is also an improviser, podcaster and musician.

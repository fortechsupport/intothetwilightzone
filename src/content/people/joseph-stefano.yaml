bio: >-
  Joseph Stefano was producer and principal writer of the first season of The Outer Limits (1963–64), the anthology
  that was ABC's answer to The Twilight Zone. He shaped its gothic, monster-driven style with scripts such as "The
  Zanti Misfits" and "The Forms of Things Unknown." Before that he wrote the screenplay for Alfred Hitchcock's Psycho
  (1960), and he later wrote for the 1990s Outer Limits revival.

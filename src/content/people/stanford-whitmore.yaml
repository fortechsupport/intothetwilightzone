born: '1925'
bio: >-
  Stanford Whitmore wrote two second-season Night Gallery segments in 1972: "A Feast of Blood" and "Little Girl
  Lost." A novelist (Solo, 1955) turned screenwriter, he wrote the Korean War film War Hunt (1962) and a long run
  of television drama scripts.

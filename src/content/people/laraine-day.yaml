born: '1920-10-13'
died: '2007-11-10'
bio: >-
  Laraine Day guest-starred in "The Heart That Wouldn't Stay Buried" (1972), an episode of ABC's The Sixth Sense,
  a series later folded into the syndicated Night Gallery package. She played nurse Mary Lamont in MGM's Dr. Kildare
  films and starred in Hitchcock's Foreign Correspondent; she was married to baseball manager Leo Durocher.

born: '1929-12-09'
died: '1989-02-03'
bio: >-
  John Cassavetes played Tony Sinclair, the reckless younger brother of a reformed gunman (Robert Taylor), in Saddle
  the Wind (1958), a western written by Rod Serling. He pioneered American independent cinema as director of Shadows,
  Faces and A Woman Under the Influence, and as an actor was Oscar-nominated for The Dirty Dozen and starred in
  Rosemary's Baby.

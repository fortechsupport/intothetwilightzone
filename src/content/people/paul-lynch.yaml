born: '1946'
bio: >-
  English-born Canadian director Paul Lynch, best known for the slasher film Prom Night (1980), directed
  ten episodes of the 1985 revival, more than anyone else, across all three seasons, including Examination
  Day, A Message from Charity, Wong's Lost and Found Emporium and Crazy as a Soup Sandwich.

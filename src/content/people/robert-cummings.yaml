bio: >-
  Robert Cummings starred in Hitchcock's Saboteur and Dial M for Murder and won an Emmy for the original
  Twelve Angry Men, later headlining The Bob Cummings Show. He opened the second season almost single-handedly
  in "King Nine Will Not Return", as a WWII bomber pilot who wakes beside his crashed plane in the desert
  with no crew in sight.

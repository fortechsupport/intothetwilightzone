bio: >-
  Godfrey Cambridge starred in "Make Me Laugh" (1971), a Night Gallery segment about a failing comic who gets a
  miracle-worker's help to make audiences laugh. A stand-up comedian and Obie-winning stage actor, he starred in
  Watermelon Man and Cotton Comes to Harlem.

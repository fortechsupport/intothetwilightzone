bio: >-
  Thalmus Rasulala appeared in "The Brain Center at Whipple's" (1964), Rod Serling's parable of automation, credited
  under his birth name, Jack Crowder. He took the name Thalmus Rasulala in the late 1960s and became known for Blacula
  (1972), Cool Breeze and Roots, and played Rerun's father on What's Happening!!

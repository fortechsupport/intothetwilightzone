bio: >-
  Don Ingalls was the most frequent writer of The Sixth Sense (1972), credited on seven episodes including "The
  Man Who Died at Three and Nine" and "With Affection, Jack the Ripper"; the series' episodes were later cut down
  and syndicated as part of the Night Gallery package with new Serling introductions. A former newspaperman and
  Korean War veteran, he wrote and produced westerns such as Have Gun - Will Travel and Gunsmoke, wrote two Star
  Trek episodes including "A Private Little War," and later produced Fantasy Island.

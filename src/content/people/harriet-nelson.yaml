name: Harriet Nelson
roles:
- actor
born: '1909-07-18'
died: '1994-10-02'
bio: >-
  Harriet Nelson starred with her husband Ozzie Nelson in "You Can Come Up Now, Mrs. Millikan" (1972), a third-season
  Night Gallery comedy about a failed inventor and his long-suffering wife. A big-band singer in Ozzie's orchestra,
  she co-starred with him and their sons David and Ricky on The Adventures of Ozzie and Harriet on radio and then
  television (1952-66), the longest-running live-action sitcom of its era.

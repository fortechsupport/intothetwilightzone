born: '1948-12-23'
died: '2015-10-31'
bio: >-
  Charles Herbert played Tom, one of the motherless children whose family buys a robot grandmother, in Ray Bradbury's
  "I Sing the Body Electric" (1962). He was one of the busiest child actors of the late 1950s, best known for The
  Fly (1958) as the son of the doomed scientist, The Colossus of New York and William Castle's 13 Ghosts (1960).

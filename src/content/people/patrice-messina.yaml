bio: >-
  Patrice Messina wrote two scripts for the 1985 Twilight Zone revival: "Grace Note" (1986), about a singer whose
  sister is shown the career she could have had, and "The Convict's Piano" (1986), about a prisoner whose piano
  plays him back to its former owners' lives. Both are gentle, music-centred fantasies.

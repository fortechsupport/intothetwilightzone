bio: >-
  Lennie Weinrib appeared in "Miniature," the fourth-season hour with Robert Duvall. A comic actor and writer, he
  became a major voice performer, voicing H.R. Pufnstuf, the original Scrappy-Doo and many characters for Hanna-Barbera
  and Sid and Marty Krofft.

bio: >-
  Mariette Hartley won an Emmy for The Incredible Hulk and became known for her witty Polaroid commercials
  with James Garner; she also appeared in Star Trek's "All Our Yesterdays". In "The Long Morrow" she plays
  the woman an astronaut falls in love with before embarking on a 40-year mission in suspended animation.

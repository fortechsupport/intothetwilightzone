name: Jeffrey Byron
roles:
- actor
bio: >-
  Jeffrey Byron played Jeff, one of the neglected siblings who escape through their swimming pool to a kindly old
  woman's world, in "The Bewitchin' Pool" (1964), the last episode of the original series to air. As an adult he
  acted in 1980s fantasy and science fiction films such as Metalstorm: The Destruction of Jared-Syn.

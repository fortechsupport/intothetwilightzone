bio: >-
  Horror writer Dennis Etchison was the principal adapter of The Twilight Zone Radio Dramas, turning dozens
  of the original television scripts into full-cast audio plays for the series launched in 2002 with Stacy
  Keach as narrator; on this site's radio list he is credited on nearly every episode. A master of quiet,
  unsettling short fiction, he won the British Fantasy Award three times and the World Fantasy Award,
  served as president of the Horror Writers Association and received the Bram Stoker Award for Lifetime
  Achievement.

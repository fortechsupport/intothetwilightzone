name: Jennifer Dale
born: '1955'
roles:
- actor
bio: >-
  Jennifer Dale appeared in "Our Selena Is Dying" (1988), a third-season episode of the 1985 revival that J. Michael
  Straczynski scripted from an unproduced Rod Serling story about a young woman who fades as her bedridden aunt
  grows stronger. The Canadian actress has had a long career in film and television.

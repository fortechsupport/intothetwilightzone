bio: >-
  Leonard Strong played the title role in "The Hitch-Hiker," the gaunt, patient figure who keeps appearing by the
  roadside ahead of Inger Stevens's terrified driver. A character actor often cast in Asian roles in 1940s films,
  he also appeared in Shane and many television series.

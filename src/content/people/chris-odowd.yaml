born: '1979-10-09'
bio: >-
  Chris O'Dowd starred in "The Blue Scorpion" (2019), a first-season episode of Jordan Peele's revival, as Jeff
  Storck, a professor who inherits his late father's revolver and becomes convinced it has a will of its own. The
  Irish actor is known for The IT Crowd, Bridesmaids, The Sapphires and Moone Boy, which he created.

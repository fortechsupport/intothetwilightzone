born: '1931-08-23'
bio: >-
  Barbara Eden co-starred with Pat Boone as the wife of a kidnapped baby's father in The Yellow Canary (1963), a
  thriller with a screenplay by Rod Serling. She became a television icon as Jeannie on I Dream of Jeannie (1965-70),
  and also starred in 7 Faces of Dr. Lao and Harper Valley PTA.

name: Edward G. Robinson
born: '1893-12-12'
died: '1973-01-26'
roles:
- actor
bio: >-
  Edward G. Robinson starred in "The Messiah on Mott Street" (1971), Serling's Night Gallery Christmas story of
  a dying old man in the Lower East Side who waits for the Messiah to save his grandson; it was one of his last
  screen roles. A star since Little Caesar (1931), he made Double Indemnity, Scarlet Street and Key Largo, and received
  an honorary Oscar shortly after his death.

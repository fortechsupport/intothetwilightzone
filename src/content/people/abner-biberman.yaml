bio: >-
  Character actor turned director Abner Biberman directed four original-series episodes: The Dummy, The
  Incredible World of Horace Ford, Number 12 Looks Just Like You and I Am the Night—Color Me Black. He
  had spent the 1930s and 1940s playing heavies in Hollywood films before moving behind the camera, mostly
  in television.

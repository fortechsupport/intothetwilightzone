bio: >-
  Doug Heyes Jr. appeared as a child in "Dust" (1961), the western parable about a con man selling "magic" dust
  to the family of a condemned man. The episode was directed by his father, Douglas Heyes, who directed some of
  the original series' most celebrated episodes, including "The Eye of the Beholder" and "The Howling Man." Further
  details of his career are not well documented.

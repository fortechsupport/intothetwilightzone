bio: >-
  Lonny Chapman appeared in the Night Gallery segment "Silent Snow, Secret Snow" (1971), from Conrad Aiken's story,
  and in The Loner episode "The Burden of the Badge." A stage-trained character actor, he appeared in Baby Doll,
  The Birds and The Reivers, and ran the Group Repertory Theatre in Los Angeles for decades.

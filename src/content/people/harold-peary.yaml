bio: >-
  Harold Peary guest-starred in "The Sheriff of Fetterman's Crossing" (1965), a comic episode of Rod Serling's western
  The Loner. He was famous for creating Throckmorton P. Gildersleeve on radio's Fibber McGee and Molly and its spin-off
  The Great Gildersleeve.

bio: >-
  Daniel Sunjata appeared in "The Who of You," a 2019 episode of the Jordan Peele revival starring Billy Porter
  as a body-hopping bank robber. He is known for playing firefighter Franco Rivera on Rescue Me and FBI agent Paul
  Briggs on Graceland. On Broadway he earned a Tony nomination for Take Me Out.

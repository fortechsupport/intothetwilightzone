bio: >-
  Ken Lerner appeared in "The Card," a 1988 episode of the revival's final season about a credit card company with
  supernatural collection powers. He is known as Principal Bob Flutie in the first season of Buffy the Vampire Slayer,
  and has played many supporting roles in film and television.

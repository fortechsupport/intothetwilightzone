name: Joe DeRita
roles:
- actor
born: '1909-07-12'
died: '1993-07-03'
bio: >-
  Joe DeRita had a supporting part in "The Time Element" (1958), Rod Serling's Westinghouse Desilu Playhouse drama
  about a man who dreams he is in Honolulu on the eve of Pearl Harbor, widely regarded as the unofficial pilot for
  The Twilight Zone. A burlesque comic, he joined the Three Stooges in 1958 as "Curly Joe," the last man to fill
  the third slot, and appeared in their feature films of the 1960s.

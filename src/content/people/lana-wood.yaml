born: '1946-03-01'
bio: >-
  Lana Wood appeared in "You Can't Get Help Like That Anymore" (1972), the Night Gallery segment about a cruel couple
  and their android servants. She played Plenty O'Toole in Diamonds Are Forever, appeared as a child in The Searchers,
  and is the younger sister of Natalie Wood.

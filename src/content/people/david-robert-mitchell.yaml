bio: >-
  David Robert Mitchell wrote and directed The End of Oak Street (2026), about a suburban street dropped into a
  prehistoric wilderness, a film whose coverage cites The Twilight Zone as an inspiration. He also made The Myth
  of the American Sleepover, It Follows and Under the Silver Lake.

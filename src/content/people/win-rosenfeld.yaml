bio: >-
  Win Rosenfeld, president of Jordan Peele's Monkeypaw Productions, was an executive producer of the 2019
  revival and wrote the second-season episode The Who of You. He later co-wrote the 2021 film Candyman
  with Peele and director Nia DaCosta.

bio: >-
  John Randolph appeared in Serling's own Night Gallery segment "They're Tearing Down Tim Riley's Bar" (1971). Blacklisted
  in the 1950s, he returned to films in Seconds (1966) and later appeared in Serpico and Prizzi's Honor, won a Tony
  for Broadway Bound, and played Roseanne's father on Roseanne.

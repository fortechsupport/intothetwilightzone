bio: >-
  Jack Palance was a menacing presence in Shane and Sudden Fear before winning an Academy Award late in
  life for City Slickers, and he also hosted Ripley's Believe It or Not!. In "Where the Dead Are" he played
  Dr. Jeremy Wheaton, the physician behind the island's unnatural longevity.

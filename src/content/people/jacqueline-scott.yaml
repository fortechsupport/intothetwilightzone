bio: >-
  Jacqueline Scott played Helen Gaines, the wife of Steve Forrest's astronaut, who returns from orbit to a world
  that is almost, but not quite, his own in "The Parallel." She was one of the busiest guest actresses of 1960s
  television and is best remembered as Donna Kimble Taft, Richard Kimble's sister, on The Fugitive. Her films include
  Charley Varrick and Duel.

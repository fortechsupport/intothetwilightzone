bio: >-
  Charles Davis appeared in "Lone Survivor" (1971), the Night Gallery segment in which a passenger plucked from
  a Titanic lifeboat turns out to be doomed to drift from one maritime disaster to the next. An Irish-born character
  actor, he worked steadily in American film and television from the 1950s on.

bio: >-
  Joby Harold is among the writers attached over the years to Warner Bros.' long-gestating Twilight Zone feature
  film. He wrote and produced films including King Arthur: Legend of the Sword, Army of the Dead and Transformers:
  Rise of the Beasts, and co-created the series Obi-Wan Kenobi.

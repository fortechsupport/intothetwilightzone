born: '1924-11-30'
died: '1973-11-20'
bio: >-
  Allan Sherman guest-starred as a reluctant small-town lawman in "The Sheriff of Fetterman's Crossing," a comic
  episode of Rod Serling's western The Loner (1965-66). He was a television producer, creator of the panel show
  I've Got a Secret, before a surprise run of hit song-parody albums beginning with My Son, the Folk Singer (1962).
  His summer-camp letter song "Hello Muddah, Hello Fadduh" won a Grammy and remains his best-known work.

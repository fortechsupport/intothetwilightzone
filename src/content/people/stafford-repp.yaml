bio: >-
  Stafford Repp appeared in three episodes of the original Twilight Zone: "Nick of Time" (1960), "The Grave" (1961),
  as one of the townsmen who goad the gunman into visiting a dead outlaw's grave, and "Caesar and Me" (1964). A
  heavyset character actor, he is best remembered as Chief O'Hara on the 1966-68 Batman series and its feature film.

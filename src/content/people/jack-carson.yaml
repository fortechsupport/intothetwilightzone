died: '1963-01-02'
roles:
- actor
bio: >-
  Jack Carson starred in "The Whole Truth" as Harvey Hunnicut, a fast-talking used-car dealer who buys a haunted
  Model A that forces its owner to tell the truth. A genial Warner Bros. star of the 1940s, he played opposite Joan
  Crawford in Mildred Pierce and later gave strong supporting performances in A Star Is Born (1954) and Cat on a
  Hot Tin Roof. He died of stomach cancer two years after his Twilight Zone appearance.

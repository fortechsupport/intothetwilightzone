name: Diana Lynn
roles:
- actor
born: '1926-10-07'
died: '1971-12-18'
bio: >-
  Diana Lynn starred in "Forbidden Area" (1956), the first broadcast of CBS's Playhouse 90, adapted by Rod Serling
  from Pat Frank's Cold War novel and directed by John Frankenheimer. A child prodigy pianist, she became a Paramount
  star in The Major and the Minor (1942) and Preston Sturges's The Miracle of Morgan's Creek, and later worked mainly
  in television and on stage.

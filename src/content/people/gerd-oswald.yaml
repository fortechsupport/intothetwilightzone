born: '1919-06-09'
died: '1989-05-22'
bio: >-
  Gerd Oswald directed two first-season episodes of the 1980s Twilight Zone revival, "The Beacon" and "The Star"
  (1985), the latter adapted from Arthur C. Clarke's story. The son of German director Richard Oswald, he made the
  film noir A Kiss Before Dying (1956) and became one of the defining directors of The Outer Limits, directing fourteen
  of its episodes; he also directed Star Trek's "The Conscience of the King."

bio: >-
  James Crocker wrote for both the 1985 revival, with A Little Peace and Quiet, Chameleon, The Leprechaun-Artist,
  a remake of Shadow Play and The Convict's Piano, and the 2002 UPN series, for which he wrote episodes
  including Time Lapse, Sensuous Cindy and Rewind. He is one of the few writers to work on two different
  incarnations of the series.

bio: >-
  Martin Grams Jr. wrote The Twilight Zone: Unlocking the Door to a Television Classic (OTR Publishing, 2008), an
  episode-by-episode production history of the original series. The book draws on CBS and Cayuga Productions paperwork,
  script drafts and correspondence, and it is one of the most detailed reference works on the show. Grams is a broadcasting
  historian whose other books cover old-time radio and early television series. He also writes about Twilight Zone
  books and research on his long-running blog.

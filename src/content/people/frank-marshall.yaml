bio: >-
  Frank Marshall was executive producer of Twilight Zone: The Movie (1983), the Warner Bros. anthology produced
  by Steven Spielberg and John Landis. He was a founding partner of Amblin Entertainment with Spielberg and Kathleen
  Kennedy, and produced Raiders of the Lost Ark, the Back to the Future films and many others. He also directed
  films including Arachnophobia and Alive.

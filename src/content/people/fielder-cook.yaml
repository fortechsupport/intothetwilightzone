name: Fielder Cook
born: '1923-03-09'
died: '2003-06-20'
roles:
- director
bio: >-
  Fielder Cook directed Patterns, Rod Serling's breakthrough boardroom drama, both as the live 1955 Kraft Television
  Theatre broadcast and the 1956 feature film, and later directed Serling's Holocaust drama In the Presence of Mine
  Enemies for Playhouse 90 (1960). The Patterns broadcast made Serling famous overnight and established Cook as
  a leading director of live television drama. His later work includes the film A Big Hand for the Little Lady and
  the TV movie The Homecoming: A Christmas Story, the pilot for The Waltons.

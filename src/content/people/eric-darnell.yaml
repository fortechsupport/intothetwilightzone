bio: >-
  Eric Darnell co-directed DreamWorks' Madagascar (2005), in which a panicking lemur waves a book titled "To Serve
  Lemur" and cries that it is a cookbook, a direct riff on "To Serve Man." He also co-directed Antz (1998) and the
  Madagascar sequels.

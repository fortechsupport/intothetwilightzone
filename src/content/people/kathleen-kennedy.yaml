bio: >-
  Kathleen Kennedy was associate producer of Steven Spielberg's segment of Twilight Zone: The Movie (1983), the
  remake of Kick the Can. She co-founded Amblin Entertainment with Spielberg and Frank Marshall and produced E.T.
  the Extra-Terrestrial, Jurassic Park and many other films. In 2012 she became president of Lucasfilm.

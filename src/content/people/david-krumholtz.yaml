bio: >-
  David Krumholtz appeared in "A Small Town" (2020), a second-season episode of Jordan Peele's revival in which
  a grieving handyman discovers that repairs made to a model of his town come true in the real one. He is known
  for Numb3rs, the Santa Clause films, 10 Things I Hate About You and Oppenheimer.

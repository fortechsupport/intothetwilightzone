name: Timothy Bottoms
roles:
- actor
born: '1951-08-30'
bio: >-
  Timothy Bottoms starred in "The Hellgramite Method" (1988), a third-season episode of the 1985 revival about an
  alcoholic who takes a radical cure in which a worm consumes his craving. He played Sonny Crawford in The Last
  Picture Show (1971) and the law student Hart in The Paper Chase, and later played George W. Bush in the sitcom
  That's My Bush!

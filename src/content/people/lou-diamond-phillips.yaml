bio: >-
  Lou Diamond Phillips broke through as Ritchie Valens in La Bamba and earned a Golden Globe nomination
  for Stand and Deliver, later starring on Longmire and Prodigal Son. He headlined "The Pool Guy" in the
  UPN revival and was the first star of the Twilight Zone radio dramas, voicing the lead in "A Kind of
  Stopwatch" and three other adaptations.

bio: >-
  Malcolm Campbell edited the prologue and John Landis's Time Out segment of Twilight Zone: The Movie (1983). He
  was Landis's regular editor through the 1980s, on films including Trading Places, Spies Like Us, Three Amigos
  and Coming to America.

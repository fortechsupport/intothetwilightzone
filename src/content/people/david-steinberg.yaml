bio: >-
  Canadian comedian David Steinberg directed "The Uncle Devil Show" (1985), a 1985-revival segment about a child
  whose TV show teaches him the Devil's magic. A provocative stand-up of the 1960s (his sermons helped end The Smothers
  Brothers Comedy Hour), he became a sitcom director of Seinfeld, Mad About You and Curb Your Enthusiasm and hosted
  Inside Comedy.

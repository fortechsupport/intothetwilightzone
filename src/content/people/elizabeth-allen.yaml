born: '1929-01-25'
died: '2006-09-19'
bio: >-
  Elizabeth Allen played the cool saleswoman on the department store's nonexistent ninth floor in "The After Hours"
  (1960), the episode in which a shopper (Anne Francis) learns she is a mannequin. She appeared with John Wayne
  in Donovan's Reef (1963) and earned Tony nominations on Broadway for The Gay Life and Do I Hear a Waltz?

bio: >-
  Ann Jillian played Ilse Nielsen, the girl raised to communicate only by telepathy who must learn to speak after
  her parents die, in "Mute" (1963), one of the hour-long fourth-season episodes. A child actress, she had already
  appeared in Disney's Babes in Toyland (1961) and the film of Gypsy (1962), and she was a regular on Hazel. As
  an adult she starred in the sitcom It's a Living, earned an Emmy nomination playing Mae West, and played herself
  in The Ann Jillian Story (1988) after speaking publicly about her breast cancer.

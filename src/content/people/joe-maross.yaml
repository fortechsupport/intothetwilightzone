name: Joe Maross
roles:
- actor
born: '1923-02-07'
died: '2009-11-07'
bio: >-
  Joe Maross played Jerry Riden, the test pilot who helps his friend's family escape their planet before nuclear
  war, in "Third from the Sun" (1960), and Peter Craig, the gentler of two astronauts who find a miniature civilization,
  in "The Little People" (1962). A busy television guest actor of the 1950s through the 1980s, he had a regular
  role on Peyton Place.

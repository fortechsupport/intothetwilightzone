bio: >-
  A former carnival pitchman and bit-part actor turned television writer, Montgomery Pittman wrote and
  directed three Twilight Zone episodes in its third season, Two, The Grave and The Last Rites of Jeff
  Myrtlebank, and directed two others. He had built his career on Warner Bros. westerns and detective
  shows such as Maverick and 77 Sunset Strip, often directing his own scripts. He died of cancer at 45,
  shortly after his Twilight Zone work aired.

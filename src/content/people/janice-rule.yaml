name: Janice Rule
roles:
- actor
born: '1931-08-15'
died: '2003-10-17'
bio: >-
  Janice Rule starred as the schoolteacher Helen Foley, visited by a solemn little girl who is her own younger self,
  in "Nightmare as a Child" (1960); Rod Serling named the character after his own beloved high-school teacher. Rule
  appeared in The Chase, The Swimmer and Robert Altman's 3 Women, and in later life became a practicing psychoanalyst.

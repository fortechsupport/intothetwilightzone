bio: >-
  William Schallert played a policeman in "Mr. Bevis," Serling's 1960 comedy about a lovable eccentric and his guardian
  angel. He is best known as Martin Lane, the father on The Patty Duke Show, and as Nilz Baris in Star Trek's "The
  Trouble with Tribbles." He served as president of the Screen Actors Guild from 1979 to 1981 and worked into his
  nineties.

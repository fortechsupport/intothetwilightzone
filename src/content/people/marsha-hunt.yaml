name: Marsha Hunt
roles:
- actor
born: '1917-10-17'
died: '2022-09-07'
bio: >-
  Marsha Hunt played the older Anne Henderson, the embittered woman in black who tries to stop her younger self
  from making a fateful choice, in Richard Matheson's "Spur of the Moment" (1964). A 1940s MGM actress in Pride
  and Prejudice and The Human Comedy, she was blacklisted in the McCarthy era and became a lifelong humanitarian
  activist.

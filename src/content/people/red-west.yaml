bio: >-
  Red West appeared in "The Once and Future King," a 1986 revival segment in which an Elvis Presley impersonator
  travels back in time and meets the young Elvis. The casting was pointed: West was Presley's high-school friend,
  bodyguard and a core member of the "Memphis Mafia" for two decades, and he co-wrote the 1977 memoir Elvis: What
  Happened? He was also a stuntman and character actor in Road House and Goodbye Solo.

born: '1918'
died: '1994'
bio: >-
  James T. Aubrey was president of CBS Television for most of the original Twilight Zone's run, and his decisions
  shaped its later years: the network dropped the show from its fall 1962 schedule, brought it back in January 1963
  as an hour-long series, and returned it to half an hour for a final season before ending it in 1964. Aubrey ran
  CBS from 1959 to 1965, a period of record ratings built on rural comedies such as The Beverly Hillbillies, and
  he was nicknamed the Smiling Cobra for his hard dealing. He later headed MGM.

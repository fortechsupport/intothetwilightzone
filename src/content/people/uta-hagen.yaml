bio: >-
  Uta Hagen appeared in "The Library," a 1986 revival segment about a librarian who learns that the books in her
  care contain the lives of real people. A towering stage actress, she won Tony Awards for The Country Girl and
  as the first Martha in Who's Afraid of Virginia Woolf? She taught acting for decades at the HB Studio in New York,
  and her book Respect for Acting remains a standard text.

bio: >-
  Pat Conway guest-starred in "Mantrap" (1966), an episode of Rod Serling's western The Loner. He starred as Sheriff
  Clay Hollister in the late-1950s western series Tombstone Territory and was the grandson of silent-film director
  Jack Conway.

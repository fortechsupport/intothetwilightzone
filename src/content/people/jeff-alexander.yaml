name: Jeff Alexander
bio: >-
  Pianist-turned-arranger who started in vaudeville and became an MGM and television composer. Reba Wissner counts
  two Twilight Zone scores by him, the best known being the wistful 'The Trouble with Templeton', which weaves in
  a Johann Strauss waltz on a music box.

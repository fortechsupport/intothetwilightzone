bio: >-
  John Dehner was a versatile radio, film and television actor, best remembered as the radio voice of
  Paladin on Have Gun – Will Travel and for scores of Western roles. He appeared in three original Twilight
  Zone episodes, from the prison-ship captain in "The Lonely" to the con-man who 'raises the dead' in
  "Mr. Garrity and the Graves".

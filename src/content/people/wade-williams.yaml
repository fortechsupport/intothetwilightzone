bio: >-
  Wade Williams voiced roles in The Twilight Zone Radio Dramas versions of "A Game of Pool" and "Mute." He is best
  known as the corrections officer Brad Bellick on Prison Break. His other television work includes Ghost Whisperer,
  Erased and many guest roles.

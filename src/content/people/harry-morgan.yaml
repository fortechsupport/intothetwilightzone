bio: >-
  Harry Morgan was a veteran character actor best known as Officer Bill Gannon on Dragnet and Colonel
  Sherman Potter on M*A*S*H, for which he won an Emmy. In the 1986 segment "The Curious Case of Edgar
  Witherspoon" he plays an eccentric old man whose bizarre contraption, he insists, is all that keeps
  the world from falling apart.

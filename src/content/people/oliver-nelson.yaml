bio: >-
  Oliver Nelson wrote music for Night Gallery. A jazz saxophonist and arranger, he is best known for the album The
  Blues and the Abstract Truth, and in the late 1960s and 1970s he scored Universal television series including
  Ironside and The Six Million Dollar Man. He died in 1975.

name: Virna Lisi
roles:
- actor
born: '1936-11-08'
died: '2014-12-18'
bio: >-
  Virna Lisi co-starred with Frank Sinatra in Assault on a Queen (1966), the caper film Rod Serling adapted from
  Jack Finney's novel about a gang that raises a sunken U-boat to rob the Queen Mary. The Italian actress had been
  groomed by Hollywood as a new star after How to Murder Your Wife (1965), and much later won the Best Actress prize
  at Cannes for La Reine Margot (1994).

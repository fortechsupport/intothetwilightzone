bio: >-
  Jim McBride directed "The Once and Future King" (1986), the 1985-revival episode about an Elvis impersonator who
  travels back in time and meets the young Elvis Presley. His films include David Holzman's Diary, Breathless (1983),
  The Big Easy and Great Balls of Fire!.

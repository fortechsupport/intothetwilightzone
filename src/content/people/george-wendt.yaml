bio: >-
  George Wendt starred in "The World Next Door" (1986), a 1985 revival segment about a failed inventor who discovers
  a doorway in his basement to a world where he is celebrated. He is best known as the barfly Norm Peterson on Cheers,
  a role that brought him six Emmy nominations, and as a "Superfans" sketch regular on Saturday Night Live.

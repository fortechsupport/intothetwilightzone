name: Barclay Hope
roles:
- actor
bio: >-
  Barclay Hope appeared in "The Cold Equations" (1989), the revival's adaptation of Tom Godwin's famous science
  fiction story about a stowaway on an emergency spaceship. The Canadian actor, brother of actor William Hope, was
  a regular on the Canadian-produced series Psi Factor and has worked widely in Toronto film and television production.

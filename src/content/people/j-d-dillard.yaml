bio: >-
  J.D. Dillard directed "Downtime" (2020), a second-season episode of the Jordan Peele revival in which a hotel
  manager learns her world is a simulation. He made the independent superhero thriller Sleight (2016) and the island
  horror film Sweetheart, then directed the Korean War aviation drama Devotion (2022).

name: Byron Morrow
roles:
- actor
born: '1911-09-08'
died: '2006-05-11'
bio: >-
  Byron Morrow appeared in "Eyes," the Steven Spielberg-directed segment of the 1969 Night Gallery pilot film, in
  which a blind, rich woman (Joan Crawford) buys a stranger's eyes for a few hours of sight. A veteran character
  actor, he often played authority figures, including Admiral Komack in Star Trek.

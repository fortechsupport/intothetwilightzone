bio: >-
  William Bridges co-wrote the Black Mirror episode "USS Callister" (2017) with Charlie Brooker, and the two won
  an Emmy for it. Black Mirror is the anthology most often compared to The Twilight Zone. Bridges has also written
  for Stranger Things.

name: Kim Hunter
born: '1922-11-12'
died: '2002-09-11'
roles:
- actor
bio: >-
  Kim Hunter acted in several Rod Serling productions: as Grace Carney, the employment counselor who befriends the
  washed-up boxer in Requiem for a Heavyweight (1956), in The Comedian (1957), as the chimpanzee scientist Zira
  in Planet of the Apes (1968), which Serling co-wrote, and in the Night Gallery segment "The Late Mr. Peddington"
  (1972). She won the Academy Award as Stella in A Streetcar Named Desire and was blacklisted for a time in the
  1950s.

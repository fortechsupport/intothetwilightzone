bio: >-
  Fay Spain appeared in "Rare Objects" (1972), the Night Gallery segment in which a gangster becomes part of a collection
  of vanished celebrities. She worked often in 1950s and 60s westerns and crime films and played Mrs. Marcia Roth
  in The Godfather Part II.

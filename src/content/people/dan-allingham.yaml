bio: >-
  Dan Allingham was unit production manager on John Landis's segment of Twilight Zone: The Movie (1983). He was
  one of the five people charged with involuntary manslaughter after the July 1982 helicopter accident that killed
  Vic Morrow, Myca Dinh Le and Renee Shin-Yi Chen on the set, and he was acquitted in 1987. Little else about his
  career is documented here.

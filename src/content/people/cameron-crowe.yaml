born: '1957-07-13'
bio: >-
  Cameron Crowe directed Vanilla Sky (2001), in which a television in the hero's nightmare plays a Twilight Zone
  episode, foreshadowing the film's own dream-trap reveal. A former Rolling Stone writer, he wrote Fast Times at
  Ridgemont High, directed Say Anything and Jerry Maguire, and won the Academy Award for the screenplay of Almost
  Famous.

bio: >-
  Jay Roach directed Austin Powers: International Man of Mystery (1997), whose Dr. Evil, played by Mike Myers, is
  often said to borrow his pinky-to-the-lip habit from a Twilight Zone character. Roach went on to the rest of the
  Austin Powers series and the Meet the Parents films. He then turned to political drama, winning Emmys for directing
  the HBO films Recount and Game Change, and made Trumbo and Bombshell.

name: Gerard McMurray
roles:
- director
bio: >-
  Gerard McMurray directed "Replay" (2019), the Jordan Peele revival episode in which a Black mother (Sanaa Lathan)
  uses a camcorder that rewinds time to protect her son from a racist state trooper. He co- wrote and directed Burning
  Sands (2017) and directed The First Purge (2018).

bio: >-
  Natalie Trundy played Ellen Marshall, the young woman of the hidden town of Peaceful Valley, in the hour-long
  "Valley of the Shadow" (1963). She later appeared in four of the Planet of the Apes sequels, the series produced
  by her husband Arthur P. Jacobs, whose first film had been adapted by Rod Serling.

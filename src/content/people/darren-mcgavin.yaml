born: '1922-05-07'
died: '2006-02-25'
bio: >-
  Darren McGavin starred as the newspaperman Carl Kolchak in The Night Stalker (1972), the ABC TV movie scripted
  by Twilight Zone writer Richard Matheson from Jeff Rice's novel, which became the most-watched TV film to that
  date and led to The Night Strangler and the series Kolchak: The Night Stalker. He also starred in Mike Hammer
  and Riverboat, and is fondly remembered as the father in A Christmas Story (1983).

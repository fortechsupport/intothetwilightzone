name: R. L. Thomas
roles:
- director
bio: >-
  R. L. Thomas directed "The Elevator" (1986), the revival's adaptation of Ray Bradbury's story about two brothers
  who explore their missing father's abandoned food-research plant. He is the Canadian director Ralph L. Thomas,
  whose feature Ticket to Heaven (1981), about a young man drawn into a cult, won the Genie Award for Best Motion
  Picture.

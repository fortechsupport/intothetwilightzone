bio: >-
  Shelley Duvall was a Robert Altman discovery who starred in 3 Women and Nashville, played Olive Oyl
  in Popeye and Wendy Torrance in The Shining, and produced Faerie Tale Theatre. In Theodore Sturgeon's
  "A Saucer of Loneliness" she plays a lonely woman whose encounter with a tiny flying saucer leaves her
  with a message she will share with no one.

bio: >-
  Tom Helmore appeared in "The Caterpillar" (1972), the Night Gallery segment in which a planter in Borneo plots
  to have an earwig crawl into his rival's ear, with Laurence Harvey. The English actor is best remembered as Gavin
  Elster, the old friend who sets up James Stewart in Alfred Hitchcock's Vertigo (1958).

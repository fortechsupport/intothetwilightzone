name: Patrick Williams
bio: >-
  American composer, arranger and jazz bandleader (1939-2018), known for The Mary Tyler Moore Show, The Streets
  of San Francisco and many TV films, and an Emmy winner. He is credited with the music for the 1994 CBS TV movie
  Twilight Zone: Rod Serling's Lost Classics.

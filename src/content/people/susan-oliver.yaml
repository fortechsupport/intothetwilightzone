bio: >-
  Susan Oliver played Teenya, the Martian woman who befriends Roddy McDowall's stranded astronaut in "People Are
  Alike All Over," and later appeared in Night Gallery's "The Tune in Dan's Café." She is famous to Star Trek fans
  as Vina, the green-skinned Orion illusion of the original pilot "The Cage." She was a regular on Peyton Place
  and later directed television. An accomplished pilot, she flew solo across the Atlantic in 1967.

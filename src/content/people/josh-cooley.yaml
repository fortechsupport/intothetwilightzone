name: Josh Cooley
roles:
- director
born: '1979'
bio: >-
  Josh Cooley directed Pixar's Toy Story 4 (2019), whose pull-string doll Gabby Gabby and her silent ventriloquist-dummy
  henchmen recall the original series' killer-doll and dummy episodes. A Pixar story artist on The Incredibles and
  Inside Out, he won the Academy Award for best animated feature for the film and later directed Transformers One.

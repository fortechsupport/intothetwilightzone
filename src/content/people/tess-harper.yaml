name: Tess Harper
roles:
- actor
born: '1950-08-15'
bio: >-
  Tess Harper co-starred in "Quarantine" (1986), the revival episode by Steven Bochco and Alan Brennert in which
  a scientist awakens in a peaceful, telepathic future society. She made her film debut opposite Robert Duvall in
  Tender Mercies (1983), was nominated for an Academy Award for Crimes of the Heart (1986), and played the sheriff's
  wife in No Country for Old Men.

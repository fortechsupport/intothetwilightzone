bio: >-
  Ralph Manza appeared in "The Ring with the Red Velvet Ropes," a third-season Night Gallery segment about a boxer
  pitted in a fight to the death. A familiar character actor for four decades, he played chauffeur Jay Drury on
  Banacek and appeared on AfterMASH and many other series.

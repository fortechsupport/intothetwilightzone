born: '1894-12-17'
died: '1979-06-14'
bio: >-
  David Butler directed "The Bard" (1963), the hour-long fourth-season comedy in which Jack Weston conjures William
  Shakespeare to write his television scripts, with Burt Reynolds parodying Marlon Brando. Butler was a veteran
  studio director whose career reached back to silent films; he directed Shirley Temple vehicles such as Bright
  Eyes and The Little Colonel, Bob Hope and Bing Crosby's Road to Morocco, and Doris Day musicals including Calamity
  Jane (1953). He spent his last working years in television.

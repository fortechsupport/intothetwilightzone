bio: >-
  Michael Anderson directed Logan's Run (1976), MGM's film of the novel by William F. Nolan and Twilight Zone writer
  George Clayton Johnson. The English director made The Dam Busters, earned an Academy Award nomination for Around
  the World in 80 Days (1956), and directed 1984 (1956) and Orca.

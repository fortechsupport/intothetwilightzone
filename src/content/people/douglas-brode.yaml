name: Douglas Brode
roles:
- author
- scholar
bio: >-
  Douglas Brode co-wrote Rod Serling and The Twilight Zone: The 50th Anniversary Tribute (Barricade Books, 2009)
  with Carol Serling, Rod Serling's widow. The book marked the series' half-century with an episode guide and essays.
  Brode is a film scholar and teacher who has written many books on movies and directors, including studies of Steven
  Spielberg's and Walt Disney's films.

name: Russ Conway
roles:
- actor
bio: >-
  Russ Conway appeared in "The Homecoming of Lemuel Stove," an episode of Rod Serling's western The Loner (1965-66),
  whose story about a Black Union veteran killed by night riders was one of the series' sharpest statements on prejudice.
  A Canadian-born character actor, he worked in Hollywood film and television from the 1940s into the 1970s.

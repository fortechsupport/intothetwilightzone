name: Johnson Smith
roles:
- author
bio: >-
  Johnson Smith is the story credit on "Ninety Years Without Slumbering" (1963), the fifth-season episode starring
  Ed Wynn as an old man who believes he will die when his grandfather clock stops. Twilight Zone histories report
  that the name was a pseudonym taken by George Clayton Johnson after Richard De Roy substantially rewrote his original
  story; this attribution should be confirmed against Marc Scott Zicree's The Twilight Zone Companion.

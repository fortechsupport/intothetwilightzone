bio: >-
  John Lithgow is a Tony, Emmy and Golden Globe-winning actor known for 3rd Rock from the Sun, Dexter
  and two Oscar-nominated roles. He took over William Shatner's famous part in George Miller's 'Nightmare
  at 20,000 Feet', playing a terrified flier who sees a creature tearing at the plane's engine.

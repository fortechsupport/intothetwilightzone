bio: >-
  Joe Dante directed It's a Good Life, the third segment of Twilight Zone: The Movie, reimagining Jerome
  Bixby's tale of an all-powerful boy as a cartoon-colored nightmare with Kathleen Quinlan as the stranger
  drawn into his house. He returned to the franchise to direct The Shadow Man for the 1985 revival. A
  lifelong genre enthusiast, he is best known for Piranha, The Howling, Gremlins and Matinee.

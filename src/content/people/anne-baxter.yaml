bio: >-
  Anne Baxter guest-starred on Rod Serling's western The Loner in "One of the Wounded" (1965). She won the Academy
  Award for The Razor's Edge, was nominated for All About Eve, and played Nefretiri in The Ten Commandments; on
  television she was Batman's Zelda and Olga and, at the end of her life, a lead on Hotel.

born: '1972'
bio: >-
  Kamran Pasha wrote two episodes of the 2002 UPN revival, "Cradle of Darkness," in which a time traveler goes back
  to kill the infant Adolf Hitler, and "To Protect and Serve." The Pakistani-born, Dartmouth- educated writer later
  worked on Sleeper Cell, Kings and Bionic Woman and wrote the historical novels Mother of the Believers and Shadow
  of the Swords.

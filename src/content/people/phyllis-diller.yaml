bio: >-
  Phyllis Diller starred in "Pamela's Voice" (1971), a short Night Gallery segment in which a murdered wife keeps
  nagging her husband from beyond the grave. A stand-up pioneer of the 1950s and 60s with a trademark cackle and
  wild hair, she made films with Bob Hope and starred in The Phyllis Diller Show.

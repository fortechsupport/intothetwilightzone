bio: >-
  Glen Morgan, a veteran writer-producer of The X-Files, was an executive producer of the 2019 revival
  and one of its busiest writers, credited on A Traveler, Six Degrees of Freedom, The Blue Scorpion and
  the second-season creature story 8. His other credits include co-writing Final Destination.

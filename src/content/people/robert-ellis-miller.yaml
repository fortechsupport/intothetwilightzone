bio: >-
  Robert Ellis Miller directed "The Changing of the Guard" (1962), Serling's Christmas episode about an aging prep-school
  teacher (Donald Pleasence) who believes his life has meant nothing. He went on to direct feature films including
  The Heart Is a Lonely Hunter, Sweet November (1968) and Reuben, Reuben.

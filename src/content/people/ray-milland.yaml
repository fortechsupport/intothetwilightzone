born: '1907-01-03'
died: '1986-03-10'
bio: >-
  Ray Milland played Dr. Ravadon, the surgeon asked to amputate a hand its owner insists has a murderous will of
  its own, in Night Gallery's "The Hand of Borgus Weems" (1971). He won the Academy Award for The Lost Weekend (1945)
  and starred in Dial M for Murder and, late in his career, Roger Corman's X: The Man with the X-Ray Eyes.

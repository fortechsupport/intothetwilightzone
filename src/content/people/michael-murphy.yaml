born: '1938-05-05'
bio: >-
  Michael Murphy appeared in "The Heart That Wouldn't Stay Buried," an episode of The Sixth Sense (1972), the ABC
  parapsychology series whose episodes were later syndicated in the Night Gallery package. A Robert Altman regular
  in M*A*S*H, McCabe & Mrs. Miller, Nashville and Tanner '88, he also played Yale in Woody Allen's Manhattan.

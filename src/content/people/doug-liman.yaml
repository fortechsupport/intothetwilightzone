bio: >-
  Doug Liman directed Edge of Tomorrow (2014), with Tom Cruise as an officer caught in a time loop who relives the
  same day of an alien invasion each time he dies, a premise in the line of Twilight Zone time-loop stories. He
  broke through with Swingers and Go, then directed The Bourne Identity and Mr. & Mrs. Smith.

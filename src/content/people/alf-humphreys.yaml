name: Alf Humphreys
died: 2018-01
roles:
- actor
bio: >-
  Canadian actor Alf Humphreys appeared in two episodes of the final, Toronto-produced season of the 1985 Twilight
  Zone revival, "The Trunk" and "There Was an Old Woman." He is best remembered by horror fans as Howard in the
  slasher film My Bloody Valentine (1981). He worked steadily in Canadian film and television, much of it in productions
  shot in Ontario. He died in January 2018.

bio: >-
  James Earl Jones, whose bass voice was famous from Darth Vader and countless narrations, hosted and
  narrated Twilight Zone: Rod Serling's Lost Classics, the 1994 CBS anthology film built from two unproduced
  Serling works. One of the most honored American actors, he won Tony Awards for The Great White Hope
  and Fences and received an honorary Academy Award.

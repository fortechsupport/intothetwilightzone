born: '1925-01-26'
died: '2008-09-26'
bio: >-
  Paul Newman starred as Captain Edward Hall Jr., an Army officer court-martialed for collaborating with his captors
  in a Korean prison camp, in The Rack (1956), MGM's film of Rod Serling's teleplay, released the same year as his
  breakthrough in Somebody Up There Likes Me. He became one of Hollywood's biggest stars in The Hustler, Cool Hand
  Luke and Butch Cassidy and the Sundance Kid, and won the Academy Award for The Color of Money (1986).

bio: >-
  Eddie Kaye Thomas appeared in "Rewind," an episode of the 2002 UPN Twilight Zone about a gambler with a tape recorder
  that turns back time. He is best known as Paul Finch in the American Pie films and Rosenberg in the Harold & Kumar
  films, and starred in the CBS series Scorpion.

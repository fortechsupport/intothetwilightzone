bio: >-
  Australian filmmaker George Miller, fresh from Mad Max 2, directed the final and most acclaimed segment
  of Twilight Zone: The Movie, a remake of Nightmare at 20,000 Feet with John Lithgow as a terrified airline
  passenger who sees a creature tearing at the wing. A former medical doctor, Miller went on to the Mad
  Max: Fury Road saga, Babe and the Oscar-winning animated film Happy Feet.

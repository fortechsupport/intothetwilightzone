bio: >-
  Patricia Smith played Sylvia Bayles, the mother who senses that her dead mother-in-law is calling her son away,
  in "Long Distance Call" (1961). Her film work in the 1950s included The Bachelor Party and The Spirit of St. Louis,
  both 1957. On television she was a frequent guest actress and played Debbie Reynolds's sister on The Debbie Reynolds
  Show (1969-70).

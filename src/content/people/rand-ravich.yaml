bio: >-
  Rand Ravich was among the writers attached over the years to Warner Bros.' long-planned new Twilight Zone feature
  film, a project announced around 2011 that has never gone into production. He wrote and directed The Astronaut's
  Wife (1999) and created the NBC police drama Life (2007-09).

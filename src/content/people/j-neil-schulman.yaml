bio: >-
  J. Neil Schulman wrote "Profile in Silver" (1986), the 1980s-revival segment in which a time-traveling historian
  descended from John F. Kennedy saves the president in Dallas and must face the consequences. A libertarian novelist,
  he won the Prometheus Award for Alongside Night and The Rainbow Cadenza.

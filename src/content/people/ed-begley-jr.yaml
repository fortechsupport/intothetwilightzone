bio: >-
  Ed Begley Jr. earned Emmy nominations as Dr. Victor Ehrlich on St. Elsewhere and became a regular in
  Christopher Guest's ensemble comedies, as well as a prominent environmental activist. The son of radio
  and stage actor Ed Begley, he voiced the leads in four Twilight Zone radio dramas, among them "The Man
  in the Bottle" and "One for the Angels."

name: Owen Harris
roles:
- director
bio: >-
  Owen Harris directed "The Comedian," the episode that opened Jordan Peele's 2019 revival, with Kumail Nanjiani
  as a stand-up whose jokes erase people from existence. The British director is known for two acclaimed Black Mirror
  episodes, "Be Right Back" and the Emmy-winning "San Junipero," and for the science- fiction film Kill Command
  and the series Brave New World.

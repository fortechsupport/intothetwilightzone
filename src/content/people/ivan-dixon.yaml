bio: >-
  Ivan Dixon was an actor and director best known as Sgt. Kinchloe on Hogan's Heroes and for the landmark
  independent drama Nothing But a Man. He starred as a washed-up boxer in "The Big Tall Wish", one of
  the earliest network dramas built around Black leads, and later as a minister in "I Am the Night—Color
  Me Black".

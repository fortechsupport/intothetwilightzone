name: Kirsten Dunst
born: '1982-04-30'
roles:
- actor
bio: >-
  Kirsten Dunst played Anna Petterson, the niece of Steve Guttenberg's tabloid reporter, in Tower of Terror (1997),
  the ABC Wonderful World of Disney film based on the Disney theme-park ride The Twilight Zone Tower of Terror and
  partly shot there. She had broken through in Interview with the Vampire and went on to Spider- Man, Marie Antoinette,
  Melancholia, Fargo and The Power of the Dog, which earned her an Academy Award nomination.

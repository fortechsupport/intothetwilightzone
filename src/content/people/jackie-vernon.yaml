born: '1924-03-29'
died: '1987-11-10'
bio: >-
  Comedian Jackie Vernon starred in "Make Me Laugh" (1971), a first-season Night Gallery segment about a failing
  stand-up comic who is granted the power to make anyone laugh, with predictably dark results. A deadpan nightclub
  and talk-show comic, he is best remembered as the voice of Frosty in the Rankin/Bass special Frosty the Snowman
  (1969).

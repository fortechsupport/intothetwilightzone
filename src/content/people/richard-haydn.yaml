name: Richard Haydn
born: '1905-03-10'
died: '1985-04-25'
roles:
- actor
bio: >-
  Richard Haydn played Bartlett Finchley, a fussy, misanthropic writer whose household machines turn against him,
  in "A Thing About Machines." The English comic actor is best remembered as Max Detweiler, the von Trapps' worldly
  friend, in The Sound of Music and as the record-keeping Herr Falkstein in Young Frankenstein. He also voiced the
  Caterpillar in Disney's Alice in Wonderland.

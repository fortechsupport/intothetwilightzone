bio: >-
  Greg Bear wrote the story "Dead Run," about a trucker hired to haul souls to Hell, which became a 1986 segment
  of the 1980s revival adapted by Alan Brennert. A multiple Hugo and Nebula winner, he wrote Blood Music, Eon, The
  Forge of God and Darwin's Radio.

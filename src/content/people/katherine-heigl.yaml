bio: >-
  Katherine Heigl moved from teen roles to stardom as Dr. Izzie Stevens on Grey's Anatomy, which earned
  her an Emmy, and went on to lead romantic comedies such as Knocked Up and 27 Dresses. In the UPN revival
  she anchored "Cradle of Darkness," playing a time traveler sent back to the infancy of Adolf Hitler,
  the series' take on the classic kill-Hitler paradox.

died: '2025-10-11'
bio: >-
  Diane Keaton made one of her first screen appearances as Nurse Frances Nevins in "Room with a View," a segment
  of Night Gallery's first season (1970), playing a nurse drawn into a bedridden man's murder plot. Within two years
  she was Kay Adams in The Godfather (1972), and she won the Academy Award for Best Actress for Woody Allen's Annie
  Hall (1977). Her later films included Reds, Baby Boom, Father of the Bride and Something's Gotta Give.

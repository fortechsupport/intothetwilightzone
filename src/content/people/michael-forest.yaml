born: '1929-04-17'
bio: >-
  Michael Forest played one of the motorcycle-riding aliens preparing to poison a town's water supply in "Black
  Leather Jackets" (1964). He played the god Apollo in the Star Trek episode "Who Mourns for Adonais?" and later
  became a prolific English-language dubbing voice for anime and video games.

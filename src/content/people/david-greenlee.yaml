bio: >-
  David Greenlee played Toby Ross, the mentally disabled teenager who can conjure anything he sees, in "The Toys
  of Caliban" (1986), opposite Richard Mulligan. He is best known as Mouse, the inventive young tunnel dweller in
  the CBS series Beauty and the Beast (1987–90).

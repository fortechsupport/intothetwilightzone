bio: >-
  Buzz Kulik directed nine original-series episodes, including King Nine Will Not Return, which opened
  the second season, the two-hander A Game of Pool, and the hour-long Jess-Belle and On Thursday We Leave
  for Home. A veteran of live television, he became one of the leading directors of TV movies, best remembered
  for Brian's Song (1971).

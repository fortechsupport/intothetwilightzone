born: '1925-06-01'
died: '2019-03-16'
bio: >-
  Richard Erdman starred as Patrick McNulty, the barroom bore who is given a stopwatch that stops time, in "A Kind
  of a Stopwatch" (1963), one of the hour-long fourth-season episodes. He played the sardonic POW Hoffy in Stalag
  17 (1953) and, more than half a century later, the elderly student Leonard on Community.

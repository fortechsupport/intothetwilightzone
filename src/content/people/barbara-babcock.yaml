bio: >-
  Barbara Babcock appeared in "Brenda" (1971), the Night Gallery segment about a lonely girl and the creature she
  befriends. She won an Emmy as Grace Gardner on Hill Street Blues and played Dorothy Jennings on Dr. Quinn, Medicine
  Woman, along with several Star Trek roles.

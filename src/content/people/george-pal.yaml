bio: >-
  George Pal directed 7 Faces of Dr. Lao (1964), with a screenplay by Twilight Zone writer Charles Beaumont from
  Charles G. Finney's novel; William Tuttle won an honorary Oscar for its makeup. The Hungarian-born animator of
  the Puppetoons produced Destination Moon, When Worlds Collide and The War of the Worlds, and directed The Time
  Machine (1960).

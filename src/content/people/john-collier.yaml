bio: >-
  John Collier wrote "The Chaser," the short short story about a love potion and its sinister sequel that became
  the first-season episode of the same name (1960), adapted by Robert Presnell Jr. The British-born writer was celebrated
  for sly, macabre tales collected in Fancies and Goodnights, which won an International Fantasy Award, and also
  wrote novels and Hollywood screenplays.

name: Helmut Dantine
born: '1918-10-07'
died: '1982-05-02'
roles:
- actor
bio: >-
  Helmut Dantine played the Nazi general whose troops meet a terrible host in "The Devil Is Not Mocked" (1971),
  the Night Gallery segment hosted within the story by Francis Lederer's Dracula figure. The Austrian-born actor
  fled the Anschluss and became a Warner Bros. contract player, appearing in Casablanca, Mrs. Miniver and Passage
  to Marseille.

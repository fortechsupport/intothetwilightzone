bio: >-
  Fredd Wayne appeared in "The Arrival" (1961), the third-season opener in which an empty airliner lands with no
  passengers or crew and an investigator's certainty begins to crack. A character actor on television from the 1950s
  to the 1980s, he was known for playing Benjamin Franklin in one-man shows and television portrayals.

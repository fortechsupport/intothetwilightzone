name: Nicky Guadagni
roles:
- actor
bio: >-
  Nicky Guadagni appeared in "The Cold Equations," a 1989 episode from the revival's Toronto-produced final season,
  adapted from Tom Godwin's classic science-fiction story about a stowaway on an emergency spaceship. The Canadian
  stage and screen actress is known to cult film fans as Holloway, the doctor in Vincenzo Natali's Cube (1997).

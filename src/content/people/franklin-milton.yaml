bio: >-
  Franklin Milton is credited for sound on the original Twilight Zone, which was recorded by MGM's sound department
  while the series filmed on the studio lot. As MGM's recording director he won Academy Awards for the sound of
  Ben-Hur, How the West Was Won and Grand Prix. His credit on the series reflects the studio-level resources that
  CBS's anthology could draw on.

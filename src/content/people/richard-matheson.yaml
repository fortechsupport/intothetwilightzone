bio: >-
  Richard Matheson wrote 16 episodes of the original Twilight Zone, among them Nightmare at 20,000 Feet,
  Steel, Little Girl Lost and The Invaders, and he wrote or co-wrote the screenplays for the Kick the
  Can, It's a Good Life and Nightmare at 20,000 Feet segments of Twilight Zone: The Movie. He later expanded
  a Serling outline into The Theatre for the 1994 TV film Rod Serling's Lost Classics, and his story Button,
  Button became an episode of the 1985 revival under his pseudonym Logan Swanson. Outside the Zone he
  was one of the most influential fantasy and horror writers of his century, author of I Am Legend, The
  Shrinking Man and Hell House and the writer of Spielberg's Duel.

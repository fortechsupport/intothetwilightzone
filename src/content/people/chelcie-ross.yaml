born: '1942-10-30'
bio: >-
  Chelcie Ross was one of the most frequent voices in The Twilight Zone Radio Dramas, the full-cast audio remakes
  of the original series, with roles in "Walking Distance," "Judgment Night," "I Shot an Arrow into the Air," "A
  Stop at Willoughby," "One More Pallbearer" and "Valley of the Shadow." A Chicago-based character actor, he played
  the fired coach's rival George in Hoosiers, the aging pitcher Eddie Harris in Major League, and Conrad Hilton
  on Mad Men.

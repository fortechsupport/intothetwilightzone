bio: >-
  E. Jack Neuman wrote the second-season episode The Trouble with Templeton (1960), in which an aging
  Broadway star longs to return to the past. A productive television writer-producer, he went on to create
  Police Story, Sam Benedict and Petrocelli and produced the Peabody-winning Mr. Novak.

name: John DeLancie
born: '1948-03-20'
roles:
- actor
bio: >-
  John de Lancie appeared in "Dead Run," a 1986 revival segment written by Alan Brennert from a Greg Bear story,
  about a trucker who finds himself hauling souls to Hell. He is best known as Q, the omnipotent trickster of Star
  Trek: The Next Generation and its sequels, and voiced Discord on My Little Pony: Friendship Is Magic.

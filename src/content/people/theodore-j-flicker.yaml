bio: >-
  Theodore J. Flicker directed "Act Break" for the 1985 Twilight Zone revival, and earlier wrote and directed segments
  of Night Gallery, among them "Hell's Bells" and the teleplay for "A Question of Fear," and directed "Junior."
  He began in improvisational theater, founding the Premise company in Greenwich Village, before moving into film.
  He wrote and directed the cult political satire The President's Analyst (1967) with James Coburn. In television
  he co-created Barney Miller with Danny Arnold.

born: '1926-04-05'
died: '2024-05-09'
bio: >-
  Roger Corman directed several films written by Twilight Zone's leading writers: House of Usher (1960) from Richard
  Matheson's screenplay, The Intruder (1962) from Charles Beaumont's novel and script with William Shatner, and
  The Haunted Palace and The Masque of the Red Death, both co-written by Beaumont. Famed as the "King of the B's,"
  he produced hundreds of low-budget films, launched the careers of Francis Ford Coppola, Martin Scorsese and Jack
  Nicholson, and received an honorary Academy Award in 2009.

name: Larry Gates
roles:
- actor
born: '1915-09-24'
died: '1996-12-12'
bio: >-
  Larry Gates starred as Dr. Bill Stockton, the only man on his street with a fallout shelter, in "The Shelter"
  (1961), Rod Serling's study of neighbors who turn on one another during a false nuclear alert. A stage-trained
  character actor, he played the skeptical doctor in Invasion of the Body Snatchers (1956) and appeared in In the
  Heat of the Night, and won a Daytime Emmy for playing H. B. Lewis on Guiding Light.

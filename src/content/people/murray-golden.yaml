bio: >-
  Murray Golden is credited as an associate producer on the original Twilight Zone, part of the small production
  staff that kept the anthology running on the MGM lot. He was mainly a television director, working across the
  episodic dramas and westerns of the 1960s; his credits include the Star Trek episode Requiem for Methuselah. Little
  has been written about his specific duties on the series, so this record stays brief.

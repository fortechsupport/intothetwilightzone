bio: >-
  Ozzie Nelson starred in "You Can Come Up Now, Mrs. Millikan" (1972), the Night Gallery segment about an inventor
  whose experiments keep resurrecting his wife (Harriet Nelson). A bandleader of the 1930s, he created and starred
  with his family in The Adventures of Ozzie and Harriet on radio and television.

name: Virginia Mayo
roles:
- actor
born: '1920-11-30'
died: '2005-01-17'
bio: >-
  Virginia Mayo appeared in "The Diary" (1971), the Night Gallery segment in which a cruel television gossip (Patty
  Duke) receives a diary that writes the future. A Warner Bros. and Goldwyn star of the 1940s, she played the faithless
  wife in The Best Years of Our Lives (1946) and James Cagney's moll in White Heat (1949), and co-starred with Danny
  Kaye in several comedies.

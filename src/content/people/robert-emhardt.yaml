bio: >-
  Robert Emhardt guest-starred on Rod Serling's western The Loner in "A Little Stroll to the End of the Line" (1966).
  A heavyset stage-trained character actor, he appeared in 3:10 to Yuma, The Intruder and Hostile Witness and in
  many television dramas.

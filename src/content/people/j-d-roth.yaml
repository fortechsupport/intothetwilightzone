born: '1968'
bio: >-
  J.D. Roth appeared as a young actor in "Time and Teresa Golowitz" (1987), a 1980s-revival segment about a composer
  who bargains with the devil to relive his youth. He later hosted children's game shows such as Fun House and became
  a reality-television producer, co-creating The Biggest Loser.

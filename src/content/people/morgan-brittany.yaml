name: Morgan Brittany
roles:
- actor
born: '1951-12-05'
bio: >-
  Morgan Brittany appeared as a child, credited under her birth name Suzanne Cupito, in three original series episodes:
  "Nightmare as a Child," "Valley of the Shadow" and "Caesar and Me," in which she played the sly little girl who
  helps the ventriloquist's dummy frame his owner. Decades later she returned to the material as a voice actor in
  The Twilight Zone Radio Dramas adaptations of "Mirror Image" and "The Passersby." Her early film work included
  Gypsy (1962) and Hitchcock's The Birds, and as an adult she became widely known as Katherine Wentworth on Dallas.
  She later worked as a conservative political commentator.

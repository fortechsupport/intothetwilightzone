name: Gil Bettman
roles:
- director
- educator
bio: >-
  Gil Bettman directed "Joy Ride" (1987), a 1980s-revival segment about teenagers who break into a closed- up house
  and find a car haunted by a crime from decades earlier. He directed the action film Never Too Young to Die (1986)
  and episodic television, then taught directing at Chapman University's Dodge College and wrote the book First
  Time Director.

name: Jeanette Nolan
roles:
- actor
born: '1911-12-30'
died: '1998-06-05'
bio: >-
  Jeanette Nolan played Rachel Simpson, the wife of the old hunter, in Earl Hamner Jr.'s "The Hunt" (1962), and
  later played witches in two Night Gallery segments: the soul-swapping housekeeper in "The Housekeeper" (1970)
  and the title aunt in "Since Aunt Ada Came to Stay" (1971). A radio star, she played Lady Macbeth in Orson Welles's
  Macbeth and was a regular on The Virginian.

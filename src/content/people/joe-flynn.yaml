name: Joe Flynn
born: '1924-11-08'
died: '1974-07-19'
roles:
- actor
bio: >-
  Joe Flynn played a small part in "Escape Clause" (1959), the sixth episode of the original Twilight Zone, and
  later appeared in "The Funeral," Richard Matheson's comic Night Gallery segment about a funeral director who takes
  on monster clients. He is remembered as the blustering Captain Binghamton on McHale's Navy and as Dean Higgins
  in Disney's Dexter Riley comedies.

bio: >-
  Burgess Meredith starred in four episodes of the original series, more than almost any other actor,
  including the near-sighted bookworm of Time Enough at Last and the condemned librarian of The Obsolete
  Man. For Twilight Zone: The Movie he stepped into Rod Serling's old role as the film's narrator. His
  long career ran from Broadway in the 1930s to the Penguin on Batman and Mickey in Rocky.

name: Jack Lord
roles:
- actor
born: '1920-12-30'
died: '1998-01-21'
bio: >-
  Jack Lord appeared in two Rod Serling productions: "The Vespers," the second episode of Serling's western The
  Loner (1965), and the Serling-scripted TV movie The Doomsday Flight (1966), as the investigator trying to find
  a barometric bomb hidden aboard an airliner. He played Felix Leiter in the first James Bond film, Dr. No, and
  became a television icon as Steve McGarrett on Hawaii Five-O (1968-80).

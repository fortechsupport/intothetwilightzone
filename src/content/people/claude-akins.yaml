name: Claude Akins
roles:
- actor
born: '1926-05-25'
died: '1994-01-27'
bio: >-
  Claude Akins played Steve Brand, the neighbor who tries to keep his street from turning into a mob, in "The Monsters
  Are Due on Maple Street" (1960), and returned as the bullying spaceman William Fletcher in "The Little People"
  (1962). A burly character actor, he appeared in films such as From Here to Eternity, The Caine Mutiny and Rio
  Bravo, then starred on television in Movin' On and as Sheriff Lobo in B.J. and the Bear and its spinoff The Misadventures
  of Sheriff Lobo.

bio: >-
  Phillip Pine played Virgil Sterig, the murdered gangster whose face the shape-shifting con man Arch Hammer borrows,
  in "The Four of Us Are Dying" (1960). A character actor with a long run of guest roles in crime dramas and westerns
  from the 1950s through the 1970s, he often played hoods and hard men. Science- fiction fans also know him as Colonel
  Green, the warlord summoned to fight alongside history's villains in the Star Trek episode "The Savage Curtain."

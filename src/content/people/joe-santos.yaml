bio: >-
  Joe Santos appeared in "The Library" (1986), a revival episode in which a librarian finds that rewriting the books
  of a strange archive rewrites people's lives. He was nominated for an Emmy as Sergeant Dennis Becker, Jim Rockford's
  long-suffering police friend on The Rockford Files.

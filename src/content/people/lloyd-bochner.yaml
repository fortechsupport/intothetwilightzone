bio: >-
  Lloyd Bochner played Michael Chambers, the government cryptographer who learns too late what the alien book To
  Serve Man really is, in the 1962 episode "To Serve Man." The Canadian actor later played Cecil Colby on Dynasty
  and appeared in The Naked Gun 2 1/2; his son is actor Hart Bochner.

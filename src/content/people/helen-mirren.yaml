bio: >-
  Dame Helen Mirren is one of Britain's most decorated actors, winning the Oscar for The Queen and acclaim
  as DCI Jane Tennison in Prime Suspect. In "Dead Woman's Shoes", the revival's gender-flipped remake
  of the 1962 episode "Dead Man's Shoes", she plays a timid woman transformed by a murdered socialite's
  shoes.

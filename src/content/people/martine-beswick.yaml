bio: >-
  Martine Beswick appeared in "The Last Laurel" (1971), a Night Gallery segment, opposite Jack Cassidy. The Jamaican-born
  actress appeared in the James Bond films From Russia with Love and Thunderball and in Hammer's One Million Years
  B.C. and Dr. Jekyll and Sister Hyde.

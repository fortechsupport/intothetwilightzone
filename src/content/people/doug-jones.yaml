bio: >-
  Doug Jones played the Blurryman, the indistinct figure stalking the revival's writers who is revealed as Rod Serling,
  in the 2019 episode "Blurryman." He is one of the screen's leading creature performers, known for Abe Sapien in
  Hellboy, the Faun and the Pale Man in Pan's Labyrinth and the Amphibian Man in The Shape of Water. He also played
  Saru in Star Trek: Discovery.

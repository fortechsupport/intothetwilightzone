bio: >-
  Art Carney won six Emmys as sewer worker Ed Norton on The Honeymooners and the Best Actor Oscar for
  Harry and Tonto. He starred in the Christmas fable "The Night of the Meek", one of six videotaped episodes,
  as an alcoholic department-store Santa who finds a bag that produces any gift.

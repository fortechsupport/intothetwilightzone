bio: >-
  John Considine appeared in "The Thirty-Fathom Grave" (1963), the fourth-season hour about a Navy destroyer crew
  that hears tapping from a sunken World War II submarine. A character actor in film and television, and on daytime
  soaps, he also worked with Robert Altman, co-writing A Wedding (1978) and appearing in several of Altman's films.

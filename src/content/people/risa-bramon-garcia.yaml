bio: >-
  Risa Bramon Garcia directed two episodes of the 2002 revival, "Another Life" and "Homecoming." She first built
  a major career as a casting director, often with Billy Hopkins, on films such as Platoon, Wall Street and Born
  on the Fourth of July, then turned to directing with the feature 200 Cigarettes (1999).

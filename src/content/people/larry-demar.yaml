name: Larry DeMar
bio: >-
  Larry DeMar co-designed and programmed Midway's Twilight Zone pinball machine (1993) with Pat Lawlor and Ted Estes. A Williams and Midway programmer, he co-created the video games Defender and Robotron: 2084.

name: Edy Williams
roles:
- actor
born: '1942-07-09'
bio: >-
  Edy Williams made an early, small appearance in "The Dummy" (1962), the episode in which Cliff Robertson's ventriloquist
  is gradually overtaken by his dummy Willy. She later became a cult figure through Russ Meyer's Beyond the Valley
  of the Dolls (1970) and The Seven Minutes, and was married to Meyer for several years.

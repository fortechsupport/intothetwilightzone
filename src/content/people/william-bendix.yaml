name: William Bendix
born: '1906-01-14'
died: '1964-12-14'
roles:
- actor
bio: >-
  William Bendix starred as Peter Jenson, the man whose dreams carry him back to Honolulu on the eve of the Pearl
  Harbor attack, in The Time Element (1958), the Rod Serling Desilu Playhouse drama that was the forerunner of The
  Twilight Zone. He was nominated for an Academy Award for Wake Island and starred in The Life of Riley on radio
  and television.

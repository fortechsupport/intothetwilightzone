bio: >-
  Mike Starr is a burly character actor seen in Goodfellas, Miller's Crossing, Ed Wood and Dumb and Dumber.
  He is the most frequently cast lead in the Twilight Zone radio dramas, voicing about ten episodes, including
  "It's a Good Life" and "A Thing About Machines."

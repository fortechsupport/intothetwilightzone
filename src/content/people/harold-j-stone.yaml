name: Harold J. Stone
roles:
- actor
born: '1913-03-03'
died: '2005-11-18'
bio: >-
  Harold J. Stone starred in "The Arrival" (1961) as Grant Sheckly, the veteran FAA investigator who has never failed
  to solve a case until an airliner lands with nobody aboard. A prolific character actor, he appeared in Hitchcock's
  The Wrong Man, Spartacus and The Greatest Story Ever Told, and on television in Bridget Loves Bernie and My World
  and Welcome to It.

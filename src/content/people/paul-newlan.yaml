bio: >-
  Paul Newlan played Walter Hanley, the plant manager who argues that people are more than costs before he too is
  replaced, in "The Brain Center at Whipple's" (1964). A large-framed character actor, he worked in film and television
  from the 1930s to the 1970s. His best-known role was Captain Grey, Lee Marvin's superior on the police series
  M Squad (1957-60).

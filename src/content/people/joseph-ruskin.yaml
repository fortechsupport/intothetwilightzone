name: Joseph Ruskin
roles:
- actor
born: '1924-04-14'
died: '2013-05-28'
bio: >-
  Joseph Ruskin played the genie who grants a struggling antique dealer four wishes in "The Man in the Bottle" (1960),
  and he is also credited with providing the voice of the Kanamit in "To Serve Man" (1962). A character actor with
  a distinctive voice, he made many Star Trek appearances across the franchise, starting as Galt in "The Gamesters
  of Triskelion," and was a long-serving Screen Actors Guild board member.

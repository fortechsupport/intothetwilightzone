bio: >-
  Dewey Martin played Corey, the astronaut who kills his crewmates to survive on what he believes is an alien world,
  in "I Shot an Arrow into the Air" (1960). He appeared in The Thing from Another World and Howard Hawks's The Big
  Sky and Land of the Pharaohs.

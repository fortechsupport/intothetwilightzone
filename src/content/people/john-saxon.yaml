bio: >-
  John Saxon appeared in "I'll Never Leave You – Ever" (1972), a Night Gallery segment about a woman who turns to
  witchcraft to be free of her dying husband. He starred in Enter the Dragon and played Lt. Thompson in A Nightmare
  on Elm Street, with a long career in Italian genre films and TV.

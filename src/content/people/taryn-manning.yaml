bio: >-
  Taryn Manning appeared in "Fair Warning," an episode of the 2002 UPN Twilight Zone. She played in Crossroads and
  8 Mile, and is best known as the inmate Tiffany "Pennsatucky" Doggett on Orange Is the New Black. She is also
  a singer in the electronic duo Boomkat.

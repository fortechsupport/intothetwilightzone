bio: >-
  Cliff Robertson won the Best Actor Oscar for Charly and was hand-picked to play John F. Kennedy in PT
  109. On The Twilight Zone he played a pioneer who walks into the future in "A Hundred Yards Over the
  Rim" and a ventriloquist losing control of his dummy in "The Dummy".

name: Larenz Tate
roles:
- actor
born: '1975-09-08'
bio: >-
  Larenz Tate appeared as a child actor in the 1985 remake of "Night of the Meek," starring Richard Mulligan as
  the department-store Santa whose bag dispenses whatever people need. As an adult he became known for O-Dog in
  Menace II Society, Love Jones and Ray, and played Councilman Rashad Tate on Power.

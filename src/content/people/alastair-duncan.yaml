bio: >-
  Alastair Duncan appeared in Disney's Tower of Terror (1997), the TV film built around the Twilight Zone Tower
  of Terror ride, set in a Hollywood hotel where five guests vanished in an elevator in 1939. A Scottish actor,
  he has done extensive voice work, including Mimir in the God of War video games.

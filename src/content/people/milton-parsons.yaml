bio: >-
  Milton Parsons, a gaunt, undertaker-faced character actor, appeared in "Camera Obscura" (1971), the Night Gallery
  segment adapted from Basil Copper's story about a moneylender drawn into a ghostly version of his town. He played
  hundreds of small roles from the 1930s on, often as butlers, morticians and eccentrics.

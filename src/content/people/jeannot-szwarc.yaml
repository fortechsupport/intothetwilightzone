name: Jeannot Szwarc
born: '1937-11-21'
roles:
- director
bio: >-
  Jeannot Szwarc was Night Gallery's most prolific director, staging some two dozen segments including "The Little
  Black Bag," "Class of '99," "Cool Air," "Logoda's Heads," "A Feast of Blood" and "The Caterpillar," and he later
  directed "The Last Defender of Camelot" and "Red Snow" for the 1985 Twilight Zone revival. Born in Paris, he moved
  from Night Gallery and Ironside to features, directing Jaws 2 (1978) and the Richard Matheson time-travel romance
  Somewhere in Time (1980), followed by Supergirl. He continued as a busy television director on Smallville, Bones
  and many other series.

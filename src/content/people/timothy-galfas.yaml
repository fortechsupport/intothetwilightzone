name: Timothy Galfas
roles:
- director
bio: >-
  Timothy Galfas directed several Night Gallery segments in the 1971-72 season, including "Dead Weight," "Little
  Girl Lost" and the comic blackout "Die Now, Pay Later," which surfaced only in syndication. He went on to direct
  low-budget features later in the 1970s.

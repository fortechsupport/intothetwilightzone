name: Hope Summers
roles:
- actor
born: '1902-06-07'
died: '1979-07-22'
bio: >-
  Hope Summers acted in "The Dark Boy" (1971), the Night Gallery ghost story set in a frontier schoolhouse. A prolific
  character actress, she is best known as Clara Edwards, Aunt Bee's friend and rival, on The Andy Griffith Show,
  and played one of the Bramford's elderly residents, Mrs. Gilmore, in Rosemary's Baby (1968).

bio: >-
  Eric Keenleyside is a Canadian actor from St. Stephen, New Brunswick, who played a bartender in the 1989
  episode "Love Is Blind" of the 1980s revival. He is known for Moe French on Once Upon a Time, Father Michael
  on Loudermilk and George Dean on Superman and Lois.

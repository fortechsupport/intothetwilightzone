bio: >-
  Edmond O'Brien starred in two Serling television dramas: "The Comedian" (1957), the Playhouse 90 teleplay directed
  by John Frankenheimer, in which he played the abused writer of Mickey Rooney's tyrannical star, and The Doomsday
  Flight (1966), Serling's airliner-bomb thriller. He won the Academy Award for best supporting actor for The Barefoot
  Contessa and was nominated again for Seven Days in May (1964), the political thriller Serling scripted. His other
  films include D.O.A., White Heat and The Wild Bunch.

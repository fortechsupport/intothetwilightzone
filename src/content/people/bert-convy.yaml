bio: >-
  Bert Convy appeared in Serling's own Night Gallery segment "They're Tearing Down Tim Riley's Bar" (1971), the
  Emmy-nominated story of an aging salesman, played by William Windom, who cannot let go of the past. A Broadway
  actor (the original Cabaret) and singer, Convy became best known as a game-show host of Tattletales, Super Password
  and Win, Lose or Draw.

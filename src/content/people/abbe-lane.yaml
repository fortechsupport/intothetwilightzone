bio: >-
  Abbe Lane was a singer and actress who rose to fame performing with bandleader Xavier Cugat and became
  a star of Italian films and Broadway's Oh Captain!. She played the senior flight attendant trying to
  calm John Lithgow's panicked passenger in the 'Nightmare at 20,000 Feet' segment.

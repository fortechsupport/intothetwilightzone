bio: >-
  Jonathan Harris made two appearances on the original Twilight Zone, as the lawyer George Alfred in "The Silence"
  and as the doctor in "Twenty-Two," and later played the eccentric professor in Night Gallery's "Since Aunt Ada
  Came to Stay." He is best known as the cowardly, scheming Dr. Zachary Smith on Lost in Space (1965-1968), a role
  that made him a fixture of science-fiction fandom. Earlier he co-starred in the series The Third Man. Late in
  life he became a busy voice actor, including Manny the praying mantis in A Bug's Life and the toy cleaner in Toy
  Story 2.

name: William Allen Young
born: '1953'
roles:
- actor
bio: >-
  William Allen Young appeared in "The Junction," a 1988 episode from the 1985 revival's final season, in which
  a 1912 miner trapped in a cave-in meets a modern-day miner. He is best known as Frank Mitchell, the father on
  the sitcom Moesha, and appeared in A Soldier's Story.

bio: >-
  Christopher Smith wrote and directed Triangle (2009), a looping nightmare about yacht passengers who board a deserted
  ocean liner, which critics often describe as a Twilight Zone-style film. The English filmmaker also made the London
  Underground horror Creep (2004), the office-retreat horror comedy Severance (2006) and the plague-era drama Black
  Death (2010).

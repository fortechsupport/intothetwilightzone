bio: >-
  Sutton Roley directed three episodes of The Sixth Sense (1972), "Coffin, Coffin, in the Sky," "Witness Within"
  and "Once Upon a Chilling"; the series was later folded into the syndicated Night Gallery package. A prolific
  television director of the 1960s and 1970s, he worked on series such as Mission: Impossible, Lost in Space and
  The Wild Wild West.

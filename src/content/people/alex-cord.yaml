born: '1933-05-03'
died: '2021-08-09'
bio: >-
  Alex Cord starred in the Night Gallery segment "Keep in Touch - We'll Think of Something" (1971), playing a man
  obsessed with a woman he has seen only in dreams. He played the Ringo Kid in the 1966 remake of Stagecoach and
  was Michael Archangel, the eye-patched intelligence chief, on Airwolf (1984-86). He later wrote western novels.

name: Hazel Court
born: '1926-02-10'
died: '2008-04-15'
roles:
- actor
bio: >-
  Hazel Court played Charlotte Scott, a nervous fashion editor recovering in an isolated mountain cabin who is visited
  by something enormous, in "The Fear," a fifth-season episode. An English actress, she became a leading lady of
  Gothic horror in Hammer's The Curse of Frankenstein and in Roger Corman's Poe films The Premature Burial, The
  Raven and The Masque of the Red Death. In later life she worked as a sculptor.

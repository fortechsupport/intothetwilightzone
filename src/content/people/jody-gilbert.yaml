bio: >-
  Jody Gilbert appeared with John Astin in "Hell's Bells" (1971), the Night Gallery comedy in which a hippie killed
  in a car crash finds himself in a hell tailored to his tastes. She was a character actress in film and television
  from the 1930s to the 1970s.

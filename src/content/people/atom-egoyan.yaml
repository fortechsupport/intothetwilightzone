bio: >-
  Atom Egoyan directed "The Wall," an episode of the 1985 revival's Toronto-produced final season, early in his
  career. The Egyptian-born Canadian filmmaker of Armenian heritage became internationally known for Exotica and
  The Sweet Hereafter (1997), which earned him Academy Award nominations for directing and adapted screenplay. His
  other films include Ararat and Chloe, and he has directed opera.

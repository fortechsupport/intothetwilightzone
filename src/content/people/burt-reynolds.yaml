bio: >-
  Burt Reynolds became the top box-office star of the late 1970s with Deliverance and Smokey and the Bandit,
  and earned an Oscar nomination for Boogie Nights. Before stardom he lampooned Marlon Brando-style Method
  actors as the brooding Rocky Rhodes in "The Bard", the last of the hour-long episodes.

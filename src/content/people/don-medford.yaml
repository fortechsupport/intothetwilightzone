bio: >-
  Don Medford directed five original-series episodes, including A Passage for Trumpet, The Man in the
  Bottle, Deaths-Head Revisited, The Mirror and the hour-long Death Ship. He later directed the celebrated
  two-part finale of The Fugitive and other dramas and westerns.

born: '1940-01-27'
bio: >-
  James Cromwell appeared in "A Message from Charity" (1985), a 1980s-revival segment about a modern boy who makes
  telepathic contact with a girl in colonial Massachusetts. Known for his towering height, he earned an Academy
  Award nomination for Babe and appeared in L.A. Confidential, The Green Mile and Succession.

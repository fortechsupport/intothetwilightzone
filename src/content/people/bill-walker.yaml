name: Bill Walker
roles:
- actor
born: '1896'
died: '1992'
bio: >-
  Bill Walker played Jeffrey, the butler of the dying patriarch Jason Foster, in "The Masks" (1964), the only original
  Twilight Zone episode directed by Ida Lupino. A Black character actor whose career ran from the 1940s into the
  1970s, he is best remembered as Reverend Sykes, who tells Scout to stand as Atticus passes, in To Kill a Mockingbird
  (1962).

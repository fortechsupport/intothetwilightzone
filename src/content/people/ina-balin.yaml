bio: >-
  Ina Balin guest-starred on Rod Serling's western The Loner in "To the West of Eden" (1966). She appeared in The
  Black Orchid, The Comancheros and The Greatest Story Ever Told, and helped airlift orphans out of Saigon in 1975,
  a story later dramatized in The Children of An Lac.

bio: >-
  Zak Santiago is a Canadian actor and DJ from Vancouver who played Cheto in the 2002 revival episode "The Pool
  Guy". His credits include The Five People You Meet in Heaven, The Eye and Smallville, and he was ordained a
  permanent deacon in the Catholic Church in 2024.

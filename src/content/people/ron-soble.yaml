bio: >-
  Ron Soble guest-starred in "The Vespers," the second episode of Rod Serling's western The Loner (1965). A gaunt
  character actor often cast in westerns, he played Dirty Jim on The Monroes and Wyatt Earp in the Star Trek episode
  "Spectre of the Gun."

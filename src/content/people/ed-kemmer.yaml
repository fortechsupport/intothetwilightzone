name: Ed Kemmer
roles:
- actor
born: '1921-10-29'
died: '2004-11-09'
bio: >-
  Ed Kemmer played the flight engineer who dismisses William Shatner's frantic passenger in "Nightmare at 20,000
  Feet" (1963), Richard Matheson's gremlin-on-the-wing episode. A World War II fighter pilot who spent time as a
  prisoner of war, he starred as Commander Buzz Corry in the early live television series Space Patrol (1950-55)
  and later worked on soap operas.

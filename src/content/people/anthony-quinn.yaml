name: Anthony Quinn
roles:
- actor
born: '1915-04-21'
died: '2001-06-03'
bio: >-
  Anthony Quinn played the punch-drunk boxer Mountain Rivera in the 1962 film of Rod Serling's Requiem for a Heavyweight,
  and starred in The Salamander (1981), made after Serling's death from his screenplay of Morris West's novel. Quinn
  won two Academy Awards, for Viva Zapata! and Lust for Life, and is famed for Zorba the Greek and Lawrence of Arabia.

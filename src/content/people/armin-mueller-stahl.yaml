name: Armin Mueller-Stahl
born: '1930-12-17'
roles:
- actor
bio: >-
  Armin Mueller-Stahl starred in In the Presence of Mine Enemies (1997), Showtime's remake of Rod Serling's 1960
  Playhouse 90 drama set in the Warsaw Ghetto, as the rabbi at its center. The German actor was nominated for an
  Academy Award for Shine and starred in Avalon, Night on Earth and Eastern Promises.

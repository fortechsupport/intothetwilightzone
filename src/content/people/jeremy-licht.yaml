bio: >-
  Jeremy Licht was a busy child actor of the late 1970s and 1980s, best known as Mark Hogan on the sitcom
  Valerie (later The Hogan Family). He played the omnipotent child Anthony in Joe Dante's reimagining
  of 'It's a Good Life' in Twilight Zone: The Movie.

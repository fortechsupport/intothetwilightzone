bio: >-
  Dan Hedaya appeared in "Dealer's Choice," a 1985 revival segment in which a group of poker buddies realize a new
  player is the Devil. He played the jealous husband in the Coen brothers' Blood Simple, Carla's ex- husband Nick
  Tortelli on Cheers and Alicia Silverstone's father in Clueless.

born: '1929-08-03'
died: '1999-12-28'
bio: >-
  Bethel Leslie appeared in "Mantrap," an episode of Rod Serling's western The Loner (1965-66). A prolific television
  actress of the 1950s and 1960s and a regular on The Richard Boone Show, she later wrote for daytime television,
  earning an Emmy nomination for her work on The Doctors.

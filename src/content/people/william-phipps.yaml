bio: >-
  William Phipps played a sergeant in Rod Serling's "The Purple Testament" (1960), about an infantry lieutenant
  who sees a glow on the faces of men about to die. He was the speaking voice of Prince Charming in Disney's Cinderella
  (1950) and appeared in 1950s science fiction films including Five and The War of the Worlds.

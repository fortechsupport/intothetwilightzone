bio: >-
  Belgian director Jakob Verbruggen directed "Six Degrees of Freedom" (2019), the 2019 revival episode about a crew
  launching for Mars as nuclear war breaks out on Earth. He has directed episodes of Black Mirror, The Alienist
  and House of Cards, and the miniseries London Spy.

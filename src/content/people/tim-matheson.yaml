born: '1947-12-31'
bio: >-
  Tim Matheson acted in the Night Gallery segment "Logoda's Heads" (1971) and, three decades later, directed "Sunrise"
  (2003), an episode of the UPN revival of The Twilight Zone. He played Otter in National Lampoon's Animal House,
  Vice President John Hoynes on The West Wing and Dr. Brick Breeland on Hart of Dixie, and as a teenager voiced
  Jonny Quest.

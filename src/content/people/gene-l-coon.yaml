born: '1924-01-07'
died: '1973-07-08'
bio: >-
  Gene L. Coon wrote "Can a Dead Man Strike from the Grave?" for The Sixth Sense (1972), one of his last scripts;
  the series was later syndicated in cut-down form as part of the Night Gallery package. As producer of Star Trek
  during its first two seasons he created or developed the Klingons, the Prime Directive and the United Federation
  of Planets, and wrote or co-wrote "Arena," "Space Seed" and "Errand of Mercy."

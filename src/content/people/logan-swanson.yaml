name: Logan Swanson
roles:
- writer
bio: >-
  Logan Swanson is the pseudonym Richard Matheson put on "Button, Button" (1986), the 1985 revival's adaptation
  of his own short story about a couple offered money to press a button that will kill a stranger, because he disliked
  the changes made to the ending. Matheson used the same name for other work he did not want under his own byline.
  The story was filmed again as The Box (2009).

name: Bobby Diamond
roles:
- actor
born: '1943-08-23'
died: '2019'
bio: >-
  Bobby Diamond played the young Pip, the version of the dying son his father Max Phillips (Jack Klugman) sees in
  a deserted amusement park, in "In Praise of Pip" (1963), the opening episode of the fifth season. He starred as
  the boy Joey on the 1950s family series Fury and had a recurring role on The Many Loves of Dobie Gillis; he later
  left acting and practised law.

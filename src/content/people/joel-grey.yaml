name: Joel Grey
roles:
- actor
born: '1932-04-11'
bio: >-
  Joel Grey starred in "There Aren't Any More MacBanes" (1972), a Night Gallery segment about a spoiled young man
  who uses a sorcerer's book from his family's past to rid himself of his uncle. He won both a Tony Award (1967)
  and an Academy Award (1972) as the Master of Ceremonies in Cabaret, and later originated the Wizard in the Broadway
  musical Wicked.

name: Diana Hyland
roles:
- actor
born: '1936-01-25'
died: '1977-03-27'
bio: >-
  Diana Hyland played Anne Henderson, the young heiress pursued on horseback by a mysterious woman in black, in
  Richard Matheson's "Spur of the Moment" (1964). She was a regular on Peyton Place and was cast as the mother on
  Eight Is Enough before her death from cancer; she won a posthumous Emmy for The Boy in the Plastic Bubble.

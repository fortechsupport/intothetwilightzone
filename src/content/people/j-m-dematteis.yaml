born: '1953-12-15'
bio: >-
  J. M. DeMatteis wrote "The Girl I Married" (1987), one of the short episodes of the revival's final CBS season.
  He is best known as a comic book writer: Kraven's Last Hunt for Spider-Man, the comic-relief Justice League International
  with Keith Giffen, and the painted fantasy Moonshadow. He has also written widely for animated series.

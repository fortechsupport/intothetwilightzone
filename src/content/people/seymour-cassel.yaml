bio: >-
  Seymour Cassel had a small part in "The Self-Improvement of Salvadore Ross" (1964), the fifth-season episode about
  a man who discovers he can trade traits with other people. He was a key member of John Cassavetes' company, nominated
  for an Academy Award for Faces, and later worked often with Wes Anderson.

name: Ruta Lee
roles:
- actor
born: '1935-05-30'
bio: >-
  Ruta Lee played Flora Gordon, the young wife whose aging husband takes a youth serum that works too well, in Rod
  Serling's "A Short Drink from a Certain Fountain" (1963). She danced in Seven Brides for Seven Brothers, appeared
  in Witness for the Prosecution and Sergeants 3, and co-hosted the game show High Rollers.

bio: >-
  Andrew Francis is a Canadian actor from Vancouver, credited in the 2002 revival episode "Into the Light",
  where scifi-movies lists him as Brian. He is best known for voice work, including Shining Armor in My Little
  Pony: Friendship Is Magic and MegaMan.EXE in MegaMan NT Warrior, and played Connor O'Brien on Chesapeake
  Shores.

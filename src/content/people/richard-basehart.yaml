name: Richard Basehart
roles:
- actor
born: '1914-08-31'
died: '1984-09-17'
bio: >-
  Richard Basehart starred as Colonel Adam Cook, the astronaut stranded on an alien world who meets its sole survivor,
  Eve, in "Probe 7, Over and Out" (1963). He starred in Fellini's La Strada (1954) and Il Bidone, played Admiral
  Nelson on Voyage to the Bottom of the Sea, and was a sought-after narrator, including for the opening of Knight
  Rider.

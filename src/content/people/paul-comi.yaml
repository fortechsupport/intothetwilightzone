born: '1932-02-23'
died: '2016-11-26'
bio: >-
  Paul Comi played a member of the flight crew whose airliner slips back to the age of dinosaurs in "The Odyssey
  of Flight 33" (1961), and he also appeared in "People Are Alike All Over" (1960). A frequent television guest
  actor, he played Lieutenant Stiles in Star Trek's "Balance of Terror" and co-starred in the western Two Faces
  West.

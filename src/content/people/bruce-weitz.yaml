name: Bruce Weitz
roles:
- actor
born: '1943-05-27'
bio: >-
  Bruce Weitz starred as the title character of "The Mind of Simon Foster" (1989), the revival episode about a laid-off
  man in a bleak near future who sells his memories to survive. He won an Emmy in 1984 for playing the snarling
  undercover detective Mick Belker on Hill Street Blues, and later had recurring roles on Anything but Love, General
  Hospital and The Young and the Restless.

name: Hal Dresner
roles:
- writer
bio: >-
  Hal Dresner wrote the Night Gallery segment "Room with a View" and supplied stories that the show adapted for
  "The Flip-Side of Satan" and "Stop Killing Me." He was a novelist and screenwriter whose credits include the Clint
  Eastwood thriller The Eiger Sanction (1975), the snake-horror film Sssssss (1973) and the comedy Zorro, the Gay
  Blade (1981).

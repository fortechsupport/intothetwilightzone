born: '1983'
bio: >-
  Greta Lee appeared in "You Might Also Like" (2020), the second-season finale of the 2019 Twilight Zone, a consumer-culture
  satire that brings back the Kanamits of "To Serve Man." She is known for Russian Doll and The Morning Show, and
  received a Golden Globe nomination for starring in Celine Song's Past Lives (2023).

bio: >-
  Gary Merrill starred as Joseph Paradine, a Confederate scout who finds a book of witchcraft that could win the
  war, in Serling's "Still Valley" (1961). He played Bill Sampson in All About Eve and was married to Bette Davis
  from 1950 to 1960.

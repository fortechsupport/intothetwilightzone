name: Melora Hardin
roles:
- actor
born: '1967-06-29'
bio: >-
  Melora Hardin appeared in Disney's Tower of Terror (1997), the TV film based on the Twilight Zone Tower of Terror
  ride, set around five people who vanished from a Hollywood hotel elevator on Halloween 1939. She played Jan Levinson
  on The Office and Tammy Cashman on Transparent, and was an early child actor in Little House on the Prairie.

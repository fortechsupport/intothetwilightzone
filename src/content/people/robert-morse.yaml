bio: >-
  Robert Morse appeared in "Marmalade Wine," a second-season Night Gallery segment with Rudy Vallée, and later in
  "Ye Gods" in the 1985 revival. He won a Tony Award for How to Succeed in Business Without Really Trying and another
  for playing Truman Capote in Tru, which also brought him an Emmy. Late in his career he played Bert Cooper on
  Mad Men.

bio: >-
  William Asher directed "Mr. Bevis," the 1960 Serling comedy starring Orson Bean as a lovable misfit with a guardian
  angel, which was also a trial run for a series that never sold. Asher directed more than a hundred episodes of
  I Love Lucy and produced and directed Bewitched, starring his then-wife Elizabeth Montgomery. He also directed
  the Beach Party films for American International.

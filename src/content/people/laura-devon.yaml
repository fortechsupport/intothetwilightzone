bio: >-
  Laura Devon played Ellwyn Glover, the bride-to-be who falls ill under the witch's curse, in "Jess-Belle" (1963),
  Earl Hamner Jr.'s hour-long Appalachian folk tale. She was an actress and singer who worked in film and television
  in the 1960s, including Howard Hawks's racing drama Red Line 7000 (1965).

died: '2016-03-24'
bio: >-
  Earl Hamner Jr. wrote eight episodes for the original Twilight Zone's last three seasons, often drawing
  on the rural Southern settings of his Virginia upbringing in stories such as The Hunt and Jess-Belle.
  He went on to create The Waltons, based on his own family and narrated by him, which won the Emmy for
  outstanding drama series, and later created the prime-time soap Falcon Crest.

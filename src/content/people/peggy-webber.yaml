bio: >-
  Peggy Webber appeared in the Night Gallery segment "I'll Never Leave You – Ever" (1972) and, decades later, voiced
  a role in the Twilight Zone Radio Dramas adaptation of "The Trade-Ins." A radio actress from her teens, she worked
  extensively with Jack Webb on Dragnet and later founded the California Artists Radio Theatre.

bio: >-
  Irene Dailey played Miss Frank, the schoolteacher whose harsh methods force the telepathic Ilse to speak, in "Mute"
  (1963). A New York stage actress and the sister of the song-and-dance star Dan Dailey, she worked mainly in theatre
  and television. Her best-known role was the meddling Liz Matthews on the soap opera Another World, which brought
  her a Daytime Emmy in 1979.

bio: >-
  Robert Wisden guest-starred in "Upgrade" (2002), an episode of the UPN revival filmed in Vancouver. The Canadian
  character actor has worked widely in Vancouver-made film and television, including The X-Files and Smallville,
  and played President Richard Nixon in Watchmen (2009).

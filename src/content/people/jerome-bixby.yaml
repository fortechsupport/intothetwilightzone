bio: >-
  Jerome Bixby wrote It's a Good Life (1953), the short story about a small boy with godlike powers that
  Rod Serling adapted into one of the original series' most famous episodes. The story was remade as a
  segment of Twilight Zone: The Movie, and the 2002 revival returned to his characters in the sequel It's
  Still a Good Life. Bixby also wrote four Star Trek episodes including Mirror, Mirror, co-wrote the story
  for Fantastic Voyage, and finished The Man from Earth on his deathbed.

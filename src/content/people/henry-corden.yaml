born: '1920-01-06'
died: '2005-05-19'
bio: >-
  Henry Corden played one of the villagers of the Mexican border town who turn on a stranded alien in "The Gift"
  (1962). A character actor in films such as The Ten Commandments, he became best known as a voice actor, taking
  over the role of Fred Flintstone from Alan Reed in 1977 and voicing him for nearly three decades.

bio: >-
  Max Showalter, credited as Casey Adams, played Pat Riley, one of the frightened adults of Peaksville trying to
  keep the all-powerful Anthony Fremont happy in "It's a Good Life." His films include Niagara with Marilyn Monroe,
  Bus Stop and, decades later, Sixteen Candles, as Molly Ringwald's grandfather. He was also a composer and Broadway
  performer.

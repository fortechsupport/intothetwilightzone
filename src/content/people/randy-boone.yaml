bio: >-
  Randy Boone played Pvt. Michael McClusky, the youngest and most frightened member of a modern tank crew that rides
  into Custer's last battle, in "The 7th Is Made Up of Phantoms" (1963). A singer and guitarist from North Carolina,
  he got his start on the series It's a Man's World (1962). He then played the ranch hand Randy Benton on The Virginian
  and was a regular on Cimarron Strip.

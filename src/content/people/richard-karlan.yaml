name: Richard Karlan
roles:
- actor
bio: >-
  Richard Karlan appeared twice in the original series: in "Execution" (1960), about an 1880s outlaw yanked forward
  in time from the gallows, and as one of the revolutionary dictator's lieutenants in "The Mirror" (1961), opposite
  Peter Falk. A character actor in film and television from the 1940s to the 1970s, he often played heavies and
  foreign officials in crime dramas and westerns.

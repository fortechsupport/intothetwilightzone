bio: >-
  Mark Richman, later billed as Peter Mark Richman, guest-starred on Rod Serling's western The Loner in "Incident
  in the Middle of Nowhere" (1965). A Method-trained stage actor, he starred in the series Cain's Hundred, played
  Andrew Laird on Dynasty and appeared in Friday the 13th Part VIII; he was also a painter and playwright.

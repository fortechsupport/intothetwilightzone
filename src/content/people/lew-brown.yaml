name: Lew Brown
roles:
- actor
bio: >-
  Lew Brown played supporting parts in two original-series episodes, "Long Distance Call" and the Lincoln- assassination
  time-travel story "Back There." He was a working character actor across 1960s and 1970s television, with credits
  on Dragnet, Gunsmoke, I Dream of Jeannie and later Dallas. Not to be confused with the Tin Pan Alley lyricist
  of the same name.

bio: >-
  Mark-Paul Gosselaar appeared as a child in "What Are Friends For?" (1986), the second-season opener of the 1985
  revival, in which a boy's imaginary friend turns out to be the same one his father once had. He became famous
  as Zack Morris on Saved by the Bell and later starred in NYPD Blue, Franklin & Bash, Pitch and Mixed- ish.

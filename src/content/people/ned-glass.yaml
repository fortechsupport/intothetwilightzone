bio: >-
  Ned Glass appeared in "Last Rites for a Dead Druid" (1972), a Night Gallery segment written by Alvin Sapinsley
  about a garden statue that comes alive. A Polish-born character actor, he played Doc the drugstore owner in West
  Side Story and appeared in North by Northwest and Charade.

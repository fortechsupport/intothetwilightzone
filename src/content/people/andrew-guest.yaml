bio: >-
  Andrew Guest is a television comedy writer and producer who wrote "The Wunderkind", the 2019 revival
  episode about a campaign manager who helps a child YouTuber win the presidency. He wrote and produced for
  30 Rock, Community, Suburgatory and Brooklyn Nine-Nine, and later became showrunner of Marvel's Wonder Man.

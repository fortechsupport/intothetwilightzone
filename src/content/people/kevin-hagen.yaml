bio: >-
  Kevin Hagen appeared twice in the original series: as one of the three astronauts stranded on a strangely Earth-like
  asteroid in "Elegy" (1960), and as Pete Radcliff, the coworker who is blamed for Edward Andrews's hit-and-run
  in "You Drive" (1964). A prolific television character actor, he played Inspector Kobick on Land of the Giants.
  He is best remembered as the kindly Doc Baker on Little House on the Prairie (1974-83).

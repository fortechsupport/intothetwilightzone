bio: >-
  Dame Gladys Cooper was a leading London stage star and theatre manager who later became a three-time
  Oscar-nominated Hollywood character actress. She appeared in three Twilight Zone episodes, including
  the frail recluse who fears Death in "Nothing in the Dark" and the lonely widow plagued by phone calls
  in "Night Call".

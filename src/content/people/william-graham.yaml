bio: >-
  William Graham (William A. Graham) directed The Doomsday Flight (1966), Rod Serling's NBC thriller about an extortionist
  who plants an altitude-triggered bomb on an airliner. A prolific director of television films, he also made Elvis
  Presley's last feature, Change of Habit, and Return to the Blue Lagoon.

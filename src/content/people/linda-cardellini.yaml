bio: >-
  Linda Cardellini first drew notice on Freaks and Geeks and ER, played Velma in the live-action Scooby-Doo
  films and earned Emmy nominations for Mad Men and Dead to Me. In "The Path" she played a tabloid reporter
  whose encounter with a fortune teller, played by Method Man, changes her future.

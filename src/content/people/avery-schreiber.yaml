bio: >-
  Avery Schreiber co-starred in "Act Break" (1985), the 1985-revival segment about a struggling playwright who wishes
  for success and is sent back in time to Shakespeare's era. A Second City alumnus, he formed a comedy team with
  Jack Burns and became known for Doritos commercials and the sitcom My Mother the Car.

bio: >-
  Jean Marsh played Alicia, the robot companion given to a prisoner on an asteroid, in "The Lonely" (1959), one
  of the first Twilight Zone episodes. She co-created Upstairs, Downstairs and won an Emmy as the housemaid Rose;
  she also appeared in Frenzy, Willow and Return to Oz, and in Doctor Who.

name: Lee Majors
roles:
- actor
born: '1939-04-23'
bio: >-
  Lee Majors guest-starred in "With This Ring, I Thee Kill!", an episode of The Sixth Sense (1972), the Universal
  psychic-investigator series later recut into the syndicated Night Gallery package. Majors had starred in The Big
  Valley and The Virginian, and became one of television's biggest stars as astronaut Steve Austin in The Six Million
  Dollar Man (1974-78) and as stuntman Colt Seavers in The Fall Guy.

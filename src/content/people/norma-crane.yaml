name: Norma Crane
roles:
- actor
born: '1928-11-10'
died: '1973-09-28'
bio: >-
  Norma Crane played Gretchen, the former lover who can expose a hidden Nazi war criminal (Richard Kiley), in "Escape
  Route," the Rod Serling segment of the 1969 Night Gallery pilot film. She is best remembered as Golde, Tevye's
  wife, in the film of Fiddler on the Roof (1971).

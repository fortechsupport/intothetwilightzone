bio: >-
  Barney Phillips appeared in four original-series episodes, most memorably as Haley, the diner counterman who reveals
  a third eye under his hat at the end of "Will the Real Martian Please Stand Up?" He was also in "The Purple Testament,"
  "A Thing About Machines" and "Miniature." On television he played Sgt. Ed Jacobs opposite Jack Webb on Dragnet
  and Doc Kaiser on Twelve O'Clock High.

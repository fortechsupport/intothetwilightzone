name: Barbara Baxley
roles:
- actor
born: '1923-01-01'
died: '1990-06-07'
bio: >-
  Barbara Baxley played Cora Wheaton, the sheriff's wife who tries to replace her own lost child with a telepathic
  orphan girl, in the hour-long "Mute" (1963), Richard Matheson's script. A Broadway actress, she is remembered
  on film as Lady Pearl in Robert Altman's Nashville (1975).

bio: >-
  Roddy McDowall was a British-born child star of How Green Was My Valley and Lassie Come Home who became
  a cult favorite as Cornelius and Caesar in the Planet of the Apes films. In "People Are Alike All Over"
  he plays a nervous astronaut stranded on Mars whose friendly hosts have plans for him.

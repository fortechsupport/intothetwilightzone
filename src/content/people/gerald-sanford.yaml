name: Gerald Sanford
roles:
- writer
bio: >-
  Gerald Sanford wrote several Night Gallery segments, including "The Flip-Side of Satan" (1971), about a disc jockey
  alone in a haunted radio station, "Tell David..." (1971) and "The Tune in Dan's Café" (1972), plus the Loner episode
  "Mantrap." He went on to a long career as a television writer and producer.

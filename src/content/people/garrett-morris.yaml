born: '1937-02-01'
bio: >-
  Garrett Morris was one of the poker players in "Dealer's Choice" (1985), the revival episode in which a friendly
  card game turns out to include the Devil. An original Not Ready for Prime Time Player on Saturday Night Live (1975-80),
  he later appeared on The Jeff Foxworthy Show, Martin and 2 Broke Girls.

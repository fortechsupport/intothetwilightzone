name: Jesslyn Fax
born: '1893-12-04'
died: '1975-02-16'
roles:
- actor
bio: >-
  Jesslyn Fax appeared in The Time Element (1958), Rod Serling's Westinghouse Desilu Playhouse teleplay about a
  man who dreams himself back to Honolulu on the eve of Pearl Harbor, widely regarded as the unofficial pilot of
  The Twilight Zone. A character actress usually cast as fussy older women, she is remembered as the sculptor known
  as "Miss Hearing Aid" in Hitchcock's Rear Window.

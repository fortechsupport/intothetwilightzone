bio: >-
  Bud Westmore headed makeup on Night Gallery and its 1969 pilot as chief of Universal's makeup department, which
  created the series' many ghouls and monsters. A member of the Westmore makeup dynasty, he ran Universal's department
  from 1946 to 1970, overseeing the Creature from the Black Lagoon and the makeup for Spartacus. He died in 1973.

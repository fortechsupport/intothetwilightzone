name: Shepperd Strudwick
roles:
- actor
born: '1907-09-22'
died: '1983-01-15'
bio: >-
  Shepperd Strudwick played Peter Selden, the man whose return stirs a schoolteacher's buried memory of her mother's
  murder, in "Nightmare as a Child" (1960). His films include All the King's Men, A Place in the Sun and Joan of
  Arc, and he worked extensively in television and on daytime soap operas.

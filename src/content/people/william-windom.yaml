name: William Windom
roles:
- actor
born: '1923-09-28'
died: '2012-08-16'
bio: >-
  William Windom played the Army major who leads the trapped strangers in "Five Characters in Search of an Exit"
  and the psychiatrist in "Miniature" on the original Twilight Zone. On Night Gallery he gave one of the series'
  most praised performances as Randy Lane, the aging widower facing forced retirement, in Rod Serling's "They're
  Tearing Down Tim Riley's Bar," and returned as the physicist in "Little Girl Lost." He won an Emmy for My World
  and Welcome to It (1970), played Commodore Decker in Star Trek's "The Doomsday Machine," and was Dr. Seth Hazlitt
  on Murder, She Wrote.

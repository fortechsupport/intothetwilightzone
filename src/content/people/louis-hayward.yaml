name: Louis Hayward
born: '1909-03-19'
died: '1985-02-21'
roles:
- actor
bio: >-
  Louis Hayward played the doctor who slowly poisons his invalid sister in "Certain Shadows on the Wall," a first-season
  Night Gallery segment with Agnes Moorehead and Grayson Hall. Born in South Africa, he was a dashing star of 1930s
  and 1940s adventure films, playing the twin roles in The Man in the Iron Mask (1939) and Simon Templar in The
  Saint in New York.

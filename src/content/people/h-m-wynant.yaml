name: H. M. Wynant
roles:
- actor
- voice actor
born: '1927'
bio: >-
  H. M. Wynant voiced roles in three Twilight Zone Radio Dramas adaptations: "Of Late I Think of Cliffordville,"
  "The Trade-Ins" and "Death's Head Revisited." A character actor with more than five decades of television credits,
  he was a frequent face in 1950s and 1960s westerns and crime shows and later appeared in Dallas and Star Trek:
  The Next Generation.

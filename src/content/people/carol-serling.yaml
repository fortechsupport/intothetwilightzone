bio: >-
  Carolyn "Carol" Serling, Rod Serling's widow, spent the decades after his death in 1975 as the keeper
  of his legacy and the franchise's link to its creator. She co-produced the 1994 television film Rod
  Serling's Lost Classics, was involved with The Twilight Zone Magazine in the 1980s, and was credited
  as an executive producer on the 2019 revival.

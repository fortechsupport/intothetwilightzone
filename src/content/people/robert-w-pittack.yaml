  work: series
  role: director of photography (credited 1962-1964)
bio: >-
  Robert W. Pittack was one of the main directors of photography on the original Twilight Zone in its last two seasons,
  sharing the work with George T. Clemens on the hour-long fourth season and the half-hour fifth. He came to the
  series late in a long career in features and television. The Television Academy's records list him in its 1963
  cinematography category.

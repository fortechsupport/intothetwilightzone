bio: >-
  Harold Schuster directed "The Hunt" (1962), Earl Hamner Jr.'s story of an old hunter and his dog who find themselves
  at the gates of the afterlife. A former film editor, he directed features including My Friend Flicka (1943) before
  moving to television in the 1950s.

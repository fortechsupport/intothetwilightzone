born: '1978'
bio: >-
  Edan Gross was a child actor in "The After Hours" (1986), the 1980s revival's remake of the 1960 episode about
  a shopper trapped in a department store after closing. He is best known as the voice of the talking Good Guy doll
  in the original Child's Play (1988) and had other television roles in the 1980s and early 1990s.

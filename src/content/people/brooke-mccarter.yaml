bio: >-
  Brooke McCarter appeared in "Joy Ride" (1987), a second-season segment of the 1985 revival in which teenagers
  who take a joyride in a stolen car are pulled into a decades-old crime. He is best known as Paul, one of Kiefer
  Sutherland's vampire gang in The Lost Boys (1987), and later worked as a musician and band manager.

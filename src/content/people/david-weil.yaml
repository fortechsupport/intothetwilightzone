bio: >-
  David Weil co-wrote "Ovation" (2020), a second-season episode of Jordan Peele's revival about a struggling singer
  who becomes famous through a mysterious coin. He created the Amazon series Hunters, starring Al Pacino, and later
  became showrunner of Citadel and created Solos.

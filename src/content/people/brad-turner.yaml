bio: >-
  Canadian director Brad Turner directed Acts of Terror for the 1985 revival's third season and returned
  for the 2002 series with The Pool Guy, Azoth the Avenger Is a Friend of Mine, Harsh Mistress and Last
  Lap. He later became a principal director of the thriller series 24.

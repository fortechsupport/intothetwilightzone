bio: >-
  Kate Jackson played Sabrina Duncan on Charlie's Angels and later starred in Scarecrow and Mrs. King,
  having begun her career on the gothic soap Dark Shadows. She voiced the leads in the radio adaptations
  of "The Hitchhiker" and "Queen of the Nile."

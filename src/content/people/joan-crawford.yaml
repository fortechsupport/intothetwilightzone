name: Joan Crawford
born: '1904-03-23'
died: '1977-05-10'
roles:
- actor
bio: >-
  Joan Crawford starred in "Eyes," Serling's segment of the 1969 Night Gallery pilot film, as a wealthy blind woman
  who buys a few hours of sight from a desperate man; it was the first professional directing job of 22-year-old
  Steven Spielberg. Her guest role on The Sixth Sense (1972) was her last screen performance. One of the great stars
  of the studio era, she won the Academy Award for Mildred Pierce.

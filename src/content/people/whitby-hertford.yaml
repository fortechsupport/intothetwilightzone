name: Whitby Hertford
roles:
- actor
born: '1978'
bio: >-
  Whitby Hertford appeared as a child in "To See the Invisible Man" (1986), the revival's adaptation of Robert Silverberg's
  story about a man sentenced to a year of being shunned. He later played the boy who mocks the velociraptor skeleton
  at the dig site in Jurassic Park (1993) and Jacob in A Nightmare on Elm Street 5: The Dream Child.

born: '1922-05-05'
died: '2015-06-12'
bio: >-
  Monica Lewis played the mother of a disfigured boy in Rod Serling's Night Gallery segment "The Different Ones"
  (1971), opposite Dana Andrews. A big-band and radio singer who recorded for Decca and voiced the Chiquita Banana
  jingle, she acted in MGM films and was married to Universal executive Jennings Lang.

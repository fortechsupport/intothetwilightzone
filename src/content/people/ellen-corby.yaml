name: Ellen Corby
born: '1911-06-03'
died: '1999-04-14'
roles:
- actor
bio: >-
  Ellen Corby appeared in "Fright Night," a third-season Night Gallery segment about a couple who inherit a house
  and the trunk its late owner wants left alone. She won three Emmy Awards as Grandma Esther Walton on The Waltons,
  Earl Hamner Jr.'s series, and was nominated for an Academy Award for I Remember Mama (1948).

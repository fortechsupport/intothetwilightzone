name: Lee J. Cobb
roles:
- actor
born: '1911-12-08'
died: '1976-02-11'
bio: >-
  Lee J. Cobb starred in "It's Mental Work" (1963), Rod Serling's Bob Hope Presents the Chrysler Theatre adaptation
  of a John O'Hara story about a dying saloon owner and his bartender, for which Serling won his sixth Emmy. Cobb
  originated Willy Loman in Death of a Salesman, was Oscar-nominated for On the Waterfront and The Brothers Karamazov,
  and played Juror No. 3 in 12 Angry Men.

born: '1952-09-25'
died: '2004-10-10'
bio: >-
  Christopher Reeve starred as Richard Collier, a playwright who wills himself back to 1912 to find an actress he
  has fallen for, in Somewhere in Time (1980), written by Twilight Zone writer Richard Matheson from his novel Bid
  Time Return and directed by Night Gallery veteran Jeannot Szwarc. Reeve was Superman in four films from 1978,
  and after a 1995 riding accident left him paralyzed he became a leading advocate for spinal cord research.

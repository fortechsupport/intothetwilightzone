born: '1919-10-05'
died: '1995-02-02'
bio: >-
  Donald Pleasence starred as Professor Ellis Fowler, an elderly boarding-school teacher forced into retirement
  who is visited on Christmas Eve by the ghosts of former students, in "The Changing of the Guard" (1962). The English
  actor played the forger Colin Blythe in The Great Escape, the Bond villain Blofeld in You Only Live Twice, and
  Dr. Sam Loomis in John Carpenter's Halloween and its sequels.

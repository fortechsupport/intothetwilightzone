name: Patricia Donahue
roles:
- actor
bio: >-
  Patricia Donahue appeared in two second-season Night Gallery segments in 1971, "The Hand of Borgus Weems" and
  "The Dear Departed." She was a television actress of the 1950s and 1960s, known as Lucy Hamilton on Michael Shayne
  and for many guest roles.

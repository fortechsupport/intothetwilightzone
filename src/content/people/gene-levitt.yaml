bio: >-
  Gene Levitt directed "Lone Survivor" (1971), the Night Gallery segment about a woman pulled from a Titanic lifeboat
  who may be doomed to drift from disaster to disaster. A writer-producer of radio and television, he produced and
  wrote for the war series Combat! and later directed TV movies.

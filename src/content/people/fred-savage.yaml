bio: >-
  Fred Savage made one of his first screen appearances in "What Are Friends For?" (1986), the 1985 revival segment
  in which a boy's imaginary friend turns out to have once been his father's. He played Kevin Arnold on The Wonder
  Years and the grandson in The Princess Bride, and later directed episodes of many television comedies.

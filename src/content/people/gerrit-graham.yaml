bio: >-
  Gerrit Graham wrote or co-wrote several episodes of the 1985 Twilight Zone revival, most with writing partner
  Chris Hubbell, including "Children's Zoo," "Opening Day" and "Still Life," and he acted in "Welcome to Winfield."
  As an actor he is known for Brian De Palma films (Greetings, Hi, Mom!, Phantom of the Paradise, where he played
  the glam rocker Beef), Used Cars, Terrorvision and Child's Play 2, and for guest roles in the Star Trek series.

bio: >-
  Dee Wallace played the mother in E.T. the Extra-Terrestrial and became a genre staple through The Howling
  and Cujo. She voiced the leads in the radio versions of "Now You Hear It, Now You Dont" and Ray Bradbury's
  "I Sing the Body Electric."

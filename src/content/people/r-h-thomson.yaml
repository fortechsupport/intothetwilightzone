name: R.H. Thomson
roles:
- actor
born: '1947'
bio: >-
  R. H. Thomson appeared in "Our Selena Is Dying" (1988), the third-season revival episode adapted from Rod Serling's
  unproduced script, in which a dying old woman steals the youth of her granddaughter. One of Canada's most honored
  stage and screen actors, he won Genie and Gemini awards for work including If You Could See What I Hear and Glory
  Enough for All, and appeared in Road to Avonlea and The Englishman's Boy.

born: '1936-05-14'
died: '1973-12-20'
bio: >-
  Bobby Darin starred in the Night Gallery segment "Dead Weight" (1972), opposite Jack Albertson, about a gangster
  who seeks a hiding place from a sinister undertaker. The singer of "Splish Splash," "Mack the Knife" and "Beyond
  the Sea" also earned an Academy Award nomination for Captain Newman, M.D. (1963); "Dead Weight" was among his
  final screen roles before his death at 37.

bio: >-
  John Franklin played one of the ghostly guests in Tower of Terror (1997), Disney's TV film based on The Twilight
  Zone Tower of Terror theme-park ride. He is best known as the boy preacher Isaac in Children of the Corn and as
  Cousin Itt in the Addams Family films.

bio: >-
  Jill Ireland played the ghost of a woman who still waits for her lover in "The Ghost of Sorworth Place," a second-season
  Night Gallery segment opposite Richard Kiley. The English actress was married first to David McCallum and then
  to Charles Bronson, appearing with Bronson in many films including Breakheart Pass, Hard Times and Death Wish
  II. After a breast-cancer diagnosis she wrote the memoir Life Wish and became a cancer- awareness advocate.

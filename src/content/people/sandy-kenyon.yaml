name: Sandy Kenyon
roles:
- actor
bio: >-
  Sandy Kenyon appeared in three original-series episodes: "The Odyssey of Flight 33" (1961), about an airliner
  lost in time; Serling's "The Shelter" (1961), about neighbors who turn on each other during an air-raid alert;
  and "Valley of the Shadow" (1963). A versatile character actor, he worked steadily in television from the 1950s
  to the 1990s.

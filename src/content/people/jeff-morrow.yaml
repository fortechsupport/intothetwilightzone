name: Jeff Morrow
roles:
- actor
born: '1907-01-13'
died: '1993-12-26'
bio: >-
  Jeff Morrow played Kurt Meyers, one of three stranded astronauts who land in a frozen replica of an Earth town,
  in Charles Beaumont's "Elegy" (1960). A radio and stage actor, he became a 1950s science- fiction lead as the
  alien Exeter in This Island Earth and starred in The Creature Walks Among Us and Kronos.

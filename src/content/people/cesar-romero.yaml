name: Cesar Romero
roles:
- actor
born: '1907-02-15'
died: '1994-01-01'
bio: >-
  Cesar Romero played Count Dracula in "A Matter of Semantics" (1971), a Night Gallery blackout sketch in which
  the vampire tries to make a withdrawal at a blood bank. A Hollywood leading man and dancer from the 1930s, he
  appeared in The Thin Man and Ocean's 11 (1960) and became a pop-culture icon as the Joker on the 1960s Batman
  series.

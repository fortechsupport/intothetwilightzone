bio: >-
  Don S. Davis guest-starred in "Memphis" (2003), an episode of the UPN revival about a reporter thrown back to
  the day of Martin Luther King Jr.'s assassination. A former college theatre professor, he played Major Garland
  Briggs on Twin Peaks and General George Hammond on Stargate SG-1.

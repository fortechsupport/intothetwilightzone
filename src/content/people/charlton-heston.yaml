name: Charlton Heston
roles:
- actor
born: '1923-10-04'
died: '2008-04-05'
bio: >-
  Charlton Heston starred in three Rod Serling scripts: the Playhouse 90 adaptation of Pat Frank's nuclear thriller
  Forbidden Area (1956), Serling's Warsaw-ghetto drama In the Presence of Mine Enemies (Playhouse 90, 1960), in
  which he played the German sergeant Paul Lott, and Planet of the Apes (1968), as the astronaut Taylor. Serling's
  draft of Planet of the Apes, later revised by Michael Wilson, supplied the film's famous twist ending of the ruined
  Statue of Liberty. Heston won the Academy Award for Best Actor for Ben-Hur (1959) and is remembered for The Ten
  Commandments, Touch of Evil, El Cid and The Omega Man. He later served as president of the Screen Actors Guild
  and of the National Rifle Association.

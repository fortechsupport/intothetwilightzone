born: '1934'
bio: >-
  Maureen Arthur appeared in "The Dear Departed" (1971), a short comic Night Gallery segment about a scheming couple
  and a fake medium. She is best remembered as Hedy LaRue, the boss's girlfriend, in the film of How to Succeed
  in Business Without Really Trying (1967), and was a frequent comic presence on 1960s variety television.

born: '1962-02-27'
bio: >-
  Adam Baldwin starred in four Twilight Zone Radio Dramas, the audio remakes of original episodes: "Nervous Man
  in a Four-Dollar Room," "The Old Man in the Cave," "Mr. Denton on Doomsday" and "King Nine Will Not Return." He
  is known for playing Animal Mother in Full Metal Jacket (1987), the mercenary Jayne Cobb in Firefly and Serenity,
  and NSA agent John Casey on Chuck.

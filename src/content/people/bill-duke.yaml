born: '1943-02-26'
bio: >-
  Bill Duke directed "The Junction" (1987), a 1980s-revival segment about two miners from different eras trapped
  together underground. Known as an imposing screen actor in Commando and Predator, he became a respected director
  of television and of features including A Rage in Harlem, Deep Cover and Sister Act 2.

name: Collin Wilcox Paxton
roles:
- actor
born: '1935-02-04'
died: '2009-10-14'
bio: >-
  Collin Wilcox Paxton played Marilyn Cuberle, the teenager who refuses the mandatory "Transformation" into a standard
  beautiful body, in "Number 12 Looks Just Like You" (1964), adapted by John Tomerlin from a Charles Beaumont story.
  She is best known as Mayella Ewell, the accuser in To Kill a Mockingbird (1962), and worked on Broadway and in
  television through the 1970s before moving to North Carolina, where she ran a theater.

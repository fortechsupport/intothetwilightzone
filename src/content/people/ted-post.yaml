bio: >-
  Ted Post directed four original-series episodes, A World of Difference in the first season and three
  in the final season: Probe 7, Over and Out, Mr. Garrity and the Graves and The Fear. A prolific television
  director, he moved into features with Clint Eastwood's Hang 'Em High and Magnum Force and the sequel
  Beneath the Planet of the Apes.

bio: >-
  Doug McClure played Pete Grant, the young gunslinger who rides into town to challenge Dan Duryea's washed-up Al
  Denton, in "Mr. Denton on Doomsday," the third episode of the original series. He became a fixture of 1960s television
  as the cowboy Trampas on The Virginian, which ran from 1962 to 1971, after earlier regular roles on Overland Trail
  and Checkmate. In the 1970s he led a run of British-made fantasy adventures, among them The Land That Time Forgot
  and At the Earth's Core.

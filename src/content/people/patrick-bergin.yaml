bio: >-
  Irish actor Patrick Bergin is known for Sleeping with the Enemy, Mountains of the Moon and Robin Hood
  (1991). In "Where the Dead Are," the Serling script that anchors the second half of Lost Classics, he
  played Dr. Benjamin Ramsey, a Civil War-era surgeon who uncovers a secret on a remote island.

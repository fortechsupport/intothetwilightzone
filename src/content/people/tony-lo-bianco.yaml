bio: >-
  Tony Lo Bianco starred in "If She Dies" (1985), a 1985 revival segment about a father keeping vigil over his comatose
  daughter who finds a child's spirit in an old bed. He is known for The Honeymoon Killers, The French Connection
  and The Seven-Ups, and for a Tony-nominated performance in the 1983 Broadway revival of A View from the Bridge.

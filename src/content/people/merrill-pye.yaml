bio: >-
  Merrill Pye was an MGM art director credited on the original Twilight Zone during its second and third seasons,
  designing sets on the studio lot under George W. Davis. He had a long career at MGM going back to the early sound
  era. His feature credits include Alfred Hitchcock's North by Northwest, for which he shared an Academy Award nomination.

bio: >-
  Jon Lormer appeared in three original-series episodes: "Execution," in which a condemned outlaw is snatched forward
  in time, "The Last Rites of Jeff Myrtlebank" and Charles Beaumont's backwoods witch tale "Jess- Belle." A gaunt
  character actor often cast as old men, preachers and doctors, he was a regular presence on Perry Mason as an autopsy
  surgeon and appeared in the Star Trek pilot "The Cage." He also played the elderly man in Creepshow's "Father's
  Day" segment.

bio: >-
  Ted de Corsia played Dickerson, the long-serving foreman who is laid off and tries to destroy the machine with
  a gun, in "The Brain Center at Whipple's" (1964). A radio actor in New York, he moved to films as a tough-guy
  heavy, playing the killer hunted in The Naked City (1948) and appearing in Orson Welles's The Lady from Shanghai
  (1947) and Stanley Kubrick's The Killing (1956). He also played Captain Farragut in Disney's 20,000 Leagues Under
  the Sea (1954).

bio: >-
  Steve Oedekerk wrote and directed Ace Ventura: When Nature Calls (1995), one of the many comedies that nod to
  "Nightmare at 20,000 Feet." He co-wrote The Nutty Professor and Patch Adams, created the animated Jimmy Neutron,
  and made the comedy Kung Pow! Enter the Fist.

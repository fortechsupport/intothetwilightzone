name: Neville Brand
roles:
- actor
born: '1920-08-13'
died: '1992-04-16'
bio: >-
  Neville Brand starred opposite George Takei in "The Encounter" (1964), a two-hander in which a bitter World War
  II veteran and a young Japanese American gardener confront each other in an attic; its handling of Pearl Harbor
  led CBS to keep it out of syndication for decades. Brand was one of the most decorated American soldiers of the
  war, and played heavies in Stalag 17, Birdman of Alcatraz and Tobe Hooper's Eaten Alive.

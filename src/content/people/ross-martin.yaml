born: '1920-03-22'
died: '1981-07-03'
bio: >-
  Ross Martin played Johnny Foster, one of the faces stolen by a shape-shifting con man, in "The Four of Us Are
  Dying" (1960), and Lieutenant Mason, one of three astronauts who find their own wreckage, in Richard Matheson's
  "Death Ship" (1963). On Night Gallery he played the strange Mr. Gingold in "Camera Obscura" and appeared in "The
  Other Way Out." He is best known as master of disguise Artemus Gordon on The Wild Wild West.

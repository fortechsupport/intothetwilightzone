born: '1937-07-05'
bio: >-
  Brooke Hayward played Paula Harper, the vain granddaughter who spends her time admiring herself in mirrors, in
  "The Masks" (1964). The daughter of the agent and producer Leland Hayward and the actress Margaret Sullavan, she
  acted briefly in the early 1960s. She wrote the bestselling family memoir Haywire (1977), later made into a television
  film, and was married to Dennis Hopper during the 1960s.

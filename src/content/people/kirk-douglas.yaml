bio: >-
  Kirk Douglas starred as Colonel Martin "Jiggs" Casey, the Marine officer who uncovers a military coup plot, in
  Seven Days in May (1964), with a screenplay by Rod Serling; his company Joel Productions co-produced the film.
  One of Hollywood's biggest stars, he was nominated for Academy Awards for Champion, The Bad and the Beautiful
  and Lust for Life, and starred in Spartacus and Paths of Glory. He received an honorary Oscar in 1996 and lived
  to 103.

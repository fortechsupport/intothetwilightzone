born: '1925-10-31'
bio: >-
  Lee Grant narrated Rod Serling: Submitted for Your Approval (1995), the PBS American Masters documentary portrait
  of Serling directed by Susan Lacy. Blacklisted in the 1950s, she returned to win an Emmy for Peyton Place and
  the Academy Award for Best Supporting Actress for Shampoo (1975), and as a director won an Oscar for the documentary
  Down and Out in America (1986).

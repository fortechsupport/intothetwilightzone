bio: >-
  Leif Erickson appeared in the Night Gallery segments "The Academy" (1971) and "Something in the Woodwork" (1973),
  and in an episode of the companion series The Sixth Sense. He starred as Big John Cannon on The High Chaparral
  and appeared in Tea and Sympathy and On the Waterfront.

died: '2018-06-27'
bio: >-
  Combative and prolific speculative fiction writer Harlan Ellison joined the 1985 revival as creative
  consultant and wrote or supplied stories for segments including Shatterday, Paladin of the Lost Hour,
  One Life, Furnished in Early Poverty and Gramma, adapted from Stephen King. He quit in protest when
  CBS halted production of Nackles, his adaptation of a Donald Westlake story about an evil anti-Santa
  that was to have been his directing debut. He came back for the final syndicated season with Crazy as
  a Soup Sandwich.

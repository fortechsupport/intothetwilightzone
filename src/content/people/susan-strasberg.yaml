bio: >-
  Susan Strasberg appeared in the Night Gallery segments "Midnight Never Ends" (1971) and "The Doll of Death" (1973).
  The daughter of acting teacher Lee Strasberg, she originated the title role in The Diary of Anne Frank on Broadway
  and starred in Picnic and the Hammer thriller Taste of Fear.

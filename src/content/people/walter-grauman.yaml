bio: >-
  Walter Grauman directed "Miniature," the fourth-season hour in which Robert Duvall falls in love with a figure
  in a museum dollhouse. A World War II bomber pilot, he became a prolific television director on The Untouchables
  and later Murder, She Wrote, which he also produced. His features include Lady in a Cage with Olivia de Havilland
  and the RAF drama 633 Squadron.

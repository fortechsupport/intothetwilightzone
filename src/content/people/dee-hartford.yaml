name: Dee Hartford
roles:
- actor
bio: >-
  Dee Hartford played Gloria Sharewood, the self-absorbed mother whose bickering drives her children into a magical
  pool, in "The Bewitchin' Pool," the last episode produced for the original series. A fashion model before she
  acted, she was married for a time to director Howard Hawks and made many television guest appearances in the 1960s.

name: Susan Blakely
born: '1948-09-07'
roles:
- actor
bio: >-
  Susan Blakely starred in "The Card," a 1988 episode of the revival's final season about a woman trapped by a credit
  card company with supernatural collection powers. She became a star as Julie Prescott in the landmark miniseries
  Rich Man, Poor Man (1976), and appeared in The Towering Inferno and The Lords of Flatbush. She also played Frances
  Farmer in the TV film Will There Really Be a Morning?

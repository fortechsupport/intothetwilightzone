bio: >-
  Patty Duke starred in "The Diary" (1971), the Night Gallery segment about a TV gossip host who receives a diary
  that records the future. She won an Academy Award at sixteen as Helen Keller in The Miracle Worker, starred in
  The Patty Duke Show and Valley of the Dolls, and won three Emmys.

bio: >-
  Jack Donohue directed Assault on a Queen (1966), the Frank Sinatra caper film that Rod Serling adapted from Jack
  Finney's novel. A former dancer and choreographer, he directed musicals and comedies and much television, including
  The Red Skelton Show and Chico and the Man.

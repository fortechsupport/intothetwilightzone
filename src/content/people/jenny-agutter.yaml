name: Jenny Agutter
roles:
- actor
born: '1952-12-20'
bio: >-
  Jenny Agutter played Jessica 6 in Logan's Run (1976), MGM's film of the novel by William F. Nolan and Twilight
  Zone writer George Clayton Johnson. She starred in Walkabout, The Railway Children and An American Werewolf in
  London, won a BAFTA for Equus, and plays Sister Julienne on Call the Midwife.

bio: >-
  Robert Sampson played Chris Miller, the father whose daughter falls through her bedroom wall into another dimension,
  in Richard Matheson's "Little Girl Lost" (1962). He later played Dean Halsey in Re-Animator and was a regular
  on Bridget Loves Bernie and Falcon Crest.

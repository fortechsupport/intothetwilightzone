name: Van Heflin
roles:
- actor
born: '1908-12-13'
died: '1971-07-23'
bio: >-
  Van Heflin starred as Fred Staples, the young engineer brought into a cutthroat corporation, in the 1956 film
  of Rod Serling's Patterns, and led Serling's Playhouse 90 drama "The Rank and File" (1959) as a union man corrupted
  by power. He won the Academy Award for Johnny Eager (1942) and is remembered as the homesteader in Shane and in
  3:10 to Yuma.

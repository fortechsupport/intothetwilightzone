bio: >-
  Frances Conroy starred in "The Library" (1986), the 1980s-revival segment about a librarian who discovers books
  that contain the lives of everyone on Earth and can be rewritten. She won an Emmy and Golden Globe as Ruth Fisher
  on Six Feet Under and has appeared in many seasons of American Horror Story.

bio: >-
  Mickey Hart, drummer of the Grateful Dead, was sound designer and supplied special musical effects for the 1985
  Twilight Zone, alongside the band's new arrangement of the theme and Merl Saunders's scores. A student of percussion
  from around the world, he has recorded many albums of world music and won a Grammy for Planet Drum. He was inducted
  into the Rock and Roll Hall of Fame with the Grateful Dead.

name: Sam Swainsbury
roles:
- actor
bio: >-
  Sam Swainsbury was a member of the ensemble of Anne Washburn's stage adaptation The Twilight Zone, which premiered
  at London's Almeida Theatre in December 2017 and later transferred to the West End. He is best known on television
  as Jason in the BBC sitcom Mum.

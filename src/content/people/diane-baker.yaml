name: Diane Baker
roles:
- actor
born: '1938-02-25'
bio: >-
  Diane Baker played the devoted daughter of William Windom's aging widower in Rod Serling's Night Gallery segment
  "They're Tearing Down Tim Riley's Bar" (1971), one of the most acclaimed segments of the series. She appeared
  in The Diary of Anne Frank (1959) and Alfred Hitchcock's Marnie, and later played the senator whose daughter is
  kidnapped in The Silence of the Lambs (1991).

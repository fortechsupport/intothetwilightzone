born: '1943-06-09'
bio: >-
  Joe Haldeman wrote the story "I of Newton," adapted by Alan Brennert for the 1985 revival segment in which a math
  professor (Ron Glass) accidentally summons the Devil (Sherman Hemsley) and must stump him to save his soul. A
  Vietnam veteran, Haldeman won Hugo and Nebula awards for The Forever War and was named an SFWA Grand Master.

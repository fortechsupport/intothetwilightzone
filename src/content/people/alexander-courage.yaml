bio: >-
  Alexander Courage orchestrated music for Twilight Zone: The Movie (1983), working on Jerry Goldsmith's score and
  its treatment of the series theme. He wrote the theme for Star Trek and spent decades as one of Hollywood's leading
  orchestrators, often for Goldsmith.

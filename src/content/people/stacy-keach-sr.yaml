born: '1914-05-29'
died: '2003-02-13'
bio: >-
  Stacy Keach Sr. appeared in "Wong's Lost and Found Emporium" (1985), the 1985 revival's adaptation of William
  F. Wu's story about a young Chinese American searching a mystical shop for his lost compassion. A stage director
  and actor, he coached actors at Universal, created the radio series Tales of the Texas Rangers, and was the father
  of actors Stacy Keach and James Keach.

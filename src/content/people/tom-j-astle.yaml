name: Tom J. Astle
roles:
- writer
bio: >-
  Tom J. Astle wrote "There Was an Old Woman" (1988), a third-season revival episode starring Colleen Dewhurst.
  He later co-wrote, with Matt Ember, the romantic comedy Failure to Launch (2006) and the feature film version
  of Get Smart (2008).

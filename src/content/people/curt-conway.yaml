bio: >-
  Curt Conway played the shadowy mentor who coaches Dennis Hopper's Peter Vollmer in demagoguery and is finally
  revealed as Adolf Hitler, in "He's Alive" (1963). He was both an actor and a stage director, active in New York
  theatre before working in television drama. He was for a time married to the actress Kim Stanley.

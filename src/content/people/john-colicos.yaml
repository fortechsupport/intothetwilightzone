bio: >-
  John Colicos appeared in "Lone Survivor" (1971), a first-season Night Gallery segment about a lifeboat survivor
  picked up by a passing ocean liner. The Canadian actor is best known as the traitor Count Baltar on the original
  Battlestar Galactica and as the Klingon commander Kor on Star Trek.

bio: >-
  Writer-producer Simon Kinberg co-developed the 2019 revival with Jordan Peele and Marco Ramirez and
  executive produced it through his company Genre Films; he also directed the first-season finale, Blurryman,
  a meta-story set partly in the show's own writers' room. Kinberg is best known as a writer and producer
  of the X-Men film series, which he also directed with Dark Phoenix (2019), and of The Martian.

name: Kay Reindl
roles:
- writer
bio: >-
  Kay Reindl, writing with her longtime partner Erin Maher, co-wrote two episodes of the 2002 UPN revival: "The
  Monsters Are on Maple Street," an update of Serling's 1960 classic, and "The Collection." The Reindl-Maher team
  had earlier written for Chris Carter's Millennium, including the episode "Midnight of the Century," and went on
  to other genre television.

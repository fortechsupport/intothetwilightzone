name: Pat Crowley
roles:
- actor
born: '1933-09-17'
bio: >-
  Pat Crowley played Jackie Benson, the newspaper editor's girlfriend whom the devilish linotype operator Mr. Smith
  (Burgess Meredith) tries to destroy, in "Printer's Devil" (1963). She won a Golden Globe for promising newcomer,
  starred in the sitcom Please Don't Eat the Daisies, and later appeared on Dynasty and The Bold and the Beautiful.

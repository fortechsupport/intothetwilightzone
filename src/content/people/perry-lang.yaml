bio: >-
  Perry Lang directed "Shades of Guilt" (2002), an early episode of the UPN revival of The Twilight Zone. He first
  worked as an actor in Steven Spielberg's 1941 and Samuel Fuller's The Big Red One before becoming a prolific television
  director.

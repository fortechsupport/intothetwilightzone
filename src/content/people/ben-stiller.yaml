born: '1965-11-30'
bio: >-
  Ben Stiller was reported in June 2025 to be attached to direct Warner Bros.' long-gestating Twilight Zone feature
  film, the latest name in a project that had passed through Matt Reeves and Joseph Kosinski. The son of comedians
  Jerry Stiller and Anne Meara, he directed Reality Bites, Zoolander, Tropic Thunder and The Secret Life of Walter
  Mitty, and won acclaim directing the Apple TV+ series Severance.

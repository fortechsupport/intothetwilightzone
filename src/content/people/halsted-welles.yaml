name: Halsted Welles
roles:
- writer
bio: >-
  Halsted Welles was one of Night Gallery's most frequent adapters of classic weird fiction, writing six segments:
  "The Phantom Farmhouse," "The Dark Boy," "The Sins of the Fathers," "The Return of the Sorcerer" (from Clark Ashton
  Smith), "Death on a Barge" and "Hatred unto Death." "The Sins of the Fathers," about a Welsh sin-eater, is often
  ranked among the series' finest. Earlier he wrote the screenplay for the western 3:10 to Yuma (1957) from Elmore
  Leonard's story, and worked widely in live and filmed television drama.

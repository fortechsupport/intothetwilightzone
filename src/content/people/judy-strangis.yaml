bio: >-
  Judy Strangis appeared as a child in "The Bard" (1963), the fourth-season comedy in which a hack writer conjures
  up William Shakespeare. She is best known as the student Helen Loomis on Room 222 and as Dyna Girl in the Saturday-morning
  series Electra Woman and Dyna Girl (1976).

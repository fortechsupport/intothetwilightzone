bio: >-
  Hedley Mattingly appeared in "Lone Survivor" (1971), the Night Gallery segment in which a ship picks up a lone
  survivor of the Titanic who turns out to be adrift in time. The English actor played District Officer Hedley on
  Daktari and appeared in many American TV series of the 1960s.

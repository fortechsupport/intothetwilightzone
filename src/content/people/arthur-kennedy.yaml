name: Arthur Kennedy
roles:
- actor
born: '1914-02-17'
died: '1990-01-05'
bio: >-
  Arthur Kennedy appeared opposite Charles Laughton in Rod Serling's Playhouse 90 drama "In the Presence of Mine
  Enemies" (1960), set in the Warsaw Ghetto. A five-time Academy Award nominee (Champion, Bright Victory, Trial,
  Peyton Place, Some Came Running), he also won a Tony for originating Biff in Death of a Salesman and appeared
  in Lawrence of Arabia.

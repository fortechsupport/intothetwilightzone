bio: >-
  Melinda Dillon was a Tony-nominated original cast member of Who's Afraid of Virginia Woolf? who earned
  Oscar nominations for Close Encounters of the Third Kind and Absence of Malice, and played the mother
  in A Christmas Story. In "A Little Peace and Quiet" she plays a frazzled mother who finds a pendant
  that stops time, with devastating Cold War consequences.

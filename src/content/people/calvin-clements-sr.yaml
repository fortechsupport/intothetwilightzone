born: '1915'
died: '1997'
bio: >-
  Calvin Clements Sr. wrote "Eye of the Haunted" for The Sixth Sense (1972), the ABC parapsychology series whose
  episodes were later cut down and folded, with new Rod Serling introductions, into the syndicated Night Gallery
  package. A prolific television writer from the 1950s to the 1980s, he was one of the mainstays of Gunsmoke and
  wrote for many other westerns and crime dramas. His son Calvin Clements Jr. also became a television writer.

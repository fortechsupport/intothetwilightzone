bio: >-
  Sydney Tamiia Poitier guest-starred in "The Placebo Effect" (2003), an episode of the UPN revival. The daughter
  of Sidney Poitier and Joanna Shimkus, she starred in the sitcom Abby, appeared on Veronica Mars and played Jungle
  Julia in Quentin Tarantino's Death Proof (2007).

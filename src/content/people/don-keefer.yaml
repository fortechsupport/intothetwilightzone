born: '1916-08-18'
died: '2014-09-07'
bio: >-
  Don Keefer is best remembered by Twilight Zone viewers as Dan Hollis, the birthday-party guest whom the child
  Anthony turns into a jack-in-the-box in "It's a Good Life" (1961). He also had a part in Serling's unofficial
  pilot "The Time Element" (1958) and appeared in "The Homecoming of Lemuel Stove," an episode of Serling's western
  The Loner. A charter member of the Actors Studio, he worked as a character actor for six decades, with film roles
  in Death of a Salesman (1951), Butch Cassidy and the Sundance Kid and Sleeper.

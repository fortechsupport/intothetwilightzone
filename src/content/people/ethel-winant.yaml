tz_credits:
- series: The Twilight Zone (1959)
  work: series
  role: casting (credited 1960-1961)
died: '2003'
bio: >-
  Ethel Winant cast the original Twilight Zone during its second season, one of the CBS casting executives credited
  on the series. She had built her reputation casting live drama for CBS, including Playhouse 90, and became known
  for bringing stage actors and new faces to television. In 1973 she became the first woman named a vice president
  at a television network, and she later held senior programming posts at CBS and NBC. She died in 2003.

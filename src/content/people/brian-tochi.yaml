bio: >-
  Brian Tochi starred as David Wong in "Wong's Lost and Found Emporium" (1985), the 1985 revival's story of a man
  searching a magical shop for the compassion he lost. He played Takashi in Revenge of the Nerds and voiced Leonardo
  in the live-action Teenage Mutant Ninja Turtles films.

born: '1916-01-04'
died: '1995-12-04'
bio: >-
  Robert Parrish directed three first-season episodes: "One for the Angels" (1959), "A Stop at Willoughby" (1960)
  and "The Mighty Casey" (1960). A former child actor and Oscar-winning film editor (Body and Soul, 1947), he had
  earlier directed Saddle the Wind (1958), a western scripted by Rod Serling, and later made the science-fiction
  film Journey to the Far Side of the Sun (1969).

bio: >-
  Nick Cravat wore the furry suit of the gremlin that crawls across the wing of William Shatner's airliner in "Nightmare
  at 20,000 Feet" (1963), one of the most famous images in the series. A circus acrobat, he had performed in a double
  act with Burt Lancaster before both went to Hollywood. He became a fixture of Lancaster's films, most memorably
  as his mute sidekick in The Flame and the Arrow (1950) and The Crimson Pirate (1952).

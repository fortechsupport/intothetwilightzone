name: Charles Macaulay
roles:
- actor
bio: >-
  Charles Macaulay appeared in "The Funeral" (1972), a comic Night Gallery segment in which a nervous undertaker
  is hired to stage a funeral for a vampire, with Joe Flynn and Werner Klemperer. The character actor is best remembered
  as Count Dracula, who curses the African prince Mamuwalde in the prologue of Blacula (1972).

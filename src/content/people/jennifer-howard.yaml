name: Jennifer Howard
born: '1925'
died: '1993'
roles:
- actor
bio: >-
  Jennifer Howard played the nurse in "Eye of the Beholder" (1960), one of the hospital staff whose faces stay hidden
  until the episode's famous reveal. The daughter of playwright Sidney Howard, she acted on stage and in television
  in the 1950s and 60s and was the first wife of producer Samuel Goldwyn Jr.

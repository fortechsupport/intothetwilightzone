bio: >-
  Danny Cooksey appeared as a boy in "The Burning Man" (1985), the 1985-revival adaptation of Ray Bradbury's story
  about an aunt and nephew who meet a strange hitchhiker on a scorching day. He played Tim Connor in Terminator
  2, voiced Jack Spicer on Xiaolin Showdown, and fronts the band Bad4Good.

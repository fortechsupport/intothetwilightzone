born: '1955-09-12'
died: '2021-10-22'
bio: >-
  Peter Scolari starred in "The Trance" (1988), a third-season revival episode about a phony channeler who begins
  to speak for something genuinely evil. He co-starred with Tom Hanks in Bosom Buddies (1980-82), played the producer
  Michael Harris on Newhart, and late in his career won an Emmy for playing Lena Dunham's father on Girls.

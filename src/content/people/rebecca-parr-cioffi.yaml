bio: >-
  Rebecca Parr Cioffi co-wrote two first-season segments of the 1985 revival with Martin Pasko: "The Beacon" (1985),
  about a doctor stranded in a coastal town that worships its lighthouse, and "But Can She Type?" (1985), about
  a secretary transported to a world where secretaries are celebrated.

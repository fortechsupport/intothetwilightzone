bio: >-
  Canadian director Allan Kroeker worked on two incarnations of the series: he directed Something in the
  Walls for the 1985 revival's Canadian-made third season and, in 2002, Evergreen, Gabe's Story and the
  much-publicised sequel It's Still a Good Life.

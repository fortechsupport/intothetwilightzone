bio: >-
  Leonard Nimoy was a working TV character actor before Star Trek made him world-famous as the logical
  Mr. Spock; he later directed Star Trek III and IV and Three Men and a Baby. He appeared in Rod Serling's
  WWII morality play "A Quality of Mercy" as one of the weary American soldiers on Corregidor.

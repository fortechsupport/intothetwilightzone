bio: >-
  Swedish actor-director Alf Kjellin directed episodes of The Sixth Sense (1972), the ABC series about a parapsychologist
  whose episodes were repackaged with Rod Serling introductions into the Night Gallery syndication package. He starred
  in Alf Sjöberg's Torment (1944), written by Ingmar Bergman, then moved to American television, where he directed
  episodes of many series from the 1960s on, Alfred Hitchcock Presents among them.

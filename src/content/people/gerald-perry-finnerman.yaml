born: '1931-12-17'
died: '2011-04-06'
bio: >-
  Gerald Perry Finnerman directed the third-season Night Gallery segments "She'll Be Company for You" and "Hatred
  unto Death" (1972-73), having also served as a cinematographer on the series. He is best known as director of
  photography on the original Star Trek, whose saturated colored lighting he devised, and later shot Moonlighting.

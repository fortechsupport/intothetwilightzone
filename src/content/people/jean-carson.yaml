bio: >-
  Jean Carson played Paula Diedrich, one half of a pair of small-time thieves who steal a camera that takes pictures
  of the future, in "A Most Unusual Camera" (1960). She was one of the "fun girls" from Mount Pilot on The Andy
  Griffith Show and co-starred on Broadway and in early TV comedy.

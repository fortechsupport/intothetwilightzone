name: Thomas Gomez
born: '1905-07-10'
died: '1971-06-18'
roles:
- actor
bio: >-
  Thomas Gomez played the Devil, called Cadwallader, who sells immortality to a hypochondriac in "Escape Clause"
  (1959), and Sykes, the peddler who sells "magic dust" to a condemned man's father in "Dust" (1961). He was the
  first Hispanic American actor nominated for an Academy Award (Ride the Pink Horse, 1947), and also appeared in
  Key Largo and Force of Evil.

born: '1915-04-07'
died: '1977-04-27'
bio: >-
  Stanley Adams played one of the townspeople of a dusty western town visited by a man who can raise the dead in
  "Mr. Garrity and the Graves" (1964), one of the last episodes of the original series. A heavyset character actor,
  he is best known as the trader Cyrano Jones in Star Trek's "The Trouble with Tribbles" and appeared in Lilies
  of the Field and Breakfast at Tiffany's.

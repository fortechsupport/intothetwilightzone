bio: >-
  Cotter Smith starred as Mitchell Chaplin, a man sentenced to a year of invisibility in which society must ignore
  him, in "To See the Invisible Man" (1986), the 1985 revival's adaptation of Robert Silverberg's story, scripted
  by Steven Barnes. He is an American stage and television actor.

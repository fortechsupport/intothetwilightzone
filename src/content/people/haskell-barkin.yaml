name: Haskell Barkin
roles:
- writer
bio: >-
  Haskell Barkin was one of the more prolific freelance writers on the 1985 revival of The Twilight Zone, credited
  on "Act Break," "Tooth and Consequences," "The Curious Case of Edgar Witherspoon" and "Appointment on Route 17,"
  which together span all three seasons. His scripts leaned toward light, comic fantasy, such as the struggling
  playwrights of "Act Break" and the miserable dentist visited by a tooth fairy in "Tooth and Consequences." Little
  biographical information about him is published; his television credits run mainly through the 1970s and 1980s.

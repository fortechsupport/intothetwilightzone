name: David Naughton
roles:
- actor
born: '1951-02-13'
bio: >-
  David Naughton starred in "Special Service" (1989), a third-season revival episode in which a man discovers that
  his entire life is being broadcast as a live television show, a premise that anticipates The Truman Show by nearly
  a decade. He is best known as David Kessler in John Landis's An American Werewolf in London (1981) and for singing
  in the "Be a Pepper" Dr Pepper commercials of the late 1970s.

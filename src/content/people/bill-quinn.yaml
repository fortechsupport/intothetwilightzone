name: Bill Quinn
roles:
- actor
born: '1912-05-06'
died: '1994-04-29'
bio: >-
  Bill Quinn played Mr. Conroy, the sour resident of Sunnyvale Rest Home who refuses Mr. Bloom's offer of youth,
  in Steven Spielberg's "Kick the Can" segment of Twilight Zone: The Movie (1983). A character actor whose career
  began as a child on stage, he played the blind Mr. Van Ranseleer on All in the Family and Archie Bunker's Place.

bio: >-
  Yaphet Kotto played the mysterious stranger at the heart of Serling's Night Gallery segment "The Messiah on Mott
  Street" (1971), opposite Edward G. Robinson. He is known for Live and Let Die, Alien and Midnight Run, and as
  Lt. Al Giardello on Homicide: Life on the Street.

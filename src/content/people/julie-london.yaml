bio: >-
  Julie London played Joan Blake, the saloon singer caught between two brothers, in Saddle the Wind (1958), the
  MGM western written by Rod Serling. She sings in the film, a nod to her fame as a torch singer whose 1955 recording
  of "Cry Me a River" became a standard. Her other films include The Girl Can't Help It and Man of the West, and
  she later played nurse Dixie McCall on Emergency!, produced by her husband Jack Webb.

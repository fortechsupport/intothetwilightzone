born: '1955-01-19'
bio: >-
  Comedian Paul Rodriguez appeared in "Tagged" (2003), an episode of the UPN Twilight Zone revival. The Mexican-born
  stand-up became one of the best-known Latino comics in the United States in the 1980s, starring in the sitcom
  a.k.a. Pablo (1984) and films such as Born in East L.A. and Tortilla Soup, and was one of the Original Latin Kings
  of Comedy.

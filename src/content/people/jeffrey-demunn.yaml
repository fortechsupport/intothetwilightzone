name: Jeffrey DeMunn
roles:
- actor
born: '1947-04-25'
bio: >-
  Jeffrey DeMunn starred in "Kentucky Rye" (1985), the revival episode about a man who wanders, after a drunk-driving
  crash, into a roadside bar he cannot leave. A frequent collaborator of director Frank Darabont, he appeared in
  The Shawshank Redemption, The Green Mile, The Majestic and The Mist, and played Dale Horvath on The Walking Dead
  and Chuck's father on Billions.

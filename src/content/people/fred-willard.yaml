bio: >-
  Fred Willard was a master of oblivious comic characters, from Fernwood 2 Night to Best in Show and Anchorman,
  and earned Emmy nominations for Everybody Loves Raymond and Modern Family. He voiced the leads in four
  radio adaptations, including "The Howling Man" and "Third from the Sun."

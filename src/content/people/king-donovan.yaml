name: King Donovan
roles:
- actor
born: '1918-01-25'
died: '1987-06-30'
bio: >-
  King Donovan acted opposite his wife, Imogene Coca, in "The Merciful" (1971), a two-person Night Gallery segment
  in which a wife walls her husband into the cellar. He is best remembered as Jack Belicec, the friend who finds
  the first pod duplicate, in Invasion of the Body Snatchers (1956).

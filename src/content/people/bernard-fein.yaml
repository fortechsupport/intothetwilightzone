bio: >-
  Bernard Fein had a supporting role in "He's Alive," the original-series episode in which Dennis Hopper plays a
  young neo-Nazi guided by the shadowy figure of Hitler. As an actor he was a regular on The Phil Silvers Show,
  playing Private Gomez. His lasting mark on television came as co-creator, with Albert S. Ruddy, of Hogan's Heroes
  (1965-1971).

bio: >-
  Anthony Wilson wrote "Come Wander with Me," the fifth-season episode in which a rockabilly singer (Gary Crosby)
  hunting for an authentic folk song stumbles into a ballad that tells his own doom. Wilson went on to produce and
  write for television, and is credited with creating the detective series Banacek.

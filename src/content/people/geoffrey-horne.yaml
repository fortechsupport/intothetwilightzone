born: '1933-08-22'
bio: >-
  Geoffrey Horne played Williams, the injured visitor from another world whom the people of a Mexican village fear
  and destroy, in "The Gift" (1962). He is best known as Lieutenant Joyce in The Bridge on the River Kwai (1957)
  and later became an acting teacher in New York.

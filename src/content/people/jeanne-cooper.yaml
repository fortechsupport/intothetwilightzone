name: Jeanne Cooper
born: '1928-10-25'
died: '2013-05-08'
roles:
- actor
bio: >-
  Jeanne Cooper played Liz, the saloon woman who looks after Dan Duryea's broken-down gunfighter, in "Mr. Denton
  on Doomsday," the third episode ever broadcast, and later guest-starred in "The Lonely Calico Queen" on Serling's
  western The Loner. She became a daytime television legend as Katherine Chancellor on The Young and the Restless,
  a role she played from 1973 until her death and which won her a Daytime Emmy. Her son is actor Corbin Bernsen.

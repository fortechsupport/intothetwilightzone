bio: >-
  Bill Mumy began acting as a child and went on to star as Will Robinson in Lost in Space and Lennier
  in Babylon 5, as well as working as a musician and writer. He is the franchise's most-revisited actor:
  three original episodes including the terrifying child Anthony Fremont in "It's a Good Life", a cameo
  in Twilight Zone: The Movie, and a return as the adult Anthony in the 2003 sequel.

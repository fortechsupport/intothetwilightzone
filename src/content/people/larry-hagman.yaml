bio: >-
  Larry Hagman starred in "The Housekeeper," a darkly comic first-season Night Gallery segment in which a man uses
  a magic formula to put his ugly wife's mind into the body of a beautiful young housekeeper. He was then starring
  as Major Tony Nelson on I Dream of Jeannie and later became world-famous as the oil baron J.R. Ewing on Dallas.
  He was the son of Broadway star Mary Martin.

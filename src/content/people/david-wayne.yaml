name: David Wayne
born: '1914-01-30'
died: '1995-02-09'
roles:
- actor
bio: >-
  David Wayne starred as Walter Bedeker, the hypochondriac who trades his soul for immortality and then finds he
  cannot die, in "Escape Clause" (1959), and later appeared in the Night Gallery segment "The Diary" (1971). He
  won the first Tony Award for a featured actor (Finian's Rainbow), originated Sakini in The Teahouse of the August
  Moon, and played the Mad Hatter on Batman and Digger Barnes on Dallas.

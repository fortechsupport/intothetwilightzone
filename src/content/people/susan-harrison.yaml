name: Susan Harrison
born: '1938-08-26'
died: '2019'
roles:
- actor
bio: >-
  Susan Harrison played the Ballerina, one of the five strangers trapped in a giant cylinder, in "Five Characters
  in Search of an Exit" (1961). She made her name as Susan Hunsecker, the sister J.J. Hunsecker tries to control,
  in Sweet Smell of Success (1957), and worked in television until the mid-1960s.

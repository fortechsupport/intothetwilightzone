bio: >-
  Science fiction writer David Gerrold, author of Star Trek's The Trouble with Tribbles, wrote two segments
  for the 1985 revival: A Day in Beaumont, an affectionate pastiche of 1950s alien-invasion films, and
  A Saucer of Loneliness, adapted from Theodore Sturgeon's story.

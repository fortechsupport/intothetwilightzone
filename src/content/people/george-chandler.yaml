born: '1898-06-30'
died: '1985-06-10'
bio: >-
  George Chandler played Luther Grimbley, the old man who sells used-car dealer Harvey Hunnicut a haunted Model
  A that compels its owner to tell the truth, in "The Whole Truth" (1961). He appeared in hundreds of films, played
  Uncle Petrie on Lassie, and served as president of the Screen Actors Guild.

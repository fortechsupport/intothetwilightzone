bio: >-
  Basil Hoffman played Mr. Steward, the polite stranger who delivers the deadly button box in "Button, Button" (1986),
  the revival's adaptation of Richard Matheson's story. A character actor with a long film and television career,
  he appeared in Ordinary People, My Favorite Year and The Artist, along with dozens of guest roles on television.

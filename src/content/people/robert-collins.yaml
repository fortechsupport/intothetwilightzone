bio: >-
  Credited here as Robert Collins, this is the writer-director Robert L. Collins, who wrote the Sixth Sense episode
  "With This Ring, I Thee Kill!" (1972), from the Universal series later folded into the syndicated Night Gallery
  package. He also wrote and directed that show's "Whisper of Evil," created NBC's Police Woman (1974-78), and directed
  the television film Gideon's Trumpet (1980).

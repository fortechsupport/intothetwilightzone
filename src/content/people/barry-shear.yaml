name: Barry Shear
born: '1923'
died: '1979'
roles:
- director
bio: >-
  Barry Shear directed "The Escape Route," the segment of the 1969 Night Gallery pilot film in which Richard Kiley
  plays a fugitive Nazi war criminal hiding in South America. He also directed an episode of The Sixth Sense, the
  supernatural series whose episodes were later cut down and folded into the syndicated Night Gallery package. A
  veteran of live television, he moved into features with the youth-rebellion satire Wild in the Streets (1968)
  and the Harlem crime drama Across 110th Street (1972).

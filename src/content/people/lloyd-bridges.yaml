born: '1913-01-15'
died: '1998-03-10'
bio: >-
  Lloyd Bridges starred as William Colton, a Union officer drifting west after the Civil War, in The Loner (CBS,
  1965-66), the half-hour western Rod Serling created and wrote much of. He appears in all 26 episodes; the show
  was cancelled after one season amid Serling's clashes with CBS over its violence quota. Bridges was already a
  television star from Sea Hunt (1958-61), and later found a second career in comedy with Airplane! and the Hot
  Shots! films. He was the father of actors Beau and Jeff Bridges.

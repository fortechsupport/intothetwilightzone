name: Wendell Corey
roles:
- actor
born: '1914-03-20'
died: '1968-11-08'
bio: >-
  Wendell Corey played the prosecuting officer in The Rack (1956), the MGM film of Rod Serling's teleplay about
  a Korean War prisoner (Paul Newman) court-martialed for collaborating with the enemy. A stage-trained leading
  man and character actor, he appeared in Rear Window and The Rainmaker and served as president of the Academy of
  Motion Picture Arts and Sciences from 1961 to 1963.

born: '1946-12-18'
bio: >-
  Steven Spielberg's franchise ties begin with Rod Serling: his directorial debut was the Joan Crawford
  segment Eyes in the 1969 pilot film for Serling's Night Gallery, and he later directed the episode Make
  Me Laugh. In 1983 he co-produced Twilight Zone: The Movie with John Landis through his company and directed
  its second segment, Kick the Can, a remake of George Clayton Johnson's original-series episode about
  residents of a retirement home who briefly regain their youth. He is one of the most commercially successful
  directors in film history, from Jaws and E.T. to Schindler's List.

born: '1907-04-21'
died: '1986-11-08'
bio: >-
  Beatrice Kay appeared in "Cool Air" (1971), Night Gallery's adaptation of H. P. Lovecraft's story about a doctor
  who keeps his apartment refrigerated to stay alive. A vaudeville and radio singer famous for her renditions of
  Gay Nineties songs, she also acted in films such as Underworld U.S.A.

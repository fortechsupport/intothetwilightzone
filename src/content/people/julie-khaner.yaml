bio: >-
  Julie Khaner appeared in two Toronto-filmed third-season segments of the 1985 revival: "The Hellgramite Method"
  (1988) and "The Call" (1988). A Canadian actress, she is best known as a regular on the CBC legal drama Street
  Legal.

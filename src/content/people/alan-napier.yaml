name: Alan Napier
born: '1903-01-07'
died: '1988-08-08'
roles:
- actor
bio: >-
  Alan Napier played the captain of the aging ocean liner in "Passage on the Lady Anne," and later appeared in "Fright
  Night," a third-season Night Gallery segment. The tall English character actor worked in Hollywood for decades,
  in films such as Cat People and Julius Caesar, but is best remembered as Alfred Pennyworth, Bruce Wayne's butler,
  on the 1960s Batman series.

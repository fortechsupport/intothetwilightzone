bio: >-
  Ryan Coogler wrote and directed Sinners (2025), about twin brothers who open a juke joint in 1930s Mississippi
  and face a vampiric threat; several outlets traced a key inspiration to a Twilight Zone episode. He made his name
  with Fruitvale Station (2013) and directed Creed and Black Panther and its sequel.

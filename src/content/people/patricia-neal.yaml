died: '2010-08-08'
bio: >-
  Patricia Neal starred as Olivia Walton in The Homecoming: A Christmas Story (1971), the television film by Twilight
  Zone writer Earl Hamner Jr. that launched The Waltons, earning a Golden Globe for the role. She won the Academy
  Award for Best Actress for Hud (1963) and was also known for The Fountainhead, The Day the Earth Stood Still and
  Breakfast at Tiffany's. Her recovery from a series of strokes in 1965 and return to acting became a widely told
  story.

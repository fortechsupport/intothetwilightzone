bio: >-
  Robert Knepper appeared in "Joy Ride," a 1986 segment of the first Twilight Zone revival, and later voiced roles
  in The Twilight Zone Radio Dramas versions of "A Quality of Mercy" and "The Last Rites of Jeff Myrtlebank." He
  is best known as the menacing convict Theodore "T-Bag" Bagwell on Prison Break. His other television work includes
  Heroes, Cult, iZombie and the 2017 return of Twin Peaks, and his films include Hitman and Sin City: A Dame to
  Kill For.

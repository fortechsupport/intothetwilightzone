born: '1928'
died: '2014'
bio: >-
  Jerry McNeely wrote the teleplay of "The Self-Improvement of Salvadore Ross" (1964), adapted from Henry Slesar's
  story about a man who learns he can trade away his traits and possessions. A Missouri-born writer who also taught
  at the University of Wisconsin, he created the legal drama Owen Marshall, Counselor at Law and was Emmy-nominated
  for the television film Something for Joey. He died in 2014 at 86.

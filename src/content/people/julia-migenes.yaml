born: '1949-03-13'
bio: >-
  The soprano Julia Migenes starred in "Grace Note" (1986), the revival episode in which a woman with a remarkable
  voice, held back by family duty, is given a glimpse of the opera career she could have had. Migenes began on Broadway
  as a child and was the original Hodel in Fiddler on the Roof (1964), then sang in European opera houses and starred
  as Carmen in Francesco Rosi's 1984 film of Bizet's opera.

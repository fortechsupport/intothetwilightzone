born: '1945-08-16'
bio: >-
  Bob Balaban directed two episodes of the 2002 Twilight Zone revival, "Future Trade" and "The Pharaoh's Curse."
  His earlier directing included the cult horror comedy Parents (1989). As an actor he is known for Close Encounters
  of the Third Kind, Midnight Cowboy, Seinfeld and the Christopher Guest ensemble comedies such as Best in Show.
  He produced and appeared in Gosford Park, which earned him a Best Picture Academy Award nomination.

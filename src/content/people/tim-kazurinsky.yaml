bio: >-
  Tim Kazurinsky is a regular voice in the Twilight Zone Radio Dramas, with roles in adaptations of "Time Enough
  at Last," "The Living Doll," "The Rip Van Winkle Caper," "Mr. Dingle, the Strong," "Mrs. Pierce Is Praying for
  Me" and "There Goes the Neighborhood." A Second City alumnus, he was a Saturday Night Live cast member from 1981
  to 1984 and played Sweetchuck in the Police Academy films.

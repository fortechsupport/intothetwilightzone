bio: >-
  Paul Chitlik was one of the principal writers of the 1985 revival's syndicated, Toronto-produced final season,
  credited, often with Jeremy Bertrand Finch, on "Room 2426," "The Trunk," "Aqua Vita," "Father and Son Game," "Stranger
  in Possum Meadows" and "The Hunters." He later wrote for television animation and live- action series and became
  a screenwriting teacher, author of the guide Rewrite.

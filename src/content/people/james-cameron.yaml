born: '1954-08-16'
bio: >-
  James Cameron directed Terminator 2: Judgment Day (1991), whose shape-shifting T-1000, cycling through stolen
  faces in its death throes, has been read as a nod to the Twilight Zone tradition of borrowed and changing faces.
  He wrote and directed The Terminator, Aliens, The Abyss, Titanic and the Avatar films, and won three Academy Awards
  for Titanic.

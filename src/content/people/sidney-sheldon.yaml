born: '1917-02-11'
died: '2007-01-30'
bio: >-
  Sidney Sheldon wrote "Need to Know" (1986), a revival episode about an outbreak of madness in a North Carolina
  town that spreads with a secret. He won an Academy Award for The Bachelor and the Bobby-Soxer (1947), created
  The Patty Duke Show, I Dream of Jeannie and Hart to Hart for television, and then became one of the best-selling
  novelists in the world with books such as The Other Side of Midnight.

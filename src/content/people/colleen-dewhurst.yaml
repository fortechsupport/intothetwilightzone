name: Colleen Dewhurst
roles:
- actor
born: '1924-06-03'
died: '1991-08-22'
bio: >-
  Colleen Dewhurst starred in "There Was an Old Woman" (1988), a third-season revival episode about an elderly woman
  who takes in a homeless boy. One of the great American stage actresses, particularly in Eugene O'Neill, she won
  two Tony Awards and four Emmys, including for Murphy Brown, and played Marilla Cuthbert in the Anne of Green Gables
  films.

bio: >-
  Charles Bronson was a former coal miner who rose through Westerns and war films such as The Magnificent
  Seven and The Great Escape to become a global action star with Death Wish. He co-starred with Elizabeth
  Montgomery in the nearly dialogue-free "Two", as an enemy soldier who meets a woman from the opposing
  side in a deserted post-war town.

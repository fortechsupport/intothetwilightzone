born: '1925-02-26'
died: '2019-04-29'
bio: >-
  John Llewellyn Moxey directed The Night Stalker (1972), the record-setting ABC television film written by Richard
  Matheson that introduced reporter Carl Kolchak. Born in Argentina and trained in British film, he directed the
  horror film City of the Dead (1960) and then dozens of American television films and series episodes.

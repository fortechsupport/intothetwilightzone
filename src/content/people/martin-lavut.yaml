born: '1934-12-18'
died: '2016-01-26'
bio: >-
  Martin Lavut was a Montreal-born Canadian filmmaker who directed "The Cold Equations" in the Toronto-made
  third season of the 1980s revival. He wrote and directed television dramas such as War Brides and Charlie
  Grant's War, made documentaries including Remembering Arthur, about Arthur Lipsett, and voiced characters in
  early Nelvana animation such as Rock and Rule.

bio: >-
  D. J. MacHale wrote and directed Tower of Terror (1997), the Disney television film built on the Twilight Zone
  Tower of Terror theme-park ride, starring Steve Guttenberg and Kirsten Dunst. He co- created Nickelodeon's anthology
  Are You Afraid of the Dark? and wrote the Pendragon fantasy novels.

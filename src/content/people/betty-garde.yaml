name: Betty Garde
roles:
- actor
born: '1905-09-19'
died: '1989-12-25'
bio: >-
  Betty Garde played Mrs. Bronson, the landlady who stays behind with artist Norma (Lois Nettleton) as the Earth
  falls toward the sun, in "The Midnight Sun" (1961). A radio and Broadway veteran, she created the role of Aunt
  Eller in the original production of Oklahoma! and appeared in Call Northside 777.

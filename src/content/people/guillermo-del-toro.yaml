bio: >-
  Guillermo del Toro created and hosted Guillermo del Toro's Cabinet of Curiosities (Netflix, 2022), a horror anthology
  he framed as a love letter to Rod Serling's Night Gallery. He introduces each story on camera, in the tradition
  of Serling's gallery tours. The Mexican filmmaker won Academy Awards for directing The Shape of Water (2017) and
  for the animated Pinocchio (2022), and his films include Cronos, The Devil's Backbone and Pan's Labyrinth.

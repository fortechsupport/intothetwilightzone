bio: >-
  David White played Brinkley, one of the film crew in the movie-set world that Howard Duff's businessman discovers
  he is living in, in "A World of Difference" (1960). He is best remembered as the ad-agency boss Larry Tate on
  Bewitched and also appeared in Sweet Smell of Success and The Apartment.

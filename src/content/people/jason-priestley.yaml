bio: >-
  Jason Priestley appeared as himself in "Blurryman," the 2019 first-season finale of the Jordan Peele revival,
  an episode set behind the scenes of The Twilight Zone itself. The Canadian actor became a teen idol as Brandon
  Walsh on Beverly Hills, 90210, and later directed television and starred in Call Me Fitz and Private Eyes.

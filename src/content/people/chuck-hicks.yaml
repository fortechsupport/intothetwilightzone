name: Chuck Hicks
roles:
- actor
- stunt performer
bio: >-
  Chuck Hicks played the robot boxer Maynard Flash, the opponent of Lee Marvin's disguised fighter, in Richard Matheson's
  "Steel" (1963), and also appeared in "Ninety Years Without Slumbering" (1963). A former boxer and long-time stuntman,
  he worked on The Untouchables, Star Trek and many westerns and action films.

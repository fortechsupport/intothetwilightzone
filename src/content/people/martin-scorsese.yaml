bio: >-
  Martin Scorsese directed After Hours (1985) and Shutter Island (2010), two films critics have grouped among movies
  with a Twilight Zone flavor of nightmare logic and unreliable perception. One of the most celebrated American
  directors, he made Taxi Driver, Raging Bull and Goodfellas and won the Academy Award for The Departed.

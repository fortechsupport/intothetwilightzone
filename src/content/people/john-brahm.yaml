born: '1893-08-17'
died: '1982-10-12'
bio: >-
  German émigré John Brahm directed twelve episodes of the original Twilight Zone, more than any other
  director, bringing the moody atmosphere of his 1940s Fox thrillers The Lodger and Hangover Square to
  television. His episodes include Time Enough at Last, Judgment Night, Mirror Image, Shadow Play and
  The Four of Us Are Dying. He also directed many episodes of Alfred Hitchcock Presents and Thriller.

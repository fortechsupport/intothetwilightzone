bio: >-
  Mike Mazurki guest-starred in "Pick Me Another Time to Die," an episode of Rod Serling's western The Loner. A
  former professional wrestler with a famously battered face, he played the hulking Moose Malloy in Murder, My Sweet
  (1944) and gangsters and heavies in films such as Night and the City and Some Like It Hot.

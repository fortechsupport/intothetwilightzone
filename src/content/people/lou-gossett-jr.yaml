born: '1936-05-27'
died: '2024-03-29'
bio: >-
  Lou Gossett Jr. starred in The Twilight Zone Radio Dramas, the full-cast audio series that remade the original
  episodes, including "Steel" and "Probe 7, Over and Out." He won an Emmy for Roots (1977) and became the first
  Black man to win the Academy Award for Best Supporting Actor, as the drill sergeant in An Officer and a Gentleman
  (1982). He also starred in Enemy Mine and the Iron Eagle films.

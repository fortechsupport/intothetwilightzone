born: '1920'
died: '1984'
bio: >-
  Richard Benedict directed "Pamela's Voice" (1971), the Night Gallery two-hander in which John Astin's murderer
  finds that his wife's nagging continues from the grave. As an actor he appeared in Billy Wilder's Ace in the Hole
  and as one of the crew in Ocean's 11 (1960), then became a busy television director in the 1960s and 1970s.

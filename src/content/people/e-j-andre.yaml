name: E. J. André
roles:
- actor
born: '1908-06-16'
died: '1984-09-06'
bio: >-
  E. J. André appeared in "The Little Black Bag" (1970), the Night Gallery adaptation of C. M. Kornbluth's story
  about a disgraced alcoholic doctor (Burgess Meredith) who finds a medical kit from the future. A character actor
  in films and television from the 1950s, he is best remembered as Eugene Bullock on Dallas.

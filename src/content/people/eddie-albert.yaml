name: Eddie Albert
born: '1906-04-22'
died: '2005-05-26'
roles:
- actor
bio: >-
  Eddie Albert starred in "Dream Me a Life," a 1988 episode of the revival's final season, as a bitter widower at
  a retirement home who is drawn to a new resident. He was nominated for the Academy Award for Roman Holiday and
  The Heartbreak Kid and starred as lawyer-turned-farmer Oliver Douglas on Green Acres. A decorated World War II
  veteran of the Battle of Tarawa, he was also an early environmental activist.

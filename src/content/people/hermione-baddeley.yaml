name: Hermione Baddeley
roles:
- actor
born: '1906-11-13'
died: '1986-08-19'
bio: >-
  Hermione Baddeley appeared in "A Feast of Blood" (1972), a Night Gallery segment about a woman given a sinister
  fur brooch by a rejected suitor. The English actress was nominated for an Academy Award for a few minutes on screen
  in Room at the Top (1959), played the maid Ellen in Mary Poppins, and was Mrs. Naugatuck on Maude.

name: Norman Fell
roles:
- actor
born: '1924-03-24'
died: '1998-12-14'
bio: >-
  Norman Fell appeared in "The Convict's Piano" (1986), a 1985 revival segment about a prisoner whose piano transports
  him into its former owners' lives. He is best remembered as the landlord Stanley Roper on Three's Company and
  its spinoff The Ropers, and in films such as The Graduate, Bullitt and Ocean's 11 (1960), which grew from a story
  by Twilight Zone writer George Clayton Johnson.

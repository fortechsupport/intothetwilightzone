bio: >-
  Gene Barry appeared in "Time and Teresa Golowitz" (1987), a 1985-revival episode about a dead songwriter who bargains
  with the Devil for one more chance at life. He starred in The War of the Worlds (1953) and the series Bat Masterson,
  Burke's Law and The Name of the Game.

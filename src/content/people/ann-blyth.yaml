bio: >-
  Ann Blyth played Pamela Morris, the ageless film star who keeps herself young by draining the life from her husbands,
  in "Queen of the Nile" (1964). She earned an Academy Award nomination at sixteen as Joan Crawford's scheming daughter
  Veda in Mildred Pierce and starred in musicals such as The Student Prince and Kismet. She died in 2026 at 98.

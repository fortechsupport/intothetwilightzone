born: '1901-07-28'
died: '1986-07-03'
bio: >-
  Rudy Vallée appeared with Robert Morse in "Marmalade Wine" (1971), the Night Gallery segment written and directed
  by Jerrold Freedman from Joan Aiken's story about a man who claims to see the future. One of the first crooners
  and radio stars of the 1920s and 1930s, he later won new fame as the company president J. B. Biggley in How to
  Succeed in Business Without Really Trying on stage and film.

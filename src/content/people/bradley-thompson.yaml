bio: >-
  Bradley Thompson co-wrote three episodes of the UPN revival of The Twilight Zone, "Harsh Mistress," "Fair Warning"
  and "Homecoming," most of them with his long-time partner David Weddle. Thompson and Weddle wrote for Star Trek:
  Deep Space Nine before the Twilight Zone revival and then became writer-producers on the reimagined Battlestar
  Galactica, CSI and The Strain.

bio: >-
  Sam Esmail wrote and directed Leave the World Behind (2023), adapted from Rumaan Alam's novel, about two families
  sharing a rental house as a mysterious collapse cuts them off from the outside world; reviewers compared its paranoid
  suburban dread to The Twilight Zone. Esmail created the hacker drama Mr. Robot, which won a Golden Globe and a
  Peabody, and the psychological thriller series Homecoming.

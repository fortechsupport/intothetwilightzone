bio: >-
  Eric Christmas appeared in "House - with Ghost" (1971), a Night Gallery comedy about a philanderer who buys an
  English country house in hopes its ghost will scare off his wife. The English-born character actor was the priest
  in Harold and Maude and appeared in the Porky's films.

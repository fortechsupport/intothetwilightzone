name: Franchot Tone
roles:
- actor
born: '1905-02-27'
died: '1968-09-18'
bio: >-
  Franchot Tone played Colonel Archie Taylor, the club member who bets a compulsive talker $500,000 that he cannot
  stay silent for a year, in Rod Serling's "The Silence" (1961). A Group Theatre stage actor who became an MGM leading
  man, he was nominated for the Academy Award for Mutiny on the Bounty (1935) and was married to Joan Crawford.

name: James Whitmore
roles:
- actor
born: '1921-10-01'
died: '2009-02-06'
bio: >-
  James Whitmore played Captain William Benteen, the leader of a stranded colony who cannot give up his power, in
  Rod Serling's "On Thursday We Leave for Home" (1963), and guest-starred in the two-part "The Mourners for Johnny
  Sharp" on Serling's The Loner. Oscar-nominated for Battleground and Give 'em Hell, Harry!, he is also remembered
  as Brooks Hatlen in The Shawshank Redemption.

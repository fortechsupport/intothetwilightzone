name: Anne Washburn
roles:
- writer
bio: >-
  Anne Washburn wrote the stage adaptation The Twilight Zone, which premiered at London's Almeida Theatre in December
  2017 under director Richard Jones and transferred to the West End in 2019, interweaving stories by Rod Serling,
  Charles Beaumont and Richard Matheson into one evening. An American playwright, she is best known for Mr. Burns,
  a Post-Electric Play, in which survivors of a collapse retell an episode of The Simpsons.

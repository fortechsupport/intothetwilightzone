bio: >-
  Paul Groesse was an MGM art director credited on the original Twilight Zone during its hour-long fourth season
  in 1963. One of the studio's longest-serving designers, he won Academy Awards for the art direction of Pride and
  Prejudice (1940), The Yearling (1946) and Little Women (1949). His short spell on the series is one of many examples
  of MGM's feature-film staff being assigned to the show.

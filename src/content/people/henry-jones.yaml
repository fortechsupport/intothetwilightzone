name: Henry Jones
born: '1912-08-01'
died: '1999-05-17'
roles:
- actor
bio: >-
  Henry Jones played J. Hardy Hempstead, the guardian angel who briefly gives Orson Bean's misfit a conventional
  life, in "Mr. Bevis," and later appeared in the Night Gallery segment "You Can't Get Help Like That Anymore."
  He won a Tony Award for Sunrise at Campobello. On screen he is remembered as the coroner in Vertigo and appeared
  in The Bad Seed and Butch Cassidy and the Sundance Kid; on television he was a regular on Phyllis and Mrs. Columbo.

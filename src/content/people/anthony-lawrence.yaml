bio: >-
  Anthony Lawrence wrote "Song of the Younger World," a 1987 segment of the 1980s Twilight Zone revival, and was
  the creator and principal writer of ABC's psychic-investigator series The Sixth Sense (1972), whose episodes were
  later cut down and folded into the syndicated Night Gallery package with Rod Serling introductions. A prolific
  television writer from the 1950s on, he also co-wrote the Elvis Presley musicals Roustabout and Paradise, Hawaiian
  Style and the 1979 television biopic Elvis. He died in early 2024.

bio: >-
  Barry Nelson starred in "Stopover in a Quiet Town" (1964), as one of a young couple who wake up in a strange,
  empty town after a party. He was the first actor to play James Bond, in a 1954 live TV version of Casino Royale,
  and appeared in The Shining as hotel manager Stuart Ullman.

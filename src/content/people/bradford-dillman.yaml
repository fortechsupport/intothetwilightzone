name: Bradford Dillman
roles:
- actor
born: '1930-04-14'
died: '2018-01-16'
bio: >-
  Bradford Dillman played the reclusive painter Richard Pickman in Night Gallery's adaptation of H. P. Lovecraft's
  "Pickman's Model" (1971). He shared the Cannes best-actor award for Compulsion (1959) and worked prolifically
  in film and television, from Escape from the Planet of the Apes to Piranha.

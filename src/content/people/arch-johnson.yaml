name: Arch Johnson
born: '1922-03-14'
died: '1997-10-09'
roles:
- actor
bio: >-
  Arch Johnson played the real Jesse James, who shows up to put a cowardly TV-western star in his place, in Serling's
  comedy "Showdown with Rance McGrew." A burly character actor, he created the role of Lieutenant Schrank in the
  original Broadway production of West Side Story. On screen he appeared in Somebody Up There Likes Me and G.I.
  Blues, and he was a regular on the sitcom Camp Runamuck.

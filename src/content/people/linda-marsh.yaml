name: Linda Marsh
roles:
- actor
born: '1939-02-08'
bio: >-
  Linda Marsh played Pamela, the strange young woman who draws a psychiatrist to a mysterious farmhouse, in Night
  Gallery's "The Phantom Farmhouse" (1971), adapted from Seabury Quinn's werewolf story. She made her film debut
  in Elia Kazan's America America (1963) and worked in theatre and television, later becoming a writer and story
  editor.

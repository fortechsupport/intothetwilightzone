bio: >-
  Barry Sullivan played the surgeon who performs the eye transplant on Joan Crawford's blind millionaire in "Eyes,"
  the Steven Spielberg-directed segment of the 1969 Night Gallery pilot film. He returned for Serling's season-three
  segment "Finnegan's Flight," and guest-starred in "The Oath" on Serling's western series The Loner. A Broadway-trained
  leading man, he worked in films such as The Bad and the Beautiful, Tension and Planet of the Vampires. On television
  he starred as Pat Garrett in The Tall Man and appeared in Rich Man, Poor Man.

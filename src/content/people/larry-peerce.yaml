bio: >-
  Larry Peerce directed "The Burden of the Badge" (1966), an episode of Rod Serling's western The Loner. He went
  on to direct One Potato, Two Potato, The Incident, Goodbye, Columbus and The Other Side of the Mountain; he is
  the son of opera tenor Jan Peerce.

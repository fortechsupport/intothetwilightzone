bio: >-
  Betty Lou Gerson appeared in "Ring-a-Ding Girl" (1963), the fifth-season story of a film star who returns to her
  hometown on the day of a disaster. A radio actress, she is best remembered as the voice of Cruella de Vil in Disney's
  One Hundred and One Dalmatians and the narrator of Cinderella.

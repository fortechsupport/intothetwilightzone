bio: >-
  James Whitmore Jr. played state trooper Dennis Wells in "Nightcrawlers" (1985), William Friedkin's segment of
  the revival, and the lawyer Ira in the 1987 segment "The Girl I Married." The son of actor James Whitmore, he
  acted in Baa Baa Black Sheep and other series before becoming a prolific television director on shows including
  Quantum Leap, The X-Files and NCIS.

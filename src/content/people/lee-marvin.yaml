bio: >-
  Lee Marvin was a WWII Marine veteran who became Hollywood's definitive tough guy, winning the Best Actor
  Oscar for Cat Ballou and starring in M Squad on TV. He made two memorable Twilight Zone appearances:
  a bounty hunter dared to visit an outlaw's grave in "The Grave" and a former boxer who climbs into the
  ring against a robot in "Steel".

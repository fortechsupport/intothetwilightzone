name: Douglas Emerson
born: '1974'
roles:
- actor
bio: >-
  Douglas Emerson was one of the two young brothers who sneak into a sinister research facility in "The Elevator,"
  a 1986 revival segment based on a Ray Bradbury story. As a teenager he played Scott Scanlon, Brandon Walsh's ill-fated
  friend, in the first season of Beverly Hills, 90210, and appeared in films including The Blob (1988).

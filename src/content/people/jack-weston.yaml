name: Jack Weston
roles:
- actor
born: '1924-08-21'
died: '1996-05-03'
bio: >-
  Jack Weston played Charlie Farnsworth, the jittery neighbor who fires the first fatal shot, in "The Monsters Are
  Due on Maple Street" (1960), and Julius Moomer, the hack writer who conjures William Shakespeare to write a TV
  script, in "The Bard" (1963). His film work included Wait Until Dark, The Thomas Crown Affair and The Ritz, and
  he earned a Tony nomination for Neil Simon's The Floating Light Bulb.

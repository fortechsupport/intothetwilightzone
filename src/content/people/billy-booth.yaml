name: Billy Booth
born: '1949'
roles:
- actor
bio: >-
  Billy Booth appeared as a boy in "A Stop at Willoughby," the first-season episode in which Gart Williams's burned-out
  advertising man keeps dreaming of an 1888 village where life is slow and kind. As a child actor he was best known
  as Tommy Anderson, Dennis's best friend, on the sitcom Dennis the Menace (1959-1963).

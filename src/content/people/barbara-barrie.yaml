born: '1931-05-23'
bio: >-
  Barbara Barrie played Myra, the sister who keeps trying to set up her brother Charley (Robert Duvall) with dates
  while he falls for a doll, in "Miniature" (1963). A stage actress from Chicago, she earned a Tony nomination for
  the original production of Company (1970). She received an Academy Award nomination for Breaking Away (1979),
  and on television she played Barney's wife Elizabeth on Barney Miller.

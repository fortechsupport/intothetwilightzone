name: Lorraine Gary
roles:
- actor
born: '1937-08-16'
bio: >-
  Lorraine Gary starred in "She'll Be Company for You" (1972), the third-season Night Gallery segment from Andrew
  Benedict's story about a widower and his late wife's sinister cat. She is best known as Ellen Brody in Jaws and
  its sequels and was married to Universal president Sid Sheinberg.

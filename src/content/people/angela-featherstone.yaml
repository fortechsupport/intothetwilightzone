born: '1965-04-03'
bio: >-
  Angela Featherstone is a Canadian actress, writer and curator from Hamilton, Ontario, who began as a fashion
  model. She played Kate Graham in the 2002 revival episode "Burned". She is known for Linda in The Wedding
  Singer, Chloe on Friends and the title role in the Seinfeld episode "The Maid", and later appeared on Girls
  and Ray Donovan.

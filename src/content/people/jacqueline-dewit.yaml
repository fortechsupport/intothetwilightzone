bio: >-
  Jacqueline deWit played Helen Bemis, the cruel wife who mocks Burgess Meredith's book-loving Henry Bemis and scrawls
  over the pages of his poetry book, in "Time Enough at Last" (1959). A Los Angeles-born character actress, she
  appeared in films including The Snake Pit (1948), All That Heaven Allows (1955) and Tea and Sympathy (1956). On
  radio she played Ruth Thompson on Meet Mr. McNulty, and on television she appeared as Mike Nesmith's aunt in The
  Monkees.

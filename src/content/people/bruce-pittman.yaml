bio: >-
  Bruce Pittman directed "Our Selena Is Dying" (1988), the third-season revival episode adapted from an unproduced
  Rod Serling teleplay about an old woman who drains the youth of her granddaughter. A Canadian director, he made
  the horror sequel Hello Mary Lou: Prom Night II (1987) and directed much Canadian television.

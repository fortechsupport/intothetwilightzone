born: '1917-10-03'
died: '2005-03-25'
bio: >-
  Perry Lafferty directed three of the hour-long fourth-season episodes in 1963: "In His Image," "The Thirty-Fathom
  Grave" and "Valley of the Shadow." A director and producer of live television in New York, he moved into network
  management and became CBS's West Coast head of programs in the late 1960s and 1970s, overseeing shows such as
  All in the Family and M*A*S*H, and later ran NBC's West Coast operations.

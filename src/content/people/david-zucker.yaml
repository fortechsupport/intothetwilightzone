born: '1947-10-16'
bio: >-
  David Zucker directed The Naked Gun 2½: The Smell of Fear (1991), which includes a gag spoofing the famous "To
  Serve Man" cookbook reveal. With his brother Jerry Zucker and Jim Abrahams he created Kentucky Fried Movie, Airplane!
  and the Police Squad! series behind the Naked Gun films, a style of deadpan parody that often borrowed from classic
  television.

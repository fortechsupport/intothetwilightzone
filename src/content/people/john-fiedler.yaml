born: '1925-02-03'
died: '2005-06-25'
bio: >-
  John Fiedler played the department-store manager Mr. Dundee, who fires Art Carney's drunken Santa, in "The Night
  of the Meek" (1960), and appeared in "Cavender Is Coming" (1962). He was Juror No. 2 in 12 Angry Men, the meek
  patient Mr. Peterson on The Bob Newhart Show, and the voice of Piglet in Disney's Winnie the Pooh films for nearly
  four decades.

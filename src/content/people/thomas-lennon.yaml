bio: >-
  Thomas Lennon appeared in "Ovation," a 2020 episode of the Jordan Peele revival about the cost of sudden celebrity.
  He was a member of the sketch troupe The State and co-created Reno 911!, in which he played Lieutenant Jim Dangle.
  With Robert Ben Garant he co-wrote the Night at the Museum films, and he played Felix in The Odd Couple revival
  on CBS.

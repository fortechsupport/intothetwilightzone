bio: >-
  Donna Douglas is best known as Elly May Clampett on The Beverly Hillbillies, and later became a gospel
  singer and author. Her face is the famous reveal of "Eye of the Beholder", where she played the 'disfigured'
  Janet Tyler under bandages, and she also appeared in "Cavender Is Coming".

name: Jean de Segonzac
roles:
- director
- cinematographer
bio: >-
  Jean de Segonzac directed two episodes of the 2002 UPN Twilight Zone revival, "Cradle of Darkness," in which a
  time traveler goes back to kill the infant Adolf Hitler, and "Night Route." He first made his name as the cinematographer
  who gave Homicide: Life on the Street its restless hand-held look, then became a prolific television director
  on the Law & Order franchise, Battlestar Galactica and many other dramas.

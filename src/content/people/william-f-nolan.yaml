bio: >-
  William F. Nolan wrote two of the three segments of Trilogy of Terror (1975), the Dan Curtis TV anthology starring
  Karen Black, adapting Richard Matheson's stories, while Matheson himself scripted the famous Zuni fetish doll
  segment "Amelia." A member of the Southern California writing circle around Charles Beaumont, Ray Bradbury and
  Matheson, he co-wrote the novel Logan's Run (1967) with George Clayton Johnson and co-wrote the screenplay for
  Burnt Offerings. He received lifetime achievement awards from the Horror Writers Association and the World Horror
  Convention.

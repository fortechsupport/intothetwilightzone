bio: >-
  German-born Hollywood composer Franz Waxman contributed music to three Twilight Zone episodes: The Sixteen-Millimeter
  Shrine in the first season, and He's Alive and The Self-Improvement of Salvadore Ross later in the run.
  By then he was a two-time Oscar winner, for Sunset Boulevard and A Place in the Sun, with scores such
  as Bride of Frankenstein and Rebecca behind him.

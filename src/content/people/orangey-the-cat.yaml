name: Orangey the Cat
roles:
- animal actor
bio: >-
  Orangey was the marmalade tabby cat actor whom fan and animal-film sources identify in "The Night of the Meek"
  (1960), Rod Serling's Christmas episode with Art Carney. Trained by Frank Inn, Orangey (or cats billed under the
  name) starred in Rhubarb (1951) and played Cat in Breakfast at Tiffany's (1961), and is the only cat to win two
  PATSY Awards, the animal equivalent of the Oscars.

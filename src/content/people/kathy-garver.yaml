bio: >-
  Kathy Garver voiced parts in The Twilight Zone Radio Dramas remakes of "The Invaders," "The Fever," "The Long
  Morrow" and "The Sixteen-Millimeter Shrine," opposite stars such as Stacy Keach. She is best remembered as teenage
  Cissy Davis on the CBS sitcom Family Affair (1966-1971). She went on to a long career in voice work for animation
  and audiobooks, including many audio dramas. She has also written books on the Family Affair years and on classic
  television.

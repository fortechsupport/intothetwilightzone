born: '1946-02-26'
died: '2020-12-08'
bio: >-
  Phyllis Eisenstein wrote the short story "Lost and Found," which became a 1986 segment of the 1985 revival in
  which a college student finds her lost belongings are being taken by time travelers. A science-fiction and fantasy
  author, she is known for the Book of Elementals and for the minstrel novels Born to Exile and In the Red Lord's
  Reach, and she taught writing at Columbia College Chicago.

bio: >-
  Kelly Asbury directed the animated musical UglyDolls (2019), whose identical "Perfect" dolls carry the model number
  12, a nod to the conformity-of-beauty episode "Number 12 Looks Just Like You." He was nominated for an Academy
  Award as co-director of Shrek 2 and also co-directed Spirit: Stallion of the Cimarron and directed Gnomeo & Juliet
  and Smurfs: The Lost Village.

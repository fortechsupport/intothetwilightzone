name: Cosmo Jarvis
roles:
- actor
born: '1989-09-01'
bio: >-
  Cosmo Jarvis was a member of the original ensemble of Anne Washburn's The Twilight Zone at London's Almeida Theatre
  (2017-18), a stage adaptation that interweaves several original series stories. He later starred in Lady Macbeth,
  Calm with Horses and Shogun (2024), as the English navigator John Blackthorne.

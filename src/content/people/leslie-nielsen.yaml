bio: >-
  Leslie Nielsen starred in two Night Gallery segments, "A Question of Fear," as a soldier of fortune who bets he
  can spend a night in a haunted house, and "Phantom of What Opera?," as the Phantom; he also guested on Serling's
  western The Loner. A Canadian-born dramatic lead of the 1950s and 60s (Forbidden Planet, The Poseidon Adventure),
  he reinvented himself as a deadpan comic in Airplane! and the Police Squad! and Naked Gun films.

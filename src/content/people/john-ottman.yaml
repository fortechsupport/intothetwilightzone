bio: >-
  John Ottman directed Urban Legends: Final Cut (2000), a slasher sequel set in a film school that includes a spoof
  of "Nightmare at 20,000 Feet." Best known as Bryan Singer's longtime editor and composer, he edited and scored
  The Usual Suspects and X2, and won the Academy Award for editing Bohemian Rhapsody.

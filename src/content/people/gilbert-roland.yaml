name: Gilbert Roland
roles:
- actor
born: '1905-12-11'
died: '1994-05-15'
bio: >-
  Gilbert Roland appeared in Rod Serling's Night Gallery segment "The Waiting Room" (1972), in which gunfighters
  gather in a saloon and slowly realize they are dead. The Mexican-born actor was a romantic lead of the silent
  era, played the Cisco Kid in a run of 1940s westerns, and gave notable performances in The Bad and the Beautiful
  and The Sea Hawk.

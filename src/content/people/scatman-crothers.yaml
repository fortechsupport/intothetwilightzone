bio: >-
  Scatman Crothers was a singer, musician and actor whose credits include The Shining, One Flew Over the
  Cuckoo's Nest and the sitcom Chico and the Man. In Steven Spielberg's 'Kick the Can' segment he plays
  the magical newcomer to a retirement home who lets the residents become children again.

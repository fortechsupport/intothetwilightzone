name: Cliff De Young
roles:
- actor
born: '1946-02-12'
bio: >-
  Cliff De Young starred in "The Road Less Traveled" (1986), George R. R. Martin's script for the 1985 revival,
  about a man who avoided the Vietnam draft and is haunted by visions of the self who went to war. He appeared in
  The Hunger, Harry and Tonto, Glory and Flashback, and played the lead in the TV film Sunshine (1973).

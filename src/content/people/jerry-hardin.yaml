bio: >-
  Jerry Hardin appeared in "Profile in Silver" (1986), the 1980s-revival segment in which a time-traveling historian
  intervenes in the Kennedy assassination. A prolific character actor, he is best known as the informant Deep Throat
  on The X-Files and appeared in Tightrope and The Firm.

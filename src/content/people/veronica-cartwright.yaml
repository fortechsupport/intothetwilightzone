name: Veronica Cartwright
born: '1949-04-20'
roles:
- actor
bio: >-
  Veronica Cartwright played Anne, one of the children cared for by a robot grandmother, in Ray Bradbury's "I Sing
  the Body Electric" (1962). A child actress who appeared in Hitchcock's The Birds, she went on to Invasion of the
  Body Snatchers (1978), Alien and The Witches of Eastwick; her sister is actress Angela Cartwright.

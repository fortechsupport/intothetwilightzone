bio: >-
  Jane Seymour became a Bond girl in Live and Let Die and later starred as Dr. Michaela Quinn on Dr. Quinn,
  Medicine Woman, winning an Emmy for Onassis: The Richest Man in the World. She voiced leading roles
  in two radio adaptations, "The Lateness of the Hour" and "The Fear," both opposite her then-husband
  James Keach.

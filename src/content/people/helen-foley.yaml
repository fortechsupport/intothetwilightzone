name: Helen Foley
roles:
- teacher
- collaborator
bio: >-
  Helen Foley was Rod Serling's English teacher at Binghamton Central High School, who encouraged his writing and
  public speaking. Serling paid tribute by naming characters after her: the schoolteacher in the 1960 episode "Nightmare
  as a Child" and the teacher played by Kathleen Quinlan in the "It's a Good Life" segment of Twilight Zone: The
  Movie (1983). Biographers cite her as one of the earliest people to recognize his talent.

bio: >-
  Barry Bostwick voiced roles in The Twilight Zone Radio Dramas versions of "On Thursday We Leave for Home" and
  "And When the Sky Was Opened." He is known as Brad Majors in The Rocky Horror Picture Show and as New York's Mayor
  Randall Winston on Spin City. On Broadway he created Danny Zuko in Grease and won a Tony Award for The Robber
  Bridegroom.

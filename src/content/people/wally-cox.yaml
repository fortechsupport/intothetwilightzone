bio: >-
  Wally Cox starred as James Elwood, a shy computer programmer whose romantic advice comes from a jealous computer,
  in "From Agnes – With Love" (1964), and later appeared in the Night Gallery segment "Junior" (1971). He starred
  as Mister Peepers on early television, voiced Underdog and was a regular on Hollywood Squares.

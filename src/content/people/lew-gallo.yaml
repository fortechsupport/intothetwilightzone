bio: >-
  Lew Gallo appeared in three original series episodes: "The Hitch-Hiker" (1960), "The Rip Van Winkle Caper" (1961),
  as one of the gold thieves who sleep for a century, and "On Thursday We Leave for Home" (1963), the hour-long
  story of a space colony's leader who cannot give up power. He later moved behind the camera as a television producer.

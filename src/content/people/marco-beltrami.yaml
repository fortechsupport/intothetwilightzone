bio: >-
  Film composer Marco Beltrami scored the 2019 revival with his frequent collaborator Brandon Roberts, while the
  main title continued to draw on Marius Constant's famous motif. Beltrami is best known for horror and action scores
  including the Scream films, The Hurt Locker and A Quiet Place.

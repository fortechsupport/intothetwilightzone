name: Aron Eli Coleite
roles:
- writer
- producer
bio: >-
  Aron Eli Coleite was one of the writers Warner Bros. hired, around 2014, during its long attempt to develop a
  new Twilight Zone feature film, a project that has passed through several directors and writers since 2011 without
  going into production. A television writer-producer, he worked on Heroes and later co-developed Netflix's Locke
  & Key.

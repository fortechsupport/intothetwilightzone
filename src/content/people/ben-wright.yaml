born: '1915-05-05'
died: '1989-07-02'
bio: >-
  Ben Wright played the doctor in "Deaths-Head Revisited" (1961), Rod Serling's episode in which a former SS captain
  returns to Dachau and is tried by the ghosts of his victims. The English actor worked prolifically in American
  radio and television and is best known as a Disney voice: Roger Radcliffe in One Hundred and One Dalmatians, Rama
  the wolf in The Jungle Book and Grimsby in The Little Mermaid.

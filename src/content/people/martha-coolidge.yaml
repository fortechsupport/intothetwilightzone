bio: >-
  Martha Coolidge directed three segments of the 1985 revival, Night of the Meek, Quarantine and Shelter
  Skelter, soon after her breakthrough with Valley Girl (1983). She went on to direct Real Genius and
  Rambling Rose and served as the first woman president of the Directors Guild of America.

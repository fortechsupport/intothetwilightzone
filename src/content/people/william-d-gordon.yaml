bio: >-
  William D. Gordon appeared in two second-season episodes: as George, the gangster who orders Joe Mantell's frightened
  Jackie Rhoades to commit a murder, in "Nervous Man in a Four Dollar Room" (1960), and as the doctor who removes
  Janet Tyler's bandages in "Eye of the Beholder" (1960), his face kept in shadow until the reveal. He later worked
  as a television writer and producer.

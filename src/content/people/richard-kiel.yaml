bio: >-
  Standing over seven feet tall, Richard Kiel became famous as the steel-toothed henchman Jaws in the
  James Bond films The Spy Who Loved Me and Moonraker. He played the towering Kanamit alien carrying the
  book whose title gives "To Serve Man" its infamous twist.

bio: >-
  Earl Holliman won a Golden Globe for The Rainmaker and later co-starred with Angie Dickinson on Police
  Woman. He holds the distinction of starring in the very first Twilight Zone episode broadcast, "Where
  Is Everybody?", as an amnesiac airman wandering a deserted town.

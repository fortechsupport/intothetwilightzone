name: Sheldon Larry
roles:
- director
bio: >-
  Sheldon Larry directed "A Matter of Minutes" (1986), the 1985 revival's adaptation of Theodore Sturgeon's "Yesterday
  Was Monday," in which a couple stumble into the crews who build each minute of time before it happens. A Canadian-born
  director, he worked mainly in television films and series from the 1970s on, and directed the feature Terminal
  Choice (1985).

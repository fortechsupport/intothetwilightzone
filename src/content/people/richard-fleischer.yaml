born: '1916-12-08'
died: '2006-03-25'
bio: >-
  Richard Fleischer directed Fantastic Voyage (1966), the 20th Century Fox film about a miniaturized crew sent through
  a human body, made from a story by Jerome Bixby, who wrote the story behind the Twilight Zone classic "It's a
  Good Life," and Otto Klement. The son of animator Max Fleischer, he directed 20,000 Leagues Under the Sea (1954),
  Compulsion, The Vikings, The Boston Strangler and Soylent Green (1973).

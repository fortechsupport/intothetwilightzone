bio: >-
  Walter Reed appeared in "Nick of Time" (1960), Richard Matheson's episode about a newlywed (William Shatner) who
  becomes obsessed with a fortune-telling machine in a small-town diner. A dependable supporting actor, he worked
  in John Ford westerns and dozens of 1950s films and TV series.

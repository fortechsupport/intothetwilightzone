bio: >-
  Rachel Roberts played one of four siblings in "Certain Shadows on the Wall," a first-season Night Gallery segment
  with Agnes Moorehead and Louis Hayward. The Welsh actress won BAFTA awards for Saturday Night and Sunday Morning
  and This Sporting Life, the second also earning her an Academy Award nomination. Her later work included Picnic
  at Hanging Rock, Murder on the Orient Express and Yanks. She was married to Rex Harrison.

born: '1973-11-03'
bio: >-
  Rapper and actor Sticky Fingaz appeared in "Harsh Mistress" (2002), an episode of the UPN Twilight Zone revival.
  A founding member of the hip-hop group Onyx, known for "Slam" (1993), he played the title role in Blade: The Series
  (2006) and acted in films such as Clockers and Next Friday.

bio: >-
  Randy Lofficier co-wrote Into the Twilight Zone: The Rod Serling Programme Guide (Virgin Publishing, 1995) with
  her husband Jean-Marc Lofficier. The book is a reference guide to the original series, the 1985 revival, the film
  and related works. The couple have written and translated many books together on film, television, comics and
  French popular fiction.

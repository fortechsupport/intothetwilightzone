born: '1952-08-19'
bio: >-
  Jonathan Frakes has a Twilight Zone credit on each side of the camera: he acted in "But Can She Type?" (1985),
  the revival comedy about a secretary who finds a world where secretaries are celebrities, and directed "The Lineman"
  (2002) for the UPN revival. He is best known as Commander William Riker on Star Trek: The Next Generation, and
  directed the feature films Star Trek: First Contact and Star Trek: Insurrection as well as many episodes of later
  Star Trek series.

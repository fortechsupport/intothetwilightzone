born: '1916-07-23'
died: '1999-07-20'
bio: >-
  Sandra Gould appeared in two original series comedies, "Cavender Is Coming" (1962), with Carol Burnett and Jesse
  White, and "What's in the Box" (1964), the story of a cab driver (William Demarest) whose TV shows him his own
  future. A radio performer of the 1940s, she is best known as the second Gladys Kravitz, the nosy neighbor on Bewitched.

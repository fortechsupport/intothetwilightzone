bio: >-
  Agnes Moorehead was a star of radio drama and Orson Welles's Mercury Theatre who earned four Oscar nominations
  and later played Endora on Bewitched. Her Twilight Zone showcase, "The Invaders", is almost entirely
  wordless: she plays a lone farm woman battling tiny intruders from a spacecraft, in a performance often
  ranked among the series' finest.

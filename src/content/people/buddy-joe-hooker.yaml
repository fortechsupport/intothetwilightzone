name: Buddy Joe Hooker
born: '1942'
roles:
- actor
- special effects
bio: >-
  Buddy Joe Hooker played one of the schoolboys in "The Changing of the Guard," the third-season episode in which
  Donald Pleasence's retired teacher is visited by the ghosts of former students. He became one of Hollywood's best-known
  stuntmen and stunt coordinators, with work on Hooper, To Live and Die in L.A. and many action films.

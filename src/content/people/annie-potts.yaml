name: Annie Potts
roles:
- actor
born: '1952-10-28'
bio: >-
  Annie Potts played the wife of a salesman (Robert Klein) whose world's words suddenly change meaning in "Wordplay"
  (1985), the first segment broadcast by the 1980s revival. She is known as Janine in Ghostbusters, Mary Jo on Designing
  Women, the voice of Bo Peep in Toy Story and Meemaw on Young Sheldon.

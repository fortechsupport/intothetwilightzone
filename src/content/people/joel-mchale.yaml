bio: >-
  Joel McHale starred in "8," a 2020 episode of the Jordan Peele revival in which an Arctic research team encounters
  a highly intelligent octopus. He hosted E!'s clip show The Soup for over a decade and starred as Jeff Winger on
  the sitcom Community.

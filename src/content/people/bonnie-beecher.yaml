born: '1941'
bio: >-
  Bonnie Beecher played Mary Rachel, the backwoods girl whose haunting ballad lures a rockabilly singer to his doom,
  in "Come Wander with Me" (1964); she sang the title song herself. A Minneapolis folk singer and early girlfriend
  of Bob Dylan, she later married the activist Wavy Gravy and co-founded the Seva Foundation.

bio: >-
  Martin Landau starred as master of disguise Rollin Hand on Mission: Impossible and won the Oscar for
  playing Bela Lugosi in Ed Wood. He played the saloon bully in the third Twilight Zone episode ever aired,
  "Mr. Denton on Doomsday", and a Soviet officer in a deadly cat-and-mouse game in "The Jeopardy Room",
  and returned in the 1985 revival segment "The Beacon".

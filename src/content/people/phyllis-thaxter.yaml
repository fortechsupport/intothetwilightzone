born: '1919-11-20'
died: '2012-08-14'
bio: >-
  Phyllis Thaxter played Virginia, the new bride who must compete with her husband's attachment to his dead mother
  and his childhood home, in Richard Matheson's "Young Man's Fancy" (1962). She appeared in Thirty Seconds Over
  Tokyo and The Sea of Grass and later played Martha Kent in Superman (1978).

bio: >-
  Julie Newmar is a dancer and actress who won a Tony for The Marriage-Go-Round and became iconic as Catwoman
  on the 1960s Batman. In "Of Late I Think of Cliffordville" she plays Miss Devlin, a horned, sly female
  Devil who sells a jaded tycoon a trip back to his youth.

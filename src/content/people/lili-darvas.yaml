bio: >-
  Lili Darvas played Grandma Bayles, the possessive grandmother who calls her grandson from beyond the grave through
  a toy telephone, in "Long Distance Call" (1961), another of the videotaped second-season episodes. Born in Budapest,
  she was a leading actress of the Hungarian stage and of Max Reinhardt's company in Vienna, and she was married
  to the playwright Ferenc Molnár. After emigrating to the United States she worked on Broadway and in television,
  and late in life she won international praise for the Hungarian film Szerelem (Love, 1971).

born: '1898-09-20'
died: '1964-01-26'
bio: >-
  Norman Z. McLeod directed "Once Upon a Time" (1961), the silent-comedy-style episode starring Buster Keaton as
  a janitor who time-travels from 1890 to 1962. One of Hollywood's leading comedy directors, he made the Marx Brothers'
  Monkey Business and Horse Feathers, Topper, and The Secret Life of Walter Mitty.

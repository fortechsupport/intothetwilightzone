name: Sonny Tufts
born: '1911-07-16'
died: '1970-06-04'
roles:
- actor
bio: >-
  Sonny Tufts guest-starred on Rod Serling's western The Loner in "The Ordeal of Bud Windom" (1965), one of his
  last roles. A Paramount leading man of the 1940s (So Proudly We Hail!), his career faded amid personal scandals,
  and his name became a running gag for 1950s comedians.

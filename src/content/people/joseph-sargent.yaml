bio: >-
  Joseph Sargent began as an actor and played a small part in the original-series episode "Twenty-Two." As a director
  he made The Man (1972), from Rod Serling's screenplay of Irving Wallace's novel about the first Black president
  of the United States. His best-known features are Colossus: The Forbin Project and The Taking of Pelham One Two
  Three. He won several Emmy Awards for directing television films, among them Love Is Never Silent and Miss Evers'
  Boys.

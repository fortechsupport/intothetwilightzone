bio: >-
  Robert Hewitt Wolfe wrote "Upgrade" (2002), an episode of the UPN revival. He was a key writer on Star Trek: Deep
  Space Nine, developed Gene Roddenberry's Andromeda as its first showrunner, and later wrote for The Dead Zone
  and Elementary.

bio: >-
  Trevor Bardette played Colonel Hawthorne, the retired army officer who once court-martialled Joseph Wiseman's
  Paul Radin and who refuses his bargain for a place in a fallout shelter, in "One More Pallbearer" (1962). A prolific
  character actor in westerns from the 1930s onward, he is best remembered as the outlaw patriarch Old Man Clanton
  on The Life and Legend of Wyatt Earp.

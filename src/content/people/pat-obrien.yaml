bio: >-
  Broadcaster Pat O'Brien voiced the talking self-help doll in "Mr. Motivation" (2002), a role that played on his
  familiar television voice. He spent years as a CBS Sports host and reporter before co-anchoring the entertainment
  news shows Access Hollywood and The Insider.

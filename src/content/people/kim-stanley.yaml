born: '1925-02-11'
died: '2001-08-20'
bio: >-
  Kim Stanley starred opposite Patrick O'Neal in "A Fear of Spiders" (1971), the Night Gallery segment in which
  a cruel food writer is visited by a giant spider. A legendary stage actress of the 1950s, she was Oscar-nominated
  for Séance on a Wet Afternoon and Frances and won an Emmy for Ben Casey.

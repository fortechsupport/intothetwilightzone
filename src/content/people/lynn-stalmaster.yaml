bio: >-
  Lynn Stalmaster is credited as a casting director on the original Twilight Zone, early in a career that made him
  one of the most influential casting directors in Hollywood. He went on to cast films such as West Side Story,
  In the Heat of the Night, The Graduate, Fiddler on the Roof and Superman, and he was known for championing new
  actors. In 2016 he became the first casting director to receive an honorary Academy Award. He died in 2021.

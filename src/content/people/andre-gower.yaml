bio: >-
  Andre Gower played Neal, the boy who with his aunt picks up a strange hitchhiker during a heat wave, in Ray Bradbury's
  "The Burning Man" (1985). He is best known as Sean, leader of The Monster Squad (1987), and as Wesley on Mr. Belvedere.

bio: >-
  Darlanne Fluegel played the mother who leaves her son alone with his monstrous grandmother in "Gramma" (1986),
  Harlan Ellison's adaptation of Stephen King's story for the 1985 revival. She appeared in Once Upon a Time in
  America, To Live and Die in L.A. and Running Scared, and on television in Crime Story.

born: '1932-11-13'
died: '2000-09-26'
bio: >-
  Richard Mulligan starred as Henry Corwin, the department-store Santa who finds a bag of endless gifts, in the
  1985 remake of Serling's "Night of the Meek," and as George, the father of a boy who can absorb anything he touches,
  in Rod Serling's posthumously adapted "The Toys of Caliban" (1986). He won Emmys for Soap and Empty Nest.

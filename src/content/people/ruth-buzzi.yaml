born: '1936-07-24'
died: '2025-05-01'
bio: >-
  Ruth Buzzi played one of the witches in "Witches' Feast" (1971), a comic Night Gallery vignette. She was a star
  of Rowan & Martin's Laugh-In, where her hairnetted spinster Gladys Ormphby earned her a Golden Globe, and was
  a long-time voice and Sesame Street performer.

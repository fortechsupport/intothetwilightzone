bio: >-
  Dennis Patrick appeared in "The Girl I Married" (1987), a late 1985 revival segment about a couple who each long
  for the person the other used to be. He played Jason McGuire and Paul Stoddard on Dark Shadows, Vaughn Leland
  on Dallas, and the father in the film Joe (1970).

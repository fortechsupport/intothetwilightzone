born: '1962'
bio: >-
  Nicholas Turturro appeared in "Chosen" (2002), an episode of the UPN Twilight Zone revival hosted by Forest Whitaker.
  He is best known as Detective James Martinez on NYPD Blue (1993-2000), and later starred in Blue Bloods; he is
  the younger brother of actor John Turturro.

bio: >-
  Playwright and television writer Marco Ramirez was one of the three developers of the 2019 revival with
  Jordan Peele and Simon Kinberg, and he wrote Nightmare at 30,000 Feet, its updated riff on the classic
  Matheson episode. He was reported to be in line to run the show but the series ultimately had no formal
  showrunner. He had previously co-run the second season of Marvel's Daredevil and The Defenders for Netflix.

name: Michael Reaves
roles:
- writer
born: '1950'
died: '2023'
bio: >-
  Michael Reaves wrote two segments of the 1980s revival, "Nightsong" (1986) and "Street of Shadows" (1989). He
  was a central writer of 1990s animation, sharing an Emmy for Batman: The Animated Series and helping create Disney's
  Gargoyles, and wrote fantasy novels and several Star Wars books. He died in 2023 after living with Parkinson's
  disease.

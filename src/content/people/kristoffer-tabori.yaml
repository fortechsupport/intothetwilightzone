bio: >-
  Kristoffer Tabori starred in "Her Pilgrim Soul," one of the most admired segments of the 1985 revival, as Kevin
  Drayton, a scientist who forms a bond with a woman who appears in his hologram lab and ages a lifetime in weeks.
  The son of director Don Siegel and actress Viveca Lindfors, he acted widely in 1970s television and later directed
  episodic TV. He is also a prolific, award-winning audiobook narrator.

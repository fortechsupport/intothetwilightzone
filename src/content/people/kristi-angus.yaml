born: '1971-08-21'
bio: >-
  Kristi Angus is a Canadian actress and model from Kelowna, British Columbia, who played Holly Marshall in the
  2002 revival's remake "The Monsters Are on Maple Street". Her credits include Earth: Final Conflict, Jason X
  and Orphan Black. She later left acting to become a midwife.

bio: >-
  David R. Ellis directed the 2003 remake of "Eye of the Beholder" for UPN's Twilight Zone, retelling Serling's
  bandaged-face classic with Molly Sims. A former surfer and veteran stuntman and second-unit director, he moved
  into directing with Homeward Bound II. He then made Final Destination 2, Cellular, Snakes on a Plane and The Final
  Destination. He died in South Africa while preparing a film.

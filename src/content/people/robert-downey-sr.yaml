born: '1936-06-24'
died: '2021-07-07'
bio: >-
  Robert Downey Sr. directed three segments of the 1985 Twilight Zone revival, "Children's Zoo," "Teacher's Aide"
  and "Tooth and Consequences," and also turned up in front of the camera in "Wordplay," the show's premiere-night
  story about a man whose language goes haywire. An underground filmmaker of the 1960s, he made the advertising
  satire Putney Swope (1969), now held in the National Film Registry, along with Chafed Elbows, Pound and Greaser's
  Palace. He was the father of actor Robert Downey Jr., who appeared in several of his films, and he was the subject
  of the 2022 documentary Sr.

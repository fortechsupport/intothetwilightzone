bio: >-
  George Murdock appeared in "The Dummy" (1962), the story of a ventriloquist dominated by his dummy, and in "Escape
  Route," a segment of the 1969 Night Gallery pilot film. A familiar character actor, he played Lieutenant Scanlon
  on Barney Miller and the false God in Star Trek V.

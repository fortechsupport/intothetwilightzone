bio: >-
  James Broderick played one of the stranded colonists in "On Thursday We Leave for Home" (1963), Serling's hour-long
  episode about a leader who will not give up power. He starred as Doug Lawrence on the drama Family, appeared in
  Dog Day Afternoon, and was the father of Matthew Broderick.

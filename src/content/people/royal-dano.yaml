bio: >-
  Royal Dano appeared in "I'll Never Leave You – Ever" (1972), a Night Gallery segment set in a rural household
  where a wife seeks a witch's help against her husband. A lanky, gravel-voiced character actor, he worked in Johnny
  Guitar, The Red Badge of Courage and The Outlaw Josey Wales, and voiced the Audio- Animatronic Lincoln at Disneyland.

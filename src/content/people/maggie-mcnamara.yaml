name: Maggie McNamara
roles:
- actor
born: '1928-06-18'
died: '1978-02-18'
bio: >-
  Maggie McNamara played Bunny Blake, the film star who receives a ring that shows her a premonition of disaster
  in her hometown, in "Ring-a-Ding Girl" (1963), one of her last screen roles. She received an Academy Award nomination
  for Otto Preminger's The Moon Is Blue (1953) and starred in Three Coins in the Fountain.

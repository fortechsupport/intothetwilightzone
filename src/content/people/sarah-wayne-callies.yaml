bio: >-
  Sarah Wayne Callies voiced roles in The Twilight Zone Radio Dramas versions of "Ring-a-Ding Girl" and "Spur of
  the Moment." She is best known as Dr. Sara Tancredi on Prison Break and as Lori Grimes in the first seasons of
  The Walking Dead, and later starred in Colony.

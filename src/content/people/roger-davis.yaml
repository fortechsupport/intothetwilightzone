name: Roger Davis
born: '1939'
roles:
- actor
bio: >-
  Roger Davis appeared in "Spur of the Moment" (1964), Richard Matheson's late-series episode about a bride pursued
  by a mysterious horsewoman, and in the Night Gallery segment "You Can Come Up Now, Mrs. Millikan" (1972). He played
  several roles on Dark Shadows and replaced Pete Duel as Hannibal Heyes on Alias Smith and Jones, which he had
  narrated.

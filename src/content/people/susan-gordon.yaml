bio: >-
  Susan Gordon played Jenny, the lame little girl befriended by an old man with strange powers, in Charles Beaumont's
  "The Fugitive" (1962). The daughter of director Bert I. Gordon, she was a child actress in The Five Pennies and
  her father's Tormented and Attack of the Puppet People.

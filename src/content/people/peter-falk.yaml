bio: >-
  Peter Falk earned two Oscar nominations early in his career and then won multiple Emmys as the rumpled
  detective Columbo. In "The Mirror" he plays Ramos Clemente, a Castro-like revolutionary leader who seizes
  power and becomes consumed by paranoia over a mirror said to reveal his assassins.

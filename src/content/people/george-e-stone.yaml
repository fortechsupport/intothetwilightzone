name: George E. Stone
roles:
- actor
born: '1903-05-18'
died: '1967-05-26'
bio: >-
  George E. Stone played Professor Gilbert, the scientist whose time-travel helmet sends Buster Keaton's janitor
  from 1890 to 1962, in "Once Upon a Time" (1961). Born in Poland, he was a fixture of Warner Bros. gangster pictures,
  as Otero in Little Caesar (1931), and played the Runt in the Boston Blackie film series.

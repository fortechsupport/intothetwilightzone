name: Jack Albertson
roles:
- actor
born: '1907-06-16'
died: '1981-11-25'
bio: >-
  Jack Albertson played Jerry Harlowe, one of the neighbors who turn on the doctor with the only bomb shelter, in
  "The Shelter" (1961), and returned as the genie in "I Dream of Genie" (1963). He also acted in the Night Gallery
  segment "Dead Weight" (1972). A vaudeville and Broadway veteran, he won the Tony and then the Academy Award for
  The Subject Was Roses, and an Emmy for Chico and the Man, making him one of the few performers with the triple
  crown of acting. Family audiences know him as Grandpa Joe in Willy Wonka & the Chocolate Factory (1971).

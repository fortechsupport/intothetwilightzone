name: Allen Reisner
roles:
- director
bio: >-
  Allen Reisner directed The Time Element (1958), the Desilu Playhouse drama by Rod Serling that served as a forerunner
  of The Twilight Zone, and then the original series' third episode, "Mr. Denton on Doomsday" (1959). He later directed
  Night Gallery segments ("The Nature of the Enemy" and "Brenda") and an episode of Serling's western The Loner.
  He was a prolific television director from the live-drama era of the 1950s into the 1970s.

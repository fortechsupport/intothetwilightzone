name: Michael Learned
born: '1939-04-09'
roles:
- actor
bio: >-
  Michael Learned played Olivia Walton, the family's mother, on The Waltons (1972-1981), the series created by Twilight
  Zone writer Earl Hamner Jr. from his own Virginia childhood. She won three Emmy Awards for the role and a fourth
  for the medical drama Nurse. A stage-trained actress, she later appeared on General Hospital and in Walton reunion
  films.

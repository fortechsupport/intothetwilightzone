bio: >-
  Hungarian-born director Peter Medak, maker of the haunted-house film The Changeling (1980), directed
  seven segments of the 1985 revival, including Button, Button, Dead Woman's Shoes, Still Life and Grace
  Note. His later films include The Krays and Let Him Have It.

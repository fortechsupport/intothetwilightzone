born: '1955-07-02'
bio: >-
  Andrew Divoff appeared in "Red Snow" (1986), the 1980s revival's story of a KGB investigator who finds vampires
  in a remote Siberian town. A multilingual character actor often cast as villains, he played the Djinn in Wishmaster
  (1997) and its sequel and the Russian Mikhail Bakunin on Lost.

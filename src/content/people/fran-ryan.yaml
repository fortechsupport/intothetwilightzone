name: Fran Ryan
roles:
- actor
born: '1916-11-29'
died: '2000-01-15'
bio: >-
  Fran Ryan played one of the witches in Night Gallery's comic segment "Witches' Feast" (1971), a coven gathered
  around a cauldron to swap recipes. A familiar character actress, she was Doris Ziffel on Green Acres, Miss Hannah
  on Gunsmoke and later appeared in Days of Our Lives and Pale Rider.

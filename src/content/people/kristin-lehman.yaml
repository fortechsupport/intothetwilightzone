born: '1972-05-03'
bio: >-
  Kristin Lehman has appeared in two Twilight Zone revivals: "Dead Man's Eyes" (2002) on the UPN series and "Meet
  in the Middle" (2020) on the Jordan Peele series. The Canadian actress starred in Poltergeist: The Legacy, the
  Canadian crime drama Motive and the American remake of The Killing, and appeared in Altered Carbon.

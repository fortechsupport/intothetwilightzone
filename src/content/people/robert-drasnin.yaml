bio: >-
  Robert Drasnin was music supervisor of the 1985 Twilight Zone and wrote music for the series. He had scored television
  in the 1960s, including episodes of Mission: Impossible and The Man from U.N.C.L.E., and later headed music at
  CBS, the network that revived the show. He also recorded the exotica album Voodoo in 1959.

bio: >-
  Henry Silva appeared in "The Doll" (1971), the first-season Night Gallery segment in which a British colonel's
  niece receives a sinister doll from India. A lean, intense character actor usually cast as villains, he played
  Chunjin in The Manchurian Candidate and appeared in the original Ocean's 11 and Sharky's Machine.

bio: >-
  Deborah Nadoolman designed the costumes for John Landis's segment of Twilight Zone: The Movie (1983). She designed
  Indiana Jones's costume for Raiders of the Lost Ark and Michael Jackson's red jacket for Thriller, and was later
  nominated for an Academy Award for Coming to America. Married to Landis, she now works as Deborah Nadoolman Landis
  and is a costume historian.

bio: >-
  Jaime Pressly won an Emmy for her comic turn as Joy Turner on My Name Is Earl and later joined the cast
  of the CBS sitcom Mom. She played the title role in "Sensuous Cindy," a dark comedy about a fantasy
  woman who proves hard to escape.

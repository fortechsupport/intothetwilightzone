bio: >-
  Leon Belasco played Potts, the old man in the bar who gives Richard Erdman's bore McNulty a stopwatch that can
  stop time, in "A Kind of a Stopwatch" (1963). Born in the Russian Empire, he was a violinist and bandleader before
  becoming a Hollywood character actor. Over several decades he played a long line of excitable waiters, musicians
  and continental types in films and on television.

name: Gary Goddard
born: '1954'
roles:
- director
bio: >-
  Gary Goddard directed Masters of the Universe (1987), the Cannon Films live-action He-Man movie in which a bewildered
  Earth detective, caught in the final battle, says he feels as if he is in the Twilight Zone. Goddard is primarily
  a theme-park and attraction designer, founder of Landmark Entertainment, whose work includes The Amazing Adventures
  of Spider-Man and T2 3-D. Masters of the Universe was his only feature as director.

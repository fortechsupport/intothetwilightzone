bio: >-
  David Greene directed "A Piano in the House" (1962), Earl Hamner Jr.'s story of a cruel theatre critic who buys
  a player piano that reveals people's true natures. The English-born director later won Emmys for episodes of Rich
  Man, Poor Man and Roots and directed the film of Godspell (1973).

bio: >-
  Nancy Kyes appeared in "Little Boy Lost" (1985), a 1985-revival segment about a photographer torn between career
  and motherhood. Also billed as Nancy Loomis, she played Annie in John Carpenter's Halloween and appeared in his
  Assault on Precinct 13 and The Fog.

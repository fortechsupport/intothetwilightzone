bio: >-
  Robert Presnell Jr. wrote "The Chaser," the first-season episode adapted from John Collier's short story about
  a lovesick man who buys a love potion and learns what the old pharmacist really sells. He was a Hollywood screenwriter
  of 1950s and 1960s features and television. His father, Robert Presnell Sr., was also a screenwriter.

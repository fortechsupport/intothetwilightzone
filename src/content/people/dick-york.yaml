bio: >-
  Dick York was the original Darrin Stephens on Bewitched and appeared in films such as Inherit the Wind.
  He played a WWII officer who can foresee which soldiers will die in "The Purple Testament" and a bank
  clerk who suddenly reads minds in "A Penny for Your Thoughts".

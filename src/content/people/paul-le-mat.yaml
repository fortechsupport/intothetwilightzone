name: Paul Le Mat
roles:
- actor
born: '1945-09-22'
bio: >-
  Paul Le Mat starred in "Appointment on Route 17" (1988), a third-season revival episode about a heart transplant
  recipient drawn to the life of his donor. He played the hot-rodder John Milner in American Graffiti (1973), winning
  a Golden Globe for new star of the year, and starred in Melvin and Howard (1980).

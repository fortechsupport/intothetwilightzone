bio: >-
  Zack Stentz co-wrote "Cold Fusion" (2003), an episode of the UPN revival of The Twilight Zone, with his writing
  partner Ashley Edward Miller. The pair wrote for Andromeda and Fringe and shared screenplay credits on Thor (2011),
  X-Men: First Class and Agent Cody Banks.

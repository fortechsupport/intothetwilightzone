name: Victor Buono
roles:
- actor
born: '1938-02-03'
died: '1982-01-01'
bio: >-
  Victor Buono appeared in two short comic Night Gallery segments, "A Midnight Visit to the Neighborhood Blood Bank"
  (1971) and "Satisfaction Guaranteed" (1972). He was nominated for an Academy Award at twenty-four for What Ever
  Happened to Baby Jane? (1962), played King Tut on the Batman television series, and appeared in Hush... Hush,
  Sweet Charlotte and Beneath the Planet of the Apes.

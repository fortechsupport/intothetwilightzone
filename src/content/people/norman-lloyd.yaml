bio: >-
  Norman Lloyd appeared in "A Feast of Blood" (1972), a Night Gallery segment about a gift brooch that turns predatory.
  An original member of Orson Welles's Mercury Theatre, he played the saboteur who falls from the Statue of Liberty
  in Hitchcock's Saboteur, produced Alfred Hitchcock Presents, and played Dr. Auschlander on St. Elsewhere.

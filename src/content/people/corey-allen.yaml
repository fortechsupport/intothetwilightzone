bio: >-
  Corey Allen guest-starred on Rod Serling's western The Loner in "Escort for a Dead Man" (1965). As an actor he
  played the doomed gang leader Buzz in Rebel Without a Cause; he later became a television director, winning an
  Emmy for Hill Street Blues and directing the pilot of Star Trek: The Next Generation.

born: '1927-12-17'
died: '1974-12-21'
bio: >-
  Richard Long appeared in two original-series episodes: as David Gurney, who wakes to find no one remembers him,
  in "Person or Persons Unknown" (1962), and in multiple roles as the identical "beautiful" people of "Number 12
  Looks Just Like You" (1964). He starred as Jarrod Barkley on The Big Valley and in Nanny and the Professor.

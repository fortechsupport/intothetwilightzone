bio: >-
  William deVry appeared in "Dead Man's Eyes," an episode of the 2002 UPN Twilight Zone. The Canadian actor is known
  for soap-opera roles including Julian Jerome on General Hospital and Michael Bourne on Days of Our Lives. He has
  worked extensively in Canadian-shot film and television.

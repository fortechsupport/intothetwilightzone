bio: >-
  Ralph Bellamy was a Hollywood mainstay for six decades, from His Girl Friday to Rosemary's Baby and
  Trading Places, and won a Tony playing Franklin D. Roosevelt in Sunrise at Campobello. In the 1986 segment
  "Monsters!" he plays a friendly elderly boarder whom a horror-loving boy suspects is a vampire.

bio: >-
  Ike Barinholtz appeared in "Not All Men," a 2020 episode of the Jordan Peele revival in which a meteor shower
  appears to turn the men of a town violent. He was a cast member of MADtv and played the nurse Morgan Tookers on
  The Mindy Project. His films include Neighbors, Blockers and The Oath, which he also wrote and directed.

name: Betty Gabriel
roles:
- actor
bio: >-
  Betty Gabriel appeared in "Blurryman" (2019), the first-season finale of Jordan Peele's revival, in which Peele
  as host is folded into the story and Rod Serling himself appears through archive footage. She is best known for
  playing the housekeeper Georgina in Peele's Get Out (2017), and also appeared in Upgrade, Unfriended: Dark Web
  and The Purge: Election Year.

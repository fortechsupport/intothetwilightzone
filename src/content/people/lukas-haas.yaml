bio: >-
  Lukas Haas is one of the few actors to appear in two Twilight Zone revivals: as a boy in the 1985 episode "What
  Are Friends For?" and as an adult in the 2002 episode "Harsh Mistress." He broke through as the Amish boy in Witness
  (1985) and has since appeared in Mars Attacks!, Brick, Inception and First Man.

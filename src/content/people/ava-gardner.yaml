name: Ava Gardner
born: '1922-12-24'
died: '1990-01-25'
roles:
- actor
bio: >-
  Ava Gardner played Eleanor Holbrook, the former lover of a plotting general, in John Frankenheimer's Seven Days
  in May (1964), the political thriller Rod Serling adapted from the Fletcher Knebel and Charles W. Bailey II novel.
  One of MGM's great stars of the 1940s and 1950s, she was nominated for the Academy Award for Mogambo and starred
  in The Killers, Show Boat, The Barefoot Contessa and The Night of the Iguana. Her marriages to Mickey Rooney,
  Artie Shaw and Frank Sinatra kept her in the headlines.

bio: >-
  Ron Howard was a child star as Opie on The Andy Griffith Show and Richie Cunningham on Happy Days before
  becoming an Oscar-winning director with A Beautiful Mind. As a five-year-old billed as Ronny Howard,
  he appeared in the first-season classic "Walking Distance" as a boy in the hometown Martin Sloan revisits.

name: John McIntire
roles:
- actor
born: '1907-06-27'
died: '1991-01-30'
bio: >-
  John McIntire played the shabby professor who sells a lovesick man a potion, and then a far costlier "glove cleaner,"
  in "The Chaser" (1960), adapted from John Collier's story. A veteran of radio, he narrated and acted in Naked
  City and succeeded Ward Bond as wagonmaster Chris Hale on Wagon Train; his film roles include the sheriff in Psycho.

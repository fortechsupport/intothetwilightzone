name: Craig William Macneill
roles:
- director
bio: >-
  Craig William Macneill directed "The Blue Scorpion" (2019), a first-season episode of Jordan Peele's revival in
  which Chris O'Dowd plays an anthropology professor who becomes fixated on the gun his father used to kill himself.
  His feature work includes The Boy (2015) and Lizzie (2018), a retelling of the Lizzie Borden case with Chloë Sevigny
  and Kristen Stewart, and he directed episodes of the horror anthology Channel Zero.

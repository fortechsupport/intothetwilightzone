bio: >-
  Lewis Milestone directed Ocean's 11 (1960), the Rat Pack heist film built on a story by future Twilight Zone writer
  George Clayton Johnson and Jack Golden Russell. He won Academy Awards for directing Two Arabian Knights and All
  Quiet on the Western Front, and also made The Front Page and Of Mice and Men.

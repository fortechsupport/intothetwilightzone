name: Frederic Louis Fox
roles:
- writer
bio: >-
  Frederic Louis Fox supplied the story ideas behind two third-season episodes that Rod Serling scripted: "Showdown
  with Rance McGrew" (1962), about a vain TV cowboy confronted by the real Jesse James, and "Hocus- Pocus and Frisby"
  (1962), about a tall-tale-telling storekeeper kidnapped by aliens who believe his boasts. He was a television
  writer of the period, sometimes credited as Frederick Louis Fox.

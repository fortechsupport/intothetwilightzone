born: '1903-05-21'
died: '1986-04-05'
bio: >-
  Manly Wade Wellman wrote "The Valley Was Still," the story Rod Serling adapted as "Still Valley" (1961), in which
  a Confederate scout finds a Union army frozen by witchcraft and is offered a spellbook that could win the war.
  A prolific pulp and fantasy writer, Wellman is best known for his tales of John the Balladeer, the guitar-playing
  wanderer of Appalachian folklore horror, and won a World Fantasy Award for life achievement.

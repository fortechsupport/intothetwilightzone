died: '1994-07-06'
roles:
- actor
bio: >-
  Cameron Mitchell appeared in two Night Gallery segments, the second-season "Green Fingers," as a land developer
  up against Elsa Lanchester's devoted gardener, and Serling's third-season prison story "Finnegan's Flight." He
  created the role of Happy Loman in the original Broadway Death of a Salesman and repeated it in the 1951 film.
  He later played Buck Cannon on The High Chaparral and became a fixture of European and low- budget genre films.

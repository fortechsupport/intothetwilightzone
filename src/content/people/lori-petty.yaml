born: '1963-10-14'
bio: >-
  Lori Petty starred in "The Library" (1986), the 1985 revival segment in which a temporary librarian finds the
  books of a strange library hold the life stories of everyone alive and can be rewritten. She is known for Point
  Break, A League of Their Own and Tank Girl, and later played Lolly Whitehill on Orange Is the New Black.

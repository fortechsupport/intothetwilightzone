name: David Orrick McDearmon
roles:
- director
bio: >-
  David Orrick McDearmon directed three original-series episodes: "Execution" (1960), "A Thing About Machines" (1960)
  and "Back There" (1961). A television director of the live and early filmed era, he also worked on series such
  as Gilligan's Island. Little biographical detail about him is readily available.

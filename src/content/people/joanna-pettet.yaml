name: Joanna Pettet
roles:
- actor
born: '1942-11-16'
bio: >-
  Joanna Pettet was a recurring Night Gallery lead, starring in "The House" (first season), "Keep in Touch – We'll
  Think of Something," "The Caterpillar" opposite Laurence Harvey, and the title role of "The Girl with the Hungry
  Eyes." The London-born actress broke through in Sidney Lumet's The Group (1966) and played Mata Bond in the 1967
  Casino Royale, then worked steadily in American television through the 1970s and 1980s.

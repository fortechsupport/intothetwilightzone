born: '1922'
died: '2010'
bio: >-
  Former actor Lamont Johnson directed eight episodes in the original series' third and fourth seasons,
  including Nothing in the Dark with a young Robert Redford, the nostalgic Kick the Can, the claustrophobic
  Five Characters in Search of an Exit and the bomb-shelter drama The Shelter. He went on to a distinguished
  directing career, chiefly in television films, winning Emmys and earning acclaim for The Execution of
  Private Slovik.

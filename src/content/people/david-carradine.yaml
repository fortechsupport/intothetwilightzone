bio: >-
  David Carradine starred in "The Phantom Farmhouse," a second-season Night Gallery segment adapted from Seabury
  Quinn, as a psychiatrist drawn to a mysterious young woman who lives in a farmhouse near his sanitarium. He became
  famous as the Shaolin monk Kwai Chang Caine on Kung Fu (1972-1975). His films include Bound for Glory and Death
  Race 2000, and Quentin Tarantino revived his career as the title character of Kill Bill.

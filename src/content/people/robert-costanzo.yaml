bio: >-
  Robert Costanzo appeared in "Healer," a 1985 revival segment in which a petty thief steals an ancient stone with
  healing powers. A character actor in Saturday Night Fever, Die Hard 2 and City Slickers II, he is best known as
  the voice of Detective Harvey Bullock in Batman: The Animated Series and its successors.

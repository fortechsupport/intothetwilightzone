born: '1917-03-11'
died: '2003-11-30'
bio: >-
  Earl Bellamy directed "Echo of a Distant Scream" (1972), an episode of ABC's The Sixth Sense, a series later cut
  down for the syndicated Night Gallery package. A prolific television director, he worked on westerns such as Wagon
  Train and sitcoms including The Munsters and Leave It to Beaver.

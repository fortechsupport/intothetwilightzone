bio: >-
  Harold Gould played General Larrabee, the commander who tells the stranded astronaut Cook by radio that his world
  is ending, in "Probe 7, Over and Out" (1963). A former theatre professor with a doctorate, he became one of television's
  most familiar character actors. He played Rhoda's father Martin Morgenstern on The Mary Tyler Moore Show and Rhoda,
  the gangster Kid Twist in The Sting (1973), and Miles Webber, Rose's boyfriend, on The Golden Girls.

name: Ralph Senensky
roles:
- director
born: '1923-05-01'
died: '2025'
bio: >-
  Ralph Senensky directed "Printer's Devil," the fourth-season hour in which Burgess Meredith plays a devilish linotype
  operator, and on Night Gallery directed both segments of the 1972 episode "The Miracle at Camafeo" and "The Ghost
  of Sorworth Place." Over five decades in television he directed episodes of Star Trek ("Metamorphosis," "Is There
  in Truth No Beauty?"), The Waltons, The Partridge Family and the pilot of Dynasty. In retirement he wrote a long-running
  online memoir about his episodes, and he died in 2025 at the age of 102.

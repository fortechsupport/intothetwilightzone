bio: >-
  Christian Nyby, credited director of the 1951 science fiction classic The Thing from Another World and
  earlier the Oscar-nominated editor of Red River, directed two comic third-season Twilight Zone episodes:
  Showdown with Rance McGrew and Cavender Is Coming. He spent most of his later career directing television.

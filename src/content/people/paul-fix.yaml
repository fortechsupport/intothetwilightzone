name: Paul Fix
roles:
- actor
born: '1901-03-13'
died: '1983-10-14'
bio: >-
  Paul Fix appeared in Rod Serling's "I Am the Night—Color Me Black" (1964), set in a town where the sun fails to
  rise on the morning of an execution. A long-time member of John Wayne's stock company, he played Marshal Micah
  Torrance on The Rifleman and the judge in To Kill a Mockingbird.

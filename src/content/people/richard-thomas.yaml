name: Richard Thomas
born: '1951-06-13'
roles:
- actor
bio: >-
  Richard Thomas played John-Boy Walton in Earl Hamner Jr.'s The Homecoming: A Christmas Story (1971) and The Waltons,
  the series it launched, winning an Emmy in 1973; Hamner was one of the original Twilight Zone's key writers. Thomas
  also starred in "The Sins of the Fathers," a second-season Night Gallery segment about a Welsh boy forced to act
  as a sin-eater. He later played Bill Denbrough in the miniseries It (1990) and the FBI agent Frank Gaad on The
  Americans, and has a long Broadway career.

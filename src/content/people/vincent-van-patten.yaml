name: Vincent Van Patten
roles:
- actor
born: '1957-10-17'
bio: >-
  Vincent Van Patten appeared as a boy in "Big Surprise" (1971), the Night Gallery segment written by Richard Matheson
  in which an old man (John Carradine) tells three children to dig for a surprise in a field. The son of Dick Van
  Patten, he acted in Rock 'n' Roll High School, became a professional tennis player and later co- hosted the World
  Poker Tour on television.

name: Steve De Jarnatt
born: '1952'
roles:
- director
- writer
bio: >-
  Steve De Jarnatt wrote and directed Miracle Mile (1988), about a man who learns from a misdialed phone call that
  nuclear war will begin within the hour; his script circulated for years and was at one point considered for Twilight
  Zone: The Movie. He also directed Cherry 2000 and episodes of many television series, and later published fiction.

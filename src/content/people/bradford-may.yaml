bio: >-
  Bradford May directed three episodes of the 1985 Twilight Zone revival, "Gramma" (from Stephen King's story),
  "Nightsong" and "The Card." He started as a cinematographer and became a prolific director of television films
  and series, including Darkman II and Darkman III, Lois & Clark and Monk.

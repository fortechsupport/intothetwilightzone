bio: >-
  Robert F. Simon played Harvey, the colleague who runs the time machine and warns Dana Andrews's Paul Driscoll
  that he cannot change history, in "No Time Like the Past" (1963). He was a busy character actor in film and television
  for some four decades. His recurring roles included Darrin's father Frank Stephens on Bewitched, General Mitchell
  on M*A*S*H, and newspaper publisher J. Jonah Jameson in the 1970s live- action The Amazing Spider-Man.

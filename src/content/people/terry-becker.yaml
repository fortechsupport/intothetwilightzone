bio: >-
  Terry Becker played Jagger, the condemned man whose hanging in a hate-filled town coincides with a sun that never
  rises, in "I Am the Night - Color Me Black" (1964), Rod Serling's late-series parable about hatred. He is best
  known as Chief Francis Sharkey on Voyage to the Bottom of the Sea (1965-68). He later worked behind the camera
  as a director and producer.

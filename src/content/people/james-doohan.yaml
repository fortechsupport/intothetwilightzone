born: '1920-03-03'
died: '2005-07-20'
bio: >-
  James Doohan appeared in "Valley of the Shadow" (1963), the hour-long fourth-season episode about a town guarding
  advanced alien technology, three years before he became Montgomery "Scotty" Scott, the chief engineer of Star
  Trek. The Canadian actor, who was wounded on D-Day, played Scotty in the original series and seven feature films.

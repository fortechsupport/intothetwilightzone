bio: >-
  Jake Busey appeared in "Chosen," an episode of the 2002 UPN Twilight Zone. The son of actor Gary Busey, he is
  known for Starship Troopers, The Frighteners, Contact and Enemy of the State, and later for Stranger Things and
  The Predator.

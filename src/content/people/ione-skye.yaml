bio: >-
  Ione Skye appeared in "Night Route" (2002), an episode of the UPN revival of The Twilight Zone. She is known for
  River's Edge and for playing Diane Court opposite John Cusack in Say Anything... (1989). She is the daughter of
  the singer Donovan.

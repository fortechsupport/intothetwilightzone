name: Christy Marx
roles:
- writer
bio: >-
  Christy Marx wrote "Cat and Mouse," a segment of the 1985 revival's final season, about a woman whose lover is
  a cat transformed into a man. She created the animated series Jem and wrote for G.I. Joe, Teenage Mutant Ninja
  Turtles and Babylon 5, and has written comics and video games, including the Sierra adventure series Conquests.

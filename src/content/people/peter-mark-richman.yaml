bio: >-
  Peter Mark Richman starred as Trooper Robert Franklin, who investigates strange sightings with a nervous New York
  fashion editor, in "The Fear" (1964), a fifth-season two-hander, and decades later voiced parts in the Twilight
  Zone Radio Dramas "Uncle Simon" and "He's Alive." A Method-trained stage actor, he played the lawyer Andrew Laird
  on Dynasty and appeared in hundreds of television episodes, and was also a painter and playwright.

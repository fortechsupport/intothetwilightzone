bio: >-
  Bernard Girard directed "A Short Drink from a Certain Fountain" (1963), the fourth-season episode in which an
  old man takes a youth serum and regresses past his young wife's reach, and an episode of The Sixth Sense. A writer-director
  in films and television, he made the feature The Mad Room (1969).

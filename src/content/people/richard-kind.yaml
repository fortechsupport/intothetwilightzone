bio: >-
  Richard Kind is a busy comic character actor known for Mad About You and Spin City and for voice roles
  in A Bug's Life and Inside Out. He voiced the leads in the radio adaptations of "Will the Real Martian
  Please Stand Up" and "Sounds and Silences."

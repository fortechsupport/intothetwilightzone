bio: >-
  Robert L. Collins wrote and directed "Whisper of Evil," an episode of The Sixth Sense (1972), the Universal psychic-investigator
  series later folded into the syndicated Night Gallery package with new Rod Serling introductions. He is best known
  as the creator of the NBC series Police Woman (1974-78), starring Angie Dickinson. He also directed the television
  film Gideon's Trumpet (1980), with Henry Fonda, and the feature Walk Proud (1979). He is also credited as plain
  Robert Collins.

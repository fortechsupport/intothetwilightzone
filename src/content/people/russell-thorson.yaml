born: '1906-10-10'
died: '1982-07-06'
bio: >-
  Russell Thorson appeared in "Spectre in Tap-Shoes" (1972), a third-season Night Gallery hour about a woman haunted
  by her dead twin sister. A radio veteran of One Man's Family and I Love a Mystery, he later worked steadily as
  a character actor in film and television.

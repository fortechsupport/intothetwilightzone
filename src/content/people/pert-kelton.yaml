name: Pert Kelton
roles:
- actor
born: '1907-10-14'
died: '1968-10-30'
bio: >-
  Pert Kelton played Mrs. Grinstead, the worried mother of Robert Duvall's lonely clerk who falls for a figure in
  a museum dollhouse, in the hour-long "Miniature" (1963). She was the first Alice Kramden in The Honeymooners sketches
  on DuMont's Cavalcade of Stars before being blacklisted, and played Mrs. Paroo in The Music Man on Broadway and
  film.

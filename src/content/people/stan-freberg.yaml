bio: >-
  Stan Freberg was a pioneering radio satirist, voice actor and advertising man, known for comedy records
  such as "St. George and the Dragonet" and for his work with Warner Bros. cartoons and Time for Beany.
  His long radio career made him a natural for the Twilight Zone radio dramas, where he voiced the leads
  in "Four O'Clock," "The Masks" and several others.

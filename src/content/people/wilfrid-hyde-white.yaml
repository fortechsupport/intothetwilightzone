born: '1903-05-12'
died: '1991-05-06'
bio: >-
  Wilfrid Hyde-White played McKenzie, one of the elderly couples on the final voyage of an old liner, in Charles
  Beaumont's "Passage on the Lady Anne" (1963). The English character actor is best known as Colonel Pickering in
  My Fair Lady (1964), and also appeared in The Third Man and on Buck Rogers in the 25th Century.

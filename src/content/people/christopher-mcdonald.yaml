bio: >-
  Christopher McDonald is a familiar screen heavy, remembered as Shooter McGavin in Happy Gilmore and
  later as Marty Kaan on Hacks, which brought him an Emmy. He played a crooked boss in "Mr. Motivation"
  in the 2002 series and voiced lead roles in four Twilight Zone radio dramas, starting with "The Night
  of the Meek."

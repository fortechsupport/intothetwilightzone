bio: >-
  Robert Hamner wrote "The House That Cried Murder" for The Sixth Sense (1972), the ABC series about a parapsychologist
  whose episodes later went into syndication packaged with Night Gallery. A prolific television writer and producer,
  he co-created S.W.A.T. (1975) and wrote for Gunsmoke, Voyage to the Bottom of the Sea and many other series.

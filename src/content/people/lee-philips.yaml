bio: >-
  Lee Philips acted in two original-series episodes, as the husband trying to save his marriage aboard a strange
  ocean liner in "Passage on the Lady Anne" (1963) and as the columnist who learns the secret of an ageless movie
  star in "Queen of the Nile" (1964), and also guested on The Loner. After co-starring in the film Peyton Place,
  he became a television director whose credits include The Dick Van Dyke Show, The Andy Griffith Show and many
  TV films.

name: Ed Nelson
roles:
- actor
born: '1928-12-21'
died: '2014-08-09'
bio: >-
  Ed Nelson starred as Philip Redfield, a reporter who stumbles into a small town guarding a secret matter-transmission
  technology, in "Valley of the Shadow" (1963), and appeared in the Night Gallery segment "Little Girl Lost" (1972).
  After many roles in Roger Corman's low-budget films of the 1950s, he became a television star as Dr. Michael Rossi
  on Peyton Place (1964-69).

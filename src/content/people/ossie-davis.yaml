bio: >-
  Ossie Davis played Osmond Portifoy, the butler who witnesses a greedy nephew's plot, in "The Cemetery," the first
  segment of the 1969 Night Gallery pilot film. An actor, playwright and director, he wrote the play Purlie Victorious
  and directed the film Cotton Comes to Harlem (1970). With his wife Ruby Dee he was a leading voice of the civil-rights
  movement, and he delivered the eulogy at Malcolm X's funeral. Later audiences know him from Spike Lee's Do the
  Right Thing and Jungle Fever.

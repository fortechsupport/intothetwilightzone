born: '1966-05-17'
bio: >-
  Hill Harper appeared in "Shades of Guilt" (2002), an episode of the UPN Twilight Zone revival about a bigoted
  man who wakes to find himself Black. He played the medical examiner Sheldon Hawkes on CSI: NY and Dr. Marcus Andrews
  on The Good Doctor, and has written several advice books for young people.

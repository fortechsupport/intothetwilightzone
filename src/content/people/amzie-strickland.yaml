born: '1919-01-10'
died: '2006-07-05'
bio: >-
  Amzie Strickland played the elderly Sally Shine in Disney's Tower of Terror (1997), the TV film built around the
  Twilight Zone Tower of Terror ride. A prolific character actress, she began in radio and appeared in hundreds
  of television episodes from the 1950s onward, including The Andy Griffith Show and Matlock.

bio: >-
  Kate Murtagh played Zelda Gooberman, the unlamented dead wife whose possible return is the town's running joke,
  in "Mr. Garrity and the Graves" (1964). She was a character actress in film and television for several decades.
  She is also widely recognised as the waitress holding a tray of orange juice on the cover of Supertramp's album
  Breakfast in America (1979).

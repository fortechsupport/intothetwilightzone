name: Robert McCord
born: '1915'
died: '1980'
roles:
- actor
- stuntman
bio: >-
  Robert McCord (Robert Leigh McCord III) holds the record for the most appearances on the original Twilight Zone,
  turning up as an extra, stand-in or bit player in dozens of episodes across all five seasons, from "Mr. Denton
  on Doomsday" and "Escape Clause" in 1959 to "The Purple Testament," "A Nice Place to Visit," "The Silence" and
  "The Mind and the Matter." An MGM stuntman and background actor, he was usually uncredited, and fans have spent
  years spotting him in crowd scenes.

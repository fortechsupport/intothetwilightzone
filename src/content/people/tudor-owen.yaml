bio: >-
  Tudor Owen appeared in "No Time Like the Past" (1963), the fourth-season hour in which Dana Andrews plays a man
  who travels through time trying to change history and finally hides in a quiet 1880s town. The Welsh-born character
  actor worked in Hollywood films and television from the late 1940s through the 1960s, often as a British or Irish
  type.

bio: >-
  Rhea Seehorn starred as Annie in "Not All Men" (2019), the 2019 revival episode about a meteor shower that appears
  to drive the men of a town to violence. She is best known as Kim Wexler on Better Call Saul and as the lead of
  Vince Gilligan's Pluribus.

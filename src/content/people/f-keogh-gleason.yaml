bio: >-
  F. Keogh Gleason was an MGM set decorator credited on the original Twilight Zone in its second and third seasons,
  dressing the sets built on the studio lot. Among the most honored set decorators of the studio era, he shared
  Academy Awards for An American in Paris, The Bad and the Beautiful, Somebody Up There Likes Me and Gigi. His work
  on the series is a reminder that the show drew on the same staff as MGM's prestige films.

bio: >-
  Isaac Ezban wrote and directed The Similars (Los parecidos, 2015), a black-and-white-styled Mexican film about
  bus passengers stranded in a storm in 1968 who begin to change, which critics described as a tribute to Rod Serling's
  series. His earlier feature The Incident (El incidente, 2014) also used a Twilight Zone-like loop structure.

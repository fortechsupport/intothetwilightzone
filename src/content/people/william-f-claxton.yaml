name: William F. Claxton
roles:
- director
born: '1914-10-22'
died: '1996-02-11'
bio: >-
  William F. Claxton directed four original Twilight Zone episodes: "The Last Flight" (1960), about a World War
  I pilot who lands in the future; "The Jungle" and "The Little People"; and Ray Bradbury's "I Sing the Body Electric"
  (1962), which he completed after the first director was replaced. A film editor turned director, he worked for
  decades in television westerns, directing many episodes of Bonanza and Little House on the Prairie, and directed
  the killer-rabbit film Night of the Lepus (1972).

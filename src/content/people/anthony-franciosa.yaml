name: Anthony Franciosa
roles:
- actor
born: '1928-10-25'
died: '2006-01-19'
bio: >-
  Anthony Franciosa starred in "Crazy as a Soup Sandwich" (1989), Harlan Ellison's comic deal-with-a-demon script
  for the final season of the revival, playing a small-time crook. He was nominated for an Academy Award for A Hatful
  of Rain (1957), co-starred in A Face in the Crowd and The Long, Hot Summer, and starred on television in The Name
  of the Game and Matt Helm.

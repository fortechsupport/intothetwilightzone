bio: >-
  Usher Raymond IV, known simply as Usher, is a multiple Grammy-winning R&B singer whose hits include
  "Yeah!" and "U Remind Me," with occasional screen roles alongside his music career. In "To Protect and
  Serve" he played a young police officer drawn into a supernatural mystery.

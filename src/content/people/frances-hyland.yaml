born: '1927-04-25'
died: '2004-07-11'
bio: >-
  Frances Hyland appeared in "Dream Me a Life" (1988), a segment of the 1980s revival's Toronto-made third season,
  opposite Eddie Albert. One of Canada's most admired stage actresses, she was a mainstay of the Stratford Festival
  from its early years and was named an Officer of the Order of Canada.

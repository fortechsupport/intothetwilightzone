name: Rod Steiger
born: '1925-04-14'
died: '2002-07-09'
roles:
- actor
bio: >-
  Rod Steiger starred as the guilt-ridden sheriff in A Town Has Turned to Dust (1958), Rod Serling's Playhouse 90
  drama about a lynching, a story CBS forced him to move from the Emmett Till case to the 1870s Southwest. He won
  the Academy Award for In the Heat of the Night and was nominated for On the Waterfront and The Pawnbroker.

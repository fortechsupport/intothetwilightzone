name: Michael Wilson
roles:
- writer
born: '1914-07-01'
died: '1978-04-09'
bio: >-
  Michael Wilson shares screenplay credit with Rod Serling on Planet of the Apes (1968); Serling's drafts supplied
  the structure and the famous Statue of Liberty ending, and Wilson reworked the dialogue and the primitive ape
  society. Wilson won an Academy Award for A Place in the Sun and, while blacklisted, co- wrote The Bridge on the
  River Kwai and Lawrence of Arabia uncredited; his credits were later restored.

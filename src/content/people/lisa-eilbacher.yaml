bio: >-
  Lisa Eilbacher appeared in "Nightsong," a 1986 revival segment about a disc jockey visited by a long-lost love.
  She played Debra Winger's friend Casey Seeger in An Officer and a Gentleman and the art dealer Jenny Summers in
  Beverly Hills Cop.

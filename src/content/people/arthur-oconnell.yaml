name: Arthur O'Connell
roles:
- actor
born: '1908-03-29'
died: '1981-05-18'
bio: >-
  Arthur O'Connell appeared in "The Painted Mirror" (1971), the Night Gallery segment in which an antique mirror
  opens onto a prehistoric world, with Zsa Zsa Gabor. He was nominated twice for the Academy Award for Best Supporting
  Actor, for Picnic (1955) and Anatomy of a Murder (1959), and was later the face of Crest toothpaste ads as the
  pharmacist Mr. Goodbody.

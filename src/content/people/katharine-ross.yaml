name: Katharine Ross
roles:
- actor
born: '1940-01-29'
bio: >-
  Katharine Ross guest-starred in "Widow on the Evening Stage" (1965), an episode of Rod Serling's post- Civil War
  western series The Loner, early in her career. Soon after, she earned an Academy Award nomination as Elaine Robinson
  in The Graduate and played Etta Place in Butch Cassidy and the Sundance Kid; she also starred in The Stepford
  Wives.

bio: >-
  Claudia Bryar appeared in "Mute" (1963), Richard Matheson's hour-long episode about a telepathic girl raised without
  speech. A character actress in film and television from the 1950s, she is best known as Mrs. Spool in Psycho II
  (1983). She was married to actor Paul Bryar, who appeared in Serling's The Time Element.

bio: >-
  Joseph M. Newman directed four episodes in the original series' fifth season: "In Praise of Pip," "Black Leather
  Jackets," "The Last Night of a Jockey" and "The Bewitchin' Pool," the last episode produced. He began as an assistant
  director at MGM in the 1920s and became a solid studio director of films such as 711 Ocean Drive and the science-fiction
  classic This Island Earth (1955).

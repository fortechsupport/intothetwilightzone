bio: >-
  Buster Keaton was one of the great silent-film comedians, the stone-faced star and director of The General
  and Sherlock Jr. Rod Serling paid tribute to him with "Once Upon a Time", partly shot as a silent comedy,
  in which Keaton plays an 1890 janitor who travels to 1962 via a time helmet.

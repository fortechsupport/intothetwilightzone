name: Mike Kellin
roles:
- actor
born: '1922-04-26'
died: '1983-08-26'
bio: >-
  Mike Kellin played Bell, the Navy chief petty officer haunted by guilt over a submarine lost in World War II,
  in "The Thirty-Fathom Grave" (1963), one of the hour-long fourth-season episodes. A busy stage and screen character
  actor, he appeared in The Wackiest Ship in the Army, Hell Is for Heroes and Midnight Express (1978), and was nominated
  for a Tony Award for Pipe Dream.

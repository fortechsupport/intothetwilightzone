born: '1921-05-14'
died: '1984-08-08'
bio: >-
  Richard Deacon played Wallace V. Whipple, the factory owner who automates away his workforce until he too is replaced,
  in "The Brain Center at Whipple's" (1964), and later appeared in the Night Gallery blackout "How to Cure the Common
  Vampire" (1973). He is best known as the bald producer Mel Cooley on The Dick Van Dyke Show and as Fred Rutherford
  on Leave It to Beaver.

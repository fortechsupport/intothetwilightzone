born: '1922-11-26'
died: '2006-12-04'
bio: >-
  Adam Williams played the friendly sailor whom the frightened driver Nan Adams picks up in "The Hitch-Hiker" (1960),
  and appeared in "A Most Unusual Camera" the same year. A dependable heavy of 1950s films, he is best remembered
  as Valerian, one of the thugs pursuing Cary Grant in North by Northwest (1959).

born: '1917-01-03'
died: '1997-01-09'
bio: >-
  Jesse White was in the cast of Rod Serling's "The Time Element" (1958), the Desilu Playhouse play that led to
  The Twilight Zone, and later appeared in two original-series comedies: as the repairman in "Once Upon a Time,"
  Buster Keaton's time-travel episode, and in "Cavender Is Coming" with Carol Burnett. A comic character actor in
  Harvey (1950) and dozens of films, he became familiar to a generation as the lonely Maytag repairman in commercials
  from 1967 to 1988.

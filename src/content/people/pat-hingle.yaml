name: Pat Hingle
roles:
- actor
born: '1924-07-19'
died: '2009-01-03'
bio: >-
  Pat Hingle starred as the toy designer obsessed with returning to his childhood street in "The Incredible World
  of Horace Ford" (1963), and guest-starred in the two-part "The Mourners for Johnny Sharp" on Rod Serling's The
  Loner. A Tony-nominated stage actor, he appeared in On the Waterfront and Splendor in the Grass and played Commissioner
  Gordon in four Batman films.

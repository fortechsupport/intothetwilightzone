bio: >-
  Lan O'Kun wrote "The World Next Door" (1986), the 1985-revival episode about a failed inventor who finds a doorway
  in his basement to a world where his talents are prized. A playwright, songwriter and screenwriter, he was a longtime
  creative partner of puppeteer Shari Lewis and won an Emmy for their work together.

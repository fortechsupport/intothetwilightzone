bio: >-
  OCee Ritch was a member of the Southern California writers' circle around Charles Beaumont. He supplied
  the story behind the second-season episode Static, about an old radio that picks up broadcasts from
  the past, and he wrote Dead Man's Shoes, which aired under Beaumont's name as one of the uncredited
  ghostwritten scripts of the series.

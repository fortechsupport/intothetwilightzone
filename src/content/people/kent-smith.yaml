born: '1907-03-19'
died: '1985-04-23'
bio: >-
  Kent Smith appeared in two Night Gallery stories: "Deliveries in the Rear" (1972), about a surgeon who buys bodies
  from grave robbers, and "Whisper" (1973), with Sally Field. He is best remembered as the husband in Val Lewton's
  Cat People (1942) and its sequel, and played Edgar Scoville, an ally of the hero, in The Invaders.

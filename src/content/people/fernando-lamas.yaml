born: '1916-01-09'
died: '1982-10-08'
bio: >-
  Fernando Lamas appeared in "Hatred unto Death" (1973), one of the last Night Gallery segments, about a safari
  couple and a vengeful gorilla. The Argentine leading man starred in MGM musicals such as The Merry Widow (1952),
  directed episodes of television series, and inspired Billy Crystal's "You look marvelous" impression. He was the
  father of actor Lorenzo Lamas.

born: '1963-05-15'
bio: >-
  Grant Heslov acted early in his career in "Time and Teresa Golowitz" (1987), the 1985 revival segment about a
  dying songwriter who makes a deal to relive a day of his youth. He became George Clooney's producing partner,
  co-wrote and produced Good Night, and Good Luck and won the Academy Award for Best Picture as a producer of Argo
  (2012).

bio: >-
  Kenneth Haigh starred in "The Last Flight" (1960), Richard Matheson's first Twilight Zone script, as Flight Lieutenant
  Terry Decker, a World War I pilot who lands at a modern air base after deserting a comrade. On stage he created
  the role of Jimmy Porter in John Osborne's Look Back in Anger.

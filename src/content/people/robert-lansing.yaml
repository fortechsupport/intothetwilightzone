name: Robert Lansing
born: '1928-06-05'
died: '1994-10-23'
roles:
- actor
bio: >-
  Robert Lansing starred in "The Long Morrow" as Commander Douglas Stansfield, an astronaut who spends 40 years
  in suspended animation and returns to find the woman he loves has aged while he has not. He also guest-starred
  in "The Trial in Paradise" on Serling's western The Loner. He headlined the series 87th Precinct and Twelve O'Clock
  High, played the mysterious Gary Seven in Star Trek's "Assignment: Earth," and was Control on The Equalizer.

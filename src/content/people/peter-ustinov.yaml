bio: >-
  Peter Ustinov starred as Abel Shaddick, a bitter Jewish delicatessen owner in upstate New York who takes in a
  Black boy from Harlem for a summer, in Rod Serling's A Storm in Summer (1970) for Hallmark Hall of Fame; the role
  won him an Emmy Award. He also won Academy Awards for Spartacus and Topkapi and played Hercule Poirot in Death
  on the Nile and other films. A playwright, novelist, director and celebrated raconteur, he served for decades
  as a UNICEF goodwill ambassador.

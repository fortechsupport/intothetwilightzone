bio: >-
  Telly Savalas was an Oscar-nominated film heavy (Birdman of Alcatraz) who became an icon as the lollipop-sucking
  detective Kojak. In "Living Doll" he plays a resentful stepfather at war with his stepdaughter's talking
  doll, Talky Tina, who announces that she doesn't like him.

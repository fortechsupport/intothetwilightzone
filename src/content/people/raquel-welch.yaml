born: '1940-09-05'
died: '2023-02-15'
bio: >-
  Raquel Welch played technician Cora Peterson in Fantastic Voyage (1966), based on a story by Twilight Zone writer
  Jerome Bixby ("It's a Good Life") and Otto Klement. The film and One Million Years B.C. made her an international
  sex symbol; she later won a Golden Globe for The Three Musketeers and starred on Broadway in Woman of the Year.

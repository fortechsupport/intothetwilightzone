name: Hal Landon
born: '1941'
roles:
- actor
bio: >-
  Hal Landon Jr., credited as Hal Landon, appeared in "The Little People of Killany Woods" (1986), J.D. Feigelson's
  Irish-set 1985-revival episode about a village drunk who claims to have seen little people. He is best known as
  Captain Logan, Ted's father, in the Bill & Ted films and for playing Scrooge in South Coast Repertory's A Christmas
  Carol for decades.

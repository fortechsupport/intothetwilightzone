bio: >-
  Harold Ramis directed and co-wrote Groundhog Day (1993), the time-loop comedy often paired with the original series'
  "Shadow Play," about a man condemned to relive his execution dream night after night. He co-wrote Animal House
  and Ghostbusters, played Egon Spengler, and directed Caddyshack and Analyze This.

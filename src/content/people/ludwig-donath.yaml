bio: >-
  Ludwig Donath played Ernst Ganz, the gentle concentration-camp survivor whom Dennis Hopper's young neo- Nazi Peter
  Vollmer has killed on Hitler's advice, in "He's Alive" (1963). Born in Vienna, he acted on the Austrian and German
  stage before fleeing the Nazis. In Hollywood he is best remembered as Al Jolson's father, the cantor, in The Jolson
  Story (1946) and Jolson Sings Again (1949), and he played the East German scientist Professor Lindt in Hitchcock's
  Torn Curtain (1966).

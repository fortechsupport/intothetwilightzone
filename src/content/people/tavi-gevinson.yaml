bio: >-
  Tavi Gevinson appeared in "A Human Face," a 2020 episode of the Jordan Peele revival in which an alien takes the
  form of a grieving couple's dead daughter. She became famous as a pre-teen fashion blogger with Style Rookie and
  founded the online magazine Rookie. She has acted on Broadway in This Is Our Youth and on the Gossip Girl revival.

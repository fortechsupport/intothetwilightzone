born: '1942-02-08'
bio: >-
  Comedian Robert Klein starred in "Wordplay" (1985), the first segment of the revival's premiere night, about a
  salesman who wakes to find the meanings of everyday words have shifted. A pioneer of the HBO stand-up special,
  he was nominated for a Tony Award for the musical They're Playing Our Song (1979).

name: Joel Engel
roles:
- author
- historian
bio: >-
  Joel Engel wrote the first full biography of Rod Serling, Rod Serling: The Dreams and Nightmares of Life in the
  Twilight Zone (Contemporary Books, 1989). It draws on interviews with Serling's colleagues, family and friends.
  The book was later reissued as Last Stop, The Twilight Zone: The Biography of Rod Serling (Booktrope, 2014). Engel
  is a journalist and nonfiction author.

name: Brandon de Wilde
born: '1942-04-09'
died: '1972-07-06'
roles:
- actor
bio: >-
  Brandon de Wilde played one of the students in "Class of '99," Serling's second-season Night Gallery segment in
  which Vincent Price examines a graduating class that turns out to be androids. He was nominated for an Academy
  Award at age 11 for Shane (1953), as the boy who calls after Alan Ladd's gunfighter. He also appeared in The Member
  of the Wedding on Broadway and on screen, and in Hud and In Harm's Way. He died in a traffic accident at 30.

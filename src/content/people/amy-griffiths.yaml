name: Amy Griffiths
roles:
- actor
bio: >-
  Amy Griffiths was part of the ensemble cast of Anne Washburn's stage adaptation The Twilight Zone, which premiered
  at London's Almeida Theatre in December 2017 under director Richard Jones, with the ten-strong company playing
  multiple roles across interwoven episodes. She is a British stage actor and singer.

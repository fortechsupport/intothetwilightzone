bio: >-
  Alex Nicol played Alex Walker, the new husband who cannot escape his dead mother's hold in Richard Matheson's
  "Young Man's Fancy" (1962). A Universal contract player in westerns such as The Man from Laramie, he also directed
  the low-budget horror film The Screaming Skull (1958).

name: Adele T. Strassfield
roles:
- writer
bio: >-
  Adele T. Strassfield (credited as A. T. Strassfield) wrote "Caesar and Me" (1964), a fifth-season episode in which
  an out-of-work ventriloquist is goaded into crime by his dummy and a malicious little girl. It is often noted
  as the only episode of the original series written by a woman, and appears to be her only television writing credit.

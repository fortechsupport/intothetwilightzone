name: Brent Spiner
born: '1949-02-02'
roles:
- actor
bio: >-
  Brent Spiner appeared in "Dead Run," the 1986 revival segment about a trucker hauling souls to Hell, a year before
  he was cast as the android Data on Star Trek: The Next Generation. He played Data across seven seasons and four
  films, and later Dr. Brakish Okun in Independence Day. He has also worked on Broadway in Sunday in the Park with
  George and 1776.

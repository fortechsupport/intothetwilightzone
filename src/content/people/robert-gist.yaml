bio: >-
  Robert Gist directed "I Dream of Genie" (1963), the fourth-season hour in which Howard Morris's meek office worker
  finds a lamp and agonizes over his single wish. As an actor he appeared in Operation Petticoat and Jack Webb's
  Pete Kelly's Blues before moving into television directing.

bio: >-
  Lance E. Nichols appeared in "Dead Woman's Shoes" (1985), the 1985 revival's remake of the original series episode
  "Dead Man's Shoes," with Helen Mirren as the shy clerk possessed by a murdered woman's spirit. A New Orleans-based
  character actor, he is best known as Larry Williams on HBO's Treme.

born: '1944-04-11'
bio: >-
  John Milius directed "Opening Day" (1985), a segment of the 1980s revival's first season, and made a cameo in
  it. A screenwriter of Apocalypse Now (Oscar-nominated), Jeremiah Johnson and Magnum Force, he directed Big Wednesday,
  Conan the Barbarian and Red Dawn and co-created HBO's Rome.

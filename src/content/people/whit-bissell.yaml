name: Whit Bissell
roles:
- actor
born: '1909-10-25'
died: '1996-03-05'
bio: >-
  Whit Bissell guest-starred in "An Echo of Bugles" (1965), the premiere episode of Rod Serling's western The Loner.
  A ubiquitous character actor, he appeared in Creature from the Black Lagoon, Invasion of the Body Snatchers and
  The Magnificent Seven and played General Kirk on The Time Tunnel.

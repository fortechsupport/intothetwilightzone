bio: >-
  John Eldredge appeared in "Back There," the second-season episode in which Russell Johnson's club member slips
  back to the night of Lincoln's assassination. A suave supporting actor in Warner Bros. films of the 1930s, he
  later played Harry Archer, the father, on the TV sitcom Meet Corliss Archer.

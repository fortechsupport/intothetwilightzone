born: '1930-03-30'
bio: >-
  John Astin played Charlie, one of the hungry settlers on Joe Caswell's wagon train, in the original series episode
  "A Hundred Yards Over the Rim" (1961). He became one of Night Gallery's most frequent contributors on both sides
  of the camera, acting in "Pamela's Voice," the hellbound-hippie comedy "Hell's Bells" and "The Girl with the Hungry
  Eyes," and directing "The House," "A Fear of Spiders" and "The Dark Boy." He is best remembered as Gomez in The
  Addams Family (1964-66) and later played Buddy Ryan on Night Court. His short film Prelude (1968) earned an Academy
  Award nomination, and he later taught theatre at Johns Hopkins University, his alma mater.

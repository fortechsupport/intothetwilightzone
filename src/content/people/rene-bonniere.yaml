name: Rene Bonniere
roles:
- director
bio: >-
  Rene Bonniere directed three episodes of the Toronto-produced final season of the 1985 revival: "Appointment on
  Route 17," "The Curious Case of Edgar Witherspoon" and "Rendezvous in a Dark Place." A Canadian documentary and
  television director, he worked on many series made in Canada in the 1980s and 1990s.

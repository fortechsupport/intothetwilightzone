bio: >-
  Damon Wayans Jr. starred in "A Small Town" (2020), a second-season episode of the Jordan Peele revival about a
  church caretaker who finds a model of his town that lets him repair the real one. The son of Damon Wayans, he
  is known for Happy Endings, New Girl and the film Let's Be Cops.

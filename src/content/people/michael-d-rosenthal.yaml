name: Michael D. Rosenthal
roles:
- author
bio: >-
  Michael D. Rosenthal supplied the original story for "A Kind of a Stopwatch" (1963), which Rod Serling adapted
  into the comic fifth-season episode about a barroom bore who is given a stopwatch that freezes the world. Little
  is recorded about Rosenthal beyond this credit.

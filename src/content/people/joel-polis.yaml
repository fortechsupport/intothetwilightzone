bio: >-
  Joel Polis appeared in "The Uncle Devil Show," a 1985 revival segment about a boy whose magic kit belongs to the
  Devil. He is best known as Fuchs, the young biologist of the Antarctic research team, in John Carpenter's The
  Thing (1982), and has made many television appearances.

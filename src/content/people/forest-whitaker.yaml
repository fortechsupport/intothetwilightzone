bio: >-
  Forest Whitaker took on Rod Serling's role as on-screen host and narrator for all 43 episodes of the
  2002 UPN revival, delivering the opening and closing monologues. An actor and director whose credits
  include Bird, The Crying Game and Ghost Dog, he won the Academy Award for Best Actor a few years later
  for playing Idi Amin in The Last King of Scotland (2006).

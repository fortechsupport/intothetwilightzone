bio: >-
  Tony Hale appeared in "Downtime" (2020), a second-season episode of Jordan Peele's revival in which a hotel manager
  discovers her world is a virtual simulation. He won two Emmys as Gary Walsh on Veep, played Buster Bluth on Arrested
  Development and voiced Forky in Toy Story 4.

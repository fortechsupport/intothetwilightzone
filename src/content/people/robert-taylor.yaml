name: Robert Taylor
roles:
- actor
born: '1911-08-05'
died: '1969-06-08'
bio: >-
  Robert Taylor starred as the reformed gunfighter Steve Sinclair in Saddle the Wind (1958), the MGM western whose
  screenplay was Rod Serling's first original script for a feature film. An MGM leading man for more than two decades,
  he starred in Camille, Waterloo Bridge, Quo Vadis and Ivanhoe, and on television in The Detectives and as host
  of Death Valley Days.

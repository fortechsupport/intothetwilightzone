bio: >-
  Adrian Pasdar starred in the vampire film Near Dark and the series Profit, and later played politician
  Nathan Petrelli on Heroes and Glenn Talbot on Agents of S.H.I.E.L.D. He led "Dream Lover" as a graphic
  novelist whose perfect woman begins to appear in his life.

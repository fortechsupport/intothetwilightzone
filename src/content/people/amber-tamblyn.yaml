bio: >-
  Amber Tamblyn started on General Hospital, earned an Emmy nomination for Joan of Arcadia and starred
  in The Sisterhood of the Traveling Pants films, while also publishing poetry and fiction. She starred
  in "Evergreen," the first segment of the 2002 series' premiere, as a rebellious teenager sent to an
  eerily perfect gated community.

  role: art director (credited 1959-1963)
bio: >-
  William Ferrari was one of the MGM art directors credited on the original Twilight Zone from its first season,
  designing sets on the lot alongside supervising art director George W. Davis. A studio veteran, he shared the
  Academy Award for the art direction of Gaslight (1944). He remained on the series into its fourth season, around
  the time of his death in the early 1960s.

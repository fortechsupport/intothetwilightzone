bio: >-
  Elizabeth Montgomery, daughter of actor Robert Montgomery, became a television icon as the witch Samantha
  on Bewitched and earned nine Emmy nominations. In "Two", which opened the third season, she plays a
  ragged soldier of the other side who speaks only a single word in the entire episode.

bio: >-
  English actor Ian McShane starred as the antiques dealer Lovejoy, won a Golden Globe as Al Swearengen
  on Deadwood and played Mr. Wednesday on American Gods. He appeared in "Cold Fusion" as a rival scientist
  opposite Sean Patrick Flanery.

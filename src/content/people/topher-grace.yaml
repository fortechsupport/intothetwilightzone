name: Topher Grace
roles:
- actor
born: '1978-07-12'
bio: >-
  Topher Grace starred in "Try, Try" (2020), a second-season episode of the Jordan Peele revival about a man who
  has lived the same day repeatedly and uses it to charm a woman (Kylie Bunbury). He became known as Eric Forman
  on That '70s Show and later appeared in Spider-Man 3, Interstellar and BlacKkKlansman.

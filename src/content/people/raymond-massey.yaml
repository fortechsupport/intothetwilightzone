bio: >-
  Raymond Massey appeared in the Night Gallery segments "Clean Kills and Other Trophies" (1971), as a big- game
  hunter whose trophy room hides one last kill, and "Rare Objects" (1972), as a collector of famous people. The
  Canadian-born actor was nominated for an Oscar for Abe Lincoln in Illinois, starred in Things to Come and East
  of Eden, and played Dr. Gillespie on Dr. Kildare.

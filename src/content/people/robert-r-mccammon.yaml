name: Robert R. McCammon
born: '1952-07-17'
roles:
- author
bio: >-
  Robert R. McCammon wrote "Nightcrawlers," the short story about a traumatized Vietnam veteran whose nightmares
  take physical form, which became a celebrated 1985 revival segment directed by William Friedkin. A major horror
  writer of the 1980s, he wrote the post-apocalyptic epic Swan Song and the coming-of-age novel Boy's Life, which
  won the World Fantasy Award. He later wrote the Matthew Corbett historical mystery series.

bio: >-
  Stuart Rosenberg directed three original-series episodes: the first-season astronaut story I Shot an
  Arrow into the Air and, in the hour-long fourth season, He's Alive and Richard Matheson's Mute. He became
  a successful feature director with Cool Hand Luke (1967), Pocket Money and The Amityville Horror.

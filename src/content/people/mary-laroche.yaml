name: Mary LaRoche
roles:
- actor
bio: >-
  Mary LaRoche played Annabelle Streator, the mother whose daughter's new doll Talky Tina declares war on her stepfather
  (Telly Savalas), in "Living Doll" (1963). A film and television actress of the 1950s and 1960s, she appeared in
  Gidget and played the mother of the star-struck teenager in Bye Bye Birdie (1963).

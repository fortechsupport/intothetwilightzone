name: Estelle Winwood
born: '1883-01-24'
died: '1984-06-20'
roles:
- actor
bio: >-
  Estelle Winwood played Laurette Bowen, the elderly former wife of the ageless Walter Jameson, who still loves
  the man who never grew old, in "Long Live Walter Jameson." The English-born actress had a long career on Broadway,
  and in films such as The Glass Slipper and The Producers she specialized in eccentric old women. She worked into
  her nineties and lived to 101.

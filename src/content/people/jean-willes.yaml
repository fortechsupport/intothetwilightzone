name: Jean Willes
roles:
- actor
born: '1923-04-15'
died: '1989-01-03'
bio: >-
  Jean Willes played one of the stranded bus passengers suspected of being a Martian in "Will the Real Martian Please
  Stand Up?" (1961). A character actress of the 1950s, she appeared in Invasion of the Body Snatchers (1956), From
  Here to Eternity and Ocean's 11 (1960), the heist film that grew from a story by Twilight Zone writer George Clayton
  Johnson.

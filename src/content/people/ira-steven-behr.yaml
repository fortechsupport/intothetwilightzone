bio: >-
  Ira Steven Behr, fresh from running Star Trek: Deep Space Nine, was one of the executive producers of
  the 2002 UPN revival and wrote several of its episodes, most notably It's Still a Good Life, the sequel
  to the 1961 classic that brought back Bill Mumy and Cloris Leachman and cast Mumy's daughter Liliana
  as Anthony Fremont's even more powerful child. He later worked as an executive producer on Outlander.

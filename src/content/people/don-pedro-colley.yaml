born: '1938-08-30'
died: '2017-10-11'
bio: >-
  Don Pedro Colley appeared with Forrest Tucker in "Dr. Stringfellow's Rejuvenator" (1971), Rod Serling's Night
  Gallery segment about a frontier patent-medicine man. He played Ongaro in Beneath the Planet of the Apes, appeared
  in George Lucas's THX 1138, and was Sheriff Little on The Dukes of Hazzard.

name: Alan Crosland Jr.
born: '1918'
died: '2001'
roles:
- director
bio: >-
  Alan Crosland Jr. directed four episodes of the original series' later seasons: "The Old Man in the Cave," "The
  7th Is Made Up of Phantoms," "Ring-a-Ding Girl" and "The Parallel," and also an episode of The Sixth Sense. The
  son of Alan Crosland, director of The Jazz Singer, he began as a film editor at Warner Bros. before becoming a
  prolific television director on series such as Perry Mason, The Outer Limits, Wonder Woman and The Bionic Woman.

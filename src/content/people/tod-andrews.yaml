bio: >-
  Tod Andrews played Gil Sharewood, the quarrelling father too wrapped up in his marriage to notice his children,
  in "The Bewitchin' Pool" (1964), the last episode of the original series to air. Early in his career he acted
  as Michael Ames. On stage he played the title role in Mister Roberts after Henry Fonda, and on television he starred
  as the Confederate raider John Singleton Mosby in The Gray Ghost (1957-58).

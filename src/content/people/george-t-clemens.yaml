bio: >-
  George T. Clemens was the director of photography for the great majority of the original Twilight Zone,
  responsible for the stark, shadow-heavy black-and-white images that defined its mood. His work earned
  the series an Emmy for cinematography, and he remained with the show into its final season after a long
  career behind the camera in Hollywood.

bio: >-
  Wes Craven, already known for The Last House on the Left and A Nightmare on Elm Street, directed seven
  segments for the 1985 revival's first two seasons, including the premiere's Shatterday with Bruce Willis,
  the apocalyptic A Little Peace and Quiet and the romantic ghost story Her Pilgrim Soul. He later created
  the Scream franchise.

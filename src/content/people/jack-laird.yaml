bio: >-
  Jack Laird was the producer of Rod Serling's Night Gallery on NBC, and the man most responsible for
  its direction after the pilot. A fan of Universal's classic monster films, he favoured the network's
  more horror-oriented vision, rejected some of Serling's scripts, and introduced the short comic blackout
  sketches of the second season, most of which he wrote himself. His clashes with Serling over creative
  control left the series' creator frustrated with a show that bore his name.

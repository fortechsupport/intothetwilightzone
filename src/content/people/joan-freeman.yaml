born: '1941'
bio: >-
  Joan Freeman guest-starred in "The Vespers," an early episode of Rod Serling's western The Loner (1965). A former
  child actress, she co-starred with Elvis Presley in Roustabout (1964) and with Roy Orbison in The Fastest Guitar
  Alive, and appeared widely in 1960s television.

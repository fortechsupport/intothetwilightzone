bio: >-
  Sean Astin led The Goonies as a child, starred in Rudy and played Samwise Gamgee in The Lord of the
  Rings trilogy, later appearing on Stranger Things. In the later seasons of the radio dramas he voiced
  the leads in four episodes, including "Who Am I" and "Snow Angel."

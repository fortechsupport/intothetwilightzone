bio: >-
  Barbara Stuart played Edith Rogers, the secretary of Richard Haydn's machine-hating Bartlett Finchley, in "A Thing
  About Machines" (1960). She later became familiar as Sergeant Carter's girlfriend Bunny on Gomer Pyle, U.S.M.C.
  and worked steadily in television comedy for decades.

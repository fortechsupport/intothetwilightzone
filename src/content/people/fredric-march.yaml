name: Fredric March
roles:
- actor
born: '1897-08-31'
died: '1975-04-14'
bio: >-
  Fredric March played President Jordan Lyman, who uncovers a military coup plot, in Seven Days in May (1964), the
  political thriller Rod Serling adapted from the Knebel-Bailey novel for director John Frankenheimer. March won
  two Academy Awards, for Dr. Jekyll and Mr. Hyde and The Best Years of Our Lives, and two Tonys.

bio: >-
  Jim Piddock appeared in "Devil's Alphabet" (1986), the 1985 revival's Victorian ghost story about Cambridge friends
  who swear an oath to meet every year, alive or dead. The English actor and writer is a regular in Christopher
  Guest's ensemble comedies, including Best in Show and A Mighty Wind, and has done extensive voice work.

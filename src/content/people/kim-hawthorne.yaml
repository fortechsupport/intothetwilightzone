name: Kim Hawthorne
roles:
- actor
bio: >-
  Kim Hawthorne is an American actress from Jersey City, New Jersey, who played Muriel, one of the two angelic
  evangelists, in the 2002 revival episode "Chosen". She is known for Det. Rose Williams on Da Vinci's Inquest
  and Kerissa Greenleaf on Greenleaf, after early work on the soaps All My Children and Another World.

name: David P. Harmon
roles:
- writer
bio: >-
  David P. Harmon wrote "The Eyes That Wouldn't Die," an episode of The Sixth Sense, the 1972 supernatural series
  later folded into Night Gallery's syndication package. A veteran television writer, he wrote two episodes of the
  original Star Trek, "A Piece of the Action" and "The Deadly Years," and scripts for many 1950s and 1960s series
  including Gilligan's Island.

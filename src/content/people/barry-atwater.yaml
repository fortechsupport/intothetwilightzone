name: Barry Atwater
born: '1918-05-16'
died: '1978-05-24'
roles:
- actor
bio: >-
  Barry Atwater played Les Goodman, the first neighbor accused of being an alien in "The Monsters Are Due on Maple
  Street," and returned for "The Cemetery" in the 1969 Night Gallery pilot film and the third-season Night Gallery
  segment "The Doll of Death." He is best remembered as Janos Skorzeny, the silent vampire hunted by Darren McGavin
  in The Night Stalker (1972), and as the Vulcan philosopher Surak in Star Trek's "The Savage Curtain."

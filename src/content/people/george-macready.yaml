name: George Macready
born: '1899-08-29'
died: '1973-07-02'
roles:
- actor
bio: >-
  George Macready played William Hendricks, the wealthy, bedridden uncle murdered by his greedy nephew (Roddy McDowall),
  in "The Cemetery," the opening segment of the 1969 Night Gallery pilot film. His scarred face and silky voice
  made him a classic screen villain in Gilda, The Big Clock and Kubrick's Paths of Glory. On television he played
  the patriarch Martin Peyton on Peyton Place.

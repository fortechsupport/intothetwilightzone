bio: >-
  Jim Danforth worked on the visual effects for George Miller's Nightmare at 20,000 Feet segment of Twilight Zone:
  The Movie (1983). A stop-motion animator and matte painter, he had been nominated for Academy Awards for 7 Faces
  of Dr. Lao and When Dinosaurs Ruled the Earth.

name: Edward Andrews
born: '1914-10-09'
died: '1985-03-08'
roles:
- actor
bio: >-
  Edward Andrews played Carling, the government official in "Third from the Sun" (1960), and starred in "You Drive"
  (1964) as Oliver Pope, a hit-and-run driver whose own car will not let him forget what he did. A bespectacled
  character actor, he played bankers and officials in films such as Elmer Gantry, The Thrill of It All and Sixteen
  Candles.

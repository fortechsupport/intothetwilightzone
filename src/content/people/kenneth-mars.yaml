bio: >-
  Kenneth Mars appeared in "Tooth and Consequences" (1986), a 1985-revival comedy about a dentist who meets the
  Tooth Fairy. He played the Nazi playwright Franz Liebkind in The Producers and Inspector Kemp in Young Frankenstein,
  and voiced King Triton in The Little Mermaid.

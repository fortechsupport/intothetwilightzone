born: '1907'
died: '1978'
bio: >-
  Price Day wrote the short story "Four O'Clock," which Rod Serling adapted into the 1962 episode starring Theodore
  Bikel as a fanatic who plans to shrink every evil person to two feet tall. Day was a newspaperman with The Baltimore
  Sun, where he won a Pulitzer Prize for international reporting in 1949 for his coverage of newly independent India.

bio: >-
  Seaton McLean was a producer of the syndicated third season of the 1985 Twilight Zone (1988-89), made in Canada
  by Atlantis Films, the company he co-founded with Michael MacMillan and Janice Platt. He produced a long run of
  Canadian film and television through Atlantis and Alliance Atlantis.

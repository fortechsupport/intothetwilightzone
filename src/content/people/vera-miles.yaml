bio: >-
  Vera Miles was a Hitchcock favorite, starring in The Wrong Man and playing Lila Crane in Psycho, and
  appeared opposite John Wayne in The Searchers. In "Mirror Image" she plays a young woman in a bus depot
  who becomes convinced that her exact double from a parallel world is trying to replace her.

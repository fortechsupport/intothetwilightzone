name: Edward Binns
roles:
- actor
born: '1916-09-12'
died: '1990-12-04'
bio: >-
  Edward Binns played Colonel Bob Donlin, the commander of a crashed spaceship crew who turn on each other, in "I
  Shot an Arrow into the Air" (1960), and appeared in "The Long Morrow" (1964) and in "The Trial in Paradise," an
  episode of Serling's western The Loner. A familiar face in authority roles, he was Juror No. 6 in 12 Angry Men
  (1957) and also appeared in Fail-Safe, Patton and The Verdict.

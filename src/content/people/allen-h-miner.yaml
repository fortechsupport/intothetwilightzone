bio: >-
  Allen H. Miner directed "The Gift" (1962), the original-series episode about a stranger from space taken in by
  a Mexican village, and directed several episodes of Rod Serling's western The Loner, among them "The Lonely Calico
  Queen" and "Mantrap." A writer-director of the 1950s, he made the film The Ride Back and worked across television
  westerns and anthologies.

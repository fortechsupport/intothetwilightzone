bio: >-
  Milton Frome appeared in "The Four of Us Are Dying" (1960), Charles Beaumont's episode about a con man who can
  change his face. A character actor of the 1950s and 60s, he was a frequent foil in Jerry Lewis films and sitcoms
  such as The Beverly Hillbillies.

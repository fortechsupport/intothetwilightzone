name: Michael Dunn
roles:
- actor
born: '1934-10-20'
died: '1973-08-29'
bio: >-
  Michael Dunn appeared in "The Sins of the Fathers" (1972), Halsted Welles's Night Gallery adaptation of Christianna
  Brand's story of a Welsh sin-eater, one of the series' most admired segments. A performer with dwarfism, he was
  nominated for an Academy Award for Ship of Fools (1965) and a Tony for The Ballad of the Sad Cafe, and played
  the recurring villain Dr. Miguelito Loveless on The Wild Wild West.

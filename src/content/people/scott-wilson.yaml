born: '1942-03-29'
died: '2018-10-06'
bio: >-
  Scott Wilson starred in "Quarantine" (1986), the revival episode written by Steven Bochco and Alan Brennert about
  a weapons scientist awakened from cryogenic sleep into a pacifist future society. He played the killer Richard
  Hickock in In Cold Blood (1967), the test pilot Scott Crossfield in The Right Stuff, and the farmer Hershel Greene
  on The Walking Dead.

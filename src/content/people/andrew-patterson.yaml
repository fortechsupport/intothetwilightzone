bio: >-
  Andrew Patterson directed The Vast of Night (2019), his first feature, a low-budget mystery about two teenagers
  in 1950s New Mexico tracking a strange radio signal, framed as an episode of a fictional anthology called Paradox
  Theater in open homage to The Twilight Zone. Made independently in Oklahoma, the film premiered at Slamdance,
  where it won the audience award, and was acquired by Amazon Studios.

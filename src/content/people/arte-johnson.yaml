bio: >-
  Arte Johnson appeared in "The Whole Truth" (1961), Rod Serling's comedy about a used-car dealer stuck with a car
  that forces its owner to tell the truth, and starred in "The Flip-Side of Satan" (1971), a Night Gallery segment
  about a cynical disc jockey trapped in a radio station. He became famous on Rowan & Martin's Laugh-In as the German
  soldier Wolfgang ("Verrry interesting") and the lecherous old man Tyrone, winning an Emmy in 1969.

born: '1941-12-21'
died: '2017-05-27'
bio: >-
  Jared Martin appeared in "Tell David..." (1971), a Night Gallery segment in which a jealous wife glimpses her
  own future through a young couple. He is best known as Dusty Farlow, Sue Ellen's cowboy love interest on Dallas,
  and as Dr. Harrison Blackwood in the syndicated War of the Worlds series (1988-90). He also starred in the short-lived
  science fiction series The Fantastic Journey (1977).

bio: >-
  Ted Knight appeared early in his career in "The Lonely" (1959), as one of the supply-ship crewmen who visit the
  convict exiled to an asteroid. He became famous as anchorman Ted Baxter on The Mary Tyler Moore Show, winning
  two Emmys, then starred in Too Close for Comfort and Caddyshack.

name: Henry Gibson
roles:
- actor
born: '1935-09-21'
died: '2009-09-14'
bio: >-
  Henry Gibson appeared in "Welcome to Winfield" (1986), the 1985 revival's comedy about the Angel of Death chasing
  a dying man who has hidden in a small western town. He became famous reciting his deadpan poems on Rowan & Martin's
  Laugh-In, earned a Golden Globe nomination as the country singer Haven Hamilton in Nashville, led the Illinois
  Nazis in The Blues Brothers, and voiced Wilbur in Charlotte's Web (1973).

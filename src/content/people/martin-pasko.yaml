born: '1954-08-04'
died: '2020-06-10'
bio: >-
  Martin Pasko co-wrote three first-season segments of the 1985 revival: "The Beacon," "But Can She Type?" (both
  with Rebecca Parr Cioffi) and "Cold Reading," a comedy about a live 1940s radio serial whose sound effects come
  to life. A comics writer for DC, he wrote Superman and Wonder Woman, launched The Saga of the Swamp Thing that
  Alan Moore would take over, and later won an Emmy for writing on Batman: The Animated Series and co-wrote Batman:
  Mask of the Phantasm.

born: '1957-03-12'
bio: >-
  Jerry Levine directed three episodes of the 2002 UPN revival: "Dead Man's Eyes," "The Path" and "The Placebo Effect."
  As an actor he is best known as Stiles, Michael J. Fox's friend in Teen Wolf (1985), and he appeared in Born on
  the Fourth of July. He later became a prolific sitcom and drama director, including Everybody Hates Chris and
  Monk.

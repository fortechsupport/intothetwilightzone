bio: >-
  Colin Cunningham appeared in "The Path" (2003), an episode of the UPN Twilight Zone revival, which was filmed
  in Vancouver. The Canadian actor is known for playing Major Paul Davis on Stargate SG-1 and the outlaw John Pope
  on Falling Skies.

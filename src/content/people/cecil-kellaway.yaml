bio: >-
  Cecil Kellaway played Jeremy Wickwire, the genial caretaker of a strange cemetery-like resort, in "Elegy," and
  the elderly passenger Mr. Burgess in "Passage on the Lady Anne." Born in South Africa, he worked on stage and
  screen in Australia before settling in Hollywood as a character actor in films such as Wuthering Heights and The
  Postman Always Rings Twice. He was twice nominated for the Academy Award for best supporting actor, for The Luck
  of the Irish (1948) and Guess Who's Coming to Dinner (1967).

name: Glynn Turman
born: '1947-01-31'
roles:
- actor
bio: >-
  Glynn Turman starred as Billy Kinetta, the Vietnam veteran who befriends the old man Gaspar (Danny Kaye) and inherits
  a watch that holds back the end of the world, in "Paladin of the Lost Hour" (1985), adapted from Harlan Ellison's
  story. He is known for Cooley High, A Different World and The Wire, and won an Emmy for In Treatment.

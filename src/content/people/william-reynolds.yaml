born: '1931-12-09'
bio: >-
  William Reynolds starred as Lt. Fitzgerald, the infantry officer in the 1945 Philippines who sees a strange light
  on the faces of men about to die, in "The Purple Testament" (1960). A Universal contract player in the 1950s,
  he played Jane Wyman's son in Douglas Sirk's All That Heaven Allows (1955). On television he led the war series
  The Gallant Men and played Special Agent Tom Colby in the later seasons of The F.B.I. alongside Efrem Zimbalist
  Jr.

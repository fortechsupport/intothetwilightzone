name: Richard Conte
roles:
- actor
born: '1910-03-24'
died: '1975-04-15'
bio: >-
  Richard Conte played Edward Hall, a man with a heart condition who fears that if he falls asleep a dream woman
  will lure him to his death, in Charles Beaumont's "Perchance to Dream" (1959). A film-noir mainstay in Call Northside
  777 and The Big Combo, he played Barzini in The Godfather and appeared in the original Ocean's 11.

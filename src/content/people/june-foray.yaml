name: June Foray
roles:
- voice actor
born: '1917-09-18'
died: '2017-07-26'
bio: >-
  June Foray provided the voice of Talky Tina, the doll that threatens Telly Savalas in "Living Doll" (1963), giving
  the show one of its most quoted lines. She also worked on "The Bewitchin' Pool" (1964), the series' last episode,
  where she dubbed dialogue for the child actors. One of the most important voice performers in American animation,
  she was Rocky the Flying Squirrel and Natasha Fatale for Jay Ward and Granny for Warner Bros., among hundreds
  of roles. She helped found the Annie Awards and campaigned for the Academy Award for Best Animated Feature.

name: Warren Stevens
roles:
- actor
born: '1919-11-02'
died: '2012-03-27'
bio: >-
  Warren Stevens played Nate Bledsoe, the derelict who puts on a dead gangster's shoes and is taken over by him,
  in "Dead Man's Shoes" (1962); he returned for the 1980s revival's "A Day in Beaumont" (1986) and guest-starred
  on Rod Serling's The Loner. He played Doc Ostrow in Forbidden Planet.

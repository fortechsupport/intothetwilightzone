name: Jo Anne Worley
roles:
- actor
born: '1937-09-06'
bio: >-
  Jo Anne Worley appeared in Night Gallery's comic ghost story "House – with Ghost" (1971), opposite Bob Crane.
  A brassy comedienne and singer, she became famous in the original cast of Rowan & Martin's Laugh- In and later
  did much voice work, including the Wardrobe in Disney's Beauty and the Beast.

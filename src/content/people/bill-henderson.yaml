born: '1926-03-19'
died: '2016-04-03'
bio: >-
  Bill Henderson appeared in "Night of the Meek" (1985), the revival's remake of Rod Serling's Christmas episode,
  with Richard Mulligan in Art Carney's old role as the department-store Santa. A jazz singer who recorded with
  Horace Silver ("Senor Blues"), Henderson moved into acting and appeared in films such as Clue, City Slickers and
  White Men Can't Jump.

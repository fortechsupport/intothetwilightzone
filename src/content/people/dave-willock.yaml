bio: >-
  Dave Willock appeared in "The Trouble with Templeton" (1960), in which an aging Broadway actor (Brian Aherne)
  is drawn back to 1927 and the wife he lost. A comic character actor in many films and television shows from the
  1940s on, he was also a voice actor, narrating Hanna-Barbera's Wacky Races.

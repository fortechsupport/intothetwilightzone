name: Zabryna Guevara
roles:
- actor
bio: >-
  Zabryna Guevara played Yoli, the housekeeper whose detention by immigration agents sets the story in motion, in
  "Point of Origin" (2019), a first-season episode of Jordan Peele's revival. She played Captain Sarah Essen on
  Gotham and has appeared in Burn Notice and the film Sweet Thing.

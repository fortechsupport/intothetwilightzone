name: Darryl Hickman
roles:
- actor
born: '1931-07-28'
bio: >-
  Darryl Hickman appeared in "The Time Element" (1958), Rod Serling's Desilu Playhouse drama about a man who dreams
  he is in Honolulu on the eve of Pearl Harbor, which served as the unofficial pilot for The Twilight Zone. A child
  actor in The Grapes of Wrath and Leave Her to Heaven, he later became a CBS daytime programming executive and
  acting teacher; his brother Dwayne Hickman starred as Dobie Gillis.

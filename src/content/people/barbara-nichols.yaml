born: '1928-12-30'
died: '1976-10-05'
bio: >-
  Barbara Nichols starred in "Twenty-Two" (1961) as Liz Powell, the hospitalized dancer who keeps dreaming of a
  nurse inviting her down to the morgue, "Room for one more, honey." The episode, adapted by Serling from a story
  in Bennett Cerf's collection, was one of the season's videotaped shows. A former model and burlesque dancer, she
  specialised in brassy blonde roles in films such as Sweet Smell of Success, Pal Joey and The Pajama Game.

bio: >-
  Wallace Langham appeared in two Twilight Zone revivals: "Time and Teresa Golowitz" (1987) in the 1985 series and
  "Mr. Motivation" (2002) in the 2002 series. He is best known as lab tech David Hodges on CSI: Crime Scene Investigation
  and for The Larry Sanders Show.

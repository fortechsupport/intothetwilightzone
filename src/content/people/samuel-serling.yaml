name: Samuel Serling
died: '1945'
roles:
- family
bio: >-
  Samuel Serling was Rod Serling's father. He ran a grocery and later a butcher shop in Binghamton, New York, where
  the family moved in the mid-1920s. He died of a heart attack in 1945 while Rod was serving in the Army in the
  Pacific, a loss Rod could not return home for. Biographers see the warm small-town family life of those Binghamton
  years in the nostalgic episodes Serling later wrote, such as "Walking Distance."

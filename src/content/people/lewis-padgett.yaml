name: Lewis Padgett
roles:
- author
bio: >-
  Lewis Padgett was the joint pseudonym of the married science-fiction writers Henry Kuttner and C. L. Moore, under
  which they published "What You Need" (Astounding, 1945), the story Rod Serling adapted for the first- season episode
  of the same name (1959), about a peddler who always knows what a person will need. The Padgett byline also covered
  "Mimsy Were the Borogoves," later filmed as The Last Mimzy, and the comic Gallegher robot stories.

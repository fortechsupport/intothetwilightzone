bio: >-
  Giovanni Ribisi appeared as a child in "The Beacon," a 1985 revival segment in which a doctor (Charles Martin
  Smith) finds himself in a coastal town ruled by a lighthouse. He went on to play Phoebe's brother Frank Jr. on
  Friends and Private Wade in Saving Private Ryan, with later roles in Boiler Room, Lost in Translation, Avatar
  and Sneaky Pete.

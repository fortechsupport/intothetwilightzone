bio: >-
  Phyllis Love appeared in "Four O'Clock" (1962), the episode in which Theodore Bikel's poison-pen fanatic Oliver
  Crangle plans to shrink every evil person on Earth to two feet tall. A Broadway actress, she played Mattie Birdwell
  in William Wyler's Friendly Persuasion (1956).

born: '1922-09-18'
died: '1985-08-07'
bio: >-
  Grayson Hall appeared in "Certain Shadows on the Wall" (1970), the Night Gallery segment in which a murdered woman's
  shadow remains on the wall of the house, alongside Agnes Moorehead and Louis Hayward. She earned an Academy Award
  nomination for The Night of the Iguana (1964) and played Dr. Julia Hoffman on the gothic soap Dark Shadows.

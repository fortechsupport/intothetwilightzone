bio: >-
  Joe Alves was one of the art directors on Night Gallery at Universal. He went on to design Jaws, building the
  mechanical shark with the effects crew, and Close Encounters of the Third Kind, which earned him an Academy Award
  nomination. He directed Jaws 3-D.

name: Patricia Breslin
roles:
- actor
born: '1931-03-25'
died: '2011-10-12'
bio: >-
  Patricia Breslin appeared in two original-series episodes: as Pat Carter, the young wife who pulls William Shatner
  away from a fortune-telling machine, in "Nick of Time" (1960), and as schoolteacher Abigail Sloan in "No Time
  Like the Past" (1963). She was a regular on Peyton Place and The People's Choice and later married Baltimore Ravens
  owner Art Modell.

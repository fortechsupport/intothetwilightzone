name: Susan Cummings
roles:
- actor
bio: >-
  Susan Cummings played Pat, the cryptographer's assistant who decodes the Kanamit book and shouts its famous warning,
  in "To Serve Man" (1962). She co-starred in the western series Union Pacific and appeared in 1950s westerns before
  retiring from acting.

bio: >-
  Kelton Garwood played the Hobo, one of the five lost figures trapped inside a giant cylinder, in "Five Characters
  in Search of an Exit" (1961). His most familiar television role was Percy Crump, the undertaker of Dodge City,
  in a long run of Gunsmoke episodes. He also worked later under the name Jonathan Harper.

tz_credits:
- series: The Twilight Zone (1959)
  work: series
  role: art director (credited 1959-1964)
bio: >-
  George W. Davis is credited as art director on the original Twilight Zone for its whole run, as head of the MGM
  art department whose standing sets, props and backlot streets gave the series much of its look. Before moving
  to MGM he worked at 20th Century-Fox, where he shared Academy Awards for the art direction of All About Eve and
  The Robe. At MGM his name appeared on most of the studio's film and television output of the 1960s, so on the
  Twilight Zone his credit usually sits alongside a unit art director such as William Ferrari, Merrill Pye or Phil
  Barber.

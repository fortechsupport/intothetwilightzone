bio: >-
  Stephen Boyd starred as agent Grant in Fantastic Voyage (1966), based on a story by Twilight Zone writer Jerome
  Bixby and Otto Klement. The Northern Irish actor won a Golden Globe as Messala in Ben-Hur and appeared in The
  Fall of the Roman Empire.

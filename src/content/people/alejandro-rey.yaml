bio: >-
  Alejandro Rey starred in "The Doll of Death" (1973), a late Night Gallery hour about a jilted lover's voodoo revenge.
  The Argentine actor played the playboy Carlos Ramirez on The Flying Nun and also appeared in Fun in Acapulco and
  Moscow on the Hudson.

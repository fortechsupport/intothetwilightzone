bio: >-
  Steve Guttenberg starred as Buzzy Crocker, a disgraced reporter investigating a 1939 elevator disappearance, in
  Tower of Terror (1997), Disney's TV film based on The Twilight Zone Tower of Terror ride. He is best known for
  Police Academy, Cocoon, Three Men and a Baby and Short Circuit.

bio: >-
  Ukrainian-born director Boris Sagal directed two original-series episodes, The Silence and The Arrival.
  He worked prolifically in television and also directed the film The Omega Man (1971), based on Richard
  Matheson's I Am Legend. He was killed in 1981 in a helicopter accident while filming the miniseries
  World War III.

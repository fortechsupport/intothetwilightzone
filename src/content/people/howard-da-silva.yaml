name: Howard Da Silva
born: '1909-05-04'
died: '1986-02-16'
roles:
- actor
bio: >-
  Howard Da Silva guest-starred in "To Hang a Dead Man," an episode of Rod Serling's western The Loner. He created
  the role of Jud Fry in the original Broadway Oklahoma! and played Benjamin Franklin in 1776 on stage and screen.
  He was blacklisted in Hollywood in the 1950s after refusing to cooperate with the House Un- American Activities
  Committee, and won an Emmy for the 1978 drama Verna: USO Girl.

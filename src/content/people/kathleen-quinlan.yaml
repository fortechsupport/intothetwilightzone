bio: >-
  Kathleen Quinlan earned a Golden Globe nomination for I Never Promised You a Rose Garden and an Oscar
  nomination for Apollo 13. In Joe Dante's remake of 'It's a Good Life' she plays the kindly schoolteacher
  who gives a lonely boy a ride home and finds herself trapped in his cartoonish world.

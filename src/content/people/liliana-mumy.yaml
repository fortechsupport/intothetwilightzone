bio: >-
  Liliana Mumy played Audrey Fremont, Anthony Fremont's daughter with even greater powers, in "It's Still a Good
  Life" (2003), opposite her father Bill Mumy, who reprised his 1961 role. As a child she appeared in the Santa
  Clause sequels and Cheaper by the Dozen. She became a busy voice actress, voicing Mertle in Lilo & Stitch and
  Leni Loud in The Loud House.

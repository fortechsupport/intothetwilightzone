bio: >-
  Tom Troupe appeared in "Clean Kills and Other Trophies" (1971), the Night Gallery segment about a big- game hunter
  (Raymond Massey) and his son. A stage actor and teacher, he played Lt. Harold in Star Trek's "Arena" and was married
  for decades to actress Carole Cook. He died in July 2025 at 97.

born: '1918-10-23'
died: '1978-07-03'
bio: >-
  James Daly starred as Gart Williams, the burned-out advertising executive who dreams of a peaceful 1888 town where
  he can escape, in Rod Serling's "A Stop at Willoughby" (1960). He played Dr. Paul Lochner on Medical Center and
  the ape Honorious in Planet of the Apes, and was the father of actors Tyne Daly and Tim Daly.

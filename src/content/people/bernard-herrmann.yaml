died: '1975-12-24'
bio: >-
  Bernard Herrmann wrote the eerie, little-remembered theme used during The Twilight Zone's first season
  and composed original scores for episodes including Where Is Everybody?, Walking Distance, The Lonely,
  Eye of the Beholder, Little Girl Lost and Living Doll; his cues were reused throughout the run from
  the CBS music library. He was already a celebrated film composer, from Citizen Kane through nine Hitchcock
  films including Vertigo and Psycho, and his last score was Taxi Driver.

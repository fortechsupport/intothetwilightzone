name: Julie Harris
born: '1925-12-02'
died: '2013-08-24'
roles:
- actor
bio: >-
  Julie Harris played Grace Miller, the employment counselor who tries to help Anthony Quinn's washed-up fighter,
  in the 1962 film of Rod Serling's Requiem for a Heavyweight. She won five Tony Awards, more than any other performer
  of her generation, including for I Am a Camera and The Belle of Amherst, and was nominated for an Academy Award
  for The Member of the Wedding. She also starred in East of Eden and The Haunting and played Lilimae Clements on
  Knots Landing.

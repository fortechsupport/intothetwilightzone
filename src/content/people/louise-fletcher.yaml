died: '2022-09-23'
roles:
- actor
bio: >-
  Louise Fletcher starred in "The Hunters," an episode of the 1985 revival's final season about an archaeologist
  who uncovers cave paintings that seem to come alive. She won the Academy Award for best actress as Nurse Ratched
  in One Flew Over the Cuckoo's Nest (1975). She later played the scheming religious leader Kai Winn on Star Trek:
  Deep Space Nine and earned Emmy nominations for Picket Fences and Joan of Arcadia.

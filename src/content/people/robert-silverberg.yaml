name: Robert Silverberg
born: '1935-01-15'
roles:
- author
bio: >-
  Robert Silverberg wrote "To See the Invisible Man" (1963), the story of a man sentenced to a year of social invisibility
  that became a 1986 episode of the 1985 revival. One of science fiction's most prolific authors, he has won multiple
  Hugo and Nebula awards for works such as Nightwings, A Time of Changes and Lord Valentine's Castle, and was named
  a Grand Master by the SFWA.

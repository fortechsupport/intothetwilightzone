born: '1955-04-08'
bio: >-
  Kane Hodder is credited in "Gramma" (1986), Harlan Ellison's adaptation of Stephen King's story about a boy left
  alone with his monstrous grandmother, a segment directed by Bradford May. A veteran stunt performer, he became
  the horror genre's most frequent Jason Voorhees, playing him in four Friday the 13th films, and later played Victor
  Crowley in the Hatchet series.

name: Dan Duryea
roles:
- actor
born: '1907-01-23'
died: '1968-06-07'
bio: >-
  Dan Duryea played Al Denton, the drunken former gunfighter given a second chance by a mysterious peddler, in "Mr.
  Denton on Doomsday" (1959), the series' third episode, and later guest-starred on Rod Serling's The Loner. He
  was a celebrated film-noir heel in Scarlet Street and The Woman in the Window and appeared in Winchester '73.

bio: >-
  Mike Nussbaum starred in "The 25th Hour," a Dennis Etchison story written for The Twilight Zone Radio Dramas rather
  than adapted from a television episode. A pillar of Chicago theater, he originated the role of George Aaronow
  in David Mamet's Glengarry Glen Ross and worked often with Mamet on stage and screen, including House of Games.
  His film work also includes Men in Black, and he kept performing on stage past his 95th birthday.

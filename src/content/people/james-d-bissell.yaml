bio: >-
  James D. Bissell was production designer of Twilight Zone: The Movie (1983). He had designed E.T. the Extra-Terrestrial
  for Steven Spielberg the year before, and later designed films including The Rocketeer, Jumanji and Good Night,
  and Good Luck.

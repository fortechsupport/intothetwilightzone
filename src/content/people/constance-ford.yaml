name: Constance Ford
born: '1923-07-01'
died: '1993-02-26'
roles:
- actor
bio: >-
  Constance Ford played Barbara Polk, the long-suffering niece who finally inherits her cruel uncle's house and
  his robot, in "Uncle Simon," opposite Cedric Hardwicke. She played Sandra Dee's domineering mother in A Summer
  Place (1959). On television she spent more than two decades as Ada Hobson on the NBC soap Another World.

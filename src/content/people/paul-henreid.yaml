born: '1908-01-10'
died: '1992-03-29'
bio: >-
  Paul Henreid directed two episodes of Rod Serling's western The Loner (1965-66), "One of the Wounded" and "The
  Ordeal of Bud Windom." Austrian-born, he became a Hollywood star in the 1940s as Victor Laszlo in Casablanca and
  as the man who lights two cigarettes in Now, Voyager. From the 1950s he worked mostly as a director, staging many
  episodes of Alfred Hitchcock Presents and the Bette Davis thriller Dead Ringer (1964).

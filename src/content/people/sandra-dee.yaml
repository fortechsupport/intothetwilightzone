bio: >-
  Sandra Dee starred in two Night Gallery segments, "Tell David..." (1971) and "Spectre in Tap-Shoes" (1972). A
  top teen star of the late 1950s and early 60s, she played the title role in Gidget and starred in Imitation of
  Life, A Summer Place and Tammy Tell Me True; she was married to Bobby Darin.

born: '1953-10-30'
bio: >-
  Charles Martin Smith starred in "The Beacon" (1985) as Dr. Dennis Barrows, a doctor stranded in a coastal town
  whose people make offerings to their lighthouse. He played Terry "the Toad" in American Graffiti, the biologist
  in Never Cry Wolf and the accountant-agent Oscar Wallace in The Untouchables, and later directed films including
  Dolphin Tale (2011).

bio: >-
  Adrienne Barbeau starred in "Teacher's Aide," a 1985 revival segment in which a high-school teacher is possessed
  by a malevolent force while fighting a gang of delinquents. She first became known as Bea Arthur's daughter Carol
  on Maude, then became a horror and genre icon in John Carpenter's The Fog and Escape from New York, Creepshow
  and Swamp Thing. She later voiced Catwoman on Batman: The Animated Series.

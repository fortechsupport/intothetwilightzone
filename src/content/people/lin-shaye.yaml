born: '1943-10-12'
bio: >-
  Lin Shaye appeared in "Chameleon" (1985), an early segment of the 1980s revival about a shape-shifting alien aboard
  a space shuttle. A character actress who became a horror icon, she is known for A Nightmare on Elm Street, There's
  Something About Mary and as the psychic Elise Rainier in the Insidious films.

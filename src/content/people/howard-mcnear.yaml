name: Howard McNear
born: '1905-01-27'
died: '1969-01-03'
roles:
- actor
bio: >-
  Howard McNear appeared in two original-series comedies, as one of the cronies of Andy Devine's tall-tale teller
  in "Hocus-Pocus and Frisby" and as Bramhoff in "The Bard." He is best known as Floyd Lawson, the distracted barber
  of Mayberry on The Andy Griffith Show. Before that he was Doc Adams on the radio version of Gunsmoke for its whole
  run. He kept playing Floyd after a stroke in 1963, with the show staging his scenes so he could stay seated.

bio: >-
  Bill Erwin appeared in three original-series episodes: "Walking Distance," "Mr. Denton on Doomsday" and "Will
  the Real Martian Please Stand Up?" Decades later he voiced a role in the radio drama version of "Ninety Years
  without Slumbering." A character actor for more than sixty years, he earned an Emmy nomination for playing the
  cranky retiree Sid Fields on Seinfeld and was also in Somewhere in Time and Home Alone.

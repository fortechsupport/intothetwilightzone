name: John Hoyt
roles:
- actor
born: '1905-10-05'
died: '1991-09-15'
bio: >-
  John Hoyt appeared twice in the original Twilight Zone: as Dr. Loren, the inventor whose household is run by lifelike
  robots, in "The Lateness of the Hour," and as one of the snowbound diner customers in "Will the Real Martian Please
  Stand Up?" He also guested in "An Echo of Bugles," the first episode of Serling's western The Loner. A stage-trained
  character actor, he played Decius Brutus in MGM's Julius Caesar (1953), Dr. Boyce in the original Star Trek pilot
  "The Cage," and the grandfather on the sitcom Gimme a Break!

born: '1930-02-06'
died: '2009-06-15'
bio: >-
  Allan King directed "Dream Me a Life" (1988), a third-season revival episode made in Toronto, about a widower
  who helps a young woman haunted by her past. One of Canada's most important documentary filmmakers, he made the
  pioneering observational films Warrendale (1967) and A Married Couple (1969), and also directed dramatic features
  and television.

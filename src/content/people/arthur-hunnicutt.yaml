name: Arthur Hunnicutt
roles:
- actor
born: '1910-02-17'
died: '1979-09-26'
bio: >-
  Arthur Hunnicutt starred as Hyder Simpson, the old mountain hunter who learns he has died when his coon dog is
  barred from Heaven, in Earl Hamner Jr.'s "The Hunt" (1962). Specializing in folksy frontier roles, he was Oscar-nominated
  for The Big Sky (1952) and appeared in El Dorado and Cat Ballou.

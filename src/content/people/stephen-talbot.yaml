born: '1949-02-28'
bio: >-
  Stephen Talbot appeared as a boy in two original Twilight Zone episodes, "Static" (1961) and "The Fugitive" (1962).
  He was best known as a child actor for playing Gilbert Bates, Beaver's friend, on Leave It to Beaver. As an adult
  he became a journalist and documentary producer, making many films for PBS series including Frontline.

born: '1949-10-03'
bio: >-
  Jessica Harper starred as the singer Phoenix in Brian De Palma's rock-horror musical Phantom of the Paradise (1974),
  whose opening narration is spoken, uncredited, by Rod Serling. She went on to star in Dario Argento's Suspiria
  (1977), Woody Allen's Stardust Memories and Pennies from Heaven, and later wrote children's books and recorded
  children's music.

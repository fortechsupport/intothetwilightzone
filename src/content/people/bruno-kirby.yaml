bio: >-
  Bruno Kirby voiced roles in four of The Twilight Zone Radio Dramas, the full-cast audio remakes of the original
  series: "Mr. Bevis," "The Dummy," "The Last Night of a Jockey" and "What You Need." On screen he played the young
  Clemenza in The Godfather Part II and was best known for comic supporting turns in When Harry Met Sally..., City
  Slickers and Good Morning, Vietnam. He also appeared in Donnie Brasco and earned an Emmy nomination for The Larry
  Sanders Show. He died of leukemia at 57.

born: '1967-06-28'
bio: >-
  Gil Bellows has appeared in two Twilight Zone revivals: "Homecoming" (2003) on the UPN series and "You Might Also
  Like" (2020), the second-season finale of the Jordan Peele series. The Canadian actor played the young convict
  Tommy Williams in The Shawshank Redemption (1994) and Billy Thomas on Ally McBeal.

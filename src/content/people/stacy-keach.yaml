bio: >-
  Actor Stacy Keach serves as the narrator of The Twilight Zone Radio Dramas, taking the part Rod Serling
  played on television, delivering the openings and closings for the audio adaptations produced from 2002.
  Keach is best known on screen as private eye Mike Hammer and for films such as Fat City and The Long
  Riders, and he has a long career as a stage Shakespearean.

name: Randolph Mantooth
roles:
- actor
born: '1945-09-19'
bio: >-
  Randolph Mantooth appeared as one of the students in "Class of '99" (1971), Rod Serling's Night Gallery segment
  in which Vincent Price's professor gives a final examination to a class that turns out to be robots. He starred
  as the paramedic John Gage on Emergency! and was a long-time advocate for emergency medical services and Native
  American causes.

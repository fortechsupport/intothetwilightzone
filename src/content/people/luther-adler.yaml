name: Luther Adler
born: '1903-05-04'
died: '1984-12-08'
roles:
- actor
bio: >-
  Luther Adler starred as Arthur Castle, the struggling antiques dealer whose genie's wishes each come with a catch,
  in "The Man in the Bottle" (1960). A star of the Group Theatre who originated Joe Bonaparte in Golden Boy, he
  played villains in films such as D.O.A. and The Desert Fox.

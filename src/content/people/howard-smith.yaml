bio: >-
  Howard Smith played Oliver Misrell, the bellowing advertising boss whose "push, push, push" drives Gart Williams
  to dream of Willoughby, in "A Stop at Willoughby" (1960). A veteran stage actor, he created the role of Charley,
  Willy Loman's neighbour, in the original 1949 Broadway production of Death of a Salesman. On television he was
  a regular on Hazel as Harvey Griffin, and he played many blustering executives and officials in film and TV.

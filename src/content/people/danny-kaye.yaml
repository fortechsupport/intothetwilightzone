bio: >-
  Danny Kaye was a beloved comic star of films such as The Secret Life of Walter Mitty and White Christmas
  and a longtime UNICEF ambassador. In one of his final screen roles he played Gaspar, an elderly man
  guarding a watch that holds the world's last hour, in Harlan Ellison's "Paladin of the Lost Hour", often
  cited as a high point of the 1985 revival.

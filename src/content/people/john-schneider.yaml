bio: >-
  John Schneider played Bo Duke on The Dukes of Hazzard and Jonathan Kent on Smallville, alongside a country
  music career. He voiced the leads in four radio adaptations, including the series' versions of "Where
  Is Everybody" and "Nightmare at 20,000 Feet."

name: Kevin Bray
roles:
- director
bio: >-
  Kevin Bray directed "Rewind" (2003), an episode of the UPN revival of The Twilight Zone about a tape recorder
  that can turn back time. A music-video director who moved into features with All About the Benjamins and Walking
  Tall (2004), he later directed widely in episodic television.

name: Madelon Champion
roles:
- writer
bio: >-
  Madelon Champion is credited with the idea behind "I Shot an Arrow into the Air" (1960), the first-season episode
  Rod Serling scripted about astronauts stranded on what they believe is an alien asteroid, who turn on each other
  before discovering they are in the Nevada desert. Little else is known of her; she is one of the few outside contributors
  whose story ideas Serling bought for the first season.

born: '1927-07-06'
died: '2004-10-03'
bio: >-
  Janet Leigh starred in "Rendezvous in a Dark Place" (1989), a third-season segment of the 1980s revival about
  a woman who haunts funerals hoping to meet Death in person. Her career included Touch of Evil and The Manchurian
  Candidate, and she won a Golden Globe and an Oscar nomination as Marion Crane in Psycho (1960).

bio: >-
  Theodore Bikel starred in "Four O'Clock" as Oliver Crangle, a fanatical crank who believes he can shrink every
  evil person on Earth to two feet tall at four o'clock. Born in Vienna, he was nominated for an Academy Award for
  The Defiant Ones and created Captain von Trapp in the original Broadway The Sound of Music. He played Tevye in
  Fiddler on the Roof more than 2,000 times and was a well-known folk singer and president of Actors' Equity.

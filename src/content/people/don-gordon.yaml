bio: >-
  Don Gordon starred as Salvadore Ross, the brutish man who discovers he can trade anything, including youth and
  character, in "The Self-Improvement of Salvadore Ross" (1964). A close friend of Steve McQueen, he appeared with
  him in Bullitt, Papillon and The Towering Inferno, and made memorable appearances in The Outer Limits.

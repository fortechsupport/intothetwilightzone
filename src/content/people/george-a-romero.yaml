bio: >-
  George A. Romero created the syndicated horror anthology Tales from the Darkside (1983–88), whose narrated openings
  and twist-ending stories carried on the Twilight Zone format. He wrote its pilot, "Trick or Treat." With Stephen
  King he made the anthology film Creepshow (1982), but he is best known for inventing the modern zombie film with
  Night of the Living Dead (1968) and its sequels.

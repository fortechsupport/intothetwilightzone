bio: >-
  Theresa Saldana appeared in "Dead Woman's Shoes," the 1985 revival's remake of the original-series episode with
  Helen Mirren. She played Joe Pesci's on-screen wife in Raging Bull and Rachel Scali on The Commish. After surviving
  a near-fatal stabbing by an obsessed stalker in 1982, she founded the advocacy group Victims for Victims and campaigned
  for anti-stalking laws.

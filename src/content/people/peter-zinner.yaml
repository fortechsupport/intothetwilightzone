bio: >-
  Peter Zinner directed The Salamander (1981), a political thriller from Morris West's novel filmed from a screenplay
  Rod Serling had written before his death in 1975. It was Zinner's only feature as director. Born in Vienna, he
  was one of Hollywood's leading film editors, cutting The Godfather and The Godfather Part II and winning the Academy
  Award for The Deer Hunter. He also won an Emmy for editing War and Remembrance.

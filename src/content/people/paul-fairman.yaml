born: '1909'
died: '1977'
bio: >-
  Paul Fairman wrote "Brothers Beyond the Void" (1952), the story Rod Serling adapted as "People Are Alike All Over"
  (1960), in which a timid astronaut (Roddy McDowall) lands on a welcoming Mars and finds himself caged in a zoo
  exhibit. Fairman edited Amazing Stories and Fantastic, founded If magazine, and wrote prolifically under his own
  name and house pseudonyms.

bio: >-
  Beverly Garland guested on Serling's western The Loner ("Incident in the Middle of Nowhere," 1965) and later voiced
  a role in the Twilight Zone Radio Dramas adaptation of "Uncle Simon." She starred in Roger Corman films such as
  It Conquered the World, led the policewoman series Decoy (1957), and played Barbara Douglas on My Three Sons and
  Ellen Lane on Lois & Clark. She also gave her name to a Hollywood hotel she ran with her husband.

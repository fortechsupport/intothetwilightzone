bio: >-
  John Carradine was a fixture of John Ford and Cecil B. DeMille films and a horror icon who played Dracula
  for Universal. He was the stern monk guarding a captive Devil in "The Howling Man", and returned to
  the franchise a quarter-century later in the revival segment "Still Life".

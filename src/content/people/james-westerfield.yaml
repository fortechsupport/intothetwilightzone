bio: >-
  James Westerfield appeared in "Mr. Dingle, the Strong" (1961), Serling's comedy in which a meek vacuum salesman,
  played by Burgess Meredith, is given superhuman strength by visiting Martians. A burly character actor, he was
  in On the Waterfront, The Shaggy Dog and True Grit.

bio: >-
  Lucille Fletcher wrote "The Hitch-Hiker," the 1941 radio play first performed by Orson Welles that Rod Serling
  adapted for the first season of The Twilight Zone, changing the haunted driver from a man to Inger Stevens's Nan
  Adams. She is even better known for the radio thriller Sorry, Wrong Number (1943), which she adapted into the
  1948 film with Barbara Stanwyck. She later wrote suspense novels and was married for a time to composer Bernard
  Herrmann, for whose opera Wuthering Heights she wrote the libretto.

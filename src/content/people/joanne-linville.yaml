name: Joanne Linville
born: '1928-01-15'
died: '2021-06-20'
roles:
- actor
bio: >-
  Joanne Linville played Lavinia Godwin, the Southern widow who watches a procession of Civil War dead pass her
  ruined home, in Serling's "The Passersby" (1961). She is remembered by Star Trek fans as the Romulan commander
  in "The Enterprise Incident" and taught acting for decades after studying with Stella Adler.

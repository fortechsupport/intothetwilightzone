name: Patrick Macnee
roles:
- actor
born: '1922-02-06'
died: '2015-06-25'
bio: >-
  Patrick Macnee played the first officer of the doomed freighter Queen of Glasgow in the first-season episode "Judgment
  Night" (1959), and later appeared in the Night Gallery segment "Logoda's Heads" (1971) as a colonial officer in
  Africa. He is best known as the urbane John Steed in the British series The Avengers.

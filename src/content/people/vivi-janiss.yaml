name: Vivi Janiss
born: '1911'
died: '1988'
roles:
- actor
bio: >-
  Vivi Janiss played the long-suffering wife in two original-series episodes: Flora Gibbs, whose husband is consumed
  by a slot machine in "The Fever," and Edna Castle, the antique dealer's wife in "The Man in the Bottle." She was
  a familiar supporting actress on 1950s and 1960s television, with appearances on Dragnet and Leave It to Beaver
  among many others.

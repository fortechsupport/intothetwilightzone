name: Lurene Tuttle
born: '1907-08-29'
died: '1986-05-28'
roles:
- actor
bio: >-
  Lurene Tuttle appeared in "Sounds and Silences" (1964), the fifth-season comedy about a noise-loving ex- Navy
  man who comes to fear every sound. A star of radio drama, she played Effie Perine opposite Howard Duff's Sam Spade
  and was a sought-after acting coach; on screen she appeared in Psycho and the sitcom Julia.

bio: >-
  Jean-Marc Lofficier co-wrote Into the Twilight Zone: The Rod Serling Programme Guide (Virgin Publishing, 1995)
  with his wife Randy Lofficier. The book is a reference guide to the original series, the 1985 revival, the film
  and related works. The French-born writer and translator is known for his Doctor Who programme guides, his comics
  writing for American and French publishers, and his English translations of French bande dessinée and pulp fiction.

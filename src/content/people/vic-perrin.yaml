born: '1916-04-26'
died: '1989-07-04'
bio: >-
  Vic Perrin appeared in "People Are Alike All Over" (1960), in which an astronaut finds the Martians have built
  him a zoo cage, and in "Ring-a-Ding Girl" (1963). He is best known as the Control Voice that opened every episode
  of The Outer Limits ("There is nothing wrong with your television set"), and did extensive radio, cartoon and
  dubbing work, including the voice of Nomad on Star Trek.

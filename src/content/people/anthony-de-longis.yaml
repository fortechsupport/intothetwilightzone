bio: >-
  Anthony De Longis appeared in "The Convict's Piano" (1986), a 1980s-revival segment about a prisoner whose piano
  carries him back to the lives of great composers. He is a swordsman, whip expert and fight choreographer as well
  as an actor, known for Blade in Masters of the Universe (1987) and for work on Highlander: The Series.

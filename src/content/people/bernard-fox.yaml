bio: >-
  Bernard Fox appeared in "House – with Ghost" (1971), a comic Night Gallery segment about a man who wants a haunted
  house to scare off his wife. The Welsh-born actor is best remembered as the warlock Dr. Bombay on Bewitched and
  as Colonel Crittendon on Hogan's Heroes, and appeared in Titanic (1997).

bio: >-
  Modernist composer Leonard Rosenman wrote the score for a single Twilight Zone episode, And When the Sky Was Opened
  (1959), the first-season story of astronauts who vanish one by one after returning to Earth. He had broken into
  films scoring East of Eden and Rebel Without a Cause for James Dean, and later won Academy Awards for his adaptation
  work on Barry Lyndon and Bound for Glory.

name: Alan Smithee
roles:
- director
bio: >-
  "Alan Smithee" is the Directors Guild pseudonym used when a director disowns a work, and it is the director credit
  on the 1985 Twilight Zone episode "Paladin of the Lost Hour," Harlan Ellison's Hugo- winning story. Sources attribute
  the actual direction to Gilbert Cates. The name was used on films and TV from 1969 until the Guild retired it
  around 2000.

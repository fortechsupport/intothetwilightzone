born: '1925-07-06'
died: '2012-01-29'
bio: >-
  John Rich directed two comic original-series episodes, "A Most Unusual Camera" (1960) and "A Kind of a Stopwatch"
  (1963). He became one of television comedy's leading directors, with episodes of The Dick Van Dyke Show and Gilligan's
  Island and, most notably, All in the Family, for which he won Emmy Awards.

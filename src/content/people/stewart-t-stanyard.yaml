bio: >-
  Stewart T. Stanyard wrote Dimensions Behind the Twilight Zone: A Backstage Tribute to Television's Groundbreaking
  Series (ECW Press, 2007). The book is built around rare behind-the-scenes photographs from the original series'
  production, with commentary on the production. It is a key visual source for how the series was made at MGM and
  on location.

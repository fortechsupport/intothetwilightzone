bio: >-
  Gary Crosby starred in "Come Wander with Me" as Floyd Burney, a rockabilly singer who goes hunting for an authentic
  folk song in the backwoods and finds a ballad that foretells his death. The eldest son of Bing Crosby, he recorded
  with his father and brothers and later played Officer Ed Wells on Adam-12. His 1983 memoir Going My Own Way described
  his father's harsh discipline.

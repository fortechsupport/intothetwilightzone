bio: >-
  John Ashton appeared in "Chameleon" (1985), a segment of the revival's second broadcast in which an astronaut
  returns from orbit carrying an alien that can take on any form. He is best remembered as Sergeant Taggart in Beverly
  Hills Cop and its sequel and as the bounty hunter Marvin Dorfler in Midnight Run.

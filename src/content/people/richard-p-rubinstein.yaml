bio: >-
  Richard P. Rubinstein was executive producer of Tales from the Darkside (1983–88), the Twilight Zone-style anthology
  he made with George A. Romero through their company Laurel Entertainment. He also produced Romero's Dawn of the
  Dead and the anthology film Creepshow. His later productions include Pet Sematary (1989) and the miniseries Frank
  Herbert's Dune (2000).

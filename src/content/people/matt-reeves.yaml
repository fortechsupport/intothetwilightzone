bio: >-
  Matt Reeves was hired by Warner Bros. in 2011 to direct a new Twilight Zone feature film, one of several directors
  attached to the long-stalled project before he left it. He co-created Felicity and directed Cloverfield, Let Me
  In, Dawn and War for the Planet of the Apes and The Batman (2022).

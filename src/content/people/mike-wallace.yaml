bio: >-
  Mike Wallace appears in the 1995 PBS American Masters documentary Rod Serling: Submitted for Your Approval, which
  uses his famous September 1959 interview with Serling, just before The Twilight Zone premiered, in which Serling
  talked about sponsor interference and his move into a weekly fantasy series. A longtime 60 Minutes correspondent,
  Wallace won numerous Emmys and Peabodys.

bio: >-
  French filmmaker Robert Enrico made La Rivière du hibou (1962), an adaptation of Ambrose Bierce's An
  Occurrence at Owl Creek Bridge, as an independent short. Needing to save money late in the fifth season,
  The Twilight Zone bought the US rights and broadcast it in February 1964 with a new Serling introduction,
  the only episode not produced for the series. The film won the Palme d'Or for short film at Cannes and,
  after its TV airing, the Academy Award for best live-action short.

bio: >-
  Barry Corbin appeared in "Dead Run," the 1986 revival segment about a trucker who discovers he is hauling souls
  to Hell. A Texas-born character actor, he played Maurice Minnifield on Northern Exposure and appeared in Urban
  Cowboy, WarGames, Lonesome Dove and No Country for Old Men.

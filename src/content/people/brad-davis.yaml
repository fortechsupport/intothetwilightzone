born: '1949-11-06'
died: '1991-09-08'
bio: >-
  Brad Davis played Arthur Lewis, the husband of a woman tempted to push a button that will kill a stranger, in
  the 1986 adaptation of Richard Matheson's "Button, Button." He won a Golden Globe for Midnight Express and starred
  in Chariots of Fire and Querelle before his death from AIDS-related illness.

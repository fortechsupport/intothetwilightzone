born: '1931'
died: '2013'
bio: >-
  Gail Kobe appeared in two original-series episodes: as Leah Maitland, the woman Salvadore Ross remakes himself
  to win, in "The Self-Improvement of Salvadore Ross" (1964), and as Jessica, the fiancée of the android Alan Talbot,
  in "In His Image" (1963). After a busy acting career in 1950s and 1960s television, including Peyton Place, she
  became a daytime producer, notably of Guiding Light.

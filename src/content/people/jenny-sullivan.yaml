bio: >-
  Jenny Sullivan appeared in "Tell David..." (1971), the Night Gallery segment in which a woman glimpses the future
  and the man her son will become. The daughter of actor Barry Sullivan, she acted in film and television in the
  1970s and later became a stage director and playwright, writing J for J about her family.

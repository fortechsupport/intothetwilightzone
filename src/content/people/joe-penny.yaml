bio: >-
  Joe Penny starred in "The Convict's Piano" (1986), a revival episode in which a prison inmate finds that an old
  piano lets him travel into the lives of the musicians who once played it. He is best known as Nick Ryder on Riptide
  and Jake's partner Derek Mitchell on Jake and the Fatman.

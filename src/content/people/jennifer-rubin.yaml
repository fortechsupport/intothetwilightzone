bio: >-
  Jennifer Rubin appeared in "Song of the Younger World" (1987), a late 1985 revival segment set in a 1940s reform
  school, about two young lovers who escape into the bodies of wolves. She is known as Taryn in A Nightmare on Elm
  Street 3: Dream Warriors and appeared in Bad Dreams and The Doors.

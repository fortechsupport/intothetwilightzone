bio: >-
  Keenan Wynn, son of Ed Wynn, was an MGM contract player who became one of Hollywood's busiest character
  actors, with roles in Dr. Strangelove and Disney comedies. He starred in "A World of His Own", the playwright
  who can conjure people by dictating into a recorder, the episode that famously ends with Rod Serling
  himself being written out of existence.

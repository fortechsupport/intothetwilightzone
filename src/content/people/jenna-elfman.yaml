name: Jenna Elfman
born: '1971-09-30'
roles:
- actor
bio: >-
  Jenna Elfman co-starred in "A Human Face," a 2020 episode of the Jordan Peele revival in which grieving parents
  encounter an alien that can take the form of their dead daughter. She won a Golden Globe as the free-spirited
  Dharma on Dharma & Greg (1997-2002). Her later work includes Fear the Walking Dead and films such as EDtv and
  Keeping the Faith.

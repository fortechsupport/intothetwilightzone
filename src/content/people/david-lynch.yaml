bio: >-
  David Lynch directed Mulholland Drive (2001), which critics have ranked among the great Twilight Zone- style films
  for its dream logic and identity-swapping Hollywood mystery. His work includes Eraserhead, The Elephant Man, Blue
  Velvet and Twin Peaks, and he received an honorary Academy Award in 2019.

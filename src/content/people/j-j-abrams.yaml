born: '1966-06-27'
bio: >-
  J.J. Abrams wrote and directed Super 8 (2011), a story of kids filming a monster movie in 1979, which press coverage
  tied to his love of The Twilight Zone; he has named "Walking Distance" among his favorite episodes. Abrams co-created
  Lost and Fringe, both steeped in Twilight Zone-style twists, and directed Star Trek (2009) and Star Wars: The
  Force Awakens (2015).

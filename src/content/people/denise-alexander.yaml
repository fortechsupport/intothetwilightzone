bio: >-
  Denise Alexander played Jody Sturka, the daughter of Fritz Weaver's bomb-plant scientist who flees a doomed world
  with his family, in "Third from the Sun." She became a daytime-drama star, first as Susan Hunter Martin on Days
  of Our Lives and then for nearly two decades as Dr. Lesley Webber on General Hospital.

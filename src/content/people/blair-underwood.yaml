bio: >-
  Blair Underwood rose to fame as attorney Jonathan Rollins on L.A. Law and has worked across film, television
  and audio. He is one of the most frequent leads of the Twilight Zone radio dramas, voicing the star
  roles in adaptations including "To Serve Man" and "The Big Tall Wish."

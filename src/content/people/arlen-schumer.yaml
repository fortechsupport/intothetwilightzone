name: Arlen Schumer
roles:
- author
- historian
- scholar
- designer
bio: >-
  Arlen Schumer wrote and designed Visions from the Twilight Zone (Chronicle Books, 1990), a large-format book that
  pairs frame grabs from the original series with Serling's narrations and treats the show as visual art. He returned
  to the subject with The Five Themes of the Twilight Zone (BearManor Media, 2024), and he presents illustrated
  talks on the series' themes and imagery. Schumer is a graphic designer and comic-art historian, best known in
  that field for The Silver Age of Comic Book Art.

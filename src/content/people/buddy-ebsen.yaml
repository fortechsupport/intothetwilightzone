name: Buddy Ebsen
roles:
- actor
born: '1908-04-02'
died: '2003-07-06'
bio: >-
  Buddy Ebsen played Jimbo Cobb, the diner cook whose telekinetic power his greedy partner uses to gamble, in "The
  Prime Mover" (1961), and returned to Serling's world in the Night Gallery segment "The Waiting Room" (1972). A
  song-and-dance man of 1930s MGM musicals who was cast as the Tin Man in The Wizard of Oz before the aluminum makeup
  made him ill, he became a television star as Jed Clampett on The Beverly Hillbillies and as the detective Barnaby
  Jones.

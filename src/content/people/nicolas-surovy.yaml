bio: >-
  Nicolas Surovy appeared in "Little Boy Lost," a 1985 revival segment about a photographer haunted by a boy who
  may be the child she has chosen not to have. The son of opera star Risë Stevens, he worked widely in stage, film
  and television, with credits including Forever Young and the series Bridges to Cross.

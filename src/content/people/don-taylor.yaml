bio: >-
  Don Taylor directed two of Rod Serling's most admired Night Gallery segments, "They're Tearing Down Tim Riley's
  Bar" (1971) and "The Messiah on Mott Street" (1971), and episodes of Serling's western The Loner. As an actor
  he played Elizabeth Taylor's fiance in Father of the Bride and appeared in Stalag 17. As a director he made Escape
  from the Planet of the Apes, The Island of Dr. Moreau (1977), Damien: Omen II and The Final Countdown.

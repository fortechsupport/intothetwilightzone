bio: >-
  Paul Stewart directed "Little Girl Lost," the third-season episode from Richard Matheson's story about a child
  who falls through a wall into another dimension. A veteran of Orson Welles's Mercury Theatre, he worked on the
  1938 War of the Worlds broadcast and played Kane's butler Raymond in Citizen Kane. He was a sharp-edged character
  actor in films such as Champion, The Bad and the Beautiful and Kiss Me Deadly.

name: Paul Bryar
born: '1910'
died: '1985'
roles:
- actor
bio: >-
  Paul Bryar was in the cast of The Time Element (1958), the Desilu Playhouse drama by Rod Serling that led directly
  to The Twilight Zone. A familiar face as policemen, bartenders and other small parts in hundreds of films and
  TV episodes from the 1940s on, he was married to actress Claudia Bryar.

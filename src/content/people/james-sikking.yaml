bio: >-
  James Sikking (later billed as James B. Sikking) appeared in two Night Gallery segments: "The Nature of the Enemy"
  (1970), as part of a lunar mission control team, and "Death in the Family" (1971). He became best known as the
  hawkish SWAT commander Howard Hunter on Hill Street Blues and as the father on Doogie Howser, M.D.

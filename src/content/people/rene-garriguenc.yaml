name: René Garriguenc
bio: >-
  French-born CBS staff composer and arranger who supplied library music and arrangements for many CBS series. His
  'Jazz Theme #3' source cue turns up in several Twilight Zone episodes, and he arranged other library material
  (including a Dimitri Tiomkin piece) that was tracked into the show.

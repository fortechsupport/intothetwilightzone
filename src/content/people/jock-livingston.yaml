bio: >-
  Jock Livingston appeared in "Pickman's Model" (1971), Night Gallery's adaptation of H. P. Lovecraft's story about
  a Boston painter whose monsters are drawn from life, with Bradford Dillman and Louise Sorel. He was a character
  actor in film and television from the 1940s to the 1970s.

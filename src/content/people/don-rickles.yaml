born: '1926-05-08'
died: '2017-04-06'
bio: >-
  Don Rickles played one of the boorish barroom bettors who mock Burgess Meredith's meek vacuum-cleaner salesman
  in "Mr. Dingle, the Strong" (1961), before aliens hand Dingle superhuman strength. The insult comic of Las Vegas
  and the Tonight Show, he also acted in Run Silent, Run Deep, Kelly's Heroes and Casino, and voiced Mr. Potato
  Head in the Toy Story films.

name: Francis Lederer
roles:
- actor
born: '1899-11-06'
died: '2000-05-25'
bio: >-
  Francis Lederer played the courtly Balkan nobleman who turns out to be Count Dracula in "The Devil Is Not Mocked"
  (1971), Night Gallery's tale of a Nazi unit that occupies the wrong castle; he had already played the vampire
  in The Return of Dracula (1958). Born in Prague, he was a European stage and film star, opposite Louise Brooks
  in Pandora's Box (1929), before working in Hollywood. He lived to the age of 100.

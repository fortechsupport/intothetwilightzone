bio: >-
  Nancy Kulp played Mrs. Gann, the harsh aunt from whom young Jenny longs to escape, in "The Fugitive" (1962). She
  worked as a journalist, served in the WAVES during World War II and was a publicist at MGM before she began acting.
  She is best known as the prim banker's secretary Jane Hathaway on The Beverly Hillbillies (1962-71), which earned
  her an Emmy nomination, and in 1984 she ran for Congress in Pennsylvania as a Democrat.

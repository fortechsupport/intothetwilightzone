name: M. Emmet Walsh
roles:
- actor
born: '1935-03-22'
died: '2024-03-19'
bio: >-
  M. Emmet Walsh played one of the poker players who discover their new card partner is the Devil in "Dealer's Choice"
  (1985), a first-season segment of the 1985 revival. A ubiquitous character actor, he is remembered for the corrupt
  detective in the Coens' Blood Simple, Bryant in Blade Runner and dozens of other film roles from Midnight Cowboy
  to Knives Out.

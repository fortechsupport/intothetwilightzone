name: Eugene Clark
born: '1955'
roles:
- actor
bio: >-
  Eugene Clark appeared in "The Wall," the Atom Egoyan-directed segment of the 1985 revival's Canadian- produced
  final season. He worked extensively in Toronto-based film and television, including the science- fiction series
  TekWar. Horror fans know him best as Big Daddy, the zombie who leads the dead against the city in George A. Romero's
  Land of the Dead (2005).

bio: >-
  Kenneth Welsh appeared in "Acts of Terror" (1988), a Toronto-filmed third-season episode of the 1985 revival about
  an abused wife who finds an unexpected avenger. The Canadian actor played the chess-playing villain Windom Earle
  on Twin Peaks and appeared in The Day After Tomorrow and The Aviator.

bio: >-
  Alan Sues played Wilfred Harper Jr., the brutish grandson whose mask shows a leering idiot, in "The Masks" (1964),
  a rare straight dramatic role for him. He became famous as a member of the cast of Rowan & Martin's Laugh-In (1968-72),
  where his characters included the sportscaster Big Al and the hungover children's host Uncle Al. Before television
  he worked on Broadway, including Tea and Sympathy.

bio: >-
  Koren Shadmi wrote and drew The Twilight Man: Rod Serling and the Birth of Television (Life Drawn/Humanoids, 2019),
  a graphic-novel biography of Serling. It follows his life from the war and live television to The Twilight Zone
  and his final years. Shadmi is an Israeli-born illustrator and cartoonist based in New York, and he later produced
  a similar graphic biography of Bela Lugosi.

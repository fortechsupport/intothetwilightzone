bio: >-
  René Auberjonois played William Gropper, the owner of a strange camera that shows a moneylender the ghostly truth
  about his town, in "Camera Obscura" (1971), a Night Gallery segment. He played Father Mulcahy in M*A*S*H (1970),
  Clayton Endicott III on Benson and Odo on Star Trek: Deep Space Nine, and voiced Chef Louis in The Little Mermaid.

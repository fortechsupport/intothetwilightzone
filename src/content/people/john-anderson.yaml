name: John Anderson
roles:
- actor
born: '1922-10-20'
died: '1992-08-07'
bio: >-
  John Anderson acted in four original Twilight Zone episodes: as Gabriel, the gentle trumpeter-angel, in "A Passage
  for Trumpet"; as Captain Farver, the pilot whose jet slips back through time, in "The Odyssey of Flight 33"; in
  "Of Late I Think of Cliffordville"; and as Goldsmith, the leader of a post-nuclear town, in "The Old Man in the
  Cave." A lanky, craggy-faced character actor, he played the used-car dealer in Psycho (1960), Abraham Lincoln
  several times, and MacGyver's grandfather Harry Jackson.

born: '1975-10-29'
bio: >-
  Michael Schur created The Good Place (2016-2020), the NBC comedy whose first-season twist, that the heavenly afterlife
  is really a subtle hell, echoes the original series' "A Nice Place to Visit." A former Saturday Night Live writer
  and producer of The Office, he co-created Parks and Recreation and Brooklyn Nine-Nine.

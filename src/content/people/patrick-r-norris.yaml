bio: >-
  Patrick Norris is an American television director credited on the 2002 revival episodes "Hunted" and
  "Sanctuary". He won two Emmys for costuming thirtysomething and has directed
  episodes of The O.C., Friday Night Lights, Gossip Girl, Chuck, Bones and The Vampire Diaries.

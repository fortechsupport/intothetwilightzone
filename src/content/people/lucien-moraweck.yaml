bio: >-
  Lucien Moraweck is credited for music on the original Twilight Zone, largely through cues he wrote for the CBS
  music library that the series used to fill out its scores. A composer and arranger for CBS radio and television,
  he was part of the network's Hollywood staff alongside Rene Garriguenc and Lud Gluskin. His library cues are heard
  in a number of episodes that had no original score of their own.

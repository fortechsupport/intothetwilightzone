name: Esther Serling
roles:
- family
bio: >-
  Esther Cooper Serling was Rod Serling's mother. She raised Rod and his older brother Robert in Syracuse and then
  Binghamton, New York. Biographers describe her as a doting parent in the close family whose home life fed the
  nostalgia of Serling's Twilight Zone scripts.

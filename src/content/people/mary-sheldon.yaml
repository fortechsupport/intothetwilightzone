bio: >-
  Mary Sheldon wrote "Need to Know" (1986), a 1980s-revival segment starring William L. Petersen as a census taker
  investigating a town where people are going mad from a terrible piece of knowledge. The daughter of novelist Sidney
  Sheldon, she later published her own novels and continued his franchise of thrillers under his name.

name: Martin E. Brooks
roles:
- actor
born: '1925-11-30'
died: '2015-12-07'
bio: >-
  Martin E. Brooks appeared in "The Last Laurel" (1971), a first-season Night Gallery segment about a paralyzed
  former athlete who uses astral projection to spy on his wife. He is best known as Dr. Rudy Wells, the scientist
  who oversees the bionic agents in The Six Million Dollar Man and The Bionic Woman, and played Arthur Cogswell
  on Dallas.

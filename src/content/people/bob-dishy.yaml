bio: >-
  Bob Dishy co-starred with Avery Schreiber in "Act Break" (1985), the 1985-revival segment about a playwriting
  partner who wishes his way into Shakespeare's London. A Broadway and film comic actor, he appeared in Lovers and
  Other Strangers and The Last Married Couple in America.

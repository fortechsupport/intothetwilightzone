born: '1948-04-30'
bio: >-
  Allan Arkush directed "The Misfortune Cookie" (1986), the revival's adaptation of Charles E. Fritch's story about
  a vicious food critic undone by a Chinese restaurant's fortune cookies. A Roger Corman alumnus, he directed Rock
  'n' Roll High School (1979) and Get Crazy, then became a prolific television director and producer on Moonlighting,
  Ally McBeal and Heroes.

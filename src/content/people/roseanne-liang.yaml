bio: >-
  Roseanne Liang directed and co-wrote Shadow in the Cloud (2020), in which Chloë Grace Moretz's flight officer
  on a World War II bomber sees a gremlin attacking the plane and no one believes her, a reworking of the premise
  of "Nightmare at 20,000 Feet." The New Zealand filmmaker earlier made the romantic comedy My Wedding and Other
  Secrets, drawn from her own life.

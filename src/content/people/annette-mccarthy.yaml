bio: >-
  Annette McCarthy appeared in "Cold Reading" (1986), a segment of the 1985 revival in which a live radio adventure
  serial in 1940s Hollywood starts conjuring its sound effects into reality. She is best known for playing the scheming
  Evelyn Marsh on Twin Peaks (1990-91).

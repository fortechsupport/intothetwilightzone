born: '1954'
bio: >-
  Alan Brennert was the 1985 revival's most prolific writer and one of its producers, and his adaptation
  of Harlan Ellison's Shatterday, starring Bruce Willis, opened the series. His scripts, including Her
  Pilgrim Soul, A Message from Charity, Healer and The Cold Equations, are among the revival's most admired.
  He later won an Emmy as a producer of L.A. Law and became a bestselling novelist with Moloka'i.

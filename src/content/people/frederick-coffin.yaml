bio: >-
  Frederick Coffin appeared in "The Misfortune Cookie" (1986), Harlan Ellison's adaptation of Charles E. Fritch's
  story about a food critic undone by his fortune cookies. A stage-trained character actor, he appeared in films
  including Mother's Boys and V. I. Warshawski and many television dramas.

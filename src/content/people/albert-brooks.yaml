bio: >-
  Albert Brooks is a comedian, writer-director and actor known for Lost in America, Defending Your Life
  and an Oscar-nominated turn in Broadcast News, as well as voicing Marlin in Finding Nemo. He plays the
  nervous driver in the film's prologue, singing TV theme songs on a dark highway with Dan Aykroyd.

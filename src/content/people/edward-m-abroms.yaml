born: '1935'
died: '2018'
bio: >-
  Edward M. Abroms directed "Something in the Woodwork" (1973), a late Night Gallery hour about a lonely woman (Geraldine
  Page) who befriends a ghost in her attic. An Emmy-winning editor, he cut Steven Spielberg's early work including
  The Sugarland Express and was nominated for an Academy Award for editing Blue Thunder (1983).

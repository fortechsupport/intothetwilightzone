bio: >-
  Jus Addiss directed two second-season episodes: "The Odyssey of Flight 33" (1961), about an airliner thrown back
  in time to the age of dinosaurs, and "The Rip Van Winkle Caper" (1961). Born Justus Addiss, he directed episodic
  television and later the 1965 film The Cat.

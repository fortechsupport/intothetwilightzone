bio: >-
  Russell Collins played Ben Conroy, the old friend who refuses to join Charles Whitley's game of kick the can and
  is left behind when the others become children again, in "Kick the Can" (1962). A stage actor of long standing,
  he moved into films in the 1950s, including Bad Day at Black Rock (1955), where he played the telegraph operator.
  He also made many television drama appearances before his death in the mid-1960s.

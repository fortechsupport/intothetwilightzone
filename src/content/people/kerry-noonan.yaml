bio: >-
  Kerry Noonan played Charity Payne, the colonial girl who shares a telepathic bond with a modern teenager, in "A
  Message from Charity" (1985), adapted from William M. Lee's story. The following year she played camp counselor
  Paula in Friday the 13th Part VI: Jason Lives (1986).

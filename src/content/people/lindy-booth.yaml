name: Lindy Booth
roles:
- actor
born: '1979-04-02'
bio: >-
  Lindy Booth is a Canadian actress from Oakville, Ontario, who played Shannon, the young wife of an aging
  magician, in the 2002 revival episode "The Pharaoh's Curse". She is best known as Cassandra Cillian on The
  Librarians, and her other credits include Relic Hunter, Dawn of the Dead and Cry Wolf.

bio: >-
  John Hora photographed Joe Dante's It's a Good Life segment of Twilight Zone: The Movie (1983), with its cartoon-colored
  house. He was Dante's regular cinematographer in the 1980s, shooting The Howling, Gremlins, Explorers and Innerspace.

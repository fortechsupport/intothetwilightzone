born: '1929-01-02'
died: '1967-02-21'
bio: >-
  Born Charles Leroy Nutt, Charles Beaumont was a central figure in the circle of Southern California
  writers who supplied The Twilight Zone with many of its best scripts, receiving credit on about two
  dozen episodes including The Howling Man, Shadow Play and Number 12 Looks Just Like You. From around
  1963 a mysterious degenerative brain illness left him unable to work, and friends such as Jerry Sohl
  and OCee Ritch quietly ghostwrote scripts that went out under his name. He also wrote the films 7 Faces
  of Dr. Lao and The Masque of the Red Death, and died at just 38.

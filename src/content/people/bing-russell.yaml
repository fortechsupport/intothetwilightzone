born: '1926-05-05'
died: '2003-04-08'
bio: >-
  Bing Russell appeared in "The Arrival" (1961), the mystery of an airliner that lands with no one aboard, and in
  "Ring-a-Ding Girl" (1963), the story of a film star who returns to her hometown on the day of its annual picnic.
  He played Deputy Clem Foster on Bonanza for more than a decade, owned the independent minor-league Portland Mavericks
  baseball team, and was the father of actor Kurt Russell.

bio: >-
  Wayne Fitzgerald designed the main titles of Night Gallery, the eerie opening sequence that leads viewers into
  the gallery. A prolific title designer at Universal and elsewhere, he created titles for hundreds of films and
  series, including Bonnie and Clyde and The Godfather Part II. He died in 2019.

name: Selwyn Seyfu Hinds
roles:
- writer
bio: >-
  Selwyn Seyfu Hinds wrote "Replay," the 2019 episode of the Jordan Peele revival in which a Black mother's camcorder
  lets her rewind time again and again to save her son from a racist police officer. A journalist and author, he
  was editor-in-chief of The Source magazine and later worked as a screenwriter and producer for television.

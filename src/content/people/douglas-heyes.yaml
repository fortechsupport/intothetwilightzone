bio: >-
  Writer-director Douglas Heyes helmed nine episodes of the original series and was prized for visual
  ingenuity, most famously in Eye of the Beholder, where he staged the action so that no human face is
  seen until the final reveal. His other episodes include The Howling Man, The Invaders, The After Hours,
  The Chaser and Dust. He went on to a long television career that included writing and directing the
  miniseries Captains and the Kings.

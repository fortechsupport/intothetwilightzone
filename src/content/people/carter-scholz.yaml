bio: >-
  Carter Scholz is credited on "A Small Talent for War," a 1986 revival segment in which an alien envoy tells the
  United Nations that humanity has been judged lacking. He is a science-fiction writer and composer whose novella
  Radiance and story collections have been nominated for major genre awards, and who has written stories in collaboration
  with Jonathan Lethem.

bio: >-
  Martin Brooks (later billed as Martin E. Brooks) guest-starred in "Pick Me Another Time to Die" (1966), an episode
  of Rod Serling's western The Loner. A stage and television actor, he is best known as Dr. Rudy Wells in The Six
  Million Dollar Man and The Bionic Woman, and played Arthur Bradshaw on Dallas.

born: '1948-09-20'
bio: >-
  Before A Song of Ice and Fire made him world-famous, George R. R. Martin worked on staff for the 1985
  revival, his first television job. He adapted Roger Zelazny's The Last Defender of Camelot and wrote
  The Road Less Traveled, The Toys of Caliban, The Once and Future King and Lost and Found. The experience
  led him to Beauty and the Beast and a decade in Hollywood before his return to novels.

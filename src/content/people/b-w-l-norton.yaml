bio: >-
  B. W. L. (Bill) Norton directed two first-season episodes of the 1980s Twilight Zone revival: "Teacher's Aide,"
  about a teacher possessed by a demonic force in a tough high school, and "Monsters!," about a boy who befriends
  the vampire living next door. Norton wrote and directed the counterculture drama Cisco Pike (1972) and directed
  More American Graffiti (1979) and the dinosaur adventure Baby: Secret of the Lost Legend (1985), then worked mainly
  as a television director.

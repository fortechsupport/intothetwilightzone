bio: >-
  Mare Winningham starred in "Button, Button," the 1986 revival's adaptation of Richard Matheson's story about a
  couple offered money to push a button that will kill a stranger. She won Emmy Awards for Amber Waves and George
  Wallace and was nominated for an Academy Award for Georgia. Her films include St. Elmo's Fire, and she later earned
  a Tony nomination for Girl from the North Country.

born: '1972-08-07'
bio: >-
  Greg Serano is an American actor from Brooklyn who played Marco Flores, the friend who takes a dying man for
  one last ride, in the 2002 revival episode "Last Lap". He is known for Enrique Salvatore in Legally Blonde,
  Pablo Betart on Wildfire and Agent Juan Julio Medina on Power.

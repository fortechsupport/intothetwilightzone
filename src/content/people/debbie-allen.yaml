bio: >-
  Dancer, choreographer, actress and director Debbie Allen directed The Monsters Are on Maple Street for
  the 2002 revival, an update of Serling's 1960 parable of mob paranoia recast in a post-9/11 suburb.
  She is best known for Fame and for producing and directing A Different World and Grey's Anatomy.

name: Phyllis Kirk
roles:
- actor
born: '1927-09-18'
died: '2006-10-19'
bio: >-
  Phyllis Kirk played Mary, the wife whom Keenan Wynn's playwright created by dictating her into existence, in "A
  World of His Own" (1960), the first-season finale in which Rod Serling himself is written out of the story. She
  co-starred with Vincent Price in House of Wax (1953) and played Nora Charles on the television series The Thin
  Man.

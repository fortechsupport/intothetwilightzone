bio: >-
  Vladimir Sokoloff appeared in two original-series episodes, as the priest who counsels Peter Falk's revolutionary
  dictator in "The Mirror" and as the guitarist who befriends a visitor from another world in "The Gift," his final
  role. Born in Moscow and trained at the Moscow Art Theatre, he became one of Hollywood's busiest character actors,
  playing the old man in The Magnificent Seven and roles in For Whom the Bell Tolls and Mr. Sardonicus.

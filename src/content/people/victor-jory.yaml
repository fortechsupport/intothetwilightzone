born: '1902-11-23'
died: '1982-02-12'
bio: >-
  Victor Jory appeared in "The Burden of the Badge," a late episode of Rod Serling's western The Loner (1966). He
  played Oberon in A Midsummer Night's Dream (1935), the overseer Jonas Wilkerson in Gone with the Wind, and starred
  in the syndicated police series Manhunt.

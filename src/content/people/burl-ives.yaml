name: Burl Ives
born: '1909-06-14'
died: '1995-04-14'
roles:
- actor
bio: >-
  Burl Ives played the grandfather of a murdered girl who lures her killer to an isolated spot in "The Other Way
  Out," a third-season Night Gallery segment with Ross Martin. A folk singer before he was an actor, he won the
  Academy Award for best supporting actor for The Big Country (1958) and created Big Daddy in Cat on a Hot Tin Roof
  on stage and film. Generations know his voice as Sam the Snowman, the narrator of the Rankin/Bass special Rudolph
  the Red-Nosed Reindeer.

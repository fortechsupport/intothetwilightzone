name: Harry Guardino
roles:
- actor
born: '1925-12-23'
died: '1995-07-17'
bio: >-
  Harry Guardino starred in Rod Serling's Night Gallery segment "The Miracle at Camafeo" (1972), as a con man faking
  an injury who visits a Mexican shrine of healing. A tough-guy character actor, he played Lieutenant Bressler in
  Dirty Harry and The Enforcer, and was twice nominated for a Tony Award.

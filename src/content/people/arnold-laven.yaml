bio: >-
  Arnold Laven directed The Rack (1956), MGM's film of Rod Serling's teleplay about a Korean War POW tried for collaborating,
  starring Paul Newman. With partners Jules Levy and Arthur Gardner he produced television westerns including The
  Rifleman and The Big Valley.

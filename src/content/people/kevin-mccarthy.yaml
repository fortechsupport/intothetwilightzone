bio: >-
  Kevin McCarthy was an Oscar-nominated actor best remembered as the hero of Invasion of the Body Snatchers
  (1956). He played an ageless history professor hiding his immortality in "Long Live Walter Jameson",
  and later returned to the franchise as the sinister Uncle Walt in Joe Dante's segment of Twilight Zone:
  The Movie.

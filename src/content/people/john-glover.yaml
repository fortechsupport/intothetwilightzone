bio: >-
  John Glover played the alien envoy in "A Small Talent for War" (1986), the 1985-revival episode in which aliens
  judge humanity's fitness to survive. He is known as Lionel Luthor on Smallville and for Gremlins 2, Scrooged and
  the Broadway Love! Valour! Compassion!, which won him a Tony.

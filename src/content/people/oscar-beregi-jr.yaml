name: Oscar Beregi Jr.
roles:
- actor
born: '1918-01-12'
died: '1976-09-01'
bio: >-
  Oscar Beregi Jr. appeared in three original-series episodes: as the former SS Captain Gunther Lutze, tried by
  the ghosts of Dachau, in "Deaths-Head Revisited" (1961); as the scheming scientist Farwell in "The Rip Van Winkle
  Caper" (1961); and as Professor Karl Werner in "Mute" (1963). The Budapest-born son of a noted Hungarian actor,
  he was frequently cast as Germanic villains in 1960s television.

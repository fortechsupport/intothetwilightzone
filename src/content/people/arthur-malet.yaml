born: '1927-09-24'
died: '2013-07-18'
bio: >-
  Arthur Malet appeared in "Camera Obscura" (1971), the Night Gallery adaptation of Basil Copper's story about a
  moneylender lured into a hellish version of his town. The English character actor played the younger Mr. Dawes
  in Mary Poppins, the cemetery keeper in John Carpenter's Halloween (1978) and Tootles in Hook (1991).

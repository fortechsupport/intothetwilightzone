name: Esai Morales
roles:
- actor
born: '1962-10-01'
bio: >-
  Esai Morales starred as the ambitious pool player Jesse Cardiff opposite Maury Chaykin's ghostly champion Fats
  Brown in the 1989 remake of George Clayton Johnson's "A Game of Pool," which used Johnson's original ending rather
  than the one aired in 1961. He came to prominence in La Bamba (1987), played Lt. Tony Rodriguez on NYPD Blue,
  and was the villain Gabriel in Mission: Impossible - Dead Reckoning (2023).

bio: >-
  Science fiction novelist and screenwriter Jerry Sohl received no on-screen credit on The Twilight Zone,
  yet he wrote three episodes that aired under Charles Beaumont's name after Beaumont's illness left him
  unable to work: The New Exhibit, Living Doll and Queen of the Nile. Beaumont insisted they split the
  fees. Sohl also wrote for The Outer Limits and Star Trek and published more than twenty novels, including
  The Haploids and Night Slaves.

bio: >-
  Mel Tormé played the browbeaten brother of Mickey Rooney's monstrous TV comic in The Comedian (1957), Rod Serling's
  Emmy-winning Playhouse 90 adaptation. The jazz singer known as "the Velvet Fog" co-wrote "The Christmas Song"
  and won two Grammys.

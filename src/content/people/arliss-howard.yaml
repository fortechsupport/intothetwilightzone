bio: >-
  Arliss Howard starred in "Kentucky Rye" (1985), a 1985-revival segment about a drunk driver who enters a bar he
  can never leave. He played Cowboy in Full Metal Jacket and appeared in The Lost World: Jurassic Park and Moneyball;
  he is married to actress Debra Winger.

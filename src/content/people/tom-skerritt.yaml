name: Tom Skerritt
born: '1933-08-25'
roles:
- actor
bio: >-
  Tom Skerritt starred in "What Are Friends For?," a 1986 revival segment in which a lonely boy's imaginary friend
  proves to be the father's childhood companion too. He played Captain Dallas in Alien, Viper in Top Gun and Duke
  in Robert Altman's M*A*S*H. He won an Emmy as Sheriff Jimmy Brock on Picket Fences, and his films also include
  Steel Magnolias and A River Runs Through It.

name: Michael Constantine
roles:
- actor
born: '1927-05-22'
died: '2021-08-31'
bio: >-
  Michael Constantine played the sheriff who must preside over an execution in a town where the sun will not rise,
  in "I Am the Night—Color Me Black" (1964), and later appeared in Night Gallery's "The Boy Who Predicted Earthquakes"
  (1971). He won an Emmy as the principal on Room 222 and played the Windex-loving father in My Big Fat Greek Wedding.

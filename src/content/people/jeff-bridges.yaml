name: Jeff Bridges
roles:
- actor
born: '1949-12-04'
bio: >-
  Jeff Bridges appeared as a teenager in "The Ordeal of Bud Windom," an episode of Rod Serling's western The Loner
  (1965-66), which starred his father Lloyd Bridges. He won the Academy Award for Best Actor for Crazy Heart (2009)
  after earlier nominations for The Last Picture Show, Thunderbolt and Lightfoot and Starman, and is widely known
  as The Dude in The Big Lebowski.

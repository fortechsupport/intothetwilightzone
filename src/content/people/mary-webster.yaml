bio: >-
  Mary Webster played Nan, the young woman new to the city whom Jack Klugman's Joey Crown meets on a rooftop after
  he chooses to go on living, in "A Passage for Trumpet" (1960). She worked in films and television in the late
  1950s and early 1960s, including the Jules Verne adventure Master of the World (1961) with Vincent Price.

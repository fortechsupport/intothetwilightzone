name: Damson Idris
roles:
- actor
born: '1991-09-02'
bio: >-
  Damson Idris played Dorian, the college-bound son whose mother (Sanaa Lathan) uses a camcorder that rewinds time
  to try to save him from a racist state trooper, in "Replay" (2019), one of the most discussed episodes of the
  first season of the Jordan Peele Twilight Zone. The British actor starred as Franklin Saint in John Singleton's
  Snowfall and later appeared in the Formula One film F1 (2025).

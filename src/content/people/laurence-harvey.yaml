name: Laurence Harvey
roles:
- actor
born: '1928-10-01'
died: '1973-11-25'
bio: >-
  Laurence Harvey starred in "The Caterpillar" (1972), one of Night Gallery's most notorious segments, as a man
  in colonial Borneo whose plot to have an earwig placed in a rival's ear goes horribly wrong. He received an Academy
  Award nomination for Room at the Top (1959) and starred in The Manchurian Candidate (1962) and Butterfield 8.
  He died of cancer the year after The Caterpillar aired.

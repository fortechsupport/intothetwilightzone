name: Lindsay Wagner
roles:
- actor
born: '1949-06-22'
bio: >-
  Lindsay Wagner appeared early in her career in "Smile, Please" (1972), a brief comic Night Gallery vignette about
  a photographer trying to capture a vampire on film. She became a television star as Jaime Sommers in The Six Million
  Dollar Man and its spinoff The Bionic Woman, winning the 1977 Emmy for Lead Actress in a Drama Series, and starred
  in The Paper Chase (1973).

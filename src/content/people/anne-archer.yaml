name: Anne Archer
born: '1947-08-24'
roles:
- actor
bio: >-
  Anne Archer appeared early in her career in "Can a Dead Man Strike from the Grave?" (1972), an episode of The
  Sixth Sense, the series later folded into the Night Gallery syndication package. She received an Academy Award
  nomination for Fatal Attraction and starred in Patriot Games and Short Cuts. Her father, John Archer, appeared
  in the original Twilight Zone.

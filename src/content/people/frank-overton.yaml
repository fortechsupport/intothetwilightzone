name: Frank Overton
roles:
- actor
born: '1918-03-12'
died: '1967-04-24'
bio: >-
  Frank Overton played Robert Sloan, the father who gently tells his grown son Martin that he cannot stay in the
  past, in "Walking Distance" (1959), and returned as the small-town sheriff Harry Wheaton, who takes in a telepathic
  orphan, in the hour-long "Mute" (1963). He is best known as Sheriff Heck Tate in To Kill a Mockingbird (1962)
  and also appeared in Fail-Safe and in Star Trek's "This Side of Paradise."

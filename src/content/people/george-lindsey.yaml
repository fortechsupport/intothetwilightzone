bio: >-
  George Lindsey played a deputy in "I Am the Night—Color Me Black," Serling's fifth-season parable in which the
  sun fails to rise on a town after an execution born of hatred. He became famous as the good-natured mechanic Goober
  Pyle on The Andy Griffith Show and Mayberry R.F.D., and played the role for two decades on Hee Haw.

born: '1916-08-12'
died: '1987-12-21'
bio: >-
  Ralph Nelson directed Rod Serling's "Requiem for a Heavyweight" for Playhouse 90 (1956), winning an Emmy, and
  directed the 1962 film version with Anthony Quinn and Jackie Gleason. He also directed Richard Matheson's "A World
  of His Own" (1960), the first-season finale in which Rod Serling himself is written out of the show by the playwright-hero.
  Nelson's later films include Lilies of the Field (1963) and Charly (1968).

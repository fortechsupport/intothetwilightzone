bio: >-
  Wallace Rooney appeared in three original-series episodes: "The Rip Van Winkle Caper" (1961), "Young Man's Fancy"
  (1962) and "In His Image" (1963). He was a character actor in television of the period; little else about his
  life is readily documented.

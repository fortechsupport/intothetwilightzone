name: Rod Serling
born: '1924-12-25'
died: '1975-06-28'
bio: >-
  Creator, host, narrator and principal writer of The Twilight Zone (1959–1964). Before it, he won
  Emmys for the television dramas Patterns and Requiem for a Heavyweight; afterwards he co-wrote
  Planet of the Apes (1968) and hosted Night Gallery.

born: '1930-12-26'
died: '2018-12-20'
bio: >-
  Donald Moffat appeared in "Pickman's Model" (1971), Night Gallery's Lovecraft adaptation, and in "The Star" (1985),
  the 1985 revival's adaptation of Arthur C. Clarke's story about a Jesuit astronomer aboard a starship. The English-born
  actor played Lyndon Johnson in The Right Stuff and Garry in John Carpenter's The Thing, and earned Tony nominations
  for his work in the APA-Phoenix repertory company.

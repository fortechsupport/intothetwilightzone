born: '1933-12-05'
died: '1986-03-06'
bio: >-
  Adolph Caesar played the supervisor of the blue-suited workers who assemble each minute of reality in "A Matter
  of Minutes" (1986), the revival's adaptation of Theodore Sturgeon's story; it aired weeks before his death. A
  celebrated stage actor with the Negro Ensemble Company and a sought-after narrator, he was nominated for an Academy
  Award for repeating his stage role as Sergeant Waters in A Soldier's Story (1984) and appeared in The Color Purple.

born: '1975-01-03'
bio: >-
  Danica McKellar appeared as a child in two episodes of the 1980s revival: "Her Pilgrim Soul" (1985), in which
  a holographic image of a baby grows into a woman before a scientist's eyes, and "Shelter Skelter" (1987). She
  became famous as Winnie Cooper on The Wonder Years (1988-93), studied mathematics at UCLA, and has written a series
  of best-selling math books for girls.

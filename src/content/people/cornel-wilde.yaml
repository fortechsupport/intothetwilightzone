bio: >-
  Cornel Wilde starred in "Deliveries in the Rear" (1972), the Night Gallery segment about a surgeon who does not
  ask where his cadavers come from. Oscar-nominated for playing Chopin in A Song to Remember, he also starred in
  Leave Her to Heaven and directed and starred in The Naked Prey.

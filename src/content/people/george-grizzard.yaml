name: George Grizzard
born: '1928-04-01'
died: '2007-10-02'
roles:
- actor
bio: >-
  George Grizzard played the dual roles of Alan Talbot, a man who discovers he is a robot, and Walter Ryder, the
  engineer who built him in his own image, in Charles Beaumont's "In His Image," the first hour-long episode broadcast.
  He was a distinguished stage actor who created Nick in Who's Afraid of Virginia Woolf? and won a Tony for Edward
  Albee's Three Tall Women. He won an Emmy for the TV film The Oldest Living Graduate and appeared in Advise & Consent.

bio: >-
  Tamra Davis directed the music video for Young MC's "Bust a Move" (1989), which /Film reports was inspired by
  The Twilight Zone. She went on to direct the features CB4, Billy Madison and Crossroads, and the documentary Jean-Michel
  Basquiat: The Radiant Child (2010).

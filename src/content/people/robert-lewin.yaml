born: '1920'
died: '2004'
bio: >-
  Robert Lewin wrote "Escort for a Dead Man," an episode of Rod Serling's western The Loner (1965-66). He received
  an Academy Award nomination for the story and screenplay of the World War II film The Bold and the Brave (1956)
  and wrote widely for television westerns and dramas. Late in his career he was a writer-producer on the first
  season of Star Trek: The Next Generation.

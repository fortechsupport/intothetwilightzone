name: John Marquez
roles:
- actor
bio: >-
  John Marquez was a member of the ensemble cast of Anne Washburn's The Twilight Zone, the stage adaptation of original-series
  stories by Rod Serling, Charles Beaumont and Richard Matheson that premiered at London's Almeida Theatre in December
  2017 under director Richard Jones, with each actor playing several roles across the interwoven tales. Marquez
  is best known to television audiences as the bumbling police constable Joe Penhale in the ITV comedy-drama Doc
  Martin.

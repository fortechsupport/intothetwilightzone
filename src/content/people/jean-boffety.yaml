bio: >-
  Jean Boffety photographed Robert Enrico's French short film An Occurrence at Owl Creek Bridge, which The Twilight
  Zone bought and broadcast in February 1964 as an episode of its fifth season. The film had already won at Cannes
  and later won the Academy Award for best live action short. Boffety became a leading French cinematographer, known
  especially for his films with Claude Sautet, such as Les Choses de la vie and Cesar et Rosalie, and he also shot
  Robert Altman's Thieves Like Us.

  work: Rod Serling's The Twilight Zone Magazine (1981–85)
  role: editor
born: '1947-07-15'
bio: >-
  Horror author T. E. D. Klein was the founding editor of Rod Serling's The Twilight Zone Magazine, guiding
  the digest of new fiction, episode guides and interviews from its launch in 1981 until 1985. During
  those years he also published his acclaimed novel The Ceremonies and the novella collection Dark Gods,
  and he later co-wrote Dario Argento's Trauma.

bio: >-
  John R. Leonetti directed Annabelle (2014), the Conjuring spin-off whose possessed doll critics place in a killer-doll
  lineage that runs back to the original series' Talky Tina. A cinematographer on The Conjuring and Insidious, he
  also directed Mortal Kombat Annihilation and Wish Upon.

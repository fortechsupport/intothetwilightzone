bio: >-
  Reginald Rose, best known for the jury-room drama Twelve Angry Men, is credited with one Twilight Zone
  episode: The Incredible World of Horace Ford (1963), a reworking of a teleplay he had first done for
  Studio One in 1955 about a toy designer obsessed with his childhood. A contemporary of Serling from
  the golden age of live television, he went on to create and write the courtroom series The Defenders.

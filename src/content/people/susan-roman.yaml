bio: >-
  Susan Roman appeared in "Special Service" (1989), a late episode of the 1985 revival about a man who discovers
  his life is being broadcast as a television show, a decade before The Truman Show. The Canadian actress is best
  known as a voice actor, including Sailor Jupiter in the English dub of Sailor Moon and Angel in Rock & Rule.

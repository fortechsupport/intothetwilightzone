bio: >-
  Moira Kirland Dekker, later credited as Moira Kirland, wrote two episodes of the 2002 UPN Twilight Zone: "Into
  the Light" and "Developing." She went on to a long career as a television writer and producer, including writing
  and producing for Castle, and later ran series as a showrunner.

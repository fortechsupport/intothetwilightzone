bio: >-
  Abraham Sofaer played Dr. Stillman, the inventor who builds the robot pitcher Casey and later gives him a mechanical
  heart, in "The Mighty Casey" (1960). Born in Rangoon, Burma, he made his name on the London stage and in British
  radio before moving into films such as Quo Vadis (1951), where he played the apostle Paul. In American television
  he was a frequent guest, notably as the Thasian who comes to reclaim the boy in the Star Trek episode "Charlie
  X."

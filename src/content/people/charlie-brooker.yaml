bio: >-
  Charlie Brooker created and wrote Black Mirror (2011-), the anthology most often described as a Twilight Zone
  for the digital age; he has acknowledged Serling's show as a model and once considered giving his series a host.
  He co-wrote the Emmy-winning episode "USS Callister" with William Bridges. A British satirist and broadcaster,
  he also made Screenwipe and Dead Set.

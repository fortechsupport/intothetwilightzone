name: Joseph Pevney
born: '1911-09-15'
died: '2008-05-18'
roles:
- director
bio: >-
  Joseph Pevney directed six episodes of The Loner (1965-1966), Rod Serling's post-Civil War western starring Lloyd
  Bridges, including the two-part "The Mourners for Johnny Sharp." A former actor, he directed features for Universal
  in the 1950s, among them the Lon Chaney biopic Man of a Thousand Faces with James Cagney. On television he directed
  some of the best-loved episodes of the original Star Trek, including "The City on the Edge of Forever," "Amok
  Time" and "The Trouble with Tribbles."

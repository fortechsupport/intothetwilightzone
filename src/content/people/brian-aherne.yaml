name: Brian Aherne
born: '1902-05-02'
died: '1986-02-10'
roles:
- actor
bio: >-
  Brian Aherne starred as Booth Templeton, an aging Broadway star who wanders back into the 1920s and the company
  of his late wife, in "The Trouble with Templeton." English-born, he became a polished Hollywood leading man of
  the 1930s and 1940s in films such as Sylvia Scarlett, The Great Garrick and Hitchcock's I Confess. He was nominated
  for the Academy Award for best supporting actor as Emperor Maximilian in Juarez (1939).

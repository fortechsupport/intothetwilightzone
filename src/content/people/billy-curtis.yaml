bio: >-
  Billy Curtis appeared in "Personal Demons," a 1985 revival segment in which a blocked writer is plagued by small
  demons only he can see. A little-person actor in Hollywood from the 1930s, he was one of the Munchkins in The
  Wizard of Oz and played the dwarf barber-turned-sheriff Mordecai in Clint Eastwood's High Plains Drifter.

bio: >-
  Jack Arnold directed The Incredible Shrinking Man (1957), Universal's film of Richard Matheson's novel with a
  screenplay by Matheson himself, the success that helped launch Matheson toward his Twilight Zone career. Arnold
  was Universal's leading 1950s science-fiction director, making It Came from Outer Space, Creature from the Black
  Lagoon and Tarantula. He later directed The Mouse That Roared and much episodic television, including Gilligan's
  Island.

bio: >-
  Lynn Barker wrote two first-season segments of the 1985 revival: "Little Boy Lost" (1985), in which a photographer
  meets a boy who may be the child she has not had, and "Dead Woman's Shoes" (1985), a remake of Charles Beaumont's
  original series story "Dead Man's Shoes" with Helen Mirren.

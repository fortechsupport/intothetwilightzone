name: Harry Hickox
roles:
- actor
born: '1910'
died: '1994'
bio: >-
  Harry Hickox acted in "Green Fingers" (1972), the second-season Night Gallery segment in which Elsa Lanchester
  plays an elderly woman who refuses to sell her beloved garden to a ruthless developer. A character actor of stage
  and screen, he is best remembered as the anvil salesman Charlie Cowell in the film version of The Music Man (1962).

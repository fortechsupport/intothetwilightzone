bio: >-
  Barry De Vorzon was music consultant on the 1985 Twilight Zone. He co-wrote the instrumental Nadia's Theme, originally
  from the film Bless the Beasts and Children and later the theme of The Young and the Restless, and scored films
  such as The Warriors.

name: Parke Godwin
roles:
- author
born: '1929-01-28'
died: '2013-07-19'
bio: >-
  Parke Godwin wrote the short story "Time and Teresa Golowitz," adapted as a 1987 segment of the 1985 revival in
  which a dying songwriter bargains with the Devil to relive a single day of his youth. A fantasy and science-fiction
  novelist, he is known for his Arthurian novels Firelord and Beloved Exile and for his Robin Hood books; his novella
  "The Fire When It Comes" won the World Fantasy Award.

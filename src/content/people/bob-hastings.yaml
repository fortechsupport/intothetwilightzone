bio: >-
  Bob Hastings appeared in "I Dream of Genie" (1963), the original series' comedy about a mousy office worker who
  finds a lamp. He played Lt. Carpenter on McHale's Navy and Kelsey on All in the Family, starred as Archie Andrews
  on radio, and voiced Commissioner Gordon in Batman: The Animated Series.

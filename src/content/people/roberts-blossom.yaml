bio: >-
  Roberts Blossom appeared in two episodes of the 1985 revival, "The Burning Man," set on a dusty country road in
  the 1930s, and "Song of the Younger World." He is best remembered as "Old Man" Marley, the neighbor rumored to
  be a killer, in Home Alone (1990). His other films include Escape from Alcatraz, Close Encounters of the Third
  Kind, Christine and Deranged, in which he played an Ed Gein-like killer. He was also an Obie- winning stage actor
  and a published poet.

name: William Atherton
born: '1947-07-30'
roles:
- actor
bio: >-
  William Atherton appeared in two episodes of the 1985 Twilight Zone revival, the 1985 remake of Serling's "Night
  of the Meek" and "The Card" (1987). He is best known for playing officious antagonists: the EPA man Walter Peck
  in Ghostbusters and the reporter Richard Thornburg in Die Hard; he also starred in The Sugarland Express and The
  Day of the Locust.

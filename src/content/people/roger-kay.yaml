bio: >-
  Roger Kay directed "Ninety Years Without Slumbering" (1963), the fifth-season episode starring Ed Wynn as an old
  man convinced that he will die when his grandfather clock stops. He also directed the feature The Cabinet of Caligari
  (1962), written by Robert Bloch.

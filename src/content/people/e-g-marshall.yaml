name: E. G. Marshall
roles:
- actor
born: '1914-06-18'
died: '1998-08-24'
bio: >-
  E. G. Marshall starred in "Death in the Family" (1971), the Night Gallery season-two opener written by Rod Serling,
  as a lonely small-town mortician who gives his corpses a family life. He was Juror No. 4 in 12 Angry Men, won
  two Emmys as the lawyer Lawrence Preston on The Defenders, and hosted the CBS Radio Mystery Theater.

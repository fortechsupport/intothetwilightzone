born: '1932-10-28'
died: '2003-05-03'
bio: >-
  Suzy Parker played Carlotta, the beautiful but cruel wife whose husband (Larry Hagman) hires a witch to swap her
  soul with a kindly old woman's, in "The Housekeeper," a segment of Night Gallery's first episode (1970). One of
  the most famous fashion models of the 1950s, she acted in Funny Face, Kiss Them for Me and The Best of Everything.

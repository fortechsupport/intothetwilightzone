born: '1951-05-14'
bio: >-
  Robert Zemeckis directed Contact (1997), whose opening pull-back from Earth through layers of old radio and television
  broadcasts includes a snippet of the Twilight Zone theme as the camera passes Jupiter. He directed the Back to
  the Future trilogy and Who Framed Roger Rabbit, and won the Academy Award for Best Director for Forrest Gump (1994).

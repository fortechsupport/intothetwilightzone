bio: >-
  Alyson Court appeared in "The Mind of Simon Foster" (1989), one of the final episodes of the 1985 revival. The
  Canadian performer is known as Loonette the Clown on The Big Comfy Couch, as the voice of Jubilee on X-Men: The
  Animated Series and as Claire Redfield in the Resident Evil games.

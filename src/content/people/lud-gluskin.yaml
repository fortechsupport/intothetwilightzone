bio: >-
  Lud Gluskin is credited as a composer on the original Twilight Zone through his role as music director for CBS
  in Hollywood, where he commissioned and supervised the network's library of recorded music that the series drew
  on. He had led a popular jazz dance band in Europe in the 1920s and 1930s before joining CBS. Under him the network
  built the library of cues, by composers such as Bernard Herrmann, Jerry Goldsmith and Fred Steiner, that gave
  many Twilight Zone episodes their sound.

name: Victor Garber
roles:
- actor
born: '1949-03-16'
bio: >-
  Victor Garber starred in "A Day in Beaumont" (1986), the 1985 revival's affectionate homage to 1950s science-
  fiction movies, in which a young couple in a small town discover an alien invasion. He played Jesus in the film
  of Godspell, Thomas Andrews in Titanic and Jack Bristow on Alias, and has earned four Tony nominations.

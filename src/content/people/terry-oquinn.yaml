bio: >-
  Terry O'Quinn played one of the scientists confronting an alien that can take any form in "Chameleon" (1985),
  an early segment of the 1980s revival. He went on to The Stepfather (1987), recurring work on The X-Files and
  Millennium, and an Emmy-winning turn as John Locke on Lost.

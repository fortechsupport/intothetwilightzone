name: Donna Dixon
roles:
- actor
born: '1957-07-20'
bio: >-
  Donna Dixon played the junior stewardess in George Miller's "Nightmare at 20,000 Feet" segment of Twilight Zone:
  The Movie (1983), opposite John Lithgow's terrified passenger. She co-starred in the sitcom Bosom Buddies and
  in Spies Like Us (1985) with Dan Aykroyd, whom she married.

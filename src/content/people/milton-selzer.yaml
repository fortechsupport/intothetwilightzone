name: Milton Selzer
roles:
- actor
born: '1918-02-25'
died: '2006-01-21'
bio: >-
  Milton Selzer appeared in two original Twilight Zone episodes: as one of the aliens who kidnap the tall-tale-telling
  gas station owner in "Hocus-Pocus and Frisby" (1962), and as Wilfred Harper, one of the greedy heirs forced to
  wear grotesque masks, in "The Masks" (1964). A stage-trained character actor, he worked steadily in film and television
  from the 1950s into the 1980s.

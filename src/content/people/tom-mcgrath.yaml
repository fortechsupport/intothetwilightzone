born: '1964-08-07'
bio: >-
  Tom McGrath co-directed DreamWorks Animation's Madagascar (2005), which slips in a Twilight Zone joke: a panicked
  lemur waves a book titled "To Serve Lemur" and shrieks that it is a cookbook, the punchline of the episode "To
  Serve Man." McGrath also voices Skipper of the film's penguins, and directed the sequels, Megamind (2010) and
  The Boss Baby (2017).

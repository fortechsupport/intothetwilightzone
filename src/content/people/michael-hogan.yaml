bio: >-
  Michael Hogan appeared in "The Hunters," an episode from the Toronto-produced final season of the 1985 revival.
  The Canadian actor is best known as Colonel Saul Tigh, the hard-drinking executive officer of Battlestar Galactica
  (2004-2009), and has worked widely in Canadian theater and television.

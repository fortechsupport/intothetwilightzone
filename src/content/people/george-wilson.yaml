name: George Wilson
bio: >-
  Painter of many of Western Publishing's Dell and Gold Key covers, nicknamed 'Gold Key's Rembrandt'. He painted
  the cover of Gold Key's The Twilight Zone #1 (1962) and many later issues; his original gouache for #24 (1968)
  sold at Hake's in 2019.

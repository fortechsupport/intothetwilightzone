bio: >-
  Norman Katkov wrote two episodes of Rod Serling's western The Loner (1965-66), "The Ordeal of Bud Windom" and
  "The Burden of the Badge." A former newspaperman and novelist, he wrote widely for television drama from the 1950s
  to the 1980s.

bio: >-
  Ned Bellamy appeared in "The After Hours," the 1986 remake of the original-series mannequin story for the first
  revival, and voiced a role in the radio drama "Ten Days." He is a prolific character actor whose films include
  Ed Wood, in which he played Dr. Tom Mason, and whose television work spans dozens of series from the 1980s on.

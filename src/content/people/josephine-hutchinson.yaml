name: Josephine Hutchinson
roles:
- actor
born: '1903-10-12'
died: '1998-06-04'
bio: >-
  Josephine Hutchinson played the grandmother in "I Sing the Body Electric" (1962), Ray Bradbury's only script for
  the series, about a robot grandmother who wins over a grieving family. A Broadway star with Eva Le Gallienne's
  Civic Repertory Theatre, she appeared in films including Son of Frankenstein, The Story of Louis Pasteur and North
  by Northwest.

name: Nana Visitor
born: '1957-07-26'
roles:
- actor
bio: >-
  Nana Visitor appeared in "Dead Woman's Shoes," the 1985 revival's remake of the original series' "Dead Man's Shoes,"
  starring Helen Mirren as a shy woman taken over by a murdered socialite. She is best known as Major Kira Nerys
  on Star Trek: Deep Space Nine (1993-1999). On Broadway she was Roxie Hart in the revival of Chicago, and she later
  had a recurring role on Battlestar Galactica.

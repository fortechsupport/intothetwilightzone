born: '1941-08-04'
bio: >-
  Martin Jarvis starred with his wife, Rosalind Ayres, in the Twilight Zone Radio Drama remake of "Passage on the
  Lady Anne," Charles Beaumont's story of a troubled couple aboard a liner full of elderly lovers. The English actor
  is one of Britain's best-known radio and audiobook voices, celebrated for his readings of Richmal Crompton's Just
  William stories, and has directed many audio dramas for L.A. Theatre Works.

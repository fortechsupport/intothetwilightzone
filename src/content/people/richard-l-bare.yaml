bio: >-
  Richard L. Bare directed seven original-series episodes, among them the classics To Serve Man, The Purple
  Testament, Third from the Sun and the William Shatner fortune-teller story Nick of Time. He later directed
  nearly the entire run of Green Acres and wrote a well-known guide to directing, The Film Director, living
  to the age of 101.

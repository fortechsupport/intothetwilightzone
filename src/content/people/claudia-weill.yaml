born: '1947'
bio: >-
  Claudia Weill directed "A Small Talent for War" (1986), a 1985 revival segment in which an alien envoy tells the
  United Nations that humanity has been engineered for war and must prove its worth. Her independent feature Girlfriends
  (1978) became a landmark of American women's filmmaking, and she later directed It's My Turn and episodes of thirtysomething
  and Girls.

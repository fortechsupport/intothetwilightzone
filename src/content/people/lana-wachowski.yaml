born: '1965-06-21'
bio: >-
  Lana Wachowski co-wrote and co-directed The Matrix (1999) with her sister Lilly, a film critics often grouped
  with the Twilight Zone-style false-reality stories of its era. The Wachowskis also made Bound, the Matrix sequels,
  Cloud Atlas and the series Sense8, and Lana directed The Matrix Resurrections (2021).

bio: >-
  Gage Clarke played the Reverend Hughes, one of the three people a vengeful millionaire lures into his bomb shelter,
  in "One More Pallbearer" (1962). A character actor of 1950s and early-1960s television and film, he often played
  officials and clergymen.

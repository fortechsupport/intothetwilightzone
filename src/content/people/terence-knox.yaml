bio: >-
  Terence Knox played Barton, the pilot who must decide the fate of a stowaway aboard his emergency ship, in "The
  Cold Equations" (1989), the 1985 revival's adaptation of Tom Godwin's story. He played Dr. Peter White on St.
  Elsewhere and Sergeant Zeke Anderson on Tour of Duty.

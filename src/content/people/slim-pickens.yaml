name: Slim Pickens
born: '1919-06-29'
died: '1983-12-08'
roles:
- actor
bio: >-
  Slim Pickens appeared in "Die Now, Pay Later," one of two short Night Gallery comedy sketches that were made for
  season two but first seen only in syndication. A former rodeo clown, he became immortal as Major Kong, riding
  the H-bomb down in Dr. Strangelove (1964). He also played Taggart in Blazing Saddles and appeared in One-Eyed
  Jacks and The Getaway.

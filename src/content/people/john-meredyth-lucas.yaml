born: '1919-04-19'
died: '2002-02-19'
bio: >-
  John Meredyth Lucas directed four Night Gallery segments: "The Housekeeper" in the first season, and "The Hand
  of Borgus Weems," "The Different Ones" (a Rod Serling script) and "The Funeral" in the second. The son of screenwriter
  Bess Meredyth and stepson of director Michael Curtiz, he wrote for films before moving into television. He is
  best known for Star Trek, where he produced much of the second season and wrote and directed episodes including
  "The Changeling" and "Patterns of Force," and he later produced and wrote for Logan's Run.

name: Harvey Lembeck
born: '1923-04-15'
died: '1982-01-05'
roles:
- actor
bio: >-
  Harvey Lembeck appeared in "The Dear Departed," a second-season Night Gallery segment about a fake medium and
  his scheming partners. He played Corporal Rocco Barbella on The Phil Silvers Show and the inept biker Eric Von
  Zipper in American International's Beach Party films, and appeared in Stalag 17 on stage and screen. He also ran
  a well-known comedy improvisation workshop in Los Angeles.

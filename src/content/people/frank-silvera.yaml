bio: >-
  Frank Silvera played Dr. Koslenko, the psychiatrist who tries to convince Richard Long's man-without-an- identity
  that his life is a delusion, in "Person or Persons Unknown." Born in Jamaica and raised in Boston, he was a versatile
  stage and screen actor, often cast as Mexican or Mediterranean characters, in films such as Viva Zapata!, Kubrick's
  Fear and Desire and Killer's Kiss, and The Mountain Road. He played Don Sebastian Montoya on The High Chaparral
  and co-founded the Theatre of Being in Los Angeles. He died in a household electrical accident.

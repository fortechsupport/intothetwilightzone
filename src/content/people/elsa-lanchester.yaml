bio: >-
  Elsa Lanchester starred in "Green Fingers" (1972), the Night Gallery segment about an old woman whose garden thrives
  no matter what is done to her. She played the title role in Bride of Frankenstein, earned Oscar nominations for
  Come to the Stable and Witness for the Prosecution, and was married to Charles Laughton.

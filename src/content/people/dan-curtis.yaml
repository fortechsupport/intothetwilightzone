born: '1927-08-12'
died: '2006-03-27'
bio: >-
  Dan Curtis directed Trilogy of Terror (1975), the ABC anthology film of three Richard Matheson stories, remembered
  above all for Karen Black's battle with a Zuni fetish doll. Curtis and Matheson made several television films
  together, including The Night Stalker (1972), which Curtis produced. He created the gothic soap Dark Shadows and
  later directed the miniseries The Winds of War and War and Remembrance.

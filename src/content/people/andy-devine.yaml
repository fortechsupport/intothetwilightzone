bio: >-
  Andy Devine starred in "Hocus-Pocus and Frisby" as Somerset Frisby, a small-town tall-tale teller kidnapped by
  aliens who believe his boasts. Known for his raspy, cracking voice, he played the stagecoach driver in John Ford's
  Stagecoach and Liberty Valance's foil in The Man Who Shot Liberty Valance. On television he was Jingles on Wild
  Bill Hickok and hosted Andy's Gang.

bio: >-
  Zeljko Ivanek appeared in "The Lineman" (2002), the UPN revival episode directed by Jonathan Frakes. The Slovenian-born
  American actor won an Emmy for Damages, played Assistant State's Attorney Ed Danvers on Homicide: Life on the
  Street, and appeared in Three Billboards Outside Ebbing, Missouri.

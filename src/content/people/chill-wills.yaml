name: Chill Wills
born: '1902-07-18'
died: '1978-12-15'
roles:
- actor
bio: >-
  Chill Wills played Dr. William Fall, a disgraced alcoholic physician who finds a doctor's bag from the future,
  in "The Little Black Bag," the first-season Night Gallery segment from C. M. Kornbluth's story. He was the voice
  of Francis the Talking Mule and was nominated for an Academy Award for John Wayne's The Alamo (1960). His other
  films include Giant and Western Union.

bio: >-
  Rick Friedberg directed "Wish Bank" (1985), a short comic segment of the 1985 revival in which a woman finds a
  lamp and has to fill out paperwork at a bureaucratic bank of wishes. He later directed the spoof Spy Hard (1996)
  with Leslie Nielsen.

born: '1925-06-23'
died: '1975-06-06'
bio: >-
  Larry Blyden starred in two original Twilight Zone comedies: as Rocky Valentine, the small-time crook who thinks
  he has reached heaven, in "A Nice Place to Visit," and as the vain TV cowboy pulled into the real Old West in
  "Showdown with Rance McGrew." On Broadway he won a Tony Award in 1972 for the revival of A Funny Thing Happened
  on the Way to the Forum. He also hosted game shows, including the syndicated What's My Line? in its final years,
  and died after a car accident in Morocco in 1975.

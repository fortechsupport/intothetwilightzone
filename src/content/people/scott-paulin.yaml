born: '1950-02-13'
bio: >-
  Scott Paulin played Price, the shell-shocked Vietnam veteran whose memories take deadly physical form in a roadside
  diner, in William Friedkin's "Nightcrawlers" (1985), from Robert R. McCammon's story. He played astronaut Deke
  Slayton in The Right Stuff and later directed television.

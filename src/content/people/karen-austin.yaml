bio: >-
  Karen Austin played Maureen Wright, who slips out of step with time alongside her husband (Adam Arkin), in "A
  Matter of Minutes" (1986). She is best remembered as court clerk Lana Wagner in the first season of Night Court,
  and she worked widely as a television guest actress in the 1980s.

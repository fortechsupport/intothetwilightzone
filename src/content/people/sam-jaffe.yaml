name: Sam Jaffe
born: '1891-03-10'
died: '1984-03-24'
roles:
- actor
bio: >-
  Sam Jaffe played Bleum, the Holocaust survivor whose devotion to a painting of a peaceful fishing scene haunts
  the hunted Nazi war criminal in "The Escape Route," the third segment of the 1969 Night Gallery pilot film. He
  was nominated for an Academy Award for The Asphalt Jungle and played the title role in Gunga Din, the High Lama
  in Lost Horizon and Dr. Zorba on Ben Casey. He was blacklisted in the 1950s.

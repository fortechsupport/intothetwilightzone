  role: set decorator (credited 1959-1964)
bio: >-
  Henry Grace was MGM's supervising set decorator and is credited on the original Twilight Zone for its whole run,
  from the first season through 1964. He won the Academy Award for the set decoration of Gigi and was nominated
  for many other MGM films, including North by Northwest. Because he looked strikingly like Dwight D. Eisenhower,
  he was cast as Eisenhower in The Longest Day (1962), one of his few appearances in front of a camera.

name: Carol Lynley
roles:
- actor
born: '1942-02-13'
died: '2019-09-03'
bio: >-
  Carol Lynley starred in the Night Gallery segment "Last Rites for a Dead Druid" (1972), as a wife whose husband
  is gradually taken over by a statue of a druid. A teenage model and Broadway actress, she became a film star in
  Blue Denim (1959) and The Cardinal, and is best remembered for Bunny Lake Is Missing (1965) and as the singer
  Nonnie in The Poseidon Adventure (1972). She also appeared in The Night Stalker (1972).

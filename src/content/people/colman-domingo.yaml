bio: >-
  Colman Domingo appeared in "Downtime," an episode of the second season of Jordan Peele's Twilight Zone revival.
  He was nominated for the Academy Award for playing civil-rights organizer Bayard Rustin in Rustin (2023) and again
  for Sing Sing. He won an Emmy for Euphoria and is known for Fear the Walking Dead, Ma Rainey's Black Bottom and
  The Color Purple (2023). He is also a Tony-nominated stage actor and playwright.

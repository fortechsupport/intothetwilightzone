bio: >-
  Anthony Peckham is one of the screenwriters attached during the long, unfinished effort by Warner Bros. and Leonardo
  DiCaprio's Appian Way to develop a new Twilight Zone feature film in the 2010s. A South African-born screenwriter,
  he wrote Invictus (2009), Clint Eastwood's film about Nelson Mandela and the 1995 Rugby World Cup, and co-wrote
  Guy Ritchie's Sherlock Holmes (2009).

bio: >-
  Jon Turteltaub directed Disney's The Kid (2000), in which Bruce Willis's cynical image consultant meets his own
  eight-year-old self, a premise writers compare to the Twilight Zone episode "Nightmare as a Child." His other
  films include Cool Runnings, While You Were Sleeping, Phenomenon, National Treasure and The Meg.

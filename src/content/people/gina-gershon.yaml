born: '1962-06-10'
bio: >-
  Gina Gershon appeared early in her career in "Time and Teresa Golowitz" (1987), a revival episode in which a dying
  songwriter bargains with the Devil to relive a night from his youth. She went on to star in Bound (1996), Face/Off
  (1997) and Showgirls, and on Broadway played Sally Bowles in Cabaret.

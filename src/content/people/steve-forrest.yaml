name: Steve Forrest
roles:
- actor
born: '1925-09-29'
died: '2013-05-18'
bio: >-
  Steve Forrest starred as astronaut Major Robert Gaines, who returns from orbit to a subtly different Earth, in
  "The Parallel" (1963), and starred in Jeopardy Run, the unsold adventure pilot Rod Serling made in Hong Kong late
  in 1963. He returned to Serling's world in two Night Gallery segments, Serling's own "The Waiting Room" (1972)
  and "Hatred unto Death" (1973). The younger brother of Dana Andrews, he won a Golden Globe as a newcomer for So
  Big (1953) and is best known as Lt. Hondo Harrelson on S.W.A.T.

bio: >-
  Murphy Dunne appeared in "The Uncle Devil Show," a 1985 revival segment in which a boy's magic kit turns out to
  belong to the Devil. A comic actor and keyboardist, he played Murph, the keyboard player of The Blues Brothers
  band, in the 1980 film and its sequel, and appeared in Mel Brooks's High Anxiety.

born: '1953-04-24'
bio: >-
  Eric Bogosian starred in "Healer" (1985), the revival episode about a small-time thief who steals an ancient healing
  relic, and later voiced leads in two Twilight Zone Radio Dramas: Serling's "The Four of Us Are Dying" and Charles
  Beaumont's story "Free Dirt." A playwright and monologist, he wrote and starred in Talk Radio (stage 1987, Oliver
  Stone film 1988) and solo shows such as Drinking in America. On screen he played Captain Danny Ross on Law & Order:
  Criminal Intent and appeared in Billions and Uncut Gems.

bio: >-
  John T. Dugan wrote "And Scream by the Light of the Moon, the Moon" for The Sixth Sense (1972), the ABC parapsychology
  series later syndicated in cut-down form as part of the Night Gallery package. He was a television writer of the
  1950s through the 1970s.

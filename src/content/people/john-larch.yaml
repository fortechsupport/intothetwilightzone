- actor
bio: >-
  John Larch appeared in three original-series episodes: as Sheriff Koch in "Dust," as the psychiatrist Dr. Rathmann
  in "Perchance to Dream," and as the terrified father of the all-powerful child Anthony Fremont in "It's a Good
  Life." A stalwart of film and television westerns and crime dramas, he played the San Francisco police chief in
  Dirty Harry and appeared in Play Misty for Me. He was a regular on the western Arrest and Trial.

born: '1939-10-22'
died: '2025-02-07'
bio: >-
  Tony Roberts appeared in Rod Serling's Night Gallery segment "The Messiah on Mott Street" (1971), about a dying
  old man (Edward G. Robinson) awaiting the Messiah on Christmas Eve. A Tony-nominated Broadway actor, he was a
  frequent Woody Allen collaborator in Annie Hall, Play It Again, Sam and Hannah and Her Sisters. He died in February
  2025.

name: Dennis Weaver
born: '1924-06-04'
died: '2006-02-24'
roles:
- actor
bio: >-
  Dennis Weaver starred in "Shadow Play" (1961) as Adam Grant, a condemned man who insists his death sentence is
  a recurring nightmare and that everyone around him exists only in his dream. Ten years later he played the hunted
  motorist in Duel, Steven Spielberg's TV film of Richard Matheson's script. He won an Emmy as Chester on Gunsmoke
  and later starred as McCloud.

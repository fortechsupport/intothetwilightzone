born: '1929-09-24'
bio: >-
  Eric Till directed "Cat and Mouse" (1989), a segment of the 1980s revival's Canadian-produced final season. The
  English-born director became one of Canada's leading film and television directors, with features including Hot
  Millions (1968) and Luther (2003) and the miniseries Bethune.

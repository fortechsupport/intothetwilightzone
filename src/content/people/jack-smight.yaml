bio: >-
  Jack Smight directed four episodes of the original series' first two seasons, including the desert-asteroid
  love story The Lonely, the Christmas fable The Night of the Meek and the hospital nightmare Twenty-Two.
  Coming out of live television drama, he moved on to features such as Harper (1966), No Way to Treat
  a Lady, Airport 1975 and Midway.

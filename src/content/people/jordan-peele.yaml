bio: >-
  Jordan Peele co-developed the 2019 revival for CBS All Access with Simon Kinberg and Marco Ramirez,
  produced it through his company Monkeypaw Productions, and stepped into Rod Serling's shoes as on-screen
  host and narrator for all 20 episodes across two seasons. He came to the project as one of the defining
  genre filmmakers of his generation: half of the sketch duo Key & Peele, he won the Academy Award for
  Best Original Screenplay for Get Out (2017) and followed it with Us and Nope, films that openly acknowledge
  their debt to The Twilight Zone.

bio: >-
  Gary Lockwood starred in "The Ring with the Red Velvet Ropes" (1973), a late Night Gallery segment about a boxer
  who wakes up in a mysterious mansion and is forced to fight. He played astronaut Frank Poole in 2001: A Space
  Odyssey and appeared in Star Trek's second pilot, "Where No Man Has Gone Before."

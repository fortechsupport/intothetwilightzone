name: Joan Van Ark
born: '1943-06-16'
roles:
- actor
bio: >-
  Joan Van Ark appeared in "The Ring with the Red Velvet Ropes," the third-season Night Gallery segment in which
  a boxer wakes up in a mysterious mansion and faces a fight to the death. She is best known as Valene Ewing, a
  role she began on Dallas and played for 13 seasons on its spinoff Knots Landing. She earned a Tony nomination
  for The School for Wives and voiced Spider-Woman in the 1979 cartoon.

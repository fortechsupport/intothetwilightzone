bio: >-
  Australian-born Rod Taylor starred in The Time Machine and Hitchcock's The Birds and voiced Pongo in
  Disney's One Hundred and One Dalmatians. In "And When the Sky Was Opened" he plays an astronaut back
  from a mysterious flight who watches his crewmates vanish from existence one by one.

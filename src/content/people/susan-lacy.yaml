bio: >-
  Susan Lacy directed and produced Rod Serling: Submitted for Your Approval (1995), the American Masters documentary
  on Serling's life and career, narrated by Lee Grant and drawing on interviews with his family and colleagues.
  She created PBS's American Masters in 1986 and led it for nearly three decades, winning multiple Emmys and Peabody
  Awards, and later directed the HBO documentaries Spielberg and Jane Fonda in Five Acts.

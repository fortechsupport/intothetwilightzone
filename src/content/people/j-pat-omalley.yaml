born: '1904-03-15'
died: '1985-02-27'
bio: >-
  J. Pat O'Malley appeared in four original-series episodes, most memorably as Old Ben, the kindly alien fugitive
  befriended by a lame girl, in "The Fugitive" (1962); he also appeared in "The Chaser," "The Self-Improvement of
  Salvadore Ross" and "Mr. Garrity and the Graves." The English-born actor was a favorite Disney voice, including
  Colonel Hathi and Buzzie the vulture in The Jungle Book and Tweedledum and Tweedledee in Alice in Wonderland.

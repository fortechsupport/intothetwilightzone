name: William F. Wu
roles:
- author
born: '1951'
bio: >-
  William F. Wu wrote "Wong's Lost and Found Emporium" (1983), the story of a Chinese American man searching a timeless
  shop for the compassion he has lost, adapted as a 1985 revival segment in 1985. A science-fiction author, he received
  Hugo and Nebula nominations for the story and wrote books in the Isaac Asimov's Robots in Time series.

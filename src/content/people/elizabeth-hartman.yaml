born: '1943-12-23'
died: '1987-06-10'
bio: >-
  Elizabeth Hartman starred as Tess Mills, a young schoolteacher in a remote frontier town who is visited by the
  ghost of a drowned boy, in "The Dark Boy" (1971), a second-season Night Gallery segment. She was nominated for
  the Academy Award for her first film, A Patch of Blue (1965), and appeared in The Group, You're a Big Boy Now
  and The Beguiled. Her last major role was voicing Mrs. Brisby in The Secret of NIMH (1982).

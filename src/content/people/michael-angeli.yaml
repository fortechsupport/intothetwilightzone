bio: >-
  Michael Angeli wrote three episodes of the 2002 UPN revival of The Twilight Zone: "Tagged," "How Much Do You Love
  Your Kid?" and, with Bradley Thompson, "Homecoming." He went on to write and produce for the reimagined Battlestar
  Galactica, one of several revival writers who moved to that series.

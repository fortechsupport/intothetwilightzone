bio: >-
  Noam Pitlik appeared in "Death in the Family" (1971), the Night Gallery segment in which a fugitive hides out
  with a mortician who keeps a family of corpses. A character actor through the 1960s, he became a television director
  and won an Emmy for directing Barney Miller.

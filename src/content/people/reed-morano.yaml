bio: >-
  Reed Morano directed Meadowland (2015), her feature debut, in which a member of a grief support group says losing
  his child feels like being in the Twilight Zone. She first made her name as a cinematographer on Frozen River
  and Beyoncé's Lemonade. She won the Emmy for directing the pilot of The Handmaid's Tale and later directed I Think
  We're Alone Now and The Rhythm Section.

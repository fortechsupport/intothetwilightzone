name: Angel Tompkins
born: '1942-12-20'
roles:
- actor
bio: >-
  Angel Tompkins appeared in "Room with a View," a segment of Night Gallery's first season, as a nurse caught up
  in a bedridden man's scheme. She earned a Golden Globe nomination for the comedy I Love My Wife (1970) and played
  opposite Lee Marvin and Gene Hackman in Prime Cut (1972). She worked widely in 1970s television and later served
  as an officer of the Screen Actors Guild.

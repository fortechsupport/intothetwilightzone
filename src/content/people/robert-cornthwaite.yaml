bio: >-
  Robert Cornthwaite played the harried director of a TV western in Serling's comedy "Showdown with Rance McGrew."
  He is best known as the coldly rational Dr. Carrington in The Thing from Another World (1951), and appeared in
  War of the Worlds and Kiss Me Deadly. He worked into his eighties, with later roles on Picket Fences and in Matinee.

bio: >-
  "Josh Rogan" is the pseudonym under which screenwriter Melissa Mathison, writer of E.T. the Extra- Terrestrial,
  is credited for her work on Steven Spielberg's "Kick the Can" segment of Twilight Zone: The Movie (1983), alongside
  George Clayton Johnson and Richard Matheson. Mathison, who was married to Harrison Ford, also wrote The Black
  Stallion and Kundun.

bio: >-
  Franc Ashman was a member of the ensemble of Anne Washburn's The Twilight Zone, the stage adaptation of original-series
  stories by Rod Serling, Charles Beaumont and Richard Matheson that premiered at London's Almeida Theatre in December
  2017 under director Richard Jones, with the cast playing multiple roles. Ashman is an English stage actor.

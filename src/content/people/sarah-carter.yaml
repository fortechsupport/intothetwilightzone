born: '1980-10-30'
bio: >-
  Sarah Carter is a Canadian actress, writer and director from Toronto who played Amber, one of the five cursed
  students, in the 2002 revival episode "Sunrise". She is known for Alicia Baker on Smallville, Madeleine Poe on
  Shark and Maggie on Falling Skies, and she wrote and directed the feature In Her Name.

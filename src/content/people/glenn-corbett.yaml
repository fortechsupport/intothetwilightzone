name: Glenn Corbett
born: '1933-08-17'
died: '1993-01-16'
roles:
- actor
bio: >-
  Glenn Corbett played the father in "Brenda," a second-season Night Gallery segment about a lonely girl who befriends
  a creature on a remote island. He replaced George Maharis as Martin Milner's traveling companion on Route 66,
  played Zefram Cochrane, the inventor of warp drive, in Star Trek's "Metamorphosis," and appeared in John Wayne's
  Chisum and Big Jake.

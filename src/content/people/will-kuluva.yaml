bio: >-
  Will Kuluva appeared in two episodes of the original series: as Father Tomás, the priest who tells Peter Falk's
  paranoid revolutionary Ramos Clemente that his only real enemy is himself, in "The Mirror" (1961), and as Ernest
  Ferguson, the wax museum owner who becomes one of the victims in "The New Exhibit" (1963). A stage-trained character
  actor, he worked steadily in television drama through the 1950s and 1960s.

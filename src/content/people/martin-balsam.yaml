bio: >-
  Martin Balsam was an Oscar- and Tony-winning character actor known for 12 Angry Men, Psycho and A Thousand
  Clowns. He is one of the few actors to appear in both the original Twilight Zone and its 1980s revival,
  playing a loyal agent and a wax-museum guard in the 1960s and returning in two revival segments in 1986.

bio: >-
  John Erick Dowdle directed Devil (2010), the M. Night Shyamalan-produced thriller about strangers trapped in a
  stalled elevator, often listed among films in the Twilight Zone vein. He works with his brother Drew Dowdle, with
  whom he made the found-footage horror films Quarantine and As Above, So Below and the thriller No Escape.

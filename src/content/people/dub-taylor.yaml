bio: >-
  Dub Taylor guest-starred on Rod Serling's western The Loner in "The Sheriff of Fetterman's Crossing" (1965). A
  former vaudeville performer, he was a comic sidekick in dozens of B westerns and later played C.W. Moss's father
  in Bonnie and Clyde and appeared in The Wild Bunch.

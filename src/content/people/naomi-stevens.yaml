name: Naomi Stevens
roles:
- actor
born: '1925-11-29'
bio: >-
  Naomi Stevens played the washroom attendant at the bus station in "Mirror Image" (1960), the episode in which
  Vera Miles's character keeps meeting her own double. A character actress, she appeared in Billy Wilder's The Apartment
  and played Sergeant Bella Archer on Vega$.

bio: >-
  Frances McDormand is one of the few performers to win the 'triple crown' of acting, with three Best
  Actress Oscars (Fargo, Three Billboards Outside Ebbing, Missouri and Nomadland), a Tony and an Emmy.
  Early in her career she starred in the 1986 segment "Need to Know", about a madness spreading through
  a small town that may be linked to the meaning of life.

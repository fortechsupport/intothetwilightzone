bio: >-
  Tony Albarella is a Twilight Zone historian and editor best known for As Timeless as Infinity, a multi-volume
  series collecting Rod Serling's complete Twilight Zone teleplays with commentary and background on each
  episode. He has also written for the Rod Serling Memorial Foundation, including remembrances of the
  series' cast and crew.

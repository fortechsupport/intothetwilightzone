name: Kenneth Tobey
roles:
- actor
born: '1917-03-23'
died: '2002-12-22'
bio: >-
  Kenneth Tobey appeared in "Finnegan's Flight" (1972), a Night Gallery segment about a convict and a hypnotist
  experimenting with the power of suggestion. He starred as Captain Hendry in The Thing from Another World (1951)
  and in other 1950s science-fiction films, led the series Whirlybirds, and later became a favourite of Joe Dante,
  appearing in The Howling, Gremlins and Innerspace.

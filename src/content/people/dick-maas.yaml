name: Dick Maas
born: '1951-04-15'
roles:
- director
bio: >-
  Dick Maas directed the spy-themed music video for Golden Earring's 1982 hit "Twilight Zone," a song that borrows
  the show's name, and the video became an early MTV staple. The Dutch filmmaker then made the horror film De Lift
  (The Lift, 1983), the thriller Amsterdamned and the comedy Flodder.

born: '1972-11-08'
bio: >-
  Gretchen Mol starred in "You Might Also Like" (2020), the second-season finale of the 2019 Twilight Zone, a satire
  of consumer culture in which a suburban woman is promised a mysterious product called "the Egg" and the Kanamits
  of "To Serve Man" return. She played Gillian Darmody on Boardwalk Empire and the title role in The Notorious Bettie
  Page (2005).

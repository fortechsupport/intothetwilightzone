name: Jacob Tremblay
roles:
- actor
born: '2006-10-05'
bio: >-
  Jacob Tremblay played Oliver Foley, an eleven-year-old internet personality who is elected President of the United
  States, in "The Wunderkind" (2019), from the first season of the Jordan Peele-hosted Twilight Zone, opposite John
  Cho as his campaign manager. The Canadian actor was acclaimed as a child for Room (2015) and starred in Wonder
  (2017), and voiced the title character of Pixar's Luca and Flounder in the 2023 The Little Mermaid.

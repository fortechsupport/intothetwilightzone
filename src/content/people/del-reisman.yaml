tz_credits:
- series: The Twilight Zone (1959)
  work: series
  role: associate producer and story consultant
born: '1924'
died: 2011-01
bio: >-
  Del Reisman worked under producer Buck Houghton on the original Twilight Zone, credited as associate producer
  and acting as the show's story consultant, reading submissions and working with writers on scripts. He came to
  the series from Playhouse 90, where he had been a story editor during live television's last great years. He went
  on to a long career as a television writer and story editor and served as president of the Writers Guild of America,
  West. He gave a full-length oral history to the Television Academy Foundation before his death in January 2011
  at 86.

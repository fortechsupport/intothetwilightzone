born: '1980'
bio: >-
  Brandon Jay McLaren appeared in "8," a second-season episode of the 2019 Twilight Zone revival about a research
  team in Antarctica and an intelligent octopus. The Canadian actor first came to wide notice as Jack Landors, the
  Red Ranger of Power Rangers S.P.D., and later starred in the USA series Graceland and in Slasher and Ransom.

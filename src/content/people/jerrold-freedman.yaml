name: Jerrold Freedman
roles:
- director
- writer
bio: >-
  Jerrold Freedman was one of Night Gallery's most active directors in 1970-71, handling "Room with a View," "Witches'
  Feast," "The Flip-Side of Satan," "Professor Peabody's Last Lecture" and Serling's "Dr. Stringfellow's Rejuvenator,"
  and both writing and directing "Marmalade Wine." He went on to direct the feature films Kansas City Bomber (1972)
  and Borderline (1980) and a number of television films.

born: '1958'
bio: >-
  Deran Sarafian directed "Mr. Motivation" (2002), an episode of the UPN revival of The Twilight Zone. The son of
  director Richard C. Sarafian, he directed the features Terminal Velocity and Gunmen and became a prolific television
  director, notably on House and CSI: Miami.

bio: >-
  Michael Baseleon appeared in "The Dark Boy" (1971), the John Astin-directed Night Gallery segment about a young
  widowed schoolteacher in 1890s Oregon who sees the ghost of a drowned boy. He was a character actor on stage and
  in 1960s-70s television.

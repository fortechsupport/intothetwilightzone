bio: >-
  Mimi Kennedy starred in "Aqua Vita" (1986), a 1985 revival segment about a woman who becomes dependent on a water
  that keeps her looking young. She played Abby O'Neil on Dharma & Greg and Marjorie on Mom, and is also a writer
  and activist.

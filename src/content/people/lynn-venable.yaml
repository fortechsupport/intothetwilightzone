name: Lynn Venable
roles:
- author
bio: >-
  Lynn Venable wrote "Time Enough at Last," the short story published in If magazine in January 1953 that became
  the 1959 episode in which Burgess Meredith's bookworm survives a nuclear war only to break his glasses. The story,
  credited as Lyn Venable in print, is one of the few she published; it is now in the public domain and available
  from Project Gutenberg.

bio: >-
  Dean Stockwell was a child star at MGM who matured into a Cannes-winning actor and an Oscar nominee
  for Married to the Mob, later beloved as Al Calavicci on Quantum Leap. In "A Quality of Mercy" he played
  an eager young American officer who suddenly finds himself in the uniform of the enemy; he returned
  to the franchise in the late-1980s revival.

born: '1939-09-10'
bio: >-
  Greg Mullavey played the husband of Melinda Dillon's character in "A Little Peace and Quiet" (1985), the revival's
  first-night episode about a woman whose pendant can stop time. He is best known as Tom Hartman, the title character's
  husband, on Mary Hartman, Mary Hartman (1976-77).

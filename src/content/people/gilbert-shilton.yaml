bio: >-
  Gilbert M. Shilton directed three episodes of the final season of the 1985 Twilight Zone revival: "The Hellgramite
  Method," "The Call" and "Love Is Blind." He was a busy action-drama director of the 1980s, with episodes of Knight
  Rider, The A-Team, Wiseguy and MacGyver to his name.

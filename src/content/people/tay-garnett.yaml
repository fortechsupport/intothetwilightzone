bio: >-
  Tay Garnett directed "Hunt the Man Down" (1965), an episode of Rod Serling's western The Loner. A studio- era
  director, he made One Way Passage, China Seas, The Postman Always Rings Twice (1946) and Bataan, and in his later
  years worked widely in television westerns.

bio: >-
  Sam Rolfe supplied the idea on which Serling based "A Quality of Mercy," the 1961 episode in which a hard- line
  lieutenant (Dean Stockwell) suddenly finds himself in the uniform of a Japanese officer. Rolfe was nominated for
  an Academy Award for co-writing the western The Naked Spur (1953). He co-created Have Gun – Will Travel and developed
  The Man from U.N.C.L.E., serving as its first-season producer.

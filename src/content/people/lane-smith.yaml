bio: >-
  Lane Smith appeared in "Profile in Silver" (1986), J. Neil Schulman's Kennedy time-travel story for the 1980s
  revival. A Southern character actor, he played Richard Nixon in The Final Days, the prosecutor in My Cousin Vinny
  and editor Perry White on Lois & Clark.

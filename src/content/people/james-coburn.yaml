name: James Coburn
roles:
- actor
born: '1928-08-31'
died: '2002-11-18'
bio: >-
  James Coburn played Major French, the soldier who leads post-nuclear survivors to defy the computer that has kept
  them alive, in "The Old Man in the Cave" (1963). He starred in The Magnificent Seven, Our Man Flint and Pat Garrett
  and Billy the Kid, and won the Academy Award for Best Supporting Actor for Affliction (1998).

born: '1945-12-04'
bio: >-
  Jon Korkes played Victor, the disfigured teenage son whose father arranges to send him to another planet, in Rod
  Serling's Night Gallery segment "The Different Ones" (1971). His film work includes Catch-22, The Day of the Dolphin
  and Little Murders.

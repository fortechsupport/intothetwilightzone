name: Elliott Gould
born: '1938-08-29'
roles:
- actor
bio: >-
  Elliott Gould starred in "The Misfortune Cookie," a 1985 revival segment from a Charles E. Fritch story, as a
  cruel food critic whose fortune cookies start coming true. He was nominated for an Academy Award for Bob & Carol
  & Ted & Alice and became a counterculture star as Trapper John in Robert Altman's M*A*S*H and Philip Marlowe in
  The Long Goodbye. Later audiences know him as Jack Geller on Friends and Reuben Tishkoff in the Ocean's films.

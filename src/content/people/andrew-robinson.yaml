born: '1942-02-14'
bio: >-
  Andrew Robinson appeared in two segments of the 1985 revival: "Profile in Silver" (1986), as John F. Kennedy,
  whom a time-traveling historian saves from assassination at terrible cost, and "Private Channel" (1987), about
  a teenager whose headphones let him hear other people's thoughts. He played the Scorpio killer in Dirty Harry
  (1971), Larry in Hellraiser, and the Cardassian tailor Garak on Star Trek: Deep Space Nine.

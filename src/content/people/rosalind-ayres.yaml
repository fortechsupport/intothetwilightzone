bio: >-
  Rosalind Ayres voiced a role in The Twilight Zone Radio Dramas version of "Passage on the Lady Anne," about a
  couple who book passage on a ship carrying only elderly passengers. The English actress appeared in the film That'll
  Be the Day and much British television. With her husband Martin Jarvis she has produced and directed many radio
  and audiobook dramas.

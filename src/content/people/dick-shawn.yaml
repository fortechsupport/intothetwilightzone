bio: >-
  Dick Shawn appeared in "Cold Reading," a 1986 segment of the revival set in a live 1940s radio studio where the
  sound effects come true. A frenetic comedian, he is remembered as the hippie Lorenzo St. DuBois who plays Hitler
  in Mel Brooks's The Producers and as Ethel Merman's son in It's a Mad, Mad, Mad, Mad World. He collapsed and died
  on stage during a stand-up performance in San Diego.

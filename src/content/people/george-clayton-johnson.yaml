bio: >-
  George Clayton Johnson was part of the Beaumont–Matheson circle and contributed some of The Twilight
  Zone's gentlest and most humane stories, including A Game of Pool, Nothing in the Dark and Kick the
  Can, the last of which was remade for Twilight Zone: The Movie. He also supplied the stories for The
  Four of Us Are Dying and Execution. Elsewhere he co-wrote the novel Logan's Run with William F. Nolan,
  wrote the story behind Ocean's 11, and scripted The Man Trap, the first Star Trek episode ever broadcast.

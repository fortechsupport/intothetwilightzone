name: Barry Levinson
born: '1942-04-06'
roles:
- director
bio: >-
  Barry Levinson directed Good Morning, Vietnam (1987), in which Robin Williams's disc jockey hums the Twilight
  Zone theme and spoofs Serling's opening narration on the air. Levinson won the Academy Award for directing Rain
  Man and also made Diner, The Natural and Wag the Dog, and produced Homicide: Life on the Street.

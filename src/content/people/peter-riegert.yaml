name: Peter Riegert
roles:
- actor
born: '1947-04-11'
bio: >-
  Peter Riegert starred as Gus Rosenthal, a man who travels back to his Depression-era childhood to comfort his
  younger self, in "One Life, Furnished in Early Poverty" (1985), adapted from Harlan Ellison's autobiographical
  story. He played Boon in National Lampoon's Animal House, starred in Local Hero and Crossing Delancey, and was
  nominated for an Oscar for his short film By Courier.

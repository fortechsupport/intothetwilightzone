bio: >-
  Comedian Marty Allen appeared in "Quoth the Raven" (1971), a Night Gallery blackout gag about Edgar Allan Poe's
  writer's block. He was half of the comedy team Allen & Rossi, famous for his "Hello dere!" catchphrase, and a
  frequent game-show panelist.

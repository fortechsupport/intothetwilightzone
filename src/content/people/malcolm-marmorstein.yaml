name: Malcolm Marmorstein
roles:
- writer
bio: >-
  Malcolm Marmorstein wrote "The Flip-Side of Satan" (1971), a second-season Night Gallery segment about a disc
  jockey who finds his radio station has been taken over by darker forces. He wrote for the soap opera Dark Shadows
  and Peyton Place and wrote the screenplay of Disney's Pete's Dragon (1977).

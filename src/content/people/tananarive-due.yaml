born: '1966-01-05'
bio: >-
  Tananarive Due has a writing credit on "A Small Town" (2020), a second-season episode of the 2019 Twilight Zone
  about a grieving handyman who discovers that a model of his town lets him repair the real one. An award-winning
  novelist of Black horror and speculative fiction, including The Good House and The Reformatory, she teaches a
  celebrated course on Black horror at UCLA and was an executive producer of the documentary Horror Noire. She frequently
  collaborates with her husband, writer Steven Barnes.

born: '1940-09-20'
died: '2012-04-14'
bio: >-
  William Finley played the disfigured composer Winslow Leach in Brian De Palma's Phantom of the Paradise (1974),
  a film introduced by Rod Serling's uncredited opening narration, one of his last film jobs. A friend of De Palma
  since college, he also appeared in Sisters, The Fury and Dressed to Kill.

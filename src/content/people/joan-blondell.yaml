name: Joan Blondell
roles:
- actor
born: '1906-08-30'
died: '1979-12-25'
bio: >-
  Joan Blondell played Phyllis Britt, the nagging wife whose husband's television shows him murdering her, in "What's
  in the Box" (1964). A wisecracking Warner Bros. star of the 1930s in Footlight Parade and Gold Diggers of 1933,
  she was nominated for an Academy Award for The Blue Veil (1951) and later appeared in The Cincinnati Kid and Grease.

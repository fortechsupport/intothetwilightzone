bio: >-
  Jason Rothenberg is among the writers attached at various times to Warner Bros.' long-gestating new Twilight Zone
  feature film, a project that has cycled through directors and scripts since 2011 without reaching production.
  He created The CW's post-apocalyptic series The 100 (2014-2020).

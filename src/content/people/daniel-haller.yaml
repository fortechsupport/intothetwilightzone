born: '1926'
bio: >-
  Daniel Haller directed the Night Gallery segment "I'll Never Leave You - Ever" (1972) and an episode of The Sixth
  Sense, the Universal psychic-investigator series whose episodes Rod Serling introduced in syndicated Night Gallery
  packages. He began as Roger Corman's art director, designing the gothic sets of the Edgar Allan Poe cycle, including
  House of Usher and The Pit and the Pendulum. He then directed the Lovecraft adaptations Die, Monster, Die! (1965)
  and The Dunwich Horror (1970) before a long run as a television director on series such as Buck Rogers in the
  25th Century.

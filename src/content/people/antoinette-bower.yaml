name: Antoinette Bower
born: '1932'
roles:
- actor
bio: >-
  Antoinette Bower played Eve Norda, the woman an astronaut meets on an unknown planet after his own world is destroyed,
  in "Probe 7, Over and Out," one of the series' Adam-and-Eve stories. A German-born, English- raised actress, she
  was a busy 1960s television guest star, including the alien Sylvia in Star Trek's "Catspaw."

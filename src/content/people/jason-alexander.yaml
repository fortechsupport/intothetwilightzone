bio: >-
  Jason Alexander is a Tony-winning stage performer best known for playing George Costanza on Seinfeld.
  He brought a dry, unsettling charm to the role of Death in "One Night at Mercy" in the 2002 series,
  and he also voiced leading roles in several of Falcon Picture Group's Twilight Zone radio adaptations,
  including "The Obsolete Man."

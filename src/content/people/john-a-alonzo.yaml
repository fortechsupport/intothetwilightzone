bio: >-
  Before he was a cinematographer, John A. Alonzo acted in "Dust," playing Luis Gallegos, the young Mexican man
  sentenced to hang for killing a child in a drunken accident. He became one of Hollywood's leading directors of
  photography, earning an Academy Award nomination for Chinatown (1974). His other films include Harold and Maude,
  Norma Rae, Scarface and Close Encounters of the Third Kind, on which he shot additional photography.

bio: >-
  M. Night Shyamalan directed Old (2021), which he called more Twilight Zone than Lost and credited to the show's
  influence, and Knock at the Cabin (2023), which reviewers described as his own Twilight Zone episode. His twist-driven
  films, beginning with The Sixth Sense (1999), Unbreakable and Signs, are among the most frequently compared to
  Serling's series in modern cinema.

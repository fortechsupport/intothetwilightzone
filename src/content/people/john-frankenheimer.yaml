born: '1930-02-19'
died: '2002-07-06'
bio: >-
  John Frankenheimer was Rod Serling's most important director in live television: he directed Serling's "Forbidden
  Area" (1956), the first broadcast of Playhouse 90, as well as "The Comedian" (1957) and "A Town Has Turned to
  Dust" (1958), and later directed the film Seven Days in May (1964) from Serling's screenplay. One of the defining
  directors of the live "golden age," he moved to features with The Manchurian Candidate (1962), Birdman of Alcatraz,
  Seconds and The French Connection II, and won four Emmys late in his career for cable films such as George Wallace.

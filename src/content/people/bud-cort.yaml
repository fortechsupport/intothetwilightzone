bio: >-
  Bud Cort played Willy Gardner, the friendless motel owner whose old trunk grants his wishes, in "The Trunk" (1988)
  on the revival's third season. He is best known as the death-obsessed young Harold in Hal Ashby's cult classic
  Harold and Maude (1971) and as the title character of Robert Altman's Brewster McCloud (1970). Later he had roles
  in films such as Dogma and The Life Aquatic with Steve Zissou.

bio: >-
  Josip Elic appeared in two Serling-written episodes of the original Twilight Zone, "The Obsolete Man" (1961) and
  "One More Pallbearer" (1962). A stage-trained New York character actor, he is best known on film as Bancini, one
  of the asylum inmates in One Flew Over the Cuckoo's Nest.

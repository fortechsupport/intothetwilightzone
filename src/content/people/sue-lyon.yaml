name: Sue Lyon
born: '1946-07-10'
died: '2019-12-26'
roles:
- actor
bio: >-
  Sue Lyon played the babysitter who takes a job with a vampire in "Miss Lovecraft Sent Me," a second-season Night
  Gallery comedy segment with Joseph Campanella. At 14 she was cast as the title character of Stanley Kubrick's
  Lolita (1962), winning a Golden Globe as most promising newcomer, and she followed it with John Huston's The Night
  of the Iguana.

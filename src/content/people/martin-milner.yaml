bio: >-
  Martin Milner played Paul Grinstead, the stranger who tries to reassure Vera Miles's frightened traveler in a
  bus depot, in the first-season episode "Mirror Image." He starred as Tod Stiles on the road series Route 66 (1960-1964)
  and as Officer Pete Malloy on Jack Webb's police drama Adam-12 (1968-1975). His films include Sweet Smell of Success
  and Gunfight at the O.K. Corral.

bio: >-
  Dan Gilvezan appeared in "Shatterday," the Harlan Ellison story that opened the 1985 revival, starring Bruce Willis
  as a man who calls his own apartment and reaches himself. He is best known as a voice actor, providing the voice
  of Peter Parker in Spider-Man and His Amazing Friends and of Bumblebee in the original Transformers cartoon.

born: '1956-08-19'
bio: >-
  Adam Arkin starred in "A Matter of Minutes" (1986), the revival's adaptation of Theodore Sturgeon's story about
  a couple who slip out of time and watch blue-clad workers build each next minute of the world. The son of Alan
  Arkin, he played Dr. Aaron Shutt on Chicago Hope and the philosopher Adam on Northern Exposure, and has directed
  episodes of many television series.

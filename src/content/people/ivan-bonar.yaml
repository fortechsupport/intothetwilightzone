bio: >-
  Ivan Bonar appeared in "A Question of Fear" (1971), the Night Gallery segment in which a fearless soldier of fortune
  (Leslie Nielsen) accepts a wager to spend a night in a haunted house. He was a working character actor in television
  during the 1960s and 1970s.

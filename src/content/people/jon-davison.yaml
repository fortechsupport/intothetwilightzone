bio: >-
  Jon Davison was associate producer of George Miller's Nightmare at 20,000 Feet segment of Twilight Zone: The Movie
  (1983). He came out of Roger Corman's New World Pictures and produced Airplane!, and later produced Paul Verhoeven's
  RoboCop and Starship Troopers.

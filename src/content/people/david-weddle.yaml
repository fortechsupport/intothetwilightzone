bio: >-
  David Weddle wrote three episodes of the 2002 UPN Twilight Zone, "Harsh Mistress," "Fair Warning" and "Homecoming,"
  with his longtime writing partner Bradley Thompson. The pair wrote and produced for Star Trek: Deep Space Nine
  and Battlestar Galactica, and later for CSI, Falling Skies and The Strain. Weddle is also a film historian whose
  biography of Sam Peckinpah, If They Move... Kill 'Em! (1994), is a standard work.

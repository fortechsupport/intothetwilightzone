name: Lesley Ann Warren
born: '1946-08-16'
roles:
- actor
bio: >-
  Lesley Ann Warren starred as Hyacinth, a vampire who falls for a mortal, in "Death on a Barge" (1973), a late
  Night Gallery segment directed by Leonard Nimoy. She starred in Rodgers and Hammerstein's Cinderella (1965), joined
  Mission: Impossible, and was nominated for an Academy Award for Victor/Victoria.

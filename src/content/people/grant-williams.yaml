born: '1931-08-18'
died: '1985-07-28'
bio: >-
  Grant Williams starred as Scott Carey in The Incredible Shrinking Man (1957), the Universal science-fiction classic
  adapted by Richard Matheson from his own novel, which preceded Matheson's work for The Twilight Zone and shares
  its existential tone. He also starred in The Monolith Monsters and played Greg MacKenzie on Hawaiian Eye.

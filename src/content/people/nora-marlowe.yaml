name: Nora Marlowe
roles:
- actor
born: '1915-08-13'
died: '1977-12-31'
bio: >-
  Nora Marlowe played Margaret Phillips, the housekeeper of an elderly invalid who receives mysterious phone calls
  in "Night Call" (1964), Richard Matheson's script directed by Jacques Tourneur. A radio and character actress,
  she later played Flossie Brimmer on The Waltons, Earl Hamner Jr.'s series.

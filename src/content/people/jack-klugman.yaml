bio: >-
  Jack Klugman was a stage-trained character actor who became a household name as sloppy sportswriter
  Oscar Madison on The Odd Couple and as the crusading medical examiner in Quincy, M.E. He is tied with
  Burgess Meredith for the most starring turns on the original Twilight Zone, headlining four episodes
  as a down-and-out trumpeter, a pool shark, a starship captain and a dying bookie.

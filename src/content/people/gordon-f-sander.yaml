bio: >-
  Gordon F. Sander wrote Serling: The Rise and Twilight of Television's Last Angry Man (Dutton, 1992), the second
  full-length biography of Rod Serling. The book follows Serling from Binghamton and the live-television era through
  The Twilight Zone and Night Gallery, and it emphasizes his battles with sponsors and networks. Sander is a journalist
  and historian, and the biography remains one of the standard sources on Serling's life.

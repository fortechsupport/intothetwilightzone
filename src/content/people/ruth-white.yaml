name: Ruth White
roles:
- actor
born: '1914-04-24'
died: '1969-12-03'
bio: >-
  Ruth White played the mother of the toy designer (Pat Hingle) who is drawn back to the street of his childhood
  in "The Incredible World of Horace Ford" (1963), Reginald Rose's script for the fourth season. A respected stage
  actress, she won an Emmy for Little Moon of Alban (1965) and appeared in To Kill a Mockingbird and Midnight Cowboy.

born: '1917-02-06'
died: '2016-12-18'
bio: >-
  Zsa Zsa Gabor starred in "The Painted Mirror" (1971), a second-season Night Gallery segment in which an antique
  dealer's mirror opens onto a prehistoric world. The Hungarian-born actress and socialite starred in Moulin Rouge
  (1952) and Orson Welles's Touch of Evil, but became famous above all as a television personality, celebrity of
  her nine marriages, and talk-show regular.

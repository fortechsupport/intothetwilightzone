name: Anton Leader
roles:
- director
born: '1913'
died: '1988'
bio: >-
  Anton Leader directed two original-series episodes: "Long Live Walter Jameson" (1960), about an ageless history
  professor, and "The Midnight Sun" (1961), about a heat-stricken Earth. He began as a radio director in the 1940s,
  then worked widely in television and directed the British science-fiction film Children of the Damned (1964).

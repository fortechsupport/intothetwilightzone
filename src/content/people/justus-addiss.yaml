bio: >-
  Justus Addiss directed "No Time Like the Past" (1963), in which Dana Andrews's scientist uses a time machine to
  try to change history, and he also directed "The Odyssey of Flight 33" (1961), about an airliner that slips back
  in time. He was a television director of the 1950s and 1960s, working on westerns and anthology series.

bio: >-
  Cindy Bridges, daughter of Lloyd Bridges, appeared in "Incident in the Middle of Nowhere" (1965), an episode of
  Rod Serling's western The Loner, which starred her father. Her brothers Beau and Jeff Bridges also acted, and
  Beau guested on the same series.

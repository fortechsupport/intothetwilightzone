bio: >-
  Christina Choe directed two episodes of the 2019 Twilight Zone revival, "Not All Men" (2019) and "A Human Face"
  (2020). A Korean American filmmaker, she wrote and directed Nancy (2018), which won the Waldo Salt Screenwriting
  Award at Sundance.

bio: >-
  Jackie Cooper played Jonathan West, a struggling Irish ventriloquist whose dummy Caesar talks him into crime,
  in "Caesar and Me" (1964). He was an Oscar-nominated child star at nine for Skippy (1931), later a television
  producer and Emmy-winning director, and played Perry White in the Superman films of 1978 to 1987.

bio: >-
  Robert Sterling played Douglas Winter, the despairing newspaper editor who sells his soul to a strange linotype
  operator (Burgess Meredith), in "Printer's Devil" (1963), Charles Beaumont's adaptation of his own story. He played
  George Kerby on the television series Topper and starred in MGM's Show Boat (1951).

bio: >-
  David Pasquesi voiced a role in "Nanobots," one of the original stories written for The Twilight Zone Radio Dramas.
  A veteran Chicago improviser and Second City alumnus, he performs the long-running improv show TJ & Dave and played
  Andrew Meyer, Selina's ex-husband, on Veep.

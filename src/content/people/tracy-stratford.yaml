bio: >-
  Tracy Stratford played Christie, the little girl whose talking doll Talky Tina declares war on her stepfather
  (Telly Savalas), in "Living Doll" (1963). She was also the voice of Lucy van Pelt in the original A Charlie Brown
  Christmas (1965).

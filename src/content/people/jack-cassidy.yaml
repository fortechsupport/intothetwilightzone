name: Jack Cassidy
born: '1927-03-05'
died: '1976-12-12'
roles:
- actor
bio: >-
  Jack Cassidy starred in "The Last Laurel" (1971), the Night Gallery segment about an invalid who uses astral projection
  to spy on his wife. A Tony-winning Broadway leading man (She Loves Me), he played the vain actor Oscar North on
  He & She, a role often cited as a model for Ted Baxter, and was a Columbo murderer three times; he was the father
  of David and Shaun Cassidy.

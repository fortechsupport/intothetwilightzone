bio: >-
  Albert Salmi was an Actors Studio-trained performer who made his name on Broadway in Bus Stop and became
  a familiar face in TV Westerns. He appeared in three Twilight Zone episodes, as a time-displaced outlaw
  in "Execution", a battle-hardened sergeant in "A Quality of Mercy" and the Devil's client Feathersmith
  in "Of Late I Think of Cliffordville".

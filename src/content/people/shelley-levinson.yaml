bio: >-
  Shelley Levinson directed two segments of the 1980s revival: "But Can She Type?" (1985), in which a secretary
  escapes to a world where secretaries are celebrities, and "Time and Teresa Golowitz" (1987). Levinson worked as
  a television director and producer.

born: '1932-05-18'
died: '2013-06-16'
bio: >-
  Kim Hamilton played Frances Temple, the girlfriend of washed-up boxer Bolie Jackson, in Rod Serling's "The Big
  Tall Wish" (1960), one of the first network dramas with a predominantly Black cast. She also played Helen Robinson,
  the wife of the accused Tom Robinson, in To Kill a Mockingbird (1962).

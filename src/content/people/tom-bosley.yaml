name: Tom Bosley
roles:
- actor
born: '1927-10-01'
died: '2010-10-19'
bio: >-
  Tom Bosley appeared in "Eyes," the Steven Spielberg-directed segment of the 1969 Night Gallery pilot film, as
  the debt-ridden Sidney Resnick, who sells his eyesight to Joan Crawford's character, and returned in the series
  segment "Make Me Laugh" (1971). He won a Tony Award playing Fiorello La Guardia in the musical Fiorello! and became
  a television fixture as Howard Cunningham on Happy Days, later starring in Father Dowling Mysteries.

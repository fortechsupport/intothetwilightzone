name: Stephnie Weir
roles:
- actor
- voice actor
born: '1967'
bio: >-
  Stephnie Weir voiced roles in two Twilight Zone Radio Dramas, the full-cast audio remakes of the original series:
  Earl Hamner Jr.'s Ozark witch tale "Jess-Belle" and "Stopover in a Quiet Town." A Chicago improv performer, she
  was a cast member of MADtv from 2000 to 2006 and later appeared in The Comedians and other comedies.

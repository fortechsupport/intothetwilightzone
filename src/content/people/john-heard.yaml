born: '1946-03-07'
died: '2017-07-21'
bio: >-
  John Heard voiced roles in The Twilight Zone Radio Dramas adaptations of "In His Image" and "You Drive." He played
  the father in Home Alone and its sequel, and is admired for Cutter's Way, Big, Chilly Scenes of Winter and Beaches.
  His role as the corrupt detective Vin Makazian on The Sopranos earned him an Emmy nomination.

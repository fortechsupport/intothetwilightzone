bio: >-
  Dick Wilson appeared in "Ninety Years Without Slumbering" (1963), the fifth-season episode about an old man who
  believes he will die when his grandfather clock stops. A character actor who often played drunks, he is best known
  as Mr. Whipple, who begged shoppers not to squeeze the Charmin in hundreds of TV ads.

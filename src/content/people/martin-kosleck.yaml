born: '1904-03-24'
died: '1994-01-16'
bio: >-
  Martin Kosleck appeared in "The Devil Is Not Mocked" (1971), Night Gallery's wartime tale in which a Nazi unit
  occupying a Balkan castle discovers that its host, played by Francis Lederer, is Count Dracula. The German-born
  actor, who left his homeland in the early 1930s, became Hollywood's most frequent portrayer of Joseph Goebbels,
  beginning with Confessions of a Nazi Spy (1939), and also played sinister roles in Universal horror films such
  as The Mummy's Curse and House of Horrors.

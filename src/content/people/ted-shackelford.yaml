bio: >-
  Ted Shackelford starred in "The Crossing" (1988), a third-season episode of the 1985 revival about a priest haunted
  by a vision connected to a fatal accident in his past. He is best known as Gary Ewing on Dallas and its long-running
  spinoff Knots Landing.

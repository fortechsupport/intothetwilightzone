bio: >-
  Penny Singleton played the long-suffering wife of a noise-loving shipbuilder in "Sounds and Silences" (1964),
  a fifth-season comedy. She starred as Blondie Bumstead in more than two dozen Blondie films and later voiced Jane
  Jetson in The Jetsons; she was also a union leader in the American Guild of Variety Artists.

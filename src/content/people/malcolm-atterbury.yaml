name: Malcolm Atterbury
roles:
- actor
born: '1907-02-20'
died: '1992-08-23'
bio: >-
  Malcolm Atterbury played Henry J. Fate, the traveling peddler who sells a washed-up gunfighter a potion, in "Mr.
  Denton on Doomsday" (1959), the series' third episode, and later appeared in "No Time Like the Past" (1963). A
  busy character actor of the 1950s and 1960s, he is the man at the rural bus stop in Hitchcock's North by Northwest
  and appeared in The Birds and dozens of television westerns.

born: '1953-02-21'
bio: >-
  William L. Petersen starred in "Need to Know" (1986), a 1980s-revival segment written by Sidney Sheldon's daughter
  Mary Sheldon, about a census taker investigating a town where a secret drives people mad. He starred in To Live
  and Die in L.A. and Manhunter and later played Gil Grissom on CSI: Crime Scene Investigation.

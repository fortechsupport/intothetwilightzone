born: '1979-06-02'
bio: >-
  Morena Baccarin starred in "Downtime" (2020), a second-season episode of the 2019 Twilight Zone in which a hotel
  manager learns that her life is a simulation. The Brazilian-born actress played Inara Serra in Firefly and Serenity,
  Jessica Brody on Homeland, and Vanessa in the Deadpool films.

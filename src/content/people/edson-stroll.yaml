bio: >-
  Edson Stroll played two of the original series' handsome young men: Walter Smith, the "normal-looking" man who
  leads Donna Douglas's outcast away in "Eye of the Beholder," and the young body offered to an aging husband in
  "The Trade-Ins." A former bodybuilder, he was a regular as Virgil Edwards on McHale's Navy and played in Snow
  White and the Three Stooges.

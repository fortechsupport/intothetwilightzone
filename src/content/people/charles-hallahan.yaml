born: '1943-07-29'
died: '1997-11-25'
bio: >-
  Charles Hallahan played one of Bill Connor's bar companions in "Time Out," John Landis's segment of Twilight Zone:
  The Movie (1983). A stage-trained character actor, he appeared in John Carpenter's The Thing and played Captain
  Charlie Devane on the police drama Hunter.

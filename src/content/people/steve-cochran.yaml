name: Steve Cochran
born: '1917-05-25'
died: '1965-06-15'
roles:
- actor
bio: >-
  Steve Cochran played Fred Renard, a small-time crook who bullies a peddler who always knows what people need,
  in the first-season episode "What You Need," based on a Henry Kuttner and C. L. Moore story. A rugged Warner Bros.
  heavy, he appeared in White Heat, The Best Years of Our Lives and Michelangelo Antonioni's Il Grido. He died aboard
  his yacht off Guatemala at 48.

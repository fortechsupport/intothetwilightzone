born: '1947-02-03'
bio: >-
  Stephen McHattie appeared in "Rendezvous in a Dark Place" (1989), a third-season revival episode about a woman
  who haunts funerals and falls for Death. The Canadian actor, known for his gaunt intensity, starred in Pontypool
  (2008), played the original Nite Owl, Hollis Mason, in Watchmen, and appeared in A History of Violence.

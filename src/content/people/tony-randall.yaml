born: '1920-02-26'
died: '2004-05-17'
bio: >-
  Tony Randall played the title role and six other characters in 7 Faces of Dr. Lao (1964), George Pal's fantasy
  film scripted by Charles Beaumont from Charles G. Finney's novel. Randall is best remembered as Felix Unger on
  The Odd Couple, which won him an Emmy, and for comedies opposite Doris Day and Rock Hudson.

bio: >-
  Ana Lily Amirpour, writer-director of the Persian-language vampire film A Girl Walks Home Alone at Night
  (2014), directed two episodes of the 2019 revival, the Christmas Eve story A Traveler in the first season
  and Ovation in the second.

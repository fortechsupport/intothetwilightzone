born: '1944-01-19'
bio: >-
  Shelley Fabares played Ellen Tillman, the girl next door who falls for one of a trio of motorcycle-riding aliens,
  in "Black Leather Jackets" (1964). She played Mary Stone on The Donna Reed Show, had a number-one hit with "Johnny
  Angel," starred opposite Elvis Presley in three films, and played Christine Armstrong on Coach.

bio: >-
  Tommy Morgan is credited for music on the original Twilight Zone in its later seasons. He is best known as one
  of Hollywood's busiest harmonica players, heard on hundreds of film and television soundtracks and pop records.
  His Twilight Zone credits come from music recorded for the series and reused across episodes.

bio: >-
  Jerry Goldsmith was a young CBS staff composer when he wrote original scores for several original-series
  episodes, including The Four of Us Are Dying, Back There, Dust and the nearly wordless The Invaders,
  and his cues were reused across many more. Two decades later he returned to the franchise to score Twilight
  Zone: The Movie, giving each of its four segments its own musical identity. In between he became one
  of Hollywood's most celebrated composers, winning the Oscar for The Omen and scoring Planet of the Apes,
  Chinatown, Alien and five Star Trek films.

bio: >-
  Welsh actor John Rhys-Davies played Sallah in the Indiana Jones films and Gimli in The Lord of the Rings,
  and starred on Sliders. He voiced the leads in the radio adaptations of "Once Upon a Time" and "The
  Time of Your Life."

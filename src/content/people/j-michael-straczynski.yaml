born: '1954-07-17'
bio: >-
  J. Michael Straczynski joined the 1985 revival for its Canadian-produced syndicated third season, first
  as a story editor and then as its sole story editor, and wrote more of that season's episodes than anyone
  else, including The Curious Case of Edgar Witherspoon, Dream Me a Life and The Wall. He went on to create
  Babylon 5, co-create Sense8 and write the screenplay for Changeling, as well as long runs on Marvel
  comics.

bio: >-
  Anne Twomey played the adult Nola Granville, the woman who lives out a whole life as a hologram, in "Her Pilgrim
  Soul" (1985), one of the revival's most admired segments. A stage actress, she was nominated for a Tony Award
  for the courtroom drama Nuts (1980). On screen she appeared in films such as Deadly Friend (1986) and in many
  television series.

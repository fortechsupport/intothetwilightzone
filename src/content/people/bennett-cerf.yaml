died: '1971-08-27'
bio: >-
  Bennett Cerf receives source credit on "Twenty-Two" (1961) because Rod Serling based the episode on a ghost story
  ("Room for One More") that Cerf retold in his anthology Famous Ghost Stories. The tale, an old piece of folklore,
  concerns a dream of a morgue attendant who says there is room for one more. Cerf co-founded Random House and was
  a fixture on television as a panelist on What's My Line? from 1951 to 1967.

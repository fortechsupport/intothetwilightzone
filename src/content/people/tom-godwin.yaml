name: Tom Godwin
roles:
- author
born: '1915-06-06'
died: '1980-08-31'
bio: >-
  Tom Godwin wrote "The Cold Equations" (1954), the famous Astounding Science Fiction story of a stowaway girl on
  an emergency rocket whose extra weight dooms her, adapted by Alan Brennert for the 1980s revival in 1989. The
  story is one of the most anthologized and argued-over in science fiction; Godwin also wrote the novels The Survivors
  and The Space Barbarians.

name: Geraldine Page
born: '1924-11-22'
died: '1987-06-13'
roles:
- actor
bio: >-
  Geraldine Page starred in three Night Gallery segments: "The Sins of the Fathers" (1972), as a Welsh widow who
  hires her son out as a sin-eater, "Stop Killing Me" (1972) and "Something in the Woodwork" (1973). One of the
  great American stage and film actresses, she was nominated for eight Academy Awards and won for The Trip to Bountiful.

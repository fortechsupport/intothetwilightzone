bio: >-
  Burt Lancaster starred as General James Mattoon Scott, the officer plotting a military coup, in Seven Days in
  May (1964), John Frankenheimer's film of Rod Serling's screenplay. He won the Academy Award for Elmer Gantry and
  starred in From Here to Eternity, Sweet Smell of Success, The Leopard and Atlantic City.

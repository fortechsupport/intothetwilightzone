bio: >-
  Walter Doniger directed "Clean Kills and Other Trophies," the first-season Night Gallery segment written by Rod
  Serling, about a big-game hunter who forces his son to make a kill. A veteran screenwriter and television director,
  he directed dozens of episodes of Peyton Place and episodes of Maverick and The Mod Squad.

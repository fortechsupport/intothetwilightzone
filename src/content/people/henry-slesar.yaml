bio: >-
  Prolific mystery and suspense writer Henry Slesar supplied the source stories for two fifth-season Twilight
  Zone episodes, The Old Man in the Cave and The Self-Improvement of Salvadore Ross, both scripted by
  others. His tale Examination Day was adapted for the 1985 revival by Philip DeGuere. He was a mainstay
  of Alfred Hitchcock Presents and won an Emmy as head writer of the soap opera The Edge of Night.

bio: >-
  French-born Robert Florey, a Hollywood director since the silent era, directed three original-series
  episodes: Perchance to Dream, The Fever and The Long Morrow. His earlier career included co-directing
  the Marx Brothers' first film, The Cocoanuts (1929), and Universal's Murders in the Rue Morgue (1932).

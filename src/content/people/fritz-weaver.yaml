bio: >-
  Fritz Weaver was a Tony-winning stage actor with a long run of screen roles, from Fail-Safe to the miniseries
  Holocaust. He played a scientist fleeing nuclear war in "Third from the Sun" and the totalitarian Chancellor
  in "The Obsolete Man", then returned to the franchise in the 1985 revival's "The Star".

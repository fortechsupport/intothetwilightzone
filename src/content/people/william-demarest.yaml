bio: >-
  William Demarest starred as Joe Britt, the cab driver whose TV set starts showing his past and his murder, in
  "What's in the Box" (1964). A veteran of Preston Sturges comedies, he was nominated for an Oscar for The Jolson
  Story and played Uncle Charley on My Three Sons.

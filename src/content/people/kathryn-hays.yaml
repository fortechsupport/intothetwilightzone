name: Kathryn Hays
roles:
- actor
born: '1933-07-26'
died: '2022-03-25'
bio: >-
  Kathryn Hays appeared in "She'll Be Company for You" (1972), a third-season Night Gallery episode about a widower
  haunted after his invalid wife's death. She is best known as Kim Hughes on As the World Turns, which she played
  for nearly four decades, and as the mute empath Gem in the Star Trek episode "The Empath."

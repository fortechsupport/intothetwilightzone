name: George Mitchell
born: '1905'
died: '1972'
roles:
- actor
bio: >-
  George Mitchell, a lean, weathered character actor, appeared in three original-series episodes: "Execution" (1960),
  Earl Hamner's "Jess-Belle" (1963), and "Ring-a-Ding Girl" (1963). He worked mostly in television westerns and
  rural dramas, typically as farmers, preachers and old-timers.

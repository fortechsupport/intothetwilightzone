bio: >-
  Dean Winters appeared in "Future Trade" (2002), an episode of the UPN Twilight Zone revival. He played the scheming
  inmate Ryan O'Reily on HBO's Oz, Liz Lemon's ex Dennis Duffy on 30 Rock, and the chaos-causing "Mayhem" in Allstate's
  long-running commercials.

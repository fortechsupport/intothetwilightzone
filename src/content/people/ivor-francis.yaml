bio: >-
  Ivor Francis appeared in two Night Gallery segments, "The Phantom Farmhouse" (1971) and "Little Girl Lost" (1972).
  A character actor often cast as academics and officials, he appeared in many 1960s and 70s TV series; his daughter
  is General Hospital star Genie Francis.

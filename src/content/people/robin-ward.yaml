bio: >-
  Canadian actor and broadcaster Robin Ward replaced Charles Aidman as narrator for the 1985 revival's
  Canadian-produced third season (1988–89), and also re-recorded Aidman's narrations when the earlier
  episodes were re-edited into half-hour form for syndication.

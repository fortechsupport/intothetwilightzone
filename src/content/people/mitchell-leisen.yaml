bio: >-
  Mitchell Leisen, a former costume and set designer for Cecil B. DeMille who became one of Paramount's
  top directors of the 1930s and 1940s, directed three first-season Twilight Zone episodes late in his
  career: The Sixteen-Millimeter Shrine, Escape Clause and People Are Alike All Over. His best-known films
  include Midnight (1939) and Hold Back the Dawn (1941).

bio: >-
  Justin Benson co-directed "8" (2020), the second-season episode of the 2019 Twilight Zone revival about an Arctic
  research team menaced by an intelligent octopus, with his longtime filmmaking partner Aaron Moorhead. The duo
  made the low-budget genre films Resolution, Spring, The Endless and Something in the Dirt, and directed episodes
  of Moon Knight and Loki.

bio: >-
  Allison Tolman appeared in "The Wunderkind," a 2019 episode of the Jordan Peele revival in which a campaign manager
  helps an 11-year-old YouTube star win the presidency. She broke through as Deputy Molly Solverson in the first
  season of FX's Fargo, earning Emmy and Golden Globe nominations, and later starred in Emergence and Why Women
  Kill.

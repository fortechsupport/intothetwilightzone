name: Beau Bridges
born: '1941-12-09'
roles:
- actor
bio: >-
  Beau Bridges guest-starred in the two-part The Loner episode "The Mourners for Johnny Sharp" (1966), opposite
  his father Lloyd Bridges, who starred in Rod Serling's western. The elder brother of Jeff Bridges, he won Emmys
  for Without Warning: The James Brady Story and The Second Civil War and starred in The Fabulous Baker Boys and
  Stargate SG-1.

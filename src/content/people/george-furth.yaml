born: '1932-12-14'
died: '2008-08-11'
bio: >-
  George Furth acted in "The Little Black Bag," Rod Serling's Night Gallery adaptation (1970) of C. M. Kornbluth's
  story about a derelict doctor who finds a medical bag from the future. A familiar comic character actor in films
  such as Butch Cassidy and the Sundance Kid and Blazing Saddles, he is best known as the librettist of Stephen
  Sondheim's musicals Company (1970), which won him a Tony Award, and Merrily We Roll Along.

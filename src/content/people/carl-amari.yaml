  work: Series (2002 onward)
  role: producer
bio: >-
  Radio producer Carl Amari created The Twilight Zone Radio Dramas: beginning in 2002 he licensed the
  rights from the Rod Serling estate and produced full-cast audio adaptations of the original television
  scripts, each about 40 minutes long and led by a Hollywood guest star, with Stacy Keach as narrator.
  The dramas were broadcast in Britain on BBC Radio and in the US through CBS's distribution arm, and
  were heard on hundreds of radio stations and satellite radio.

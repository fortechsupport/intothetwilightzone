bio: >-
  Bill Bixby appeared in "The Thirty-Fathom Grave" (1963), the hour-long episode about a Navy destroyer that hears
  tapping from a sunken submarine, and in the Night Gallery segments "Last Rites for a Dead Druid" and "The Return
  of the Sorcerer" (both 1972). He starred in My Favorite Martian, The Courtship of Eddie's Father and, as David
  Banner, The Incredible Hulk, and directed episodes of Blossom.

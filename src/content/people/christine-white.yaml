name: Christine White
roles:
- actor
born: '1926'
died: '2013'
bio: >-
  Christine White played Julia Wilson, the wife of William Shatner's shaken passenger, in "Nightmare at 20,000 Feet"
  (1963), Richard Matheson's story of the gremlin on the wing. A stage and television actress of the 1950s and 1960s
  who worked often on anthologies such as Alfred Hitchcock Presents, she also had a featured part in Clint Eastwood's
  Magnum Force (1973).

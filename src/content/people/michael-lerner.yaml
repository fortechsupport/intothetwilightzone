bio: >-
  Michael Lerner appeared in "You Can Come Up Now, Mrs. Millikan" (1972), a comic Night Gallery segment about an
  inventor who keeps reviving his dead wife. He received an Academy Award nomination as studio boss Jack Lipnick
  in Barton Fink and appeared in Eight Men Out and Elf.

bio: >-
  Dennis Hopper was a Rebel Without a Cause co-star who directed the counterculture landmark Easy Rider
  and later played memorable villains in Blue Velvet and Speed. In Rod Serling's anti-fascist hour "He's
  Alive", he plays a small-time neo-Nazi rabble-rouser coached by the shadowy ghost of Hitler.

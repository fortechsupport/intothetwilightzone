born: '1951-05-30'
bio: >-
  Stephen Tobolowsky voiced leads in two Twilight Zone Radio Dramas, "The Chaser" and "Little Girl Lost," the audio
  remakes of original-series episodes. One of the most recognizable character actors of his generation, he played
  the insurance salesman Ned Ryerson in Groundhog Day and Sammy Jankis in Memento, and his storytelling podcast
  The Tobolowsky Files grew into books and a stage show.

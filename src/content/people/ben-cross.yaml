bio: >-
  Ben Cross starred in "Devil's Alphabet" (1986), the 1980s revival's adaptation of Arthur Gray's ghost story about
  a Victorian Cambridge club whose members swear to keep meeting after death. The English actor is best known as
  Olympic sprinter Harold Abrahams in Chariots of Fire and played Sarek in Star Trek (2009).

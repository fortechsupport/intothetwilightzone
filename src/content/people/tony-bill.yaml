born: '1940-08-23'
bio: >-
  Tony Bill appeared in "An Echo of Bugles," the first episode of Rod Serling's western The Loner (1965), opposite
  Lloyd Bridges. After acting in Come Blow Your Horn and other 1960s films, he co-produced The Sting, which won
  the Academy Award for Best Picture, and directed My Bodyguard (1980) and Five Corners.

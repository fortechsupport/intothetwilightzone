bio: >-
  Ellen Albertini Dow appeared in two episodes of the 1985 Twilight Zone revival, "The Storyteller" and "Need to
  Know." A drama teacher who began screen acting late in life, she became famous at 84 as the rapping grandmother
  who performs "Rapper's Delight" in The Wedding Singer (1998). She later played the foul-mouthed grandmother in
  Wedding Crashers and made many television guest appearances. She died at 101.

bio: >-
  Bruce Willis was a rising star on Moonlighting when he took the lead in the revival's premiere, then
  became one of the biggest action stars in the world with Die Hard; he retired from acting in 2022 after
  an aphasia diagnosis, later identified as frontotemporal dementia. In "Shatterday", adapted from Harlan
  Ellison's story, he plays a man who dials his own phone number and reaches a double who begins taking
  over his life.

bio: >-
  Gillian Jacobs starred in "Meet in the Middle" (2020), a second-season episode of the 2019 Twilight Zone about
  a lonely man who hears the thoughts of a woman he has never met. She is best known as Britta Perry on Community
  and Mickey Dobbs on the Netflix series Love.

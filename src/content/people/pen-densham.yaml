bio: >-
  English-born filmmaker Pen Densham co-founded Trilogy Entertainment Group, one of the production companies
  behind the 2002 revival, and served as an executive producer alongside John Watson, Mark Stern and Ira
  Steven Behr; he also wrote The Lineman. Densham and Watson had earlier revived another classic anthology,
  The Outer Limits, in 1995, and Densham co-wrote and produced Robin Hood: Prince of Thieves.

bio: >-
  Norman Foster directed the Loner episodes "Escort for a Dead Man" and "A Little Stroll to the End of the Line"
  (1965-66). An actor turned director, he made several Mr. Moto and Charlie Chan films, completed Journey into Fear
  for Orson Welles, and directed Disney's Davy Crockett and Zorro.

name: Sheree North
roles:
- actor
born: '1932-01-17'
died: '2005-11-04'
bio: >-
  Sheree North guest-starred in "Escort for a Dead Man" (1965), an episode of Rod Serling's western The Loner. Once
  groomed by 20th Century-Fox as a successor to Marilyn Monroe, she became a respected dramatic actress, Emmy-nominated
  for Lou Grant and Archie Bunker's Place, and played Kramer's mother on Seinfeld.

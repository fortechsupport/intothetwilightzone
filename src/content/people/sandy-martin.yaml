bio: >-
  Sandy Martin appeared in "Nightcrawlers" (1985), William Friedkin's segment of the 1985 revival about a Vietnam
  veteran whose memories take physical form at a roadside diner. She is known as Mrs. Mac on It's Always Sunny in
  Philadelphia and played Selma Green on Big Love.

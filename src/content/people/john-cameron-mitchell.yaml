born: '1963-04-21'
bio: >-
  John Cameron Mitchell appeared early in his career in "The Last Defender of Camelot" (1986), the 1985 revival's
  adaptation of Roger Zelazny's story about Lancelot surviving into the modern world, scripted by George R. R. Martin.
  He later wrote, directed and starred in Hedwig and the Angry Inch, and directed Shortbus and Rabbit Hole.

bio: >-
  Philip DeGuere Jr. was the executive producer who launched the first revival of The Twilight Zone on
  CBS in 1985, assembling a writing staff of science fiction authors that included Alan Brennert, Harlan
  Ellison and George R. R. Martin. He also wrote segments such as Nightcrawlers, Examination Day and Quarantine
  and directed others. DeGuere had earlier created the detective series Simon & Simon and written and
  directed the 1978 TV film Dr. Strange.

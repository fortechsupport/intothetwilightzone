bio: >-
  Novelist and screenwriter Martin M. Goldsmith wrote two fifth-season Twilight Zone episodes in 1964,
  What's in the Box and The Encounter; the latter, about a Japanese-American gardener and a WWII veteran,
  was long kept out of syndication because of its racial content. He is best remembered for the noir Detour
  (1945), adapted from his own novel, and for an Oscar nomination for The Narrow Margin.

bio: >-
  David Rayfiel wrote the Night Gallery segments "She'll Be Company for You" (1972), adapted from Andrew Benedict's
  story, and "Whisper" (1973). He is best known as Sydney Pollack's longtime screenwriting collaborator on Three
  Days of the Condor, Out of Africa, The Firm and other films.

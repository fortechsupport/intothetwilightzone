name: Patrick O'Neal
roles:
- actor
born: '1927-09-26'
died: '1994-09-09'
bio: >-
  Patrick O'Neal played Harmon Gordon, the aging husband who takes a youth serum and regresses into an infant, in
  "A Short Drink from a Certain Fountain" (1963), and later starred in "A Fear of Spiders" (1971), a Night Gallery
  segment about a fussy writer and his unwanted neighbor. A suave leading man of stage and screen, he created the
  role of the defrocked minister Shannon in Tennessee Williams's The Night of the Iguana on Broadway and appeared
  in King Rat and The Way We Were.

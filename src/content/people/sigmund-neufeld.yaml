name: Sigmund Neufeld
roles:
- director
bio: >-
  The director credited as Sigmund Neufeld on "Healer" (1985), the revival episode in which Eric Bogosian plays
  a thief who steals a Native American healing relic, is Sigmund Neufeld Jr., a prolific television director of
  the 1970s and 1980s. He is the son of Sigmund Neufeld, a producer of low-budget features at Producers Releasing
  Corporation in the 1930s and 1940s.

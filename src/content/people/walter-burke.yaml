name: Walter Burke
born: '1909-08-25'
died: '1984-08-04'
roles:
- actor
bio: >-
  Walter Burke played Joe Mizell, the manager of Ivan Dixon's washed-up boxer, in "The Big Tall Wish," one of the
  early network dramas to cast a Black actor in the lead without making race the subject. A small, wiry character
  actor, he appeared in All the King's Men and dozens of television series from the 1950s through the 1970s.

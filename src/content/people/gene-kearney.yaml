name: Gene Kearney
roles:
- writer
- director
bio: >-
  Gene Kearney was one of Night Gallery's most productive in-house talents, writing and often directing adaptations
  such as "The Devil Is Not Mocked," "Silent Snow, Secret Snow," "House – with Ghost," "The Painted Mirror" and
  "The Other Way Out," and directing Serling's "Finnegan's Flight." He frequently adapted classic weird-fiction
  authors for the series, including Manly Wade Wellman and Conrad Aiken, and directed comic blackout pieces like
  "Phantom of What Opera?" Before Night Gallery he wrote the screenplay for Curtis Harrington's psychological thriller
  Games (1967). His Night Gallery work spans all three seasons, making him one of the show's most frequent behind-the-camera
  names after Serling himself.

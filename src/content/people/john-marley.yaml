name: John Marley
roles:
- actor
born: '1907-10-17'
died: '1984-05-22'
bio: >-
  John Marley played Mr. Cox, the stern superintendent of a retirement home, in George Clayton Johnson's "Kick the
  Can" (1962). He was Oscar-nominated for Love Story, won the Venice best-actor award for John Cassavetes's Faces,
  and played the producer Jack Woltz who wakes beside a horse's head in The Godfather.

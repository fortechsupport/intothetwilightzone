bio: >-
  John Archer played one of the state troopers who corral bus passengers in a diner in "Will the Real Martian Please
  Stand Up?" (1961). He starred in Destination Moon and played opposite James Cagney in White Heat. His daughter
  Anne Archer appeared in Serling-produced work as well, in an episode of The Sixth Sense.

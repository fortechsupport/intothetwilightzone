bio: >-
  Hamilton Camp appeared in "The Little People of Killany Woods" (1986), J.D. Feigelson's 1985-revival episode set
  in an Irish village. A folk singer of the early 1960s turned character actor, he voiced characters in Smurfs and
  DuckTales and appeared in Star Trek: Deep Space Nine.

name: Richard Van Vleet
roles:
- actor
bio: >-
  Richard Van Vleet appeared in "The Nature of the Enemy" (1970), a short Night Gallery segment written by Rod Serling
  about a moon base whose missing astronauts were lured by a giant mousetrap. He later played Dr. Chuck Tyler on
  the soap opera All My Children.

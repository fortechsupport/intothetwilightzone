name: Sarah Marshall
roles:
- actor
born: '1933-05-25'
died: '2014-01-18'
bio: >-
  Sarah Marshall played Ruth Miller, the mother whose daughter falls through a wall into another dimension, in "Little
  Girl Lost" (1962), Richard Matheson's script that inspired parts of Poltergeist. The daughter of actor Herbert
  Marshall, she played Dr. Helen Noel in Star Trek's "Dagger of the Mind."

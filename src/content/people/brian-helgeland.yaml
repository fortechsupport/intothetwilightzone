bio: >-
  Brian Helgeland directed Payback (1999), whose booby-trapped-telephone climax has been traced by critics to the
  original series' Martin Landau spy episode "The Jeopardy Room." He won the Academy Award for co- writing L.A.
  Confidential and also wrote Mystic River and directed A Knight's Tale and 42.

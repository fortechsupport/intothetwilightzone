  role: executive producer (syndicated season, 1988-1989)
bio: >-
  Michael MacMillan was an executive producer of the syndicated third season of the 1985 Twilight Zone (1988-89),
  which was made in Toronto by his company Atlantis Films. A co-founder of Atlantis, he shared an Academy Award
  for the short film Boys and Girls in 1984. Atlantis later merged into Alliance Atlantis, which he led as chief
  executive.

name: Donald Todd
roles:
- writer
bio: >-
  Donald Todd wrote two segments of the first season of the 1985 Twilight Zone revival: "Dealer's Choice," in which
  the Devil sits in on a poker game, and "The Uncle Devil Show," about a children's television host with supernatural
  powers. Both are comic takes on the devil, a recurring subject of the revival's first year.

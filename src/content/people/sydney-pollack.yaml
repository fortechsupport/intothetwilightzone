born: '1934-07-01'
died: '2008-05-26'
bio: >-
  Sydney Pollack, then a young actor, played Willie Ross, the brash director who clashes with aging star Booth Templeton,
  in "The Trouble with Templeton" (1960). He became a leading director, winning Academy Awards for directing and
  producing Out of Africa, and making They Shoot Horses, Don't They?, Three Days of the Condor and Tootsie.

name: James Coco
roles:
- actor
born: '1930-03-21'
died: '1987-02-25'
bio: >-
  James Coco played Maxwell Turner, one half of a struggling playwriting team, in "Act Break" (1985), a story in
  which a magic amulet sends his partner back to Shakespeare's time. He won an Emmy for St. Elsewhere, was nominated
  for an Academy Award for Only When I Laugh, and was a Neil Simon regular on Broadway in Last of the Red Hot Lovers.

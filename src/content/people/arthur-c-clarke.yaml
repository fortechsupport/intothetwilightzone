born: '1917-12-16'
died: '2008-03-19'
bio: >-
  Arthur C. Clarke wrote "The Star" (1955), the Hugo-winning short story about a Jesuit astrophysicist who discovers
  that the star of Bethlehem was a supernova that destroyed a civilization; it was adapted as a segment of the 1985
  Twilight Zone revival with a script by Alan Brennert. One of the central figures of science fiction, he wrote
  Childhood's End, Rendezvous with Rama and The Fountains of Paradise, co-wrote 2001: A Space Odyssey with Stanley
  Kubrick, and first proposed geostationary communications satellites in 1945.

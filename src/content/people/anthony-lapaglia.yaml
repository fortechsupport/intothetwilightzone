born: '1959-01-31'
bio: >-
  Anthony LaPaglia appeared early in his career in "The Last Defender of Camelot" (1986), George R. R. Martin's
  revival adaptation of Roger Zelazny's story in which an immortal Lancelot faces Morgan le Fay in the present day.
  The Australian actor starred as Jack Malone on Without a Trace and won an Emmy as Daphne's brother Simon on Frasier.

name: Broderick Crawford
roles:
- actor
born: '1911-12-09'
died: '1986-04-26'
bio: >-
  Broderick Crawford starred with Cloris Leachman as the wealthy couple who brutalize their android servants in
  the Night Gallery segment "You Can't Get Help Like That Anymore" (1972). He won the Academy Award for Best Actor
  as Willie Stark in All the King's Men (1949) and starred as Dan Mathews on the syndicated police series Highway
  Patrol.

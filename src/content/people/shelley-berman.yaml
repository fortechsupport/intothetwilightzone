born: '1925-02-03'
died: '2017-09-01'
bio: >-
  Shelley Berman played Archibald Beechcroft, the misanthropic clerk who wills everyone else out of existence, in
  the original series' "The Mind and the Matter" (1961), and decades later voiced roles in The Twilight Zone Radio
  Dramas, including "Hocus-Pocus and Frisby," "The Hunt" and "Kick the Can." A pioneer of the sit-down comedy monologue,
  he won the first Grammy for a spoken comedy album with Inside Shelley Berman (1959), and late in life played Larry
  David's father on Curb Your Enthusiasm.

name: Ed Peck
roles:
- actor
born: '1917-03-26'
died: '1992-09-12'
bio: >-
  Ed Peck guest-starred in two episodes of Rod Serling's western The Loner, "The Kingdom of McComb" and "Pick Me
  Another Time to Die." A stocky character actor usually cast as policemen and officers, he played Officer Kirk
  on Happy Days and the Air Force colonel who discovers the Enterprise's crew in the Star Trek episode "Tomorrow
  Is Yesterday."

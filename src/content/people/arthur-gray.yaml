born: '1852'
died: '1940'
bio: >-
  Arthur Gray wrote "The Everlasting Club," a ghost story about a Cambridge dining club whose members keep meeting
  after death, which became the 1986 revival segment "Devil's Alphabet." Gray was Master of Jesus College, Cambridge,
  and a historian of the college, and published the story in his collection Tedious Brief Tales of Granta and Gramarye
  (1919).

name: Randy Quaid
roles:
- actor
born: '1950-10-01'
bio: >-
  Randy Quaid made one of his first screen appearances in the Night Gallery segment "The Late Mr. Peddington" (1972),
  about a woman who calmly arranges the funeral of a husband who is not yet dead. He earned an Academy Award nomination
  for The Last Detail and a Golden Globe for playing Lyndon Johnson in LBJ: The Early Years, and is known as Cousin
  Eddie in the National Lampoon's Vacation films.

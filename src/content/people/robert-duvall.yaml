bio: >-
  Robert Duvall was among the most respected American actors of his era, from Tom Hagen in The Godfather
  to his Oscar-winning country singer in Tender Mercies; his death at 95 was announced in February 2026.
  In "Miniature" he plays a shy, sheltered man who falls in love with a tiny woman living in a museum
  dollhouse, an hour-long episode later colorized.

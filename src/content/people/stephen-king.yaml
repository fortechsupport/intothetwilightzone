bio: >-
  Stephen King's short story "Gramma" was adapted by Harlan Ellison for the 1986 revival segment of the same name.
  He has long described the original series as a formative influence and discussed it at length in his nonfiction
  study of horror, Danse Macabre (1981). King also wrote for The Twilight Zone Magazine in the early 1980s. He is
  one of the best-selling authors in history, known for Carrie, The Shining, It and The Stand.

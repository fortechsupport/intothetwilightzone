name: Ralph Waite
born: '1928-06-22'
died: '2014-02-13'
roles:
- actor
bio: >-
  Ralph Waite played John Walton Sr. on The Waltons (1972-81), the CBS drama created and narrated by Earl Hamner
  Jr., who had written eight episodes of the original Twilight Zone. A former minister and publishing editor who
  came to acting in his thirties, Waite later played Jackson Gibbs on NCIS.

bio: >-
  Dan Aykroyd was an original Saturday Night Live cast member who co-created The Blues Brothers and co-wrote
  and starred in Ghostbusters. He opens and closes Twilight Zone: The Movie as the passenger who asks
  the driver, 'Do you want to see something really scary?'

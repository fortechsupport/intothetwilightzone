bio: >-
  John Alvin painted poster art for Twilight Zone: The Movie (1983). He was one of the best-known movie poster artists
  of his time, creating the posters for E.T. the Extra-Terrestrial, Blazing Saddles and many Disney films. He died
  in 2008.

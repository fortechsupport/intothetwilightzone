name: Joe Mantegna
roles:
- actor
born: '1947-11-13'
bio: >-
  Joe Mantegna starred in "Shelter Skelter" (1987) as Harry Dobbs, a survivalist who rides out what he believes
  is a nuclear war in his shelter and emerges to an unexpected world. A Tony winner for Glengarry Glen Ross, he
  is known for House of Games, The Godfather Part III, Criminal Minds and as the voice of Fat Tony on The Simpsons.

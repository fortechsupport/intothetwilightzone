name: George R. Robertson
born: '1933'
died: '2023'
roles:
- actor
bio: >-
  Canadian actor George R. Robertson appeared in "The Wall" (1989), one of the last episodes of the Toronto-made
  third season of the 1985 Twilight Zone revival. He is best known as Commissioner Henry Hurst in six Police Academy
  films, and also appeared in Airport and many Canadian productions.

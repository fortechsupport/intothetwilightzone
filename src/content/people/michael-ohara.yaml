bio: >-
  Michael O'Hara was an executive producer of Twilight Zone: Rod Serling's Lost Classics (1994), the CBS TV movie
  that filmed two unproduced Serling works: The Theatre, adapted by Richard Matheson from a Serling story, and Serling's
  own script Where the Dead Are. He made it with his partner Lawrence Horowitz, with whom he produced a long run
  of network TV movies.

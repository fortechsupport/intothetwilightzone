bio: >-
  Gary Collins starred as Dr. Michael Rhodes, a parapsychologist who investigates psychic phenomena, in all 25 episodes
  of The Sixth Sense (1972), the ABC series whose episodes Universal later cut down, added Rod Serling introductions
  to, and folded into the syndicated Night Gallery package. He had earlier co-starred in The Wackiest Ship in the
  Army and Iron Horse, and later starred in the series Born Free. He later became a familiar host, fronting the
  daytime talk show Hour Magazine and the Miss America pageant for a decade.

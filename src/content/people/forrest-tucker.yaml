name: Forrest Tucker
roles:
- actor
born: '1919-02-12'
died: '1986-10-25'
bio: >-
  Forrest Tucker starred as the quack frontier medicine seller in "Dr. Stringfellow's Rejuvenator" (1971), a Night
  Gallery segment written by Rod Serling about a con man pressed to cure a dying child. He played Sergeant O'Rourke
  on F Troop and appeared in Sands of Iwo Jima and Auntie Mame, and starred on Broadway and on tour in The Music
  Man.

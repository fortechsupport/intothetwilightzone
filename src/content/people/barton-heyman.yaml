born: '1937-01-24'
died: '1996-05-15'
bio: >-
  Barton Heyman appeared in "Probe 7, Over and Out" (1963), the fifth-season episode in which a stranded astronaut
  (Richard Basehart) meets the last woman of another world, and the two turn out to be Adam and Eve. He played Dr.
  Klein in The Exorcist (1973) and appeared in Valdez Is Coming and Dead Man Walking.

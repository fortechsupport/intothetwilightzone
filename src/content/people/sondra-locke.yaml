bio: >-
  Sondra Locke starred in "A Feast of Blood," a second-season Night Gallery segment in which a woman is given a
  brooch that turns out to be a ravenous creature. She received an Academy Award nomination for her debut in The
  Heart Is a Lonely Hunter (1968). She co-starred with Clint Eastwood in six films, including The Outlaw Josey Wales
  and Every Which Way but Loose, and directed Ratboy and Impulse.

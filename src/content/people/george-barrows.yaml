name: George Barrows
roles:
- actor
born: '1914'
died: '1994'
bio: >-
  George Barrows played the gorilla in Night Gallery's "Hatred unto Death" (1973), about a couple who bring an African
  gorilla home. He was Hollywood's best-known gorilla-suit performer, owning his own costume, and played Ro-Man
  in Robot Monster (1953).

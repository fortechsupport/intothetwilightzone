bio: >-
  Stuart Whitman starred in two Night Gallery segments, "Lindemann's Catch," as a sea captain who nets a mermaid,
  and "Fright Night." He was nominated for an Academy Award for The Mark (1961) and appeared in The Comancheros,
  The Longest Day and Those Magnificent Men in Their Flying Machines. He starred in the western series Cimarron
  Strip.

bio: >-
  Richard Shepard directed "The Wunderkind" (2019), the 2019 revival episode in which a political consultant helps
  a child YouTuber win the presidency. He wrote and directed The Matador and The Hunting Party, and won an Emmy
  for directing the pilot of Ugly Betty.

bio: >-
  Harry J. Wild is credited as a director of photography on the original Twilight Zone in 1960, filling in on the
  series during its first two seasons. He was best known as an RKO cameraman of the 1940s, the shadowy film noir
  style of Murder, My Sweet being one of his credits, and he later shot musicals such as Gentlemen Prefer Blondes.

bio: >-
  Dorcey Wingo was the pilot of the helicopter that crashed during filming of John Landis's segment of Twilight
  Zone: The Movie in July 1982, killing Vic Morrow and child actors Myca Dinh Le and Renee Shin-Yi Chen. A Vietnam
  veteran, he was tried for involuntary manslaughter with Landis and three others and acquitted in 1987. The accident
  led to lasting changes in film safety rules for stunts, explosives and working with children.

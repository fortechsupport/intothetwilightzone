name: Jacques Tourneur
born: '1904-11-12'
died: '1977-12-19'
roles:
- director
bio: >-
  Jacques Tourneur directed "Night Call," the fifth-season episode from Richard Matheson's story about a lonely,
  elderly woman who receives telephone calls from a graveyard; it was his only Twilight Zone episode and one of
  his last directing jobs. For producer Val Lewton he directed the atmospheric horror films Cat People, I Walked
  with a Zombie and The Leopard Man, and he later made the noir classic Out of the Past and the British horror film
  Night of the Demon.

bio: >-
  Ed Wynn was a vaudeville and Ziegfeld Follies comic who hosted an early Emmy-winning TV variety show
  before reinventing himself as a dramatic actor late in life. He starred in "One for the Angels", the
  second Twilight Zone episode broadcast, as a pitchman who bargains with Death, and returned years later
  in "Ninety Years Without Slumbering".

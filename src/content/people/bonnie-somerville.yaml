bio: >-
  Bonnie Somerville appeared in the 2002 revival episode "How Much Do You Love Your Kid?" (2003) and voiced roles
  in the Twilight Zone Radio Dramas versions of "Nightmare as a Child" and "Number 12 Looks Just Like You." She
  is known for NYPD Blue, Cold Case and Friends, where she played Ross's girlfriend Mona.

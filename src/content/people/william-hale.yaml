born: '1931'
died: '2020'
bio: >-
  William Hale directed several second-season Night Gallery segments in 1971, including "Since Aunt Ada Came to
  Stay," "The Diary" and "A Midnight Visit to the Neighborhood Blood Bank." A Universal television director, he
  made the feature westerns Gunfight in Abilene (1967) and Journey to Shiloh (1968) and directed the 1979 television
  film S.O.S. Titanic. He died in June 2020.

name: Jack Elam
roles:
- actor
born: '1920-11-13'
died: '2003-10-20'
bio: >-
  Jack Elam played Avery, the rambling, mischievous old bus passenger stranded at a snowbound diner, in "Will the
  Real Martian Please Stand Up?" (1961). With his wandering eye he was one of the great western heavies, in films
  such as High Noon and Once Upon a Time in the West, before turning to comedy in Support Your Local Sheriff! and
  The Cannonball Run.

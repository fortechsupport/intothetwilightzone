name: Warren Oates
roles:
- actor
born: '1928-07-05'
died: '1982-04-03'
bio: >-
  Warren Oates appeared twice in the original series: as the jeep driver who takes Lieutenant Fitzgerald on his
  last trip in "The Purple Testament" (1960), and as Corporal Langsford, one of three National Guardsmen who slip
  back to Custer's last stand, in "The 7th Is Made Up of Phantoms" (1963). A favourite of Sam Peckinpah and Monte
  Hellman, he starred in The Wild Bunch, Two-Lane Blacktop and Bring Me the Head of Alfredo Garcia.

born: '1950-03-31'
bio: >-
  Ed Marinaro starred in "Father and Son Game" (1989), a third-season revival episode about a dying tycoon who transfers
  his mind into an android body. A record-setting Cornell running back and Heisman Trophy runner-up who played in
  the NFL, he became an actor and played Officer Joe Coffey on Hill Street Blues.

born: '1905-01-04'
died: '1992-11-22'
bio: >-
  Sterling Holloway played the television repairman whose set begins showing a bickering couple their own past and
  future in "What's in the Box" (1964). His reedy, unmistakable voice made him one of Disney's most important voice
  actors: the adult Flower in Bambi, the Cheshire Cat in Alice in Wonderland, Kaa in The Jungle Book, and the original
  Winnie the Pooh.

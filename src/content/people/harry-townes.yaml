name: Harry Townes
roles:
- actor
born: '1914-09-18'
died: '2001-05-23'
bio: >-
  Harry Townes played the small-time con man Arch Hammer, who can change his face at will, in "The Four of Us Are
  Dying" (1960), and the district attorney Henry Ritchie, who begins to suspect a condemned man's dream is real,
  in "Shadow Play" (1961). He returned to Serling's material in the Night Gallery segment "Lindemann's Catch" (1972).
  A busy character actor of 1950s and 1960s television, he appeared in Star Trek's "The Return of the Archons."
  In 1974 he was ordained an Episcopal priest while continuing to act.

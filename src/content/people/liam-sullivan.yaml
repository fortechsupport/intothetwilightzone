bio: >-
  Liam Sullivan appeared in "The Changing of the Guard" (1962), the third-season finale in which Donald Pleasence's
  retiring prep-school teacher is visited by the ghosts of former students. He played Parmen, the cruel telekinetic,
  in Star Trek's "Plato's Stepchildren" and made many guest appearances on 1960s television.

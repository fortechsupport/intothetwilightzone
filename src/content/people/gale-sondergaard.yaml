name: Gale Sondergaard
roles:
- actor
born: '1899-02-15'
died: '1985-08-14'
bio: >-
  Gale Sondergaard appeared in "The Dark Boy" (1971), the Night Gallery ghost story set in a frontier schoolhouse,
  during the late-career return that followed her blacklisting. She won the first Academy Award for Best Supporting
  Actress, for Anthony Adverse (1936), and played memorable villains in The Cat and the Canary and The Letter. Her
  career stalled after her husband, director Herbert Biberman, was jailed as one of the Hollywood Ten and she refused
  to testify before HUAC.

bio: >-
  Celia Lovsky played Viola Draper, the old woman introduced as the mother of Ann Blyth's ageless film star but
  who is really her daughter, in "Queen of the Nile" (1964). Born in Vienna, she acted on the Austrian and German
  stage and was married to Peter Lorre, with whom she came to Hollywood. She is best known as the Vulcan matriarch
  T'Pau in the Star Trek episode "Amok Time," and she also played Lon Chaney's mother in Man of a Thousand Faces
  (1957).

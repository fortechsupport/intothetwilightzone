bio: >-
  Ida Lupino holds two distinctions in Twilight Zone history: she starred in the first-season episode
  The Sixteen-Millimeter Shrine and later directed the fifth-season episode The Masks, making her the
  only woman to direct an episode of the original series and the only person to both act in and direct
  one. A star actress of the 1940s, she had become one of the very few women directing in Hollywood, with
  films such as The Hitch-Hiker (1953).

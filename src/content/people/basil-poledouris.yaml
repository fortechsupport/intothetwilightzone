bio: >-
  Basil Poledouris wrote music for the 1985 Twilight Zone during its CBS run. He was best known for his scores for
  Conan the Barbarian, RoboCop and The Hunt for Red October, and he won an Emmy for the miniseries Lonesome Dove.
  He died in 2006.

bio: >-
  Walter Brooke played Dr. Raymond Gordon, the doctor who gives his elderly brother Harmon a youth serum, in "A
  Short Drink from a Certain Fountain" (1963). A character actor in film and television from the 1950s to the 1980s,
  he is best remembered as Mr. McGuire, the guest who tells Dustin Hoffman that the future is "plastics" in The
  Graduate (1967). On television he played District Attorney Frank Scanlon on The Green Hornet.

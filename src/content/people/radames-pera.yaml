name: Radames Pera
born: '1960-09-14'
roles:
- actor
bio: >-
  Radames Pera played Paul, the boy who withdraws into a private world of imagined snow, in "Silent Snow, Secret
  Snow," the second-season Night Gallery adaptation of Conrad Aiken's story, narrated by Orson Welles. He is best
  known as the young Kwai Chang Caine, "Grasshopper," in the flashbacks of Kung Fu, and also appeared on Little
  House on the Prairie.

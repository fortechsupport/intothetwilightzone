bio: >-
  Hans Beimler wrote "The Pool Guy" (2002), an episode of the UPN revival of The Twilight Zone. A long-time writing
  partner of Ira Steven Behr, he wrote for Star Trek: The Next Generation and was a writer-producer on Star Trek:
  Deep Space Nine.

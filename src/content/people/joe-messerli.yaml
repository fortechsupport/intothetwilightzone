tz_credits:
- series: The Twilight Zone (1959)
  work: series
  role: designer and painter, season 1 title sequence (UPA)
bio: >-
  Joe Messerli designed and painted the original Twilight Zone logo and the airbrushed starfield of the first-season
  title sequence, made for CBS by the animation studio UPA in 1958-59. The opening he helped create, with its drifting
  stars and Bernard Herrmann's music, is the version heard behind Serling's first- season narration. He worked on
  the sequence with Rudy Larriva, Sam Clayberger and Herb Klynn.

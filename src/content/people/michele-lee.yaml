born: '1942-06-24'
bio: >-
  Michele Lee played Joan, the young wife whose husband's elderly Aunt Ada turns out to be a witch seeking a new
  body, in Night Gallery's "Since Aunt Ada Came to Stay" (1971). A Tony nominee for Seesaw, she co- starred in The
  Love Bug and is best known as Karen Fairgate MacKenzie throughout the run of Knots Landing.

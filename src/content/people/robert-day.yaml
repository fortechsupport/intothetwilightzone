died: '2017-03-17'
bio: >-
  Robert Day directed four episodes of The Sixth Sense (1972), including "The Man Who Died at Three and Nine" and
  "With Affection, Jack the Ripper"; the series was later syndicated in cut-down form within the Night Gallery package.
  The English director made British films such as The Green Man, Corridors of Blood and several Tarzan features,
  then directed widely for American television, including Dallas, and made the feature The Man with Bogart's Face
  (1980).

born: '1927'
bio: >-
  Charles E. Fritch wrote the short story "The Misfortune Cookie," adapted by Harlan Ellison for the 1986 revival
  segment starring Elliott Gould as a food critic tormented by fortune cookies. Fritch was a science-fiction and
  mystery writer associated with the Southern California circle of Ray Bradbury, Charles Beaumont and William F.
  Nolan, and edited Mike Shayne Mystery Magazine.

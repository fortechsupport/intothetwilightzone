bio: >-
  Jessica Williams appeared in "Six Degrees of Freedom," a 2019 episode of the Jordan Peele revival about a crew
  launching for Mars as nuclear war breaks out on Earth. She became known as a correspondent on The Daily Show with
  Jon Stewart, co-hosted the podcast and HBO series 2 Dope Queens, and starred in Shrinking and the Fantastic Beasts
  films.

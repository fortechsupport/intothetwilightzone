bio: >-
  Oliver Robins played Toby, the monster-obsessed boy who discovers the new neighbor is a vampire, in "Monsters!"
  (1986). He is best known as Robbie Freeling, the boy attacked by the clown doll and the tree, in Poltergeist (1982)
  and Poltergeist II.

born: '1920-10-09'
died: '2015-12-25'
bio: >-
  Jason Wingreen played the train conductor who calls out the stop for "Willoughby" in "A Stop at Willoughby" (1960),
  one of Rod Serling's most personal scripts, and later appeared in the Night Gallery segment "The Nature of the
  Enemy" (1970). He played Harry the bartender on All in the Family and Archie Bunker's Place, and was the original
  voice of the bounty hunter Boba Fett in The Empire Strikes Back.

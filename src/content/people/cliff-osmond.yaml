name: Cliff Osmond
roles:
- actor
born: '1937-02-26'
died: '2012-12-22'
bio: >-
  Cliff Osmond played Manolo, one of the frightened villagers in the Mexican border town of "The Gift" (1962), where
  a stranded alien's offering is destroyed out of fear. He became a favourite of Billy Wilder, appearing in Irma
  la Douce, Kiss Me, Stupid, The Fortune Cookie and The Front Page, and later taught acting and wrote on screen
  performance.

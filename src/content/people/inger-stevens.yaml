bio: >-
  Swedish-born Inger Stevens starred in films such as The World, the Flesh and the Devil and won a Golden
  Globe for the sitcom The Farmer's Daughter. She headlined two first- and second-season Twilight Zone
  episodes: the cross-country driver stalked by a hitchhiker in "The Hitch-Hiker" and the daughter who
  discovers what she really is in "The Lateness of the Hour".

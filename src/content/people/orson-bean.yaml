born: '1928-07-22'
died: '2020-02-07'
bio: >-
  Orson Bean starred as James B. W. Bevis, the cheerful eccentric whose guardian angel offers him a conventional
  life, in "Mr. Bevis" (1960), a Serling script originally intended as a pilot for its own series. Decades later
  he voiced a role in The Twilight Zone Radio Dramas adaptation of "The Changing of the Guard." A comedian and panelist
  on To Tell the Truth, he voiced Bilbo Baggins in the Rankin/Bass animated The Hobbit and acted in Dr. Quinn, Medicine
  Woman, Being John Malkovich and Desperate Housewives.

bio: >-
  David Hemblen appeared in "20/20 Vision" (1988), a Toronto-filmed third-season episode of the 1985 revival about
  a man whose new glasses let him see the near future. A British-born Canadian actor, he played Jonathan Doors on
  Earth: Final Conflict, appeared in several Atom Egoyan films, and voiced Magneto in X-Men: The Animated Series.

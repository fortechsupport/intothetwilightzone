name: Sally Field
roles:
- actor
born: '1946-11-06'
bio: >-
  Sally Field starred in "Whisper" (1973), a third-season Night Gallery episode in which a young wife acts as a
  medium for restless spirits. Then known for Gidget and The Flying Nun, she went on to win two Academy Awards for
  Best Actress, for Norma Rae (1979) and Places in the Heart (1984), and Emmys for Sybil and Brothers & Sisters.

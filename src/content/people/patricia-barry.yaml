bio: >-
  Patricia Barry was a prolific television actress of the 1950s through the 1990s, with long runs on soaps
  including Days of Our Lives and Guiding Light. She appeared in two original episodes, as a desirable
  office worker in "I Dream of Genie" and the indifferent object of a love potion in "The Chaser", and
  was one of several original-series veterans cast in Twilight Zone: The Movie.

name: Zamba
roles:
- animal performer
bio: >-
  Zamba was the trained lion credited in "The Jungle" (1961), Charles Beaumont's story of an engineer stalked through
  New York by African curses, appearing in the final scene. Raised by animal trainer Ralph Helfer using his "affection
  training" methods, Zamba worked in many films and television shows of the 1950s and 1960s, including The Lion
  (1962).

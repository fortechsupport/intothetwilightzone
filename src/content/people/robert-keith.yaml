bio: >-
  Robert Keith was a Broadway actor and playwright who became a busy film character actor in the 1950s,
  in pictures such as The Wild One and Guys and Dolls; he was the father of actor Brian Keith. He starred
  in "The Masks" as a dying millionaire who forces his greedy heirs to wear grotesque Mardi Gras masks
  until midnight.

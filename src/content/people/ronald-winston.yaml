name: Ronald Winston
roles:
- director
bio: >-
  Ronald Winston directed two Serling-written episodes of the original series' first season, "The Monsters Are Due
  on Maple Street" (1960), the classic parable of neighbors turning on each other, and "The Big Tall Wish" (1960).
  A stage and live-television director, he also directed on Broadway and made the features Ambush Bay and Banning.

name: Vincent Price
roles:
- actor
born: '1911-05-27'
died: '1993-10-25'
bio: >-
  Vincent Price starred in two Night Gallery segments: "Class of '99" (1971), as a professor administering a chilling
  final exam, and "The Return of the Sorcerer" (1972), from Clark Ashton Smith's story. His horror career intertwined
  with Twilight Zone writers: Roger Corman's House of Usher was scripted by Richard Matheson, The Haunted Palace
  and The Masque of the Red Death by Charles Beaumont, and The Last Man on Earth was adapted from Matheson's I Am
  Legend. He also acted in Serling's Playhouse 90 drama "Forbidden Area" (1956).

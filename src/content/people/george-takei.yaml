bio: >-
  George Takei, who spent part of his childhood in U.S. internment camps for Japanese Americans, became
  famous as Hikaru Sulu on Star Trek and later as an activist and social-media personality. In "The Encounter",
  an episode long withheld from syndication over its racial tensions, he plays a Japanese-American gardener
  confronting a bigoted WWII veteran.

born: '1947-05-25'
bio: >-
  Karen Valentine starred as a nurse facing an epidemic of people who simply stop functioning in "Many, Many Monkeys"
  (1989), a third-season segment of the 1980s revival. She won an Emmy as the young teacher Alice Johnson on Room
  222 and starred in many 1970s television films.

born: '1939-02-12'
bio: >-
  John D. Hancock directed five segments of the 1985 revival: "If She Dies," in which a grieving father finds the
  spirit of a dying girl in an antique bed, "A Saucer of Loneliness" (from Theodore Sturgeon's story), "Kentucky
  Rye," "Profile in Silver" and "The Library." He directed the cult horror film Let's Scare Jessica to Death (1971)
  and the baseball drama Bang the Drum Slowly (1973), and was the original director of Jaws 2 before being replaced
  early in production.

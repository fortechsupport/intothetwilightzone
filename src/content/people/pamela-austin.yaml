bio: >-
  Pamela Austin played Valerie, the friend who has already had "the Transformation," in "Number 12 Looks Just Like
  You" (1964), the episode about a society in which everyone is remade into one of a few attractive models. She
  acted in films and on television in the 1960s, including the Elvis Presley musical Kissin' Cousins (1964). She
  became widely known as the "Dodge Rebellion" girl in Dodge car commercials of the mid-1960s.

born: '1970-07-30'
bio: >-
  Christopher Nolan wrote and directed Memento (2000), the backwards-told thriller about a man without short-term
  memory that critics and fan lists regularly cite as a Twilight Zone-style puzzle film. His later work, including
  Inception, Interstellar and Tenet, keeps returning to the bending of time and identity. He won the Academy Awards
  for Best Director and Best Picture for Oppenheimer (2023).

name: Joe Mantell
roles:
- actor
born: '1915-12-21'
died: '2010-09-29'
bio: >-
  Joe Mantell starred as Jackie Rhoades, the cowardly small-time hood who argues with his bolder reflection, in
  "Nervous Man in a Four Dollar Room" (1960), playing both versions of himself, and played the mechanic Pole opposite
  Lee Marvin in Richard Matheson's "Steel" (1963). He also appeared in "The Trial in Paradise" on Serling's The
  Loner. Mantell was nominated for an Academy Award for Marty (1955) and delivered the last line of Chinatown: "Forget
  it, Jake. It's Chinatown."

born: '1944-01-10'
bio: >-
  William Sanderson appeared in "The Call" (1988), a third-season revival episode about a lonely man whose random
  phone call reaches a woman who wants to be with him. He played the genetic designer J. F. Sebastian in Blade Runner
  (1982), Larry of "Larry, Darryl and Darryl" on Newhart, and the hotel owner E. B. Farnum on Deadwood.

bio: >-
  James Franciscus played Lt. Mueller, the U-boat officer who wonders whether the men who sink a defenceless ship
  will be damned for it, in "Judgment Night" (1959). A Yale graduate, he became a television lead in the 1960s as
  a detective on Naked City and as the idealistic teacher in Mr. Novak, and later starred as a blind insurance investigator
  in Longstreet. On film he headed the cast of Beneath the Planet of the Apes (1970) and appeared in Marooned (1969).

name: Jim Hutton
born: '1934-05-31'
died: '1979-06-02'
roles:
- actor
bio: >-
  Jim Hutton played Major William Gart, one of three astronauts who vanish from existence one by one after returning
  from space, in "And When the Sky Was Opened" (1959). He starred in Where the Boys Are and as the detective in
  the series Ellery Queen; he was the father of actor Timothy Hutton.

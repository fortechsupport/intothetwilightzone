born: '1945-07-19'
bio: >-
  George Dzundza starred in "Red Snow" (1986), a revival episode in which a KGB colonel sent to a remote Siberian
  gulag town finds its residents are vampires. Born in Germany to a Ukrainian family, he appeared in The Deer Hunter
  (1978) and Basic Instinct, and was Sergeant Max Greevey in the first season of Law & Order.

bio: >-
  Paul Richards appeared in "The House," a first-season Night Gallery segment about a woman who dreams of a house
  she later finds for sale, and guest-starred in "One of the Wounded" on Serling's western The Loner. He starred
  as a psychiatrist in the series Breaking Point (1963-1964) and was a busy guest actor on 1950s and 1960s television.

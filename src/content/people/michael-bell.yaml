bio: >-
  Michael Bell appeared in "Green Fingers" (1972), the Night Gallery segment in which an old woman (Elsa Lanchester)
  refuses to sell her land to a ruthless developer. The credit likely belongs to the actor Michael Bell, a live-action
  performer of the period who became one of animation's busiest voice actors (Duke in G.I. Joe, Handy Smurf), but
  this identification is not confirmed.

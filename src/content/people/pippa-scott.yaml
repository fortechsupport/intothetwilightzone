born: '1934-11-10'
bio: >-
  Pippa Scott played Laura Templeton, the late wife whose ghostly 1927 party shocks an aging actor (Brian Aherne),
  in "The Trouble with Templeton" (1960). She played Lucy Edwards in John Ford's The Searchers and co-starred in
  the series Mr. Lucky, and later produced documentaries.

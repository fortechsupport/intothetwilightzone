bio: >-
  Robert Bloch wrote the teleplay for "Logoda's Heads" (1971), Night Gallery's adaptation of August Derleth's story
  about shrunken heads in colonial Africa; Bloch had been Derleth's fellow member of H. P. Lovecraft's circle of
  correspondents. He wrote the novel Psycho (1959), filmed by Alfred Hitchcock, and many scripts for Thriller, Alfred
  Hitchcock Presents and Star Trek, including "What Are Little Girls Made Of?" He won a Hugo Award for "That Hell-Bound
  Train."

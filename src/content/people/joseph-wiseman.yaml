name: Joseph Wiseman
born: '1918-05-15'
died: '2009-10-19'
roles:
- actor
bio: >-
  Joseph Wiseman played Paul Radin, the bitter man who builds a bomb shelter beneath a bank to take revenge on three
  people from his past, in "One More Pallbearer" (1962), and later appeared in the Night Gallery segment "Room with
  a View" (1970). He was the first James Bond villain, playing the title role in Dr. No, and was a distinguished
  stage actor.

bio: >-
  Franklin J. Schaffner directed Planet of the Apes (1968), whose screenplay Rod Serling co-wrote with Michael Wilson;
  the film's famous Statue of Liberty ending is often traced to Serling. Schaffner came out of live television,
  winning Emmys for Studio One's Twelve Angry Men, and later won the Academy Award for directing Patton.

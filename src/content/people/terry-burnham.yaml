bio: >-
  Terry Burnham was the child actress who played Markie, the solemn little girl who turns out to be Helen Foley's
  own childhood self, opposite Janice Rule in "Nightmare as a Child" (1960). The year before, she had played the
  young Sarah Jane in Douglas Sirk's Imitation of Life (1959). She worked as a child performer in films and television
  guest roles around the turn of the 1960s.

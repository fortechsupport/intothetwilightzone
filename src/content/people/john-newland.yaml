bio: >-
  John Newland directed the Night Gallery segment "There Aren't Any More MacBanes" and three episodes of The Sixth
  Sense, the supernatural series later folded into Night Gallery's syndication package. He is best known as the
  on-screen host and director of One Step Beyond (1959-1961), the ABC anthology of "true" paranormal stories that
  premiered months before The Twilight Zone and was often compared with it. He also directed the cult TV film Don't
  Be Afraid of the Dark (1973) and episodes of Thriller and Star Trek.

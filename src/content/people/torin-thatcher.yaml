born: '1905-01-15'
died: '1981-03-04'
bio: >-
  Torin Thatcher appeared in "Lone Survivor" (1971), the Night Gallery segment in which an ocean liner picks up
  a lifeboat survivor of the Titanic, years after the sinking. The Indian-born British actor is best remembered
  as the sorcerer Sokurah in The 7th Voyage of Sinbad (1958), and also appeared in Great Expectations (1946) and
  The Robe.

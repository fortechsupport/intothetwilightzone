bio: >-
  Philip Coolidge played Throckmorton, the curiosity-shop owner who sells Barry Morse's cruel critic a player piano
  that reveals people's true natures, in "A Piano in the House" (1962). His long, thin face made him a familiar
  character actor in the 1950s and 1960s. He played the theatre owner Ollie Higgins in William Castle's The Tingler
  (1959) and a doctor in Hitchcock's North by Northwest (1959).

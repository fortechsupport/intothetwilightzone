bio: >-
  John T. Kretchmer directed five episodes of the UPN revival of The Twilight Zone (2002-03), among them "Time Lapse,"
  "Sensuous Cindy," "Fair Warning," "The Collection" and "Burned," making him one of the series' most- used directors.
  He has worked extensively as a television director on genre series of the 1990s and 2000s.

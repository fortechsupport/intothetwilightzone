bio: >-
  Jerome Cowan played Jerry Hearndan, the old leading man whom Ida Lupino's faded star Barbara Jean Trenton invites
  over in "The Sixteen-Millimeter Shrine," only to find a balding businessman instead of her screen partner. A Broadway
  actor who moved to Hollywood in the 1930s, he spent four decades as a busy supporting player. He is best remembered
  as Sam Spade's doomed partner Miles Archer in The Maltese Falcon (1941) and as the prosecutor Thomas Mara in Miracle
  on 34th Street (1947).

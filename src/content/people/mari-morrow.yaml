name: Mari Morrow
roles:
- actor
bio: >-
  Mari Morrow appeared in "Shades of Guilt," an episode of the 2002 UPN Twilight Zone about a white man who wakes
  up Black and discovers the racism he once dismissed. Her film work includes Def Jam's How to Be a Player, Dead
  Man on Campus and Children of the Corn III, and she has made many television guest appearances.

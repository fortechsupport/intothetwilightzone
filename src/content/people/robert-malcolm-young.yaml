name: Robert Malcolm Young
roles:
- writer
bio: >-
  Robert Malcolm Young wrote three late Night Gallery segments: "The Girl with the Hungry Eyes" (1972), adapted
  from Fritz Leiber's vampire-model story, "Fright Night" (1972) and "The Ring with the Red Velvet Ropes" (1973).
  He wrote widely for 1960s and 70s television and scripted Disney's Escape to Witch Mountain (1975).

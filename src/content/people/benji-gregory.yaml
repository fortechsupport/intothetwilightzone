bio: >-
  Benji Gregory appeared as a child in "Night of the Meek" (1985), the revival's remake of Rod Serling's Christmas
  episode with Richard Mulligan as the department-store Santa. He became famous as Brian Tanner, the youngest child
  of the family that adopts the alien on ALF (1986-90), and later served in the U.S. Navy.

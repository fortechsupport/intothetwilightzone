born: '1934-02-04'
died: '2005-06-28'
bio: >-
  Bruce Malmuth directed "The After Hours" (1986), the revival's remake of the 1960 episode about a woman trapped
  in a department store whose mannequins are alive. He directed the Sylvester Stallone thriller Nighthawks (1981)
  and Steven Seagal's Hard to Kill (1990), and appeared on screen as the tournament ring announcer in The Karate
  Kid (1984).

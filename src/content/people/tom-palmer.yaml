name: Tom Palmer
roles:
- actor
bio: >-
  Tom Palmer played Robert, one of the household servants who turn out to be robots, in "The Lateness of the Hour"
  (1960). The same name appears as the writing credit for the 1988 revival segment "Extra Innings"; whether these
  are the same person has not been confirmed, and this record may need to be split.

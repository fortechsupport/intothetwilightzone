name: Virginia Christine
roles:
- actor
born: '1920-03-05'
died: '1996-07-24'
bio: >-
  Virginia Christine played Ethel Bedeker, the long-suffering wife of hypochondriac Walter Bedeker, in the first-season
  episode "Escape Clause" (1959). She appeared in Invasion of the Body Snatchers and Guess Who's Coming to Dinner
  and was famous for two decades as Mrs. Olson in Folgers coffee commercials.

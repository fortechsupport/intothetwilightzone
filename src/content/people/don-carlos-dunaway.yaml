bio: >-
  Don Carlos Dunaway directed "One Life, Furnished in Early Poverty" (1985), the 1985 revival's adaptation of Harlan
  Ellison's story about a man who travels back to meet himself as a boy. He was a screenwriter whose credits include
  the 1983 Stephen King film Cujo, co-written with Lauren Currier.

name: Bob Crane
roles:
- actor
born: '1928-07-13'
died: '1978-06-29'
bio: >-
  Bob Crane, then a popular Los Angeles radio host, appeared in "Static" (1961), the story of an old radio that
  plays broadcasts from the past, and later played Ralph Ashton in Night Gallery's comic ghost story "House – with
  Ghost" (1971). He starred as Colonel Robert Hogan in Hogan's Heroes; his unsolved 1978 murder was dramatized in
  Auto Focus.

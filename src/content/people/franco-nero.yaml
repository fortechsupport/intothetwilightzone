name: Franco Nero
roles:
- actor
born: '1941-11-23'
bio: >-
  Franco Nero starred as Colonel Dante Matucci in The Salamander (1981), the political thriller filmed from Rod
  Serling's screenplay adaptation of Morris West's novel several years after Serling's death. The Italian actor
  became an international star as the title gunman of Sergio Corbucci's Django (1966), played Lancelot in Camelot
  (1967), and has worked in hundreds of European and American films, including a cameo in Django Unchained.

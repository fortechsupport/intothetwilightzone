bio: >-
  Richard Devon played one of the gangsters confronted by a bum who, wearing a murdered mobster's shoes, begins
  to act like him, in "Dead Man's Shoes" (1962). A lean, menacing character actor, he worked steadily in westerns
  and crime dramas of the 1950s and 1960s, including Roger Corman's early films.

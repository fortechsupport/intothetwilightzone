name: Robby the Robot
roles:
- robot
- prop
born: '1956'
bio: >-
  Robby the Robot, the MGM prop built for Forbidden Planet (1956) and designed by Robert Kinoshita, appears twice
  in the original Twilight Zone: as the robot companion left to a man in his uncle's will in "Uncle Simon" (1963),
  and as the machine that replaces the factory owner himself in "The Brain Center at Whipple's" (1964). The costume
  was operated by performers inside it and reused across film and television, including The Invisible Boy and Lost
  in Space, making it one of the most recognizable props in screen science fiction.

born: '1978-06-06'
died: '1988-07-25'
bio: >-
  Judith Barsi played the daughter in "A Little Peace and Quiet" (1985), the revival's opening episode about a mother
  who can stop time. A busy child actress of the mid-1980s, she voiced Ducky in The Land Before Time and Anne-Marie
  in All Dogs Go to Heaven, both released after her death. She was killed by her father in 1988, at age ten.

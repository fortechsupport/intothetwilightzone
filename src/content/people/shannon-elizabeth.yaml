bio: >-
  Shannon Elizabeth gained fame in American Pie and went on to roles in Scary Movie and Jay and Silent
  Bob Strike Back, as well as a notable career as a poker player and wildlife conservationist. In "Dream
  Lover" she played the ideal woman who seems to step out of a graphic novelist's imagination.

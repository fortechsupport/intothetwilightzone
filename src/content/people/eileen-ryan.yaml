bio: >-
  Eileen Ryan played Nora, the wife of Arthur Curtis (Howard Duff) in the life he believes is real, in Richard Matheson's
  "A World of Difference" (1960). A stage and screen actress married to director Leo Penn, she was the mother of
  Sean, Chris and Michael Penn and appeared in films including At Close Range and The Crossing Guard.

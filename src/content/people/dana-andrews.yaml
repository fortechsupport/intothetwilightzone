name: Dana Andrews
roles:
- actor
born: '1909-01-01'
died: '1992-12-17'
bio: >-
  Dana Andrews starred in the fourth-season episode "No Time Like the Past" (1963) as Paul Driscoll, a scientist
  who travels back in time hoping to prevent disasters such as Hiroshima, and later played the anguished father
  in Rod Serling's Night Gallery segment "The Different Ones" (1971). He was a major 1940s star in Laura, The Ox-Bow
  Incident and The Best Years of Our Lives.

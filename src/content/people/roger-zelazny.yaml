born: '1937-05-13'
died: '1995-06-14'
bio: >-
  Roger Zelazny wrote "The Last Defender of Camelot" (1979), adapted by George R. R. Martin for the 1985 revival
  in 1986, with Richard Kiley as Lancelot, still alive in the modern world and facing Merlin's return. One of the
  leading science-fiction and fantasy writers of the New Wave, he won six Hugo Awards and three Nebulas for works
  including Lord of Light and "Home Is the Hangman," and wrote the Chronicles of Amber.

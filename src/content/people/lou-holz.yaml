bio: >-
  "Lou Holz" is the site's credit spelling for the vaudeville comedian Lou Holtz, whose idea Rod Serling credited
  as the basis of "A Short Drink from a Certain Fountain" (1963), in which an aging man takes a youth serum to keep
  his young wife and overshoots back to infancy. Holtz was a dialect comic and monologuist who headlined vaudeville
  and Broadway revues in the 1920s and 1930s and later appeared on radio and television variety shows.

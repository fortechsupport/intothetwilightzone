bio: >-
  Josie Lloyd played Evelyn, a young woman in the post-nuclear community of "The Old Man in the Cave" (1963). The
  daughter of actor-producer Norman Lloyd, she acted in 1960s television, including a recurring role as Lavinia
  Lowe on The Andy Griffith Show.

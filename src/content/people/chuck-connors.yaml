bio: >-
  Chuck Connors appeared in "The Ring with the Red Velvet Ropes," a third-season Night Gallery segment about a boxer
  who finds himself in a fight with no exit. A former professional athlete who played for both the Brooklyn Dodgers
  organization and the Boston Celtics, he became a star as Lucas McCain on The Rifleman (1958-1963). He later earned
  an Emmy nomination as the slave owner Tom Moore in Roots.

name: Everett Sloane
born: '1909-10-01'
died: '1965-08-06'
roles:
- actor
bio: >-
  Everett Sloane starred in "The Fever" as Franklin Gibbs, a puritanical man whose Las Vegas slot machine starts
  calling his name, and earlier played the ruthless executive Walter Ramsey in both Serling's 1955 Kraft Television
  Theatre teleplay Patterns and the 1956 film version. A member of Orson Welles's Mercury Theatre, he played Mr.
  Bernstein in Citizen Kane and the crippled lawyer Bannister in The Lady from Shanghai. He was also a busy radio
  and voice actor, voicing the title character of the cartoon Dick Tracy.

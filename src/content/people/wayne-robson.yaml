bio: >-
  Wayne Robson appeared in "Crazy as a Soup Sandwich" (1989), Harlan Ellison's late episode for the 1985 revival,
  about a small-time crook who makes a deal with a demon. The Canadian character actor played the escape artist
  Rennes in Cube and Mike Hamar on The Red Green Show.

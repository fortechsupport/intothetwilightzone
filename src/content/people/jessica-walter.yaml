died: '2021-03-24'
bio: >-
  Jessica Walter guest-starred in "The Heart That Wouldn't Stay Buried," an episode of The Sixth Sense (1972), the
  Universal psychic-investigator series whose episodes were later recut into the syndicated Night Gallery package
  with Rod Serling introductions. She was the obsessive fan in Clint Eastwood's Play Misty for Me (1971), won an
  Emmy for Amy Prentiss, and became beloved late in her career as Lucille Bluth on Arrested Development and Malory
  Archer on Archer.

bio: >-
  Carmen Mathews played Vinnie Broun, the woman Dean Jagger's Ed Lindsay failed to marry twenty years earlier, in
  "Static" (1961), a videotaped episode in which an old radio carries him back to the past. She was primarily a
  stage actress with a long Broadway career, and she made frequent television appearances from the 1950s on, including
  many episodes of Alfred Hitchcock Presents.

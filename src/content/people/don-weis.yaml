born: '1922-05-13'
died: '2000-07-26'
bio: >-
  Don Weis directed "Steel" (1963), Richard Matheson's story of a former boxer who fights a robot boxer himself
  when his machine breaks down. He directed MGM musicals and comedies such as I Love Melvin in the 1950s and then
  became a busy television director, with episodes of shows including M*A*S*H and Happy Days.

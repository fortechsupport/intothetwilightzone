bio: >-
  Robert Crais wrote "Monsters!," a 1986 segment of the first revival in which a boy who loves horror movies discovers
  his elderly new neighbor is a vampire. Before turning to novels he wrote for Hill Street Blues, Cagney & Lacey
  and Miami Vice. He is best known for his bestselling Elvis Cole and Joe Pike crime novels, beginning with The
  Monkey's Raincoat (1987).

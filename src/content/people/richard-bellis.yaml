name: Richard Bellis
bio: >-
  American composer and Emmy winner for Stephen King's It (1990). He has written a lot of Disney park music, including
  Star Tours and Indiana Jones Adventure. For The Twilight Zone Tower of Terror he scored the pre-show 'episode',
  re-recording the series' instrumentation and writing the new material.

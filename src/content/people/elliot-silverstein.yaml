bio: >-
  Elliot Silverstein directed four original-series episodes, including The Obsolete Man, with Burgess
  Meredith as a librarian condemned by a totalitarian state, the Civil War ghost story The Passersby and
  The Trade-Ins. His feature debut, the comic western Cat Ballou (1965), won Lee Marvin an Oscar, and
  he went on to direct A Man Called Horse (1970).

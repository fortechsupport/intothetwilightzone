bio: >-
  Nathan Van Cleave, a longtime Paramount orchestrator and composer, wrote some of The Twilight Zone's
  most distinctive episode scores, and his music was used in around thirty episodes, among them A Kind
  of a Stopwatch, I Sing the Body Electric and The Incredible World of Horace Ford. His film work included
  the science fiction adventure Robinson Crusoe on Mars (1964).

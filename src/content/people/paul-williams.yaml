bio: >-
  Paul Williams played Swan, the diabolical record producer, and wrote the songs for Brian De Palma's Phantom of
  the Paradise (1974), which opens with an uncredited narration by Rod Serling, one of his last film voice jobs.
  Williams won an Academy Award for "Evergreen" from A Star Is Born and wrote "Rainbow Connection" for The Muppet
  Movie as well as Carpenters hits such as "We've Only Just Begun." He later became president of the performing-rights
  organization ASCAP.

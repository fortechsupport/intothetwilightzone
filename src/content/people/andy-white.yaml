bio: >-
  Andy White wrote two episodes of Rod Serling's western series The Loner (1965-66), "The Flight of the Arctic Tern"
  and "Incident in the Middle of Nowhere," among the few Loner scripts not written by Serling himself. He was a
  working television writer of the 1950s and 1960s, mainly on westerns and family drama.

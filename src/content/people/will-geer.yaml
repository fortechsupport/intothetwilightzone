name: Will Geer
roles:
- actor
born: '1902-03-09'
died: '1978-04-22'
bio: >-
  Will Geer appeared in "Die Now, Pay Later," one of the short Night Gallery sketches first seen when the series
  went into syndication, as a small-town undertaker running a sale on funerals. He is best known as Grandpa Zebulon
  Walton on The Waltons, the series that grew out of Twilight Zone writer Earl Hamner Jr.'s The Homecoming, a role
  that won him an Emmy in 1975. Blacklisted in the 1950s, he founded the Will Geer Theatricum Botanicum in Topanga
  Canyon.

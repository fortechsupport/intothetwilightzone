bio: >-
  Anne Francis rose to fame as Altaira in Forbidden Planet and later won a Golden Globe as TV's private
  eye Honey West. In The Twilight Zone she played a department-store shopper who learns an uncanny truth
  in "The After Hours" and the lovesick mountain girl turned witch in the hour-long "Jess-Belle".

bio: >-
  Marc Singer starred in "Extra Innings" (1988), a third-season revival episode about a former ballplayer who uses
  old baseball cards to travel back to the game. He played the resistance hero Mike Donovan in V and its sequels
  and starred in The Beastmaster (1982).

name: Mimi Craven
roles:
- actor
bio: >-
  Mimi Craven appeared in "Wordplay" (1985), the first segment of the 1985 revival, directed by her then-husband
  Wes Craven, about a salesman (Robert Klein) whose everyday words suddenly change meaning. She continued to act
  in film and television into the 2000s.

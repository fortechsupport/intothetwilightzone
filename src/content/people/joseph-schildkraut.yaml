bio: >-
  Joseph Schildkraut gave two of the original series' most affecting performances: the murdered camp inmate Alfred
  Becker, who returns to confront his Nazi tormentor in "Deaths-Head Revisited," and the aging John Holt, who seeks
  a new body in "The Trade-Ins." Born in Vienna, the son of stage star Rudolph Schildkraut, he became a Broadway
  and Hollywood leading man. He won the Academy Award for best supporting actor as Alfred Dreyfus in The Life of
  Emile Zola (1937) and played Otto Frank on stage and screen in The Diary of Anne Frank. His Twilight Zone episodes
  were among his last work; he died in 1964.

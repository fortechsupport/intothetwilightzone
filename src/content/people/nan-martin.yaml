bio: >-
  Nan Martin played Laura Ford, the wife of Pat Hingle's nostalgic toy designer, in "The Incredible World of Horace
  Ford," and returned 23 years later for Theodore Sturgeon's "A Saucer of Loneliness" in the 1985 revival. She played
  Ali MacGraw's mother in Goodbye, Columbus and was a familiar television guest star for half a century.

name: Dean Parisot
roles:
- director
born: '1952-07-06'
bio: >-
  Dean Parisot directed Galaxy Quest (1999), the comedy in which aliens take a washed-up TV crew for real heroes,
  a setup that writers on Twilight Zone parallels compare to the episode where visitors believe a braggart's tall
  tales. The film won the Hugo Award for Best Dramatic Presentation. Parisot also directed the Oscar-nominated short
  The Appointments of Dennis Jennings and Bill & Ted Face the Music (2020).

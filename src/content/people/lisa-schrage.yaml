bio: >-
  Lisa Schrage appeared in "The Trunk," an episode from the Toronto-produced final season of the first Twilight
  Zone revival. The Canadian actress is best known to horror audiences as Mary Lou Maloney, the vengeful prom queen
  of Hello Mary Lou: Prom Night II (1987).

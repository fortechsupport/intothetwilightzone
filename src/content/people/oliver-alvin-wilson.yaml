name: Oliver Alvin-Wilson
roles:
- actor
bio: >-
  Oliver Alvin-Wilson was a member of the ensemble cast of Anne Washburn's The Twilight Zone, the stage adaptation
  of original-series stories by Rod Serling, Charles Beaumont and Richard Matheson that premiered at London's Almeida
  Theatre in December 2017 under director Richard Jones, with each actor playing several roles across the interwoven
  tales. Alvin-Wilson is an English stage and television actor.

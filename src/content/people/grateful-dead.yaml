bio: >-
  Formed in 1965 in the San Francisco Bay Area, the rock band the Grateful Dead composed and performed
  a new main title for the 1985 revival together with keyboardist Merl Saunders, weaving fragments of
  Marius Constant's familiar four-note motif into a contemporary arrangement. The band also contributed
  incidental music to a number of episodes.

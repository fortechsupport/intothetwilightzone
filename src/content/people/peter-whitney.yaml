bio: >-
  Peter Whitney appeared in "Deliveries in the Rear," a second-season Night Gallery segment about a Victorian surgeon
  whose cadaver suppliers stop asking where the bodies come from. A large character actor of Warner Bros. films
  in the 1940s, he played Buck Sinclair on the western series The Rough Riders and was a familiar western heavy
  on television.

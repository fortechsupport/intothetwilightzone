bio: >-
  Cloris Leachman won an Academy Award for The Last Picture Show and a record eight Primetime Emmys, many
  for playing Phyllis Lindstrom. She played the terrified mother of omnipotent child Anthony Fremont in
  "It's a Good Life" and reprised the role four decades later opposite Bill Mumy in the 2003 sequel "It's
  Still a Good Life".

name: Barret Oliver
roles:
- actor
born: '1973-08-24'
bio: >-
  Barret Oliver played George, the boy left alone with his monstrous bedridden grandmother, in "Gramma" (1986),
  Harlan Ellison's adaptation of a Stephen King story for the 1980s Twilight Zone. He was one of the busiest child
  actors of the decade, starring as Bastian in The NeverEnding Story (1984) and in D.A.R.Y.L. (1985), and appearing
  in Cocoon and Tim Burton's short Frankenweenie. He later left acting and became a photographer known for historical
  processes such as Woodburytype printing.

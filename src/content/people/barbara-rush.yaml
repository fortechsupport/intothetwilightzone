name: Barbara Rush
roles:
- actor
born: '1927-01-04'
died: '2024-03-31'
bio: >-
  Barbara Rush played Agatha Howard, the woman drawn into the life of a reclusive scientist kept alive by cold,
  in Night Gallery's adaptation of H. P. Lovecraft's "Cool Air" (1971). She won a Golden Globe for It Came from
  Outer Space (1953) and starred in Magnificent Obsession and Peyton Place on television.

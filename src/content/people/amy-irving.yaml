bio: >-
  Amy Irving made her name in Carrie and earned an Oscar nomination for Yentl, alongside a long stage
  career. She starred in "The Theatre," the first half of the 1994 Lost Classics special, as Melissa Sanders,
  a woman who sees her own life play out on a cinema screen.

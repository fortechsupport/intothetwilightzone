born: '1919-11-03'
died: '1994-08-02'
bio: >-
  Bert Freed appeared in "Hunt the Man Down," an episode of Rod Serling's western The Loner (1965-66). A stocky
  character actor, he appeared in Paths of Glory and Detective Story, starred as Rufe Ryker in the 1966 television
  series Shane, and made many guest appearances on 1960s television.

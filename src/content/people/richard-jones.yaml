name: Richard Jones
roles:
- director
bio: >-
  Richard Jones directed Anne Washburn's stage adaptation of The Twilight Zone, which interweaves several original-series
  stories and premiered at London's Almeida Theatre in December 2017 before moving to the West End in 2019. He is
  a leading British theatre and opera director known for bold, stylized productions, and has won Olivier Awards
  for his opera stagings.

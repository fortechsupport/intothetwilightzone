name: Jack Grinnage
roles:
- actor
bio: >-
  Jack Grinnage appeared in "The Mind and the Matter" (1961), the comic episode in which Shelley Berman's misanthropic
  clerk uses a book on mind power to wish everyone else out of existence. He played Moose in Rebel Without a Cause
  and the reporter Ron Updyke on Kolchak: The Night Stalker.

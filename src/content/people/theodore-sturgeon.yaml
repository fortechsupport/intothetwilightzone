bio: >-
  Theodore Sturgeon wrote "A Saucer of Loneliness," adapted in 1986 for the 1985 revival as the story of a shy woman
  who receives a message from a small flying saucer; the series also adapted his "Yesterday Was Monday" as "A Matter
  of Minutes." One of the great writers of science fiction's golden age, he wrote More Than Human, scripted "Amok
  Time" and "Shore Leave" for Star Trek, and coined Sturgeon's Law.

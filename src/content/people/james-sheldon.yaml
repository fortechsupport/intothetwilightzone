bio: >-
  Television director James Sheldon directed six episodes of the original series, among them It's a Good
  Life, with Billy Mumy as the all-powerful Anthony, as well as Long Distance Call, Still Valley and I
  Sing the Body Electric. One of the busiest directors in American television, he directed hundreds of
  episodes of network series from the 1950s into the 1980s, including M*A*S*H.

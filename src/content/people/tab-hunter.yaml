born: '1931-07-11'
died: '2018-07-08'
bio: >-
  Tab Hunter starred in "Forbidden Area" (1956), the premiere of CBS's Playhouse 90, which Rod Serling adapted from
  Pat Frank's novel about a Soviet saboteur at an American air base. A Warner Bros. heartthrob of the 1950s in Battle
  Cry and Damn Yankees, he also had a number-one hit with "Young Love" (1957), and late in life wrote a memoir about
  being a closeted gay star.

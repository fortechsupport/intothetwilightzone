bio: >-
  Michael Moriarty starred in "20/20 Vision" (1988), a 1985-revival episode about a man whose new eyeglasses let
  him see the near future. He won Emmys for The Glass Menagerie and Holocaust, a Tony for Find Your Way Home, and
  played prosecutor Ben Stone in the first four seasons of Law & Order.

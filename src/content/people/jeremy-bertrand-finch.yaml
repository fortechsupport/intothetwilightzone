bio: >-
  Jeremy Bertrand Finch was the most prolific writer of the third, syndicated season (1988-89) of the 1980s Twilight
  Zone revival, credited on six episodes: "The Hunters," "The Trunk," "Stranger in Possum Meadows," "Room 2426,"
  "Father and Son Game" and the earlier "Aqua Vita" (1986). That season was made in Toronto on a small budget for
  syndication after CBS dropped the show. Little else about his career is documented in published sources.

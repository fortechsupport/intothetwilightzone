bio: >-
  Tommy Lee Wallace, a longtime collaborator of John Carpenter and director of Halloween III: Season of
  the Witch, directed three segments of the 1985 revival, Dreams for Sale, Little Boy Lost and The Leprechaun-Artist,
  the last of which he also co-wrote. He later directed the 1990 miniseries of Stephen King's It.

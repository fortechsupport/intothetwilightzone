name: Lloyd Gough
roles:
- actor
born: '1907-09-21'
died: '1984-07-23'
bio: >-
  Lloyd Gough appeared in "Widow on the Evening Stage," an episode of Rod Serling's western The Loner (1965-66).
  Blacklisted in the early 1950s after refusing to testify to the House Un-American Activities Committee, he returned
  to screen work in the 1960s, notably as the newspaper reporter Mike Axford on The Green Hornet. He had earlier
  played Morino in Sunset Boulevard.

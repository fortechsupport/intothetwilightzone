bio: >-
  Ken Sagoes appeared in "But Can She Type?," a 1986 segment of the first revival in which an overworked secretary
  escapes to a world where secretaries are celebrities. He is best known as Kincaid, one of the Dream Warriors,
  in A Nightmare on Elm Street 3 and its sequel The Dream Master. He was a regular on the sitcom What's Happening
  Now!!

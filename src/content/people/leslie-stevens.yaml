bio: >-
  Leslie Stevens created The Outer Limits (ABC, 1963–65), the science-fiction anthology that became The Twilight
  Zone's best-known rival and companion. He wrote and directed its pilot, "The Galaxy Being." A playwright and screenwriter,
  he also directed the Esperanto-language horror film Incubus (1966), starring William Shatner, and later worked
  on Buck Rogers in the 25th Century.

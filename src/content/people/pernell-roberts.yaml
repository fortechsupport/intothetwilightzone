born: '1928-05-18'
died: '2010-01-24'
bio: >-
  Pernell Roberts starred in "The Tune in Dan's Café" (1972), a Night Gallery segment about a couple whose roadside
  stop includes a jukebox that keeps playing the song associated with a past crime. He played Adam Cartwright on
  Bonanza before leaving the series in 1965 and later starred as Trapper John McIntyre in Trapper John, M.D.

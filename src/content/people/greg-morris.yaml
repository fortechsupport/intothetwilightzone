bio: >-
  Greg Morris played Lieutenant Woodard, the officer who finds his tank crew's helmets at Little Bighorn, in "The
  7th Is Made Up of Phantoms" (1963). He became one of the first Black stars of a hit drama as electronics expert
  Barney Collier on Mission: Impossible, and later appeared on Vega$.

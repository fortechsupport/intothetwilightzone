name: Van Johnson
born: '1916-08-25'
died: '2008-12-12'
roles:
- actor
bio: >-
  Van Johnson played a passenger aboard the threatened airliner in The Doomsday Flight (1966), Rod Serling's NBC
  TV movie about an altitude-triggered bomb, which was blamed for real copycat extortion threats. An MGM star of
  the 1940s, he appeared in Thirty Seconds over Tokyo, Battleground and The Caine Mutiny.

name: Brock Peters
roles:
- actor
born: '1927-07-02'
died: '2005-08-23'
bio: >-
  Brock Peters had the title role in "The Homecoming of Lemuel Stove" (1965), the episode of Rod Serling's western
  The Loner in which a Black Union veteran returns to a hostile town, and appeared in the Night Gallery segment
  "Logoda's Heads" (1971). He is remembered above all as Tom Robinson, the falsely accused man in To Kill a Mockingbird
  (1962), and later played Admiral Cartwright in two Star Trek films and Joseph Sisko on Star Trek: Deep Space Nine.

bio: >-
  Sue Randall played Millie, the secretary whom Wally Cox's timid computer expert James Elwood adores, in "From
  Agnes - With Love" (1964). She is best remembered as Miss Landers, Beaver Cleaver's kindly schoolteacher on Leave
  It to Beaver. She was also a frequent guest actress in westerns and dramas through the 1960s.

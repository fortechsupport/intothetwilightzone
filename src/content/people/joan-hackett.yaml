name: Joan Hackett
roles:
- actor
born: '1934-03-01'
died: '1983-10-08'
bio: >-
  Joan Hackett played Esther, the much-mocked young wife of the cruel critic Fitzgerald Fortune (Barry Morse), in
  "A Piano in the House" (1962), in which a player piano draws out people's hidden selves. She starred in Sidney
  Lumet's The Group (1966) and Support Your Local Sheriff!, and received an Academy Award nomination and a Golden
  Globe for Only When I Laugh (1981).

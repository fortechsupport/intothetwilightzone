name: Harvey Jason
born: '1940'
roles:
- actor
bio: >-
  Harvey Jason appeared in "The Funeral," a second-season Night Gallery comedy segment in which a vampire arranges
  a funeral attended by monsters. The English-born actor played many supporting roles in American film and television,
  including The Lost World: Jurassic Park. With his wife, actress Pamela Franklin, he ran the Mystery Bookstore
  in Los Angeles.

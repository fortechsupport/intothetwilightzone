bio: >-
  Russell Johnson was a WWII bomber navigator turned actor, forever remembered as the resourceful Professor
  on Gilligan's Island and a staple of 1950s sci-fi such as It Came from Outer Space. Fittingly, both
  of his Twilight Zone roles involve time travel: a man who tries to stop Lincoln's assassination in "Back
  There" and the scientist with a time machine in "Execution".

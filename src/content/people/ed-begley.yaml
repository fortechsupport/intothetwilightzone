name: Ed Begley
roles:
- actor
born: '1901-03-25'
died: '1970-04-28'
bio: >-
  Ed Begley played William Briggs, the aging executive hounded by his ruthless boss, in Rod Serling's breakthrough
  "Patterns," both the live Kraft Television Theatre broadcast of January 1955 and the 1956 film version. A veteran
  of radio and Broadway, he won the Academy Award for best supporting actor for Sweet Bird of Youth (1962) and also
  appeared in 12 Angry Men. He was the father of actor Ed Begley Jr.

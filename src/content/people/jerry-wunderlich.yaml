bio: >-
  Jerry Wunderlich is credited as a set decorator on the original Twilight Zone across seasons two to five, one
  of the MGM decorators who dressed its sets. He later worked on major features of the 1970s, and he shared an Academy
  Award nomination for the art direction of The Exorcist (1973).

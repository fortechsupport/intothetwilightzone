bio: >-
  Ron Cobb co-wrote, with his wife Robin Love, "Shelter Skelter" (1987), the 1985 revival segment about a survivalist
  who rides out an apparent nuclear war in his backyard bomb shelter, an idea that echoes the original series' "The
  Shelter." An influential political cartoonist and film designer, he worked on Dark Star, the Star Wars cantina
  creatures, Alien, Conan the Barbarian, The Abyss and the Back to the Future time machine.

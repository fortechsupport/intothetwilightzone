bio: >-
  David Dukes appeared in "Ye Gods," a comic segment of the first Twilight Zone revival in which Cupid and other
  Greek gods meddle in a modern romance. A Tony-nominated stage actor for Bent, he played Leslie Slote in The Winds
  of War and War and Remembrance and starred in M. Butterfly on Broadway. He was a regular on Sisters and died suddenly
  while filming the Stephen King miniseries Rose Red.

name: Sturla Gunnarsson
born: '1951'
roles:
- director
bio: >-
  Sturla Gunnarsson directed "Stranger in Possum Meadows," an episode of the 1985 revival's Toronto-produced final
  season. Born in Iceland and raised in Canada, he is an award-winning documentary and drama director whose films
  include the Oscar-nominated documentary After the Axe and the Norse epic Beowulf & Grendel (2005).

born: '1934-06-01'
bio: >-
  Pat Boone starred as the pop singer Andy Paxton, whose baby is kidnapped, in The Yellow Canary (1963), a thriller
  with a screenplay by Rod Serling, and later appeared in the Night Gallery segment "The Academy" (1971), about
  a military school no student ever leaves. One of the best-selling pop singers of the 1950s, he starred in April
  Love and Journey to the Center of the Earth (1959).

name: R.G. Armstrong
roles:
- actor
born: '1917-04-07'
died: '2012-07-27'
bio: >-
  R. G. Armstrong played the building contractor who comes to demolish the tenement of an old woman (Gladys Cooper)
  hiding from Death, in George Clayton Johnson's "Nothing in the Dark" (1962), the episode co-starring a young Robert
  Redford. A burly southern character actor and Sam Peckinpah regular in Ride the High Country and Pat Garrett and
  Billy the Kid, he also played General Phillips in Predator.

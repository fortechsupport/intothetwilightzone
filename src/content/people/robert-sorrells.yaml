name: Robert Sorrells
roles:
- actor
born: '1930-06-26'
bio: >-
  Robert Sorrells played Casey, the robot pitcher built to look human who joins a hapless minor-league team, in
  "The Mighty Casey" (1960); the episode was reshot after the original lead, Paul Douglas, died before it aired.
  A busy television character actor of the 1950s through the 1980s, he was convicted in 2004 of the murder of a
  man in a Simi Valley bar.

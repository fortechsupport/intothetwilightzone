bio: >-
  Maxine Stuart was a stage, radio and television actress with a career spanning seven decades, later
  known for roles on The Wonder Years and Days of Our Lives. She gave voice and body to the bandaged Janet
  Tyler in "Eye of the Beholder", performing the role entirely with her face hidden before Donna Douglas
  appears in the unmasking.

name: Simon Oakland
roles:
- actor
born: '1915-08-28'
died: '1983-08-29'
bio: >-
  Simon Oakland played DeCruz, one of the gold thieves who sleep a century in "The Rip Van Winkle Caper" (1961),
  and Captain Beecham, commander of a destroyer that hears tapping from a sunken submarine, in "The Thirty-Fathom
  Grave" (1963). He is remembered as the psychiatrist who explains Norman Bates in Psycho and as editor Tony Vincenzo
  on Kolchak: The Night Stalker.

bio: >-
  Screenwriter Melissa Mathison, who had just written E.T. the Extra-Terrestrial for Steven Spielberg,
  rewrote the script for his Kick the Can segment of Twilight Zone: The Movie and took screen credit under
  the pseudonym Josh Rogan, alongside George Clayton Johnson and Richard Matheson. Her other screenplays
  included The Black Stallion, The Indian in the Cupboard, Kundun and The BFG.

born: '1977-09-11'
bio: >-
  Todd Williams is an American actor from Queens, New York, who played Marcus Fisher, the street artist haunted
  by his own mural, in the 2002 revival episode "Tagged". He is best known as Officer Isaac Joiner on The
  Chicago Code, and also appeared on The Vampire Diaries and Teen Wolf.

bio: >-
  A child actor of the 1980s, Jason Bateman returned to prominence as Michael Bluth on Arrested Development
  and later starred in, directed and produced the Netflix drama Ozark, winning an Emmy for directing.
  He starred as a ruthless real estate developer in "Burned," which closed out the 2002 series' run.

name: Alvin Sapinsley
roles:
- writer
bio: >-
  Alvin Sapinsley was one of Night Gallery's most frequent adapters in its second season (1971-72), writing "The
  Hand of Borgus Weems," "Since Aunt Ada Came to Stay," "Pickman's Model" from H. P. Lovecraft, "The Ghost of Sorworth
  Place," "Last Rites for a Dead Druid" and "There Aren't Any More MacBanes." A veteran of live television drama
  in the 1950s, he continued writing television films and series episodes into the 1980s.

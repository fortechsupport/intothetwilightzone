bio: >-
  Vic Morrow made his name as a juvenile delinquent in Blackboard Jungle and starred for five seasons
  as Sgt. Chip Saunders on the WWII series Combat!. He headlined John Landis's 'Time Out' segment of Twilight
  Zone: The Movie as a bigot forced to experience persecution, and was killed along with two child actors
  in a helicopter accident during filming, a tragedy that reshaped Hollywood safety rules.

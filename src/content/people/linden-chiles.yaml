name: Linden Chiles
roles:
- actor
born: '1933-03-22'
died: '2013-05-15'
bio: >-
  Linden Chiles was a character actor from St. Louis who worked steadily in American television from 1960
  until 2013. He appeared in the original series episode "Four O'Clock" and had recurring roles on East
  Side/West Side, Convoy, Banacek and James at 15. His films include Texas Across the River, Forbidden World
  and Fly Away Home.

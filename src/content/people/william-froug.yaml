bio: >-
  William Froug took over as producer of The Twilight Zone partway through its fifth and final season,
  after Bert Granet left with thirteen episodes completed. He shelved several scripts already in development
  and brought in new writers, a period fans still debate. Decades later he wrote Many, Many Monkeys for
  the 1985 revival. A prolific writer-producer whose credits included Gilligan's Island and Bewitched,
  he later taught screenwriting at UCLA and wrote several books on the craft.

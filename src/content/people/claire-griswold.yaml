bio: >-
  Claire Griswold played Alice, the doll in a museum dollhouse who comes to life for Robert Duvall's lonely Charley
  Parkes, in "Miniature" (1963). She acted on television in the late 1950s and early 1960s before leaving the profession.
  She was married to the director Sydney Pollack from 1958 until his death in 2008.

name: Vaughn Taylor
roles:
- actor
born: '1910-10-08'
died: '1983-05-26'
bio: >-
  Vaughn Taylor was one of the original series' busiest character actors, appearing in five episodes: the bank president
  who scolds Burgess Meredith in "Time Enough at Last," the old Confederate who owns the book of spells in "Still
  Valley," Horace Ford's employer in "The Incredible World of Horace Ford," the invalid father in "The Self-Improvement
  of Salvadore Ross," and a role in "I Sing the Body Electric." A familiar face in 1950s and 1960s television, he
  is also remembered as Marion Crane's employer Mr. Lowery in Psycho (1960).

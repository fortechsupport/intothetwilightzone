bio: >-
  Don Siegel, director of Invasion of the Body Snatchers (1956), directed two fifth-season Twilight Zone
  episodes, Uncle Simon and The Self-Improvement of Salvadore Ross. He later formed a long partnership
  with Clint Eastwood, directing Coogan's Bluff, The Beguiled, Dirty Harry and Escape from Alcatraz.

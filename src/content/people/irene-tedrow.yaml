bio: >-
  Irene Tedrow played Mrs. Loren, the wife who has grown dependent on her husband's robot servants, in "The Lateness
  of the Hour" (1960), one of the season-two episodes shot on videotape. She came up through radio, where she played
  the mother in Meet Corliss Archer, and became one of television's most familiar character actresses. Her best-known
  recurring role was Mrs. Lucy Elkins on Dennis the Menace.

bio: >-
  William Shatner is the Canadian actor forever linked to Captain James T. Kirk of Star Trek, who later
  won an Emmy as Denny Crane on Boston Legal and in 2021 became the oldest person to fly to space. His
  two Twilight Zone leads bookend his rise: a superstitious newlywed hooked on a fortune-telling machine
  in "Nick of Time" and the panicked airline passenger who sees a gremlin on the wing in "Nightmare at
  20,000 Feet".

name: Ernest Truex
roles:
- actor
born: '1889-09-19'
died: '1973-06-26'
bio: >-
  Ernest Truex starred as Charles Whitley, the rest-home resident who believes a game of kick the can can make the
  old young again, in George Clayton Johnson's "Kick the Can" (1962); the story was remade by Steven Spielberg for
  Twilight Zone: The Movie. Earlier he had played Pedott, the gentle peddler who knows what each customer will need,
  in "What You Need" (1959). A stage veteran who began as a child actor, he also had film roles in His Girl Friday
  and Christmas in July.

name: Joan Allen
roles:
- actor
born: '1956-08-20'
bio: >-
  Joan Allen appeared opposite Joe Mantegna in "Shelter Skelter" (1987), a 1980s-revival segment about a survivalist
  who emerges from his fallout shelter after a nuclear scare. A Steppenwolf Theatre ensemble member who won a Tony
  for Burn This, she earned Academy Award nominations for Nixon, The Crucible and The Contender.

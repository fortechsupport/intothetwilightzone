name: Arlene Martel
roles:
- actor
born: '1936-04-14'
died: '2014-08-12'
bio: >-
  Arlene Martel (credited early as Arline Sax) appeared in "What You Need" (1959) and gave Twilight Zone one of
  its most quoted lines as the smiling morgue nurse and stewardess in "Twenty-Two" (1961): "Room for one more, honey."
  She is best known to Star Trek fans as T'Pring, Spock's bride, in "Amok Time," and worked widely in 1960s television.

bio: >-
  Rosemary DeCamp appeared in "The Painted Mirror," a second-season Night Gallery segment about an antique mirror
  that opens onto a prehistoric world. She played James Cagney's mother in Yankee Doodle Dandy (1942), though she
  was younger than Cagney. On television she was Bob Cummings's sister on The Bob Cummings Show and Marlo Thomas's
  mother on That Girl, and she was a longtime commercial spokeswoman.

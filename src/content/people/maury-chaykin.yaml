born: '1949-07-27'
died: '2010-07-27'
bio: >-
  Maury Chaykin played James Howard "Fats" Brown, the dead pool champion summoned for a match, opposite Esai Morales
  in the 1989 remake of "A Game of Pool," which used George Clayton Johnson's original ending. The Canadian actor
  appeared in Dances with Wolves and The Sweet Hereafter, and starred as Nero Wolfe in the A&E series.

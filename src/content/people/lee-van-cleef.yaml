name: Lee Van Cleef
roles:
- actor
born: '1925-01-09'
died: '1989-12-16'
bio: >-
  Lee Van Cleef played Steinhart, one of the townsmen who bet a bounty hunter (Lee Marvin) that he will not visit
  the grave of the outlaw he failed to catch, in Montgomery Pittman's western ghost story "The Grave" (1961). After
  years as a screen heavy in westerns such as High Noon, he became an international star in Sergio Leone's For a
  Few Dollars More (1965) and as Angel Eyes in The Good, the Bad and the Ugly (1966).

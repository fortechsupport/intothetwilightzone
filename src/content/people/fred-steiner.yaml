bio: >-
  Fred Steiner was one of the composers whose music filled the CBS library that The Twilight Zone drew
  on, and his work was heard, often uncredited, across dozens of episodes such as A Penny for Your Thoughts,
  Five Characters in Search of an Exit and No Time Like the Past. He is best known for writing the theme
  to Perry Mason and for scoring many original Star Trek episodes. Late in his career he shared an Oscar
  nomination for The Color Purple and became a respected film-music historian.

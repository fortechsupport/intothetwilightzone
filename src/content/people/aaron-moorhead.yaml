born: '1987'
bio: >-
  Aaron Moorhead co-directed "8" (2020), a second-season episode of the Jordan Peele revival about Arctic researchers
  and a highly intelligent octopus, with his filmmaking partner Justin Benson. The duo made the independent genre
  films Resolution, Spring, The Endless and Synchronic, then directed episodes of Moon Knight and Loki.

name: Ron Winston
roles:
- director
bio: >-
  Ron Winston directed "Stopover in a Quiet Town" (1964), a fifth-season episode in which a hungover couple wake
  in an eerily silent town that turns out to be a giant child's toy village. He directed live and filmed television
  drama in the late 1950s and 1960s and a handful of features, including the war film Ambush Bay (1966).

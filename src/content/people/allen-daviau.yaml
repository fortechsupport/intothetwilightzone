bio: >-
  Allen Daviau photographed two segments of Twilight Zone: The Movie (1983), Steven Spielberg's Kick the Can and
  George Miller's Nightmare at 20,000 Feet. He was Spielberg's cinematographer on E.T. the Extra- Terrestrial, The
  Color Purple and Empire of the Sun, and received five Academy Award nominations. He died in 2020.

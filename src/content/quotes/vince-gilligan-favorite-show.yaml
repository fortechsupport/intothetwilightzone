person: Vince Gilligan
text: >-
  The point of The Twilight Zone is the humanity of it, the photography, the wonderful acting and directing.
context: >-
  Vince Gilligan (creator of Breaking Bad and Better Call Saul; former X-Files writer). Gilligan told
  MeTV that The Twilight Zone is probably his favorite show and praised Serling's distinctive, if mannered,
  writing voice.

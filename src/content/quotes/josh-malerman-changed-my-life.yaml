person: Josh Malerman
text: Rod Serling and Co. changed my life and how I inherently see things.
context: >-
  Josh Malerman (novelist (Bird Box)). Malerman said Twilight Zone: The Movie was his introduction to
  horror, that the original series is 'the holy grail' for him, and that he sees his novels as episodes
  of a TV show.

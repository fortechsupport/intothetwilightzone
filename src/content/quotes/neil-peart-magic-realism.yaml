person: Neil Peart
text: >-
  Rod Serling may have pioneered what is now called 'magic realism' even before the Latin-American novelists.
date: '2007'
context: >-
  Neil Peart (drummer and lyricist of Rush). In an essay for Stewart Stanyard's book, Peart wrote that
  the show 'introduced the possibility of magic into everyday life', that Rush dedicated Caress of Steel
  (1975) to Serling, and that the band's 1976 song 'The Twilight Zone' on 2112 grew from that fascination.
sources:

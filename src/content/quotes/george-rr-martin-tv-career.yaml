person: George R.R. Martin
text: >-
  None of it would have been possible, if not for the things I learned on Twilight Zone as a Staff Writer
  and Story Editor
date: '2023-05-10'
context: >-
  George R.R. Martin (novelist (A Song of Ice and Fire); staff writer and story editor on The Twilight
  Zone (1985)). On his blog Martin credited CBS's 1985 Twilight Zone revival with launching his television
  career, which later led to Beauty and the Beast and, indirectly, Game of Thrones and House of the Dragon.

person: D.J. MacHale
text: to me the Midnight Society was like Rod Serling.
date: '2020-10-27'
context: >-
  D.J. MacHale (co-creator of Are You Afraid of the Dark?; author of Pendragon). MacHale said the Nickelodeon
  anthology's campfire storytellers were his equivalent of Serling's host role, and that he wanted stories
  that made viewers think and carried a twist.
sources:
- title: How The Twilight Zone Influenced Are You Afraid of the Dark? — Den of Geek
  url: https://www.denofgeek.com/?p=627437
last_verified: '2026-11-19'

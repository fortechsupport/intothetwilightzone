person: J.M. DeMatteis
text: >-
  Go to the movies, turn on your television, and you'll see Rod Serling's fingerprints everywhere.
date: '2017-06-28'
context: >-
  J.M. DeMatteis (comic-book writer (Spider-Man: Kraven's Last Hunt, Justice League International)). In
  a blog essay DeMatteis called The Twilight Zone his favorite television show ever and described himself
  as 'born a citizen of The Twilight Zone'.

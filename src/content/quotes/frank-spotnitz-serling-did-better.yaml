person: Frank Spotnitz
text: That's the type of television Rod Serling did better than anybody else.
date: '2009'
context: >-
  Frank Spotnitz (writer-producer, The X-Files; creator of The Man in the High Castle adaptation). In
  a 2009 interview quoted by Dawidziak, Spotnitz pointed to Serling as the master of the kind of thought-provoking
  genre television The X-Files aspired to.
sources:
- title: >-
    Mark Dawidziak, Everything I Need to Know I Learned in the Twilight Zone (St. Martin's Press, 2017)
  note: Quoted in the book.
last_verified: '2026-11-19'

person: Mick Garris
text: >-
  As a child of the '50s and '60s, I started watching 'The Twilight Zone,' which was released in 1959.
  It blew my mind
date: '2022-12-13'
context: >-
  Mick Garris (director and producer; creator of Masters of Horror). Garris told Fangoria his love of
  anthologies began with The Twilight Zone, and that some of his first interviews as a teenage writer
  were with Rod Serling.

person: Charlie Brooker
text: Rod Serling was the unifying character, in a way
date: '2013-02-01'
context: >-
  Charlie Brooker (creator of Black Mirror). Brooker explained that he considered but rejected a Serling-style
  on-screen host for Black Mirror, deciding that the show itself, as with The Twilight Zone, would be
  the character viewers tuned in for.

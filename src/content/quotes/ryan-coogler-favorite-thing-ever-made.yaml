person: Ryan Coogler
text: >-
  My favorite thing ever made is The Twilight Zone, and my favorite episode is called 'The Last Rites
  of Jeff Myrtlebank.'
date: '2025-04-21'
context: >-
  Ryan Coogler (filmmaker (Black Panther, Sinners)). Coogler cited the 1962 episode about a man who returns

person: Steven Spielberg
text: So I'm not really proud of the show but it was a great experience to be baptized that way.
date: '2023-10-07'
context: >-
  Steven Spielberg (filmmaker; producer of Twilight Zone: The Movie (1983)). Spielberg's first professional
  directing job was the 'Eyes' segment of Serling's 1969 Night Gallery pilot, starring Joan Crawford;
  he later produced Twilight Zone: The Movie and directed its 'Kick the Can' segment.

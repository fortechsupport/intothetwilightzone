person: Rob McElhenney
text: Rod Serling is my guy. Rod Serling is a huge influence on me.
date: '2026-10-10'
context: >-
  Rob McElhenney (co-creator and star of It's Always Sunny in Philadelphia; co-creator of Mythic Quest).
  Speaking to Alan Sepinwall for his 2026 Serling biography, McElhenney named Serling a major influence;
  Sepinwall argues there is Twilight Zone DNA in It's Always Sunny.

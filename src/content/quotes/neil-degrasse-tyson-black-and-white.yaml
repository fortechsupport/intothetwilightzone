person: Neil deGrasse Tyson
text: The Twilight Zone, as filmed, would not have succeeded in color.
date: '2017'
context: >-
  Neil deGrasse Tyson (astrophysicist; director of the Hayden Planetarium). Tyson, quoted by Dawidziak,
  argued that the show's black-and-white photography was essential to its eerie power.
sources:
- title: >-
    Mark Dawidziak, Everything I Need to Know I Learned in the Twilight Zone (St. Martin's Press, 2017)
  note: Quoted in the book.

title: Night Gallery on DVD and Blu-ray
kind: tv-series
parent_series: Night Gallery
summary: 'Universal released the series on Region 1 DVD as The Complete First Season (August 24, 2004, with the
  pilot film), Season Two (November 11, 2008, with commentaries by Jim Benson, Scott Skelton and Guillermo del Toro,
  a retrospective featurette and a gallery of the paintings), Season Three (April 10, 2012) and The Complete Series
  (September 12, 2017). Blu-ray sets followed (from Kino Lorber, whose catalog the Wikipedia article cites): Season
  One (November 23, 2021), Season Two (July 26, 2022) and Season Three (November 22, 2022), together carrying more
  than 60 commentary tracks and featurettes on how syndication cut and padded the episodes. Night Gallery''s music
  has never had a commercial soundtrack release.'

title: The Twilight Zone holiday marathons
kind: special
release_date: '1980'
summary: Syndicated reruns turned the original series into a holiday ritual. WPIX in New York had aired it nightly
  since the early 1970s, and KTLA in Los Angeles ran an eight-hour marathon on Thanksgiving 1980, then a July 4th
  marathon from 1983. The New Year's marathon passed to the Sci-Fi Channel, now Syfy, which ran its 22nd annual
  edition over New Year 2016-17.

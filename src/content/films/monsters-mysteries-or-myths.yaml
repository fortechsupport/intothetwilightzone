title: Monsters! Mysteries or Myths?
kind: documentary
summary: A CBS television special on Bigfoot, the Loch Ness monster and the Abominable Snowman, first shown on November
  25, 1974. It was produced by David L. Wolper in cooperation with the Smithsonian Institution and narrated by Rod Serling;
  Robert Guenette later reused its material in the 1976 film The Mysterious Monsters.

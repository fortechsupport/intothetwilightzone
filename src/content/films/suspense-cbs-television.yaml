title: Suspense
kind: tv-series
summary: CBS Television's live anthology of thrillers, 1949 to 1954, broadcast live from New York to CBS's eastern
  and midwestern stations, with kinescopes made for the West Coast. It aired Rod Serling's "Nightmare at Ground Zero"
  on 18 August 1953. A revival hosted by Sebastian Cabot followed in 1964. The radio series of the same name has its
  own record, Suspense (radio).

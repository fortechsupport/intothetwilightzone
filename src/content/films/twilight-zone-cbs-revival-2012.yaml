title: The Twilight Zone (Bryan Singer revival, CBS Television Studios, 2012)
kind: unproduced
release_date: '2012-12-19'
summary: A fourth television version announced on December 19, 2012, with Bryan Singer signed by CBS Television Studios
  to develop and executive produce it and possibly direct the pilot. When it was announced no writer or network was attached,
  and reports noted that Rod Serling's estate had not yet signed off. No pilot was made. CBS Television Studios returned
  to the property five years later with the Jordan Peele series that premiered in 2019.

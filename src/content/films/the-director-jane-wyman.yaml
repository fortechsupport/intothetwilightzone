title: The Director
kind: tv-episode
parent_series: The Jane Wyman Show
summary: A half-hour drama with Jack Carson, aired on NBC in 1955, the year Jane Wyman took over Fireside Theatre as host.
  The anthology was billed as Jane Wyman Presents The Fireside Theatre and later became The Jane Wyman Show; the Rod
  Serling Memorial Foundation lists the play under Fireside Theater.

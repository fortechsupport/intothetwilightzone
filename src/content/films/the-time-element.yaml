summary: Serling's hour-long teleplay for Westinghouse Desilu Playhouse on CBS, widely treated as the series' unofficial
  pilot. A bartender tells his psychiatrist about a recurring dream in which he wakes up in Honolulu the day before
  the Pearl Harbor attack and cannot get anyone to heed his warnings. CBS had turned the script down as a series
  pitch; producer Bert Granet made it for the Playhouse, and its success helped persuade CBS to buy The Twilight
  Zone. It is included as a bonus on the Season 1 Blu-ray.

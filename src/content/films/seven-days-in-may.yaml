title: Seven Days in May
kind: film
summary: Serling's adaptation of the Fletcher Knebel and Charles W. Bailey II novel about a planned military coup against
  a U.S. president who signs a nuclear disarmament treaty. He wrote it while writer in residence at Antioch College in
  1962 and 1963.

title: In Search of Ancient Astronauts
kind: documentary
summary: A one-hour NBC special, first shown on January 5, 1973, narrated by Rod Serling and produced by Alan Landsburg,
  built on Erich von Däniken's ancient-astronaut claims. It and two follow-up specials led to the series In Search of...,
  which Leonard Nimoy hosted after Serling's death.

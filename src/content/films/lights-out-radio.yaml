title: Lights Out
kind: tv-series
summary: Radio horror anthology created by Wyllis Cooper and later written by Arch Oboler, one of the radio writers
  the young Serling admired. Serling adapted his radio play "The Keeper of the Chair" for Lights Out!, which turned it
  down, after Suspense and Escape had done the same (Martin Grams Jr.).

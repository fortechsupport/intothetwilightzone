title: Night Gallery (1969 pilot film)
kind: pilot
parent_series: Night Gallery
release_date: '1969-11-08'
runtime_min: 95
summary: 'The NBC television movie that launched the series: three stories written by Rod Serling, each introduced
  by Serling in a gallery of paintings. Produced by William Sackheim with music by Billy Goldenberg. The second
  story, Eyes, was Steven Spielberg''s first professional directing job; Joan Crawford reportedly asked for a more
  experienced director before agreeing to keep him. Serling won an Edgar Award from the Mystery Writers of America
  for the script. The stories came from his 1967 book The Season to Be Wary.'

title: 'The Twilight Zone 60th: Remembering Rod Serling'
kind: documentary
summary: A documentary short made for the series' 60th anniversary about Rod Serling's life, from his Syracuse childhood
  and World War II service to his use of science fiction to take on race, paranoia and bigotry. It includes previously unseen
  footage of Serling teaching a writing class at Ithaca College around 1970, and interviews with his daughter Jodi Serling,
  producer Bill D'Elia and his former student Esther Gray Peacock. It screened in more than 600 cinemas before six classic
  episodes ("Walking Distance", "Time Enough at Last", "The Monsters Are Due on Maple Street", "Eye of the Beholder", "The
  Invaders" and "To Serve Man") at a one-night Fathom Events and CBS Home Entertainment event on November 14, 2019.
release_date: '2019-11-14'
runtime_min: 47

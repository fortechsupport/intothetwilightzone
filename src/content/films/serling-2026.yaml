summary: A feature documentary about Rod Serling told almost entirely in his own voice, built from recordings and personal
  dictations that had not been heard publicly before, with black-and-white recreations styled after The Twilight Zone.
  It follows his war trauma, his fights with sponsors and censors, his writing about racism, war and technology, his
  home life at the lake house in Interlaken, New York, and his hope that America would live up to its ideals. Leonardo
  DiCaprio's Appian Way produced it, with Serling's daughters Jodi and Anne Serling as executive producers. It played
  at SXSW in March 2026; no distributor had been announced in the sources checked.

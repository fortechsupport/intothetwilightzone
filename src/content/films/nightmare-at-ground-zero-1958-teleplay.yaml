title: Nightmare at Ground Zero
kind: tv-episode
parent_series: Playhouse 90
summary: Five scientists are trapped for eleven hours in a bunker on Enewetak Atoll, twenty miles from the first hydrogen
  bomb test. Serling's credit is unconfirmed. Only Wikipedia lists it, and the Rod Serling Memorial Foundation's filmography,
  which has his 1953 Suspense play of the same name, does not. Wikipedia's article cites the Paley Center and two May 1958
  newspapers, which we have not read.

title: 'Rod Serling: Beyond the Twilight Zone'
kind: documentary
release_date: '2000-01-25'
parent_series: E! True Hollywood Story
summary: An episode of E!'s celebrity biography series E! True Hollywood Story (season 4, episode 5) devoted to Rod
  Serling's life and career, from his war service and live television through The Twilight Zone, Night Gallery and his
  death in 1975. Listings say it includes interviews with Serling's family and friends and with people who worked with
  him, among them William Shatner and George Takei. Listings differ on the first air date (25 or 26 January 2000).

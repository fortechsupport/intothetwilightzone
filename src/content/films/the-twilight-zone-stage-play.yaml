history:
- date: '2017-12-05'
  title: World premiere, Almeida Theatre, London
  text: Ran 5 December 2017 to 27 January 2018 (press night 12 December), directed by Richard Jones. Set Paul Steinberg,
    costumes Nicky Gillibrand, choreography Aletta Collins, lighting Mimi Jordan Sherin, composition and sound Sarah Angliss,
    sound Christopher Shutt, illusions Richard Wiseman and Will Houstoun. Presented in association with Ron Fogelman.
  sources:
  - *id001
  - title: What Did Critics Think of The Twilight Zone London World Premiere?
    url: https://playbill.com/article/what-did-critics-think-of-the-twilight-zone-london-world-premiere
    author: Adam Hetrick
    publisher: Playbill
  - title: '''The Twilight Zone'': Theater Review'
    url: https://www.hollywoodreporter.com/review/twilight-zone-theater-1067132
    author: Stephen Dalton
    publisher: The Hollywood Reporter
- date: '2019-03-04'
  title: West End transfer, Ambassadors Theatre, London
  text: Ran 4 March to 1 June 2019, directed by Richard Jones. Oliver Alvin-Wilson, Adrianna Bertola and Neil Haigh returned
    from the Almeida; new to the cast were Alisha Bailey, Natasha J Barnes, Nicholas Karimi, Dan Crossley, Dyfan Dwyfor,
    Lauren O'Neill and Matthew Steer.
  sources:
  - *id001
  - *id002
  - title: Casting Set for West End Transfer of Anne Washburn's The Twilight Zone
    url: https://broadway.com/buzz/194554/casting-set-for-west-end-transfer-of-anne-washburns-the-twilight-zone
    author: Andy Lefkowitz
    publisher: Broadway.com
- date: '2025-05-03'
  title: North American premiere, Citadel Theatre, Edmonton
  text: Ran 3 to 25 May 2025 in the Citadel's 2024-25 season, directed by Richard Jones. The Citadel's page names no cast.
  sources:
  - title: The Twilight Zone (2024-25 season)
    url: https://web.archive.org/web/20240713160422/https://citadeltheatre.com/shows/24-25-twilight-zone/
    publisher: Citadel Theatre
    note: 'Read 2026-11-24: "May 3 - May 25, 2025", "the highly anticipated North American premiere", directed by Richard
      Jones.'

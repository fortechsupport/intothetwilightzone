summary: Anne Washburn's world-premiere stage adaptation weaves several original-series stories by Serling, Beaumont
  and Matheson into one interlocking evening, staged by Richard Jones. It opened at London's Almeida Theatre and
  ran to January 27, 2018, then transferred to the West End's Ambassadors Theatre from March 4, 2019.

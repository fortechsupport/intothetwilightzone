summary: Anne Washburn's stage adaptation weaves eight original-series stories by Serling, Charles Beaumont and Richard
  Matheson into one interlocking evening, directed by Richard Jones and produced with Ron Fogelman, who spent nearly three
  years winning the rights from CBS. It premiered at London's Almeida Theatre (5 December 2017 to 27 January 2018), transferred
  to the West End's Ambassadors Theatre (4 March to 1 June 2019), and had its North American premiere at Edmonton's Citadel
  Theatre in May 2025, again directed by Jones.

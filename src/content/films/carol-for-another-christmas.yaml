title: Carol for Another Christmas
kind: tv-film
summary: Rod Serling's anti-isolationist reworking of A Christmas Carol for ABC, directed by Joseph L. Mankiewicz and
  made for the United Nations, in which a wealthy man who wants America to turn its back on the world is visited by three
  ghosts. Sterling Hayden, Peter Sellers and Eva Marie Saint star.

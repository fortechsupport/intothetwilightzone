summary: An American Masters portrait on PBS of Rod Serling, following him from his early live-television dramas
  through The Twilight Zone and his later struggles with the industry. Lee Grant narrates and Mitch Greenberg voices
  Serling's own words, while family members and colleagues, among them Mike Wallace, recall the writer.

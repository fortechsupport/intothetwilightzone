title: Suspense
kind: tv-series
summary: Long-running CBS radio thriller anthology (to 1962), also a TV series; Serling wrote for the TV version. On
  radio, Suspense turned down Serling's play "The Keeper of the Chair" on 1 December 1949 (Martin Grams Jr.), and its
  former director Elliott Lewis later directed The Zero Hour, which Serling hosted (Flapper Press; Wikipedia).

title: Noon on Doomsday
kind: tv-episode
parent_series: The U.S. Steel Hour
summary: Written in response to the 1955 murder of Emmett Till, the play was meant to show a Southern town shielding
  a killer. Sponsor and network pressure forced Serling to move it to New England and make the victim an unnamed
  foreigner, an episode he cited for the rest of his life as proof that live television could not tell the truth.

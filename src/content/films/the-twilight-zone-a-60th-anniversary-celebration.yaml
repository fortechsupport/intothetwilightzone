summary: 'A one-night cinema event from Fathom Events and CBS Home Entertainment that put six restored original
  episodes on the big screen for the first time: Walking Distance, Time Enough at Last, The Invaders, The Monsters
  Are Due on Maple Street, Eye of the Beholder and To Serve Man, together with a new short documentary about Serling.'

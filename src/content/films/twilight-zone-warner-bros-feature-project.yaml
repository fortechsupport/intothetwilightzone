summary: A new Twilight Zone feature that Warner Bros. and Leonardo DiCaprio's Appian Way have tried to develop for more
  than a decade. Matt Reeves was hired in 2011 and left; Joseph Kosinski entered talks in 2013; a string of writers followed.
  In June 2025 Ben Stiller was reported to be attached to direct, with the script an open writing assignment.

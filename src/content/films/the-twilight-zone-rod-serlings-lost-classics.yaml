summary: A CBS television film built from material Rod Serling left behind, hosted by James Earl Jones. Richard Matheson expands
  a Serling outline into "The Theatre," about a moviegoer who sees her own life on the screen, and Serling's own 1968 script
  "Where the Dead Are" sends a Civil War surgeon to an isolated island where something is wrong. Carol Serling co-produced.

title: The Twilight Zone Super Bowl LIII spot
kind: commercial
release_date: '2019-02-03'
summary: CBS All Access promoted Jordan Peele's revival with a Super Bowl LIII ad on 3 February 2019 that appeared to
  interrupt the broadcast itself, a meta trick in the spirit of the original, with the familiar theme. The campaign it
  opened later won a Clio Entertainment award.

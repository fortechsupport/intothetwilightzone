title: The Doll (unmade Twilight Zone script)
kind: unproduced
writers:
- Richard Matheson
summary: A Richard Matheson teleplay written for the fifth season of the original series and shelved by producer William
  Froug. More than twenty years later Matheson's script was finally filmed as a 1986 episode of Steven Spielberg's Amazing
  Stories, with John Lithgow, and earned Lithgow an Emmy.

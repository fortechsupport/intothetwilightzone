summary: Warner Bros.' theatrical anthology brings the series to cinemas in four segments framed by a late-night drive.
  Three remake classic episodes, about a retirement home, a boy who reshapes reality and a terrified airline passenger;
  one new story traps a bigot in the lives of the people he hates. Burgess Meredith narrates. It grossed about $29.45
  million in North America on a $10 million budget. On July 23, 1982, a helicopter crash during filming of the "Time
  Out" segment killed actor Vic Morrow and child actors Myca Dinh Le and Renee Shin-Yi Chen; director John Landis and
  others were tried for involuntary manslaughter and acquitted in 1987.

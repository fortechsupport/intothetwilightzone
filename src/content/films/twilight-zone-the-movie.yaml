history:
- date: '1982-07'
  title: Children hired in breach of California law
  text: The two children were hired without the required permits and paid under the table, which got around state limits
    on night work by minors and on work near explosives. Landis did not seek a waiver. Associate producer George Folsey
    Jr. reportedly told the parents not to mention the children to fire officials on set.
  sources:
  - title: 'Wikipedia: Twilight Zone: The Movie'
    url: https://en.wikipedia.org/wiki/Twilight_Zone:_The_Movie
  - title: 'Wikipedia: Twilight Zone accident'
    url: https://en.wikipedia.org/wiki/Twilight_Zone_accident
- date: '1982-07-23'
  title: Helicopter crash kills Vic Morrow and two children
  text: 'At about 2:20 a.m., while John Landis was filming his segment of Twilight Zone: The Movie at Indian Dunes near
    Valencia, California, special-effects explosions damaged a low-flying Bell UH-1B helicopter, which crashed. It killed
    Vic Morrow, 53, and child actors Myca Dinh Le, 7, and Renee Shin-Yi Chen, 6. Six people aboard were injured.'
  sources:
  - title: 'Wikipedia: Twilight Zone accident'
    url: https://en.wikipedia.org/wiki/Twilight_Zone_accident
  - title: 'HISTORY.com: Actor and two children killed on Twilight Zone set'
    url: https://www.history.com/this-day-in-history/july-23/actor-and-two-children-killed-on-twilight-zone-set
- date: '1982-07-30'
  title: Labor Commissioner fines studio and filmmakers
  text: A week after the crash, the office of California Labor Commissioner Patrick Henning fined Warner Bros., John
    Landis, George Folsey Jr. and Dan Allingham the $5,000 maximum each. It cited exposing the children to explosives
    and working them after 6:30 p.m. without a permit. Producer Steven Spielberg was not named, and no action was taken
    against the parents.
  sources:
  - title: 'UPI Archives, July 30, 1982: Director John Landis, two assistants and Warner Bros. were fined'
    url: https://www.upi.com/Archives/1982/07/30/Director-John-Landis-two-assistants-and-Warner-Bros-were/8724396849600/
- date: '1983'
  title: Spielberg's role and response
  text: Spielberg co-produced the film and directed the "Kick the Can" segment, but did not direct the Landis segment
    where the crash happened. He was not named in the 1982 labor fines or the criminal case, though the families' civil
    suits named him. He ended his friendship with Landis and later said that no movie is worth dying for.
  sources:
  - title: UPI Archives, July 30, 1982
    url: https://www.upi.com/Archives/1982/07/30/Director-John-Landis-two-assistants-and-Warner-Bros-were/8724396849600/
  - title: 'HISTORY.com: Actor and two children killed on Twilight Zone set'
    url: https://www.history.com/this-day-in-history/july-23/actor-and-two-children-killed-on-twilight-zone-set
  - title: 'Wikipedia: Twilight Zone: The Movie'
    url: https://en.wikipedia.org/wiki/Twilight_Zone:_The_Movie
- date: '1983'
  title: Assistant director's credit replaced with pseudonym
  text: Second assistant director Andy House's credit on the released film was changed to the pseudonym Alan Smithee.
  sources:
  - title: 'Wikipedia: Twilight Zone: The Movie'
    url: https://en.wikipedia.org/wiki/Twilight_Zone:_The_Movie
- date: '1983-06-24'
  title: Five defendants plead innocent to manslaughter
  text: After a Los Angeles County grand jury indictment the week before, Landis, Folsey, Allingham, pilot Dorcey Wingo
    and special-effects chief Paul Stewart pleaded innocent to involuntary manslaughter. Landis, Wingo and Stewart were
    charged over all three deaths, and Folsey and Allingham over the children's deaths only. A crew member reportedly
    testified to the grand jury under immunity.
  sources:
  - title: 'UPI Archives, June 24, 1983: Director John Landis and four assistants pleaded innocent'
    url: https://www.upi.com/Archives/1983/06/24/Director-John-Landis-and-four-assistants-pleaded-innocent-Friday/5580425275200/
- date: '1984-10'
  title: NTSB report on the crash
  text: The NTSB's accident report (AAR-84-02) gave the probable cause as special-effects explosions detonated too close
    to the low-flying helicopter. Debris and heat damaged the rotors and the tail rotor separated. It also faulted the
    lack of direct coordination between the pilot and the director.
  sources:
  - title: 'Wikipedia: Twilight Zone accident'
    url: https://en.wikipedia.org/wiki/Twilight_Zone_accident
  - title: 'Wikipedia: Twilight Zone: The Movie'
    url: https://en.wikipedia.org/wiki/Twilight_Zone:_The_Movie
- date: '1986'
  title: FAA tightens rules on helicopter filming
  text: A March 1982 FAA rule on aircraft in film work had covered only fixed-wing planes. After the crash, the FAA amended
    Order 8440.5A to state that low-level helicopter movie flights need a certificate of waiver. The amendment was drafted
    in 1984 and formally adopted in 1986.
  sources:
  - title: 'Wikipedia: Twilight Zone accident'
    url: https://en.wikipedia.org/wiki/Twilight_Zone_accident
- date: '1986'
  title: People v. Landis trial begins
  text: The manslaughter trial of Landis, Folsey, Allingham, Wingo and Stewart, prosecuted by Lea Purwin D'Agostino,
    ran for roughly nine to ten months across 1986 and 1987. It was reported as the first criminal trial of a film director
    over an accident during a shoot.
  sources:
  - title: 'TIME, June 8, 1987: Law: Twilight Zone: The Verdict'
    url: https://time.com/archive/6709456/law-twilight-zone-the-verdict/
  - title: 'Wikipedia: Twilight Zone accident'
    url: https://en.wikipedia.org/wiki/Twilight_Zone_accident
- date: '1987'
  title: Families' civil suits settled
  text: The families of all three victims brought civil suits naming Landis, Warner Bros. and Steven Spielberg. All were
    settled for undisclosed sums. Wikipedia reports that Morrow's family settled within about a year of the trial and
    that the children's families recovered millions in total. Exact settlement dates were not found.
  sources:
  - title: 'HISTORY.com: Actor and two children killed on Twilight Zone set'
    url: https://www.history.com/this-day-in-history/july-23/actor-and-two-children-killed-on-twilight-zone-set
  - title: 'Wikipedia: Twilight Zone accident'
    url: https://en.wikipedia.org/wiki/Twilight_Zone_accident
- date: '1987'
  title: Industry safety reforms
  text: In 1987 the California State Fire Marshal's office set up its Motion Picture and Entertainment Safety Program
    to oversee pyrotechnics on productions. Warner Bros. created safety committees. The DGA started safety bulletins
    and a hotline and began disciplining members for safety breaches, and SAG added a 24-hour safety hotline.
  sources:
  - title: 'Wikipedia: Twilight Zone accident'
    url: https://en.wikipedia.org/wiki/Twilight_Zone_accident
  - title: 'Far Out: How ''Twilight Zone: The Movie'' deaths changed Hollywood'
    url: https://faroutmagazine.co.uk/how-twilight-zone-the-movie-deaths-changed-hollywood/
- date: '1987-05-29'
  title: All five defendants acquitted
  text: The jury found Landis and his four co-defendants not guilty on every involuntary manslaughter count. Landis denied
    blame for the crash but later conceded that hiring the children had been wrong. D'Agostino said the case had made
    Hollywood more cautious.
  sources:
  - title: 'Crime Library: The Twilight Zone Tragedy (verdict)'
    url: https://web.archive.org/web/20240522053727/https://www.crimelibrary.org/notorious_murders/not_guilty/twilight_zone/9.html
  - title: 'TIME, June 8, 1987: Law: Twilight Zone: The Verdict'
    url: https://time.com/archive/6709456/law-twilight-zone-the-verdict/
  - title: 'Wikipedia: Twilight Zone: The Movie'
    url: https://en.wikipedia.org/wiki/Twilight_Zone:_The_Movie

title: The Loner
kind: tv-series
summary: 'Serling''s half-hour CBS western, created and largely written by him. Lloyd Bridges played William Colton,
  a Union cavalry officer who drifts west after the Civil War, and most episodes turn on a moral problem about violence,
  prejudice or revenge rather than gunplay. Executive producer William Dozier; theme by Jerry Goldsmith; made by
  Greenway and Serling''s Interlaken Productions with 20th Century-Fox. It ran one season of 26 black-and-white
  episodes, from September 18, 1965 to March 12, 1966, amid disputes with CBS over the network''s wish for more
  action. Shout! Factory and Timeless Media released the complete series on four DVDs in 2016 with the featurette
  The Wandering Man''s Burden: Making The Loner.'

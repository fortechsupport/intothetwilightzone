title: The Happy Place
kind: unproduced
writers:
- Rod Serling
summary: Serling's first proposed pilot script for The Twilight Zone, about a society that puts its citizens to
  death when they reach sixty. CBS executive William Self judged it too bleak to sell to sponsors, and Serling wrote
  "Where Is Everybody?" as a gentler replacement.

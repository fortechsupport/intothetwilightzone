title: The Sixth Sense (1972 TV series)
kind: tv-series
summary: 'ABC''s hour-long paranormal drama starring Gary Collins as Dr. Michael Rhodes, a parapsychologist with ESP who investigates supernatural crimes with his assistant Nancy Murphy (Catherine Ferrar). Created by Anthony Lawrence from the 1971 TV movie Sweet, Sweet Rachel and produced by Stan Shpetner, it ran 25 episodes from January 15 to December 23, 1972. Its link to The Twilight Zone runs through Rod Serling: Universal cut every episode to half an hour and folded them into the syndicated Night Gallery package, with newly filmed Serling introductions in front of new paintings.'

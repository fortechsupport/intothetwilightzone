publisher: TZ Publications, Inc.
cover_artist: Walter Velez
editor: T.E.D. Klein
description: January-February 1983 issue, the first bimonthly, with Lisa Tuttle's interview with Roald
  Dahl and a reprint of his 'Royal Jelly', Sam Frank's article on Rod Serling's 'lost' Christmas Carol
  adaptation, a feature on role-playing games, and fiction by Jack McDevitt, Joe R. Lansdale, Charles
  L. Grant and John Kessel. It ran part twenty-two of Zicree's guide and Serling's teleplay 'One for the
  Angels'.

description: July 1982 issue with Stephen King's film essay 'Digging The Boogens', an interview with Robertson
  Davies alongside his story 'Offer of Immortality', and fiction by Robert Silverberg, Joe R. Lansdale
  ('Chompers'), Lewis Shiner and Joan Aiken. It ran part sixteen of Zicree's guide and Serling's teleplay
  'A Hundred Yards Over the Rim'.

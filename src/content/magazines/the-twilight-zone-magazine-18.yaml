title: 'The Twilight Zone Magazine, #18'
magazine: The Twilight Zone Magazine
cover_date: Sep 1982
order: 18
publisher: TZ Publications, Inc.
editor: T.E.D. Klein
description: September 1982 issue with an interview with Paul Schrader, Mike Ashley's essay on Arthur
  Machen plus a Machen sampler, previews of 'Creepshow' and 'Something Wicked This Way Comes', and fiction
  by Jonathan Carroll ('The Jane Fonda Room') and newcomer John Skipp. It carried part eighteen of Zicree's
  guide and a Rod Serling script, 'A Machine to Answer the Question'.

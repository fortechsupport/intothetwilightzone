description: 'July-August 1983 ''Supernatural Cats'' theme issue with H.P. Lovecraft''s essay ''Something
  About Cats'', Peter Cannon''s ''interview'' assembled from Lovecraft''s letters, a photo preview of
  Twilight Zone: The Movie, and fiction by Gahan Wilson and S. Fowler Wright. It ran part twenty-five
  of Zicree''s guide and Serling''s teleplay ''Five Characters in Search of an Exit''.'

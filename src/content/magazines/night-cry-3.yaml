description: 'Fall 1985 issue, the last edited by T.E.D. Klein. Numbered Vol. 1, No. 3. Fiction: "Bagman" by William
  R. Trotter; "The Man Who Couldn''t Remember" by David Curtis; "Fright Night" by Vincent McHardy; "The Bite" by
  Elizabeth Morton; "The Spook Man" by Al Sarrantonio; "The Woman''s Version" by David J. Schow; "Jockeying for
  Time" by David Shifren; "The Friends of the Friends" by Henry James; "Vastation" by David Morrell; "The Lighthouse"
  by Edgar Allan Poe and Robert Bloch; "In the Sunken Museum" by Gregory Frost; "Luna" by G.W. Perriwills; "Children
  of the Hydra" by Dale (or Brad) Hammell. Also: Introduction (Alan Rodgers); Profile: Henry James (David Morrell);
  Special classics section: Poe and James.'

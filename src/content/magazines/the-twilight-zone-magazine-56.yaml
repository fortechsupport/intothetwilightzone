description: 'October 1988 issue, edited by Tappan King. Fiction: "The Falling Man, Part I" by David J. Schow; "Animals"
  by Elizabeth Mitchell; "Memoirs of a Bottle Djinn" by Jane Yolen; "Floodgate" by Stanley Schmidt; "Dreams of Drowning
  (TZ First)" by Wells Lord Hough; "The Name on the Book" by Richard Wilson; "Heart''s Desire" by James Killus.
  Features: Inside The New Horror by Philip Nutman; TZ Interview: David Lynch, by James Verniere; Reader''s Survey
  Results; Illuminations: Marina Sirtis piece by Robert Simpson. Regular columns: Editor''s Notes (Tappan King);
  Books (Edward Bryant); Video - Confessions of a Video Junkie (David W. Dow); Screen (Gahan Wilson); In the Twilight
  Zone; Letters; TZ Screening Room. Vol. 8 No. 4. No teleplay listed. Schow serial continues next issue.'

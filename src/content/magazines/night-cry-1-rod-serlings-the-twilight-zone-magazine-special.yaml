title: 'Night Cry #1 (Rod Serling''s The Twilight Zone Magazine Special)'
magazine: Night Cry
cover_date: '1984'
order: 62
publisher: TZ Publications, Inc.
editor: T.E.D. Klein
kind: special
description: 'The first Night Cry, issued as the digest-size ''Rod Serling''s The Twilight Zone Magazine Special'',
  reprinted twenty horror stories and features from the parent magazine''s 1981-84 issues chosen by T.E.D. Klein.
  Edited by T.E.D. Klein. Fiction: "The Red-Eyed Thing" by Jere Cunningham; "Essence of Charlotte" by Charles L.
  Grant; "The River Styx Runs Upstream" by Dan Simmons; "Weigh Station" by Robert Crais; "The Next Sideshow" by
  Ramsey Campbell; "Sea Change" by George Clayton Johnson; "Blood Relations" by Lewis Shiner; "Tiger of the Mind"
  by Ron Wolfe; "Frontiers" by Kit Reed; "Night Cry" by Katherine M. Turney; "Windigo Country" by Dennis Delaney;
  "When the Cat''s Away ..." by John Alfred Taylor; "A Chance Affair" by Mignon Glass; "Home Visit" by Roger Koch;
  "Mistral" by Jon Wynne-Tyson; "Harry''s Story" by Robert H. Curtis; "The Voice in the Night" by William Hope Hodgson;
  "Go to Sleep" by John Skipp; "Invitation to a Party" by Jon Cohen; "And Now I''m Waiting" by Richard Matheson.
  Also: Introduction (T.E.D. Klein).'

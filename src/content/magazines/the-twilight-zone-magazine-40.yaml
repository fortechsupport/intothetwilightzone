description: 'February 1986 issue, edited by Michael Blaine. Fiction: "The Fifth Quarter" by Stephen King; "The
  Last One Mo'' Once Golden Oldies Revival" by F. Paul Wilson; "The Age of Fish" by Patricia Stoll; "Ska . . . Zik!"
  by Jeffrey Whitmore; "The Crossing" by Peter Heyrman; "The Gift" by Richard Partlow; "Pillaging Poe" by A.R. Morlan;
  "Televisionaries" by Larry Tritten. Features: Talking Terror with Stephen King, interview by Douglas E. Winter;
  King Directs ''Overdrive'' (Maximum Overdrive), by Tyson Blue; Collecting King; Movie Preview: F/X; The Tube Fantastic;
  Show-by-Show Guide to ''Night Gallery'', Part 6 (series by Kathryn M. Drennan and J. Michael Straczynski). Teleplay:
  "Will the Real Martian Please Stand Up?" by Rod Serling (Will the Real Martian Please Stand Up? (original series,
  Season 2, 1961)). Regular columns: Illuminations (Peter Rondinone?); TZ Tech (Robert Edelstein); Books (Doc Kennedy);
  Screen (Gahan Wilson?); TZ Video (Welch Everman?). Vol. 5 No. 6; Stephen King issue. Contents page sets titles
  and bylines in separate columns, so several feature/column bylines are inferred and uncertain.'

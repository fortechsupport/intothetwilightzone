title: 'The Twilight Zone Magazine, #46'
magazine: The Twilight Zone Magazine
cover_date: Feb 1987
order: 46
publisher: TZ Publications, Inc.
editor: Tappan King
description: 'February 1987 issue, edited by Tappan King. Fiction: "Nackles" by Donald E. Westlake; "Listen to the
  Music in My Hands" by Charles L. Grant; "Happy Hour" by J. N. Williamson; "Bringing It Home" by Barry N. Malzberg
  and Jack Dann; "Contention" by Karen Joy Fowler; "Snowblind" by Marc Laidlaw; "Nightskin" by John Brizzolara;
  "Preserves" by Jon Cohen; "Dead Man''s Tie" by Jack C. Haldeman II. Features: The Twilight Zone Gallery: J. K.
  Potter portfolio, with interview by Joe R. Lansdale; Harlan Ellison''s account of writing (and the fate of) his
  ''Nackles'' teleplay. Teleplay: "Nackles" by Harlan Ellison (from the Donald E. Westlake story) (Nackles - written
  for the 1985-89 CBS revival but never produced). Regular columns: In the Twilight Zone and Illuminations (Tappan
  King); Books (E. F. Bleiler); Book Notes (Jonathan White); The Other Side (Welch D. Everman); The Goulart Archipelago
  (Ron Goulart); Screen (Gahan Wilson); Video. Vol. 6 No. 6; Christmas issue printing Westlake''s original story
  alongside Ellison''s unproduced revival teleplay. The catalogue notes that the cover art is titled "Winter Dreams";
  the artist is not named.'

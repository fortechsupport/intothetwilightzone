description: March 1982 issue spotlighting Fritz Leiber, with his story 'The Man Who Never Grew Young'
  and an interview by Paul Sammon, plus Ed Naha's preview of John Carpenter's 'The Thing' and fiction
  by Ron Goulart and Steve Rasnic Tem. It ran part twelve of Zicree's guide and Serling's teleplay 'A
  Passage for Trumpet'.

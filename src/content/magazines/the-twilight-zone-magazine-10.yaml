description: January 1982 Christmas issue featuring Rod Serling's memoir 'My Most Memorable Christmas',
  an interview with Frank Belknap Long, a Mike Ashley essay on J. Sheridan Le Fanu with a Le Fanu reprint,
  and fiction by Connie Willis, Parke Godwin and Robert Sheckley. It ran part ten of Zicree's guide and
  Serling's teleplay 'The Night of the Meek'.

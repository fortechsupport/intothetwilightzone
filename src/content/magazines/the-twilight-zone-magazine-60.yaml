description: 'June 1989 issue, edited by Tappan King. Fiction: "Just Another Perfect Day" by John Varley; "Maggie
  (TZ First)" by Dan Bennett; "Spuds (TZ First)" by Terry Runte; "The Carnival" by Charles Beaumont; "Timed Exposure"
  by Richard Christian Matheson; "Exodus: 22:18" by Nancy Baker. Features: Return of the Zone, Part 5 by J. Michael
  Straczynski; Remembering Charles Beaumont by Roger Anker; Your Three Minutes Are Up by George Clayton Johnson;
  Rod Serling''s Night Gallery, Part 11 by Kathryn Drennan and J. Michael Straczynski; The Mind''s Ear by Jillian
  Smith and Margaret Mayo McGlynn. Teleplay: "Nothing in the Dark" by George Clayton Johnson (Nothing in the Dark
  (original series, 1962)). Regular columns: Editor''s Notes (Tappan King); Letters; Books (Edward Bryant); Screen
  (Gahan Wilson); In the Twilight Zone; TZ Quiz; TZ Screening Room. Vol. 9 No. 2; final issue.'

title: 'The Twilight Zone Magazine, #23'
magazine: The Twilight Zone Magazine
cover_date: Mar-Apr 1983
order: 23
publisher: TZ Publications, Inc.
cover_artist: Kari Brayman
editor: T.E.D. Klein
description: 'Second-anniversary issue (March-April 1983) printing Rod Serling''s unproduced ''Notes for
  a Twilight Zone Movie'' treatment and news on the upcoming Twilight Zone: The Movie segments by Joe
  Dante and George Miller, plus an interview with Colin Wilson and Richard Matheson''s story ''And Now
  I''m Waiting''. It ran part twenty-three of Zicree''s guide and Matheson''s teleplay ''A World of His
  Own''.'

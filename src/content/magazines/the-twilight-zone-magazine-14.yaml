title: 'The Twilight Zone Magazine, #14'
magazine: The Twilight Zone Magazine
cover_date: May 1982
order: 14
publisher: TZ Publications, Inc.
editor: T.E.D. Klein
cover_artist: William Stoneham
description: May 1982 issue with Peter Straub's first short story 'The General's Wife', an interview with
  Terry Gilliam, a set visit to 'Creepshow', and fiction by Connie Willis, Kit Reed, Robert Crais and
  Chet Williamson. It paired George Clayton Johnson's story 'All of Us Are Dying' with Rod Serling's teleplay
  adapted from it, 'The Four of Us Are Dying', alongside part fourteen of Zicree's guide.

description: 'April 1987 issue, edited by Tappan King. Fiction: "Sixth Annual TZ Short Story Contest winners and
  runners-up" by various; "The Other Side" by Ramsey Campbell; "An Image in Twisted Silver" by Charles L. Grant;
  "The Man Who Devoured Literature" by George Alec Effinger; "The Leash" by Pamela Sargent; "General Jaruzelski
  at the Zoo" by George Zebrowski; "Clay Devils" by Pat Murphy; "The Flat-Brimmed Hat" by Nancy Etchemendy; "At
  the Rummage Sale" by Vicki Grove; "short-short (title not read)" by Algis Budrys. Features: Interview with Carol
  Serling by Bob Rosenbaum; Interviews with Ramsey Campbell and Charles L. Grant by Stanley Wiater and Douglas E.
  Winter. Regular columns: In the Twilight Zone (Tappan King); Books (E. F. Bleiler); Illuminations. Vol. 7 No.
  1. Contents page is cut off in OCR; last four fiction entries were found elsewhere in the issue text and may include
  contest entries.'

title: 'The Twilight Zone Magazine, #27'
magazine: The Twilight Zone Magazine
cover_date: Nov-Dec 1983
order: 27
publisher: TZ Publications, Inc.
editor: T.E.D. Klein
description: November-December 1983 issue with an interview with David Cronenberg and a 'Dead Zone' set report,
  the start of David J. Schow's history of The Outer Limits, and fiction by Fredric Brown, Ramsey Campbell, John
  Sladek, Chet Williamson and Thomas M. Disch. With Zicree's guide finished, the issue reprinted Serling's teleplay
  'It's a Good Life'; the cover used a still from 'Iceman'. The Twilight Zone Vortex review of this issue describes
  the cover as a "Film image from Iceman (1984)".

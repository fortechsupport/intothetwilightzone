description: 'December 1987 issue, edited by Tappan King. Fiction: "Life" by Piers Anthony; "The Thing Beneath the
  Bridge (excerpt from Faerie Tale)" by Raymond E. Feist; "The Stray" by Susan Casper and Gardner Dozois; "Haunted"
  by Marta Randall; "Pick-up" by Peter Heyrman; "Crybaby" by Harry Turtledove; "Iron Butterflies" by Mona A. Clee.
  Features: Children of the Night by Robert Simpson; A Conversation with Piers Anthony, by Stanley Wiater; The Ethos
  of Elfland by Gene Wolfe; Movie Preview: Hellraiser - Douglas E. Winter in conversation with Clive Barker. Regular
  columns: Books (Edward Bryant); Wordware (Charles Ardai); Screen (Gahan Wilson); In the Twilight Zone (TK); Letters;
  Hollywood Grapevine; Illuminations; The Other Side. Vol. 7 No. 5. OCR of the contents page is scrambled; some
  author pairings inferred from page order. No teleplay found.'

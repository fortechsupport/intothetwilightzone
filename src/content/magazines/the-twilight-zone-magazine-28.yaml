title: 'The Twilight Zone Magazine, #28'
magazine: The Twilight Zone Magazine
cover_date: Jan-Feb 1984
order: 28
publisher: TZ Publications, Inc.
editor: T.E.D. Klein
description: January-February 1984 issue with a short story by John Carpenter ('Harlequin'), an interview with Stephen
  King about 'Christine', an Isaac Bashevis Singer interview and reprint, and the first part of David J. Schow's
  show-by-show guide to The Outer Limits. It reprinted Serling's teleplay 'Mirror Image' and included a 1984 pull-out
  calendar. The catalogue notes that the cover "is a still from the motion picture Stephen King's Christine".

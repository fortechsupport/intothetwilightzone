description: 'Summer 1987 issue edited by Alan Rodgers, the last with a J.K. Potter cover. Fiction: "Traps" by F.
  Paul Wilson; "The Cleanup" by John Skipp and Craig Spector; "The Cats of Thermidor" by Paul Witcover; "Dancers"
  by Lewis Shiner; "The Perfect Gift" by Jean Darling; "John Mortonson''s Funeral" by Ambrose Bierce; "The Middle
  Toe of the Right Foot" by Ambrose Bierce; "The Night Seasons (Part III)" by J. N. Williamson; "There''s Magic
  in Shakespeare" by Reginald Bretnor; "Just Another Bedtime Story" by A. R. Morlan; "Death Flight" by John Maclay;
  "Cheapskate" by G. L. Raisor; "The Children of Lommos" by Darrell Schweitzer and John Gregory Betancourt; "The
  Liquor Cabinet of Dr. Malikudzu" by Marc Laidlaw. Also: Introduction: The Keeper of the Night (Tappan King); Profile:
  Ambrose Bierce (Thomas E. Sanders); Three Sprites (poems, Tom Disch); Two Poems (David C. Kopaska-Merkel); Books
  (Al Sarrantonio); Film (T.E.D. Klein).'

title: 'The Twilight Zone Magazine, #24'
magazine: The Twilight Zone Magazine
cover_date: May-Jun 1983
order: 24
publisher: TZ Publications, Inc.
editor: T.E.D. Klein
description: 'May-June 1983 issue carrying Stephen King''s story ''The Raft'' and Twilight Zone: The Movie coverage,
  including a profile of segment director George Miller and news on Spielberg''s ''Kick the Can'' and Scatman Crothers.
  It also had interviews with V.C. Andrews, Mel Gibson and the ''Psycho II'' team, Jack Sullivan on Bernard Herrmann,
  part twenty-four of Zicree''s guide, and Serling''s teleplay ''The Lonely''. The Twilight Zone Vortex review of
  this issue credits the cover art to "Artifact"; no person is named.'

description: 'December 1988 issue, edited by Tappan King. Fiction: "Deadlines" by Craig Spector; "I''ve Been Waiting
  All My Life to Meet You" by John Skipp; "The Man Who Wasn''t Nice to Pumpkin Head Dolls" by Darrell Schweitzer;
  "Perfect Disguises" by Bruce Taylor; "The Falling Man, Part II" by David J. Schow; "Overtime - A Halloween Tale
  (TZ First)" by John Tibbetts. Features: Spotlight on Rod Serling; TZ 30th Anniversary Ultimate Trivia Quiz, compiled
  by Jennifer Steinhauer; Return of the Zone (special report on the 1988 CBS/syndicated revival) by J. Michael Straczynski;
  Fall TV Preview by Craig Miller; TZ Interview: David Cronenberg, by James Verniere. Teleplay: "King Nine Will
  Not Return" by Rod Serling (King Nine Will Not Return (original series, Season 2 premiere, 1960)). Regular columns:
  In the Twilight Zone; Publisher''s Note (Carol Serling); Books (Edward Bryant); Screen (Gahan Wilson); Other Dimensions
  (Jennifer Steinhauer). Vol. 8 No. 5; 30th-anniversary themed issue.'

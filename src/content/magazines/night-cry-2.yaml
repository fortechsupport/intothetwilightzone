description: 'Summer 1985 issue, the first under the Night Cry name as a regular quarterly; from this point the
  digest carried mostly new horror fiction alongside some reprints. Numbered Vol. 1, No. 2. Edited by T.E.D. Klein.
  Fiction: "Scenicruiser and the Silver Lady" by Peter S. Alterman; "The Death Runner" by Thomas Sullivan; "Worms
  from Mars" by Augustine Funnell; "Food, Gas, Lodging" by Craig W. Anderson; "The Ash-Tree" by M.R. James; "Zombies"
  by Dolly Ogawa; "Hell Is Murky" by John Alfred Taylor; "Cruising" by Donald Tyson; "The Thing from the Slush"
  by George Alec Effinger; "The Dark" by Benjamin Gleisser; "Bugs" by Larry Tritten; "W.S." by L. P. Hartley; "The
  New Man" by Barbara Owens; "Four Days Before the Snow" by A.R. Morlan. Also: From the Editor (T.E.D. Klein).'

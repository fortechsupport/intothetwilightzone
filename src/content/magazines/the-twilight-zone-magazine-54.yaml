description: 'June 1988 issue, edited by Tappan King. Fiction: "Stinger (novel excerpt/preview)" by Robert R. McCammon;
  "His Mother''s Eyes" by T. M. Wright; "Last Night, in the Kitchen" by Charles L. Grant; "The Last Round" by Charles
  R. Saunders; "The Music of the Dark Time" by Chet Williamson; "Ain''t Nothin'' but a Hound Dog" by B. W. Clough;
  "My Name Was Hastings" by Roy Sorrels; "Quantum Leap (TZ First)" by Anita Evangelista; "The Party Over There (TZ
  First)" by Nancy Baker; "Triolet (poem; OCR title garbled)" by Joe Haldeman; "The Hunchback of Tulsa, Ok. (poem)"
  by Michael Bishop. Features: ''Ever Et Raw Meat?'' And Other Weird Questions by Stephen King (essay); Truth''s
  Bodyguard: interview with James Randi by Stanley Wiater; A Conversation With J.G. Ballard by James Verniere; Twilight
  Zone Gallery: Kelly Freas portfolio; The Ghost in the Gray-Flannel Suit by Deborah Quilter. Regular columns: Books
  (Edward Bryant); Small Press (Bob Morrish); Screen (Gahan Wilson); In the Twilight Zone; Letters; Hollywood Grapevine;
  Illuminations; The Other Side. Vol. 8 No. 2. Haldeman poem title is garbled in OCR.'

description: 'April 1989 issue, edited by Tappan King. Fiction: "Person to Person" by Richard Matheson; "Stoner"
  by William F. Nolan; "Slice of Life" by Mike Resnick; "Fine or Superfine" by Martha Soukup; "Wolf Trapping" by
  Kij Johnson; "Double Indemnity (TZ First)" by David E. Myers; "Hickory, Dickory, Dock (TZ First)" by David E.
  Myers. Features: Return of the Zone, Part IV, by J. Michael Straczynski; The Twilight Zone Review: 1988 (year
  in film, TV, fiction); Rod Serling''s Night Gallery (episode-guide series) by Kathryn M. Drennan and J. Michael
  Straczynski; A Star for Rod Serling (Hollywood Walk of Fame); TZ First Contest Winners. Teleplay: "The Obsolete
  Man" by Rod Serling (The Obsolete Man (original series, Season 2, 1961)). Regular columns: In the Twilight Zone;
  Editor''s Notes; Letters; Video (Bill Warren). Vol. 9 No. 1. OCR listing shows both TZ First stories credited
  to David E. Myers; may be an OCR/reading error for one of them.'

description: 'Spring 1986 issue edited by Alan Rodgers, with original horror fiction, poetry and commissioned interior
  art. Fiction: "Special Delivery" by Anita Kranitz Schlank; "Hellcatcher" by Steven Popkes; "The Yougoslaves" by
  Robert Bloch; "Coming of Age at Apple Creek" by Thomas E. Sanders (Nippawanock); "The Light at the End" by John
  Skipp and Craig Spector; "The Squaw" by Bram Stoker; "American Dream" by V. K. Gibson; "Brass (Part I of II)"
  by David J. Schow; "Leaving" by Darrell Schweitzer; "Mayaland" by Paul Witcover; "The Holiday House" by A. R.
  Morlan; "Still-Life" by Julie Yobst; "The Promise" by Frank Meyer; "The Book of Webster''s" by J. N. Williamson.
  Also: Introduction (Alan Rodgers); Profile: Bram Stoker; Three Poems (incl. ''The Shaman'', Ronald Terry).'

description: 'February 1988 issue, edited by Tappan King. Fiction: "Call 666" by Dennis Etchison; "Break Up" by
  Richard Christian Matheson; "Not with a Whimper" by John Skipp & Craig Spector; "Prince of Flowers (TZ First)"
  by Elizabeth Hand; "The Blimp Hunter (TZ First)" by J. Noyes Scher; "Moonlight Becomes Magenta" by Paul Witcover;
  "The Book of Hieronymus Bosch (sestina)" by T.E.D. Klein; "The Immersion" by Peter Heyrman; "Listening for the
  General" by Kim Antieau; "Snowcrest" by Randolph Cirilo. Features: On the Cutting Edge: conversation with Dennis
  Etchison, by Stanley Wiater; Occupation: Ghostbreaker! - Roger Anker talks with Richard Christian Matheson; Countdown
  to the Millennium, by Mark Arnold; Illuminations items by Robert Simpson, Ron Wolfe and Deborah Quilter. Regular
  columns: Books (Edward Bryant); Other Dimensions/Screen (Gahan Wilson); In the Twilight Zone; Letters; Hollywood
  Grapevine; The Other Side. Vol. 7 No. 6. #52 = Feb 1988 matches counting back from #60 (June 1989). Elizabeth
  Hand''s ''Prince of Flowers'' was an early published story. No teleplay listed.'

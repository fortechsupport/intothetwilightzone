title: 'The Twilight Zone Magazine, #50'
magazine: The Twilight Zone Magazine
cover_date: Oct 1987
order: 50
publisher: TZ Publications, Inc.
editor: Tappan King
cover_artist: Peter Goodfellow
description: 'October 1987 issue, edited by Tappan King. Fiction: "The Forge of God (excerpt)" by Greg Bear; "Voices
  in the Earth" by Alan Brennert; "Ambition" by Barry N. Malzberg; "Alien Mail to the White House" by Jay Sheckley;
  "Davi Leiko Till Midnight" by William F. Wu; "Mad City Beneath the Sands" by Richard Paul Russo; "Delta Sly Honey"
  by Lucius Shepard; "The Cuttlefish" by A.R. Morlan. Features: BIOFUTURES: The Next Turn of the Corkscrew by Frederik
  Pohl; The Twilight Zone Gallery: Jim Burns; On Film by James Verniere; Science Fiction in the Twilight Zone by
  Marc Scott Zicree; Ultimate Getaways by Mark Arnold. Regular columns: Books (Edward Bryant); Screen (Gahan Wilson);
  In the Twilight Zone; Illuminations; The Other Side; Hollywood Grapevine. Vol. 7 No. 4; a science-fiction themed
  issue. Brennert''s ''Voices in the Earth'' is presented as prose based on his teleplay for the 1985-89 revival
  series (episode ''Voices in the Earth'', 1987); no classic teleplay listed.'

title: 'The Twilight Zone Magazine, #1'
magazine: The Twilight Zone Magazine
cover_date: Apr 1981
order: 1
publisher: TZ Publications, Inc.
editor: T.E.D. Klein
description: Premiere issue with a message from Carol Serling, a profile of Rod Serling by Klein and Marc
  Scott Zicree, Charles L. Grant's interview with Stephen King, and fiction by Harlan Ellison ('Grail'),
  George R.R. Martin, Joyce Carol Oates, Ramsey Campbell and Robert Sheckley. It began Zicree's show-by-show
  episode guide and reprinted Serling's teleplay 'Walking Distance'.

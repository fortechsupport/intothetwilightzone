title: 'The Twilight Zone Magazine, #15'
magazine: The Twilight Zone Magazine
cover_date: Jun 1982
order: 15
publisher: TZ Publications, Inc.
cover_artist: Malcolm McNeill
editor: T.E.D. Klein
description: June 1982 issue featuring an interview with Philip K. Dick (by John Boonstra) and a 'Blade
  Runner' preview. Instead of a Serling script it printed Richard Matheson's unproduced Twilight Zone
  teleplay 'The Doll' with Zicree's account of its history, plus part fifteen of the episode guide and
  fiction by Richard Christian Matheson, Steve Rasnic Tem and Pamela Sargent.

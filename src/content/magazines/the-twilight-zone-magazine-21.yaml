description: December 1982 issue (numbered Vol. 2, No. 10 because No. 9 went to the annual) with an interview
  with Ridley Scott, Jack Sullivan's essay on L.P. Hartley with a Hartley reprint, and fiction by Pamela
  Sargent, Mort Castle and David J. Schow. It ran part twenty-one of Zicree's guide and the teleplay 'Living
  Doll', credited to Charles Beaumont but ghost-written by Jerry Sohl.

description: 'December 1986 issue, edited by Tappan King (editor-in-chief. Fiction: "The Black Pumpkin" by Dean
  R. Koontz; "A Perfect Halloween Night" by Rose Rinaldi; "The Spirit of Things" by John Skipp; "Red Light" by David
  J. Schow; "Fractures" by Kim Antieau; "The Cryptogram" by Donald R. Burleson; "Hotel Hunting" by Charles Sheffield;
  "The Hole Truth" by Lois McMaster Bujold. Features: Dean of Suspense: interview with Dean R. Koontz by Joe R.
  Lansdale; Probing by Fire: Craig Spector talks with David J. Schow; Interview: Stephen King, by Tyson Blue; Film
  Preview: Trick or Treat, by James Verniere; TZ/TV: Fall TV Preview, by Robin Bromley; Next Stop: The Twilight
  Zone, by Michael Reaves. Teleplay: "Her Pilgrim Soul" by Alan Brennert (Her Pilgrim Soul (1985-89 CBS revival,
  Season 1, 1985)). Regular columns: Books (E. F. Bleiler); Book Notes (Jonathan White); Screen (Gahan Wilson).
  Vol. 6 No. 5; Halloween-themed. Revival-series teleplay rather than a classic Serling script.'

title: 'The Twilight Zone Magazine, #35'
magazine: The Twilight Zone Magazine
cover_date: Mar-Apr 1985
order: 35
publisher: TZ Publications, Inc.
cover_artist: Luke Ryan
editor: T.E.D. Klein
description: 'April 1985 issue, edited by T.E.D. Klein. Fiction: "Wiley''s Hunger" by David B. Schock; "In the Shadow
  of the Castle" by Randolph Cirilo; "Does It Make a Sound?" by Joseph Calabro; "Airmail" by Ken McCormack; "Bloodfall"
  by T. Coraghessan Boyle; "Pattern for Survival" by Richard Matheson; "Ben at the Window" by Jon Cohen; "Barter"
  by Lois McMaster Bujold; "The Magistrate''s Pillow" by Gordon Linzner. Features: Kenneth McMillan: Never Out of
  Characters, by Lorenzo Carcaterra; Rod Serling Viewed from Beyond ''The Twilight Zone'', by Andrew Sarris; Beyond
  the Zone, by Feggo (cartoons); TZ Screen Preview: Brazil, by James Verniere; Show-by-Show Guide to ''Night Gallery'',
  by Kathryn M. Drennan and J. Michael Straczynski; A Russian Looks at ''2010'', by Victor Steinbach; Special Report:
  ''The Twilight Zone'' Returns (CBS revival), by Jefferson Graham; Brief Encounter, by Jim Ryan; Quiz: Celebrity
  Autograph Hunt (Herman Darvick?). Teleplay: "Where Is Everybody?" by Rod Serling (Where Is Everybody? (original
  series pilot/first episode, 1959)). Regular columns: A Word from the Publisher (Carol Serling); In the Twilight
  Zone; Books (D.W. ''Doc'' Kennedy); Screen (Gahan Wilson); My Darkest Fantasy (Joe R. Lansdale); Etc.; Letters.
  Vol. 5 No. 1 (masthead reads March/April 1985). Lois McMaster Bujold''s ''Barter'' was her first professional
  sale.'

title: Great Stories from Rod Serling's The Twilight Zone Magazine (1983 Annual)
magazine: Rod Serling's The Twilight Zone Magazine
cover_date: '1983'
publisher: TZ Publications, Inc.
editor: T.E.D. Klein
kind: annual
description: 'A letter-size, perfect-bound retrospective annual of stories from the magazine''s early issues, released
  around December 1982 as the 1983 annual; it was the only one produced. Klein said the skipped number Vol. 2, No.
  9 of the magazine was assigned to it, though the book carries no such number. Edited by T.E.D. Klein. Fiction:
  "Playing the Game" by Gardner Dozois and Jack Dann; "The Rose Wall" by Joyce Carol Oates; "The Jaunt" by Stephen
  King; "Remembering Melody" by George R. R. Martin; "The Dump" by Joe R. Lansdale; "My Most Memorable Christmas"
  by Rod Serling; "Night of the Meek" by Rod Serling; "Sea Change" by George Clayton Johnson; "Carousel" by Thomas
  M. Disch; "Grail" by Harlan Ellison; "Groucho" by Ron Goulart; "The Father of the Bride" by Connie Willis; "The
  River Styx Runs Upstream" by Dan Simmons; "I''ll Be Seeing You" by W. G. Norris; "The Doll" by Richard Matheson;
  "The Swamp" by Robert Sheckley; "Again" by Ramsey Campbell; "Not Our Brother" by Robert Silverberg. Also: A Note
  from the Publisher (Carol Serling); Refresher Course (T.E.D. Klein); Rod Serling: First Citizen of the Twilight
  Zone (Marc Scott Zicree and Carol Serling); The Gargoyles of Gotham (Don Hamerman and Stephen DiLauro); The Story
  Behind Richard Matheson''s The Doll (Marc Scott Zicree); Rod Serling: The Facts of Life (interview, Rod Serling
  and Linda Brevelle).'

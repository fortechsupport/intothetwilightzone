description: 'Winter 1985 issue, Alan Rodgers''s first as editor and the first of seven consecutive J.K. Potter
  covers; the last issue to carry reprints from the parent magazine. Numbered Vol. 1, No. 4. Fiction: "Bargain Cinema"
  by Jay Sheckley; "A Thousand Paces Along the Via Dolorosa" by Robert Silverberg; "My Old Man" by George Alec Effinger;
  "The Dog That Ate the Baby" by Peter A. Bobley; "Heimlich''s Curse" by Evan Eisenberg; "Bunny Didn''t Tell Us"
  by David J. Schow; "The Long Ride" by John Skipp; "Occupational Hazard" by G.L. Raisor; "Monarch of the Glen"
  by Jon Wynne-Tyson; "Arcade" by Thomas Wylde; "Adam and Eve and Pinch Me" by A.E. Coppard; "An Exciting New Technology
  Comes to Pickerington, Ohio" by Linda Haught; "Midtown Bodies" by John Robert Bensink; "Going Native" by Andrew
  Weiner; "Scrap When Empty" by A.R. Morlan; "Bright Segment" by Theodore Sturgeon. Also: Introduction (Alan Rodgers);
  Profile: A. E. Coppard (Thomas E. Sanders/Nippawanock); An Appreciation: Theodore Sturgeon (Samuel R. Delany);
  Poem: A Haunted House (Susan Sheppard).'

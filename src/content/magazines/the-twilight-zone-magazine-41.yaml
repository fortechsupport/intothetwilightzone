description: 'April 1986 issue, edited by Michael Blaine. Fiction: "The Planting Room" by K. E. Morrison; "Roadside
  Attractions" by Emily Newland; "Peace of Mind" by Wayne Johnson; "The Price of a Toy" by Charles L. Grant; "The
  Scandal on Via Sesostri" by Dino Buzzati; "Celebrity" by Robley Wilson; "Ruth''s Pool" by Jon Cohen; "The Driving
  of the Year Nail" by Steven Popkes; "The Good Always Comes Back" by Richard Christian Matheson; "The Coffin Merchant"
  by Richard Middleton. Features: Breaking In: interviews with Peter Straub, Ramsey Campbell, John Skipp & Craig
  Spector, Alan Williams and Shawna McCarthy, by Jack Sullivan and TZ staff; Movie Preview: Poltergeist II, by James
  Verniere; The Tube Fantastic; TZ Profile: Richard Middleton, by Darrell Schweitzer; Show-by-Show Guide to ''Way
  Out'', by Gary Joseph and Martin H. Friedenthal; Show-by-Show Guide to ''Night Gallery'', Part 7, by Kathryn M.
  Drennan and J. Michael Straczynski. Teleplay: "Showdown with Rance McGrew" by Rod Serling (Showdown with Rance
  McGrew (original series, Season 3, 1962)). Regular columns: In the Twilight Zone (Michael Blaine); A Note from
  the Publisher (Carol Serling); Books (Doc Kennedy); Illuminations (Peter Rondinone); TZ Tech (Robert Edelstein);
  Screen; TZ Video (Welch Everman / Gahan Wilson). Vol. 6 No. 1. OCR rendered the teleplay as ''Ranee McGrew''.'

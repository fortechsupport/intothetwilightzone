description: July 1981 issue with a two-part profile of director Richard Donner and fiction by Robert
  Silverberg, Joe R. Lansdale ('The Dump'), Charles L. Grant, Stanley Schmidt, Ron Goulart and Robert
  Sheckley. Marc Scott Zicree's episode guide reached the second season (part four), and the reprinted
  teleplay was Rod Serling's 'The Eye of the Beholder'.

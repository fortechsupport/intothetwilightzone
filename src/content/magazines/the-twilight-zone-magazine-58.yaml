description: 'February 1989 issue, edited by Tappan King. Fiction: "At the Summit" by Frederik Pohl; "Unknown Things"
  by Reginald Bretnor; "You''d Better Watch Out" by J.N. Williamson; "Stocking Stuffers (TZ First)" by Alan Spero;
  "Telescope, Saxophone and the Pilot''s Death" by Richard Paul Russo. Features: Return of the Zone, chapter 3,
  by J. Michael Straczynski; TZ Interview: Peter Straub, by Douglas E. Winter; Special Feature: Rod Serling''s Night
  Gallery by Kathryn M. Drennan and J. Michael Straczynski; Truly Weird Gifts, compiled by Jillian Smith. Teleplay:
  "The Lateness of the Hour" by Rod Serling (The Lateness of the Hour (original series, Season 2, 1960)). Regular
  columns: Books (Edward Bryant); Screen (Gahan Wilson); Christmas Quiz (Jennifer Steinhauer). Vol. 8 No. 6 (holiday-themed).'

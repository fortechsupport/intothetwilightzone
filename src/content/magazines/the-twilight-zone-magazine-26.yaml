title: 'The Twilight Zone Magazine, #26'
magazine: The Twilight Zone Magazine
cover_date: Sep-Oct 1983
order: 26
publisher: TZ Publications, Inc.
editor: T.E.D. Klein
description: 'September-October 1983 special issue on Twilight Zone: The Movie, the first with a film still on the
  cover (''Nightmare at 20,000 Feet''), featuring Paul M. Sammon''s set report and interviews with John Landis,
  Joe Dante, Richard Matheson, John Lithgow, Scatman Crothers, Kevin McCarthy and Rob Bottin. Zicree''s show-by-show
  guide concluded with part twenty-six, and George Clayton Johnson''s teleplay ''Kick the Can'' was reprinted with
  his afterword. The catalogue notes "Cover photos courtesy Warner Bros".'

description: 'August 1988 issue, edited by Tappan King. Fiction: "Dinner with an Angel" by Andrew M. Greeley; "Sliding"
  by Barbara Owens; "Over the Fence" by John Maclay; "The Promise of Warmth" by Michael Blumlein; "Meeting Mr. Subian"
  by Roger Parson; "Omniscient Mitch" by Kevin Cook; "In the Belly of the Death Mother" by Craig Kee Strete; "All
  in a Day''s Work (TZ First)" by Michael Galloglach. Features: TZ Interview: Wade Davis, by Stanley Wiater; TZ
  Preview: Willow, by James Verniere. Regular columns: Editorial (Tappan King); Books (Edward Bryant); Screen (Gahan
  Wilson); Hollywood Grapevine (Craig Miller); The Goulart Archipelago (Ron Goulart); People (James H. Burns). Vol.
  8 No. 3. No teleplay listed.'

description: May-June 1984 issue whose Carl Wesley cover shows William Shatner and the gremlin from 'Nightmare
  at 20,000 Feet'; it reprinted Richard Matheson's teleplay for that episode with his essay 'Matheson
  Looks at His Nightmare'. Also an interview with John Sayles, part three of the Outer Limits guide, and
  stories by John Sladek and E.F. Benson.

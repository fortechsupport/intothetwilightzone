title: 'The Twilight Zone Magazine, #44'
magazine: The Twilight Zone Magazine
cover_date: Oct 1986
order: 44
publisher: TZ Publications, Inc.
editor: Michael Blaine (editor-in-chief on masthead)
description: 'October 1986 issue, edited by Michael Blaine (editor-in-chief on masthead). Fiction: "Yellowjacket
  Summer" by Robert R. McCammon; "Juleeeeeeeeeeen!" by Jay and Robert Sheckley; "Bakarak" by Luigi Malerba; "Yard
  Sale" by Jon Cohen; "Brahms'' Wallaby" by E. W. Smith; "Child of the Century" by Elizabeth Graham Monk; "Summer
  Will Rise" by John Herrmann; "Piggies" by Anita Kranitz Schlank. Features: Interview: Robert R. McCammon, by Joe
  R. Lansdale; Movie Preview: The Fly, by James Verniere; Breaking In: T. E. D. Klein, by Jack Sullivan; The Tube
  Fantastic, by Tyson Blue. Teleplay: "He''s Alive (Part II)" by Rod Serling (He''s Alive (original series, Season
  4, 1963)). Regular columns: Books (E. F. Bleiler); Book Notes (Jonathan White); Dataline and Illuminations (Peter
  Rondinone); TZ Tech (Stefan Dziemianowicz and Robert Edelstein); Screen (Welch Everman); Gahan Wilson; TZ Video;
  In the Twilight Zone; Letters. Vol. 6 No. 4. Teleplay serialized; Part I presumably in Aug 1986 (#43). Some department
  bylines uncertain due to garbled OCR.'

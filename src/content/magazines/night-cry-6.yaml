description: 'Summer 1986 issue edited by Alan Rodgers. Fiction: "The Halloween Man" by William F. Nolan; "Red"
  by Richard Christian Matheson; "The Sleep of Your Life" by Thomas E. Sanders (Nippawanock); "Yellowing Bowers"
  by Paul Di Filippo; "The Back Forty" by Charles Wagner; "The Judge''s House" by Bram Stoker; "Bad Medicine" by
  John Skerchock; "Deadtime Story" by Dennis Etchison; "Faced with Blue Eyes, Again" by Warren Ellifritz; "STUD"
  by Ray Russell; "Brass (Part II of II)" by David J. Schow; "What Happened to Harper" by Jay Sheckley; "A Table
  for One" by Richard Wilson; "Seven Graves for Sinbad" by Vann Anson Lister; "Garbage Day in Ewerton" by A. R.
  Morlan; "The Funny Trick They Played on Old McBundy''s Son" by George Alec Effinger and Jack C. Haldeman II. Also:
  Introduction (Alan Rodgers); Three Poems: Revisiting Hollywood (Robert Frazier); The Accident (Rochelle Lynn Holt;
  probably poetry).'

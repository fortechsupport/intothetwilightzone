description: 'June 1987 issue, edited by Tappan King. Fiction: "Down, Satan!" by Clive Barker; "The Exercise of
  Faith" by Lucius Shepard; "Wolf/Child" by Jane Yolen; "Dead Man on the Beach" by Richard Paul Russo; "Halley''s
  Passing" by Michael McDowell; "The Boys in the Rain" by Pat Cadigan; "Ants" by Chet Williamson; "Jesus on Honshu"
  by John Updike; "Grass Shark" by Paul Walton. Features: Talking Terror with Clive Barker, interview by Douglas
  E. Winter; Preview: The Witches of Eastwick, by James Verniere; The Witch of Salem: conversation with Laurie Cabot,
  by James Verniere. Regular columns: Books (Edward Bryant); Screen (Gahan Wilson); Music (Christopher Karwowski);
  Television (Robin Bromley); Video (Welch D. Everman); Hollywood Grapevine (anonymous); In the Twilight Zone; Illuminations;
  The Other Side. Vol. 7 No. 2. No teleplay listed.'

title: 'The Twilight Zone Magazine, #2'
magazine: The Twilight Zone Magazine
cover_date: May 1981
order: 2
publisher: TZ Publications, Inc.
editor: T.E.D. Klein
description: May 1981 issue with an interview with Peter Straub and fiction by Roger Zelazny, Robert Silverberg,
  Tanith Lee, Joe Haldeman, Spider Robinson, Lewis Shiner and George Clayton Johnson. It carried part
  two of Marc Scott Zicree's episode guide and reprinted Rod Serling's teleplay 'The Monsters Are Due
  on Maple Street'; the cover used Magritte's painting 'The Pleasure Principle'.

description: Issue 36 of Rod Serling's The Twilight Zone Magazine (May-Jun 1985), the horror and fantasy fiction
  magazine published by TZ Publications from 1981 to 1989 under license from Carol Serling. Each issue mixed new
  short fiction with interviews, film and book coverage and Twilight Zone history; this issue's contents are on
  the linked ISFDB page. The catalogue notes that the cover illustrates "Jungle Eyes".

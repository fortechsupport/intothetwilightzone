description: 'Spring 1987 issue; two of its poems, Bruce Boston''s ''The Nightmare Collector'' and Lucius Shepard''s
  ''White Trains'', won Rhysling Awards. Edited by Alan Rodgers. Fiction: "Blood" by William Relling Jr.; "This
  Old Man" by Charles L. Grant; "ResurrecTech" by S. P. Somtow; "Identity Crisis" by G.L. Raisor; "Amateurs" by
  Leslie Fish; "Scylla and Charybdis" by John Gawsworth; "The Mirror Monster" by Stephen Meade; "Cat at Play" by
  Augustine Funnell; "Spectator Playoffs" by Jay and Robert Sheckley; "The Night Seasons (Part II)" by J. N. Williamson;
  "Witch Mother" by Christopher Gilbert; "Lethe Dreams" by Bentley Little; "Pennies from Hell" by Darrell Schweitzer.
  Also: Introduction: Down-Home Horror (Alan Rodgers); Profile: John Gawsworth (Steve Eng); Poems: What the Janitor
  Found (A.R. Morlan); Four Poems (John Gawsworth); Night Rides (Bruce Boston); White Trains (Lucius Shepard); Books
  column (Al Sarrantonio); Film column (Samuel R. Delany).'

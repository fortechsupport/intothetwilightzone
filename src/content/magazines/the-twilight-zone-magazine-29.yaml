title: 'The Twilight Zone Magazine, #29'
magazine: The Twilight Zone Magazine
cover_date: Mar-Apr 1984
order: 29
publisher: TZ Publications, Inc.
editor: T.E.D. Klein
description: Third-anniversary issue (March-April 1984) with James H. Burns's interview with Twilight Zone star
  Burgess Meredith, a feature tracking down the original series' alumni, a Dreamscape preview and cover, part two
  of David J. Schow's Outer Limits guide, and a Richard Matheson story. It reprinted Serling's teleplay 'Mr. Dingle,
  the Strong'. The issue's contents page reads "Cover photo of David Patrick Kelly from Dreamscape courtesy Zuprik-Curtis
  Enterprises, Inc."; the photographer is not named.

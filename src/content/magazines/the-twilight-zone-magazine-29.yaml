description: Third-anniversary issue (March-April 1984) with James H. Burns's interview with Twilight
  Zone star Burgess Meredith, a feature tracking down the original series' alumni, a Dreamscape preview
  and cover, part two of David J. Schow's Outer Limits guide, and a Richard Matheson story. It reprinted
  Serling's teleplay 'Mr. Dingle, the Strong'.

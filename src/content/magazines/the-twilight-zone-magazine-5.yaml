description: August 1981 issue with George Clayton Johnson's memoir 'Writing for The Twilight Zone', an
  interview with George A. Romero, and a werewolf-film feature talking to John Landis, Joe Dante and Michael
  Wadleigh. Fiction came from David Morrell, Lisa Tuttle and James Patrick Kelly; it ran part five of
  Zicree's episode guide and Serling's teleplay 'The Odyssey of Flight 33'.

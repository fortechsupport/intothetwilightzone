description: August 1982 issue with Ben Herndon's interview with Twilight Zone director and writer Douglas
  Heyes, Edgar Allan Poe's unfinished 'The Lighthouse' as completed by Robert Bloch, and Ed Naha on 'Tron',
  'E.T.' and 'Poltergeist'. Zicree's guide (part seventeen) reached the final season, and the reprinted
  teleplay was Serling's 'The Trade-Ins'.

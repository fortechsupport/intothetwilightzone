description: 'April 1988 issue, edited by Tappan King. Fiction: "The Woman in the Wall" by Graham Masterton; "Night
  Moves" by Tim Powers; "Two Views of a Cave Painting" by James P. Blaylock; "Claws That Catch" by Warren Norwood;
  "The Cleaning Lady" by Susan Casper; "The Witch of the New Moon" by Cezarija Abartis; "Things That He Cannot Name
  Are Lost" by Robert Frazier; "Grasping the Bird''s Tail (TZ First)" by Gay Partington Terry; "Third World (poem)"
  by Chris King; "Terminal (TZ First)" by Annie Gerard. Features: Beyond Communion: interview with Whitley Strieber
  by Stanley Wiater; Ronald Reagan vs. ''The Zero Factor'' by Deborah Quilter; The Twilight Zone Review: 1987; Twilight
  Zone Gallery: H.R. Giger. Regular columns: Books (Edward Bryant); Screen (Gahan Wilson); Comics (Alan Rodgers);
  In the Twilight Zone; A Personal Message; Illuminations; The Other Side. Vol. 8 No. 1. No teleplay listed in contents.'

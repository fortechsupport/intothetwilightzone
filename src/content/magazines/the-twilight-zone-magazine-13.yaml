title: 'The Twilight Zone Magazine, #13'
magazine: The Twilight Zone Magazine
cover_date: Apr 1982
order: 13
publisher: TZ Publications, Inc.
editor: T.E.D. Klein
cover_artist: Kevin Larson
description: First-anniversary issue (April 1982) with Linda Brevelle's interview with Rod Serling and
  a photo feature on a Twilight Zone reunion. Fiction included Harlan Ellison's Locus Award-winning 'Djinn,
  No Chaser', Dan Simmons's first published story 'The River Styx Runs Upstream' (co-winner of the magazine's
  story contest), Ramsey Campbell and Joan Aiken, plus a William Hope Hodgson reprint; part thirteen of
  Zicree's guide ran, but no teleplay.

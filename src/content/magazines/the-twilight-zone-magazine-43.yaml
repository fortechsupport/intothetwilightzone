description: 'August 1986 issue, edited by Michael Blaine. Fiction: "Watchdogs" by Robert Silverberg; "Post Time"
  by Bruce Jay Friedman; "Angel''s Eyes" by Garry Kilworth; "Portrait: Edward Larabee" by Barbara Owens; "Milk"
  by Donald R. Burleson; "I''ll Drown My Book" by Chet Williamson; "This Year, Next Year" by Andrew Weiner; "Epiphany"
  by John Shea; "In the Gray Place" by Roger Parson. Features: Interview: Whitley Strieber, by Stanley Wiater; Movie
  Preview: Aliens and Solar Babies, by James Verniere; Breaking In: Chet Williamson (Robin Bromley); Rod Serling''s
  Most Controversial Teleplay, by Hal Erickson (on ''He''s Alive''); Weird Weekend, by Gahan Wilson. Teleplay: "He''s
  Alive (Part I)" by Rod Serling (He''s Alive (original series, Season 4, 1963)). Regular columns: In the Twilight
  Zone; Letters; Books (E. F. Bleiler); Book Notes (Jonathan White); TZ Tech (Robert Edelstein and Stefan Dziemianowicz);
  Illuminations (Peter Rondinone); Screen (Gahan Wilson); TZ Video (Welch D. Everman). Vol. 6 No. 3. Teleplay concluded
  in Oct 1986 (#44).'

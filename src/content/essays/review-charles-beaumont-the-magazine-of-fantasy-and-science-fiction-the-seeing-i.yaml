description: 'Beaumont, who also wrote episodes of the series, praised "Where Is Everybody?" in the magazine''s
  media column. He granted that its ideas were familiar but said the quality of the writing made it feel fresh,
  and noted one compromise he thought had been made to sell the series. The issue is inferred: the December 1959
  number carries his column "Entertainment: The Seeing I" on page 93, but the column text itself was not checked.'

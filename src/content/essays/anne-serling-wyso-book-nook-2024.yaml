description: >-
  A 50-minute radio interview by Vick Mickunas with Anne Serling about "First Squad, First Platoon", a newly found
  Rod Serling story that had just appeared in The Strand Magazine in his centenary year, and about his war service
  in the Pacific, his studies at Antioch College under the GI Bill, his early radio work in Yellow Springs and his
  writing at WLW in Cincinnati.

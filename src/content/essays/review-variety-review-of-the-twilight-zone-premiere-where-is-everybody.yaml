description: Weekly Variety's "Television Reviews" page covered the premiere, with Earl Holliman, in a batch of
  new fall shows that included Men Into Space and Dobie Gillis. The reviewer objected to the ending, finding the
  explanation too neat and logical, and thought a true science-fiction payoff would have suited the premise better.
  The OCR of this page is badly jumbled, so this summary is approximate and the reviewer's signature was not read.
  It may differ from the more glowing Daily Variety review.

description: 'Review of the September 30, 1960 season 2 opener, written by Serling and starring Bob Cummings. The
  reviewer said the series had a weak vehicle to start its second season: the moody, suspenseful opening was "a
  letdown" by the end, Cummings was the episode''s only dramatic force, and Serling seemed to have run short of
  ideas. Supporting players Gene Lyons, Paul Lambert and Jena McMahon are named.'

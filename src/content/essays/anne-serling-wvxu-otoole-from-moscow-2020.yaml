description: >-
  John Kiesewetter talks with Anne Serling, the narrator of WVXU's radio version of her father's 1955 Matinee
  Theater comedy O'Toole from Moscow (performed by University of Cincinnati College-Conservatory of Music
  students, directed by Richard Hess), about the play, which aired once live and was not recorded, and her
  father's love of baseball. A five-minute audio piece.

- Rod Serling
published_in: Science Fiction in Literature (Centron film series, unreleased)
published: '1970'
kind: interview
description: >-
  University of Kansas professor James Gunn filmed interviews with science-fiction writers in 1970 for his Centron
  film series "Science Fiction in Literature". The Serling film was never finished because the rights to show
  footage from his television work could not be obtained. The surviving footage, reconstructed from separate
  workprint picture and sound, covers writing for television and opens with what the uploader calls a prophetic
  remark about his health.

title: 'The Interviews: The Twilight Zone (Television Academy Foundation oral histories)'
published_in: Television Academy Foundation
kind: interview
description: The Television Academy Foundation's long-form video oral histories include 44 people who talk about
  working on The Twilight Zone. Listed here are the writers (Matheson, Johnson, Hamner, Ellison, Straczynski), producers
  (Froug, Reisman), composers (Goldsmith, Steiner), directors (Donner, Lamont Johnson, Butler, Sargent, Senensky)
  and actors (Mumy, Shatner, Klugman, Robertson, Russell Johnson, Stuart, Malone, Takei) whose interviews cover
  the show; each is streamed free on the Foundation's site.
research_confidence: high

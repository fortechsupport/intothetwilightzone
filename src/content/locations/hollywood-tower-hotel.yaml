notes: 'The fictional Hollywood hotel at the heart of Disney''s Twilight Zone Tower of Terror rides: on Halloween
  night 1939, lightning struck it and five guests vanished from an elevator. Riders enter through a library where
  Rod Serling, in re-edited footage, introduces the story. The 1997 TV film uses the same backstory.'

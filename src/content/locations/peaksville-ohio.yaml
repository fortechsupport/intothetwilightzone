notes: A farming town Anthony Fremont has cut off from the rest of the world, perhaps destroyed the rest of it,
  and keeps in terror; residents must "think happy thoughts" or be wished into the cornfield. The story comes from
  Jerome Bixby's 1953 short story; Serling's narration names the town and its location. Bill Mumy returned as the
  adult Anthony when the 2002 revival went back to Peaksville.

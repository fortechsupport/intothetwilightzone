name: The Twilight Zone Tower of Terror (Disney's Hollywood Studios)
kind: attraction
address: Sunset Boulevard, Disney's Hollywood Studios, Walt Disney World
city: Bay Lake
region: Florida
country: US
lat: 28.36006
lng: -81.55983
status: open
opened: '1994-07-22'
notes: >-
  The original Tower of Terror opened on July 22, 1994, a 199-foot drop-shaft ride set in the fictional
  Hollywood Tower Hotel, abandoned after lightning struck on Halloween night 1939. A pre-show built from
  footage of Rod Serling hosting the original series sends guests into "another dimension." The building
  is full of props referencing episodes, from the Mystic Seer of "Nick of Time" to the "To Serve Man"
  book and Talky Tina. It is still operating.


  Twilight Zone connections: Nick of Time; To Serve Man; Little Girl Lost; It's a Good Life; Living Doll;
  A Stop at Willoughby; and others: Episode props and references hidden throughout the queue and library.
  Archival Serling footage used for the pre-show narration.

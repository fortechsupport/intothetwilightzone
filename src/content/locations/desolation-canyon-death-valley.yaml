notes: A narrow side canyon south of Furnace Creek in Death Valley National Park. Frame-matching location research
  places scenes of "The Lonely" and "I Shot an Arrow into the Air" here, and identifies it as the backdrop photographed
  for the landed rocket in "The Little People," which was otherwise shot at MGM.

notes: >-
  The boulder-strewn hills below Mount Whitney, used in hundreds of Westerns, are credited by the Lone
  Pine Film Festival's history as a location for "A Hundred Yards Over the Rim." They supplied the 1847
  frontier that Cliff Robertson's wagon-train leader crosses before he stumbles into the twentieth century.

notes: >-
  A 1925 Allan Herschell Company carousel in its original pavilion, one of six carousels industrialist
  George F. Johnson gave to the Binghamton area; rides are still free. Rod Serling grew up a few blocks
  away, and the carousel, bandstand and park are widely cited as the model for the hometown park in "Walking
  Distance." It was added to the National Register of Historic Places in 1992, and its rounding-board
  panels now carry paintings of famous Twilight Zone scenes.


  Twilight Zone connections: Walking Distance: Inspiration for the park and carousel Martin Sloan returns
  to in Homewood. Childhood park near the Serling family home on Bennett Avenue.

notes: >-
  The production went to Death Valley in the second week of June 1959 for "The Lonely," choosing it as
  the lowest, driest, hottest spot in the country to stand in for an asteroid prison; the heat nearly
  overwhelmed cast and crew. The park service lists "I Shot an Arrow into the Air" as another Twilight
  Zone episode filmed there, its barren terrain standing in for the place where crash-landed astronauts
  believe they are stranded on an alien world. Specific spots within the park are not documented in the
  sources found.

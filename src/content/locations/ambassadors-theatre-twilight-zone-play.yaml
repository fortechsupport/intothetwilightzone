name: Ambassadors Theatre
address: West Street, London WC2
city: London
region: England
country: GB
status: open
opened: '2019-03-04'
notes: >-
  Anne Washburn's Twilight Zone play transferred from the Almeida to this small West End house in the
  spring of 2019, with first performances in early March. It brought the series' stories to a commercial
  West End stage for the first time.


  Twilight Zone connections: The Twilight Zone (stage play, 2019 West End run): West End transfer of the
  Almeida production.

name: Serling Family Years in Westport, Connecticut
kind: serling-place
city: Westport
region: Connecticut
country: US
status: unknown
notes: >-
  After leaving Ohio in 1953, the Serlings lived in Connecticut, settling in Westport, the commuter town
  where Serling wrote much of his live-television drama, including the work that made his name. They left
  Westport for Pacific Palisades in 1958, shortly before The Twilight Zone began.


  Twilight Zone connections: Home during the live-TV years, 1950s.

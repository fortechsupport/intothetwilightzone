status: extant
opened: '2018'
notes: >-
  Jordan Peele and Simon Kinberg's revival for CBS All Access began production in Vancouver in autumn
  2018 (principal photography ran from October 1, 2018, to March 20, 2019), and returned for a second season,
  filmed from October 6, 2019, to March 16, 2020. Episodes were shot on stages and streets across
  the Lower Mainland, which doubled for American towns, airports and suburbs.


  Twilight Zone connections: Main production base for both seasons.

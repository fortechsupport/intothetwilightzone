filmed:
- ref: 2019/downtime
  note: Inner Harbour street scenes, November 2019.
notes: >-
  Over three days in November 2019 the second season filmed in front of the Fairmont Empress and along
  the 700 block of Government Street and the 500 and 600 blocks of Belleville Street, with further work
  on Humboldt and Gordon streets. Hundreds of extras stood motionless beside abandoned vintage cars in
  the Inner Harbour. Hollywood North Buzz lists Victoria as the location for "Downtime," the season's
  only episode credited to the city.

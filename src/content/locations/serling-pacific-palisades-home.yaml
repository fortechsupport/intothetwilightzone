name: Serling Family Home, Pacific Palisades
kind: serling-place
address: Monaco Drive, Riviera area, Pacific Palisades
city: Los Angeles (Pacific Palisades)
region: California
country: US
status: unknown
opened: '1959'
notes: >-
  After leaving Westport, Connecticut, the Serlings rented on Amalfi Drive in 1958, then moved in 1959
  to a house on Monaco Drive in the Palisades' Riviera neighborhood. It was the family home while The
  Twilight Zone was made and aired. It is a private residence.


  Twilight Zone connections: Family home during the original series' production.

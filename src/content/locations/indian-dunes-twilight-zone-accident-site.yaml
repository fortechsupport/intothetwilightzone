notes: >-
  Indian Dunes was a roughly 600-acre movie ranch beside the Santa Clara River in Valencia, inside Hollywood's
  30-mile studio zone, often used to stand in for Vietnam and other far-off places. In the early hours
  of July 23, 1982, while John Landis was filming the Vietnam village sequence of the "Time Out" segment,
  a helicopter brought down by special-effects explosions crashed onto actor Vic Morrow and child actors
  Myca Dinh Le, 7, and Renee Shin-Yi Chen, 6, killing all three. The disaster led to a long criminal trial,
  which ended in acquittals in 1987, and to lasting changes in film-set safety rules and child-labor enforcement.

notes: Never shown in full, the cornfield outside Peaksville is where Anthony "wishes" people, animals and things
  he dislikes; no one comes back. "Wished into the cornfield" is a widely quoted phrase and was echoed by The Simpsons'
  first Treehouse of Horror parody.

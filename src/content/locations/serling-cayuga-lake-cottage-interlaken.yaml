notes: >-
  The Serlings' lakeside summer home belonged to Carol Serling's grandmother; the couple honeymooned there
  and returned every year. In Serling's final years he lived there while commuting to teach at Ithaca
  College. Its exact location is not publicly documented and it should be treated as private.


  Twilight Zone connections: Summer retreat and later base while teaching at Ithaca College.

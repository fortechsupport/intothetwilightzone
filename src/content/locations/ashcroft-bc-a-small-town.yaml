filmed:
- ref: 2019/a-small-town
  note: Main street, replica church and storefronts.
notes: >-
  The Thompson River village of Ashcroft became the town in "A Small Town" in January and February 2020,
  with 4th Street serving as the main street. The crew built a replica of the Zion United Church opposite
  the Ashcroft-Cache Creek Journal office, repainted the real church's interior and the Central Café front,
  and used a warehouse near Cache Creek as a workshop.

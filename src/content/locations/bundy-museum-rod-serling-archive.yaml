name: Rod Serling Archive, Bundy Museum of History and Art
kind: museum-exhibit
address: Main Street, Binghamton, NY
city: Binghamton
region: New York
country: US
status: open
opened: '2015'
notes: >-
  The Bundy Museum opened a permanent Rod Serling exhibit in spring 2015 in his hometown. It shows props
  and personal items such as the helmet Leonard Nimoy wore in "A Quality of Mercy," a mask from "Eye of
  the Beholder," a Talky Tina replica, yearbooks Serling worked on, his notes, and material from Night
  Gallery and The Loner. Board games, radio scripts, viewing stations and a quiz are part of the hands-on exhibit, known as "In the
  Zone". A Serling mural was painted outside the archive in 2021.


  Twilight Zone connections: A Quality of Mercy: Helmet worn by Leonard Nimoy on display. Eye of the Beholder:
  Mask on display. Hometown exhibit of memorabilia.

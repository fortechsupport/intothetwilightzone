name: Rod Serling Archives, Ithaca College Library
kind: archive
city: Ithaca
region: New York
country: US
status: open
notes: >-
  Serling taught at Ithaca College from 1967 until his death in 1975, and the college now keeps a major
  Serling collection in its library's Archives and Special Collections, transferred there from the Park
  School of Communications in 1997. Holdings include television and film scripts, stage plays, unproduced
  scripts, published works, films and awards, including Emmys. Access to unpublished material requires
  special permission.


  Twilight Zone connections: Teaching post 1967-1975; archive of scripts and memorabilia. Episode scripts
  with handwritten revisions.

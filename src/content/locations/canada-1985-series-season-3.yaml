notes: >-
  For its third and final season, made for first-run syndication in 1988-89, the 1980s revival moved to
  Canada, with production by London Films, CBS Broadcast International and Canada's Atlantis Films. Robin
  Ward replaced Charles Aidman as narrator of these Canadian-produced half-hours. The specific studios
  and towns used are not documented in the sources found.


  Twilight Zone connections: Season 3 (syndicated, 1988-89).

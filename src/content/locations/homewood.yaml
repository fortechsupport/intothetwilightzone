notes: 'The small hometown that a burned-out 36-year-old executive reaches on foot from a gas station and finds
  unchanged from his boyhood: the drugstore, the bandstand concert and the carousel in the park. Serling said the
  episode was partly autobiographical, and fans link Homewood''s park and carousel to Recreation Park in Binghamton,
  New York.'

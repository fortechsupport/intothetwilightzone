- 1959/a-stop-at-willoughby
notes: A peaceful, sunlit village of July 1888, with a bandstand, fishing boys and an unhurried pace, that an overworked
  New York advertising man glimpses each night when his train stops at a station that should not exist. The final
  shot reveals "Willoughby & Son" as the name of the funeral home that collects his body, turning the dream town
  into a metaphor for escape through death. "Willoughby" became fan shorthand for longing for a simpler past.

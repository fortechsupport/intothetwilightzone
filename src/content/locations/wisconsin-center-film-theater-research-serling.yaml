name: Rod Serling Papers, Wisconsin Center for Film and Theater Research
kind: archive
city: Madison
region: Wisconsin
country: US
status: open
notes: >-
  The WCFTR at the University of Wisconsin-Madison holds Serling papers including printed script drafts
  and 1,152 Dictabelt recordings on which he dictated scripts early in his television career. A Council
  on Library and Information Resources grant funded digitizing the belts so researchers can hear Serling
  composing his teleplays aloud.


  Twilight Zone connections: Script drafts and dictated recordings.
sources:

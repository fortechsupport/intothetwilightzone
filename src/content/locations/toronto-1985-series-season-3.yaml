notes: >-
  A Cinema Canada production listing from 1988 reported that the new syndicated Twilight Zone episodes
  were shooting on location in Toronto, from Atlantis Films working with London Films and CBS Broadcast
  International. This gives a city for the Canadian third season, though the listing does not name particular
  studios or streets.

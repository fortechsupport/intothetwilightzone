notes: >-
  From its second episode onward, most of the original series was filmed on soundstages at MGM's main
  lot in Culver City, with interiors shot there even when exteriors went on location. Crews returned from
  Death Valley to MGM to finish "The Lonely," and the Gurney house interiors of "Person or Persons Unknown"
  were on a Lot 1 stage. The main lot survives today as Sony Pictures Studios.

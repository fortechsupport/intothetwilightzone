notes: >-
  MGM's Lot 2 had a leafy small-town street of clapboard houses and a church, known as New England Street.
  The original series used it heavily: it is the empty town in "Stopover in a Quiet Town," the Gurney
  neighborhood in "Person or Persons Unknown," and the setting of "The Shelter" and "Ninety Years Without
  Slumbering." Like the rest of MGM's backlots, Lot 2 was later sold off and its sets demolished.

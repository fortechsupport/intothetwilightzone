notes: An ordinary late-summer suburban street whose residents, after a mysterious blackout and a rumour of invaders,
  accuse and finally attack one another; aliens watching from a hill note that people are their own best weapon.
  Serling's closing narration makes Maple Street a stand-in for any community that gives in to fear. The episode
  is widely taught in American schools.

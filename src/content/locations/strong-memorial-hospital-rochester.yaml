notes: >-
  Serling died at this University of Rochester hospital on June 28, 1975, two days after open-heart surgery,
  at the age of 50. He had been taken ill with a heart attack in May and first treated at Tompkins County
  Community Hospital near Ithaca.


  Twilight Zone connections: Place of death.

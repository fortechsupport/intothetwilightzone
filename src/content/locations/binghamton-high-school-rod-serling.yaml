notes: >-
  Serling graduated from what was then Binghamton Central High School in 1943, and a marker on the front
  lawn notes his class year. The school's arts program is now the Rod Serling School of Fine Arts, and
  its Helen Foley Theatre honors the teacher who encouraged him (and whose name he gave to a character
  in "Nightmare as a Child"). The theatre has hosted SerlingFest sessions, and the school is home base
  for the student Rod Serling Film Festival.


  Twilight Zone connections: High school alma mater, class of 1943. Nightmare as a Child: Lead character
  Helen Foley is named for Serling's teacher.

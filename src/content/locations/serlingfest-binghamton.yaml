name: SerlingFest
city: Binghamton
region: New York
country: US
status: open
opened: '2017'
notes: >-
  An annual festival run by the Rod Serling Memorial Foundation (itself founded in 1985 by his former
  teacher Helen Foley) since 2017. It brings scholars, authors, podcasters and Twilight Zone actors to
  venues around Binghamton such as the Broome County Forum Theatre and Binghamton High School's Helen
  Foley Theatre, with panels, readings of unproduced scripts and memorabilia displays. The 2024 edition
  included the dedication of the Serling statue.


  Twilight Zone connections: Annual hometown celebration. 2019 edition marked the series' 60th anniversary.

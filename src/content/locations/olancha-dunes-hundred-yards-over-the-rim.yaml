notes: >-
  "A Hundred Yards Over the Rim" (1961), in which Cliff Robertson's 1847 pioneer walks over a ridge into
  1961 New Mexico, was shot around the hamlet of Olancha on U.S. Highway 395 in the Owens Valley, with
  the nearby Olancha Sand Dunes as the desert he crosses. Fan research has also tied the episode's roadside
  diner to a real 395 cafe.

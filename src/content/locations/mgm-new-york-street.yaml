filmed:
- ref: 1959/person-or-persons-unknown
  note: Asylum window escape built in the New York Street alley.
notes: >-
  MGM's big-city backlot street stood in for urban America in countless films and episodes. In "Person
  or Persons Unknown" the crew built a wall-and-window flat in its alleyway for the scene in which David
  Gurney escapes from an asylum. The street did not survive the selling-off of the MGM backlots.

notes: >-
  CBS's live-TV studio complex in the Fairfax district was where six second-season episodes were shot
  on videotape, back to back, from November to mid-December 1960, as a cost-saving experiment when the
  series was running over budget. The episodes were "The Lateness of the Hour," "Static," "The Whole Truth,"
  "The Night of the Meek," "Twenty Two" and "Long Distance Call." The savings were small and the flat,
  stagey look was disliked, so the show went back to film at MGM.


  Twilight Zone connections: Twenty Two: The six videotaped episodes of season 2.

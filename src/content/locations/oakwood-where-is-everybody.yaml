notes: >-
  The empty town that Mike Ferris wanders through, finding a diner, a police station, a soda shop and a movie
  theater but nobody in them, while in fact he is in an isolation booth, in a test for "a prolonged trip to the
  Moon alone". The name Oakwood is from Wikipedia's production note, which says Universal's backlot "Courthouse
  Square" was used "as the episode's Oakwood town"; Wikipedia's plot summary does not name it.

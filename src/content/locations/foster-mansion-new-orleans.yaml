notes: On the last night of Mardi Gras, dying millionaire Jason Foster makes his greedy heirs wear grotesque masks
  until midnight as a condition of his will. When they take them off, their faces have become the masks. Directed
  by Ida Lupino, the only woman to direct an episode of the original series.

notes: >-
  Steven Spielberg's "Kick the Can" segment was shot in the small Ventura County town of Piru, a frequent
  filming stand-in for old-fashioned small-town America. Buildings at 691 Main Street and 697 Church Street
  served as rest-home locations, with the town's church at 3869 Center Street visible in the background.

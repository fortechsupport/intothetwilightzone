notes: A recovering dancer is told each night by a nurse, "Room for one more, honey," at the door of the hospital
  morgue, Room 22. She later refuses to board Flight 22 because the stewardess says the same words, and the plane
  explodes. The story is based on a well-known ghost anecdote.

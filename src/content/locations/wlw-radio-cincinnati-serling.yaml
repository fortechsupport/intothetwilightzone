name: WLW Radio and WKRC-TV, Cincinnati
kind: serling-place
city: Cincinnati
region: Ohio
country: US
status: unknown
opened: '1950'
notes: >-
  After graduating from Antioch in 1950, Serling took a job as a staff writer and copywriter at Cincinnati's
  WLW radio, and later wrote for WKRC-TV, turning out scripts for local programs. This apprenticeship
  was his bridge to the national live-drama anthologies.


  Twilight Zone connections: First professional writing job, early 1950s.

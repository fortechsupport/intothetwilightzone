notes: >-
  The Victorian residential street MGM built on Lot 3 for Meet Me in St. Louis (1944) became Martin Sloan's
  childhood street in "Walking Distance," including the Sloan house. The episode's opening gas station
  was a Lot 3 set too, the same one used in "The Hitch-Hiker." Lot 3 was sold for housing in the early
  1970s and the sets razed.

name: Camp Toccoa at Currahee
kind: serling-place
city: Toccoa
region: Georgia
country: US
status: extant
opened: '1943'
notes: >-
  Serling began his Army service in 1943 with paratrooper training at Camp Toccoa, the famed airborne
  camp below Currahee Mountain, before serving with the 511th Parachute Infantry Regiment in the Pacific.
  His combat experience in the Philippines haunted him and surfaces in war-themed episodes such as "The
  Purple Testament" and "A Quality of Mercy." The site and the nearby Currahee Military Museum preserve
  the camp's history.


  Twilight Zone connections: WWII paratrooper training, 1943. The Purple Testament: War episode drawing
  on his Pacific service.

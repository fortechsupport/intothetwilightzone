name: The Twilight Zone Tower of Terror (Disney Adventure World, Paris)
kind: attraction
address: Disney Adventure World (formerly Walt Disney Studios Park), Disneyland Paris
city: Chessy (Marne-la-Vallee)
region: Ile-de-France
country: FR
status: open
opened: '2007-12-22'
notes: >-
  Disneyland Paris opened its version on December 22, 2007, a near-twin of the California tower, with
  the Serling pre-show dubbed for European audiences. In September 2019 it was relaunched as "A New Dimension
  of Chills" with new drop sequences and story beats. The park itself was renamed Disney Adventure World
  in 2025; the ride still carries the Twilight Zone name.


  Twilight Zone connections: Little Girl Lost: Chalk markings and other episode nods appear in the queue.

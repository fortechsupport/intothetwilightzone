name: Rod Serling Film Festival
city: Binghamton
region: New York
country: US
status: open
opened: '1995'
notes: >-
  A juried student film and video festival held annually in Binghamton since 1995, open to K-12 students
  across North America and presented with public broadcaster WSKG. It was long known as the Rod Serling
  Video Festival and is tied to Binghamton High School, Serling's alma mater.


  Twilight Zone connections: Youth filmmaking festival in his name.

notes: >-
  Binghamton's minor-league ballpark, home of the Double-A Binghamton Rumble Ponies, hosts the team's
  annual "Binghamton Creatures" games, an alternate identity the club adopts in honor of hometown son
  Rod Serling and his tales of the strange. It is one of the more playful ways the city keeps his memory
  in public view.


  Twilight Zone connections: Annual Rumble Ponies theme games honoring Serling.

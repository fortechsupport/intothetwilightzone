  note: The final scene.
notes: >-
  The final scene of Planet of the Apes (1968), with Charlton Heston finding the ruined Statue of Liberty
  on a beach, was filmed at the coves below Point Dume. Rod Serling co-wrote the screenplay, and the twist
  ending is the most Twilight Zone-like moment of his film career, which makes it a common pilgrimage
  spot for Serling fans.


  Twilight Zone connections: Planet of the Apes (1968): Serling co-wrote the screenplay with Michael Wilson.

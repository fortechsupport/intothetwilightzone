notes: The eroded badlands overlook in Death Valley National Park. Location photographers who matched frames from
  the episodes identify it as a backdrop for the asteroid in "The Lonely" (1959) and the alien-looking desert of
  "I Shot an Arrow into the Air" (1960). It is one of the park's most visited viewpoints and looks much as it did
  on screen.

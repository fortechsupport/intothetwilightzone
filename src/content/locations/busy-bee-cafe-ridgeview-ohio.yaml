notes: A small-town diner where honeymooners Don and Pat Carter wait while their car is repaired on the way to New
  York City. Don becomes hooked on the "Mystic Seer," a bobble-headed napkin-holder fortune machine on their booth.
  The machine survives as a replica collectible and the diner as a recognisable Shatner-era image.

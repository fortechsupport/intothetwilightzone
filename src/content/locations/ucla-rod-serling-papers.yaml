notes: >-
  UCLA holds 23 boxes of Serling papers covering 1945-1969, including many Twilight Zone scripts, contracts,
  publications and business correspondence. Serling himself donated most of it in 1968-69, and Carol Serling
  added material in 2009.


  Twilight Zone connections: Many series scripts and production paperwork.

name: Rod Serling Gazebo (Recreation Park Bandstand)
kind: memorial
address: Recreation Park, near Beethoven St, Binghamton, NY
city: Binghamton
region: New York
country: US
lat: 42.099263
lng: -75.933689
status: extant
notes: >-
  The columned bandstand on the rise above the Recreation Park carousel echoes the bandstand where Martin
  Sloan once carved his initials in "Walking Distance." A bronze plaque set into its floor credits Rod
  Serling as the creator of The Twilight Zone and notes the park's link to the episode. It is a standard
  stop for fans touring Serling's hometown.


  Twilight Zone connections: Walking Distance: Real-world counterpart of the Homewood bandstand; plaque
  in floor.

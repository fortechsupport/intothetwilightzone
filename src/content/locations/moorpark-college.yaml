notes: Community college in Moorpark, Ventura County, California. Serling spent a day on campus on December 3, 1968,
  refused to sign the state loyalty oath required of paid speakers and waived his fee, then spoke against the Vietnam
  War and for civil rights. The campus magazine QUEST printed the speech the next day.

notes: >-
  The couple are "fixing their car in the desert outside the hamlet of Beaumont" when a spacecraft comes down
  behind a nearby hill. They try to convince the town that aliens have landed, and find the townspeople replaced;
  the last scene is in Pops' Diner, where Faith "runs inside Pops' Diner to warn the sheriff". The article's
  production notes add that the setting, Altair IV, "was named after the setting of Forbidden Planet".

notes: >-
  Built in 1948 for the film An Act of Murder, this generic town square on the Universal backlot was rented
  for the pilot, "Where Is Everybody?," in which Mike Ferris wanders an eerily empty town. The same square
  later played Hill Valley in Back to the Future and appears on the Universal Studio Tour. The pilot was
  the only original-series episode made at Universal; the rest of the run was filmed at MGM.

name: Tower of Terror (Tokyo DisneySea)
kind: attraction
address: American Waterfront, Tokyo DisneySea
city: Urayasu
region: Chiba
country: JP
status: open
opened: '2006'
notes: >-
  Tokyo DisneySea's 2006 Tower of Terror uses the same drop-ride system but a wholly different story about
  explorer Harrison Hightower and his cursed Hotel Hightower. Because the Oriental Land Company did not
  license the series, it has no Twilight Zone branding or Serling narration. It is listed here for completeness
  as the one Tower of Terror outside the franchise.


  Twilight Zone connections: Sister attraction to the Twilight Zone towers without the license.

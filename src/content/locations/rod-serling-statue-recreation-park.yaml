name: Rod Serling Statue
kind: memorial
address: Recreation Park, Seminary Ave at Laurel Ave, Binghamton, NY 13905
city: Binghamton
region: New York
country: US
lat: 42.09832
lng: -75.93152
status: extant
opened: '2024-09-15'
notes: >-
  A six-foot bronze likeness of Rod Serling commissioned by the Rod Serling Memorial Foundation and given
  to the City of Binghamton, funded by private donors and a $50,000 New York State Assembly grant. It
  was set on its pedestal in early September 2024 and dedicated on September 15, 2024, during SerlingFest,
  in the centennial year of his birth. A memorial marker in the park, transcribed by HMdb, carries his line "Everybody has to have a hometown, Binghamton's mine."


  Twilight Zone connections: Centennial memorial a few blocks from his boyhood home.

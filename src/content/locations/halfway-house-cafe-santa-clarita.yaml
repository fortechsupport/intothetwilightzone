filmed:
- ref: films/twilight-zone-the-movie
  note: Roadside diner location.
notes: >-
  This roadside diner on old Sierra Highway, more than a century old and a favorite of location scouts
  (it is best known for the film Waitress), was used for diner scenes in Twilight Zone: The Movie. In
  Joe Dante's "It's a Good Life" segment, the roadside diner is where schoolteacher Helen Foley first
  meets young Anthony. It still serves customers.

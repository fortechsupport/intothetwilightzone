status: extant
closed: '1975-07-02'
notes: >-
  Serling was buried in this small village cemetery near Cayuga Lake after a funeral on July 2, 1975;
  his wife Carol, who died in 2020, rests beside him. The flat, plain stone reads "Rodman E. Serling,"
  and fans regularly leave coins, pens, toy robots and other tokens on it. The Find a Grave and Atlas
  Obscura entries give directions to the lot.


  Twilight Zone connections: Burial place (died June 28, 1975).

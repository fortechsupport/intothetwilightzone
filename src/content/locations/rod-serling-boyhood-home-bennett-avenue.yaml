name: Rod Serling Boyhood Home
kind: serling-place
address: 67 Bennett Avenue, Binghamton, NY
city: Binghamton
region: New York
country: US
status: extant
notes: >-
  The house where Serling lived from about age two until he left for the Army at eighteen, a short walk
  from Recreation Park. He often came back to walk the neighborhood, and the area fed the small-town nostalgia
  of episodes like "Walking Distance." It is a private residence and can only be viewed from the street.


  Twilight Zone connections: Family home c. 1926-1943. Walking Distance: Neighborhood that shaped the
  episode's idealized hometown.

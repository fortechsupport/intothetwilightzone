name: Antioch College Rod Serling Historical Markers
kind: memorial
address: 815 Livermore St and 505 Corry St, Yellow Springs, OH 45387
city: Yellow Springs
region: Ohio
country: US
lat: 39.7995
lng: -83.8889
status: extant
opened: '2025-10-02'
notes: >-
  Serling enrolled at Antioch on the G.I. Bill in 1946, ran the student broadcasting system, met and married
  Carol Kramer, and graduated in 1950; he returned to teach in 1962-63. In 2025 the William G. Pomeroy
  Foundation, Ohioana Library, Antioch College and Ohio History Connection placed two-sided Ohio historical
  markers on campus, dedicated October 2, 2025, recounting his time there and his Twilight Zone legacy. Ohio's governor attended
  the dedication.


  Twilight Zone connections: College alma mater (B.A. 1950) and 1962-63 teaching post.

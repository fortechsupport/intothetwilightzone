notes: The University of California, Los Angeles, where Serling spoke to students in November 1966 and May 1971.
  Both talks were filmed by the UCLA Communication Studies department and are now on YouTube. UCLA Library also
  holds Serling's papers and dictabelt recordings (see the separate archive records).

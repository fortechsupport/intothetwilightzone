name: Rod Serling's Syracuse Birthplace Area
kind: serling-place
address: 1324 Madison Street, Syracuse, NY (reported early family home)
city: Syracuse
region: New York
country: US
status: extant
opened: '1924-12-25'
notes: >-
  Serling was born in Syracuse on Christmas Day 1924 and spent roughly his first two years there before
  the family moved to Binghamton in 1926. Local reporting identifies a house at 1324 Madison Street as
  the family's Syracuse home; his parents had earlier lived at 635 Madison Avenue, a site now occupied
  by Hutchings Psychiatric Center. The house is privately owned.


  Twilight Zone connections: City of birth (December 25, 1924).

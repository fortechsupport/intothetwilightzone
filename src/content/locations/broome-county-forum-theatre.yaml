name: Broome County Forum Theatre
kind: museum-exhibit
address: Washington Street, Binghamton, NY
city: Binghamton
region: New York
country: US
status: open
notes: >-
  Binghamton's historic downtown performing-arts theatre has a permanent lobby exhibit on Serling's life,
  "Day of a Playwright," whose prize item is the penmanship certificate he earned as a schoolboy in 1937.
  The theatre hosted the August 2009 local unveiling of the U.S. Postal Service's Early TV Memories stamps,
  whose set included The Twilight Zone, and it has been a SerlingFest venue, including the 2019 sessions
  marking the show's 60th anniversary.


  Twilight Zone connections: 2009 Early TV Memories stamp unveiling. SerlingFest venue. Permanent lobby
  exhibit 'Day of a Playwright' with his 1937 penmanship certificate.

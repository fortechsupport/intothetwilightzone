name: The Twilight Zone Tower of Terror (Disney California Adventure)
kind: attraction
address: Hollywood Land, Disney California Adventure, Disneyland Resort
city: Anaheim
region: California
country: US
status: replaced
opened: '2004-05-05'
closed: '2017-01-02'
notes: >-
  A shorter, 183-foot Californian version opened on May 5, 2004, with a more compact queue. Its last day of
  operation was January 2, 2017 (Yesterland; Duchess of Disneyland). Disney then rethemed the building as Guardians of the Galaxy - Mission: Breakout!,
  which opened in May 2017 and is now part of Avengers Campus.


  Twilight Zone connections: Shared the Hollywood Tower Hotel story and Serling pre-show.

address: Almeida Street, Islington, London N1
city: London
region: England
country: GB
status: open
opened: 2017-12
notes: >-
  The Islington playhouse staged the world premiere of Anne Washburn's stage adaptation of The Twilight
  Zone in December 2017, directed by Richard Jones. The play interweaves several original-series stories
  into one evening. Its success led to a West End transfer in 2019.


  Twilight Zone connections: The Twilight Zone (stage play, 2017): World premiere of Anne Washburn's adaptation
  of original-series episodes.

name: Rod Serling Papers, 1943-1971
institution: Wisconsin Historical Society / Wisconsin Center for Film and Theater Research (WCFTR)
location: Madison, Wisconsin, USA
dates: '1943-1971'
extent: 32 cubic feet (80 archives boxes, 1 folder), 1 reel 35mm microfilm, 1,165 dictabelts plus 2 other
  audio recordings, 2 reels 16mm film, 15 photographs
description: 'The largest institutional body of Serling''s working papers: correspondence, scripts for
  produced and unproduced television, film, radio and stage work, speeches, press releases, clippings
  and fan mail, with The Twilight Zone among the series represented. Its distinctive feature is a large
  run of dictabelts on which Serling dictated drafts of scripts, speeches and letters, often several versions
  of the same story; WCFTR received a CLIR Recordings at Risk grant to digitize 1,152 of them.'

name: Jerry Sohl Papers, 1958-1983 (Collection 07763)
institution: American Heritage Center, University of Wyoming
location: Laramie, Wyoming, USA
dates: '1958-1983'
extent: 10.55 cubic feet (21 boxes)
description: Book manuscripts, screenplays and teleplays by Jerry Sohl, who ghostwrote some of Charles
  Beaumont's late Twilight Zone scripts when Beaumont fell ill (the historical note records the ghostwriting).
  The finding aid lists no Twilight Zone scripts, so the collection is useful mainly as context on the
  Beaumont circle; it does include his Outer Limits, Star Trek and Alfred Hitchcock Presents work.

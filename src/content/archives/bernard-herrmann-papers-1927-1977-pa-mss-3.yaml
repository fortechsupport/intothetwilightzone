name: Bernard Herrmann Papers, 1927-1977 (PA Mss 3)
institution: UC Santa Barbara Library, Department of Special Research Collections
location: Santa Barbara, California, USA
dates: '1927-1977'
extent: 119 linear feet (46 document boxes, 109 flat oversize boxes, 74 audiotape reels, 578 audio discs,
  1 audiocassette, 8 microfilm reels)
description: The main archive of the composer of the original Twilight Zone theme (season 1) and several
  episode scores, organized into personal papers, music scores and sound recordings. The finding aid does
  not single out Twilight Zone material and states that his CBS television manuscripts are in the CBS
  collection at UCLA, so it matters mainly for context on Herrmann's career.

name: Rod Serling Dictabelt Collection
institution: UCLA Library Special Collections (digitized by UCLA Library Preservation)
location: Los Angeles, California, USA
dates: 1968 (bulk)
extent: 308 dictabelts
description: Personal dictation recordings acquired by UCLA in the early 2000s and digitally transferred in 2019.
  They hold Serling's dictated correspondence, screenplays and theatre scripts, including eight complete works written
  in 1968 (several never produced) and many notes to his longtime assistant Marge Langsford. The UCLA account does
  not say whether any of them relate to The Twilight Zone.
url: https://www.library.ucla.edu/about/news/the-rod-serling-dictabelt-collection/
research_confidence: high

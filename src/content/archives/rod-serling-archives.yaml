name: Rod Serling Archives
institution: Ithaca College Library, Archives and Special Collections
location: Ithaca, New York, USA
description: 'Serling taught at Ithaca College in his last years, and this collection holds his television
  scripts, screenplays, stage plays, films, published works, unproduced scripts and secondary material,
  plus Emmy Awards on display. It was housed in the Roy H. Park School of Communications until it moved
  to the College Archives in 1997. Use is restricted: unpublished and unproduced material is closed to
  general research, and reproduction or publication needs the donor''s written permission.'
url: https://libguides.ithaca.edu/serling

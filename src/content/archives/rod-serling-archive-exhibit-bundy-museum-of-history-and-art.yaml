name: Rod Serling Archive exhibit, Bundy Museum of History & Art
institution: Bundy Museum of History & Art
location: 129 Main Street, Binghamton, New York, USA
description: A public exhibit in Serling's hometown of Binghamton, linked with the Rod Serling Memorial
  Foundation. It shows props from Twilight Zone episodes, wire photos, personal items, licensed merchandise
  (board games, a lunch box, a Talking Tina prototype), a large collection of printed matter and radio
  scripts, and episodes screened on site. It is a museum display rather than a research archive with a
  finding aid.

name: CBS Inc. Film and Television Collection, 1955-1991 (PASC-M 72)
institution: UCLA Library Special Collections, Performing Arts
location: Los Angeles, California, USA
dates: '1955-1991'
extent: 1550.5 linear feet (3101 boxes)
description: 'The CBS music library: manuscript scores and parts, cue logs, printed music, recordings
  and business papers for CBS series, films and specials, with work by Bernard Herrmann, Jerry Goldsmith
  and John Williams. The Twilight Zone is listed among the series represented, so this is where the network''s
  stock and original music for the show would be found. The Herrmann papers at UC Santa Barbara send researchers
  here for his CBS television manuscripts.'

description: 'Issue 83 of Gold Key''s licensed Twilight Zone anthology comic (April 1978), with a cover painted
  over a Frank Bolle sketch. Stories: "Two Faces of Evil" (Jack Sparling); "Last Voyage of the Dolphin" (Juan Ortiz);
  "The Wooden Witness" (John Celardo); "Hide and Seek" (Frank Bolle); "Nature''s Way" (Walter Simonson); "Join The
  Club" (Luis Dominguez); "The Vampire of East 29th Street" (Frank Bolle). Note: A 52-page issue.'

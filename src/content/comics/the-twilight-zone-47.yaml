description: 'Issue 47 of Gold Key''s licensed Twilight Zone anthology comic (January 1973). Stories: "And Where
  It Stops, Nobody Knows..." (script Len Wein; pencils Rich Buckler; inks Sal Trapani); "Golden Dreams" (illustration
  Joe Certa (1-page text)); "The Man Who Hated Mankind" (art Jack Sparling); "Something New in Town" (art Jack Sparling);
  "The Space Prize" (art John Celardo). Cover: George Wilson (painted). All new; no reprint links recorded. ''Something
  New in Town'' is the cover story. Wein credit from 2002 interview.'

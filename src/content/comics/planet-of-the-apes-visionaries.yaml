description: BOOM! Studios' 2018 graphic novel adapting Rod Serling's original, unfilmed draft screenplay for Planet
  of the Apes, drawn by Chad Lewis and adapted by Dana Gould. It shows the film as Serling first imagined it, with
  a modern ape city and a different ending.

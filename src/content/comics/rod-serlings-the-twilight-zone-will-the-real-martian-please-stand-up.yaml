description: A graphic-novel adaptation of Rod Serling's teleplay for “Will the Real Martian Please Stand Up?”,
  part of the 2008-2009 series of officially licensed Twilight Zone adaptations from Walker & Company (Bloomsbury),
  each written by Mark Kneece and drawn by a different artist, with the original script reprinted.

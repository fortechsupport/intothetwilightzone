description: The seventh of eight Twilight Zone issues of Gold Key's bimonthly Mystery Comics Digest (1972-75,
  26 issues), a 132-page pocket digest with a painted George Wilson cover. Its reprinted Twilight Zone
  stories include "Tombstone Valley", "The Shivering Stars" and "The Unseen Thing", plus a Dr. Spektor
  story.

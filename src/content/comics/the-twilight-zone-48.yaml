description: 'Issue 48 of Gold Key''s licensed Twilight Zone anthology comic (March 1973). Stories: "Nightmare in
  Miniature" (art Luis Dominguez); "Fiery Death" (art Joe Certa (1 page)); "The Numbers Game" (art Luis Dominguez);
  "The Killer Light" (art Joe Certa; letters Gaspar Saladino); "Perfect Partners" (pencils Stanley Pitt; inks Reginald
  Pitt). Cover: George Wilson (painted). New material; all five stories were later reprinted in #86 (Aug 1978).
  Cover story ''The Killer Light!''. Australian artists Stanley and Reginald Pitt on ''Perfect Partners''.'

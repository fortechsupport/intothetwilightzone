description: 'Issue 42 of Gold Key''s licensed Twilight Zone anthology comic (March 1972). Stories: "The Haunted
  Taxi" (art Luis Dominguez); "Torture Revisited" (illustration Joe Certa (1-page text)); "The Possible Dream" (art
  Jack Sparling); "At the End of His Rope" (art Mike Vosburg); "The Day of the Palio" (art Giorgio Cambiotti; letters
  Ben Oda). Cover: George Wilson (?) (painted). All new; no reprint links recorded. ''The Day of the Palio'' is
  the cover story.'

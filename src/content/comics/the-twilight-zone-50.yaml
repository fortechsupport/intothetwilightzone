description: 'Issue 50 of Gold Key''s licensed Twilight Zone anthology comic (July 1973). Stories: "Water, Water
  Everywhere!" (art Adolpho Buylla); "3 Dreams of Death" (illustration Joe Certa (1-page text)); "Nature''s Way"
  (script Gerry Boudreau (?); art Walter Simonson); "Join the Club" (art Luis Dominguez); "The Vampire of East 29th
  Street" (pencils/inks/letters Frank Bolle). Cover: George Wilson (painted). New material; ''Nature''s Way'', ''Join
  the Club'' (cover story) and ''The Vampire of East 29th Street'' were later reprinted in #83 (Apr 1978). Walter
  Simonson art.'

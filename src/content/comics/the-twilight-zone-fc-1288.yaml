  note: 'Read 2026-11-24. Martin O''Hearn credits the stories to Leo Dorfman and identifies the art: "The Bridegroom" and "Secret Weapon" (Evans), "The Joiner" (p: Crandall, i: Evans), the three fillers (Evans); "The second issue cover painting is by George Wilson." These are identifications from the art, not printed credits.'
- title: IntoTheTwilightZone research spreadsheets
  note: Imported from Adam's research spreadsheets; not yet verified against a primary source.
description: One of the four Twilight Zone comics Dell published in 1961-1962 (this one dated February-April 1961),
  before the packager Western Publishing moved the license to its own new Gold Key imprint. Like the later Gold
  Key run, it carries new stories rather than adaptations of episodes. Its creators are identifications by comics historian Martin O'Hearn (the comic printed no credits).

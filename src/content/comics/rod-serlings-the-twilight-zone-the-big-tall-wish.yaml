description: A graphic-novel adaptation of Rod Serling's teleplay for “The Big Tall Wish”, part of the 2008-2009
  series of officially licensed Twilight Zone adaptations from Walker & Company (Bloomsbury), each written by Mark
  Kneece and drawn by a different artist, with the original script reprinted.

description: A Twilight Zone issue of Gold Key's pocket-sized (160-page) horror digest, which rotated
  between Ripley's Believe It or Not!, Boris Karloff and Twilight Zone. Under a painted George Wilson
  cover, it reprints Gold Key Twilight Zone stories including "The Last Sixty Seconds", "The Ordeal of
  Bluebird 3" and "Voyage to Nowhere". It also holds the first appearance of Don Glut's caveman hero Tragg.

description: 'Issue 92 of Gold Key''s licensed Twilight Zone anthology comic (May 1982). Stories: "Perilous Journey"
  (art Reed Crandall; letters Ben Oda (comicbooks.com adds script Leo Dorfman)); "Do Not Touch Exhibit" (art George
  Evans; letters Ben Oda); "Wings of Death" (art Joe Certa); "Voyage to Nowhere" (pencils Reed Crandall; inks George
  Evans (?); letters Ben Oda). Cover: Frank Bolle. Final issue, published by Western (Whitman era) dated May 1982
  after a gap since #91 (1979). Contents differ entirely from #91. Crandall/Evans art points to reprinted 1960s
  stories, but neither source names the original issues. A comicbooks.com page lists Frank Frazetta as inker on
  ''Perilous Journey'', which is unconfirmed.; month from comicbooks.com.'

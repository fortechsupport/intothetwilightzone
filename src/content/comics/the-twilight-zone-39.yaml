description: 'Issue 39 of Gold Key''s licensed Twilight Zone anthology comic (September 1971). Stories: "The Youngest
  Witch" (art John Celardo); "The Plane of Death" (art Joe Certa); "Wedding March" (art Oscar Novelle (signed));
  "Fool''s Gold" (script Len Wein; art Alan Weiss); "Escape Artist" (art Jack Sparling). Cover: George Wilson (painted).
  All new stories; all five were later reprinted in #79 (Aug 1977). Len Wein script credit comes from a 2002 Wein
  interview.'

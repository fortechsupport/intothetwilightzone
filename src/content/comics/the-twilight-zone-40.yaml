description: 'Issue 40 of Gold Key''s licensed Twilight Zone anthology comic (November 1971). Stories: "A Charmed
  Life" (art Jack Sparling); "Door to Oblivion" (art Joe Certa (?) (1 page)); "Premonition" (art Oscar Novelle);
  "The Missing Link" (art Joe Certa; letters Ben Oda); "The Last Voyage" (script Len Wein; art Luis Dominguez).
  Cover: George Wilson (painted). New material; cover and all stories are linked to The Twilight Zone #73 (Sep 1976),
  which by date must be the later reprint. Wein script credit from interview.'

kind: digest
description: A Twilight Zone issue of Gold Key's pocket-sized (132-page) horror digest, which rotated
  between Ripley's Believe It or Not!, Boris Karloff and Twilight Zone. Under a painted George Wilson
  cover, it reprints Gold Key Twilight Zone stories including "The Hanging Tree", "The Phantom Balloon"
  and "The Time Machine". Also included is "The Revenge of Dr. Dread", an early Doug Wildey story. It
  was the last Twilight Zone issue of the digest.

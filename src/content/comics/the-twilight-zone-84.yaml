description: 'Issue 84 of Gold Key''s licensed Twilight Zone anthology comic (June 1978). Stories: "Raptures of
  the Deep" (Adolpho Buylla); "Nightowl" (Jack Sparling); "Don''t Call Me" (Frank Bolle); "I Did It!" (Al McWilliams);
  "Seeing-Eye Man" (John Celardo); "Makeover!" (Frank Bolle). Note: A 52-page issue that dealers list as containing
  Frank Miller''s first published comic work.'

description: 'Issue 91 of Gold Key''s licensed Twilight Zone anthology comic (June 1979). Stories: "Soldier of Death"
  (art Mike Roy); "Design for Treachery" (art Win Mortimer); "Good Samaritan" (art Jack Sparling); "Lookalike" (art

description: 'Issue 41 of Gold Key''s licensed Twilight Zone anthology comic (January 1972). Stories: "Guilt Has
  a Thousand Eyes" (art Dan Spiegle; letters Bill Spicer); "Harbinger of Death" (text page); "A Matter of Time"
  (script Len Wein; art Jack Sparling); "The Chimpanzee" (art Frank Bolle); "The Magic Herb" (art Win Mortimer);
  "Long Laugh the King!" (art John Celardo). Cover: George Wilson (painted). All new. ''Long Laugh the King!'' (cover
  story) was later reprinted in Dan Curtis Giveaways: The Twilight Zone #3 (1974).'

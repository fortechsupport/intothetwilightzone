description: 'Issue 45 of Gold Key''s licensed Twilight Zone anthology comic (September 1972). Stories: "A Call
  for Mr. Travers" (art Luis Dominguez); "What''s in a Name?" (art Joe Certa); "The Experiment" (art Jack Sparling);
  "The Curse of Seal Bay" (art Adolpho Buylla); "Art for Art''s Sake" (art John Celardo; letters John Celardo (?)).
  Cover: George Wilson (painted). New material; cover and all five stories were reprinted in #71 (Jul 1976).'

description: 'Issue 49 of Gold Key''s licensed Twilight Zone anthology comic (May 1973). Stories: "Color Him Dead!"
  (art Adolpho Buylla); "Oh, You Beautiful Doll" (illustration Joe Certa (1-page text)); "The Man on the 13th Floor"
  (pencils/inks/letters Frank Bolle); "The Supreme Penalty" (art Oscar Novelle); "Proceed at Your Own Risk" (pencils
  Mike Sekowsky; inker unidentified). Cover: George Wilson (painted). All new; no reprint links recorded. GCD notes
  earlier ink credit to Sekowsky was an error (per Tony Isabella, 2006).'

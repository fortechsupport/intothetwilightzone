description: 'Now Comics'' first Twilight Zone comic, a 52-page anthology led by Harlan Ellison and Neal
  Adams'' adaptation of Ellison''s teleplay "Crazy as a Soup Sandwich" from the 1980s revival, plus Ellison''s
  introduction "Riding the Daymare" and a backup story, "Wishing Book". The direct-market edition carries
  a mixed-media Bill Sienkiewicz cover; no issue #2 followed, and the title relaunched in 1991 as Vol.
  2.'

description: 'A full-cast audio remake of “Steel” from the original 1959 series (season 5, 1963), written for television
  by Richard Matheson. Adapted for radio by Dennis Etchison, JoBe Cerny, starring Louis Gossett Jr.. The story:
  In a near future where human boxing is outlawed and robots fight in the ring, a washed-up former boxer and his
  mechanic haul their aging, broken-down robot to a small-town bout they cannot afford to lose.'

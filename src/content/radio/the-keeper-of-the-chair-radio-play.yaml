title: The Keeper of the Chair (radio play)
series_title: Unproduced radio play
serling_role: unproduced
original_writer: Rod Serling
description: A radio play Serling wrote around 1949 and submitted to Suspense, which turned it down on 1 December 1949,
  then to Escape, which turned it down on 27 April 1950. He adapted it for Lights Out!, which also rejected it. It is
  one of the scripts from his WLW years that he later offered to television.

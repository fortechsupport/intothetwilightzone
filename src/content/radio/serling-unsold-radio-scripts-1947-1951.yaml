title: Rod Serling's unsold radio scripts (1947-1951)
series_title: Unproduced radio scripts
serling_role: unproduced
original_writer: Rod Serling
description: 'Scripts Serling sent to network radio that did not sell, as Martin Grams Jr. lists them: "The Most
  Dangerous Game" (an adaptation of Richard Connell, 22 June 1947) and "Look to the Sky" (13 July 1947); "Winner Take
  Nothing" (Grand Central Station, 10 August 1949); "Potter''s Paradise" (The First Nighter Program, 8 September 1949);
  "The Memory" (Armstrong''s Theatre of Today, October 1949); "Cupid at Left Half" (Curtain Time, 10 October 1949); an
  outline, "Father of the Common School" (The Cavalcade of America, 25 November 1949), which he later rewrote for WLW;
  "The Power of Abner Doubleday", later "The Power of Willie Doubleday" (Dr. Christian); "The Scene of Lilaces"; and the
  1951 science-fiction script "The Button Pushers". His WLW-era scripts "Grady Everett for the People", "The Sands of
  Tom", "Aftermath" and "The Steel Casket" are also named; Grams says it is not clear whether they were broadcast.'

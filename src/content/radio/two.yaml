description: 'A full-cast audio remake of “Two” from the original 1959 series (season 3, 1961), written for television
  by Montgomery Pittman. Adapted for radio by Dennis Etchison, starring Don Johnson. The story: Years after a war has
  emptied a town, a ragged woman and a man from the opposing army stumble upon each other among the ruins. Wary and armed,
  the two must decide whether old loyalties still matter now that almost no one is left.'

description: 'A full-cast audio remake of “Mr. Denton on Doomsday” from the original 1959 series (season 1, 1959), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Adam Baldwin. The story: Al Denton, a
  former gunfighter turned town drunk, is mocked by a bullying gunslinger in a frontier saloon. When a traveling peddler
  offers him a strange potion, Denton gets a chance to reclaim his pride.'

description: 'A full-cast audio remake of “And When the Sky Was Opened” from the original 1959 series (season 1,
  1959), written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Barry Bostwick. The
  story: Three astronauts return from the first manned flight into space after their craft briefly vanished from
  radar. Back on Earth, one of them becomes convinced that something about their homecoming has gone badly wrong.'

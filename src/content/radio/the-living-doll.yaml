description: 'A full-cast audio remake of “Living Doll” from the original 1959 series (season 5, 1963), written
  for television by Charles Beaumont and Jerry Sohl. Adapted for radio by Dennis Etchison, starring Tim Kazurinsky.
  The story: Erich Streator resents his stepdaughter Christie and her new talking doll, Talky Tina. When the doll
  begins speaking directly to him with menacing words, he sets out to get rid of it, but Tina proves hard to silence.'

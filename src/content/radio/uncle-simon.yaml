description: 'A full-cast audio remake of “Uncle Simon” from the original 1959 series (season 5, 1963), written for television
  by Rod Serling. Adapted for radio by Dennis Etchison, starring Peter Mark Richman and Beverly Garland. The story: Barbara
  has spent twenty-five years caring for her cruel, domineering uncle, an inventor, in hopes of inheriting his fortune.
  When he dies, she finds the will comes with conditions involving the secret project in his laboratory.'

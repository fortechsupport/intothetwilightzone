description: 'A full-cast audio remake of “Back There” from the original 1959 series (season 2, 1961), written for
  television by Rod Serling. Adapted for radio by Dennis Etchison, starring Jim Caviezel. The story: After a debate
  at his Washington club about whether history can be changed, Peter Corrigan steps outside and finds himself in
  April 1865, on the night of President Lincoln''s visit to Ford''s Theatre.'

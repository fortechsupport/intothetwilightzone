description: 'A full-cast audio remake of “The Last Flight” from the original 1959 series (season 1, 1960), written
  for television by Richard Matheson. Adapted for radio by Dennis Etchison, starring Charles Shaughnessy. The story:
  A British World War I pilot flies into a strange white cloud over France in 1917 and lands at a modern American
  air base decades later. Confused officers question him while he wrestles with what he left behind.'

description: 'A full-cast audio remake of “One More Pallbearer” from the original 1959 series (season 3, 1962), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Chelcie Ross. The story: A wealthy, bitter
  man invites three people who humiliated him years ago into his luxurious bomb shelter beneath a skyscraper. He announces
  a nuclear attack is imminent and offers them safety, but only if they apologize.'

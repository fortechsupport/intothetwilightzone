description: 'A full-cast audio remake of “On Thursday We Leave for Home” from the original 1959 series (season
  4, 1963), written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Barry Bostwick.
  The story: For thirty years Captain William Benteen has kept a stranded colony alive on a planet with two suns.
  When a rescue ship finally arrives to take everyone back to Earth, Benteen struggles to give up his role.'

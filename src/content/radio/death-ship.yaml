description: 'A full-cast audio remake of “Death Ship” from the original 1959 series (season 4, 1963), written for television
  by Richard Matheson. Adapted for radio by Dennis Etchison, starring John Schneider. The story: In 1997, the crew of
  a spaceship surveying a distant planet sees a glint on the surface. Landing to investigate, they find a crashed ship
  identical to their own, and the bodies inside look familiar.'

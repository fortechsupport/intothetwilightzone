description: 'A full-cast audio remake of “The Purple Testament” from the original 1959 series (season 1, 1960), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Michael Rooker. The story: In the Philippines
  during World War II, infantry lieutenant William Fitzgerald discovers he can see a strange light on the faces of men
  who are about to die. The gift becomes an unbearable burden.'

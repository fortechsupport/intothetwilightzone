description: 'A full-cast audio remake of “What''s in the Box” from the original 1959 series (season 5, 1964), written
  for television by Martin M. Goldsmith. Adapted for radio by Dennis Etchison, starring Mike Starr. The story: Bickering
  cab driver Joe Britt and his wife Phyllis can barely stand each other. After a TV repairman fixes their set, Joe''s
  television starts showing scenes from his own life, including events that have not happened yet.'

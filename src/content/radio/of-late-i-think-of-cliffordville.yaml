description: 'A full-cast audio remake of “Of Late I Think of Cliffordville” from the original 1959 series (season
  4, 1963), written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring H. M. Wynant.
  The story: William Feathersmith, a ruthless and bored tycoon, makes a deal with a devilish woman to go back to
  his small hometown of Cliffordville in 1910. He plans to build his fortune again, this time knowing the future.'

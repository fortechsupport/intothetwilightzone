description: 'A full-cast audio remake of “Time Enough at Last” from the original 1959 series (season 1, 1959), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Tim Kazurinsky. The story: Henry Bemis,
  a nearsighted bank teller, wants nothing more than time to read, but his boss and his wife keep him from books. Hiding
  in the bank vault on his lunch break, he emerges to a transformed world.'

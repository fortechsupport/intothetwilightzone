description: 'A full-cast audio remake of “The Passersby” from the original 1959 series (season 3, 1961), written for
  television by Rod Serling. Adapted for radio by Dennis Etchison, starring Morgan Brittany. The story: Just after the
  Civil War, a grieving widow sits on the porch of her ruined plantation home while a slow procession of soldiers from
  both armies trudges past along the road. A wounded Confederate sergeant stops to rest and talk.'

description: 'A full-cast audio remake of “Dust” from the original 1959 series (season 2, 1961), written for television
  by Rod Serling. Adapted for radio by Dennis Etchison, starring Bill Smitrovich. The story: In a poor western town,
  a young man is to be hanged for accidentally killing a child while drunk. As his desperate father begs for mercy, a
  cynical peddler arrives with a bag of supposedly magic dust to sell.'

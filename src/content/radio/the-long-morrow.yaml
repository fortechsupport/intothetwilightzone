description: 'A full-cast audio remake of “The Long Morrow” from the original 1959 series (season 5, 1964), written for
  television by Rod Serling. Adapted for radio by Dennis Etchison, starring Kathy Garver. The story: Astronaut Douglas
  Stansfield is chosen for a forty-year voyage to a distant star, kept in suspended animation so he will not age. Days
  before launch he falls in love, and the long separation weighs on them both.'

description: 'A full-cast audio remake of “King Nine Will Not Return” from the original 1959 series (season 2, 1960),
  written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Adam Baldwin. The story:
  Captain James Embry wakes beside his crashed B-25 bomber somewhere in an African desert. His crew has vanished
  without a trace, and as he searches the sand for them he begins to see and hear things that should not be there.'

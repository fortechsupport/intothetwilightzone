description: 'A full-cast audio remake of “Shadow Play” from the original 1959 series (season 2, 1961), written
  for television by Charles Beaumont. Adapted for radio by Dennis Etchison, starring Ernie Hudson. The story: Sentenced
  to death, Adam Grant insists to anyone who will listen that all of this is his recurring nightmare and that everyone
  around him exists only in his dream. The district attorney is unsettled enough to start wondering.'

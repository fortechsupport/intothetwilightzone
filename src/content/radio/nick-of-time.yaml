description: 'A full-cast audio remake of “Nick of Time” from the original 1959 series (season 2, 1960), written for
  television by Richard Matheson. Adapted for radio by Dennis Etchison, starring Marshall Allman and Jamie Brown. The
  story: Newlyweds stranded in a small Ohio town while their car is repaired pass the time at a diner. The husband grows
  fixated on a tabletop fortune-telling machine whose answers seem to match his life a little too well.'

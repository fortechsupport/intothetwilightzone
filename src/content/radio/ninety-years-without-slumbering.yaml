description: 'A full-cast audio remake of “Ninety Years Without Slumbering” from the original 1959 series (season 5,
  1963), written for television by Richard De Roy. Adapted for radio by Dennis Etchison, starring Bill Erwin. The story:
  Elderly Sam Forstmann is convinced that he will die if his beloved grandfather clock ever stops. When his worried granddaughter
  and her husband decide the clock must go, Sam''s fixation turns into a battle with time itself.'

description: 'A full-cast audio remake of “The Bard” from the original 1959 series (season 4, 1963), written for television
  by Rod Serling. Adapted for radio by Dennis Etchison, starring John Ratzenberger and Stacy Keach. The story: Julius
  Moomer, a hack would-be TV writer, uses a book of black magic to bring William Shakespeare into the present to ghostwrite
  a television pilot. Then the network and the actors start getting their hands on the script.'

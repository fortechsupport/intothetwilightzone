description: 'A full-cast audio remake of “The Grave” from the original 1959 series (season 3, 1961), written for television
  by Montgomery Pittman. Adapted for radio by Dennis Etchison, starring Michael Rooker. The story: A hired gunman rides
  into a frontier town to find that the outlaw he was chasing has already been killed, after cursing him with his last
  breath. Taunted by the locals, the gunman takes a dare to visit the dead man''s grave at midnight.'

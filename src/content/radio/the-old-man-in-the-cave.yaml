description: 'A full-cast audio remake of “The Old Man in the Cave” from the original 1959 series (season 5, 1963), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Adam Baldwin. The story: Ten years after
  nuclear war, a small, starving community survives by following the advice of an unseen old man in a cave, relayed by
  their leader Goldsmith. When armed soldiers arrive, they challenge the townspeople''s blind faith.'

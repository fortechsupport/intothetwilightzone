description: 'A full-cast audio remake of “Nightmare at 20,000 Feet” from the original 1959 series (season 5, 1963),
  written for television by Richard Matheson. Adapted for radio by Dennis Etchison, starring John Schneider. The story:
  Bob Wilson, flying home after a stay in a sanitarium following a breakdown, glimpses a strange creature crouched on
  the airliner''s wing during a storm. No one else sees it, and his efforts to warn the crew only make him look unwell
  again.'

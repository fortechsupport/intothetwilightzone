description: 'A full-cast audio remake of “Will the Real Martian Please Stand Up?” from the original 1959 series (season
  2, 1961), written for television by Rod Serling. Adapted for radio by Chaz Holloway, Dennis Etchison, starring Richard
  Kind. The story: State troopers follow tracks from a crashed object to a snowbound roadside diner, where a bus''s passengers
  are waiting out a washed-out bridge. There is one more person than the driver remembers, and someone in the room may
  not be human.'

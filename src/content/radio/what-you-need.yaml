description: 'A full-cast audio remake of “What You Need” from the original 1959 series (season 1, 1959), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Bruno Kirby and Bruce Kirby. The
  story: A gentle street peddler named Pedott seems to know exactly what each customer will need before they do.
  A down-and-out hustler named Fred Renard notices the old man''s gift and decides to exploit it.'

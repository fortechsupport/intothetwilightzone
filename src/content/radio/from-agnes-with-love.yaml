description: 'A full-cast audio remake of “From Agnes – With Love” from the original 1959 series (season 5, 1964),
  written for television by Bernard C. Schoenfeld. Adapted for radio by Dennis Etchison, starring Ed Begley Jr..
  The story: Timid programmer James Elwood is put in charge of Agnes, the world''s most advanced computer. When
  he asks her for advice on winning over his coworker Millie, Agnes''s romantic coaching starts to seem less than
  helpful.'

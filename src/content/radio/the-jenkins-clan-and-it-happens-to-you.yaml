title: The Jenkins Clan and It Happens to You (proposed radio series)
series_title: Proposed radio series
serling_role: unproduced
original_writer: Rod Serling
description: Two radio series Serling proposed in Cincinnati. The Jenkins Clan, a serial, was proposed to WLW on 23
  August 1950; Martin Grams Jr. found no evidence it was broadcast, and Flapper Press says its format later shaped The
  Zero Hour. It Happens to You was to include "Mr. Finchley Versus the Bomb", "You Be the Bad Guy", "And Then Came
  Jones", "The Gallant Breed of Men" and "Law Nine Concerning Christmas"; the first two were later dramatized on
  television's Lux Video Theatre.

description: 'A full-cast audio remake of “A Most Unusual Camera” from the original 1959 series (season 2, 1960), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Mike Starr. The story: A pair of small-time
  thieves look over the loot from their latest job and find an old camera that produces photographs of events a few minutes
  in the future. They quickly scheme to turn the device into easy money.'

description: 'A full-cast audio remake of “The Obsolete Man” from the original 1959 series (season 2, 1961), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Jason Alexander. The story: In a totalitarian
  state that has banned books and God, librarian Romney Wordsworth is put on trial and declared obsolete. Sentenced to
  death, he chooses his method of execution and asks that it be broadcast.'

description: 'A full-cast audio remake of “The Fear” from the original 1959 series (season 5, 1964), written for television
  by Rod Serling. Adapted for radio by Dennis Etchison, starring Jane Seymour and James Keach. The story: A state trooper
  checks on a nervous fashion editor staying alone in a remote mountain cabin, where she reports strange lights in the
  sky. Then giant footprints and a crushed car suggest something enormous is near.'

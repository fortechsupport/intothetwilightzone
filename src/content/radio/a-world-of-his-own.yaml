description: 'A full-cast audio remake of “A World of His Own” from the original 1959 series (season 1, 1960), written
  for television by Richard Matheson. Adapted for radio by Dennis Etchison, starring Charles Shaughnessy. The story:
  Playwright Gregory West is entertaining an attractive woman at home when his wife walks in and catches them. He then
  reveals a secret about his dictation machine and the characters he describes into it.'

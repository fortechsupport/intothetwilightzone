description: 'A full-cast audio remake of “I Sing the Body Electric” from the original 1959 series (season 3, 1962),
  written for television by Ray Bradbury. Adapted for radio by Dennis Etchison, starring Dee Wallace. The story:
  After their mother dies, a widower and his three children visit a company that builds custom robotic grandmothers.
  The new grandmother wins over two of the kids, but the eldest daughter refuses to accept anyone in her mother''s
  place.'

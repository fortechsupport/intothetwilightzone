description: 'A full-cast audio remake of “Sounds and Silences” from the original 1959 series (season 5, 1964), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Richard Kind. The story: Roswell Flemington,
  a loud, navy-obsessed businessman, fills every room with noise until his long-suffering wife finally leaves him. Then
  ordinary sounds begin to torment him unbearably.'

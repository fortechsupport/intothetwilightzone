description: 'A full-cast audio remake of “Execution” from the original 1959 series (season 1, 1960), written for television
  by Rod Serling. Adapted for radio by Dennis Etchison, starring Don Johnson. The story: In 1880, cowboy killer Joe Caswell
  is seconds from being hanged when he vanishes from the noose. He reappears in a 20th-century scientist''s laboratory,
  pulled forward in time by an experimental machine.'

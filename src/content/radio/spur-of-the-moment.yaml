description: 'A full-cast audio remake of “Spur of the Moment” from the original 1959 series (season 5, 1964), written
  for television by Richard Matheson. Adapted for radio by Dennis Etchison, starring Sarah Wayne Callies. The story:
  On the eve of her engagement in 1939, young heiress Anne Henderson is chased on horseback across the countryside by
  a screaming woman in black. The mystery of the rider spans twenty-five years of choices and regrets.'

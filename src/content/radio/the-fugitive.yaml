description: 'A full-cast audio remake of “The Fugitive” from the original 1959 series (season 3, 1962), written for
  television by Charles Beaumont. Adapted for radio by Dennis Etchison, starring Stan Freberg. The story: A kindly old
  man who can change his shape and perform small wonders is the best friend of a lonely girl with a leg brace. When two
  strangers in dark suits arrive looking for him, he must decide whether to run.'

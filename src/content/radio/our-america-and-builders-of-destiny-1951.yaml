title: Our America and Builders of Destiny (1951)
series_title: Our America; Builders of Destiny
serling_role: wrote
original_writer: Rod Serling
description: Two short runs of historical radio dramas from Serling's Cincinnati years. Our America (September and
  October 1951) presented biographies of Jefferson Davis, George Armstrong Custer and Lewis and Clark; Builders of
  Destiny (24 November to 8 December 1951) dramatized the lives of Zane Grey and General Philip Sheridan, which
  Martin Grams Jr. says gave Serling the chance to dramatize biographies. The source names neither station.

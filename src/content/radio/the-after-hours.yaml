description: 'A full-cast audio remake of “The After Hours” from the original 1959 series (season 1, 1960), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Kim Fields. The story: Marsha White
  rides an elevator to a department store''s ninth floor to buy a gold thimble. The floor is empty and strangely
  quiet, and the saleswoman who helps her seems to know a lot about her.'

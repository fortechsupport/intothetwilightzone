description: 'A dramatization of Charles Beaumont''s short story "Free Dirt" (collected in Charles Beaumont: Selected
  Stories), about a greedy man who takes soil from a cemetery for his garden. It was never a TV episode. Adapted for
  radio by Dennis Etchison, starring Eric Bogosian. The Twilight Zone Vortex lists it as based on the story; the BBC''s
  listing calls it Charles Beaumont''s TV script. No source read says it was written for The Twilight Zone, so it is
  not shelved with the unmade scripts or with the stories written for radio.'

description: 'A full-cast audio remake of “Mr. Dingle, the Strong” from the original 1959 series (season 2, 1961), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Tim Kazurinsky. The story: Luther Dingle,
  a timid vacuum cleaner salesman pushed around at his local bar, is chosen by a pair of two-headed Martian observers
  for an experiment. They give him enormous strength just to see what an ordinary man will do with it.'

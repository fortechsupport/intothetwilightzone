description: 'A full-cast audio remake of “The Parallel” from the original 1959 series (season 4, 1963), written for
  television by Rod Serling. Adapted for radio by Dennis Etchison, starring Lou Diamond Phillips. The story: Astronaut
  Robert Gaines loses contact during an orbital flight and wakes up back on Earth. His home and family are almost exactly
  as he left them, but small details are wrong in ways he cannot ignore.'

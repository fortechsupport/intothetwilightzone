description: 'A full-cast audio remake of “No Time Like the Past” from the original 1959 series (season 4, 1963),
  written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Jason Alexander. The story:
  Disgusted with the violence of the 20th century, a scientist uses a time machine to try to change history''s worst
  disasters. When that fails, he escapes to a peaceful 1880s town he hopes will be a refuge.'

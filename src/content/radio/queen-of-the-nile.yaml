description: 'A full-cast audio remake of “Queen of the Nile” from the original 1959 series (season 5, 1964), written
  for television by Charles Beaumont and Jerry Sohl. Adapted for radio by Dennis Etchison, starring Kate Jackson. The
  story: Columnist Jordan Herrick interviews film star Pamela Morris, who looks no older than she did decades earlier.
  Curious about her secret, he starts digging into her past, while her elderly ''mother'' hints at something stranger.'

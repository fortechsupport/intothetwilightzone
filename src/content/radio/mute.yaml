description: 'A full-cast audio remake of “Mute” from the original 1959 series (season 4, 1963), written for television
  by Richard Matheson. Adapted for radio by Dennis Etchison, starring Wade Williams. The story: After a fire kills
  her parents, a young girl raised to communicate only by telepathy is taken in by a kindly sheriff''s family in
  a small Pennsylvania town, where her silence is misunderstood by everyone around her.'

description: 'A full-cast audio remake of “The Trade-Ins” from the original 1959 series (season 3, 1962), written for
  television by Rod Serling. Adapted for radio by Dennis Etchison, starring H. M. Wynant and Peggy Webber. The story:
  In the future, an elderly couple visits a company that transfers aging minds into young, healthy bodies. They can only
  afford one procedure, and the husband, wracked with pain, must decide whether to go ahead without his wife.'

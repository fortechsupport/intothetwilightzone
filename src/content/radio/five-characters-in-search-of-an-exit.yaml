description: 'A full-cast audio remake of “Five Characters in Search of an Exit” from the original 1959 series (season
  3, 1961), written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Jason Alexander. The
  story: An army major wakes inside a huge, featureless cylinder with a clown, a hobo, a ballerina and a bagpiper. None
  of them remembers how they arrived, and while the others have resigned themselves to the place, the major is determined
  to climb out.'

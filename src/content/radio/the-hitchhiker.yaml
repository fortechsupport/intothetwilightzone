description: 'A full-cast audio remake of “The Hitch-Hiker” from the original 1959 series (season 1, 1960), written for
  television by Rod Serling. Adapted for radio by Dennis Etchison, starring Kate Jackson. The story: Nan Adams is driving
  cross-country alone when she spots a drab man thumbing for a ride beside the highway. Mile after mile, state after
  state, the same figure keeps appearing ahead of her.'

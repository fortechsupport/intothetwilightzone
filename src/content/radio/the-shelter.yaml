description: 'A full-cast audio remake of “The Shelter” from the original 1959 series (season 3, 1961), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Ernie Hudson. The story: During
  a friendly suburban birthday party, a radio bulletin warns of incoming missiles. Only the local doctor has built
  a fallout shelter, and as panic spreads his longtime neighbors begin pounding on its door, their friendship eroding
  by the minute.'

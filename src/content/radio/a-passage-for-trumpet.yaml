description: 'A full-cast audio remake of “A Passage for Trumpet” from the original 1959 series (season 1, 1960), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Mike Starr. The story: Joey Crown, a
  gifted trumpet player whose drinking has cost him every gig, pawns his horn in despair. After a desperate act, he finds
  himself in a city where nobody can see or hear him.'

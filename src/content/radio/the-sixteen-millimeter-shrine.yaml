description: 'A full-cast audio remake of “The Sixteen-Millimeter Shrine” from the original 1959 series (season
  1, 1959), written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Kathy Garver.
  The story: Barbara Jean Trenton, a faded movie star, shuts herself away in her mansion watching her old films
  night after night. Her loyal agent urges her to face the present, but she longs to live inside her glory days.'

description: 'A full-cast audio remake of “The Lonely” from the original 1959 series (season 1, 1959), written for television
  by Rod Serling. Adapted for radio by Dennis Etchison, starring Mike Starr. The story: Convict James Corry is serving
  a solitary sentence on a barren asteroid, visited only by an occasional supply ship. A sympathetic captain leaves him
  a crate containing a companion unlike anything he expected.'

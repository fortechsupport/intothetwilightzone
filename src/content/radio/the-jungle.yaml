description: 'A full-cast audio remake of “The Jungle” from the original 1959 series (season 3, 1961), written for
  television by Charles Beaumont. Adapted for radio by Dennis Etchison, starring Ed Begley Jr.. The story: An engineer
  returns to New York from Africa, where his company''s dam project has angered local tribesmen. He scoffs at his
  wife''s protective charms, but on his walk home through the city at night, signs of the jungle begin closing in.'

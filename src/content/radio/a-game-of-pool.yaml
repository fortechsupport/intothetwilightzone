description: 'A full-cast audio remake of “A Game of Pool” from the original 1959 series (season 3, 1961), written for
  television by George Clayton Johnson. Adapted for radio by Dennis Etchison, starring Wade Williams. The story: A brilliant
  pool hustler is haunted by comparisons to a legendary champion who died years earlier. Alone in the hall one night,
  he wishes aloud for a chance to beat the master, and the late champion arrives to accept a game with very high stakes.'

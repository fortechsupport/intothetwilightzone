description: 'A full-cast audio remake of “The Mind and the Matter” from the original 1959 series (season 2, 1961), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Hal Sparks. The story: Archibald Beechcroft,
  a clerk who despises crowds and people in general, learns a technique for controlling reality with concentration. He
  sets out to remake the world to his liking, beginning by making everyone else disappear.'

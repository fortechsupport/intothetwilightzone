description: 'A full-cast audio remake of “Still Valley” from the original 1959 series (season 3, 1961), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Adam West. The story: A Confederate
  scout enters a valley town to find Union soldiers frozen in place like statues. An old man explains he has done
  it with witchcraft and offers the scout a book of spells that could turn the tide of the war, for a price.'

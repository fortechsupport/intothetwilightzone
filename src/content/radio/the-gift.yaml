description: 'A full-cast audio remake of “The Gift” from the original 1959 series (season 3, 1962), written for
  television by Rod Serling. Adapted for radio by Dennis Etchison, starring Danny Goldring. The story: A wounded
  stranger from a crashed craft takes refuge in a Mexican border village. Only a young boy and a doctor show him
  kindness, while frightened villagers and police grow convinced he means them harm despite the gift he carries.'

description: 'A full-cast audio remake of “Passage on the Lady Anne” from the original 1959 series (season 4, 1963),
  written for television by Charles Beaumont. Adapted for radio by Dennis Etchison, starring Martin Jarvis and Rosalind
  Ayres. The story: An unhappily married couple book passage to England on the Lady Anne, an old ocean liner on her final
  voyage. They find the ship full of elderly passengers who strongly object to them being on board.'

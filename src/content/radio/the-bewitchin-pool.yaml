description: 'A full-cast audio remake of “The Bewitchin'' Pool” from the original 1959 series (season 5, 1964),
  written for television by Earl Hamner, Jr.. Adapted for radio by Dennis Etchison, starring Karen Black. The story:
  Sport and Jeb, children of wealthy parents locked in a bitter divorce, find that their backyard swimming pool
  leads to a secret rural haven run by kindly Aunt T, where children are loved.'

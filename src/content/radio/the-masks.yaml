  by Rod Serling. Adapted for radio by Dennis Etchison, starring Stan Freberg. The story: On Mardi Gras night, dying
  millionaire Jason Foster gathers his greedy daughter''s family and insists that they wear grotesque masks he has chosen
  until midnight, as a condition of inheriting his fortune.'

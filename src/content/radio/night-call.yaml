description: 'A full-cast audio remake of “Night Call” from the original 1959 series (season 5, 1964), written for
  television by Richard Matheson. Adapted for radio by Dennis Etchison, starring Mariette Hartley. The story: Elva
  Keene, an elderly invalid living alone, begins receiving late-night phone calls of moans and static that soon
  turn into a faint voice. The phone company traces the source to a fallen line, but the calls continue.'

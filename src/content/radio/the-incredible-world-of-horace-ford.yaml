description: 'A full-cast audio remake of “The Incredible World of Horace Ford” from the original 1959 series (season
  4, 1963), written for television by Reginald Rose. Adapted for radio by Dennis Etchison, starring Mike Starr.
  The story: Horace Ford, a toy designer approaching middle age, keeps reminiscing about his perfect boyhood on
  Randolph Street. When he goes back to the old neighborhood, he finds it exactly the same as he left it.'

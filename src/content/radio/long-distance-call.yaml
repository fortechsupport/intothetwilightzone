description: 'A full-cast audio remake of “Long Distance Call” from the original 1959 series (season 2, 1961), written
  for television by Charles Beaumont and William Idelson. Adapted for radio by Dennis Etchison, starring Hal Sparks.
  The story: Young Billy gets a toy telephone for his birthday from the grandmother who adores him. After she dies, he
  keeps talking to her on it, and his parents grow frightened by what the voice on the line seems to want.'

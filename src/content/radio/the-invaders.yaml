description: 'A full-cast audio remake of “The Invaders” from the original 1959 series (season 2, 1961), written for
  television by Richard Matheson. Adapted for radio by Barry Rickard, starring Kathy Garver. The story: A woman living
  alone in a primitive farmhouse hears something land on her roof. She soon finds tiny, armed invaders in her home and
  must fight them off in an almost wordless battle for survival.'

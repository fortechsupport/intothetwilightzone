description: 'Full-cast audio remakes of the original 1959-64 teleplays, produced and directed by Carl Amari for Falcon
  Picture Group under license from CBS and the Rod Serling estate, with sound work by JoBe Cerny in Chicago. Stacy Keach
  takes over Serling''s narrations and each story stars a different film or TV actor. 176 episodes were made from 2002
  to 2012: 155 of the 156 TV episodes (all but "Come Wander with Me"), "The Time Element", unmade TV scripts such as
  Charles Beaumont''s "Gentlemen, Be Seated" and Jerry Sohl''s "Who Am I?", and, from volume 16, sixteen stories written
  for radio. It aired on about 200 US stations, XM and Sirius satellite radio and BBC Radio 4 Extra, and came out on
  cassette, CD volumes of ten (to volume 13 in 2008) and downloads. Wikipedia lists 81 of the adaptations as extras on
  the 2010-11 Blu-ray sets of the original series, and 30 on the DVD sets. When the series was announced in 2002, Radio
  World reported that Falcon had licensed it from CBS Enterprises, that Dick Brescia Associates syndicated it to
  commercial stations and the American Forces Radio and Television Service, that it used the original Twilight Zone
  scores for its theme and background music with sound effects from The Hollywood Edge, and that Richard Wolski was
  series producer. In February 2016 io9 reported that BBC Radio 4 Extra would begin broadcasting it that March. The publisher''s
  OverDrive listing names a "Gold Marcum Award for Best Radio Drama Series of 2006" and an "XM Radio Nation Award", and
  a June 2008 post on the series'' blog announced an Audie Award for "the best audio adapted from another medium".'

description: Full-cast audio remakes of the original 1959-64 teleplays, produced and directed by Carl Amari's Falcon
  Picture Group under licence from CBS and the Rod Serling estate. Stacy Keach takes the Serling host role, and
  each story stars a different film or TV actor; 176 episodes were made between 2002 and 2012, covering every original
  episode except "Come Wander with Me".

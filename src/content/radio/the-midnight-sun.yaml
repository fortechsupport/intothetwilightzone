description: 'A full-cast audio remake of “The Midnight Sun” from the original 1959 series (season 3, 1961), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Kim Fields. The story: Earth''s
  orbit has shifted toward the sun, and New York swelters in endless, rising heat. With water scarce and the city
  emptying, a young painter and her older neighbor stay behind in their apartment building, trying to survive each
  scorching day.'

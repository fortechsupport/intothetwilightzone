title: The Zero Hour
series_title: The Zero Hour (Hollywood Radio Theater)
voiced_by:
- Rod Serling
description: A radio suspense anthology hosted by Rod Serling, who did not write its stories. It began in
  syndication on 3 September 1973, was picked up by the Mutual Broadcasting System that December, and ended on 26
  July 1974. The first season told one story in five parts each week, Monday to Friday; in 1974 each half-hour told a
  whole story, with stars including Mel Torme, Jackie Cooper, Dick Sargent and William Shatner. Elliott Lewis, the
  former Suspense director, directed, and J. M. Kholos produced; counting each part, there were 130 episodes.
  Highbridge Audio later released six of the five-part stories on cassette. Episodes also circulate in rebroadcast
  podcast feeds, some of them labelled with the Twilight Zone name.

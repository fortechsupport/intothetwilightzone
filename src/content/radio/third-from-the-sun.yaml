description: 'A full-cast audio remake of “Third from the Sun” from the original 1959 series (season 1, 1960), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Fred Willard. The story: With a
  war of total destruction only days away, weapons scientist William Sturka and test pilot Jerry Riden plot to steal
  an experimental spacecraft and flee with their families to a distant world.'

description: 'A full-cast audio remake of “The Fever” from the original 1959 series (season 1, 1960), written for
  television by Rod Serling. Adapted for radio by Dennis Etchison, starring Stacy Keach and Kathy Garver. The story:
  Franklin Gibbs, a tightfisted man who scorns gambling, wins a trip to Las Vegas with his wife. One pull of a slot
  machine sparks an obsession, and soon the machine itself seems to be calling his name.'

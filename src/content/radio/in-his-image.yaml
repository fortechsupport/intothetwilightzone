description: 'A full-cast audio remake of “In His Image” from the original 1959 series (season 4, 1963), written for
  television by Charles Beaumont. Adapted for radio by Dennis Etchison, starring John Heard. The story: Alan Talbot brings
  his new fiancée home to Coeurville, but the town does not match his memories and he is troubled by violent urges and
  gaps in his past. He sets out to discover who he really is.'

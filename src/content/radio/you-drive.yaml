description: 'A full-cast audio remake of “You Drive” from the original 1959 series (season 5, 1964), written for
  television by Earl Hamner, Jr.. Adapted for radio by Dennis Etchison, starring John Heard. The story: Office manager
  Oliver Pope strikes a boy on a bicycle and flees the scene, then lets another man take the blame. His own car,
  however, begins behaving as though it has a conscience of its own.'

description: 'A full-cast audio remake of “Miniature” from the original 1959 series (season 4, 1963), written for
  television by Charles Beaumont. Adapted for radio by Dennis Etchison, starring Lou Diamond Phillips. The story:
  Charley Parkes, a shy misfit who lives with his mother, wanders into a museum and becomes captivated by a dollhouse.
  He insists that the tiny woman inside it is alive, and his family begins to fear for his sanity.'

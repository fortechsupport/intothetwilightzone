description: 'A full-cast audio remake of “The Big Tall Wish” from the original 1959 series (season 1, 1960), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Blair Underwood. The story: Bolie Jackson,
  an aging boxer, is heading into what may be his last fight. His young neighbor Henry believes that a big enough wish
  can change anything, and he wants Bolie to believe it too.'

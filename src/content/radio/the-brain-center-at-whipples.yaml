description: 'A full-cast audio remake of “The Brain Center at Whipple''s” from the original 1959 series (season 5, 1964),
  written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Stan Freberg. The story: Factory
  owner Wallace V. Whipple replaces his workers, one department after another, with a massive automated machine in the
  name of efficiency, dismissing the pleas of his plant manager and the men he lays off.'

description: 'A full-cast audio remake of “The Rip Van Winkle Caper” from the original 1959 series (season 2, 1961),
  written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Tim Kazurinsky. The story: Four
  men steal a fortune in gold bars and hide in a desert cave, where they put themselves into suspended animation for
  a century so that the theft will be forgotten.'

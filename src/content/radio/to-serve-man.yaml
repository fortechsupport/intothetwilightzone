description: 'A full-cast audio remake of “To Serve Man” from the original 1959 series (season 3, 1962), written for
  television by Rod Serling. Adapted for radio by Dennis Etchison, starring Blair Underwood. The story: Towering aliens
  called the Kanamits land on Earth offering cheap power, abundant food and an end to war. A government codebreaker and
  her colleague work on translating a book the visitors left behind, while humanity welcomes its new friends.'

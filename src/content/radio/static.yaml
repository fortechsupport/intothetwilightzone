description: 'A full-cast audio remake of “Static” from the original 1959 series (season 2, 1961), written for television
  by Charles Beaumont. Adapted for radio by Dennis Etchison, starring Stan Freberg. The story: Ed Lindsay, a grouchy
  bachelor in a boarding house, hates the television everyone else watches. He digs his old radio out of the basement,
  and it begins playing programs from decades earlier that only he can hear.'

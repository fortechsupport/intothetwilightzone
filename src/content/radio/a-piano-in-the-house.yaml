description: 'A full-cast audio remake of “A Piano in the House” from the original 1959 series (season 3, 1962),
  written for television by Earl Hamner, Jr.. Adapted for radio by Dennis Etchison, starring Michael York. The story:
  A cruel theater critic buys an old player piano as a birthday gift for his young wife. He discovers that its tunes
  make anyone who hears them reveal their true nature, and he plans to use it to humiliate his guests.'

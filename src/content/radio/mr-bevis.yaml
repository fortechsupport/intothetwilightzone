description: 'A full-cast audio remake of “Mr. Bevis” from the original 1959 series (season 1, 1960), written for
  television by Rod Serling. Adapted for radio by Dennis Etchison, starring Bruno Kirby. The story: Lovable eccentric
  James B. W. Bevis loses his job, his car, and his apartment in a single morning. His guardian angel offers to
  straighten out his life, but the improvements come at the cost of who he is.'

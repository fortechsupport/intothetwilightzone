description: 'A full-cast audio remake of “Where Is Everybody?” from the original 1959 series (season 1, 1959), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring John Schneider. The story: A man in an
  Air Force-style jumpsuit wanders into a small town with no memory of who he is. Coffee is still warm, a jukebox plays,
  and a cigar smolders, yet he cannot find a single living person anywhere.'

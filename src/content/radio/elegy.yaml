description: 'A full-cast audio remake of “Elegy” from the original 1959 series (season 1, 1960), written for television
  by Charles Beaumont. Adapted for radio by Dennis Etchison, starring Blair Underwood. The story: Three astronauts, low
  on fuel in the far future, land on an asteroid that looks exactly like mid-20th-century Earth. They find people frozen
  in place everywhere, and one courteous caretaker who can explain.'

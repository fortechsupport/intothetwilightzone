description: 'A full-cast audio remake of “The Man in the Bottle” from the original 1959 series (season 2, 1960),
  written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Ed Begley Jr.. The story:
  A struggling antique dealer and his wife break an old bottle a customer brings in, freeing a genie who offers
  them four wishes. The couple soon learn that every wish comes with a catch they did not think to guard against.'

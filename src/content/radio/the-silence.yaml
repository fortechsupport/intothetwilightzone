description: 'A full-cast audio remake of “The Silence” from the original 1959 series (season 2, 1961), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Christopher McDonald. The story:
  At a gentlemen''s club, wealthy Colonel Taylor, fed up with a chattering member, offers him half a million dollars
  if he can stay completely silent for a full year while living in a glass room under watch.'

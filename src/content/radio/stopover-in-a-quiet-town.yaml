description: 'A full-cast audio remake of “Stopover in a Quiet Town” from the original 1959 series (season 5, 1964),
  written for television by Earl Hamner, Jr.. Adapted for radio by Dennis Etchison, starring Stephnie Weir. The
  story: After a night of drinking, Bob and Millie Frazier wake in a strange house in a town they don''t recognize.
  Every house, tree and object turns out to be fake, the place is deserted, and a child''s laughter echoes nearby.'

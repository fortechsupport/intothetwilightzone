description: 'A full-cast audio remake of “The Hunt” from the original 1959 series (season 3, 1962), written for
  television by Earl Hamner, Jr.. Adapted for radio by Dennis Etchison, starring Shelley Berman and Karen Black.
  The story: An old mountain man goes raccoon hunting with his beloved hound, and the two tumble into a pond. The
  next morning they walk home to find his wife and neighbors behaving strangely, and a mysterious road leads toward
  a gate.'

description: 'A full-cast audio remake of “Kick the Can” from the original 1959 series (season 3, 1962), written
  for television by George Clayton Johnson. Adapted for radio by Dennis Etchison, starring Shelley Berman and Stan
  Freberg. The story: At a retirement home, a lonely resident becomes convinced that the secret to youth lies in
  the games children play. He tries to coax his fellow residents into a nighttime game of kick the can while a skeptical
  old friend resists.'

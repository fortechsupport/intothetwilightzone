description: 'A radio version of Rod Serling''s 1955 NBC Matinee Theater play "O''Toole from Moscow", which was broadcast
  only once and is set around the Cincinnati Reds. WVXU and the University of Cincinnati College-Conservatory of Music
  (CCM) made it: adapted and produced by WVXU''s John Kiesewetter, directed by CCM professor Richard Hess, with eight
  CCM acting students and Serling''s daughter Anne Serling as announcer and narrator. Sammi Grant coached dialect, Reds
  organist John Schutte played the ballpark organ music, and WVXU producer Josh Elstro edited it and added the sound
  effects and music. Kiesewetter writes that Anne Serling "gave us her blessing to our project". It aired on WVXU (91.7
  FM) and WMUB on 25 March 2020 and is streamed on demand by WVXU and as a podcast.'

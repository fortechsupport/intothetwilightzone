description: 'A full-cast audio remake of “A Thing About Machines” from the original 1959 series (season 2, 1960), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Mike Starr. The story: Bartlett Finchley,
  a fussy, sharp-tongued writer, treats every appliance in his home with contempt and keeps breaking them in fits of
  temper. He becomes convinced the machines resent him and are quietly plotting to drive him out.'

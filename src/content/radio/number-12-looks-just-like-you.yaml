description: 'A full-cast audio remake of “Number 12 Looks Just Like You” from the original 1959 series (season 5, 1964),
  written for television by John Tomerlin. Adapted for radio by Dennis Etchison, starring Bonnie Somerville and Charles
  Shaughnessy. The story: In a future society where everyone undergoes a ''Transformation'' at nineteen to take on one
  of a few perfect, approved faces and bodies, young Marilyn resists, wanting to remain herself despite pressure from
  everyone she loves.'

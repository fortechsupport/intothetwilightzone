description: 'A full-cast audio remake of “The Last Rites of Jeff Myrtlebank” from the original 1959 series (season
  3, 1962), written for television by Montgomery Pittman. Adapted for radio by Dennis Etchison, starring Robert
  Knepper. The story: In a 1920s Southern town, a young man sits up in his coffin at his own funeral. He seems healthy
  and even more capable than before, but the superstitious townsfolk begin to wonder whether something else came
  back in his place.'

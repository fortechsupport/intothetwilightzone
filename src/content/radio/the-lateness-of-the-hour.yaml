description: 'A full-cast audio remake of “The Lateness of the Hour” from the original 1959 series (season 2, 1960),
  written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Jane Seymour and James Keach.
  The story: Jana lives in a secluded house where her inventor father has built robot servants to meet every need. Growing
  restless in the comfortable, unchanging routine, she demands that he get rid of the machines so the family can live
  a real life.'

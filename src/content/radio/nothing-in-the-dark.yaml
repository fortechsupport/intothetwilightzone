description: 'A full-cast audio remake of “Nothing in the Dark” from the original 1959 series (season 3, 1962),
  written for television by George Clayton Johnson. Adapted for radio by Dennis Etchison, starring Marshall Allman.
  The story: An elderly woman has barricaded herself for years in a basement apartment, convinced that Death will
  take her at the first touch of a stranger. When a wounded young policeman collapses outside her door, she must
  decide whether to let him in.'

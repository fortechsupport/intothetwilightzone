description: 'A full-cast audio remake of “Deaths-Head Revisited” from the original 1959 series (season 3, 1961), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring H. M. Wynant. The story: A former SS
  officer returns under an assumed name to tour the ruins of the Dachau concentration camp, where he once held command.
  Nostalgic rather than remorseful, he is surprised to meet a figure from the camp''s past waiting for him.'

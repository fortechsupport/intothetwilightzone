description: 'A full-cast audio remake of “The Mighty Casey” from the original 1959 series (season 1, 1960), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Paul Dooley. The story: The hapless Hoboken
  Zephyrs, the worst team in baseball, get an unusual tryout: a pitcher named Casey with an unbeatable arm and no emotions.
  Manager Mouth McGarry sees a pennant in his future.'

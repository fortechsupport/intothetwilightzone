description: 'A full-cast audio remake of “The Odyssey of Flight 33” from the original 1959 series (season 2, 1961),
  written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Daniel J. Travanti. The story:
  A Global Airlines jet crossing the Atlantic to New York hits a mysterious tailwind and gains impossible speed. When
  the crew drops below the clouds to find Idlewild Airport, the city below does not look as they expect.'

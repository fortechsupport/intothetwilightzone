description: 'A full-cast audio remake of “The Trouble with Templeton” from the original 1959 series (season 2, 1960),
  written for television by E. Jack Neuman. Adapted for radio by Dennis Etchison, starring Michael York. The story: Booth
  Templeton, an aging stage actor unhappy in his marriage and his new production, still mourns his first wife. Walking
  onto the theater stage, he suddenly finds himself back in 1927 and given a chance to see her again.'

description: 'A full-cast audio remake of “The Thirty-Fathom Grave” from the original 1959 series (season 4, 1963), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Blair Underwood. The story: A Navy destroyer
  on patrol detects a rhythmic tapping from a sunken submarine on the seabed. One petty officer aboard becomes deeply
  disturbed by the sound and by what he believes the wreck has to do with him.'

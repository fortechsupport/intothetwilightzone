description: 'A full-cast audio remake of “The Last Night of a Jockey” from the original 1959 series (season 5, 1963),
  written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Bruno Kirby. The story: Grady,
  a disgraced jockey banned from racing for fixing races, sits alone in his shabby room arguing with his own reflection.
  When his alter ego offers to grant his deepest wish, he asks to be big, with unexpected consequences.'

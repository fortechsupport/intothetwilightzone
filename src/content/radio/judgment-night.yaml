description: 'A full-cast audio remake of “Judgment Night” from the original 1959 series (season 1, 1959), written for
  television by Rod Serling. Adapted for radio by Dennis Etchison, starring Chelcie Ross. The story: In 1942 a German-born
  passenger aboard a British freighter crossing the Atlantic cannot remember how he got there. He is gripped by a sense
  that the ship is in danger and that he knows exactly when it will strike.'

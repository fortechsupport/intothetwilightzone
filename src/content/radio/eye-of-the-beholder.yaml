description: 'A full-cast audio remake of “Eye of the Beholder” from the original 1959 series (season 2, 1960), written
  for television by Rod Serling. Adapted for radio by Barry Rickard, starring Virginia Williams. The story: Janet Tyler
  lies in a hospital bed, her face wrapped in bandages after her latest treatment to correct her appearance. Doctors
  and nurses whose faces stay in shadow wait to learn whether the procedure has finally made her look normal.'

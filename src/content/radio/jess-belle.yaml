description: 'A full-cast audio remake of “Jess-Belle” from the original 1959 series (season 4, 1963), written for television
  by Earl Hamner, Jr.. Adapted for radio by Dennis Etchison, starring Stephnie Weir. The story: In the Blue Ridge Mountains,
  Jess-Belle loves Billy-Ben Turner, who is engaged to another woman. She turns to the local witch for a love charm,
  and the bargain carries a price she did not foresee.'

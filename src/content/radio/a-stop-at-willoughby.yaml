description: 'A full-cast audio remake of “A Stop at Willoughby” from the original 1959 series (season 1, 1960), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Chelcie Ross. The story: Gart Williams,
  an exhausted Madison Avenue executive, dozes off on his commuter train and wakes to find it pulled into Willoughby,
  a sunny 1888 village where life moves at a gentle pace.'

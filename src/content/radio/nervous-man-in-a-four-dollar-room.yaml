description: 'A full-cast audio remake of “Nervous Man in a Four Dollar Room” from the original 1959 series (season 2,
  1960), written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Adam Baldwin. The story:
  Jackie Rhoades, a jittery small-time crook, waits in a cheap hotel room for orders to commit a murder for his boss.
  Then his reflection in the mirror starts talking back, and it has firm opinions about the man Jackie has become.'

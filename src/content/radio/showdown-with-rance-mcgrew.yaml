description: 'A full-cast audio remake of “Showdown with Rance McGrew” from the original 1959 series (season 3, 1962),
  written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Christopher McDonald. The story:
  A vain TV cowboy star who refuses to do his own stunts walks off his studio set and into a real Old West saloon. There
  the actual Jesse James is unhappy with how television has been portraying him and his fellow outlaws.'

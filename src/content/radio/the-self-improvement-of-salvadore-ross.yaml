description: 'A full-cast audio remake of “The Self-Improvement of Salvadore Ross” from the original 1959 series (season
  5, 1964), written for television by Jerry McNeely. Adapted for radio by Dennis Etchison, starring Luke Perry. The story:
  Rough-edged Salvadore Ross discovers he can trade personal traits with other people, swapping a broken hand, his youth
  or his poverty. He uses the gift to win the refined woman he loves, whose father is not impressed.'

description: 'A full-cast audio remake of “A Penny for Your Thoughts” from the original 1959 series (season 2, 1961),
  written for television by George Clayton Johnson. Adapted for radio by Dennis Etchison, starring David Eigenberg. The
  story: Hector Poole, a meek bank clerk, flips a coin that lands on its edge and finds he can suddenly hear what everyone
  around him is thinking. The gift complicates his job and his timid feelings for a coworker.'

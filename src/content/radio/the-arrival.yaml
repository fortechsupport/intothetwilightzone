description: 'A full-cast audio remake of “The Arrival” from the original 1959 series (season 3, 1961), written for television
  by Rod Serling. Adapted for radio by Dennis Etchison, starring Blair Underwood. The story: An airliner lands safely
  at its destination with no passengers, no crew and no luggage aboard. A veteran aviation investigator who has never
  failed to crack a case takes on the riddle, but every witness seems to remember the plane differently.'

description: 'A full-cast audio remake of “The Howling Man” from the original 1959 series (season 2, 1960), written for
  television by Charles Beaumont. Adapted for radio by Dennis Etchison, starring Fred Willard. The story: Lost in a storm
  while walking through post-war Europe, an American takes shelter at a remote monastery. In the night he hears howling
  and finds a man locked in a cell, who begs to be released from the strange, stern brothers who hold him.'

description: 'A full-cast audio remake of “The 7th Is Made Up of Phantoms” from the original 1959 series (season
  5, 1963), written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Richard Grieco.
  The story: Three National Guardsmen on modern tank maneuvers near the Little Bighorn battlefield in 1964 begin
  hearing war cries and finding relics. Gradually they seem to be slipping back toward the day of Custer''s last
  stand.'

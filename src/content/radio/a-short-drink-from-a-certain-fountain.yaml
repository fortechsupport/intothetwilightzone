description: 'A full-cast audio remake of “A Short Drink from a Certain Fountain” from the original 1959 series (season
  5, 1963), written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Adam West. The story:
  Harmon Gordon, an aging millionaire married to a much younger, contemptuous wife, begs his doctor brother to inject
  him with an experimental youth serum. The treatment works, though not quite as anyone planned.'

description: 'A full-cast audio remake of “Escape Clause” from the original 1959 series (season 1, 1959), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Mike Starr. The story: Walter Bedeker,
  a hypochondriac terrified of death, accepts a visitor''s offer of immortality in exchange for his soul, with an
  escape clause attached. Freed from fear, he soon finds that endless life grows dull.'

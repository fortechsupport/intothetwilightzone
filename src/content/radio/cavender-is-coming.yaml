description: 'A full-cast audio remake of “Cavender Is Coming” from the original 1959 series (season 3, 1962), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Andrea Evans. The story: A bumbling apprentice
  angel needs one success to earn his wings. He is assigned a clumsy young woman who keeps getting fired, and he sets
  out to improve her life by giving her wealth and social standing.'

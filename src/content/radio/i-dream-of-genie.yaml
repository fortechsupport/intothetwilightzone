description: 'A full-cast audio remake of “I Dream of Genie” from the original 1959 series (season 4, 1963), written
  for television by John Furia, Jr.. Adapted for radio by Dennis Etchison, starring Hal Sparks. The story: Meek
  office worker George P. Hanley buys an old lamp as a gift and releases a genie who grants him one wish. George
  spends a long time imagining what each choice would bring before he decides.'

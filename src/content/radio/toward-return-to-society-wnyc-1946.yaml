title: Toward Return to Society (WNYC, 1946)
series_title: Toward Return to Society
voiced_by:
- Rod Serling
description: A WNYC public-service program made with the New York City Department of Correction, broadcast on 11
  December 1946, in which the young Rod Serling acts the part of a boy who thinks stealing a radio is his ticket to the
  future. Serling was an unpaid intern at the New York City station during his freshman year at Antioch College, with
  newsroom and script-writing duties. The recording survives in the NYC Municipal Archives WNYC Collection, and WNYC
  streams it on its own site.

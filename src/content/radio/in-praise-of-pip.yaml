description: 'A full-cast audio remake of “In Praise of Pip” from the original 1959 series (season 5, 1963), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Fred Willard. The story: Max Phillips,
  a small-time bookie who has neglected his son for years, learns that Pip has been badly wounded in Vietnam. Desperate
  and wounded himself, Max finds himself in an empty amusement park where the boy Pip once was seems to be waiting.'

description: 'A full-cast audio remake of “Nightmare as a Child” from the original 1959 series (season 1, 1960),
  written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Bonnie Somerville. The story:
  Schoolteacher Helen Foley finds a serious little girl waiting in her apartment building who seems to know her
  strangely well. The same day, a man from her past appears, stirring a memory she has long buried.'

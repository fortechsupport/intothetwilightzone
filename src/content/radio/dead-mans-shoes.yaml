description: 'A full-cast audio remake of “Dead Man''s Shoes” from the original 1959 series (season 3, 1962), written
  for television by Charles Beaumont and OCee Ritch. Adapted for radio by Dennis Etchison, starring Bill Smitrovich.
  The story: A homeless drifter takes a pair of expensive shoes from the body of a murdered gangster left in an alley.
  Once he slips them on, his manner changes completely, and the shoes seem to steer him toward unfinished business.'

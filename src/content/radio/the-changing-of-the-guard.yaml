description: 'A full-cast audio remake of “The Changing of the Guard” from the original 1959 series (season 3, 1962),
  written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Orson Bean. The story: An
  elderly teacher at a New England boys'' school is told just before Christmas that he is being retired. Convinced
  his decades of teaching meant nothing, he walks out into the snowy night in despair.'

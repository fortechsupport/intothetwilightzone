description: 'A full-cast audio remake of “The Chaser” from the original 1959 series (season 1, 1960), written for
  television by Robert Presnell Jr.. Adapted for radio by Dennis Etchison, starring Stephen Tobolowsky. The story:
  Roger Shackleforth is desperately in love with a woman who wants nothing to do with him. A mysterious old professor
  sells him a love potion that works perfectly, perhaps too perfectly.'

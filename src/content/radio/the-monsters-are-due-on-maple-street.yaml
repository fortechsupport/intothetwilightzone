description: 'A full-cast audio remake of “The Monsters Are Due on Maple Street” from the original 1959 series (season
  1, 1960), written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Frank John Hughes.
  The story: After a flash streaks across the sky, power and cars die on a quiet suburban street. When a boy suggests
  that invaders may be living among them, neighbors begin to eye one another with suspicion.'

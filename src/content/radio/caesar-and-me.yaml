description: 'A full-cast audio remake of “Caesar and Me” from the original 1959 series (season 5, 1964), written for
  television by Adele T. Strassfield. Adapted for radio by Dennis Etchison, starring Jason Alexander. The story: Jonathan
  West, a struggling Irish ventriloquist out of work and money, is pushed by his wisecracking dummy Caesar into a life
  of petty crime. A spiteful little girl in his boarding house takes a keen interest.'

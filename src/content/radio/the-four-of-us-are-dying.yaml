description: 'A full-cast audio remake of “The Four of Us Are Dying” from the original 1959 series (season 1, 1960),
  written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Eric Bogosian. The story:
  Arch Hammer, a small-time con man, can change his face to look like anyone he concentrates on. He uses the trick
  to borrow the identities of other men, chasing money and a woman through a seedy city.'

description: 'A full-cast audio remake of “The Mirror” from the original 1959 series (season 3, 1961), written for television
  by Rod Serling. Adapted for radio by Dennis Etchison, starring Tony Plana. The story: A victorious revolutionary takes
  over the palace of the dictator he has overthrown. The deposed ruler leaves him a mirror said to reveal the faces of
  would-be assassins, and the new leader soon begins seeing enemies everywhere.'

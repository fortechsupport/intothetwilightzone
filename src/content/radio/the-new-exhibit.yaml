description: 'A full-cast audio remake of “The New Exhibit” from the original 1959 series (season 4, 1963), written for
  television by Charles Beaumont and Jerry Sohl. Adapted for radio by Dennis Etchison, starring JoBe Cerny. The story:
  When a wax museum closes, devoted guide Martin Senescu takes its murderers'' row figures home to his basement. His
  wife and in-laws resent the creepy figures and the cost, and then people begin to die.'

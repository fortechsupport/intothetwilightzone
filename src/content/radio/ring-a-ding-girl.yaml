description: 'A full-cast audio remake of “Ring-a-Ding Girl” from the original 1959 series (season 5, 1963), written
  for television by Earl Hamner, Jr.. Adapted for radio by Dennis Etchison, starring Sarah Wayne Callies. The story:
  Movie star Bunny Blake receives a gift ring from her hometown fan club and sees faces in its stone urging her to come
  home. She arrives unexpectedly on the day of the annual town picnic and insists on staging a show.'

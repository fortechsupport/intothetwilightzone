description: 'A full-cast audio remake of “The Night of the Meek” from the original 1959 series (season 2, 1960),
  written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Christopher McDonald. The
  story: Henry Corwin, a down-on-his-luck department store Santa who drinks, is fired on Christmas Eve. Wandering
  the slum where he lives, he finds a sack that seems able to give people whatever they wish for.'

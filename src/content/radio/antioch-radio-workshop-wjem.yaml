description: In the 1948-49 school year Serling ran Antioch College's radio workshop, and wrote, directed and acted
  in weekly full-scale radio productions broadcast over WJEM in Springfield, Ohio, nearly all of them his own
  originals. He later called them "pretty bad stuff". Martin Grams Jr. also places him at the Ohio stations WJEL
  (Springfield) and WMRN (Marion) in these years. No recordings or titles are named in the source.

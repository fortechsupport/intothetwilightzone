description: 'A full-cast audio remake of “It''s a Good Life” from the original 1959 series (season 3, 1961), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Mike Starr. The story: In an isolated
  Ohio town, every adult lives in constant fear of a six-year-old boy with limitless mental powers. Residents must think
  only happy thoughts and praise whatever he does, because displeasing him has terrible consequences.'

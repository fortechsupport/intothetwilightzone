description: 'A full-cast audio remake of “The Jeopardy Room” from the original 1959 series (season 5, 1964), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Stacy Keach. The story: Major Ivan Kuchenko,
  a Soviet defector hiding in a shabby hotel room, is drugged by a KGB assassin who has rigged a hidden death trap. He
  is given a fixed time to find the trap and escape.'

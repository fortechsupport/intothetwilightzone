description: 'A full-cast audio remake of “Black Leather Jackets” from the original 1959 series (season 5, 1964), written
  for television by Earl Hamner, Jr.. Adapted for radio by Dennis Etchison, starring Marshall Allman. The story: Three
  silent young men in leather jackets move into a suburban house and fill it with strange equipment. One of them, Scott,
  falls for the girl across the street, and begins to doubt the purpose that brought them there.'

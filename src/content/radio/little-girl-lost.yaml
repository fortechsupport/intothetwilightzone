description: 'A full-cast audio remake of “Little Girl Lost” from the original 1959 series (season 3, 1962), written
  for television by Richard Matheson. Adapted for radio by Dennis Etchison, starring Stephen Tobolowsky. The story: Parents
  wake in the night to hear their young daughter crying for help, though she is nowhere to be found in the house. Her
  voice seems to come from beneath her bed, and a physicist friend helps them search for an opening into another dimension.'

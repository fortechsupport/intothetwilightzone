description: 'A full-cast audio remake of “A Hundred Yards Over the Rim” from the original 1959 series (season 2, 1961),
  written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Jim Caviezel. The story: In 1847
  a wagon train is stranded in the New Mexico desert, and leader Chris Horn''s young son is gravely ill. Horn walks over
  a nearby ridge in search of water and comes out somewhere he cannot explain.'

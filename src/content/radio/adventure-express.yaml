title: Adventure Express
original_writer: Rod Serling
series_title: Adventure Express
serling_role: wrote
description: A weekly radio series of train-journey stories about Billy, Betty and their Uncle Jim, broadcast from
  14 October 1950 to 17 February 1951 during Serling's time as a staff writer at WLW in Cincinnati. Serling wrote it,
  and first proposed it as "Conducted Tour Through America". He joined WLW in spring 1950 at $75 a week.

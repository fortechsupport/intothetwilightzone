description: 'A full-cast audio remake of “Long Live Walter Jameson” from the original 1959 series (season 1, 1960),
  written for television by Charles Beaumont. Adapted for radio by Dennis Etchison, starring Lou Diamond Phillips. The
  story: History professor Walter Jameson lectures about the Civil War with uncanny vividness. His fiance''s father,
  a fellow academic, notices that Jameson has not aged a day in all the years he has known him.'

description: 'A full-cast audio remake of “One for the Angels” from the original 1959 series (season 1, 1959), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Ed Begley Jr.. The story: Lou Bookman,
  an aging sidewalk pitchman, learns from a polite visitor that his time is up at midnight. Lou bargains for a reprieve
  so he can deliver one last great sales pitch, a deal that carries unexpected consequences.'

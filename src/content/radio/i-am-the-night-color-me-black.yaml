description: 'A full-cast audio remake of “I Am the Night—Color Me Black” from the original 1959 series (season 5, 1964),
  written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring John Ratzenberger. The story:
  In a small town, a man convicted of killing a bigot is set to be hanged at dawn, but on the day of the execution the
  sun fails to rise. Darkness lingers over the town as residents confront their own hatred.'

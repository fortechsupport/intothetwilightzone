description: 'A full-cast audio remake of “Mirror Image” from the original 1959 series (season 1, 1960), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Morgan Brittany and Frank John Hughes.
  The story: Waiting at a rainy bus station, Millicent Barnes is told by the ticket agent that she has already been
  there several times. Soon she begins to glimpse a woman who looks exactly like her.'

description: 'A full-cast audio remake of “Printer''s Devil” from the original 1959 series (season 4, 1963), written
  for television by Charles Beaumont. Adapted for radio by Dennis Etchison, starring Bobby Slayton. The story: The editor
  of a failing small-town newspaper is about to give up when a strange, cigar-chomping linotype operator offers to work
  for free. Soon the paper prints stories before they happen.'

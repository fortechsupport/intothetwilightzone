description: 'A full-cast audio remake of “Perchance to Dream” from the original 1959 series (season 1, 1959), written
  for television by Charles Beaumont. Adapted for radio by Dennis Etchison, starring Fred Willard. The story: Edward
  Hall, a man with a weak heart, visits a psychiatrist after days without sleep. Each time he dozes off, his dream
  picks up where it left off, drawing him toward an amusement park and a dangerous woman.'

description: 'A full-cast audio remake of “The Little People” from the original 1959 series (season 3, 1962), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Daniel J. Travanti. The story: Two
  astronauts make an emergency landing on a remote world for repairs. One of them discovers a civilization of tiny
  beings in a canyon and, intoxicated by his size compared with theirs, decides to stay behind as their god.'

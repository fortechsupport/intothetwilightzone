description: 'A full-cast audio remake of “Person or Persons Unknown” from the original 1959 series (season 3, 1962),
  written for television by Charles Beaumont. Adapted for radio by Dennis Etchison, starring John Schneider. The
  story: After a night of drinking, a man wakes up and discovers that his wife, his coworkers and even his own mother
  insist they have never met him. Desperate to prove that he exists, he searches for anyone who can confirm who
  he is.'

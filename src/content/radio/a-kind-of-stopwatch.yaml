description: 'A full-cast audio remake of “A Kind of a Stopwatch” from the original 1959 series (season 5, 1963), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Lou Diamond Phillips. The story: Patrick
  McNulty, a tiresome blowhard fired for pestering his boss with suggestions, is given a stopwatch by a stranger at a
  bar. He soon learns it can freeze the world around him, and he begins planning how to profit from it.'

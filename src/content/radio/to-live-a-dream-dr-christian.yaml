title: To Live a Dream
series_title: Dr. Christian
serling_role: wrote
description: Serling's prize-winning entry in the Dr. Christian program's eighth annual script contest. He was named
  a winner on the contest broadcast of 18 May 1949, receiving a $500 award, and the play itself was broadcast on CBS on
  30 November 1949, moved up a week from 7 December by scheduling conflicts. A major rewrite, "The Long Black Night",
  was broadcast on 2 January 1952.

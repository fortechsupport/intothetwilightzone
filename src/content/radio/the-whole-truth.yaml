description: 'A full-cast audio remake of “The Whole Truth” from the original 1959 series (season 2, 1961), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Henry Rollins. The story: Harvey
  Hunnicut, a fast-talking used car salesman, buys a Model A from an old man who warns him that the car is haunted.
  Whoever owns it can say nothing but the truth, which makes selling things rather difficult.'

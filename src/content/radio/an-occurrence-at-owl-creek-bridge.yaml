description: 'A full-cast audio remake of “An Occurrence at Owl Creek Bridge” from the original 1959 series (season 5,
  1964), written for television by Robert Enrico. Adapted for radio by M.J. Elliott, starring Christian Stolte. The story:
  During the American Civil War, Southern planter Peyton Farquhar stands bound on a railroad bridge, about to be hanged
  by Union soldiers. When the rope gives way, he plunges into the river and struggles to get home to his wife.'

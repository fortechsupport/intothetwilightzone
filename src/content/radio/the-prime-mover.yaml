description: 'A full-cast audio remake of “The Prime Mover” from the original 1959 series (season 2, 1961), written
  for television by Charles Beaumont. Adapted for radio by Dennis Etchison, starring David Eigenberg. The story:
  Ace Larsen runs a roadside cafe with his partner Jimbo, who can move objects with his mind. Ace talks Jimbo into
  taking his gift to Las Vegas, where the winnings begin to change Ace.'

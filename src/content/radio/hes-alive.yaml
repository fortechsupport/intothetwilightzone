description: 'A full-cast audio remake of “He''s Alive” from the original 1959 series (season 4, 1963), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Peter Mark Richman and Marshall
  Allman. The story: Peter Vollmer, a young neo-Nazi speaker who draws jeers on New York street corners, is coached
  by a mysterious shadowy mentor. His rhetoric grows more effective and more dangerous with each lesson.'

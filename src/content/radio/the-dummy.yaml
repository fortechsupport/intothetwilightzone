description: 'A full-cast audio remake of “The Dummy” from the original 1959 series (season 3, 1962), written for
  television by Rod Serling. Adapted for radio by Dennis Etchison, starring Bruno Kirby. The story: A heavy-drinking
  nightclub ventriloquist is convinced that his wisecracking dummy, Willie, has a mind of its own. His agent dismisses
  it as nerves, but the performer grows desperate to get free of the puppet before it is too late.'

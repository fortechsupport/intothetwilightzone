description: 'A full-cast audio remake of “A World of Difference” from the original 1959 series (season 1, 1960),
  written for television by Richard Matheson. Adapted for radio by Dennis Etchison, starring Luke Perry. The story:
  Businessman Arthur Curtis picks up his office phone and finds the line dead. A voice shouts "Cut!" and he discovers
  he is standing on a film set, where everyone insists he is an actor named Gerald Raigan.'

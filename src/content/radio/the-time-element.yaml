description: Rod Serling's 1958 Desilu Playhouse play, the unofficial pilot of The Twilight Zone, in which a man
  tells a psychiatrist about a recurring dream of Honolulu on the eve of Pearl Harbor. The radio series adapted
  it as a prequel to the show it led to. Adapted for radio by Dennis Etchison, starring Bobby Slayton.

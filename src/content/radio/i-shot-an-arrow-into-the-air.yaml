description: 'A full-cast audio remake of “I Shot an Arrow into the Air” from the original 1959 series (season 1, 1960),
  written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Chelcie Ross. The story: The
  first manned spacecraft crashes on what appears to be a lifeless asteroid. With water running out, the surviving astronauts
  turn on each other as one man decides he will survive at any cost.'

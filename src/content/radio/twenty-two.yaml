description: 'A full-cast audio remake of “Twenty-Two” from the original 1959 series (season 2, 1961), written for television
  by Rod Serling. Adapted for radio by Dennis Etchison, starring Andrea Evans. The story: Liz Powell, a dancer in the
  hospital for exhaustion, has the same nightmare every night. She walks down to the hospital morgue, room 22, where
  a nurse greets her with a chilling invitation. Her doctor insists it is only a dream.'

description: 'A full-cast audio remake of “The Encounter” from the original 1959 series (season 5, 1964), written for
  television by Martin M. Goldsmith. Adapted for radio by Dennis Etchison, starring Stacy Keach and Byron Mann. The story:
  World War II veteran Fenton invites a young Japanese-American gardener, Arthur Takamori, up to his attic for a beer.
  A samurai sword Fenton brought home from the war stirs tension and guilt between the two men.'

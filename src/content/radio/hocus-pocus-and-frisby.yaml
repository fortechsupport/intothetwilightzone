description: 'A full-cast audio remake of “Hocus-Pocus and Frisby” from the original 1959 series (season 3, 1962),
  written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Shelley Berman. The story:
  A small-town gas station owner is famous for his tall tales, which nobody believes. When a group of visitors from
  another world take his boasts at face value, they decide he would make the perfect specimen to bring home.'

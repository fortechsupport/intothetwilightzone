description: 'A full-cast audio remake of “Young Man''s Fancy” from the original 1959 series (season 3, 1962), written
  for television by Richard Matheson. Adapted for radio by Dennis Etchison, starring Tony Plana. The story: Newlyweds
  return to the husband''s late mother''s house to settle the sale before leaving on their honeymoon. As he lingers among
  her old belongings, the house seems to pull him back toward his boyhood, much to his bride''s alarm.'

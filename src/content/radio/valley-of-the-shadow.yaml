description: 'A full-cast audio remake of “Valley of the Shadow” from the original 1959 series (season 4, 1963),
  written for television by Charles Beaumont. Adapted for radio by Dennis Etchison, starring Chelcie Ross. The story:
  A reporter takes a wrong turn into Peaceful Valley, a quiet small town that hides advanced scientific secrets.
  After he sees something he should not, the townspeople refuse to let him leave.'

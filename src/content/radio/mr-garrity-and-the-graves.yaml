description: 'A full-cast audio remake of “Mr. Garrity and the Graves” from the original 1959 series (season 5,
  1964), written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Christopher McDonald.
  The story: In an Arizona frontier town in 1890, a traveling stranger named Jared Garrity announces he can raise
  the dead from the local cemetery. The townspeople have to decide whether they truly want their departed back.'

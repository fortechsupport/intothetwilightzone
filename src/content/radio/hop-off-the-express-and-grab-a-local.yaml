title: Hop Off the Express and Grab a Local
series_title: Grand Central Station
description: Serling's first script heard on a national network, broadcast on CBS's Grand Central Station on 10
  September 1949, while he was still a student at Antioch. He had titled it "The Local Is a Very Slow Train". His
  second sale to the program, "The Welcome Home", followed on 31 December 1949.

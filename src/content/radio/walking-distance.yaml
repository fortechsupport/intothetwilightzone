description: 'A full-cast audio remake of “Walking Distance” from the original 1959 series (season 1, 1959), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Chelcie Ross. The story: Burned-out advertising
  executive Martin Sloan stops near his hometown and walks back into it on a whim. He finds the town exactly as it was
  in his boyhood summers, including the people he left behind.'

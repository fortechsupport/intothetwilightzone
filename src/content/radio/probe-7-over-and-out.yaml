description: 'A full-cast audio remake of “Probe 7, Over and Out” from the original 1959 series (season 5, 1963), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Louis Gossett Jr.. The story: Colonel
  Adam Cook crash-lands on an unknown planet, his ship wrecked beyond repair and his home world on the brink of war.
  Stranded and injured, he encounters a native woman with whom he shares no language.'

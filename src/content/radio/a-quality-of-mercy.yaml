description: 'A full-cast audio remake of “A Quality of Mercy” from the original 1959 series (season 3, 1961), written
  for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Robert Knepper. The story: In the
  final days of the Pacific war, an eager young lieutenant orders his exhausted platoon to storm a cave held by
  starving Japanese soldiers. Then a sudden shift forces him to see the battle from the other side.'

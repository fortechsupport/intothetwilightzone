description: 'A full-cast audio remake of “People Are Alike All Over” from the original 1959 series (season 1, 1960),
  written for television by Rod Serling. Adapted for radio by Dennis Etchison, starring Blair Underwood. The story:
  Fearful biologist Sam Conrad joins a mission to Mars, hoping humanity is not alone. After a hard landing, he meets
  Martians who are warm, welcoming, and eager to make him feel at home.'

description: 'A full-cast audio remake of “A Nice Place to Visit” from the original 1959 series (season 1, 1960), written
  for television by Charles Beaumont. Adapted for radio by Dennis Etchison, starring Hal Sparks. The story: Small-time
  crook Rocky Valentine is shot fleeing a robbery and wakes to find a genial guide named Pip ready to grant his every
  wish. Money, women, and luck are his, but Rocky starts to wonder why.'

summary: Vivarium is listed in Adam's research as inspired by "Stopover in a Quiet Town".
evidence: Both trap a couple in an artificial suburb built by an unseen captor. Director Lorcan Finnegan names The Twilight
  Zone as a kindred kind of storytelling ("The same with The Twilight Zone, we're talking about stuff with difficult ideas
  and true genre", ScreenAnarchy, 2020) but names no episode. Bleeding Cool says the film plays like a feature-length Twilight
  Zone. The film grew out of Finnegan and Garret Shanley's short Foxes. The tie to "Stopover in a Quiet Town" itself comes
  from fans; no source names it.

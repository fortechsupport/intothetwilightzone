summary: Time Lapse is listed in Adam's research as inspired by "A Most Unusual Camera".
evidence: Both turn on a camera that photographs the future and the greed it provokes. Wikipedia's article says the film
  shares several elements with the episode, without a citation, and CBR (2025) calls it "the 2014 movie that emulated" the
  episode. In interviews with SlashFilm and ScreenAnarchy (2014), director Bradley King and co-writer BP Cooper do not mention
  the episode; SlashFilm's interviewer says the film reminded him of "old-school Twilight Zone episodes". The link is a
  comparison.

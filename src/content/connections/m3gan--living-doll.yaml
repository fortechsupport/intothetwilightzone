summary: An AI companion doll grows dangerously protective of an orphaned girl; writers compare it to Talky Tina.
evidence: RunPee and a Substack compare M3GAN with Talky Tina. Screenwriter Akela Cooper names Magic and Child's Play as
  her killer-doll influences (SYFY Wire), and director Gerard Johnstone's interviews with Collider and GamesRadar (January
  2023) name other films and do not mention Talky Tina or the show. The link is a comparison.

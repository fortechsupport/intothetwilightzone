summary: Strangers trapped in a stalled elevator suspect one of them is the devil; M. Night Shyamalan planned the films
  it began in the vein of The Twilight Zone.
evidence: Film Stories (Mark Harrison, 2024) reports that M. Night Shyamalan wanted the Night Chronicles, the planned trilogy
  Devil was made for, to be "low-budget studio horror movies in the vein of The Twilight Zone and Alfred Hitchcock Presents".
  That is a published report of his intent, not his own words, and it names no episode. Flicks also lists Devil among Twilight
  Zone-style films.

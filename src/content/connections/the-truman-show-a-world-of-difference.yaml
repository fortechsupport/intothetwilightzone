summary: Fans and critics compare The Truman Show with "A World of Difference"; writer Andrew Niccol has denied that a Twilight
  Zone episode inspired it.
evidence: 'Both stories feature a man who discovers that his life is a staged set. Mental Floss (2015) says the screenplay
  "was also compared to" this episode and to the 1980s episode "Special Service". Asked by the BFI in 2018 whether the film
  was inspired by a Twilight Zone episode, writer Andrew Niccol said: "No. Goes to show you can''t believe everything you
  read." The link is a comparison, and the writer denies it.'

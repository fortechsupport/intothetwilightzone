summary: A weatherman relives the same day over and over; MeTV points fans of the film toward the episode about a man trapped
  in a recurring execution dream.
evidence: MeTV recommends "Shadow Play" to Groundhog Day fans, and The Ringer (2017) notes that "Film critics often referenced
  The Twilight Zone when explaining the comedy's plot". Screenwriter Danny Rubin gives no Twilight Zone source in that interview
  or in Big Think's, where he describes the idea as coming from thinking about living forever. The link is a comparison.

summary: The Cobbler is listed in Adam's research as inspired by "Dead Man's Shoes".
evidence: Both feature shoes that turn the wearer into someone else. Director Tom McCarthy describes the idea as "the simple,
  magical idea of walking in somebody else's shoes" (NOW Toronto, 2015) and does not mention The Twilight Zone there or
  in TheWrap's 2014 interview. No source ties the film to the episode.

evidence: 'Checked 2026-11-20: Den of Geek''s review says the film is closer to ''Nightmare at 20,000 Feet'' than
  to Gremlins, but that is the critic''s comparison. In CBR''s interview, director Roseanne Liang traces her gremlin
  to WWII pilot folklore and never mentions Twilight Zone. The interview points the other way: the director credits wartime
  gremlin lore, not Twilight Zone. Consider kind ''reference'' or text along the lines of ''often compared to''.'

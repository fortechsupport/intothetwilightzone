from: films/shadow-in-the-cloud
to: 1959/nightmare-at-20-000-feet
kind: homage
confidence: fan-noted
summary: A WWII flight officer aboard a bomber spots a gremlin damaging the plane and no one believes her, reworking the
  wing-gremlin premise.
evidence: Reviewers, among them Den of Geek, compare the film with "Nightmare at 20,000 Feet". Director Roseanne Liang traces
  her gremlin to Second World War pilot folklore and the Private Snafu cartoons (CBR, 2021). She names The Twilight Zone
  only as a yardstick, telling The Hollywood Reporter she reworked the script so viewers would not think "Ah, I just watched
  a 55-minute episode of The Twilight Zone." No maker's statement ties the gremlin to the episode.

evidence: 'Several outlets note that the sitcom''s first-season twist matches ''A Nice Place to Visit'', where a
  paradise turns out to be the other place. No source found shows that Michael Schur took it from the episode, so
  this is a documented similarity, not documented inspiration. Checked 2026-11-20: Slashfilm''s Michael Boyle compares
  the season 1 twist to ''A Nice Place to Visit'' but says outright that Michael Schur has never claimed the episode
  as inspiration and has pointed to Sartre''s No Exit instead; TVLine likewise only notes the similarity. Critic
  comparison only. Schur''s stated influence is No Exit, so the site text should say ''compared to'', not ''inspired
  by''.'

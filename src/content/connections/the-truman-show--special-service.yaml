summary: Critics compare The Truman Show with "Special Service", in which a man finds he is the star of a live TV show;
  writer Andrew Niccol has denied a Twilight Zone source.
evidence: 'Wikipedia''s article on the 1989 episode says critics noticed its similarity to The Truman Show, citing Don Steinberg
  in The Wall Street Journal (23 September 2011). Mental Floss (2015) says the screenplay "was also compared to" this episode
  and "A World of Difference". Asked by the BFI in 2018 whether the film was inspired by a Twilight Zone episode, writer
  Andrew Niccol said: "No. Goes to show you can''t believe everything you read." The link is a comparison, and the writer
  denies it.'

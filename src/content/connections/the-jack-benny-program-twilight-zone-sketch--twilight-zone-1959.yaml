evidence: 'Slashfilm describes the January 15, 1963 episode: Serling plays himself, then plays ''Mayor Twilight
  Zone'' in a fog-bound sketch where Rochester doesn''t know Benny, and he closes with a joke about Benny''s perpetual
  age of 39. It says CBS used the appearance to promote the show''s return that month.'

summary: The Scary Door anthology makes another appearance in this feature-length Futurama story.
evidence: Futurama writer J. Stewart Burns told SYFY Wire that The Scary Door began as a tip of the hat to The Twilight
  Zone, so the parody itself is confirmed by its makers. That article does not mention Bender's Game, and the film's Wikipedia
  article does not mention The Twilight Zone, so a Scary Door appearance in this film rests on the fan-run Twilight Zone
  Wiki alone.

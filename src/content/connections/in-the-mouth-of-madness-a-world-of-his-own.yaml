summary: In The Mouth of Madness is listed in Adam's research as inspired by "A World of His Own".
evidence: Both turn on an author whose fiction becomes real. TopTenz (2013) lists the film as a rip-off of the episode.
  Film Threat's 1995 interview with John Carpenter and Inverse's 2025 oral history name Lovecraft and other films as touchstones
  and never mention The Twilight Zone. The link is a comparison.

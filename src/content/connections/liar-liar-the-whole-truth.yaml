summary: Liar Liar is listed in Adam's research as inspired by "The Whole Truth".
evidence: 'Both are comedies about a professional liar suddenly unable to lie: a used-car dealer in the episode, a lawyer
  in the film. CBR (2025) says the film "borrows more than a little from" the episode and TopTenz (2013) lists it as a rip-off.
  Screenwriters Paul Guay and Stephen Mazur describe the idea''s origin to SYFY Wire (2022) without mentioning the show.
  The link is a comparison.'

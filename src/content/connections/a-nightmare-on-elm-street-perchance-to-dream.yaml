summary: No reliable source found tying Wes Craven's film to this episode; published accounts of the film's origin point
  to news reports of deaths during nightmares. The premise (a dream figure who can kill the dreamer) does match.
evidence: 'Checked 2026-11-20: Published origin accounts (SlashFilm, The Ringer oral history) credit Craven''s idea to
  news reports of men dying during nightmares; none of the results surfaced mention the Twilight Zone episode. Thematic
  resemblance only; consider downgrading to a ''see also'' note. Checked 2026-11-23: CBR (Robert Vaux, 2025) sees "the
  framework of A Nightmare on Elm Street" in the episode but also says Craven took the idea from a news report, so this
  stays a resemblance.'

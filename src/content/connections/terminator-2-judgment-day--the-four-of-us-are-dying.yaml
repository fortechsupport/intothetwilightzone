summary: Gizmodo reads the shape-shifting T-1000's death throes, cycling through stolen faces, as a nod to the episode about
  a man who can change his face at will.
evidence: The io9/Gizmodo feature (Lauren Davis, 2009) reads the T-1000's death, as it cycles through stolen forms, as a
  nod to "The Four of Us Are Dying". Wikipedia's articles on the T-1000 and on the film's effects trace the character to
  an idea James Cameron dropped from The Terminator and do not mention The Twilight Zone. This is one critic's reading.

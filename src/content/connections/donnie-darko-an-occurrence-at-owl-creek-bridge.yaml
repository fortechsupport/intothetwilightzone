summary: Donnie Darko is listed in Adam's research as inspired by "An Occurrence at Owl Creek Bridge".
evidence: 'No source found tying it to The Twilight Zone episode specifically; the link rests on the idea of a whole
  story happening in the moment before death. Checked 2026-11-20: Accounts of the film''s influences (Dazed''s six inspirations
  piece) name local memories, school reading lists, Gilliam and Weir; none mention Owl Creek Bridge or Twilight Zone.
  Even if Bierce''s story is relevant, Twilight Zone only aired the French short film, so the link to The Twilight Zone
  episode is doubly indirect. Checked 2026-11-23: Gizmodo (2009) says Richard Kelly "has mentioned the episode in interviews"
  but names no interview; finding one would raise this to confirmed.'

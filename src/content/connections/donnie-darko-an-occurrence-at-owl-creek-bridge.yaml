summary: Donnie Darko is listed in Adam's research as inspired by "An Occurrence at Owl Creek Bridge".
evidence: The link rests on a whole story happening in the moment before death. Gizmodo (2009) says Richard Kelly "has mentioned
  the episode in interviews" but names no interview, and none has been found. Dazed's piece on six inspirations behind the
  film (2016) does not mention Bierce's story or the show. The Twilight Zone aired the French short film of Bierce's story,
  so even a confirmed tie to the story would reach the show only through that broadcast.

summary: An astronaut returns from a mission to a mirror-reversed Earth, a premise Gizmodo likens to the season-four episode
  about a pilot who comes home to a subtly altered world.
evidence: Both send an astronaut home to a subtly altered Earth; the film (1969) came six years after the episode (1963).
  Gizmodo (2009) and Wikipedia's episode article note the similar plot. Anderson Entertainment's own 55th-anniversary article
  (Fred McNamara, 2024) says the film would "sit comfortably within the anthology format of The Twilight Zone", but it names
  no episode and quotes no maker on it. The link is a comparison.

summary: Yacht passengers board an empty ocean liner and fall into a looping nightmare; writer-director Christopher Smith
  calls it "that classic Twilight Zone thing of running into yourself."
evidence: 'Writer-director Christopher Smith told Hot Press (2009): "It was that classic Twilight Zone thing of running
  into yourself." Speaking of the time-loop stories he drew on, he added: "I had seen an episode of The Twilight Zone based
  on one of them." He does not name the episode. Flickering Myth also lists the film among Twilight Zone-style movies.'

description: Paul Steadman and Terry watched The Twilight Zone in order and discussed each episode, then carried on through
  the later series, posting a wrap-up of the 2002 UPN series and of their whole Twilight Zone run on 18 September 2026.
  Since October 2026 the feed has moved on to other anthology shows (Eerie, Indiana, Goosebumps, Are You Afraid of the Dark?)
  and began Night Gallery in order in November 2026. Apple lists 400 episodes and the show page 421.

description: Brandon Cruz, with regular and guest co-hosts, watches the original series from the start and talks through
  each episode's characters, themes and ideas. It began in December 2015 and had reached the third season (episodes such
  as "It's a Good Life" and "Once Upon a Time"); Apple lists 94 episodes, the latest in April 2023. Cruz later reviewed
  season 3 as a guest on the Anthology podcast in April 2024.

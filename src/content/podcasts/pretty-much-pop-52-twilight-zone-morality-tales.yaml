first_episode: '2020-07-15'
description: Open Culture's Pretty Much Pop hosts Mark Linsenmayer, Erica Spyres and Brian Hirt, with guest Ken
  Gerber, ask whether the original series still holds up and what makes a good Twilight Zone episode, using "It's
  a Good Life", "The Howling Man", "Nick of Time" and others. They also weigh Jordan Peele's revival ("Replay",
  "Blurryman", "Try, Try", "Ovation") against the original and compare the show to Black Mirror. Posted 15 July
  2020.

description: Matt Hurt, a science-fiction fan who had never watched The Twilight Zone, reviews the original series in broadcast
  order, giving first impressions of each episode. Each review is paired with a spoiler-free look at an episode of Science
  Fiction Theatre (1955), and bonus shows cover Black Mirror, Electric Dreams and the 2019 revival. Published by Obsessive
  Viewer Podcasts; Apple lists 168 episodes, the latest in April 2024, when it had reached season 4.

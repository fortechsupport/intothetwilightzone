description: A fortnightly podcast in which Vieno Savo and Eeri Hietala, both with English degrees, work through the original
  series in order and read it from a queer perspective. They covered season 1 (with a top-three episode and a "perfect episode"
  special in June 2024) and moved into season 2; the latest episode on the show page is number 24, "Lateness of the Nick",
  from 29 August 2024.

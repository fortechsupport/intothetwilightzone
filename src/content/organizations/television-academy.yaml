description: Gives the Primetime Emmy Awards. Serling won Emmys for his Twilight Zone writing in 1960 and 1961 and
  was nominated again in 1962; George T. Clemens won for the show's cinematography in 1961; the series was also
  nominated for drama, art direction and cinematography. The Academy inducted Serling into its Hall of Fame in 1985.

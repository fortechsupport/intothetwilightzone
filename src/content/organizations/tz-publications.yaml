kind: publisher
description: Publisher of Rod Serling's The Twilight Zone Magazine, which ran 60 issues from April 1981 to June
  1989 under license from Carol Serling, and its horror digest Night Cry (11 issues, 1984-1987), plus the 1982 Great
  Stories annual. Editors were T.E.D. Klein (to 1985), Michael Blaine (1985-1986) and Tappan King (1986-1989); every
  issue's contents are listed under Reading > Magazines. Some records name its parent, Montcalm Publishing.

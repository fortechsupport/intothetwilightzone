name: Cayuga Productions
aka:
- Cayuga Productions, Inc.
kind: production-company
description: Rod Serling's production company, which made the original series with CBS. It was named after Cayuga
  Lake in upstate New York, where Serling had a summer home. It co-owned the series with CBS, had its offices at
  MGM, and was effectively wound up after the fifth season, once Serling had sold his interest to CBS.

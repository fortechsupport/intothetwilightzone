name: Cayuga Productions
aka:
- Cayuga Productions, Inc.
kind: production-company
description: >-
  Rod Serling's own production company, which made the original series for CBS. It was named after Cayuga Lake in
  upstate New York, where Serling had a summer home. Serling held a 40% share in the series, which he later sold
  to CBS (Wikipedia). The fan wiki adds that Cayuga had its offices at MGM and was effectively wound up after the
  fifth season.

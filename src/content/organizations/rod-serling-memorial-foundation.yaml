description: A nonprofit in Binghamton, New York, Serling's hometown, devoted to his life and work. It publishes
  a newsletter and a library of articles about Serling and The Twilight Zone (about 25 listed under Reading > Serling
  Foundation papers), runs the rodserling.com awards and biography pages, and supports SerlingFest and the Serling
  statue unveiled in Recreation Park in 2024.

description: The sponsor of Kraft Television Theatre, the live NBC anthology (1947 to 1958) that aired Rod Serling's Patterns in January 1955, the play that made his name, and a second Kraft series on ABC from 1953 to 1955. Kraft sold the series to Talent Associates in 1958.

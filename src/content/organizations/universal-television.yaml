description: The studio that produced Rod Serling's Night Gallery for NBC, and later cut its first two seasons into half-hour episodes for syndication, padded out with episodes of its series The Sixth Sense. Today's company, named in 2004, continues the Universal Television that Revue Studios became in 1963.

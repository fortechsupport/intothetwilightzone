name: Entertainment Earth
kind: other
description: >-
  An online retailer and wholesaler of licensed collectibles, founded in 1995 in the San Fernando Valley of Los Angeles
  by the brothers Aaron and Jason Labowitz, which also designs and makes its own lines. Wikipedia calls it "the
  exclusive distributor of toys manufactured by Bif Bang Pow!", the maker of the Twilight Zone figures and
  bobbleheads it sells. Five product records here name it as publisher; whether it made each one or only sold it is
  not stated in the sources read.

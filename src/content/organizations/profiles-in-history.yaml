name: Profiles in History
kind: auction-house
description: >-
  Hollywood memorabilia auction house. Its Hollywood Auction 89 sold Richard Matheson's annotated "Once Upon a
  Time" script archive on 26 June 2017, and its Icons & Legends of Hollywood auction sold Martin Landau's scripts,
  among them "The Beacon" from the 1985 revival, on 25 September 2019. Both catalogues are hosted on Heritage
  Auctions' site.

description: 'Western Publishing''s comics imprint, which held the Twilight Zone comic license from 1962 to 1982:
  92 issues of new anthology stories introduced by a drawn Rod Serling, with art by Alex Toth, Reed Crandall, Al
  Williamson, Joe Orlando, Frank Miller and others, plus Mystery Comics Digest reprints. Late issues carried the
  Whitman logo, #92 (1982) appeared only as a Whitman book, and Western also made the 1974 Dan Curtis Giveaways
  mini-comic.'

name: Stern Pinball
kind: game-company
description: >-
  A pinball maker, named here as the publisher of two tables with Twilight Zone homages: The Simpsons Pinball Party
  (2003) and Ripley's Believe It or Not! (2004). No Twilight Zone table by Stern is recorded here; the 1993
  Twilight Zone table was Midway's, sold under the Bally name.

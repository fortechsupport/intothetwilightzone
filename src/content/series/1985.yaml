title: The Twilight Zone
years: '1985–1989'
network: CBS, then first-run syndication
host: Charles Aidman (narrator), later Robin Ward
seasons: 3
order: 2
summary: The first revival, made for CBS from September 27, 1985 and continued with a third season for first-run syndication
  in 1988 and 1989, for 65 episodes and 110 stories. Most hours held two or three short tales, mixing new stories, adaptations
  of authors such as Stephen King, Ray Bradbury, Arthur C. Clarke and Harlan Ellison, and a few remakes of the original
  series. Philip DeGuere produced it, Ellison was creative consultant in the first season, and the theme was reworked
  by the Grateful Dead with Merl Saunders. Charles Aidman narrated the CBS seasons and Robin Ward the syndicated one.

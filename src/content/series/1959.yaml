title: The Twilight Zone
years: 1959–1964
network: CBS
host: Rod Serling
seasons: 5
order: 1
summary: Rod Serling's original anthology series, which ran for five seasons on CBS and set the template for everything
  that followed.
locked: true
history:
- date: '1961'
  title: Plagiarism suits over two videotaped episodes
  text: 'Writers who said they had written the stories first sued over two season 2 episodes shot on videotape:
    "Static" (credited to Charles Beaumont) and "Long Distance Call" (Charles Beaumont and William Idelson). Both
    suits were settled. The plaintiffs'' names and the filing dates were not reported.'
  sources:
  - title: 'SlashFilm: The Twilight Zone''s ''Disastrous'' Videotape Episodes Led To Two Separate Lawsuits'
    url: https://www.slashfilm.com/1470469/the-twilight-zone-lawsuits-static-long-distance-call/
- date: '2023'
  title: Ownership and public-domain outlook
  text: The original series was made for CBS, and the rights now sit with Paramount, CBS's parent. Under current
    US copyright terms, the earliest episodes are not expected to enter the public domain until about 2055.
  sources:
  - title: 'Plagiarism Today: Copyright and the Twilight Zone'
    url: https://www.plagiarismtoday.com/2023/10/18/copyright-and-the-twilight-zone/

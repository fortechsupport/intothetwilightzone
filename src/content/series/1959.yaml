title: The Twilight Zone
years: '1959–1964'
network: CBS
host: Rod Serling
seasons: 5
order: 1
summary: Rod Serling's original anthology for CBS, 156 episodes over five seasons from October 2, 1959 to June 19, 1964.
  Each self-contained story drops ordinary people into fantasy, science fiction or horror and usually turns on a moral
  or ironic twist. Serling created it, wrote or adapted 92 of the episodes and narrated every one, with Charles Beaumont
  and Richard Matheson writing most of the rest. Season 4 switched to hour-long episodes before the show returned to
  half an hour for its last season. Its narration, its theme music and its sense of quiet menace in everyday places made
  the title a household phrase.
locked: true
history:
- date: '1961'
  title: Plagiarism suits over two videotaped episodes
  text: 'Writers who said they had written the stories first sued over two season 2 episodes shot on videotape: "Static"
    (credited to Charles Beaumont) and "Long Distance Call" (Charles Beaumont and William Idelson). Both suits were settled.
    The plaintiffs'' names and the filing dates were not reported.'
  sources:
  - title: 'SlashFilm: The Twilight Zone''s ''Disastrous'' Videotape Episodes Led To Two Separate Lawsuits'
    url: https://www.slashfilm.com/1470469/the-twilight-zone-lawsuits-static-long-distance-call/
- date: '2023'
  title: Ownership and public-domain outlook
  text: The original series was made for CBS, and the rights now sit with Paramount, CBS's parent. Under current US copyright
    terms, the earliest episodes are not expected to enter the public domain until about 2055.
  sources:
  - title: 'Plagiarism Today: Copyright and the Twilight Zone'
    url: https://www.plagiarismtoday.com/2023/10/18/copyright-and-the-twilight-zone/
- date: '1958-11-24'
  title: '"The Time Element" airs as a stand-in pilot'
  text: CBS's Westinghouse-Desilu Playhouse broadcast Serling's time-travel script "The Time Element", introduced by
    Desi Arnaz. Its strong response persuaded CBS to commission a pilot for Serling's own series.
  sources:
  - title: Wikipedia - The Time Element
    url: https://en.wikipedia.org/wiki/The_Time_Element
- date: '1959-10-02'
  title: Premiere with "Where Is Everybody?"
  text: The series premiered on CBS on a Friday night with "Where Is Everybody?", Serling's pilot about a man alone in
    an empty town. Cayuga Productions, Serling's company, made the show with CBS, filming mainly at MGM in Culver City.
  sources:
  - title: Wikipedia - The Twilight Zone (1959 TV series)
    url: https://en.wikipedia.org/wiki/The_Twilight_Zone_(1959_TV_series)
- date: '1960-10'
  title: New theme music for season 2
  text: Bernard Herrmann's eerie first-season theme was replaced by the familiar four-note guitar figure built from library
    cues by French composer Marius Constant, which has been used in nearly every version since.
  sources:
  - title: Wikipedia - The Twilight Zone (1959 TV series)
    url: https://en.wikipedia.org/wiki/The_Twilight_Zone_(1959_TV_series)
- date: '1963-01-03'
  title: Season 4 runs as an hour
  text: After CBS briefly dropped the show from its fall schedule, it returned as a midseason replacement with 18 hour-long
    episodes. Producers Herbert Hirschman and then Bert Granet took over from Buck Houghton.
  sources:
  - title: Wikipedia - The Twilight Zone (1959 TV series)
    url: https://en.wikipedia.org/wiki/The_Twilight_Zone_(1959_TV_series)
- date: '1964-06-19'
  title: Last first-run episode
  text: The final new episode, Earl Hamner's "The Bewitchin' Pool", aired at the end of the half-hour fifth season, produced
    by William Froug. The series then began its long life in syndication.
  sources:
  - title: Wikipedia - The Twilight Zone (1959 TV series)
    url: https://en.wikipedia.org/wiki/The_Twilight_Zone_(1959_TV_series)
- date: '1959-03-11'
  title: Fully sponsored before it aired
  text: Variety reported that General Foods had bought the new Serling half-hour for every week of its first 52-week
    season, six months before the premiere and before CBS had given it a time slot.
  sources:
  - title: Variety, March 11, 1959 (Media History Digital Library)
    url: https://lantern.mediahist.org/catalog/variety214-1959-03_0111
- date: '2010-09-14'
  title: Definitive Blu-ray sets with archival extras
  text: Image Entertainment's Blu-ray season sets (September 2010 to August 2011) added isolated scores, new cast interviews,
    Marc Scott Zicree's 1978 audio interviews with the makers, Serling's 1975 Sherwood Oaks lecture, the unaired version
    of the pilot, and Twilight Zone Radio Drama adaptations.
  sources:
  - title: Moviefone (TMDB data) - The Twilight Zone specials list
    url: https://www.moviefone.com/tv-shows/the-twilight-zone/nnUg8MxfZnesGDhxVstb21/seasons/0/

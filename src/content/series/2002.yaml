title: The Twilight Zone
years: '2002–2003'
network: UPN
host: Forest Whitaker
seasons: 1
order: 3
summary: The second revival, one season of 43 stories on UPN from September 18, 2002 to May 21, 2003, hosted by Forest
  Whitaker. UPN usually paired two half-hour stories in an hour on Wednesday nights. Alongside new tales it revisited
  the original with updated remakes and a sequel, "It's Still a Good Life", which brought back Bill Mumy and Cloris Leachman.
  It was produced by Trilogy Entertainment's Pen Densham, Mark Stern and John Watson, with Ira Steven Behr running the
  writers' room.

description: An instrumental album released free on Bandcamp on 9 December 2013, built, its page says, from samples taken
  only from the original series, with recorded drums and bass. S.G. Smitty recorded the drums and worked the samples; Steven
  Keith added bass samples and lent his Twilight Zone DVDs. Its twelve tracks carry episode names (our reading; the page
  lists the titles only), among them "Escape Clause", "The Purple Testament" (as "Purple Testament"), "Shadow Play" (as
  "Shadowplay"), "The Hitch-Hiker" and "The Obsolete Man" (as "Obsolete").

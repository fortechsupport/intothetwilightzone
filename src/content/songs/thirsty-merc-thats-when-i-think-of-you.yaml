title: That’s When I Think of You
artist: Thirsty Merc
tz_connection: lyric-mention
description: Probably a cover of "That's When I Think of You" by the Australian band 1927, from their 1988 album
  ...Ish; the Thirsty Merc recording itself was not found in this pass. The 1927 original uses "twilight zone" in
  its fourth verse as an idiom for a dazed state, with no reference to the show. If Thirsty Merc's version is a
  different song, this connection does not apply.

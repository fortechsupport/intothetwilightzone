description: 'A shared record on Eccentric Pop (catalogue ECP2610, coloured 10-inch vinyl with a CD) whose six songs
  take their titles from Twilight Zone episodes: "Twenty Two", "Where Is Everybody", "Come Wander With Me", "The
  Obsolete Man", "The Howling Man" and "Terror At 20 000 Feet". Which band plays which song, and whether the lyrics
  retell the episodes, is not stated on the page read. The earlier lead "Covert Flops'' Twilight Zone Vol. 1 and 2" may
  be this series; that is not confirmed.'

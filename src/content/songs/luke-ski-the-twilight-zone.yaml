title: The Twilight Zone
artist: the great Luke Ski
album: Needlessly Meta
year: 2015
tz_connection: reference
description: 'A parody of Golden Earring''s "Twilight Zone" about the original 1959 series, released on 13 January 2015
  and included on the album Needlessly Meta. Luke Ski wrote the lyrics and sings; the music is by Sci-Fried, with extra
  organ and the final mix by Jace McClain of Nuclear Bubble Wrap. The lyrics are packed with the show: a spoken Rod Serling
  part, the theme, and characters such as Anthony Fremont, Henry Bemis and Talky Tina, alongside Maple Street and "To Serve
  Man".'

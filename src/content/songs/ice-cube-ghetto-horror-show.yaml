title: Ghetto Horror Show
artist: Mack 10 featuring Jayo Felony and Ice Cube
genre: West Coast hip-hop
tz_connection: lyric-mention
description: A posse cut credited on lyric sites to Mack 10, with verses from Jayo Felony and Ice Cube; the spreadsheet
  listed it under Ice Cube alone. Mack 10's opening verse uses "twilight zone" as a figure of speech for a nightmarish
  state of mind. Neither the show, Rod Serling nor any episode is named, so this is a passing idiom rather than
  a nod to the series.
relevance: tangential
research_confidence: medium

title: Go with the Flow
artist: MF DOOM
genre: Hip-hop
tz_connection: lyric-mention
description: 'An early MF DOOM track, issued as a 12-inch with Sci.Fly and later collected on the Operation: Doomsday
  (Complete) reissue. In the middle verse DOOM names Rod Serling, comparing a fast-writing rhymer to Serling turning
  out scripts at speed. The show is not named, so the nod is to Serling as a famously prolific writer rather than
  to a particular episode.'
relevance: tangential
research_confidence: medium

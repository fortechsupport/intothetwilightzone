description: >-
  An orchestral re-recording of the Manhattan Transfer's 1979 hit, made with the WDR Funkhausorchester, the Cologne
  radio pops orchestra. Like the original, it opens with the Constant theme and then moves into the Jay Graydon/Alan
  Paul song. SecondHandSongs lists it as a separate performance.

description: 'A song about the show from Billy Creepshow''s album Transylvania''s For Suckers, released on Bandcamp on 31
  October 2020. The chorus names the show, and the verses work in a run of episode titles: "Maple Street", "To Serve Man",
  "Mirror Image", "People Are Alike All Over", "The Invaders" and "Eye of the Beholder". Billy Creepshow sings and plays
  guitar, with Jake Eaves on bass and Bryon Myers on drums.'

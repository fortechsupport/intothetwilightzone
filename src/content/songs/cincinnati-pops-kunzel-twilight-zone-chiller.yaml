description: >-
  Telarc's Halloween-themed pops album Chiller, conducted by Erich Kunzel, includes the Twilight Zone theme among
  its spooky film and TV pieces. DeadDisc, the Grateful Dead discography, has a page for the album, which points
  to the arrangement being based on the Dead's 1985 version.

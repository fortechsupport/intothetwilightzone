title: The Twilight Zone Tower of Terror Theme
artist: Richard Bellis
genre: Attraction score
year: 1994
tz_connection: theme
description: >-
  Richard Bellis's music for the pre-show "episode" of the Disney attraction, in which Rod Serling introduces the
  Hollywood Tower Hotel story. Bellis re-recorded the series' original instrumentation for the theme and wrote the
  rest of the music himself. WhoSampled also connects the piece to Herrmann's first-season opening.

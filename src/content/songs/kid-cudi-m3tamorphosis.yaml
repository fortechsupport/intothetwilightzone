description: A track from Playboi Carti's 2020 album Whole Lotta Red with Kid Cudi as the featured guest; the spreadsheet
  credited Cudi alone. The phrase "twilight zone" comes in one of Carti's verses, used to describe feeling cut off
  from the people around him. The nearby Morpheus line points to The Matrix, and nothing in the song refers to the
  series itself.

description: A cover of Golden Earring's "Twilight Zone" (written by George Kooymans) on Seeking Major Tom, William Shatner's
  2011 album for Cleopatra Records. Shatner starred in two episodes of the original series, "Nick of Time" and "Nightmare
  at 20,000 Feet". The MuzText lyric page credits the track to guitarist Warren Haynes, who is among the album's guest musicians.
  Like the original, it borrows the show's name for a hit man's story.

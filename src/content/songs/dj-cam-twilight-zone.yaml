title: Twilight Zone
artist: DJ Cam
genre: Trip hop / abstract hip hop
tz_connection: theme
description: >-
  A track by the French abstract hip-hop and trip-hop producer DJ Cam. It may be from his 1996 debut era (Underground
  Vibes); that is not confirmed. WhoSampled says it samples "Space Control", a Bernard Herrmann cue from the CBS
  library's Outer Space Suite, the stock music used all through the original series.
